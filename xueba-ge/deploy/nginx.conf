# 学霸哥 · nginx 片段（部署必查这一段）
#
# 唯一的坑：proxy_buffering 默认 on，会把 SSE 攒成几坨，流式变成"一顿一顿蹦出一大段"，
# 观感和卡死一样。服务端已经回了 X-Accel-Buffering: no，但 nginx 版本较老时不一定生效，
# 所以这里显式关掉最保险。

server {
    listen 80;
    server_name xueba.example.edu.cn;

    # 前端静态：也可以直接由 FastAPI 挂，交给 nginx 更省事
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 问答：SSE，必须单独一段
    location /api/chat {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;           # ★ 不关这个，流式等于白做
        proxy_cache off;
        proxy_read_timeout 300s;       # LLM 慢慢出字，别让 nginx 先掐
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    client_max_body_size 64k;          # 只发问题文本，用不到大的
}

# 起服务（生产，别用 --reload）：
#   python -m uvicorn backend.app:app --host 127.0.0.1 --port 8010 --workers 2
# 两个 worker = 两份索引常驻，几百 MB 级别，换来"一个人问不会堵住另一个人"。
# 要 50 会话同时在线（总体设计 §17），先按 workers = CPU 核数起，再压。