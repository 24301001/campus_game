<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学霸哥 · 课业辅导</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
</head>
<body>

<!-- 登录态：昵称 + 密码，进不去就聊不了 -->
<div id="gate" class="gate hidden">
  <form id="gateForm" class="card">
    <h1>学霸哥</h1>
    <p class="sub">课业辅导型智能体 · 讲原理 / 给资料 / 一步步推导<br>
      <span class="dim">（能提交代码判分的，去找算法哥）</span></p>
    <label>昵称<input id="nick" maxlength="24" required></label>
    <label>密码<input id="pw" type="password" maxlength="64" required></label>
    <div class="row">
      <button type="submit" class="primary" id="btnLogin">登录</button>
      <button type="button" class="ghost" id="btnReg">注册新号</button>
    </div>
    <p id="gateMsg" class="msg"></p>
    <p class="dim tiny">账号只用来把聊天记录挂在你身上：换设备、关掉重开，历史都还在。</p>
  </form>
</div>

<!-- 聊天态 -->
<div id="app" class="app hidden">
  <aside id="side">
    <div class="brand">学霸哥 <span class="dot" id="dot" title="生成层状态"></span></div>
    <div id="who" class="who"></div>
    <div class="side-btns">
      <button id="btnNew" class="ghost">＋ 新对话</button>
      <button id="btnReload" class="ghost tiny" title="重新拉一次历史会话列表">⟳ 刷新</button>
    </div>
    <div class="sec">课程</div>
    <div id="courses" class="chips"></div>
    <div class="sec">历史 <span id="sessN" class="dim"></span></div>
    <ul id="sessions" class="sessions"></ul>
    <div class="sec">记忆 <span id="memN" class="dim"></span></div>
    <div id="memory" class="memory" title="从这位同学以往的提问里归纳，只用来决定讲多深，不当作资料引用"></div>
    <div class="side-btns">
      <button id="btnMem" class="ghost tiny" title="按现在的历史重新归纳一次画像">⟳ 重新归纳</button>
      <button id="btnMemClear" class="ghost tiny" title="忘掉画像；历史会话一条不动">清空</button>
    </div>
    <div class="foot">
      <div id="stat" class="dim tiny"></div>
      <button id="btnOut" class="ghost">退出</button>
    </div>
  </aside>

  <main>
    <header id="bar">
      <span id="mode" class="dim"></span>
      <span class="spacer"></span>
      <a class="ghost" href="/library" style="text-decoration:none;display:inline-block">资料库</a>
      <button id="btnSide" class="ghost only-mobile">菜单</button>
    </header>

    <div id="log" class="log">
    <div id="empty" class="empty">
      <h2>问我课本上的事</h2>
      <p class="dim">概念、原理、计算题的思路、复习规划。翻到书上有依据的地方我会标出处，点开能看原文。<br>
        下面这几句可以直接点。</p>
    </div>
    </div>

    <!-- galgame 舞台：左边立绘（三张表情轮换），右边是她本人的短台词 + 可以直接点的选项。
         回答正文**不在这儿**，全部在上面 #log 的消息列表里；这里只负责"她在干什么、
         下一步你可以点什么"，长文本一律回到聊天记录里看。 -->
    <section id="stage" class="stage">
      <div class="port">
        <span id="fbub" class="fbub">在呢，问吧</span>
        <img id="face" class="face" src="/static/assets/xbj-calm.jpg" alt="学霸姐立绘">
      </div>
      <div class="dlg-col">
        <!-- 台词条 2026-09-30 从对话框里搬出来做成气泡：尾巴朝左指着立绘，
             下面那个框只剩名字和选项 —— 组长口径："她说的话用气泡显示，不用在选择框上面" -->
        <div class="saybub" id="dlgSay">有什么问题尽管问。</div>
        <div class="dlg">
          <div class="dlg-head">
            <span class="dlg-name" id="dlgName">学霸姐</span>
            <span class="dlg-tag" id="dlgTag"></span>
            <span class="spacer"></span>
            <span class="dlg-stat tiny" id="dlgStat"></span>
          </div>
          <div class="dlg-body">
            <div class="dlg-opts" id="dlgOpts"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 拍照提问：图先变成**能改的文字**再发出去（口径见 backend/vision.py）。
         这条贴在输入框上面：缩略图 + 识别状态 + 两个动作，图只在本地，不上传也不落库。 -->
    <div id="shot" class="shot hidden">
      <img id="shotImg" class="shot-img" alt="题目图片">
      <div class="shot-txt">
        <b id="shotTitle">题目图片</b>
        <span id="shotMeta" class="shot-meta dim tiny">识别中…</span>
      </div>
      <label class="shot-ask tiny" title="默认：识别完直接发出去问（拍完就出答案）。取消勾选＝先把题面填进输入框，你改完数字再发 —— 图糊了、或题里那个数值很关键时用这个">
        <input type="checkbox" id="shotAuto" checked>拍完直接问</label>
      <button type="button" class="ghost tiny" id="btnShotRetry" title="再识别一次（图糊了就重截）">重认</button>
      <button type="button" class="ghost tiny" id="btnShotDrop" title="只去掉图片，输入框里的字不动">去掉</button>
    </div>
    <form id="composer" class="composer">
      <textarea id="q" rows="1" placeholder="比如：洛必达法则的使用条件是什么？（Enter 发送，Shift+Enter 换行；题目截图直接 Ctrl+V 粘进来）"></textarea>
      <button type="button" class="ghost" id="btnShot" title="拍照/截图提问">📷</button>
      <input type="file" id="shotFile" accept="image/*" class="hidden">
      <button type="submit" class="primary" id="btnSend">发送</button>
    </form>
  </main>

  <!-- 引用原文：点正文里的 [n] 角标、或答案下面那行出处，就在屏幕正中开一张小卡片，
       ✕ / Esc / 点卡外面都能关。以前它是 .app 这个 grid 的第三栏，点完是在底下冒出来，
       视线得从回答上挪开；遮罩和卡片复用删除确认那套 .mask/.modal，两个弹窗是一家人。 -->
  <div id="panel" class="mask panel-mask hidden">
    <div class="modal src-card" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head"><b id="panelTitle">引用原文</b>
        <button type="button" id="btnClose" class="ghost" title="关闭（Esc 也可以）">✕</button></div>
      <div id="panelBody" class="panel-body"></div>
    </div>
  </div>

  <!-- 拍照那条气泡上的图点开看大图。壳和上面那张引用卡是一家人（.mask/.modal），
       同样 ✕ / Esc / 点图外面都能关 —— 缩略图看不清题，点开才看得清。 -->
  <div id="pic" class="mask pic-mask hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="picTitle">
      <div class="panel-head"><b id="picTitle">题目图片</b>
        <button type="button" id="btnPicClose" class="ghost" title="关闭（Esc 也可以）">✕</button></div>
      <div class="pic-body"><img id="picImg" alt="题目图片（放大看）"></div>
    </div>
  </div>

<!-- 历史条目的操作：悬停行尾出现 ⋯，点开是这个小菜单（DeepSeek 那套两步走）。 -->
  <div id="itemMenu" class="item-menu hidden">
    <button type="button" id="miDel" class="mi danger"><svg viewBox="0 0 16 16" width="13" height="13"
      aria-hidden="true"><path fill="currentColor" d="M6.3 1.6h3.4l.7.9h2.3v1.4H2.6V2.5h2.3l1.4-.9ZM3.3 5h9.4
        v7.9c0 .5-.4.9-.9.9H4.2c-.5 0-.9-.4-.9-.9V5Zm3 1.5v5.2h1.1V6.5H6.3Zm2.4 0v5.2h1.1V6.5H8.7Z"/></svg>删除会话</button>
  </div>

  <!-- 删除确认：自己画的居中弹窗，不用浏览器原生 confirm() -->
  <div id="mask" class="mask hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
      <h3 id="mdTitle">删除这段会话？</h3>
      <p id="mdBody"></p>
      <div class="md-btns">
        <button type="button" class="ghost" id="mdNo">取消</button>
        <button type="button" class="danger" id="mdYes">删除</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
