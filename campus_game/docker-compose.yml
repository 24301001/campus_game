services:
  # ============================================
  # MySQL 数据库
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Tamako99"
      MYSQL_DATABASE: coding_platform
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"           # 映射到 3307 避免与宿主机 MySQL 冲突
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTamako99"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # Spring Boot 后端
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 覆盖 application.yml 中的数据库连接
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/coding_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Tamako99"
      # 判题工作目录
      JUDGE_WORK_DIR: /tmp/judge
      # 文件上传目录
      FILE_UPLOAD_PATH: /app/uploads
      SPRING_APPLICATION_JSON: '{"file":{"upload-path":"/app/uploads"}}'
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    volumes:
      - uploads-data:/app/uploads

  # ============================================
  # Nginx 前端
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"            # 宿主机 3000 → 容器内 Nginx 80

volumes:
  mysql-data:
  uploads-data:
