services:
  # ============================================
  # MySQL 数据库
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Tamako99"
      MYSQL_DATABASE: coding_platform
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTamako99"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # Spring Boot 后端
  # ============================================
  backend:
    image: mis-backend
    container_name: mis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/coding_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Tamako99"
      JUDGE_WORK_DIR: /tmp/judge
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"

  # ============================================
  # Nginx 前端 - 挂载本地dist
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: mis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql-data:
