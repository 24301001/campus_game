    # 二期换票的服务间共享密钥（任务书 §3.1.3）：8081 拿它去三家 NPC 领票。
    # ⚠️ 只从环境变量读，**不写死在这里** —— 这仓库是公开的。启动器第一次跑会随机
    #    生成并存到仓库根的 .mp_secret（已 gitignore）。没设就是换不到票，
    #    地图 HUD 会照实说「XX 没登进去」，主站登录与刷题不受影响。
    internal-secret: ${CAMPUS_INTERNAL_SECRET:}

judge:
  # 判题临时目录：每次提交在这里新建 run_xxx 子目录，放 Main.java / .class / 可执行文件。
  # ⚠️ 本机实测（2026-10-01）：报 CreateProcess error=5（拒绝访问）与目录路径无关，
  #    改成纯英文路径并不管用（桌面中文路径、C:\coding_judge_tmp、C:\jt 全试过，都失败）。
  #    真正原因是 360 安全卫士的主动防御（libzdtp64.dll）注入了本服务的 JVM，
  #    把「往磁盘写源码 → javac 编译」这一串当成病毒行为拦掉了。
  #    判定依据：① 同一个 java.exe、同样的命令与目录，在普通进程里编译**成功**，
  #              在本服务进程里**失败**；② 360 一关，**同一个未重启的进程**立刻成功。
  #    修法：把 javac.exe / java.exe 和本目录加进「360 → 木马查杀 → 信任区」，
  #          或关闭「主动防御」。与代码无关，不需要改任何 Java 代码。
  work-dir: C:/coding_judge_tmp
  time-limit: 1000
  # Python 解释器路径。留空就行：会在 PATH 和常见安装目录（Anaconda 等）里自动找。
  # 自动找不到时再手动填，例如 C:/ProgramData/anaconda3/python.exe
  python-path:

# 文件上传配置
file:
  upload-path: ./uploads

# 邮件验证配置
email:
  verification:
    # 只允许北京交通大学邮箱
    allowed-domains: [ "bjtu.edu.cn", "bjtu.edu.cn" ]
    # 验证链接过期时间（分钟）
    expiration-minutes: 10
    # 前端验证页面地址
    frontend-url: "http://localhost:3000/verify-email"

# 算法哥（第五个智能体）配置
# base-url 填服务地址即可（工具会自动补 /v1/chat/completions），也可直接填完整的 chat/completions 地址
# 兼容 OpenAI 协议的服务都能用，例如：
#   DeepSeek      https://api.deepseek.com                      模型 deepseek-chat
#   通义千问兼容模式 https://dashscope.aliyuncs.com/compatible-mode  模型 qwen-plus
#   智谱 GLM      https://open.bigmodel.cn/api/paas/v4          模型 glm-4-plus
#   月之暗面       https://api.moonshot.cn                       模型 moonshot-v1-8k
# 留空 api-key 则算法哥只能给出确定性的原始数据，不能开口讲解
agent:
  llm:
    base-url: "https://api.deepseek.com"
    api-key: "sk-4a243abbdece4a3aa4468f64307d6e16"
    model: "deepseek-chat"
    temperature: 0.6
    timeout: 60000
  # 算法哥的「联网」通道（可选）——找类似题时的补充，题库内没挂到同类题才去网上翻。
  # 留空 api-key 就完全不联网，找类似题只用题库里事先挂好的 problem_similar 数据。
  # 默认对接 Serper（https://serper.dev，注册后免费额度够用）：
  #   api-key: 粘 Serper 后台的 key
  # 若换成别家搜索服务，把 endpoint 改成对应地址即可（需返回 {organic:[{title,link,snippet}]}）。
  search:
    api-key: ""
    endpoint: "https://google.serper.dev/search"
    timeout: 8000
