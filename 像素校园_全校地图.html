   ⚠️ 白柱的 `COL_L` 与底色同值（纯白提亮无处可提）—— 只画下/右那条暗边，
      这正合正面图：柱子就是纯白一块，靠压在橙墙上的轮廓分开。
   ⚠️ 太小的块（宽 < 4 或高 < 6）**不描边** —— 6px 见方的附楼小窗描完边只剩中间
      一格，比不描还糊。 */
const JX_K_LIT = { b: 1, c: 1, w: 1, n: 1, t: 1 };
const JX_K_BASE = { b: JX_C.BODY, c: JX_C.COL, g: JX_C.GLASS, n: JX_C.BAND,
                    d: JX_C.DOOR, w: JX_C.WHITE, t: JX_C.BODY };
const JX_K_L = { b: JX_C.BODY_L, c: JX_C.COL_L, w: JX_C.WHITE_L, n: JX_C.BAND_L };
const JX_K_D = { b: JX_C.BODY_D, c: JX_C.COL_D, w: JX_C.WHITE_D, n: JX_C.BAND_D };

function jxBlk(g, r, k, rng) {
  const x = r[0], y = r[1], w = r[2], h = r[3];
  if (w <= 0 || h <= 0) return;
  if (k === "t") {                                   // 附楼坡屋顶：顶点在上的等腰三角
    const ax = x + (w >> 1), ay = y, bx = x + w - 1, by = y + h - 1;
    poly(g, [[ax, ay], [bx, by], [x, by]], JX_C.BODY);
    for (let j = 0; j < h; j++) {                    // 左坡受光、右坡背光
      const t = j / Math.max(1, h - 1);
      px(g, Math.round(ax + (x - ax) * t), y + j, 1, 1, JX_C.BODY_L);
      px(g, Math.round(ax + (bx - ax) * t), y + j, 1, 1, JX_C.BODY_D);
    }
    px(g, x, by, w, 1, JX_C.BODY_D);
    return;
  }
  px(g, x, y, w, h, JX_K_BASE[k]);
  /* 楼体的墙面颗粒：只用**局部** rng —— 碰共享流会重掷全校园散射（60 段 §6.6 那颗地雷） */
  if (k === "b" && w >= 10 && h >= 10) {
    speckle(g, x + 1, y + 1, w - 2, h - 2, "rgba(255,255,255,0.05)", (w * h / 90) | 0, rng);
    speckle(g, x + 1, y + 1, w - 2, h - 2, "rgba(0,0,0,0.06)", (w * h / 130) | 0, rng);
  }
  if (w < 4 || h < 6) return;
  if (JX_K_LIT[k]) {
    px(g, x, y, w, 1, JX_K_L[k]);
    px(g, x, y, 1, h, JX_K_L[k]);
    px(g, x, y + h - 1, w, 1, JX_K_D[k]);
    px(g, x + w - 1, y, 1, h, JX_K_D[k]);
  } else {                                           // 玻璃 / 门：凹口，反相
    px(g, x, y, w, 1, JX_C.GLASS_D);
    px(g, x, y + h - 1, w, 1, JX_C.GLASS_L);
  }
}

/* --- 5.14.5a 柱阵：剔掉那根手误柱，剩下 8 根**严格等距** --------------------
   用户 2026-09-27 第四轮：「柱子之间这次给我严格等距。请完全对照我的ppt进行修改，
   不允许一丝不同，不管是窗户还是柱子」。这两句**不能同时成立** —— ppt 实测柱距
   1.010 / 0.870 / 0.964 / 0.490 / 0.474 / 0.885 / 0.885 / 0.891 in，中间三根挤在
   一起（`_look/_pier_choice.png` ① 就是 ppt 原图）。当场量给用户看之后，用户选的是
   **「甲：剔掉那根手误白条、其余 8 根严格等距」**（同图 ③）。

   一个坐标都不写死，全部从 `JX_EL` 现算：
     ① **手误柱 = 左右两个空档都不到"中位空档"一半的那根。** 表里只有 x=4.7299
        （ppt id11）满足：它的左空档 0.2250、右空档 0.2111，而中位空档是 0.6222。
        它也正是 ppt 原图上"从画面顶边一路下来、到金带前就断"的那根白条
        （文件头坑 ① / `_jxslide.py` 文件头 ②）—— 作者复制柱子留下的多件。
     ② **跨度 = 首柱左沿 → 末柱右沿**（与 ppt 同，两端不扩不缩）。
     ③ **柱宽 = 首柱宽**（表里 9 根同宽，build.py 有闸）。
     ④ **间距取整到整像素**：`pitchPx = round((跨度 − 柱宽) × sc ÷ (根数 − 1))`。
        ⚠️ 这一条专为"**看起来**严格等距"而设：精灵按 sc ≈ 25 px/in 栅格化，
        英寸上等距、像素上仍会 23/24 px 交替（首柱落列 61.00、间距 23.10 px ⇒ 第 6
        根正好落在 .5 上）。取整整像素 ⇒ 8 根柱的落列完全相同、7 个空档一格不差。
        代价：末柱右沿比 ppt 少 0.68 像素（0.027 in），肉眼不可见。
   ⚠️ 只有**画柱**与**柱间玻璃**两处吃这支函数；楼名带/门/右翼/附楼/附楼小窗
      仍逐块照 `JX_EL` 画（它们的 x 与柱距无关）。 */
function jxExample() {
  let bw = 0;
  for (const e of JX_EL) if (e[0] === "g" && e[3] > bw) bw = e[3];
  const body = JX_EL[0];                             // ppt id4 主楼主体（build.py ⑨ 钉住）
  const out = [];
  for (const e of JX_EL) {
    const cx = e[1] + e[3] / 2;
    if (e[0] === "g" && Math.abs(e[3] - bw) < 1e-9 && cx > body[1] && cx < body[1] + body[3])
      out.push(e);
  }
  return out;
}

function jxPiers(G) {
  const ps = [];
  for (const e of JX_EL) if (e[0] === "c") ps.push(e);
  ps.sort(function (a, b) { return a[1] - b[1]; });
  const keep = [];
  if (ps.length >= 4) {                              // 少于 4 根就不猜，原样返回
    const gaps = [];
    for (let i = 1; i < ps.length; i++) gaps.push(ps[i][1] - (ps[i - 1][1] + ps[i - 1][3]));
    const med = gaps.slice().sort(function (a, b) { return a - b; })[gaps.length >> 1];
    for (let i = 0; i < ps.length; i++) {
      const gl = i > 0 ? gaps[i - 1] : Infinity;
      const gr = i + 1 < ps.length ? gaps[i] : Infinity;
      if (gl < med * 0.5 && gr < med * 0.5) continue;   // 被两边挤住 = 手误柱，整根不画
      keep.push(ps[i]);
    }
  } else keep.push.apply(keep, ps);
  const w = keep[0][3], x0 = keep[0][1];
  const last = keep[keep.length - 1], x1 = last[1] + last[3];
  const ppx = Math.round((x1 - x0 - w) * G.sc / (keep.length - 1));   // ④ 整像素间距
  const out = [];
  for (let i = 0; i < keep.length; i++)
    out.push({ x: x0 + i * ppx / G.sc, y: keep[i][2], w: w, h: keep[i][4], src: keep[i] });
  return out;
}

/* 表里每个 `c` → 正则化后的柱（或 null = 这根是手误柱、整根不画）。 */
function jxPierMap(G) {
  const m = new Map();
  for (const e of JX_EL) if (e[0] === "c") m.set(e, null);
  for (const p of jxPiers(G)) m.set(p.src, p);
  return m;
}

/* --- 5.14.6 柱间玻璃：把 ppt 那条玻璃当"例子"铺到每个柱间空档 -----------------
   用户口径（2026-09-27 第二轮）：「我窗户只是给你画了一个例子，意思是其他柱子
   底下也是蓝色窗户，不是只有这一个柱子下边是蓝色窗户」。
   ppt 里主楼**只有一处**玻璃（文件头坑 ④ 有实测），所以这一层是**外推**，
   但**坐标一个都不另写**，全部从 `JX_EL` 现算：

     · 柱阵 = **`jxPierMap` 给的正则化柱阵**（5.14.5a：剔掉手误柱、8 根像素级等距）
       —— 表里 `c` 只有主楼那 9 根（右翼/附楼没有 `c`）；
     · **例子** = 表里**最宽的那族 `g`**，且中心落在主体框（`JX_EL[0]`）内。
       实测选出 ppt idx7~15 那 9 块（x≈2.95、w=0.9681）：右翼窗宽 ≈0.49、
       附楼小窗 0.1347 都窄于它；附楼门廊里那块（id73）**也是 0.9681 宽**，
       但中心 1.3139 落在主体左边（主体 x 从 1.3993 起）⇒ 被"中心在主体框内"滤掉。
     · **一列窗的宽 = 例子留在它那两格空档里的两条可见条的「平均」**（≈0.363 in）。
       这是**唯一**的取数：不按空档比例缩、不写死、不取最大或最小。
     · **每格一扇、宽度全一样、居中**（用户 2026-09-27 第三轮
       「请对照我画的ppt放置窗户，注意柱子之间的间隔要合理，不能看起来很不均匀」）。
       上一版是"窗宽 = 该空档宽 × 0.617"，中间那两条 0.22 in 的窄缝被缩成 3px 细条，
       与旁边 0.38 in 的窗并排 ⇒ 一眼就看出挤。居中则窗两侧留给柱子的白边相等，
       整排看过去才匀（`_look/_glz_choice.png` 第 1 条＝用户挑中的那张）。
     · **放不下的空档不放窗**：判据 `(空档 − 窗宽) × sc < 3` 像素（两侧各留不到
       1.5 像素白边就不放）。第三轮那两条 0.22 in 的窄缝只有 5 像素宽、放不下；
       第四轮柱阵等距之后每格都是 16 像素、窗 10 像素 ⇒ 7 格全放得下，
       这条判据只剩"表被改坏时兜底"的作用。
     · **纵向 9 行照抄例子**（逐行 y/h 原样搬），不自己排间距。
     · ⚠️ **例子那块宽板本身不再照画**（用户 2026-09-27 第四轮把它降为"只当样本"）：
       它 0.9681 宽、横跨两格还压着一根柱，照画的话那两格就成了"宽板 + 中柱"，
       与其余的等宽窗并排 ⇒ 整排又一格一个样。现在它只负责两件事：**行高**
       （逐行 y/h 原样搬）与**窗宽 W**（两条可见条的平均）。表里那 9 条 `g` 仍逐条
       留在 `JX_EL` 里（实测值一份不改），只是 `jxFront` 跳过不画 —— 两处共用
       `jxExample()` 这一个判据。
     · ⚠️ 本层**必须在每一根柱子之前**落笔（见 jxFront 里那句，
       build.py ⑨ 钉住），否则"玻璃在柱子后边"当场反掉。
     · ⚠️ **格1 那扇窗，下半截被附楼压住 —— 这不是画错**（第三轮实测）：
       附楼三角顶（表序 38）与附楼楼体（39）都排在玻璃之后，主楼最左那格窗于是
       只在附楼顶以上露得出来（列 72~80 的蓝实测止于 y=235，下面依次是三角顶 →
       附楼楼体 → 白色横栏 46）。ppt 原图那里本来就没有玻璃，这扇窗是**外推**
       出来的 ⇒ "只露上半截"是这个 z 序下的必然结果。要整扇露出来得动附楼，
       本轮不动（用户点名只改排法）。
     · 本层不吃 RNG（`jxBlk` 只在 k='b' 时掷颗粒）⇒ 全校园散射种子一个数不动。 */
function jxGlaze(g, G, rng, PM) {
  const ex = jxExample();                            // 示例那 9 条（两处共用同一判据）
  if (ex.length < 2) return;
  const ps = [];
  for (const e of JX_EL) { const p = PM.get(e); if (p) ps.push(p); }
  ps.sort(function (a, b) { return a.x - b.x; });
  if (ps.length < 2) return;
  let gx0 = Infinity, gx1 = -Infinity;
  for (const e of ex) {
    if (e[1] < gx0) gx0 = e[1];
    if (e[1] + e[3] > gx1) gx1 = e[1] + e[3];
  }
  /* ① 每个空档跟例子求交。交出来那两条 = **例子自己的可见条**（示例宽板被一根柱子
        切成两截），是"一扇窗该多宽"的唯一样本。 */
  const cells = [];
  for (let i = 0; i + 1 < ps.length; i++) {
    const s0 = ps[i].x + ps[i].w, s1 = ps[i + 1].x;
    cells.push({ s0: s0, s1: s1,
                 got: Math.max(0, Math.min(s1, gx1) - Math.max(s0, gx0)) });
  }
  const ref = cells.filter(function (c) { return c.got > 0; });
  if (!ref.length) return;
  if (ref.length !== 2)                              // 例子横跨的空档数变了
    console.warn("65_jixie: 例子跨了 %d 格空档（应当是 2：一块板 + 中间那根柱）" +
                 " —— 窗宽取的还是这几条的平均，但前提已经变了（见 5.14.6）", ref.length);
  let W = 0;
  for (const c of ref) W += c.got;
  W /= ref.length;                                   // 窗宽 = 示例那两条可见条的平均
  /* ② **7 个空档每格一扇、宽度全一样、居中**（用户 2026-09-27 第三轮挑中的排法，
        第四轮柱阵等距之后每格的空档都是 16 像素、窗 10 像素，7 格全放得下）。
        居中 ⇒ 窗两侧给柱子留的白边相等，整排看过去才匀。
        ⚠️ 第四轮起示例那两格**不再豁免** —— 示例宽板本身不画了（见 5.14.6），
           那两格跟其余五格一样铺等宽窗，整排 7 扇一模一样。 */
  for (const c of cells) {
    if ((c.s1 - c.s0 - W) * G.sc < 3) continue;      // 放不下：两侧各留不到 1.5 像素白边
                                                     // ⚠️ 空档是**英寸**、门槛是**像素**，
                                                     //    必须 ×G.sc —— 第 22 轮就栽在这一格
    const x = (c.s0 + c.s1) / 2 - W / 2;
    for (const e of ex)
      jxBlk(g, G.rect({ x: x, y: e[2], w: W, h: e[4] }), "g", rng);
  }
}

/* --- 5.14.7 立面总装（只在**新画布**上画，不 clearRect） ---------------------
   次序 = `JX_EL` 的顺序 = **ppt 的 z 序** ⇒ 遮挡关系照搬，没有第二张 z 序表。 */
function jxFront(g, G) {
  const rng = makeRng(6517);                         // 局部流，绝不碰共享 RNG
  const PM = jxPierMap(G), EX = jxExample();         // 正则化柱阵 + 示例（两处共用）
  for (let i = 0; i < JX_EL.length; i++) {
    const e = JX_EL[i];
    if (EX.indexOf(e) >= 0) continue;                // 示例宽板只当样本，本身不画（5.14.6）
    if (PM.has(e)) {                                 // 柱：走正则化柱阵（等距）
      const p = PM.get(e);
      if (!p) continue;                              // 手误柱（ppt id11）：整根不画
      jxBlk(g, G.rect({ x: p.x, y: p.y, w: p.w, h: p.h }), e[0], rng);
    } else {
      const r = G.rect({ x: e[1], y: e[2], w: e[3], h: e[4] });
      jxBlk(g, r, e[0], rng);
      if (e[0] === "n") jxPlaque(g, r);              // 楼名带画完就地压黑字
    }
    /* 主体（`JX_EL[0]`，ppt id4）刚落地，**立刻**铺柱间玻璃 —— 必须赶在
       **每一根柱子之前**（第一根柱在 idx1）。晚一格就有 8 根柱子压在玻璃前面，
       "玻璃在柱子后边"当场反掉；而三套自动验收都不看画面。build.py ⑨ 钉这一条。 */
    if (i === 0) jxGlaze(g, G, rng, PM);
  }
  /* 接地带：附楼门廊的两根白立柱比主体低 5.4pt（≈2 行）—— 那是**对的**，
     附楼本来就凸出在主体南边、脚比主体更靠近观者。接地带压住 baseY−2..baseY
     三行，既收住那 2 行、也把整排脚线连成一条。 */
  contactBand(g, G.x0, G.x1, G.baseY - 2, 3, 0.34);
}

/* --- 5.14.8 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是同一张 canvas
      的内容，晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/dxRestyle/
      xgRestyle/kxRestyle/dorm16Restyle/yifuRestyle 同一规矩）。
   ⚠️ 本函数**不碰共享 RNG**（颗粒一律走 jxFront 里的局部 makeRng(6517)）。
   ⚠️ 第三个实参照 58/59/61/62/63 段传 `pal` —— 改色用不上它（正面图的色是 ppt
      给的，见 5.14.2），但**撤屋名牌之后要按 pal.roof 补回那块屋面板面**，
      而 `makeBuilding` 的返回值里没有色号。本段不许再存一份 PALETTE（TDZ，58 段栽过）。
   ⚠️ **立面高 114 行 ≠ styleOf 的 3 层（102 行）** ⇒ 换一张高的画布；只拷旧画布
      顶部 y0+1 行（y0 = 檐口行，+1 是为了把檐口投影线那 2 行的下半行也带上）。
      换画布**不改** `b.w` —— addSolid 用的是世界坐标，与精灵高矮无关。 */
function jixieRestyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const G = jxGeo(c);
  /* ① 撤屋名牌。30 段把牌子挂在**檐口之上**（signRect: y = eaveY − 8 − h），
        所以必须单独擦（与 61 段同一处理）。调 makeSign 只为填 _signCache
        （verify.py 要 / 见契约），拿到矩形就够 —— **不画**。
        补的板面色只求"擦过的地方不是透明洞"。 */
  const sgn = makeSign(JX_NAME);
  if (sgn) {
    const sg = signRect(sgn, G.x0, G.w, G.eaveY);
    const px0 = sg.x - 2, py0 = sg.y - 2, pw = sg.w + 7, ph = sg.h + 7;
    g.clearRect(px0, py0, pw, ph);
    px(g, px0, py0, pw, ph, pal.roof);                 // 平台面（与 30 段屋面同色）
    speckle(g, px0, py0, pw, ph, "rgba(255,255,255,0.05)", 6, makeRng(6518));
    speckle(g, px0, py0, pw, ph, "rgba(0,0,0,0.07)", 5, makeRng(6519));
  }
  /* ② 新画布：旧画布的檐口以上搬过来（同一行） */
  const nc = mkCanvas(c.width, G.H), ng = nc.getContext("2d");
  ng.drawImage(c, 0, 0, c.width, G.y0 + 1, 0, 0, c.width, G.y0 + 1);
  /* ②b 屋面两条口径（用户 2026-09-27 第二十五轮）：
       (a) **灰色** —— 同明度去饱和（色相压掉、亮度一格不动）。pal.roof = #7d6a52
           的亮度是 108.9 ⇒ 中性灰 #6d6d6d 一族。
           ⚠️ 之所以逐像素做、而不换 `makeBuilding` 的 `roof` 入参：屋面是 30 段
              §3.2 的十几层 `shade(roof, k)` 叠出来的，还叠了两轮 speckle；换入参
              要保证每一个分支都跟着灰，就地按亮度去饱和是**一次全中**。
           ⚠️ 扫的范围是 **[0, y0) 整幅**：这一带**只有屋面**（方向性投影四边形的
              顶边落在 y0+158，更靠下；屋名牌擦除后补的那块板面也在这一带之内）。

  b.ay = G.baseY;

  const g = b.canvas.getContext("2d");
  const baseY = b.ay, bw = b.w;                   // ⚠️ b.ay 就是 30 段的 baseY；b.w 已是缩过的宽
  const x0 = 26, x1 = x0 + bw;                    // 墙的左 / 右边缘（canvas 坐标）
  const eaveY = baseY - DL_FLOORS * FLOOR_H;      // 消去 roofT：eaveY = baseY − wallH
  const wh = baseY - eaveY;                       // 墙带高（= 68）
  const PADT = 18, roofT = eaveY - PADT;          // 屋面那一段：30 段是 PADT + roofT = eaveY

  /* --- 0. 撤屋名牌（§九.4）------------------------------------------------------ */
  const sgn = makeSign(name);
  if (sgn) {
    const sg = signRect(sgn, x0, bw, eaveY);
    const px0 = sg.x - 2, py0 = sg.y - 2, pw = sg.w + 7, ph = sg.h + 7;
    g.clearRect(px0, py0, pw, ph);
    px(g, px0, py0, pw, ph, shade(DL_ROOF, -0.04));            // = 30 段屋面"板面"那一层
    for (let j = 1; j <= 3; j++) {                             // 补回被擦断的分坡脊线
      const ry = PADT + Math.round((roofT - 12) * j / 4) + 6;
      if (ry >= py0 && ry < py0 + ph) px(g, px0, ry, pw, 1, "rgba(255,255,255,0.08)");
    }
    /* 斑点**按周围密度补**，不是随手给个数：30 段那两遍是
       `(w/3)` 个白点 + `(w/4)` 个黑点铺在 `w−8 × roofT−12` 上 ⇒ 白 0.68% / 黑 0.51%。
       补丁约 63×35 ⇒ 白 15 / 黑 11。给少了那块屋顶会**比周围干净**（实测
       第一版白 6 / 黑 5 ⇒ 深色点只有 5 个 vs 左右对照组 10 个，虽在 1× 下看不出来，
       但那是一块肉眼可辨的"平滑矩形"的种子）。build.py 有断言钉住这两个数。 */
    speckle(g, px0, py0, pw, ph, "rgba(255,255,255,0.05)", 15, makeRng(6618));
    speckle(g, px0, py0, pw, ph, "rgba(0,0,0,0.07)", 11, makeRng(6619));
  }

  /* --- 1. 复算 30 段 §3.5 的窗列（逐字同一套公式 + 补 x0，见文件头 §四.3） --- */
  const margin = 22;
  const cols = Math.max(1, Math.floor((bw - margin * 2 + WIN_GAP) / (DL_WIN_W + WIN_GAP)));
  const stepX = (bw - margin * 2 - cols * DL_WIN_W) / (cols - 1 || 1);
  const colX = cn => x0 + Math.round(margin + cn * (DL_WIN_W + stepX));

  /* --- 2. 先擦掉墙左缘之外那条旧窗渣 -------------------------------------------
     30 段的窗列公式**没加 x0** ⇒ 最左一列窗画在列 21（`wx − 1`），而墙左缘是
     x0 = 26 ⇒ 墙外挂着一窄条旧窗框。重铺墙是从 x0 起的，**擦不到它**。
     只擦**左侧**：右侧旧窗（最后一列 wx+WIN_W+2 = 328）全在墙内；而右侧 padding
     里有 30 段的落地投影（shadowQuad 右移 SHX），跟着一起擦会削掉楼角影子。
     擦完由第 3 步把 30 段那几根 1px 描边补回来。 */
  g.clearRect(0, eaveY + 1, x0, wh - 1);

  /* --- 3. 重铺整条墙带：白方块瓷砖（不透明，直接盖掉旧墙/旧窗） ---------------- */
  px(g, x0, eaveY + 2, bw, wh - 2, DL_TILE);
  /* 逐块微色差：**每格都取一次 rng**，格子数与位置无关地推进（换楼不改序列） */
  const rr = makeRng(6611);
  for (let ty = eaveY + 2; ty < baseY; ty += DL_TILE_P) {
    for (let tx = x0; tx < x1; tx += DL_TILE_P) {
      const k = rr();
      const tw = Math.min(DL_TILE_P, x1 - tx), th = Math.min(DL_TILE_P, baseY - ty);
      if (k < 0.10) px(g, tx, ty, tw, th, shade(DL_TILE, -0.05));
      else if (k > 0.92) px(g, tx, ty, tw, th, shade(DL_TILE, 0.04));
    }
  }
  for (let ty = eaveY + 2 + DL_TILE_P; ty < baseY; ty += DL_TILE_P)      // 横缝
    px(g, x0, ty, bw, 1, DL_JOINT);
  for (let tx = x0 + DL_TILE_P; tx < x1; tx += DL_TILE_P)                // 竖缝
    px(g, tx, eaveY + 2, 1, wh - 2, DL_JOINT);
  /* 左右棱（照 30 段 §3.3 的受光/背光）+ 整栋外轮廓（照 §3.8） */
  px(g, x0, eaveY + 2, 3, wh - 2, shade(DL_TILE, 0.16));
  px(g, x1 - 4, eaveY + 2, 4, wh - 2, shade(DL_TILE, -0.26));
  px(g, x0 - 1, eaveY + 1, bw + 2, 1, shade(DL_TILE, -0.44));
  px(g, x0 - 1, eaveY + 1, 1, wh + 2, shade(DL_TILE, -0.44));
  px(g, x1, eaveY + 1, 1, wh + 2, shade(DL_TILE, -0.44));

  /* --- 4. 逐层的：棕带（上）→ 窗 → 棕带（下） --------------------------------- */
  const winTop = 7;                               // 窗顶相对层顶（yf）的行号
  const BAND_L = shade(DL_BAND, 0.26), BAND_D = shade(DL_BAND, -0.30);
  const winAt = (wx, wy) => {
    px(g, wx, wy, DL_WIN_W, DL_WIN_H, DL_DARK);                       // 洞口
    px(g, wx + 1, wy + 1, DL_WIN_W - 2, DL_WIN_H - 2, DL_GLASS);      // 玻璃
    px(g, wx + 2, wy + 2, DL_WIN_W - 10, 3, shade(DL_GLASS, 0.30));   // 左上高光
    px(g, wx + 1, wy + DL_WIN_H - 5, DL_WIN_W - 2, 4, shade(DL_GLASS, -0.26)); // 下段背光
    px(g, wx, wy, DL_WIN_W, 1, DL_FRAME);                             // 白框（四边）
    px(g, wx, wy + DL_WIN_H - 1, DL_WIN_W, 1, DL_FRAME);
    px(g, wx, wy, 1, DL_WIN_H, DL_FRAME);
    px(g, wx + DL_WIN_W - 1, wy, 1, DL_WIN_H, DL_FRAME);
    /* 中间白色十字（用户点名）：竖 2px + 横 2px，正落在洞口中点 */
    const cx = wx + ((DL_WIN_W / 2) | 0) - 1, cyy = wy + ((DL_WIN_H / 2) | 0) - 1;
    px(g, cx, wy, 2, DL_WIN_H, DL_FRAME);
    px(g, wx, cyy, DL_WIN_W, 2, DL_FRAME);
    px(g, cx + 2, wy, 1, DL_WIN_H, "rgba(20,26,36,0.16)");            // 棂影
    px(g, wx, cyy + 2, DL_WIN_W, 1, "rgba(20,26,36,0.16)");
  };
  const cageAt = (wx, wy) => {                    // 首层防盗窗（栅栏罩在玻璃外面）
    for (const bx of [wx + 2, wx + 5, wx + 10, wx + 13]) {
      px(g, bx, wy + 1, 1, DL_WIN_H - 2, DL_CAGE);
      px(g, bx + 1, wy + 1, 1, DL_WIN_H - 2, DL_CAGE_D);
    }
    for (const by of [wy + 5, wy + 14]) {
      px(g, wx + 1, by, DL_WIN_W - 2, 1, DL_CAGE);
      px(g, wx + 1, by + 1, DL_WIN_W - 2, 1, DL_CAGE_D);
    }
  };
  for (let f = 0; f < DL_FLOORS; f++) {
    const yf = eaveY + f * FLOOR_H;
    for (const band of DL_BANDS) {
      px(g, x0, yf + band[0], bw, band.length, DL_BAND);
      px(g, x0, yf + band[0], bw, 1, BAND_L);                         // 带顶受光
      px(g, x0, yf + band[band.length - 1], bw, 1, BAND_D);           // 带底背光
    }
    for (let cn = 0; cn < cols; cn++) {                               // 全宽铺满：中间无门（§九.3）
      const wx = colX(cn), wy = yf + winTop;
      winAt(wx, wy);
      if (f === DL_FLOORS - 1) cageAt(wx, wy);                        // 只有首层有防盗窗
    }
  }
  /* 檐下阴影（只最上一层，4 行渐隐）—— 画在棕带之后，压住带顶与瓷砖 */
  for (let i = 0; i < 4; i++)
    px(g, x0, eaveY + 2 + i, bw, 1, "rgba(14,18,28," + (0.26 * (1 - i / 4.2)).toFixed(3) + ")");

  /* --- 5. 雨水管（照 30 段 §3.6，画在窗之后 ⇒ 压在最右一列窗的右边） --- */
  const pipeX = x1 - 7;
  px(g, pipeX, eaveY + 3, 3, wh - 3, shade(DL_TILE, -0.24));
  px(g, pipeX, eaveY + 3, 1, wh - 3, shade(DL_TILE, 0.04));
  px(g, pipeX - 1, Math.round((eaveY + baseY) / 2) - 5, 5, 2, shade("#8b8f96", -0.10));
  px(g, pipeX - 1, baseY - 12, 5, 2, shade("#8b8f96", -0.22));

  contactBand(g, x0 + 1, x1 - 1, baseY - 1, 2, 0.34);                  // 接地带（与 30 段同序）

  /* --- 6. 空调外机：逐窗外挂（局部种子，绝不碰共享 RNG） --- */
  const acr = makeRng(6617);
  for (let f = 0; f < DL_FLOORS; f++) {
    const yf = eaveY + f * FLOOR_H, wy = yf + winTop;
    for (let cn = 0; cn < cols; cn++) {
      const wx = colX(cn);
      const skip = acr(), side = acr(), off = acr();
      if (skip < 0.30) continue;                                       // 三成没装
      let ax = side < 0.82 ? wx + DL_WIN_W + 2 : wx - DL_AC_W - 2;     // 绝大多数挂窗右
      if (ax < x0 + 1) ax = wx + DL_WIN_W + 2;                         // 越界改挂另一侧
      else if (ax + DL_AC_W > x1 - 1) ax = wx - DL_AC_W - 2;
      const ay = wy + Math.round((DL_WIN_H - DL_AC_H) * (0.20 + off * 0.55));
      px(g, ax, ay, DL_AC_W, DL_AC_H, DL_AC);                          // 外壳
      px(g, ax, ay, DL_AC_W, 1, "#ffffff");                            // 顶面受光
      px(g, ax, ay + DL_AC_H - 1, DL_AC_W, 1, DL_AC_D);                // 底面
      px(g, ax, ay + 2, DL_AC_W - 3, 1, "rgba(20,24,32,0.20)");        // 格栅暗线
      px(g, ax + DL_AC_W - 3, ay + 2, 3, DL_AC_H - 4, DL_AC_D);        // 右侧
      px(g, ax - 1, ay + DL_AC_H, DL_AC_W + 2, 1, "rgba(14,18,28,0.22)"); // 投影
    }
  }

  return b;
}

/* --- 5.16.3 几何：宽锚现算，一处写死 ---------------------------------------- */
function j9Geo(c) {
  const wallH0 = J9_FLOORS * FLOOR_H;
  const roofT  = c.height - J9_PADT - wallH0 - J9_PADB;   // 反解，不存第二份
  const eaveY  = J9_PADT + roofT;                         // 檐下沿 = 立面顶

  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, y0: y0,
    x0: J9_PADX, x1: J9_PADX + w, w: w, sc: sc, U: U,
    FH: FH, baseY: y0 + FH, H: y0 + FH + J9_PADB,
    tx0: J9_PADX, ty0: eaveY,          // 砖缝网格的锚点 = 立面左上角（全楼共用一套）
    /* 英寸 → 画布；矩形一律**两端各取整再相减**（不许把宽单独取整 ——
       相邻两块会因此差 1px 露缝，见 30 段的教训）。 */
    rect: (e) => [J9_PADX + U(e[1]), y0 + U(e[2]),
                  U(e[1] + e[3]) - U(e[1]), U(e[2] + e[4]) - U(e[2])],
    /* 多边形 → 画布（**不取整**：轮廓的取整交给行扫描，见 5.16.4） */
    pts: (pi) => J9_PATH[pi].map((p) => [J9_PADX + p[0] * sc, y0 + p[1] * sc])
  };

  G.bar   = j9GoldBar(G);
  /* 天井（口字缺口）：环宽 J9_RING 是**平面**像素 —— 横向 1:1，行方向乘进深比例
     J9_KZ（30 段 `depth * 0.60` 那一笔；立面上 1 in 与平面上 1 in 是同一个世界像素，
     所以这里不需要知道 footprint 进深）。 */

  G.riy   = riy;
  G.hole  = { x: J9_PADX + J9_RING, y: J9_PADT + riy,
              w: w - 2 * J9_RING, h: roofT - 2 * riy };
  /* 几何闸：30 段的 PADT/画布高公式一动，反解出的 roofT 立刻出界 ——

     30 段那套女儿墙（受光 4 + 内阴影 3 + 板面）与檐口投影线；洞本身要放得下里院

     30 段那两条比例一改，这一条会先响，而不是等出图看见一个畸形院子。 */
  if (riy < 18 || G.hole.w < 120 || G.hole.h < 90)
    console.warn("67_j9: 天井 洞 %d×%d、上下各留 %d 行 —— 环太窄或洞太小，" +

  for (const e of J9_EL) {
    if (e[0] !== "g" || Math.abs(e[4] - J9_WIN_H) > 1e-9) continue;   // 只要"一排窗"那一族
    const k = e[1].toFixed(4);
    (col[k] = col[k] || []).push(e[2]);
  }
  let best = null;
  for (const k in col) {
    const a = col[k].sort(function (p, q) { return p - q; });
    if (a.length >= 4 && (!best || a.length > best.length)) best = a;
  }
  if (!best) return G.U(0.4015);                       // 表被改坏时兜底（右翼实测同值）
  return G.U((best[best.length - 1] - best[0]) / (best.length - 1));
}

/* 金门廊的**横梁**矩形（楼名压在这上面）—— 从多边形现算，不写死：
   上沿 = 多边形最高行；下沿 = 顶点里"出现次数最多"的那个 y（П 的缺口上沿
   1.9311 在 12 个顶点里出现 4 次，腿底 3.6292/3.6299 各 1 次，顶边 1.1097
   与最高行同值被排除）⇒ 得到 82×34 px 的横梁。 */
function j9GoldBar(G) {
  let pi = -1;
  for (const e of J9_EL) if (e[0] === "m" && e[5] >= 0) { pi = e[5]; break; }
  if (pi < 0) return [0, G.y0, 1, 1];
  const p = G.pts(pi);
  let ymin = Infinity, xmin = Infinity, xmax = -Infinity;
  for (const q of p) {
    if (q[1] < ymin) ymin = q[1];
    if (q[0] < xmin) xmin = q[0];
    if (q[0] > xmax) xmax = q[0];
  }
  const ys = Math.round(ymin), cnt = new Map();
  for (const q of p) {
    const v = Math.round(q[1]);
    if (v <= ys) continue;
    cnt.set(v, (cnt.get(v) || 0) + 1);
  }
  let bt = ys + 1, bc = 0;
  cnt.forEach(function (n, v) { if (n > bc) { bc = n; bt = v; } });
  const x0 = Math.round(xmin), x1 = Math.round(xmax);
  return [x0, ys, x1 - x0, bt - ys];
}

/* --- 5.16.4 白瓷砖 / 黑玻璃幕墙 --------------------------------------------- */

/* 行扫描：把多边形与水平线 y=yc 的交点按 x 排好、两两配对成整数区间（半开 [xa, xb)）。
   ⚠️ 判交用"一端 <=yc、另一端 >yc"（半开），水平边（ya==yb）恒不满足 ⇒ 顶点处不会
      重复计数。本页三个多边形都是**轴对齐直角**多边形，这样扫出来的每一行都是精确的。 */
function j9Spans(pts, yc) {
  const xs = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc))
      xs.push(a[0] + (b[0] - a[0]) * (yc - a[1]) / (b[1] - a[1]));
  }
  xs.sort(function (p, q) { return p - q; });
  const out = [];
  for (let i = 0; i + 1 < xs.length; i += 2)
    out.push([Math.round(xs[i]), Math.round(xs[i + 1])]);
  return out;
}

/* 白瓷砖逐块色差表 —— 只走**局部** makeRng（碰共享流会重掷全校园散射，60 段 §6.6 那颗地雷）。
   查表用 (tx, ty) 的散列下标，**不用 rng 流**：同一块砖在任何调用顺序下都是同一个色。 */
const J9_JIT = (function () { const r = makeRng(6701), a = []; for (let i = 0; i < 64; i++) a.push(r()); return a; })();
function j9TileCol(tx, ty) {
  const k = J9_JIT[(((tx * 7 + ty * 13) % 64) + 64) % 64];
  return k < 0.10 ? J9_C.TILE_D : (k > 0.90 ? J9_C.TILE_L : J9_C.TILE);
}

/* 贴砖：把一块白件（矩形或多边形）按**全楼共用**的砖缝网格铺上小方格。
   · 网格锚在立面左上角（G.tx0, G.ty0）⇒ 9 块白件拼在一起时砖缝是连续的，
     不会在接缝处出现半块砖（两翼右沿与内侧竖条、竖条与端柱都是紧紧相接的）。
   · 每块砖先铺底色、再给 10% / 10% 的砖换浅一档 / 深一档，最后压砖缝
     （砖缝落在每块砖的**最后一行/最后一列**，与 66 段同法）。 */
function j9Tiles(g, pts, G) {
  const P = J9_TILE_P;
  let by0 = Infinity, by1 = -Infinity;
  for (const q of pts) { if (q[1] < by0) by0 = q[1]; if (q[1] > by1) by1 = q[1]; }
  by0 = Math.max(0, Math.floor(by0));
  by1 = Math.min(G.H, Math.ceil(by1));
  for (let y = by0; y < by1; y++) {
    const sp = j9Spans(pts, y + 0.5);
    if (!sp.length) continue;
    const jr = (((y - G.ty0) % P) + P) % P === P - 1;      // 这一行是横向砖缝
    const ty = Math.floor((y - G.ty0) / P);
    for (let s = 0; s < sp.length; s++) {
      const xa = sp[s][0], xb = sp[s][1];
      if (xb <= xa) continue;
      if (jr) { px(g, xa, y, xb - xa, 1, J9_C.JOINT); continue; }
      px(g, xa, y, xb - xa, 1, J9_C.TILE);
      for (let tx = Math.floor((xa - G.tx0) / P); ; tx++) {
        const t0 = G.tx0 + tx * P;
        if (t0 >= xb) break;
        if (t0 + P <= xa) continue;
        const cx0 = Math.max(xa, t0), cx1 = Math.min(xb, t0 + P);
        const col = j9TileCol(tx, ty);
        if (col !== J9_C.TILE && cx1 > cx0) px(g, cx0, y, cx1 - cx0, 1, col);
        if (t0 >= xa && t0 < xb) px(g, t0, y, 1, 1, J9_C.JOINT);   // 竖向砖缝
      }
    }
  }
}

/* 黑玻璃幕墙（`k` 类）：**画玻璃 + 网格划分**（用户点名）。
   分格按"窗模数"（G.mull = 17 px）等分：竖挺 nC 格、横挺 nR 格，
   每格玻璃给一点明度抖动（幕墙的反射），挺线压一档亮灰。 */
function j9BlackGlass(g, r, G) {
  const x = r[0], y = r[1], w = r[2], h = r[3];
  if (w < 4 || h < 4) return;
  px(g, x, y, w, h, J9_C.BLACK);
  const nC = Math.max(2, Math.round(w / G.mull));
  const nR = Math.max(2, Math.round(h / G.mull));
  for (let i = 0; i < nC; i++) {
    const cxa = x + Math.round(i * w / nC), cxb = x + Math.round((i + 1) * w / nC);
    for (let j = 0; j < nR; j++) {
      const cya = y + Math.round(j * h / nR), cyb = y + Math.round((j + 1) * h / nR);
      const k = J9_JIT[(((i * 11 + j * 5) % 64) + 64) % 64];
      if (k < 0.28) px(g, cxa, cya, cxb - cxa, cyb - cya, J9_C.BLACK_D);
      else if (k > 0.74) px(g, cxa, cya, cxb - cxa, cyb - cya, J9_C.BLACK_L);
    }
  }
  for (let i = 1; i < nC; i++) {                       // 竖挺
    const cx = x + Math.round(i * w / nC);
    px(g, cx, y, 1, h, J9_C.MULL);
  }
  for (let j = 1; j < nR; j++) {                       // 横挺
    const cy = y + Math.round(j * h / nR);
    px(g, x, cy, w, 1, J9_C.MULL);
    px(g, x, cy + 1, w, 1, J9_C.MULL_D);
  }
  px(g, x, y, 1, h, J9_C.MULL_D);                      // 左 1px 收口
  px(g, x + w - 1, y, 1, h, J9_C.MULL_D);
}

/* --- 5.16.5 逐形状的四种件 ------------------------------------------------- */

/* 普通玻璃（`g` 类，40 块）：**凹进去的窗洞** —— 上沿压暗、下沿提亮（凹口反相，
   与 30 段那套"凸出实体上+左提亮"正好相反）。宽窗（≥18px）中间加一条竖挺，
   读作两扇；窄窗（10px，端柱/竖条上那 12 块）不加。 */
function j9GlassBlue(g, r) {
  const x = r[0], y = r[1], w = r[2], h = r[3];
  if (w < 3 || h < 3) return;
  px(g, x, y, w, h, J9_C.GLASS);
  px(g, x, y, w, 1, J9_C.GLASS_D);
  px(g, x, y + h - 1, w, 1, J9_C.GLASS_L);
  px(g, x, y, 1, h, J9_C.GLASS_D);
  px(g, x + w - 1, y, 1, h, J9_C.GLASS_D);
  if (w >= 18) px(g, x + (w >> 1), y + 1, 1, h - 2, J9_C.GLASS_D);
}

/* 门（`d` 类）：同样是凹口，再压一条中缝（双开门）。 */
function j9Door(g, r) {
  const x = r[0], y = r[1], w = r[2], h = r[3];
  if (w < 3 || h < 3) return;
  px(g, x, y, w, h, J9_C.DOOR);
  px(g, x, y, w, 1, J9_C.DOOR_D);
  px(g, x, y + h - 1, w, 1, J9_C.DOOR_L);
  px(g, x, y, 1, h, J9_C.DOOR_D);
  px(g, x + w - 1, y, 1, h, J9_C.DOOR_D);
  if (w >= 12) px(g, x + (w >> 1), y + 1, 1, h - 2, J9_C.DOOR_D);
}

/* 台阶（`t` 类）：ppt 里是个 `prst=trapezoid`（avLst 空 ⇒ 默认 adj=25000
   ⇒ 顶边两侧各收 min(w,h)×0.25 = 7×0.25 ≈ 2px）。用户说「梯形是阶梯」
   ⇒ 按这个收分画出 3 级踏步：每级**踏面提亮、踢面压暗**，越往上越往里收。 */
function j9Stairs(g, r) {
  const x = r[0], y = r[1], w = r[2], h = r[3];
  if (w < 6 || h < 3) return;
  const n = Math.min(J9_STAIR_N, h);
  const ins = Math.round(0.25 * Math.min(w, h));       // 顶边单侧收分（adj=25000）
  for (let i = 0; i < n; i++) {                        // i = 0 是最下面一级
    const ya = y + h - Math.round((i + 1) * h / n), yb = y + h - Math.round(i * h / n);
    const sh = Math.max(0, Math.round(ins * (n - 1 - i) / Math.max(1, n - 1)));
    const xa = x + sh, xb = x + w - sh;
    if (xb - xa < 2 || yb - ya < 1) continue;
    px(g, xa, ya, xb - xa, yb - ya, J9_C.TILE);
    px(g, xa, ya, xb - xa, 1, shade(J9_C.TILE, 0.12));            // 踏面
    px(g, xa, yb - 1, xb - xa, 1, shade(J9_C.TILE, -0.26));       // 踢面
  }
}

/* 金门廊（`m` 类，П 形多边形）：凸出的实体 —— 上 + 左提亮、下 + 右压暗，逐行按
   行扫描的结果描边（这样两条腿的内外沿都能描到）。 */
function j9Gold(g, pts, G) {
  let ymin = Infinity, ymax = -Infinity;
  for (const q of pts) { if (q[1] < ymin) ymin = q[1]; if (q[1] > ymax) ymax = q[1]; }
  const ya = Math.max(0, Math.floor(ymin)), yb = Math.min(G.H, Math.ceil(ymax));
  for (let y = ya; y < yb; y++) {
    const sp = j9Spans(pts, y + 0.5);
    for (let s = 0; s < sp.length; s++) {
      const xa = sp[s][0], xb = sp[s][1];
      if (xb <= xa) continue;
      px(g, xa, y, xb - xa, 1, J9_C.BAND);
      px(g, xa, y, 1, 1, J9_C.BAND_L);
      px(g, xb - 1, y, 1, 1, J9_C.BAND_D);
    }
  }
  for (const sp of j9Spans(pts, ya + 0.5)) px(g, sp[0], ya, sp[1] - sp[0], 1, J9_C.BAND_L);
  for (const sp of j9Spans(pts, yb - 0.5)) px(g, sp[0], yb - 1, sp[1] - sp[0], 1, J9_C.BAND_D);
}

/* --- 5.16.6 楼名：点阵压在金门廊的横梁上 -----------------------------------
   与 `_build/_j9font.py` 的 draw_preview() **逐条同构**（预览图就是按这支笔出的，
   观感判据才有效）：笔画的上缘用亮金、下缘那一行压暗金 —— 源图是**金色 3D 立体字**，
   自带厚度，这两档正好把它读出来。 */
function j9Glyph(g, b64, nw, nh, x, y) {
  const s = atob(b64), bit = (i) => (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  for (let j = 0; j < nh; j++) {
    for (let i = 0; i < nw; i++) {
      if (!bit(j * nw + i)) continue;
      const dn = (j + 1 >= nh) || !bit((j + 1) * nw + i);
      px(g, x + i, y + j, 1, 1, dn ? J9_C.INK_D : J9_C.INK_L);
    }
  }
}
/* 排布：**居中在金门廊的横梁上**（横梁是这栋楼放名字的构件）。
   用户那个标注框（`J9_TXT`）是落位依据，它的中心比横梁中心偏右 3 px
   （框右沿与横梁右沿重合、左沿内缩 6px —— 用户是**描着金匾**画的框，描斜了）。
   ⇒ 取横梁中心。代价（诚实记一笔）：字块左沿会越出那个框 **1 px**
   （同以图左沿为 0：字块左 190、框左 191；而框右 267 与横梁右沿**逐字相等**、
   末字右沿 261 ⇒ 右边还剩 6 px）。改成"严格居中于框"只需把
   `G.bar[0]` 换成框左沿、`G.bar[2]` 换成框宽 —— 但那样名字在金匾上会左偏 6 px。
   `j9Geo` 的楼名闸盯着这个差值（上限 J9_BAR_TOL=6 px）。 */
function j9Plaque(g, G) {
  let tw = 0, gh = 0;
  for (let i = 0; i < J9_CHARS.length; i++) {
    tw += J9_CHARS[i][1] + (i ? J9_GAPS[i - 1] : 0);
    if (J9_CHARS[i][2] > gh) gh = J9_CHARS[i][2];
  }
  let x = G.bar[0] + ((G.bar[2] - tw) >> 1);
  const y = G.bar[1] + Math.max(0, (G.bar[3] - gh) >> 1);
  for (let i = 0; i < J9_CHARS.length; i++) {
    j9Glyph(g, J9_CHARS[i][0], J9_CHARS[i][1], J9_CHARS[i][2], x, y);
    x += J9_CHARS[i][1] + (i < J9_GAPS.length ? J9_GAPS[i] : 0);
  }
}

/* --- 5.16.7 立面总装（只在**新画布**上画，不 clearRect） ---------------------
   次序 = `J9_EL` 的顺序 = **ppt 的 z 序** ⇒ 用户点名的「覆盖关系」照搬，
   没有第二张 z 序表：黑玻璃在最底 ⇒ 金门廊压上去 ⇒ 门压在金门廊的洞里
   ⇒ 两翼/竖条/端柱依次压边 ⇒ 台阶 ⇒ 顶部横带盖住黑玻璃与竖条的上沿。 */
function j9Front(g, G) {
  /* ① 墙底：整幅立面先铺一层砖底。理由有两条 ——
     (a) ppt 里两翼/端柱从 y=0.0236 起、中间那条横带从 y=0 起，差 1 行；
         不铺底的话立面最上一行会是一条**透明缝**（透出地面）；
     (b) 形状之间因取整留下的 1px 缝（如 4.0812..4.0889）也会透出地面。 */
  px(g, G.x0, G.y0, G.w, G.FH, J9_C.TILE);
  for (let i = 0; i < J9_EL.length; i++) {
    const e = J9_EL[i], k = e[0];
    if (k === "w") {
      j9Tiles(g, e[5] >= 0 ? G.pts(e[5]) : [[G.rect(e)[0], G.rect(e)[1]],
                                             [G.rect(e)[0] + G.rect(e)[2], G.rect(e)[1]],
                                             [G.rect(e)[0] + G.rect(e)[2], G.rect(e)[1] + G.rect(e)[3]],
                                             [G.rect(e)[0], G.rect(e)[1] + G.rect(e)[3]]], G);
    } else if (k === "k") {
      j9BlackGlass(g, G.rect(e), G);
    } else if (k === "g") {
      j9GlassBlue(g, G.rect(e));
    } else if (k === "d") {
      j9Door(g, G.rect(e));
    } else if (k === "t") {
      j9Stairs(g, G.rect(e));
    } else if (k === "m") {
      j9Gold(g, G.pts(e[5]), G);
      j9Plaque(g, G);                          // 门廊刚落地，就地压楼名
    }
  }
  /* ② 左右两条侧边（SUN 左上受光）：本楼两翼一直铺到外框边，没有单独的"山墙"可描 ——
     这一条是给整栋立面的轮廓定界的，1px，压在贴好的瓷砖之上。 */
  px(g, G.x0, G.y0, 1, G.FH, shade(J9_C.TILE, 0.10));
  px(g, G.x1 - 1, G.y0, 1, G.FH, shade(J9_C.TILE, -0.14));
  /* ③ 接地带：收住脚线，与 65 段同参。 */
  contactBand(g, G.x0, G.x1, G.baseY - 2, 3, 0.34);
}

/* --- 5.16.7a 屋面：口字形（环 + 天井） ---------------------------------------
   ⚠️ 这里的整块屋面是**照 30 段 §2 逐笔重画**的，不是"在 30 段的屋面上挖个洞"。
      两条理由：
      (a) 旧屋面上有 30 段按种子 7001 随机撒的 2~4 个设备箱（`_j9roof.py` 能逐块
          算出来），挖洞会**切开**正好压在洞沿上的箱子 —— 切一半的箱子既不像箱子，
          也补不回来；
      (b) 屋名牌（30 段 §3.2.9）连同它朝右下 3px 的投影就画在屋面上，整块重画一次
          正好把它连根盖掉（第 27 轮那块"补板面"的补丁唯一用途就是补它的疤）。
   ⚠️ 重画的每一笔都**逐字照抄** 30 段 §2 的那九行（色号是抄来的 —— 第 27 轮抄错
      一个 `-0.04` 就在屋面上留下一块 117×34 的亮斑）；build.py ⑩c-3 把两边的
      字面量一条一条钉在一起，改一边不改另一边会直接构建失败。
   ⚠️ **不碰共享随机流**：斑点走局部 makeRng(6720)/(6721)，设备箱走 (6722)。
      碰了共享 rng 会重掷全校园散射（三套自动验收都查不出，见 60 段 §6.6）。 */
function j9RoofRect(G) {                      // 擦除框：连檐口外沿（x0−3 / w+6）一起清
  return [G.x0 - 4, J9_PADT - 2, G.w + 8, G.roofT + 4];
}
function j9Roof(g, G, pal) {
  const r = pal.roof, w = G.w, x0 = G.x0, x1 = G.x1;
  const PADT = J9_PADT, roofT = G.roofT, rc = j9RoofRect(G);
  g.clearRect(rc[0], rc[1], rc[2], rc[3]);
  px(g, x0 - 3, PADT, w + 6, roofT, shade(r, -0.34));            // 檐口外沿
  px(g, x0, PADT + 2, w, roofT - 5, shade(r, -0.04));            // 板面
  px(g, x0, PADT + 2, w, 4, shade(r, 0.26));                     // 女儿墙顶受光
  px(g, x0, PADT + 6, w, 3, "rgba(14,18,28,0.34)");              // 女儿墙内阴影
  px(g, x0, PADT + 6, 4, roofT - 9, shade(r, 0.14));             // 左内侧受光
  px(g, x1 - 4, PADT + 6, 4, roofT - 9, "rgba(14,18,28,0.22)");  // 右内侧背光
  for (let j = 1; j <= 3; j++)                                   // 分坡脊线
    px(g, x0 + 5, PADT + Math.round((roofT - 12) * j / 4) + 6, w - 10, 1, "rgba(255,255,255,0.08)");
  px(g, x0 - 3, PADT + roofT - 1, w + 6, 2, shade(r, -0.60));    // 檐口投影线
  j9RoofBoxes(g, G, pal);
  speckle(g, x0 + 4, PADT + 7, w - 8, roofT - 12, "rgba(255,255,255,0.05)", (w / 3) | 0, makeRng(6720));
  speckle(g, x0 + 4, PADT + 7, w - 8, roofT - 12, "rgba(0,0,0,0.07)", (w / 4) | 0, makeRng(6721));
  j9Court(g, G, pal);                        // 天井压在最后：顺带盖掉落进洞里的斑点
}
/* 洞口让位：一块矩形**连同它朝右下 4px 的设备投影**都要离洞沿至少 g 像素。
   投影不一起让开的话，箱子本体在环上、影子却挂在院子上空。 */
function j9RingFree(bx, by, bw, bh, H, g) {
  const x0 = bx - g - 4, y0 = by - g - 4, x1 = bx + bw + g + 4, y1 = by + bh + g + 4;
  return x1 <= H.x || x0 >= H.x + H.w || y1 <= H.y || y0 >= H.y + H.h;
}
/* 屋面设备箱：尺寸与落点公式照 30 段 §2 那段搬，但**必须整块落在环上**。
   洞口吃掉屋面 48%（本楼），随机落点有一小半会压在洞沿上 ⇒ 命中的候选**整块不要**，
   重掷下一个（不挪位、不缩尺寸 —— 挪过的箱子会全挤在环边，比少放难看）。
   `J9_BOX_N` 是上限：环窄，放不下就少放。 */
function j9RoofBoxes(g, G, pal) {
  const r = pal.roof, w = G.w, PADT = J9_PADT, roofT = G.roofT, H = G.hole;
  if (roofT <= 46) return;
  const rng = makeRng(6722);
  let n = 0;
  for (let t = 0; t < 80 && n < J9_BOX_N; t++) {
    const bw = 18 + rng() * 34, bh = 12 + rng() * 20;
    const bx = Math.round(G.x0 + 14 + rng() * Math.max(1, w - 28 - bw));
    const by = Math.round(PADT + 14 + rng() * Math.max(1, roofT - 28 - bh - bh * 0.5));
    if (!j9RingFree(bx, by, bw, bh, H, 6)) continue;
    px(g, bx + 4, by + 4, bw, bh, "rgba(14,18,28,0.30)");         // 设备投影
    px(g, bx, by + bh - 4, bw, 4, shade(r, -0.38));               // 设备侧墙
    px(g, bx, by, bw, bh, shade(r, 0.16));
    px(g, bx, by, bw, 3, shade(r, 0.34));
    px(g, bx, by + bh - 1, bw, 1, "rgba(14,18,28,0.30)");
    n++;
  }
}
/* 四条矩形拼一个"环"（不用 strokeRect —— 本项目一律 px()：strokeRect 的边是
   抗锯齿的，像素画上会描出一条软边，同 5.16.4 头注那条）。 */
function j9Frame(g, x, y, w, h, t, col) {
  px(g, x, y, w, t, col);
  px(g, x, y + h - t, w, t, col);
  px(g, x, y, t, h, col);
  px(g, x + w - t, y, t, h, col);
}

/* --- 5.16.7b 天井（口字缺口）+ 里院 -----------------------------------------
   尺寸（平面世界像素；footprint 450 × 304，见文件头"尺度"）：
       环宽 55 ⇒ 院子 340 × 194 = footprint 的 76% × 64%、面积 48%
       画布：洞 x = x0+55 .. x1−55（宽 340）；上下各让 round(55 × 0.6) = 33 行 ⇒ 高 117
   （用户第二十八轮：「口字缺口不能很小，实际上九教中间的院落是相当大的」——
     所以环宽取的是"一圈楼的进深"，而不是更宽的一圈楼板。）

   洞里从上到下画两样：
     ① 里院北楼的**内立面** —— 就是用户说的「露出一部分教学楼」：白瓷砖 + 蓝窗 4 排；
     ② 院子地面 —— 校园石头广场同款石板（PLAZA_BASE / PLAZA_DARK），墙脚压一条落影。
   ⚠️ **这是一处刻意的偏离，必须报备**：按这张图的投影（俯角 37°、竖直 1:1、进深
      ×0.6）从外面看一个 7 层高的院子，**地面一行都看不到** —— 要看到地面，院子进深
      得超过 153 / 0.6 = 255 px，而本楼只有 194。真按投影画，洞里会**整块被那面墙**
      填满（墙 153 行 > 洞 117 行）。像素画的惯例是"读得出来优先"：把墙压到洞高的
      J9_CWALL = 2/3、下面 1/3 留给院子地面，一眼才读得出"这是个院子"。
      改这个比例只动 J9_CWALL 一个数。 */
function j9Court(g, G, pal) {
  const H = G.hole, r = pal.roof;
  j9Frame(g, H.x - 5, H.y - 5, H.w + 10, H.h + 10, 3, shade(r, -0.34));  // 内圈外沿
  j9Frame(g, H.x - 2, H.y - 2, H.w + 4, H.h + 4, 2, shade(r, -0.60));    // 贴边投影线
  j9CourtYard(g, G, pal);
}
function j9CourtYard(g, G, pal) {
  const H = G.hole;
  const wh = Math.round(H.h * J9_CWALL);            // 里院北楼露出来的那截墙高
  j9CourtPave(g, H.x, H.y + wh, H.w, H.h - wh);     // ① 院子地面（先铺，墙压上去）
  j9CourtWall(g, H.x, H.y, H.w, wh, G);             // ② 内立面
  j9Frame(g, H.x, H.y, H.w, H.h, 2, "rgba(14,18,28,0.22)");   // ③ 洞内一圈环境光遮蔽
}
/* 院子地面：校园石头广场同款（PLAZA_BASE + PLAZA_DARK 缝），方砖 16px。
   ⚠️ 逐块色差走 J9_JIT 查表（与 5.16.4 的贴砖同一条纪律）—— 这里一掷 rng，
      全校园的散射会重排（60 段 §6.6 那颗地雷）。 */
function j9CourtPave(g, x, y, w, h) {
  const P = 16;
  px(g, x, y, w, h, PLAZA_DARK);
  for (let by = y; by < y + h - 1; by += P) {
    const hh = Math.min(P - 2, y + h - by - 2);
    for (let bx = x; bx < x + w - 1; bx += P) {
      const ww = Math.min(P - 2, x + w - bx - 2);
      if (ww < 1 || hh < 1) continue;
      const k = (J9_JIT[(((bx * 3 + by * 5) % 64) + 64) % 64] - 0.5) * 0.22;
      px(g, bx + 1, by + 1, ww, hh, shade(PLAZA_BASE, k));
      px(g, bx + 1, by + 1, ww, 1, shade(PLAZA_BASE, k + 0.10));   // 板面上棱微受光
    }
  }
}
/* 里院北楼的内立面（从院子里看这栋楼的背面）。
   构件**全部复用外面那支笔**：白瓷砖走 j9Tiles（同一套砖缝网格，缝能接上）、
   蓝窗走 j9GlassBlue。一个数都不新造：
     · 窗的**行**位置 = 外面立面自己那六排（`J9_EL` 的 0.2007/0.5847/…）里落得进
       可见墙高的那些 —— ⚠️ 那串 0.384/0.4278 的**交替行距是用户画的**，不许改成
       等距（第 27 轮的口径）；右翼那六排整体错开 0.0389 in，所以只取左翼（x < 4）；
     · 窗宽 / 窗高 / 排距从立面表现算（j9CourtWin）。 */
function j9CourtWall(g, x, y, w, wh, G) {
  /* ⚠️ 先铺一层**不透明**底（白瓷砖本色），再走 j9Tiles。
     理由是实测归因出来的：`J9_C.JOINT` 是 `rgba(0,0,0,0.085)` —— **半透明**，
     底下是什么就透出什么。不铺底的话砖缝压在**屋面板面**(103,121,135) 上，
     出一张 (94,110,123) 的深蓝灰网格（6 倍放大下一眼可见）；而外面立面的砖缝压在
     白底上，是 (198,198,198) 的浅灰网格。同一支笔要出同一个结果，**底也得一样**。
     顺带盖掉一件更隐蔽的：屋面那三条分坡脊线（y=67/110/152）里，
     y=110 正好落在砖缝那一行 ⇒ 不铺底就会有一条 +10 的亮痕从缝里透出来。 */
  px(g, x, y, w, wh, J9_C.TILE);
  j9Tiles(g, [[x, y], [x + w, y], [x + w, y + wh], [x, y + wh]], G);
  const win = j9CourtWin(G), m = G.U(0.5174);   // 窗离外框留的边 = 立面上端柱那一格宽
  const rows = j9CourtRows(G, wh);
  let n = Math.floor((w - 2 * m - win.w) / win.pitch) + 1;
  n = Math.max(2, Math.min(6, n));
  const lx = x + Math.round((w - ((n - 1) * win.pitch + win.w)) / 2);
  for (let r = 0; r < rows.length; r++)
    for (let i = 0; i < n; i++)
      j9GlassBlue(g, [lx + i * win.pitch, y + rows[r], win.w, win.h]);
  for (let i = 0; i < 4; i++)            // 檐下阴影：顶上 4 行逐行渐淡（30 段 §3.3 同法）
    px(g, x, y + i, w, 1, "rgba(14,18,28," + (0.34 * (1 - i / 4)).toFixed(3) + ")");
  px(g, x, y + wh - 5, w, 4, shade(J9_C.TILE, -0.16));       // 墙脚台明
  px(g, x, y + wh - 1, w, 1, shade(J9_C.TILE, -0.34));
}
/* 内墙那排窗的尺寸与排距：**从外面立面现算**（同一栋楼同一排窗，不许写第二份）。
   左翼最上面那一排（y 最小）里最靠左的两块 —— 它们的 x 差就是排距
   （2.5528 − 0.7611 = 1.7917 in ⇒ 75 px），宽高取其中一块（0.7285 × 0.2451 in
   ⇒ 30 × 10 px）。⚠️ `G.U()` 会**取整**：一排窗的排距带小数时，几排下来会一宽一窄，
   正是第 24 轮用户点名的「不能看起来很不均匀」。
   表被改坏时兜底用同一组实测值（与 j9MullPitch 同一写法）。 */
function j9CourtWin(G) {
  let y0 = Infinity;
  for (const e of J9_EL)
    if (e[0] === "g" && e[1] < 4 && Math.abs(e[4] - J9_WIN_H) < 1e-9 && e[2] < y0) y0 = e[2];
  const row = J9_EL.filter((e) => e[0] === "g" && e[1] < 4 &&
                                   Math.abs(e[4] - J9_WIN_H) < 1e-9 &&
                                   Math.abs(e[2] - y0) < 1e-9)
                   .sort(function (p, q) { return p[1] - q[1]; });
  if (row.length < 2) return { w: G.U(0.7285), h: G.U(0.2451), pitch: G.U(1.7917) };
  return { w: G.U(row[0][3]), h: G.U(row[0][4]), pitch: G.U(row[1][1] - row[0][1]) };
}
/* 可见墙高 wh 里落得下的那几排窗（行 = 外面立面自己的 y，逐排照搬）；底部留 5 行
   给墙脚台明 —— 一排窗压着墙脚就不是窗户了。 */
function j9CourtRows(G, wh) {
  const out = [];
  for (const e of J9_EL) {
    if (e[0] !== "g" || e[1] > 4 || Math.abs(e[4] - J9_WIN_H) > 1e-9) continue;
    const ry = G.U(e[2]);
    if (ry + G.U(e[4]) <= wh - 5 && out.indexOf(ry) < 0) out.push(ry);
  }
  return out.sort(function (p, q) { return p - q; });
}

/* --- 5.16.8 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是同一张 canvas
      的内容，晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/…/dormLibRestyle
      同一规矩）。
   ⚠️ 本函数**不碰共享 RNG**（逐块色差走查表 J9_JIT，那张表在模块初始化时用
      局部 makeRng(6701) 造好后就不再掷了）。
   ⚠️ 第三个实参照 65 段传 `pal` —— 画立面用不上它（正面图的色是 ppt 给的，
      见 5.16.2），但**屋面（5.16.7a）整块重画时要用 `pal.roof`**，而
      `makeBuilding` 的返回值里没有色号。本段不许再存一份 PALETTE（TDZ，58 段栽过）。
      ⚠️ 屋面那九笔**不是**拿 `pal.roof` 本色画的：30 段 §2 是
      `shade(roof, −0.34 / −0.04 / 0.26 / …)` 一层层叠出来的。第 27 轮实测过
      拿本色去补板面 ⇒ 屋面上一块 **117×34 的亮斑**（板面 (103,121,135) 占屋面
      82%，本色 (108,127,140) 只占 11%），外加擦除边绕出的一圈亮边，合计 1847 px。
      **这些色号全是抄来的** ⇒ build.py ⑩c-3 按字面量把两边的九笔一条条钉住。
   ⚠️ **立面高 153 行 ≠ styleOf 的 4 层（136 行）** ⇒ 换一张高的画布；只拷旧画布
      顶部 y0+1 行（y0 = 檐口行）。⚠️ 那 `+1` 只保住屋面两侧各 3 px 的外沿 ——
      y0 那一整行（30 段檐口投影线的下半行）**随即被 ppt 的 idx11 檐口砖带盖掉**
      （它从 y0 起铺，实测 414 px），这是用户正面图本来就有的取舍，不是丢行。
      换画布**不改** `b.w` —— addSolid 用的是世界坐标，与精灵高矮无关。 */
function j9Restyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const G = j9Geo(c);
  /* ① 屋面改口字形（5.16.7a）：**整块重画**，屋名标牌（30 段挂在檐口之上的那块）
        连同它朝右下 3px 的投影一起被 j9RoofRect 的擦除框盖掉
        ⇒ 第 27 轮那块"补板面"的补丁（与它的两个局部 makeRng）**整段删掉**：
        它唯一的用途就是补牌子那块 117×34 的疤。
        牌子仍然要"调"出来：makeSign 填 `_signCache`（verify.py 数的是这个名字），
        本楼的名字在金门廊上 —— 与 59/61/63/65 段同一处理。 */
  const sgn = makeSign(J9_NAME);
  const sg  = signRect(sgn, G.x0, G.w, G.eaveY);
  const rc  = j9RoofRect(G);
  if (sg && (rc[0] > sg.x || rc[1] > sg.y ||
             rc[0] + rc[2] < sg.x + sg.w + 3 || rc[1] + rc[3] < sg.y + sg.h + 3))
    console.warn("67_j9: 屋面重绘的擦除框 %d,%d %d×%d 没盖住屋名牌 %d,%d %d×%d —— " +
                 "牌子挂在檐口之上，会留在新屋面上", rc[0], rc[1], rc[2], rc[3],
                 sg.x, sg.y, sg.w, sg.h);
  j9Roof(g, G, pal);
  /* ② 新画布：旧画布的檐口以上搬过来（同一行） */
  const nc = mkCanvas(c.width, G.H), ng = nc.getContext("2d");
  ng.drawImage(c, 0, 0, c.width, G.y0 + 1, 0, 0, c.width, G.y0 + 1);
  /* ③ 方向性投影（照 30 段 §3.1：footprint 朝右下拉伸，画在立面**之前**，
        所以只有落地线以下那一截留在画面里）+ 立面总装 */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  shadowQuad(ng, G.x0 + 2, G.baseY - J9_SHADOW_H, G.x1 - 2, G.baseY, SHX, SHY, 0.28, 4);
  j9Front(ng, G);
  b.canvas = nc;
  /* ④ 锚点：`b.y`（世界落地线）与 addSolid 用的世界坐标一个字节都不动 ——
        多出来的 17 行全部朝北长（见文件头"尺度"）。 */
  b.ay = G.baseY;
  return b;
}

     然后在新画布上从零画投影 + 立面 + 台阶 + 接地带。
     尺寸一样、`b.ay` 一样 ⇒ 画面上这栋楼的位置与改前逐像素一致。

   ## 已知代价 / 必须报备的偏离（交付说明里要写）

/* --- 5.17.3 几何：宽锚现算，一处写死 ---------------------------------------- */
function qjGeo(c) {
  const wallH0 = QJ_FLOORS * FLOOR_H;
  const roofT  = c.height - QJ_PADT - wallH0 - QJ_PADB;   // 反解，不存第二份
  const eaveY  = QJ_PADT + roofT;                         // 檐下沿 = 立面顶
  const w      = c.width - QJ_PADX * 2;                   // 立面外框宽 = footprint 宽
  const sc     = w / QJ_PW;                               // 照片 px → 精灵 px（横向）
  const sv     = wallH0 / QJ_RISE;                        // 照片 px → 精灵行（纵向）
  const baseY  = eaveY + wallH0;
  /* 照片 x → 画布 x（**两端各取整再相减**：相邻两块才不会差 1px 露缝，30 段的教训） */
  const X = (v) => QJ_PADX + Math.round(v * sc);
  /* 照片 y → 画布行（锚在"地面线"上；照片 y 越小越靠上 ⇒ 行越小） */
  const Y = (v) => baseY - Math.round((QJ_GY - v) * sv);
  const cx = QJ_PADX + w / 2;                             // 立面中轴
  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, baseY: baseY,
    x0: QJ_PADX, x1: QJ_PADX + w, w: w, sc: sc, sv: sv, X: X, Y: Y, cx: cx,
    H: c.height
  };
  /* 门楼：**居中**于立面（照片上它的中心比图心偏左 0.6 px，四舍五入后就是居中） */
  const pw = X(QJ_PORCH[1]) - X(QJ_PORCH[0]);
  G.porch = { x: Math.round(cx - pw / 2), w: pw, top: Y(QJ_PTOP) };
  const pcx = G.porch.x + G.porch.w / 2;
  const dw  = X(QJ_DOOR[1]) - X(QJ_DOOR[0]);
  G.door  = { x: Math.round(pcx - dw / 2), w: dw, y: Y(835) };
  const sw  = X(QJ_STEPX[1]) - X(QJ_STEPX[0]);
  G.step  = { x: Math.round(pcx - sw / 2), w: sw, y: baseY + 1 };
  /* 竖向分带：檐口带 → 4 条砖带（窗贴砖带顶端） + 3 条细灰横带 → 墙裙。
     **砖带 = 灰件之间的缝**：自下而上数，"下面那条灰件的下沿 + 1" 到 "上面那条灰件的
     上沿 - 1"。四条灰件（自下而上）= 墙裙 / gband[0] / gband[1] / gband[2] / 檐口带。 */
  G.cope = { top: eaveY, bot: Y(QJ_COPEY) };              // 檐口带（灰）
  G.plin = { top: Y(QJ_PLIN_PY), bot: baseY - 1 };        // 墙裙（灰）
  G.gband = QJ_GBAND_PY.map(function (p) { return { top: Y(p[0]), bot: Y(p[1]) }; });
  G.floor = [];                                           // 自下而上 1~4 层
  for (let f = 0; f < 4; f++) {
    const top = (f < 3) ? G.gband[f].bot + 1 : G.cope.bot + 1;
    const bot = (f > 0) ? G.gband[f - 1].top - 1 : G.plin.top - 1;
    G.floor.push({ top: top, bot: bot, win: top, wbot: top + QJ_WIN_H - 1 });
  }
  /* 开间：照片 x → 画布 x 的中心 */
  G.bayL = QJ_BAY_L.map(X);
  G.bayR = QJ_BAY_R.map(X);
  G.pipes = QJ_PIPE_X.map(X);
  /* 层间闸：窗必须落在自己的砖带里、且砖带上边不能比窗顶高 —— 照片那三条
     "砖带顶/砖带底"实测数一改错位，这一条先响，而不是等出图看见窗压灰带。 */
  for (let f = 0; f < 4; f++) {
    const F = G.floor[f];
    if (F.bot - F.top < QJ_WIN_H + 2)
      console.warn("68_qijiao: 第 %d 层砖带只有 %d 行、放不下 %d 行的窗 —— " +
                   "QJ_FTOP_PY/QJ_FBOT_PY 与 QJ_WIN_H 配不上", f + 1, F.bot - F.top + 1, QJ_WIN_H);
  }
  if (G.cope.bot - G.cope.top < 6 || G.plin.bot - G.plin.top < 2)
    console.warn("68_qijiao: 檐口带 %d 行 / 墙裙 %d 行太窄 —— 照片标定对不上了",
                 G.cope.bot - G.cope.top + 1, G.plin.bot - G.plin.top + 1);
  /* 门楼闸：必须在立面里、且顶盖要高出檐口（照片上高 53 px ≈ 12 行） */
  if (G.porch.x <= G.x0 || G.porch.x + G.porch.w >= G.x1 ||
      G.eaveY - G.porch.top < 4 || G.eaveY - G.porch.top > 20)
    console.warn("68_qijiao: 门楼 x[%d,%d] 或顶盖第 %d 行（檐口第 %d 行）出界",
                 G.porch.x, G.porch.x + G.porch.w, G.porch.top, G.eaveY);
  /* 几何闸：30 段的 PADT/画布高公式一动，反解出的 roofT 立刻出界 ——
     出图时是一栋比例崩掉的楼，而几套自动验收都不看画面。 */
  if (roofT < 20 || roofT > 190)
    console.warn("68_qijiao: 反解出的 roofT=%d 出了 30 段的 clamp 区间[20,190]，" +
                 "画布高 %d 与 PADT/wallH/SHY 公式对不上了", roofT, c.height);
  return G;
}

/* --- 5.17.4 匾额点阵 --------------------------------------------------------
   由 `_build/_qjfont.py` 生成（**没有源图** —— 照片上那块匾每个字只 4.9 行，抠不出来；
   改走 30 段 §3.0 那条"系统字体 → 二值化"，理由写在 `_qjfont.py` 的文件头）。
   1bit、行优先、MSB 在前 —— 与 63/67 段那三块牌**同一套位序**。 */
/*__QJ_GEN_BEGIN__*/
const QJ_CHARS = [   /* 逐字 8 行、宽随各字墨宽（行优先 MSB 在前的 1bit） */
  ["iavQqR/UwA==", 7, 8],   /*  1  第  墨高 8 行 */
  ["EAgEZ4kAgEIf", 9, 8],   /*  2  七  墨高 8 行 */
  ["JHR+KvI0Jik=", 8, 8],   /*  3  教  墨高 8 行 */
  ["BIP5wJ/ECA==", 7, 8],   /*  4  学  墨高 8 行 */
  ["QI07HIlTLA==", 7, 8],   /*  5  楼  墨高 8 行 */
];
const QJ_GAPS = [1, 1, 1, 1];   /* 字缝（列） */
/*__QJ_GEN_END__*/

function qjNameW() {                          // 点阵总宽（列）
  let t = 0;
  for (let i = 0; i < QJ_CHARS.length; i++) t += QJ_CHARS[i][1] + (i ? QJ_GAPS[i - 1] : 0);
  return t;
}
/* 与 67 段 j9Glyph 同法：笔画上沿亮金、下沿压暗金（像素画里的"一像素立体"） */
function qjGlyph(g, b64, nw, nh, x, y) {
  const s = atob(b64), bit = (i) => (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  for (let j = 0; j < nh; j++) {
    for (let i = 0; i < nw; i++) {
      if (!bit(j * nw + i)) continue;
      const dn = (j + 1 >= nh) || !bit((j + 1) * nw + i);
      px(g, x + i, y + j, 1, 1, dn ? QJ_C.GOLDD : QJ_C.GOLD);
    }
  }
}

/* --- 5.17.5 砖墙 / 窗 / 灰件 ------------------------------------------------- */
/* 砖纹：本楼是**小砖**（照片上砖缝密），与 30 段那套 8×5 的大砖不同比例 ——
   这里用 6×4、隔行错缝 3。竖缝只画到砖带的顶部与底部之间，不越进灰带。
   ⚠️ 砖缝色（BRD）只比砖面暗 6% —— 照片直方图上根本没有暗色簇，砖缝在这个
      尺度上看不见。第一版压暗 15%，整面墙读成"深色大网格"，比照片闷一档。 */
function qjBrick(g, x, y, w, h) {
  px(g, x, y, w, h, QJ_C.BRI);
  for (let yy = y + 3; yy < y + h; yy += 4) px(g, x, yy, w, 1, QJ_C.BRD);
  for (let yy = y, k = 0; yy < y + h; yy += 4, k++)
    for (let xx = x + (k & 1 ? 3 : 0); xx < x + w; xx += 6) px(g, xx, yy, 1, 3, QJ_C.BRD);
}
/* 一扇窗（**左大扇 + 右窄扇 + 顶部亮子** + 亮框 + 窗台；`bars` = 首层防盗栏）
   ⚠️ 分格样式第二轮改的。第一版做成**三扇等宽**（两条竖挺各在 1/3、2/3），
      与照片并排一看就不对 —— 照片上那扇窗是一大一小（见 _look/_r29_photocrop.png）：
      外框内先一条**竖挺在 ~70%** 处，左边一大扇、右边一条窄扇；两扇**都被一条
      横挺在 ~26% 高处切开**（顶部那条是亮子/气窗）。所以是"横一条通到底、
      竖一条只在下 74% 分扇"，不是三格。 */
function qjWin(g, x, y, w, h, bars) {
  px(g, x - 1, y - 1, w + 2, h + 2, QJ_C.FRM);            // 外框（亮）
  px(g, x + w, y - 1, 1, h + 2, QJ_C.GRD);                // 框右背光
  px(g, x - 1, y + h + 1, w + 2, 1, QJ_C.GRD);            // 框下背光
  px(g, x, y, w, h, QJ_C.GLA);                            // 玻璃
  px(g, x, y, w, 1, "rgba(15,20,28,0.42)");               // 洞口上内侧
  px(g, x, y, 1, h, "rgba(15,20,28,0.30)");               // 洞口左内侧
  px(g, x, y + h - 4, w, 3, "rgba(20,30,44,0.20)");       // 下沿压暗
  const ty = y + Math.round(h * 0.28);                    // 横挺：顶部亮子
  px(g, x, y + 1, w, Math.max(1, ty - y - 1), "rgba(255,255,255,0.22)");  // 亮子反天光
  px(g, x, ty, w, 1, QJ_C.FRM);                           // 横挺通到两边
  px(g, x + Math.round(w * 0.25), ty, 1, h - (ty - y), QJ_C.FRM);   // 下部：窄
  px(g, x + Math.round(w * 0.72), ty, 1, h - (ty - y), QJ_C.FRM);   // 下部：宽 | 窄
  px(g, x + Math.round(w * 0.50), y, 1, ty - y, QJ_C.FRM);          // 亮子中间一挺
  px(g, x - 1, y - 1, w + 2, 1, "rgba(255,255,255,0.55)");// 框上沿提亮
  px(g, x - 2, y + h + 2, w + 4, 2, QJ_C.SILL);           // 窗台
  px(g, x - 2, y + h + 4, w + 4, 1, "rgba(14,18,28,0.26)");
  if (!bars) return;
  px(g, x, y + 2, w, 1, QJ_C.BAR);                        // 防盗栏：横三竖三
  px(g, x, y + Math.round(h / 2), w, 1, QJ_C.BAR);
  px(g, x, y + h - 3, w, 1, QJ_C.BAR);
  px(g, x + Math.round(w / 4), y, 1, h, "rgba(90,93,99,0.75)");
  px(g, x + Math.round(w / 2), y, 1, h, "rgba(90,93,99,0.75)");
  px(g, x + Math.round(w * 0.75), y, 1, h, "rgba(90,93,99,0.75)");
}
/* 灰件（竖柱 / 檐口带 / 灰横带）：左上受光、右下背光，服从 SUN */
function qjGray(g, x, y, w, h, col) {
  px(g, x, y, w, h, col || QJ_C.GRY);
  px(g, x, y, w, 1, "rgba(255,255,255,0.20)");
  px(g, x, y, 1, h, "rgba(255,255,255,0.14)");
  px(g, x + w - 1, y, 1, h, "rgba(14,18,28,0.20)");
  px(g, x, y + h - 1, w, 1, "rgba(14,18,28,0.26)");
}

/* --- 5.17.6 立面总装（只在**新画布**上画） ---------------------------------- */
function qjFront(g, G) {
  const x0 = G.x0, x1 = G.x1, w = G.w;
  /* ① 檐口线（压住 30 段投影线被切掉的那一行）+ 檐口带 */
  px(g, x0 - 3, G.eaveY, w + 6, 2, "#666a72");
  qjGray(g, x0 - 3, G.eaveY + 2, w + 6, G.cope.bot - G.eaveY - 1);
  /* ② 四条砖带（自下而上 1~4 层），窗贴砖带顶端 */
  for (let f = 0; f < 4; f++) {
    const F = G.floor[f];
    qjBrick(g, x0, F.top, w, F.bot - F.top + 1);
  }
  /* ③ 三条细灰横带 + 墙裙 */
  for (const b of G.gband) qjGray(g, x0, b.top, w, b.bot - b.top + 1);
  qjGray(g, x0, G.plin.top, w, G.plin.bot - G.plin.top + 1, QJ_C.PLIN);
  /* ④ 灰竖柱（窗与窗之间的中点），从檐口带下沿通到墙裙上沿。
        ⚠️ 用 `QJ_C.PIL` —— 照片上竖柱（#c5c6ca）**比细灰横带（#a5a8ae）亮一档**，
           两个灰。第一版共用一个 `GRY`，并排一看竖柱整片发闷。 */
  const pil = (a) => {
    for (let i = 0; i + 1 < a.length; i++)
      qjGray(g, Math.round((a[i] + a[i + 1]) / 2 - QJ_PIL_W / 2),
             G.cope.bot + 1, QJ_PIL_W, G.plin.top - G.cope.bot - 1, QJ_C.PIL);
  };
  pil(G.bayL); pil(G.bayR);
  /* ⑤ 窗阵：两翼各 4 个开间 × 4 层；首层带防盗栏 */
  for (const a of [G.bayL, G.bayR]) {
    for (let f = 0; f < 4; f++) {
      for (const cx of a) {
        const x = cx - (QJ_WIN_W >> 1);
        qjWin(g, x, G.floor[f].win, QJ_WIN_W, QJ_WIN_H, f === 0);
      }
    }
  }
  /* ⑥ 空调外机（画在窗之后，压在窗台下方那块砖上） */
  for (const [px0, f] of QJ_AIR) {
    const ax = G.X(px0) - (QJ_AIR_W >> 1), ay = G.floor[f].wbot + 2;
    px(g, ax + 1, ay + 1, QJ_AIR_W, QJ_AIR_H, "rgba(14,18,28,0.26)");         // 投影
    px(g, ax, ay, QJ_AIR_W, QJ_AIR_H, QJ_C.AC);                              // 外壳
    px(g, ax, ay, QJ_AIR_W, 1, "rgba(255,255,255,0.60)");
    px(g, ax, ay + QJ_AIR_H - 1, QJ_AIR_W, 1, QJ_C.ACD);
    px(g, ax + 1, ay + 2, QJ_AIR_W - 2, QJ_AIR_H - 4, QJ_C.ACD);             // 出风格栅
    px(g, ax + 1, ay + 3, QJ_AIR_W - 2, 1, "#7d8189");
    px(g, ax + 1, ay + 5, QJ_AIR_W - 2, 1, "#7d8189");
  }
  /* ⑦ 雨水管（实测三根；画在窗之后，压在砖上） */
  for (const qx of G.pipes) {
    px(g, qx, G.cope.bot + 1, 3, G.plin.top - G.cope.bot - 1, "rgba(14,18,28,0.20)");
    px(g, qx, G.cope.bot + 1, 2, G.plin.top - G.cope.bot - 1, QJ_C.SILL);
    px(g, qx, G.cope.bot + 1, 1, G.plin.top - G.cope.bot - 1, "#eef1f5");
    px(g, qx - 1, Math.round((G.cope.bot + G.plin.top) / 2), 4, 2, QJ_C.GRD);
  }
  /* ⑧ 门楼（**最后画**，压在中间那两跨上 —— 照片上它本来就凸在立面外） */
  qjPorch(g, G);
  /* ⑨ 台阶（落在落地线**以外**，与 30 段同一处理） */
  qjSteps(g, G);
  /* ⑩ 整栋外轮廓 + 接地最深窄带（照 30 段 §3.8） */
  px(g, x0 - 1, G.eaveY + 1, 1, G.baseY - G.eaveY, "#6c6f76");
  px(g, x1, G.eaveY + 1, 1, G.baseY - G.eaveY, "#5c5f66");
  contactBand(g, x0 + 1, x1 - 1, G.baseY - 1, 2, 0.34);
}

/* --- 5.17.6a 门楼（灰色混凝土门厅 + 匾额 + 卷帘门） -------------------------- */
function qjPorch(g, G) {
  const P = G.porch, x0 = P.x, x1 = P.x + P.w, w = P.w, top = P.top;
  const pcx = x0 + w / 2;
  /* ① 顶盖：比两翼檐口高出来那一截 */
  px(g, x0, top, w, G.eaveY - top + 1, QJ_C.PORS);
  px(g, x0, top, w, 2, QJ_C.PORL);                        // 顶面受光
  px(g, x0, top + 2, w, 1, "rgba(255,255,255,0.22)");
  px(g, x0, G.eaveY - 1, w, 2, QJ_C.PORD);                // 顶盖与立面的分界线
  px(g, x0, top, 3, G.eaveY - top + 1, "rgba(255,255,255,0.14)");
  px(g, x1 - 3, top, 3, G.eaveY - top + 1, "rgba(14,18,28,0.16)");
  /* ② 门楼立面：左受光右背光 */
  px(g, x0, G.eaveY + 1, w, G.baseY - G.eaveY - 1, QJ_C.PORS);
  px(g, x0, G.eaveY + 1, 3, G.baseY - G.eaveY - 1, "rgba(255,255,255,0.16)");
  px(g, x1 - 4, G.eaveY + 1, 4, G.baseY - G.eaveY - 1, "rgba(14,18,28,0.18)");
  speckle(g, x0 + 3, G.eaveY + 2, w - 6, G.baseY - G.eaveY - 3,
          "rgba(255,255,255,0.05)", (w / 3) | 0, makeRng(6817));
  /* ③ 每层的横梁线：与两翼的灰横带同高（照片上门楼的横线正对着两翼的灰带） */
  for (const b of G.gband) {
    px(g, x0, b.top, w, 1, "rgba(255,255,255,0.42)");
    px(g, x0, b.bot, w, 1, QJ_C.PORD);
  }
  /* ④ 窗阵：每层"一宽 + 两窄"（实测中央窗 108 px、两侧 60~72 px） */
  const cw = G.X(956) - G.X(848);                         // 中央窗宽（行）
  const sw = 10;                                          // 侧窗宽（行）
  for (let f = 0; f < 4; f++) {
    const y = G.floor[f].win;
    if (f > 0) {
      qjWin(g, Math.round(pcx - cw / 2), y, cw, QJ_WIN_H, false);
      qjWin(g, Math.round(pcx - 25 - sw / 2), y, sw, QJ_WIN_H, false);
      qjWin(g, Math.round(pcx + 25 - sw / 2), y, sw, QJ_WIN_H, false);
    } else {
      /* 首层：门的两侧只留窄窗 */
      qjWin(g, Math.round(pcx - 25 - sw / 2), y + 2, sw, QJ_WIN_H, false);
      qjWin(g, Math.round(pcx + 25 - sw / 2), y + 2, sw, QJ_WIN_H, false);
    }
  }
  /* ⑤ 匾额（板由点阵现算宽，居中） */
  qjPlaque(g, G);
  /* ⑥ 卷帘门（凹进去：先画一圈暗框，再画帘片） */
  const d = G.door;
  px(g, d.x - 3, d.y - 2, d.w + 6, G.baseY - d.y + 2, "#5c6068");            // 门洞暗框
  px(g, d.x - 2, d.y - 1, d.w + 4, G.baseY - d.y + 1, "#3f434a");
  px(g, d.x, d.y, d.w, G.baseY - d.y, QJ_C.SHTR);
  for (let yy = d.y + 2; yy < G.baseY; yy += 4)                              // 帘片横纹
    px(g, d.x, yy, d.w, 1, "rgba(14,18,28,0.26)");
  px(g, d.x, d.y, d.w, 1, "rgba(255,255,255,0.30)");
  px(g, d.x, d.y, 1, G.baseY - d.y, "rgba(255,255,255,0.16)");
  px(g, d.x + d.w - 1, d.y, 1, G.baseY - d.y, "rgba(14,18,28,0.24)");
  px(g, d.x, G.baseY - 3, d.w, 3, "rgba(14,18,28,0.34)");                    // 落地最暗
}
/* 匾额：板宽 = 点阵总宽 + 4，居中；板高 = 点阵高 + 2（上下各留 1 行边）。
   照片上那块匾实测 **x 768..1027 / y 796..829**（260 × 34 照片 px）
   ⇒ 精灵 **37 列 × 8 行**，中轴 X(897.5) = 155 = 门楼中轴 ✓。
   为什么做成 46 × 10：**8 行放不下五个能认出来的汉字**（本轮实测：字高 7 行时
   「第七教学楼」已经糊成一团色块，8 行才认得出）⇒ 板被迫加宽到 46、加高到 10。
   这是"看得清"与"量得准"打架，取看得清（与 67 段「10 字挤 82 px 金匾，糊是物理上限」
   同一条先例），交付说明里报备。 */
function qjPlaque(g, G) {
  const tw = qjNameW();
  const gh = QJ_CHARS[0][2];                               // 点阵高（行），从生成块现读
  const bw = tw + 4, bh = gh + 2;
  const x = Math.round(G.porch.x + G.porch.w / 2 - bw / 2);
  const y = G.baseY - 37;                                  // 照片：板在第 223~230 行
  if (bw > G.porch.w - 10)
    console.warn("68_qijiao: 匾额板 %d 行宽，门楼只有 %d 行 —— 两侧留边不够，" +
                 "重跑 _build/_qjfont.py 或改 QJ_C 的字高", bw, G.porch.w);
  px(g, x + 2, y + 2, bw, bh, "rgba(14,18,28,0.34)");      // 投影（朝右下，服从 SUN）
  px(g, x, y, bw, bh, QJ_C.BOARD);
  px(g, x, y, bw, 1, "#8a4b41");                           // 上沿受光
  px(g, x, y, 1, bh, "#7a4238");
  px(g, x + bw - 1, y, 1, bh, "#4f2a24");
  px(g, x, y + bh - 1, bw, 1, "#43231e");
  px(g, x + 1, y + 1, bw - 2, 1, "rgba(226,184,85,0.45)"); // 内描金线
  px(g, x + 1, y + bh - 2, bw - 2, 1, "rgba(226,184,85,0.30)");
  let gx = Math.round(x + (bw - tw) / 2);
  const gy = y + Math.round((bh - gh) / 2);                // 点阵在板里居中
  for (let i = 0; i < QJ_CHARS.length; i++) {
    qjGlyph(g, QJ_CHARS[i][0], QJ_CHARS[i][1], QJ_CHARS[i][2], gx, gy);
    gx += QJ_CHARS[i][1] + (i < QJ_GAPS.length ? QJ_GAPS[i] : 0);
  }
}
/* 台阶：3 级，自上而下逐级变宽（照 30 段 §3.7 的手感，但宽度取照片的 43 行） */
function qjSteps(g, G) {
  for (let i = 0; i < 3; i++) {
    const sw = G.step.w - i * 3, sx = Math.round(G.step.x + i * 1.5);
    const sy = G.step.y + i * 3;
    px(g, sx, sy, sw, 3, shade(QJ_C.STEP, 0.16 - i * 0.12));
    px(g, sx, sy + 3, sw, 1, "rgba(14,18,28,0.26)");
  }
}

/* --- 5.17.7 撤屋名牌 + 按同一支笔补回板面 ------------------------------------
   30 段 §3.2.9 把屋名牌画在 `eaveY - 8 - sgn.h`（本楼 = 第 87~113 行）+ 一块
   3px 偏移的投影。本段门楼顶升到第 110 行 ⇒ 牌子必须撤（名字在匾额上）。
   撤完**必须补**，否则屋面剩一块疤。

   ⚠️ **补的是 `shade(pal.roof, -0.04)`** —— 30 段 §3.2 板面那一笔（`px(g, x0,
      PADT + 2, w, roofT - 5, shade(roof, -0.04))`）。67 段那一轮拿**本色**去补，
      出图时是一块 117×34 的亮斑（板面 (103,121,135)，本色 (108,127,140)）。
   补完要**把划过这里的三笔重新点一遍**（30 段的板面不是纯色，上面还有分坡脊线
      与两种斑点）：脊线第 3 条在本楼落在第 93 行、x 从 x0+5 到 x0+w-5；
      斑点密度按面积折算（白色 (w/3)|0 与黑色 (w/4)|0 覆盖 30 段那个 250×92 的框）。 */
function qjRoofPatch(g, G, pal) {
  const sgn = makeSign(QJ_NAME);                           // 也为填 `_signCache`（verify.py 数它）
  const sg  = signRect(sgn, G.x0, G.w, G.eaveY);
  if (!sg) { console.warn("68_qijiao: makeSign 没拿到字形 —— 屋名牌那块疤补不出来"); return; }
  const x = sg.x - 2, y = sg.y - 2, w = sg.w + 6, h = sg.h + 6;
  /* 闸：补的框必须整个落在 30 段的板面上（板面 = [PADT+2, PADT+2+roofT-5)） */
  const bTop = QJ_PADT + 2, bBot = QJ_PADT + 2 + G.roofT - 5;
  if (y < bTop || y + h > bBot || x < G.x0 || x + w > G.x1)
    console.warn("68_qijiao: 补板面的框 %d,%d %d×%d 越出了 30 段的板面 [%d,%d)×[%d,%d] —— " +
                 "补出来会是一块异色方块", x, y, w, h, bTop, bBot, G.x0, G.x1);
  px(g, x, y, w, h, shade(pal.roof, -0.04));
  /* 分坡脊线：30 段是 `PADT + round((roofT-12)*j/4) + 6`，j = 1..3 —— 只补压在框里的 */
  for (let j = 1; j <= 3; j++) {
    const ry = QJ_PADT + Math.round((G.roofT - 12) * j / 4) + 6;
    if (ry < y || ry >= y + h) continue;
    px(g, x, ry, w, 1, "rgba(255,255,255,0.08)");
  }
  /* 斑点：按面积折算条数（30 段的框是 250×92），用**局部** RNG ⇒ 不碰建筑序列 */
  const rng = makeRng(6829);
  const k = (w * h) / (250 * 92);
  speckle(g, x, y, w, h, "rgba(255,255,255,0.05)", Math.round((G.w / 3) * k), rng);
  speckle(g, x, y, w, h, "rgba(0,0,0,0.07)", Math.round((G.w / 4) * k), rng);
}

/* --- 5.17.8 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是精灵，
      晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/…/j9Restyle 同一规矩）。
   ⚠️ 本函数**不碰共享 RNG**：两处随机量各用**局部** makeRng（§5.17.6a 的门楼斑点
      6817、§5.17.7 的补板面斑点 6829）。建筑序列与全校园散射流一个数不动。
   ⚠️ 第三个实参照 65/67 段传 `pal` —— 画立面用不上它（照片给的色，见 §5.17.2），
      但**补屋面板面**那一笔要用 `pal.roof`，而 `makeBuilding` 的返回值里没有色号。
   ⚠️ **画布同高**（与 67 段的 153 ≠ 136 不同），但仍换一张新的：旧画布在
      `[baseY, H)` 留着 30 段的旧台阶（第 256~265 行），旧投影也已在第 234~279 行上，
      就地重画会让投影叠第二遍。只搬 `[0, eaveY)` 行 ⇒ 旧立面/旧门/旧台阶/旧投影
      整段不进新画布。`b.ay` 仍是 258（同高 ⇒ 落地线位置一字不变）。 */
function qjRestyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const G = qjGeo(c);
  /* ① 撤屋名牌 + 补板面（改的是**旧画布**的屋面，在搬行之前） */
  qjRoofPatch(g, G, pal);
  /* ② 新画布：只搬旧画布的第 [0, eaveY) 行 */
  const nc = mkCanvas(c.width, G.H), ng = nc.getContext("2d");
  ng.drawImage(c, 0, 0, c.width, G.eaveY, 0, 0, c.width, G.eaveY);
  /* ③ 方向性投影（照 30 段 §3.1，画在立面**之前**，所以只有落地线以下留在画面里）
        + 立面总装 */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  shadowQuad(ng, G.x0 + 2, G.baseY - QJ_SHADOW_H, G.x1 - 2, G.baseY, SHX, SHY, 0.28, 4);
  qjFront(ng, G);
  b.canvas = nc;
  /* ④ 锚点：同高 ⇒ 这一行与改前**逐字节相同**（写出来只为把契约写明） */
  b.ay = G.baseY;
  return b;
}

/* =========================================================

   ## 屋面：照片给的是一张**正立面**，屋顶被透视压扁了 ⇒ 必须自己画立体
   ### 这套投影的"3D 规则"（`_build` 里 30 段定的，这里现推一遍）
   设：`n` = 从南檐口往北的进深，`z` = 高出檐口的高度。屏幕上
        screen_y = eaveY − 0.6·n − z
   即 **进深每 1 个世界像素往屏幕上走 0.6 行，高度每 1 走 1 行**
   （这正是普通楼 `roofT = 0.6 × depth` 的来历：屋面板架在墙顶，整个进深压到 0.6）。
   反解出视线方向 = (n, z) 沿 (1, −0.6) ⇒ **相机在南侧、仰角 31°**。
   ⚠️ 本段第三十二轮起走 `roofFull`（`roofT = depth − wallH0`），**不再是 0.6·depth**
   ⇒ 下面那张屋面的画法要多加一条"撑满屋带"的约束，见 §屋面末尾。

   ### 于是屋面在屏幕上长这样（`wjRoof`，第三十三轮起）
   檐口矩形 `[ex0,ex1] × [PADT, eaveY]`，**正脊是一条南北向的竖线**（列 `cxi = 中轴`）：
        yTop = PADT                        （北端远檐边，远）
        yBot = eaveY                       （南檐口，近）
        YR   = yBot − GA                   （山墙尖 = 正脊的南端，GA = `WJ_GABLE` = 44）
   屏上从上到下：**北端远檐边 → 两个坡面夹一条竖直正脊 → 南端山墙三角 → 南檐口**。
        西坡 = 矩形 [ex0, cxi−2] × [yTop, 减去三角切掉的那块]   ← 受光
        东坡 = 矩形 [cxi+2, ex1] × [同上]                        ← 背光
        正脊 = 3 列的竖条 [cxi−1, cxi+1] × [yTop, YR]
        山墙 = 三角 (ex0,yBot)(ex1,yBot)(cxi,YR)                 ← 最近的那张面
   ⇒ 逐行取"坡 | 脊 | 坡"两段（拱尖以下换成"坡 | 山墙 | 坡"），**每行都被铺满**
     ⇒ 结构上不可能画出缝。
   ⭐ **"铺满整个檐口矩形"是硬要求**：屋带（`roofFull` 给的 426 行）比南北向双坡顶
      真正的投影（`0.6 × 528 + 44 = 361` 行）**高 65 行**，若按真实投影画，顶上那 65 行
      就得留空 ⇒ 正好在 footprint 的北缘露出那条灰石板（= `roofFull` 要修的东西）。
      所以屋面**必须撑满 `[PADT, eaveY]`** —— 本段的做法是把"坡面长度"当成无限，
      只把**山墙三角**钉在 `YR = yBot − GA`。代价：坡面被纵向拉长 ~18%
      （在 214 宽的立面上看不出来），换来的是北缘不露灰石板。

   ### `GA`（山墙高）是**"屋顶看起来多高"的唯一杠杆**，且与进深解耦
   ⭐ 这正是本轮换几何的**全部理由**：攒尖顶的可见高 = `roofT/2 + Hr`，而 `roofT`
      随进深走（352 → 528 时 `roofT` 250 → 426 ⇒ 顶更高了）⇒ **"加长楼"会自动
      "加高屋顶"，用户的两条要求互相打架**。南北向脊把这根耦合**剪断**：
      可见高 = `GA`（44 行），与 `roofT` 无关 ⇒ 进深再长，屋顶也不会变高。
   ⚠️ 上限：`GA` 不能吃掉屋带的三分之一（`GA ≤ roofT/3 = 142`）—— 再高，
      正脊这条"竖线"在屏上就只剩一小段，"延伸到尽头"读不出来了（有闸）。
   ⚠️ 演进：r30 第一版 Hr 64（攒尖）⇒ 用户「比较长的，再向上面延长一些」⇒ 84
      ⇒ r33 用户「现在屋顶太高了，直接给我降低屋顶高度」⇒ **换几何 + 压到 44**。

/* --- 5.18.1 常量 ----------------------------------------------------------- */
const WJ_NAME   = "第五教学楼";              // ⚠️ 必须与 CAMPUS 里的名字逐字相同
const WJ_PADX   = 26, WJ_PADT = 18;          // 与 30 段同值
const WJ_PADB   = 21 + 14;                   // SHY + 14 —— 30 段画布高公式的尾巴
/* ⭐ **墙高 = `WJ_WALL_MUL × FLOOR_H`**，第三十二轮起 `WJ_WALL_MUL = 3`。
   用户逐字：「首先高度降低和七教每层多高对齐」⇒ 每层必须正好 `FLOOR_H = 34` 行
   （七教 `QJ_FLOORS = 4` ⇒ 墙 136 = 4 × 34，本楼 3 × 34 = **102**）。
   ⚠️ **原来的 `WJ_BASE_MUL`（反解 30 段画布高用）第三十二轮删掉了**：
      那时 30 段走的是普通公式（`roofT = 0.6·进深`），画布高里藏着一个"4 层"的墙高，
      所以本段要拿它反解。现在 60 段给本楼开了 `roofFull` ⇒
      `30 段画布高 = PADT + ceil(进深) + PADB`，**里面根本没有墙高**
      ⇒ `depth = 画布高 − PADT − PADB` 一行就够，不需要任何反解常数。
   ⚠️ 立面的每一个构件（檐口/层间带/窗/门/墙裙）都走 `sv = wallH0 / WJ_RISE` 现算
   ⇒ 墙一改，它们**自动等比缩放**，不需要另改任何一处坐标。
      **唯一例外 = `WJ_WIN_H`**（绝对行数，不随 sv 走），见那一条的注释。 */

/* --- 5.18.3 几何：宽锚现算，一处写死 ---------------------------------------- */
function wjGeo(c) {
  /* ⚠️ 顺序要紧：`depth` 必须**先**从 30 段给的画布高推出来，`roofT` 再跟着它走。
     60 段给本楼开了 `roofFull` ⇒ 30 段画布高 = `PADT + ceil(进深) + PADB`
     （那个式子里**没有墙高** —— 这正是第三十二轮能删掉 `WJ_BASE_MUL` 的原因）。 */
  const depth  = c.height - WJ_PADT - WJ_PADB;             // = ceil(进深) = 528
  const wallH0 = WJ_WALL_MUL * FLOOR_H;                    // 102 = 3 × 34（与七教每层齐平）
  const roofT  = depth - wallH0;                           // 426 —— 与两栋体育馆同一条规矩：
                                                           //   屋带 + 墙高 = 进深
                                                           // ⇒ 精灵的实体部分**恰好铺满
                                                           //   自己的 footprint**，北缘
                                                           //   不会露出灰石板
                                                           // ⚠️ 这个数**只影响"坡有多长"**
                                                           //   了，不再影响屋顶"看起来多高"
                                                           //   （那个由 `WJ_GABLE` 单独管）
  const eaveY  = WJ_PADT + roofT;                          // 檐下沿 = 立面顶 = 444
  const baseY  = eaveY + wallH0;                           // 落地线 = 546（= 30 段的 ay，没挪）
  const H      = baseY + WJ_PADB;                          // 自算画布高 = 581（= 30 段的画布高）
  const w      = c.width - WJ_PADX * 2;                    // 立面外框宽 = footprint 宽 = 214
  const sc     = w / WJ_PW;                                // 照片 px → 精灵列（横向）
  const sv     = wallH0 / WJ_RISE;                         // 照片 px → 精灵行（纵向）
  /* 照片 x → 画布列（**两端各取整再相减**：相邻两块才不会差 1px 露缝，30 段的教训） */
  const X = (v) => WJ_PADX + Math.round((v - WJ_PX0) * sc);
  /* 照片 y → 画布行（锚在"屋面压墙顶"那一行上；照片 y 越小越靠上 ⇒ 行越小） */
  const Y = (v) => eaveY + Math.round((v - WJ_GY0) * sv);
  const cx = WJ_PADX + w / 2;                              // 立面中轴 = 133
  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, baseY: baseY,
    x0: WJ_PADX, x1: WJ_PADX + w, w: w, sc: sc, sv: sv, X: X, Y: Y, cx: cx,
    H: H
  };
  const box = (a, b, top, bot) => ({ x0: X(a), x1: X(b) - 1, top: top, bot: bot });
  /* 竖带 —— **只存一套、只有一个方向**，其余（砖带 / 窗行）全部现算。
     ⚠️ 这是第 54 条那个坑的正面防法：两张方向相反的表必然炸（68 段栽过）。 */
  G.under  = { top: eaveY, bot: Y(WJ_COPE_Y[0]) - 1 };       // 檐下暗带（照片 583..598，实测 #25282d）
  G.cope   = { top: Y(WJ_COPE_Y[0]), bot: Y(WJ_COPE_Y[1]) }; // 檐口带（灰）
  G.copeb  = G.cope.bot + 1;                                 // 檐口下缘那道近黑红边（实测 #23060a）
  G.brickT = G.cope.bot + 2;                                 // 砖墙顶行（照片 ~633）
  G.plin   = { top: Y(WJ_PLIN_Y[0]), bot: Y(WJ_PLIN_Y[1]) }; // 墙裙
  G.gnd    = { top: G.plin.bot + 1, bot: baseY - 1 };        // 墙脚外那道**浅**散水（实测 #d8d0ce）
  G.band   = [];
  for (let i = 0; i < 2; i++)                                // 两条层间灰带
    G.band.push({ top: Y(WJ_BAND_Y[i * 2]), bot: Y(WJ_BAND_Y[i * 2 + 1]) });

  G.corner = [[X(WJ_CORNER[0]), X(WJ_CORNER[1]) - 1], [X(WJ_CORNER[2]), X(WJ_CORNER[3]) - 1]];
  G.pil2   = [[X(WJ_PIL2[0]), X(WJ_PIL2[1]) - 1], [X(WJ_PIL2[2]), X(WJ_PIL2[3]) - 1]];
  G.winC   = WJ_WINC.slice();
  G.door   = box(WJ_DOOR_X[0], WJ_DOOR_X[1], Y(WJ_DOOR_Y[0]), Y(WJ_DOOR_Y[1]));

  const rl = X(WJ_RELIEF_X), rr = X(WJ_RELIEF_X + WJ_RELIEF_W) - 1;
  G.relief = [[rl, rr], [Math.round(2 * cx - 1 - rr), Math.round(2 * cx - 1 - rl)]];
  G.pipes  = WJ_PIPE_X.map(X);
  /* 屋面：檐口出挑 4 行（照片 24 px × sc = 4.2）；正脊走**中轴竖线**（南北向，见文件头） */
  G.ov     = 4;
  G.ex0    = G.x0 - G.ov; G.ex1 = G.x1 + G.ov;
  G.cxr    = (G.ex0 + G.ex1) / 2;
  G.cxi    = Math.round(G.cxr);                // 正脊所在**列**（南北向 ⇒ 脊线是竖的）
  G.gable  = WJ_GABLE;                         // 山墙三角的行高
  G.ridgeY = eaveY - G.gable;                  // 山墙尖（= 正脊南端）所在**行**

  /* --- 闸（写在页面里，任何自动验收都读不到 —— 只有出图看得见，第 55 条）--- */
  if (c.height !== WJ_PADT + depth + WJ_PADB)
    console.warn("69_wujiao: 30 段画布高 %d ≠ PADT + 进深 %d + PADB = %d —— 画布高公式变了",
