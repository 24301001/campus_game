                    0, cut + SY_GROW, src.width, src.height - cut);

  /* --- 5.1.2 题字带（照片里就是楼体最顶上这一层）---
     白墙 + 压顶 + 竖向瓷砖缝。缝从 ROOF_Y+6 起，与 §3.5 下半段（90..232）接得上。 --- */
  P(BL, ROOF_Y, BR - BL, WIN_TOP - ROOF_Y, C.WALL);
  P(BL, ROOF_Y, BR - BL, 3, shade(C.WALL, -0.12));          // 压顶阴影线
  P(BL, ROOF_Y + 3, BR - BL, 1, C.WALL_L);                  // 压顶受光
  for (let d = 15; d < (BR - BL) / 2; d += 30) {
    P(GC - d, ROOF_Y + 6, 1, WIN_TOP - ROOF_Y - 6, shade(C.WALL, -0.08));
    P(GC + d, ROOF_Y + 6, 1, WIN_TOP - ROOF_Y - 6, shade(C.WALL, -0.08));
  }
  /* 幕墙顶部收口：原版幕墙从 WIN_TOP-6 起头，比窗顶高 6px 戳进题字带；
     照片里幕墙顶与窗顶齐平。擦除后幕墙自然停在 WIN_TOP，这里补一道顶框。 */
  P(GLASS_L, WIN_TOP, GW, 1, C.GLASS_D);

  /* --- 5.1.3 两侧角亭：墩子 + 竖玻璃槽 + 小攒尖顶 + 尖顶针 ---
     照片里这两座比屋面高约 19% 楼高（≈31 native）、宽占整楼 12.7%（≈34），
     塔身是一条**窄竖玻璃槽**，顶上扣一个比墩略宽的方锥。
     光从左上（与中央攒尖顶一致），两座都取"左缘受光"，不做镜像。 --- */
  function pavilion(x0) {
    const pw = 34, cx = x0 + pw / 2;
    P(x0, 54, pw, 18, C.WALL);                              // 墩身（54..72，压在新屋面上）
    P(x0, 54, pw, 1, "#fff");                               // 压顶
    P(x0, 54, 1, 18, C.WALL_L);                             // 左缘受光
    P(x0 + pw - 1, 54, 1, 18, C.WALL_D);                    // 右缘背光
    /* ⚠️ 玻璃槽是**竖**的。画成横窗带就成了"停车库百叶" —— 那是上一版观感走样的主因。 */
    P(cx - 4, 57, 8, 13, C.WIN_D);                          // 竖玻璃槽
    P(cx - 4, 57, 8, 1, C.WIN_L);                           //   上沿反光
    P(cx - 4, 57, 1, 13, "#2d4a5e");                        //   左槽壁受光
    P(cx + 3, 57, 1, 13, "#0e1a24");                        //   右槽壁背光
    P(cx - 4, 63, 8, 1, "#16242e");                         //   中横档
    P(cx - 17, 53, 34, 1, shade(C.WALL, -0.20));            // 外挑檐口
    for (let i = 0; i < 10; i++) {                          // 小攒尖顶：32px 收到 4px
      const hw = Math.max(2, Math.round(16 - 14 * i / 9));
      P(cx - hw, 52 - i, hw * 2, 1, shade(C.TOWER, 0.12 - i * 0.03));
      P(cx - hw, 52 - i, 1, 1, "#fff");                     //   左坡受光
      P(cx + hw - 1, 52 - i, 1, 1, shade(C.TOWER, -0.16));  //   右坡背光
    }
    P(cx, 40, 1, 3, "#8a8f95");                             // 尖顶针
  }
  pavilion(BL);                                             // 左：60..94
  pavilion(BR - 34);                                        // 右：326..360

  /* --- 5.1.4 中央方锥攒尖顶（底宽 66 + 外挑檐 70）---
     照片量出来底 295px : 高 100px ≈ 2.95:1，是个**扁**的攒尖顶，不是尖塔。
     原版那根直筒宽 26（占楼宽 8.7%），这个 70（23%）—— 差 2.7 倍。
     顶面收成 12 宽的小平顶，给灯笼当基座。 --- */
  P(TX - 35, 70, 70, 2, shade(C.WALL, -0.18));              // 檐口（70 宽，外挑 2）
  P(TX - 35, 70, 70, 1, shade(C.WALL, 0.10));               //   檐上受光
  /* ⚠️ 收分必须**一路收到底**（33 → 9），不能写成 `33*(18-i)/18` 那种——
     那种写法在 i=15 就归到下限，顶上会留出一段"平脖子"，看着像土台不像攒尖顶。
     直线收分才是攒尖顶的样子。 */
  for (let i = 0; i < 21; i++) {
    const hw = Math.round(33 - 24 * i / 20);                // 底 66 宽 → 顶 18 宽
    const y = 69 - i;
    P(TX - hw, y, hw * 2, 1, shade(C.TOWER, 0.10 - i * 0.006));
    P(TX - hw, y, 1, 1, "#fff");                            // 左坡受光
    P(TX + hw - 1, y, 1, 1, shade(C.TOWER, -0.16));         // 右坡背光
    if (hw > 8) {                                           // 两条戗脊
      P(TX - Math.round(hw / 3), y, 1, 1, shade(C.TOWER, 0.05));
      P(TX + Math.round(hw / 3), y, 1, 1, shade(C.TOWER, -0.08));
    }
  }

  /* --- 5.1.4b 锥面正中那扇小窗（照片里锥面下缘正中，带小披檐）---
     底宽 20 native（照片 120px / 1255 = 9.6% → 29 native，这里按 2/3 取，免得锥面被糊满）。
     锥面在 y=62 处半宽还有 25、y=61 处 23，20 宽（±10）加披檐（±12）都装得下。 --- */
  P(TX - 11, 62, 22, 8, "#33424e");                         // 凹龛
  P(TX - 9, 63, 18, 6, "#7c9cb4");                          //   窗面
  P(TX - 9, 63, 18, 1, "#a8c6d8");                          //   上沿反光
  P(TX - 1, 63, 1, 6, "#42586a");                           //   中竖棂
  P(TX - 12, 61, 24, 1, shade(C.TOWER, -0.24));             //   小披檐

  /* --- 5.1.5 灯笼 + 天线针（坐在攒尖顶的小平顶上）---
     照片：圆灯笼（白铁皮 + 一段玻璃）→ 深色圈 → 小穹顶 → 几根细针。
     针被压短了（照片 24 native → 这里 15），理由见文件头。 --- */
  P(TX - 10, 48, 20, 1, shade(C.TOWER, -0.22));             // 灯笼底盘
  P(TX - 8, 39, 16, 10, "#efece6");                         // 灯笼身
  P(TX - 8, 39, 1, 10, "#fff");                             //   左缘受光
  P(TX + 7, 39, 1, 10, shade("#efece6", -0.14));            //   右缘背光
  P(TX - 6, 42, 12, 3, "#8fb2ca");                          //   玻璃段
  P(TX - 6, 42, 12, 1, "#c2dcea");                          //     上沿高光
  P(TX - 9, 38, 18, 1, "#5a6068");                          // 深色圈
  P(TX - 6, 36, 12, 2, "#e6e3dc");                          // 小穹顶
  P(TX - 4, 35, 8, 1, "#e6e3dc");
  const MAST = [[0, 15], [-5, 9], [5, 9], [-9, 5], [9, 5]]; // [横向偏移, 高]
  for (const m of MAST) P(TX + m[0], 35 - m[1], 1, m[1], "#464c53");
  P(TX - 2, 26, 5, 1, "#4a5058");                           // 主针上一道横担

  /* --- 5.1.6 红色毛笔题字「北京交通大学」---
     字形来自 建筑物照片/字体.png（_build/_syfont.py 描成 1bit 点阵，六字共用一把
     比例尺、逐字带 dx/dy，字距与高低错落按原迹）。颜色仍是原题字那支红。
     ⚠️ 位置从"屋面上方 32px 的天空"搬进了题字带里 —— 这是本轮的主因。 --- */
  const ox = Math.round(X(TX) - SY_TW / 2);                 // 以楼体中轴居中
  const oy = Math.round(Y(76));                             // 带内：上留 4、下留 5（native）
  g.fillStyle = C.RED;
  for (const ch of SY_CHARS) {
    const m = syBits(ch[0], ch[1] * ch[2]), nw = ch[1];
    for (let i = 0; i < m.length; i++)
      if (m[i]) g.fillRect(ox + ch[3] + (i % nw), oy + ch[4] + ((i / nw) | 0), 1, 1);
  }

  /* --- 5.1.7 新增的五层（第十五轮：思源主楼加高 SY_ADD_F 层）---
     层高用思源楼自己的 17 native（×1.5 = 25.5 行，同 §3.5.8 的 wH 11 + gY 6），
     5 × 25.5 = 127.5 ⇒ SY_GROW = 128。层界**锚在下接缝**（row 257 = 老墙顶）往上推，
     与下半段严丝合缝；每层往上多摊 0.1 行、五层共 0.5 行，肉眼不可见。
     画法与次序照 §3.5.2 → §3.5.7 → §3.5.8 → §3.5.10，少一步就是"墙上缺根缝"。 --- */
  {
    const R0 = cut + SY_GROW;                               // 257：新老接缝
    const GH = SY_GROW / S;                                 // 新区高（native 单位，×S 恰好回到 128 行）
    const fy = k => Math.round(R0 - k * SY_GROW / SY_ADD_F); // 层界，k = 0..SY_ADD_F（k=0 是下接缝）
    const W1 = 14, H1 = 11, GX = 12;                        // 窗宽 / 窗高 / 列距（native，同 §3.5.8）
    const WSTEP = W1 + GX, WCOLS = 4;
    const RSTART = GLASS_L + GW + 10;                       // 232 = GLASS_R + 10，右半第一列的左缘
    /* §3.5.8 drawWin 的逐笔复刻（只把纵向坐标换成画布行）*/
    const drawWinQ = (x, y) => {
      Q(x, y, W1, H1, C.WIN_D);
      Q(x + 1, y + 1, Math.floor(W1 / 2), 2, C.WIN_L);
      Q(x + 1, y + 1, 2, Math.floor(H1 / 2), shade(C.WIN_L, -0.1));
      Q(x + Math.floor(W1 / 2), y, 1, H1, "#0e141c");
    };
    Q(BL, cut, BR - BL, GH, C.WALL);                        // 墙
    for (let d = 15; d < (BR - BL) / 2; d += 30) {          // 竖缝：与下半段同一条 GC±30 相位
      Q(GC - d, cut, 1, GH, shade(C.WALL, -0.08));
      Q(GC + d, cut, 1, GH, shade(C.WALL, -0.08));
    }
    for (let k = 1; k <= SY_ADD_F; k++)                     // 每层顶一道横缝（同 §3.5.2 的 17 native 节拍）
      Q(BL, fy(k), BR - BL, 1, shade(C.WALL, -0.10));
    Q(GLASS_L, cut, GW, GH, C.GLASS);                       // 幕墙续接
    for (let i = 0; i < GW; i++)                            //   斜向反光（相位照 §3.5.7 的 i % 3）
      Q(GLASS_L + i, cut + i % 3, 1, GH,
        i < GW / 2 ? C.GLASS_HI : shade(C.GLASS_HI, -0.1));
    Q(GLASS_L, cut, GW, 1, C.GLASS_D);                      //   新区顶框（紧贴题字带下沿）
    Q(GLASS_L + GW / 2, cut, 1, GH, C.GLASS_D);             //   中竖梃（同为 §3.5.7 那一笔）
    const MS = Math.round(14 * S);                          // 21：横分格节拍（14 native）
    for (let y = Math.round(Y(WIN_TOP - 6)) + SY_GROW; y >= cut; y -= MS)
      Q(GLASS_L, y, GW, 1, C.GLASS_D);                      //   往上续，与下半段同一条节拍
    for (let k = 1; k <= SY_ADD_F; k++) {                   // 五排窗：右半起头，左半取镜像
      const wy = fy(k);
      for (let cc = 0; cc < WCOLS; cc++) {
        const wx = RSTART + cc * WSTEP;
        if (wx + W1 > BR - 10) continue;
        drawWinQ(wx, wy);
      }
      for (let cc = 0; cc < WCOLS; cc++) {
        const wx = 2 * GC - (RSTART + cc * WSTEP + W1);     // 右列左缘的镜像（同 §3.5.8）
        if (wx < BL + 10) continue;
        drawWinQ(wx, wy);
      }
    }
    Q(BL, cut, 1, GH, C.WALL_D);                            // 左右边缘（§3.5.10 那一笔，画在最后）
    Q(BR - 1, cut, 1, GH, C.WALL_D);
    Q(BL + 1, cut, 1, GH, shade(C.WALL, -0.06));
    Q(BR - 2, cut, 1, GH, shade(C.WALL, -0.06));
  }

  /* --- 5.1.8 收尾：加高后的画布与落地行必须写回精灵对象 ---
     ⚠️ addProp 只认 s.canvas / s.ay；ax / w / h 一概不参与绘制，
        落地线世界 y = 1431.6 因此一动不动，楼只往屏幕上方长高。 --- */
  s.canvas = c;
  s.ay += SY_GROW;
}

/* =========================================================
   5.2 升旗台 —— 思源楼正门正对的草坪凹口
   ---------------------------------------------------------
   用户口述："位置在思源楼那个门正对的草坪，属于草坪靠近路的一侧，
   相当于草坪凹进去一小块；浅灰色底座 + 高高的银色旗杆 + 五星红旗"。

   分四段，调用点全在 60_assemble.js，**顺序缺一不可**：
     ① stampFlagNotch()   —— buildGround() **之前**：把凹口那 5×4 格从草地改成
        K.BLD。这样草地不再长到那里；scatter() 不会往里塞东西（它只认
        GRASS / PLAZA / ROAD / FREE，没有 K.BLD 分支）；treeSpotOK() 也拒绝
        （同样只认 GRASS / PLAZA）。
     ② paintFlagGround()  —— buildGround() **之后**：把凹口铺成浅灰石板。
        必须用覆盖重绘 —— K.BLD 的既有画法是"楼前硬地"（混凝土 + 棕罩），
        那是给 39 栋楼的基座用的，旗台要的是平整的石板地。
     ③ flagStand()        —— 底座 + 旗杆 + 旗面，挂在 §6.5 之后、scatter() 之前
        （addSolid 进了 solids，ptBlocked 才会让散射点与行道树避开台子）。
     ④ animateFlag(dt)    —— 每帧换旗面帧（主循环补丁 4，紧跟 animateWater）。
        **旗面是动的**：见 §5.2.4 的风动模型。

   几何（世界像素）：
     凹口 80×64 = 5×4 个 16px 格，x1984..2063，中轴 2024 = 思源楼门中心 2023.9。
     ⚠️ 凹口北沿取 y1584 而不是草坪的数学起点 1568.5 —— 草坪第一行草格是
        y1584（y1568 那一行被东西主路的路缘石占着，_gt.py 探针实测 '2' 即沥青），
        从 1584 起才是"贴着路边的草"，凹口正好啃在草的第一行上。
   ========================================================= */
const FLAG_CX   = 2024;                                       // 门轴
const FLAG_Z    = { x: 1984, y: 1584, w: 80, h: 64 };         // 草坪凹口
const FLAG_PZ   = { x: 2000, y: 1598, w: 48, t: 28, f: 8 };   // 底座：顶面 48×28 + 南立面 8
const FLAG_FOOT = FLAG_PZ.y + FLAG_PZ.t + FLAG_PZ.f;          // 1634 落地线
const FLAG_BY   = FLAG_PZ.y + FLAG_PZ.t / 2;                  // 1612 杆脚（顶面正中）
const FLAG_PTOP = 1462;                                       // 杆顶（杆净高 150px，是路灯 62px 的两倍半）
const FLAG_FT   = 1464;                                       // 旗面顶
const FLAG_FW = 60, FLAG_FH = 40;                             // 旗面 60×40 = 官方 30×20 单位的 2 倍（星位全整数）
/* 调色：凹口铺装取**偏暖的中灰**，不能取冷浅灰 —— 路对面就是人行道的混凝土
   （#b6b0a3 系）与沥青，凹口若也是冷浅灰，隔着路缘石看过去会连成一片，
   "草坪被挖掉一块"这个形状就没了。底座再用亮一档的浅灰压在暖灰铺装上。 */
const FLAG_PAVE  = "#a39e90", FLAG_PAVE_J = "#8c877a";
const FLAG_BASE_T = "#d2d5d4", FLAG_BASE_F = "#9aa0a1";
const FLAG_POLE_L = "#dee3e5", FLAG_POLE_M = "#b9c0c4";
const FLAG_POLE_D = "#868d92", FLAG_RED = "#cf2b23", FLAG_YEL = "#ffd93b";

/* --- 5.2.1 凹口：把 5×4 格从草地划掉（buildGround 之前调） ---
   ⚠️ stampRectAbs 的 c1 = floor((x+w)/CELL)、r1 = floor((y+h)/CELL) 是**闭区间**，
      传精确宽高会多盖一格：这里会多啃掉东边一列（x2064）与南边一行（y1648）的草。
      所以必须传 w-1 / h-1。 */
function stampFlagNotch() {
  stampRectAbs(FLAG_Z.x, FLAG_Z.y, FLAG_Z.w - 1, FLAG_Z.h - 1, K.BLD);
}

/* --- 5.2.2 凹口铺装（buildGround 之后调，传 groundCanvas 的 2d context） --- */
function paintFlagGround(g) {
  /* 独立种子：buildGround 已经跑完了，这里的 rng 不会扰动它那条序列 */
  const rng = makeRng(20260913);
  const Z = FLAG_Z, x1 = Z.x + Z.w, y1 = Z.y + Z.h;

  /* ① 石板 16px 见方：缝色打底 + 逐块色差（与 paintPlazas 同一手法，尺寸改小） */
  px(g, Z.x, Z.y, Z.w, Z.h, FLAG_PAVE_J);
  for (let y = Z.y; y < y1; y += 16) {
    for (let x = Z.x; x < x1; x += 16) {
      const k = (rng() - 0.5) * 0.07;
      px(g, x, y, 15, 15, shade(FLAG_PAVE, k));
      px(g, x, y, 15, 1, shade(FLAG_PAVE, k + 0.10));               // 上棱受光
      px(g, x, y + 14, 15, 1, "rgba(14,18,28,0.10)");               // 下棱背光
      if (rng() < 0.16) px(g, x + 3 + rng() * 9, y + 3 + rng() * 9, 2, 2, "rgba(14,18,28,0.09)");
    }
  }
  /* ② 三面石缘：把凹口与草坪的硬边收成"修过的边"。北面不砌 ——
        东西主路的路缘石（paintKerbs 画的，y1581..1583）已经在那一侧了。 */
  const R = 3;
  px(g, Z.x, Z.y, R, Z.h, KERB_TOP);                                // 西缘（受光侧）
  px(g, Z.x + R, Z.y, 1, Z.h, KERB_DARK);
  px(g, x1 - R, Z.y, R, Z.h, KERB_LIT);                             // 东缘（背光侧）
  px(g, x1 - R - 1, Z.y, 1, Z.h, KERB_DARK);
  px(g, Z.x, y1 - R, Z.w, R, KERB_LIT);                             // 南缘
  px(g, Z.x, y1 - R - 1, Z.w, 1, KERB_DARK);
  /* ③ 版缘外的过渡带：西缘（迎光侧）走 paintDirt 的土色，与草地的其它硬地边界一致；
        东、南两缘（背光侧）改压一道暗绿的"切口"—— 草面比挖下去的地坪高，
        这两条边正是光被挡住的地方。这一笔是"凹"能读出来的关键。 */
  const band = mix(DIRT, GRASS_RAMP[1], 0.55);
  const cut  = mix(shade(GRASS_RAMP[0], -0.26), DIRT, 0.32);
  px(g, Z.x - 2, Z.y, 2, Z.h + 2, band);
  px(g, x1, Z.y, 2, Z.h + 2, cut);
  px(g, Z.x - 2, y1, Z.w + 4, 2, cut);
}

/* --- 5.2.3 五角星：逐列扫描线（内半径 = R·0.382 是正五角星的经典比例） ---
   `rot` 是整颗星的旋转角：大星 0（一个角朝天），四颗小星各自转向大星中心
   （国旗的官方画法），所以参数不能省。 */
function starPts(cx, cy, R, rot) {
  const p = [], r = R * 0.382;
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rad = (i % 2) ? r : R;
    p.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
  }
  return p;
}
/* 星心落在画布 (cx, cy)；x0c = 旗面左沿的画布 x，用来找这颗星各列在布上的位置 */
function starFill(g, x0c, cx, cy, R, rot, col, t) {
  const p = starPts(cx, cy, R, rot);
  for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
    const xs = x + 0.5, hit = [];
    for (let i = 0, j = 9; i < 10; j = i++) {
      const a = p[i], b = p[j];
      if ((a[0] > xs) !== (b[0] > xs))
        hit.push(a[1] + (b[1] - a[1]) * (xs - a[0]) / (b[0] - a[0]));
    }
    if (hit.length < 2) continue;
    hit.sort((u, v) => u - v);
    /* ⚠️ 必须与布面同一列、调**同一个 clothDY**、且列号**不带 +0.5** ——
       差半列就会在 round 的边界上与布面差 1px，旗一动星星就像浮在旗子前面。 */
    const dy = clothDY(x - x0c, t);
    for (let i = 0; i + 1 < hit.length; i += 2) {                    // 逐对取区间（凹角列会有两段）
      const ya = Math.round(hit[i]), yb = Math.round(hit[i + 1]) - 1;
      if (yb >= ya) px(g, x, ya + dy, 1, yb - ya + 1, col);
    }
  }
}

/* --- 5.2.4 风动：旗面波动 ---
   旗面**不烘焙进台身精灵**，而是按一个完整周期切成 FLAG_FRAMES 张，运行时逐帧换
   `prop.img` —— 换帧是零成本、且同尺寸换图不影响深度排序/缩放（渲染循环直接取
   `p.img.width`）。比放"地面之后、道具之前"那个动态层好：那样旗面会永远压在
   所有道具下面，人从杆前走过时杆身上半截在旗后、下半截在旗前，穿帮。 */
const FLAG_FRAMES = 16;     // 一个波动周期 16 帧
const FLAG_CYCLE  = 0.72;   // 一个周期 0.72s ≈ 22 帧/秒：抖得起来又不闪
const FLAG_GUST   = 0.45;   // 阵风幅度（±45% 速度）。周期 2π/0.55 ≈ 11s
const FLAG_TAU = Math.PI * 2;

/* 布面第 r 列在相位 t∈[0,1) 的上下位移。两股叠加，**各自都以 1 为周期** ——
   只要有一股不是整周期，第 15 帧转回第 0 帧就会跳一下：
     · 行波：沿旗面向东传播；摆幅按 u² 涨，贴着杆那几列几乎钉死（真旗子就是这样）
     · 驻波：整幅轻晃、与行波不同相 → 各列振幅不均，出现个别"抽得凶"的点
   ⚠️ 星星也必须调这个函数取 dy，否则布一抖星星就从旗面上浮起来。 */
function clothDY(r, t) {
  const u = r / FLAG_FW;
  return Math.round((0.7 + 2.5 * u * u) * Math.sin((u - t) * FLAG_TAU)
                    + 1.6 * u * Math.sin((t + 0.15) * FLAG_TAU));
}
/* 褶皱明暗：与行波同相才像布（不同相 = 光比皱纹跑得快，读起来像贴纸）。
   振幅同样随 u 涨 —— 自由端的褶子更深。 */
function clothTone(r, t) {
  const u = r / FLAG_FW;
  return (0.05 + 0.07 * u) * Math.cos((u - t) * FLAG_TAU + 0.9);
}

/* 旗面 + 五星。t = 相位；`fx/fy` 是旗面左上角（杆侧、静止位）。 */
function flagCloth(g, t) {
  const fx = FLAG_CX + 1, fy = FLAG_FT, x0c = flagX(fx);
  for (let r = 0; r < FLAG_FW; r++) {
    const dy = clothDY(r, t), k = clothTone(r, t);
    px(g, flagX(fx + r), flagY(fy + dy), 1, FLAG_FH, shade(FLAG_RED, k));
    px(g, flagX(fx + r), flagY(fy + dy), 1, 1, shade(FLAG_RED, k + 0.22));               // 上沿卷边受光
    px(g, flagX(fx + r), flagY(fy + dy + FLAG_FH - 2), 1, 2, shade(FLAG_RED, k - 0.24)); // 下沿背光
  }
  /* 星按官方 30×20 单位排版 ×2：大星心 (10,10) R6；四小星心 (20,4) (24,8) (24,14) (20,18)
     R2，各自的角都指向大星中心。星心给的是**静止位**，逐列的 dy 由 starFill 内部补，
     图案于是跟着布一起被揉动。 */
  const bx = flagX(fx + 10), by = flagY(fy + 10);
  starFill(g, x0c, bx, by, 6, 0, FLAG_YEL, t);
  for (const s of [[20, 4], [24, 8], [24, 14], [20, 18]]) {
    const sc = flagX(fx + s[0]), sr = flagY(fy + s[1]);
    starFill(g, x0c, sc, sr, 2, Math.atan2(by - sr, bx - sc) + Math.PI / 2, FLAG_YEL, t);
  }
}

/* --- 5.2.5 升旗台精灵：浅灰底座 + 银色旗杆 + 五星红旗 ---
   锚点约定与其它道具一致（ax/ay = 精灵内到"底部中心"的偏移），baseY 由调用点给。
   拆成两级：**台身**（投影 + 底座 + 杆 + 顶球，刚性、与风无关）只画一次，
   逐帧 `drawImage` 复制过去，再叠当帧的旗面。 */
const FLAG_CV_X0 = 1992, FLAG_CV_Y0 = 1450, FLAG_CV_W = 108, FLAG_CV_H = 214;  // 内容 x1996..2093 / y1454..1659
const flagX = v => v - FLAG_CV_X0, flagY = v => v - FLAG_CV_Y0;                // 世界 → 画布

function flagStandBody() {
  const PZ = FLAG_PZ, x1 = PZ.x + PZ.w;
  const c = mkCanvas(FLAG_CV_W, FLAG_CV_H), g = c.getContext("2d");

  /* ① 方向性投影：服从全局 SUN(-0.60,-0.80) → 影子朝右下。
        ⚠️ 拉伸量取 (8,10) 而不是楼用的 (16,21)：楼是几十米高，这是抬起来一层
           台阶（≈1m），影子拉长一倍会在石板地上切出一道很硬的斜边，
           读起来像贴图错误而不是投影 —— 这里要的是"平台周围一圈暗"，不是投影。 */
  shadowQuad(g, flagX(PZ.x), flagY(PZ.y), flagX(x1), flagY(FLAG_FOOT), 8, 10, 0.26, 4);

  /* ② 顶面 48×28 浅灰石板：8px 板缝（磨光花岗岩的分块），四缘按 SUN 分明暗 */
  const tY = PZ.y;
  px(g, flagX(PZ.x), flagY(tY), PZ.w, PZ.t, FLAG_BASE_T);
  for (let y = tY + 8; y < tY + PZ.t; y += 8)
    px(g, flagX(PZ.x) + 1, flagY(y), PZ.w - 2, 1, "rgba(14,18,28,0.07)");
  for (let x = PZ.x + 8; x < x1; x += 8)
    px(g, flagX(x), flagY(tY) + 1, 1, PZ.t - 2, "rgba(14,18,28,0.05)");
  px(g, flagX(PZ.x), flagY(tY), PZ.w, 1, shade(FLAG_BASE_T, 0.26));              // 北缘受光
  px(g, flagX(PZ.x), flagY(tY), 1, PZ.t, shade(FLAG_BASE_T, 0.14));              // 西缘受光
  px(g, flagX(x1) - 2, flagY(tY), 2, PZ.t, shade(FLAG_BASE_T, -0.22));           // 东缘背光
  px(g, flagX(PZ.x), flagY(tY + PZ.t) - 1, PZ.w, 1, shade(FLAG_BASE_T, -0.16));

  /* ③ 南立面 8px：顶棱提亮、底部压暗，竖缝与顶面同格 */
  const fY = tY + PZ.t;
  px(g, flagX(PZ.x), flagY(fY), PZ.w, PZ.f, FLAG_BASE_F);
  px(g, flagX(PZ.x), flagY(fY), PZ.w, 1, shade(FLAG_BASE_F, 0.44));
  px(g, flagX(PZ.x), flagY(fY + PZ.f - 2), PZ.w, 2, shade(FLAG_BASE_F, -0.28));
  for (let x = PZ.x + 8; x < x1; x += 8)
    px(g, flagX(x), flagY(fY + 1), 1, PZ.f - 3, "rgba(14,18,28,0.09)");
  contactBand(g, flagX(PZ.x) + 1, flagX(x1) - 1, flagY(FLAG_FOOT) - 1, 1, 0.24);     // 接地最深窄带

  /* ④ 杆脚套环：杆是插在台面上的，没有这一圈就只是"一根线贴在石头上" */
  px(g, flagX(FLAG_CX) - 3, flagY(FLAG_BY) - 2, 7, 3, FLAG_POLE_D);
  px(g, flagX(FLAG_CX) - 3, flagY(FLAG_BY) - 2, 7, 1, FLAG_POLE_L);

  /* ⑤ 杆身：3px 宽，左列高光、右列背光；两道箍把它从"塑料棍"救回来 */
  const pH = FLAG_BY - FLAG_PTOP;
  px(g, flagX(FLAG_CX) - 1, flagY(FLAG_PTOP), 3, pH, FLAG_POLE_M);
  px(g, flagX(FLAG_CX) - 1, flagY(FLAG_PTOP), 1, pH, FLAG_POLE_L);
  px(g, flagX(FLAG_CX) + 1, flagY(FLAG_PTOP), 1, pH, FLAG_POLE_D);
  for (const yy of [FLAG_PTOP + 44, FLAG_PTOP + 96]) {
    px(g, flagX(FLAG_CX) - 1, flagY(yy), 3, 2, FLAG_POLE_D);
    px(g, flagX(FLAG_CX) - 1, flagY(yy), 3, 1, FLAG_POLE_L);
  }

  /* ⑥ 顶球：三层同心，高光偏左上（球是这一整根杆唯一的"体积"） */
  const ballY = FLAG_PTOP - 4;
  circlePx(g, flagX(FLAG_CX), flagY(ballY), 3, FLAG_POLE_D);
  circlePx(g, flagX(FLAG_CX) - 1, flagY(ballY) - 1, 2, FLAG_POLE_M);
  px(g, flagX(FLAG_CX) - 2, flagY(ballY) - 2, 1, 1, FLAG_POLE_L);

  return c;                       // 旗面不在这里画 —— 见 §5.2.4 flagCloth
}

/* --- 5.2.6 全帧烘焙 + 换帧 ---
   台身画一次，逐帧复制过去再叠当帧旗面：16 张 108×214 的离屏画布共约 1.5 MB，
   烘焙多花几毫秒，逐帧开销却与静态版**完全一样**（一次 drawImage）。 */
const flagFrames = [];
function flagStand() {
  const body = flagStandBody();
  for (let i = 0; i < FLAG_FRAMES; i++) {
    const c = mkCanvas(FLAG_CV_W, FLAG_CV_H), g = c.getContext("2d");
    g.drawImage(body, 0, 0);
    flagCloth(g, i / FLAG_FRAMES);
    flagFrames.push(c);
  }
  return { canvas: flagFrames[0], ax: FLAG_CX - FLAG_CV_X0, ay: FLAG_FOOT - FLAG_CV_Y0 };
}

/* --- 5.2.7 风动节拍（每帧，由主循环补丁 4 在 animateWater 之后调用） ---
   `flagProp` 惰性取一次（props 里带 tag "flag" 的那件），之后换 p.img 即可：
   帧尺寸全等，深度排序只看 baseY、落笔只看 img.width/height，两者都不受影响。 */
let flagT = 0, flagPhase = 0, flagFrameI = -1, flagProp = null;
function animateFlag(dt) {
  if (!flagProp) { flagProp = props.find(p => p.tag === "flag"); if (!flagProp) return; }
  /* ⚠️ dt 可以是负的：主循环的 `last = performance.now()` 在**整页烘焙之后**才求值，
     而 rAF 首帧的 now 有可能比它小（时基倒挂）—— `Math.min(0.05, 负数)` 只夹上界，夹不住。
     NaN（now 缺失）也一并挡掉。负 dt 本身只倒退一帧就走出来了，但下面的相位是**累积**的，
     一旦变负要爬几十帧才回正，而取模会**立刻**越界（见下面那道闸）。 */
  if (!(dt > 0)) dt = 0;
  flagT += dt;
  /* 阵风：速度按 ~11s 周期在 55%~145% 之间起伏。累积的是**相位**而不是帧号 ——
     直接拿帧号乘阵风系数会在阵风转向时倒退、旗子一顿一顿的。 */
  flagPhase += dt / FLAG_CYCLE * (1 + FLAG_GUST * Math.sin(flagT * 0.55)) * FLAG_FRAMES;
  /* ⚠️⚠️ JS 的 % 对负数返回负数：flagPhase < 0 时 Math.floor(-22.02) % 16 = -7（不是 9），
     flagFrames[-7] 是 undefined；写进 flagProp.img 之后**下一帧** render 就死在
     `p.img.width` 上，而异常抛在 requestAnimationFrame(loop) **之前** → rAF 断链 →
     整个页面永久定格（2026-09-13 在 Edge 127 上实测复现，Chrome 因首帧时基不同而没露头）。
     所以索引自己夹正，不指望上游把 dt 喂干净。 */
  const i = ((Math.floor(flagPhase) % FLAG_FRAMES) + FLAG_FRAMES) % FLAG_FRAMES;
  /* 最后一道闸：img 一旦被写成 undefined 就是**整页死**，代价和"这一帧不换旗面"
     完全不对称，所以取不到就宁可跳过也不写。 */
  if (i !== flagFrameI) { flagFrameI = i; if (flagFrames[i]) flagProp.img = flagFrames[i]; }
}

/* --- 5.2.8 旗杆净空 ---
   散射与行道树都是"各摆各的"：台子东南侧、路北侧都可能长出树，树冠（最宽 86、
   最高 104）一盖就把杆身或旗面糊掉。台子自己只挡住了凹口那一小块，管不到外围。
   ⚠️ 必须排在 §6.6c 的 clearPropTreeClash() **之后** —— 先跑会改变它保留/丢弃的
      集合，clashDropped 的计数跟着变，验收数字就对不上了。 */
const FLAG_CLR = { x: 1996, y: 1443, w: 98, h: 197 };        // 底座 + 杆身 + 旗面
function clearFlagClearance() {
  const C = FLAG_CLR, cx1 = C.x + C.w, cy1 = C.y + C.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* 旗杆自己保留；宽 > 110 的当楼处理（楼的美术盒整个在落地线以北，
       且这一片的楼是思源楼，落地线 1431.6 在净空区之外） */
    if (p.tag === "flag" || p.img.width > 110) { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    if (x0 < cx1 && x0 + p.img.width > C.x && y0 < cy1 && y0 + p.img.height > C.y) {
      dropped++;
      continue;
    }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* =========================================================
   5.3 齿轮铁砧雕塑 —— 思源楼正门前、草坪南缘的凹口
   ---------------------------------------------------------
   用户口述："思源楼下边的草坪，升旗台是在草坪上边那个边，雕塑则是在草坪下边
   那个边，紧挨着从南门延伸过来的水泥路，也是靠近路挖一块地方，类似于草坪凹陷
   进去。"

   造型依据两张现场照片（_photo/diaosu.jpg 手机相册截图 / siyuanlou2.jpg 正面美图），
   自下而上六层。**一层都不是校徽** —— 用户口中的"校徽"实为齿轮（校徽的核心元素
   正是齿轮），实物是"大齿轮环 + 环心一个铁砧"的机械主题雕塑：
     ① 环形红花坛（红花草），外缘一圈深红陶盆向日葵
     ② 双层圆形石台基（黄绿锈石，顶面是**水盆**，柱间有喷泉 —— 第一版省略了，
        2026-09-13 第六轮按用户要求补上，见 §5.3.4b diaJet）
     ③ 四根浅灰圆柱（2×2 四角排列）
     ④ 方形台座：顶面板 + 南立面，立面上**一排圆孔**
     ⑤ 铁砧：喇叭形砧座 → 横置砧体（右端出"喙"）→ 砧体上两块方柱 + 两块斜方料
        + 砧座前沿斜插一根细杆
     ⑥ 大齿轮环：外圈 24 个三角齿，环体较细，右侧垂一小段起重链

   分四段，调用点全在 60_assemble.js，**顺序缺一不可**（与 §5.2 升旗台同构）：
     ① stampDiaNotch()     —— buildGround() **之前**：凹口那 7×6 格从草地改成
        K.BLD。草地不再长过去；scatter() 不会往里塞东西（它只认 GRASS / PLAZA /
        ROAD / FREE，没有 K.BLD 分支）；treeSpotOK() 同样拒绝。
     ② paintDiaGround()    —— buildGround() **之后**：覆盖重绘凹口铺装。
        K.BLD 的既有画法是"楼前硬地"，那是给 39 栋楼基座用的，这里要平整石板。
     ③ diaStand()          —— 雕塑精灵，挂在 §6.5b 之后、scatter() 之前
        （addSolid 进了 solids，ptBlocked 才会让散射点与行道树避开它）。
     ④ clearDiaClearance() —— 净空清树，**必须**排在 §6.6c 冲突清理之后。

   几何（世界像素）：
     凹口 112×96 = 7×6 个 16px 格，x1968..2079，中轴 2023.5 ≈ 2024 = 思源楼门中心，
     与升旗台 FLAG_CX 同轴。北沿 y1776、南沿 y1871 = 大草坪**最后一行草格**
     （草坪南缘的数学线是 y1875，草格到 1871 为止，凹口正好啃在草的最后一行上，
     下缘直接贴住草坪南横路）。
     ⚠️ x 取 1968 而不是 1976：stampRectAbs 的 c0 = floor(x/CELL) 是**闭区间起点**，
        1976/16 = 123.5 会从第 123 格（x1968）起算，白啃西边半格；起点取 16 的
        整倍数才严丝合缝（升旗台的 1984 同理）。
     ⚠️ 凹口与旗台凹口（y1584..1647）之间还留着 y1648..1775 共 128px 连续的草，
        草坪不会被两个凹口拦腰截断。
   ========================================================= */
const DIA_CX    = 2024;                                   // 门轴，与 FLAG_CX 同轴
const DIA_Z     = { x: 1968, y: 1776, w: 112, h: 96 };    // 草坪凹口 7×6 格
const DIA_FOOT  = 1854;                                   // 花坛外缘南端 = 落地线

/* --- 自下而上的高度表（世界 y；2.5D 俯角约 30°，圆的投影比 1.71:1） ---
   每个圆都是椭圆：水平直径 d → 屏幕上 rx = d/2、ry = d/(2·1.71)。*/
const DIA_FLW_CY = 1832;                                  // 花坛环心
const DIA_FLW_RX = 38, DIA_FLW_RY = 22;                   // 花坛外缘 76×44
/* 花坛内缘 = 石台基外径：红环直接顶到石台上，中间不留缝。
   环宽 20×11（水平×垂直）—— 照片里红花是一大片而不是一圈细边，内径不能给大。 */
const DIA_FLW_IX = 18, DIA_FLW_IY = 11;                   // 花坛内缘 —— 即石台基顶面椭圆
/* ⚠️ 石台基的高度直接吃掉花坛**北侧**那一圈红：顶面中心 = 花坛环心 − h，
   顶面北缘 = 花坛环心 − h − ry，而红环北侧的可见宽度 = 22 − h − ry。
   h=8 时只剩 3px，花坛看过去就是"下半圈红、上半圈全被石台盖住"。
   h=5 留出 6px，北侧那圈红才读得出来。 */
const DIA_PL_H   = 5;                                     // 石台基侧壁高
/* 柱是**一排 4 根**、不是 2×2 四角 —— 照片（diaosu.jpg 放大图）里能同时看到
   四根柱子横排，而 2×2 在正前方视角下后排会被前排完全遮死，只剩两根。
   一排 4 根则任何视角都数得出四根，且与"四根柱顶一块方板"的结构吻合。 */
const DIA_COL_H  = 26, DIA_COL_W = 5;                     // 圆柱：高 26、径 5（照片里柱子是细高的）
const DIA_COL_GAP = 10;                                   // 柱间距：4 根跨 30px，落在 34px 的台座里
const DIA_COL_FOOT = 1833;                                // 柱脚 y：踩在石台基顶面椭圆上（1816..1838）
const DIA_PED_W  = 34, DIA_PED_T = 13, DIA_PED_F = 6;     // 台座：宽 34 / 顶面投影 13 / 立面 6（薄板）
const DIA_PED_FOOT = DIA_COL_FOOT - DIA_COL_H;            // 1807 = 台座底面南沿 = 柱顶
const DIA_PED_TY   = DIA_PED_FOOT - DIA_PED_F - DIA_PED_T;// 1788 = 台座顶面北沿
const DIA_ANV_BY = 1793, DIA_ANV_H = 9;                   // 砧座底面中心 y / 高
/* 齿轮环心抬到 1771：环心 1775 时环的下半（1785..1797）正好压进台座顶面
   （1785..1798），屏幕上就只剩"两段弧挂在台座上方"。抬 4px 后只被台座咬掉
   6px，露出 86% —— 与照片里"齿轮基本整个露出、只有下缘被砧座挡住"一致。 */
const DIA_GEAR_CY = 1771, DIA_GEAR_R = 22, DIA_GEAR_T = 4;// 齿轮环心 / 外半径 / 环体厚

/* 调色。铁件取**深锈褐**（比纯黑暖，照片里是铸铁生锈的暗褐灰）；
   石件取米白偏灰；花坛取三档红 —— 全比升旗台的浅灰底座暗一档，
   两处凹口隔着 128px 的草相望，深浅拉开才不会看成同一处。 */
const DIA_FLW_D = "#7e2b25", DIA_FLW_M = "#b0433a", DIA_FLW_L = "#d4685a";
const DIA_POT   = "#8f4630";                              // 红陶盆（向日葵盆）
const DIA_PL_L  = "#9fab7c", DIA_PL_M = "#828e5f", DIA_PL_D = "#5f6a44";  // 石台基：黄绿锈石
/* 石台基顶面是**水盆**（2026-09-13 第六轮加喷泉时改）。⚠️ 直接用湖水的
   #2E6E9E / #7FB4D8（见 45_water.js paintWaterBase）而不是另调一套蓝 ——
   同一个校园里的水必须是同一个色，这里读得出是水，靠的就是"和明湖一样"。 */
const DIA_WAT_D = "#1c4a70", DIA_WAT_M = "#2E6E9E", DIA_WAT_L = "#7FB4D8";
const DIA_COL_L = "#e4e1d8", DIA_COL_M = "#cac7bc", DIA_COL_D = "#9c998e";// 圆柱
/* ⚠️ 颜色名避开 DIA_PED_T / DIA_PED_F —— 那两个已经是"台座顶面投影高 / 立面高"
   的几何常量（上面高度表里），同名会直接 SyntaxError: already been declared，
   而且是**加载期**抛，整页 JS 全灭。 */
const DIA_PED_TOP = "#d1cec4", DIA_PED_SIDE = "#b4b1a6";                   // 台座：顶面 / 南立面
const DIA_IR_L  = "#5f544a", DIA_IR_M = "#463d36", DIA_IR_D = "#2b2520";   // 铸铁
/* 围栏石：**浅棕**。⚠️ 石头必须比铺装（FLAG_PAVE 暖中灰 #a39e90）明显偏黄 ——
   只暗一点点会读成"地砖脏了一块"，偏黄才读得出是另一种材质。 */
const DIA_ST_L  = "#d8b88c", DIA_ST_M = "#bd9865", DIA_ST_D = "#8d6f49";

/* ⚠️ 铺装**故意复用升旗台的调色常量**（FLAG_PAVE / FLAG_PAVE_J）而不是另起一套：
   两处都是"草坪被挖掉一块"，用同一材质是最省事也最一致的读法。52_flag.js 排在
   本文件之前，顶层 const 同处一个全局词法环境，直接引即可。 */

/* --- 椭圆工具：逐行扫描线。rx/ry 是**半轴**，与 canvas 的 arc 无关 ---
   ⚠️ 每行都过 Math.max(1, ...)：rx 衰减到 0 的那一两行若不兜底，
      会画出零宽 fillRect（静默无事）或负宽（Chrome 直接忽略），都不报错但缺像素。 */
function ellipPx(g, cx, cy, rx, ry, col) {
  if (!(rx > 0) || !(ry > 0)) return;
  for (let y = Math.ceil(cy - ry); y <= Math.floor(cy + ry); y++) {
    const s = 1 - ((y - cy) / ry) ** 2;
    if (s <= 0) continue;
    const hw = rx * Math.sqrt(s), x0 = Math.round(cx - hw);
    px(g, x0, y, Math.max(1, Math.round(cx + hw) - x0), 1, col);
  }
}
/* 椭圆环：逐行只落左右两段 */
function ellipRing(g, cx, cy, rx, ry, irx, iry, col) {
  if (!(rx > 0) || !(ry > 0)) return;
  for (let y = Math.ceil(cy - ry); y <= Math.floor(cy + ry); y++) {
    const s = 1 - ((y - cy) / ry) ** 2;
    if (s <= 0) continue;
    const hw = rx * Math.sqrt(s), xl = Math.round(cx - hw), xr = Math.round(cx + hw);
    const u = 1 - ((y - cy) / iry) ** 2;
    if (!(u > 0)) { px(g, xl, y, Math.max(1, xr - xl), 1, col); continue; }
    const ihw = irx * Math.sqrt(u), il = Math.round(cx - ihw), ir = Math.round(cx + ihw);
    if (il > xl) px(g, xl, y, il - xl, 1, col);
    if (xr > ir) px(g, ir, y, xr - ir, 1, col);
  }
}

/* --- 凸四边形工具：逐行求与四边的交点，取左右两端。硬边、无抗锯齿 ---
   ⚠️ 不用 canvas 的 translate/rotate 画旋转矩形：那条路会出抗锯齿的半透明边界像素，
      与全场"就近邻硬边"画风不一致（整只精灵 1:1 贴上去时那几颗半透明格子看得见）。
   参数 P 是**屏幕空间**的四个顶点，顺时针或逆时针都行。 */
function quadScan(P, cb) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of P) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const xs = [];
    for (let i = 0; i < 4; i++) {
      const A = P[i], B = P[(i + 1) % 4];
      if ((A[1] <= y && B[1] > y) || (B[1] <= y && A[1] > y))
        xs.push(A[0] + (y - A[1]) * (B[0] - A[0]) / (B[1] - A[1]));
    }
    if (xs.length < 2) continue;
    xs.sort((p, q) => p - q);
    const xa = Math.round(xs[0]), xb = Math.round(xs[xs.length - 1]);
    if (xb > xa) cb(y, xa, xb);
  }
}
function quadPx(g, P, col) {
  quadScan(P, (y, xa, xb) => px(g, xa, y, xb - xa, 1, col));
}
/* 只把四边形**每列最上面那一颗**换成亮色 = 一道 1px 的受光顶棱（SUN 在西北） */
function quadLit(g, P, col) {
  const top = new Map();
  quadScan(P, (y, xa, xb) => {
    for (let x = xa; x < xb; x++) if (!top.has(x) || y < top.get(x)) top.set(x, y);
  });
  for (const [x, y] of top) px(g, x, y, 1, 1, col);
}

/* --- 5.3.1 凹口：把 7×6 格从草地划掉（buildGround 之前调） ---
   ⚠️ stampRectAbs 的 c1 = floor((x+w)/CELL) 是**闭区间**，传精确宽高会多盖一格
      （东边多一列、南边多一行）。必须传 w-1 / h-1 —— 与 §5.2.1 同款坑。 */
function stampDiaNotch() {
  stampRectAbs(DIA_Z.x, DIA_Z.y, DIA_Z.w - 1, DIA_Z.h - 1, K.BLD);
}

/* --- 5.3.2 凹口铺装（buildGround 之后调，传 groundCanvas 的 2d context） ---
   与升旗台同一套石板，但**西、北两面不砌石缘** —— 凹口北面朝草坪、西面朝草坪，
   升旗台那边北面已经压着东西主路的路缘石，这里两侧都是草地，砌了反而像围栏。
   石缘只做南、东两面（背光侧），"凹"的读法交给南缘外面那道切口。 */
function paintDiaGround(g) {
  const rng = makeRng(20260917);                     // 独立种子：buildGround 已跑完，扰不到它
  const Z = DIA_Z, x1 = Z.x + Z.w, y1 = Z.y + Z.h;

  /* ① 石板 16px 见方：缝色打底 + 逐块色差（与 paintFlagGround 同一手法） */
  px(g, Z.x, Z.y, Z.w, Z.h, FLAG_PAVE_J);
  for (let y = Z.y; y < y1; y += 16) {
    for (let x = Z.x; x < x1; x += 16) {
      const k = (rng() - 0.5) * 0.07;
      px(g, x, y, 15, 15, shade(FLAG_PAVE, k));
      px(g, x, y, 15, 1, shade(FLAG_PAVE, k + 0.10));
      px(g, x, y + 14, 15, 1, "rgba(14,18,28,0.10)");
      if (rng() < 0.16) px(g, x + 3 + rng() * 9, y + 3 + rng() * 9, 2, 2, "rgba(14,18,28,0.09)");
    }
  }
  /* ② 南、东两面石缘 */
  const R = 3;
  px(g, x1 - R, Z.y, R, Z.h, KERB_LIT);                             // 东缘（背光侧）
  px(g, x1 - R - 1, Z.y, 1, Z.h, KERB_DARK);
  px(g, Z.x, y1 - R, Z.w, R, KERB_LIT);                             // 南缘（贴南横路）
  px(g, Z.x, y1 - R - 1, Z.w, 1, KERB_DARK);
  /* ③ 版缘外的过渡带。西、北两面迎光 → 走 paintDirt 的土色；东、南两面背光 →
     压一道暗绿"切口"（草面比挖下去的地坪高，这几条边正是光被挡住的地方）。
     这一笔是"凹"能读出来的关键，与 §5.2.2 同款。 */
  const band = mix(DIRT, GRASS_RAMP[1], 0.55);
  const cut  = mix(shade(GRASS_RAMP[0], -0.26), DIRT, 0.32);
  px(g, Z.x - 2, Z.y - 2, 2, Z.h + 4, band);                        // 西缘
  px(g, Z.x, Z.y - 2, Z.w + 2, 2, band);                            // 北缘
  px(g, x1, Z.y, 2, Z.h + 2, cut);                                  // 东缘
  px(g, Z.x - 2, y1, Z.w + 4, 2, cut);                              // 南缘
}

/* --- 5.3.3 花坛：环形红花 + 外缘一圈红陶盆向日葵 --- */
function diaFlowerBed(g, rng) {
  /* 先铺一圈"土"打底，再往上撒花 —— 只撒花点会露出底下的铺装，像撒了一地纸屑 */
  ellipRing(g, diaX(DIA_CX), diaY(DIA_FLW_CY), DIA_FLW_RX, DIA_FLW_RY,
            DIA_FLW_IX, DIA_FLW_IY, "#4a3f2c");
  /* 逐行填红：同一行内按"距环心的水平距离"分档上色，外圈亮、内圈暗
     （环是斜的，靠外的一侧正对光，与全局 SUN(-0.60,-0.80) 一致） */
  for (let y = Math.ceil(DIA_FLW_CY - DIA_FLW_RY); y <= Math.floor(DIA_FLW_CY + DIA_FLW_RY); y++) {
    const s = 1 - ((y - DIA_FLW_CY) / DIA_FLW_RY) ** 2;
    if (s <= 0) continue;
    const hw = DIA_FLW_RX * Math.sqrt(s);
    const u = 1 - ((y - DIA_FLW_CY) / DIA_FLW_IY) ** 2;
    const ihw = u > 0 ? DIA_FLW_IX * Math.sqrt(u) : 0;
    const xl = Math.round(DIA_CX - hw), xr = Math.round(DIA_CX + hw);
    const il = Math.round(DIA_CX - ihw), ir = Math.round(DIA_CX + ihw);
    const ny = y - DIA_FLW_CY;                       // <0 = 北半边（迎光）
    for (const [a, b] of [[xl, il], [ir, xr]]) {
      const wpx = b - a;
      if (wpx <= 0) continue;
      px(g, diaX(a), diaY(y), wpx, 1, ny < 0 ? DIA_FLW_M : DIA_FLW_D);
      /* 北半边靠外的一列提亮 —— 一圈花里总要有一圈亮的才不塌成一个色块 */
      if (ny < 0 && rng() < 0.55) px(g, diaX(a), diaY(y), 1, 1, DIA_FLW_L);
      if (ny >= 0 && rng() < 0.30) px(g, diaX(b) - 1, diaY(y), 1, 1, DIA_FLW_M);
    }
  }
  /* 外缘一圈深红陶盆（对应照片里环绕的向日葵盆）。像素尺度下向日葵本身
     （花盘 + 花瓣）在 3px 里画不出形状，只留盆 —— 一列等距的暗红点，
     远看正好是"一圈陶盆"的节奏。 */
  const NP = 22;
  for (let i = 0; i < NP; i++) {
    const a = i / NP * Math.PI * 2 + 0.14;
    const ex = DIA_CX + Math.cos(a) * (DIA_FLW_RX + 2.5);
    const ey = DIA_FLW_CY + Math.sin(a) * (DIA_FLW_RY + 1.6);
    px(g, diaX(Math.round(ex)), diaY(Math.round(ey)), 3, 2, DIA_POT);
    px(g, diaX(Math.round(ex)), diaY(Math.round(ey)), 3, 1, shade(DIA_POT, 0.22));
  }
}

/* --- 5.3.4 石台基：圆形石台（俯视圆柱的三步画法） ---
   ⚠️ 三步的顺序不能换：**底椭圆 → 柱身矩形 → 顶椭圆**。
      第一版把"下层台阶"写成了一个外扩 (rx+3, ry+1.5) 的独立椭圆，
      它的下缘直接溢到 y1865（花坛下缘才 1854），在画面里变成一枚压在花坛
      南侧的巨型绿橄榄，把整个雕塑的下半身吃掉了。台阶要外扩也必须在
      **花坛内圈以内**，而花坛内圈半径就是这里的 rx/ry —— 所以干脆不外扩。 */
function diaPlinth(g) {
  const cx = diaX(DIA_CX);
  /* ⚠️ 圆心的 y 是"高度"直接减去，不是加上：物体越高，屏幕上越靠上。
        底面圆心在地面高度 → 与花坛环心 DIA_FLW_CY **同一个 y**；
        顶面比底面高 DIA_PL_H → y 减 DIA_PL_H。
        第一版把这两者写反了（顶面放 1832、底面放 1840），底椭圆于是比花坛内圈
        低 8px、南缘一路探出到 1853，看起来就是花坛南侧被一枚巨椭圆吃掉了。 */
  const cyB = diaY(DIA_FLW_CY);                              // 底面圆心
  const cyT = cyB - DIA_PL_H;                                // 顶面圆心
  const rx = DIA_FLW_IX, ry = DIA_FLW_IY, h = DIA_PL_H;
  ellipPx(g, cx, cyB, rx, ry, DIA_PL_D);                     // ① 底椭圆：只露出南侧一条弧
  px(g, Math.round(cx - rx), cyT, Math.round(rx * 2), h, DIA_PL_M);   // ② 柱身
  px(g, Math.round(cx - rx), cyT, 2, h, DIA_PL_L);                    //    西侧受光
  px(g, Math.round(cx + rx) - 2, cyT, 2, h, DIA_PL_D);                //    东侧背光
  px(g, Math.round(cx - rx), cyB - 2, Math.round(rx * 2), 2, DIA_PL_D);//    柱身底部压暗
  /* ③ 顶面椭圆 = **水盆**。原先这里是"北半边亮、南半边暗"的石面（光来自
        SUN(-0.60,-0.80)）；2026-09-13 加喷泉时改成看得见水的水盆 ——
        照片（_photo/diaosu.jpg）里柱脚周围本来就是一圈湿的深色水。
        ⚠️ 水面**不按 SUN 分南北明暗**（水是反光的，不是漫反射的石头）：
           改用与 paintWaterBase 同一套"由岸向心浅化"的 3 圈，池心最亮。
           这是本项目里"画水"的统一读法，换成别的会立刻显得像块蓝地砖。 */
  const topY = DIA_FLW_CY - h;
  ellipPx(g, cx, cyT, rx, ry, DIA_WAT_M);
  for (let i = 0; i < 3; i++) {
    const t = (i + 1) / 3;
    ellipPx(g, cx, cyT, rx - rx * 0.34 * t, ry - ry * 0.34 * t, mix(DIA_WAT_M, DIA_WAT_L, 0.22 * (i + 1)));
  }
  /* 盆底外缘一圈暗：盆壁的投影。缺了它水会"浮"在石面上、读不出是个凹下去的盆。
     ⚠️ 那圈亮边（石台基与花坛的分界线）**必须留在最外圈**，水画在它里面 ——
        盆沿没了，石台基与花坛会糊成一个色块。 */
  ellipRing(g, cx, cyT, rx, ry, rx - 1.4, ry - 1.4, DIA_WAT_D);
  ellipRing(g, cx, cyT, rx + 0.6, ry + 0.6, rx - 0.6, ry - 0.6, DIA_PL_L);
}

/* --- 5.3.4b 喷泉：水柱 + 上飞的水珠 + 盆面溅水环（2026-09-13 第六轮新增） ---
   作者最初就写了"柱间原本有喷泉 —— 像素尺度下省略"（见文件头 ②），这次补上。
   照片里：四柱之间、靠南一侧有一道白色细水柱，宽约 4~5、高约 20~24 世界像素。

   ⚠️ 位置是被三处既有几何**夹**出来的，改任一处都要回这里重算：
      ① 中间两根圆柱的内沿在 x2021.5 / x2026.5（柱心 2019/2029、直径 5，即 DIA_COL_GAP=10）
         → 水柱只能取 x2022..2025，宽 4；
      ② 台座底面南沿在 y1807（DIA_PED_FOOT）
         → 水柱顶只能到 y1808；
      ③ 水盆面 = 台基顶面椭圆中心 1827 再南移 3（照片里水柱偏南）→ y1830。
      于是 H = 22，正好落在照片量的 20~24 里。

   ⚠️ 相位 i 只让**水珠与溅水环**动，柱体本身一帧不动 ——
      柱体高度随帧脉动会被读成频闪（24px 高的东西每帧伸缩 1~2px，像素画里非常刺眼）。 */
function diaJet(g, i) {
  const bx = DIA_CX, by = 1830, H = 22;
  /* ① 柱体：2px 白芯，上下两端各收细 1px（水柱不是一根等宽的棍） */
  for (let y = by - H; y <= by; y++) {
    const t = (by - y) / H;
    const w = (t < 0.10 || t > 0.92) ? 1 : 2;
    px(g, diaX(bx - 1), diaY(y), w, 1,
       t > 0.80 ? "rgba(255,255,255,0.60)" : "rgba(255,255,255,0.92)");
  }
  /* ② 三颗上飞的水珠：相位错开 1/3 圈，越往上越淡；左右各飘 1px 免得太像一根柱 */
  for (let k = 0; k < 3; k++) {
    const p = ((i / DIA_FRAMES) + k / 3) % 1;
    const yy = by - Math.round(p * H), off = Math.round(Math.sin(p * 6.2832) * 1.6);
    px(g, diaX(bx - 1 + off), diaY(yy), 1, 1, "rgba(255,255,255," + (0.70 - 0.45 * p).toFixed(2) + ")");
  }
  /* ③ 盆面溅水环：水柱脚一圈，半径按相位呼吸。
        ⚠️ 取 (i+1)%N 而不是 i%N —— 第 0 帧若取 0 会退化成"没有环"，
           8 帧里少一帧、飞轮转起来会看见一次跳变。
        竖直半径按 1/1.71 压扁：这是**贴在水盆面上的**水平圆。 */
  const rr = 2.5 + ((i + 1) % DIA_FRAMES) / DIA_FRAMES * 2.5, ry = rr * 0.585;
  for (let y = Math.ceil(by - ry); y <= Math.floor(by + ry); y++) {
    const s = 1 - ((y - by) / ry) ** 2;
    if (s <= 0) continue;
    const hw = rr * Math.sqrt(s);
    const xl = Math.round(diaX(bx - hw)), xr = Math.round(diaX(bx + hw)) - 1;
    px(g, xl, diaY(y), 1, 1, "rgba(230,246,255,0.40)");
    if (xr > xl) px(g, xr, diaY(y), 1, 1, "rgba(230,246,255,0.40)");
  }
}

/* --- 5.3.5 大齿轮环：外圈三角齿 + 环体 + 垂链 --- */
function diaGear(g) {
  const cx = diaX(DIA_CX), cy = diaY(DIA_GEAR_CY), R = DIA_GEAR_R, T = DIA_GEAR_T;
  /* ① 齿：24 个三角齿，径向朝外。**先画齿再画环体** —— 反过来的话齿根那道
        接缝会压在环上，读起来像环外面粘了 24 个小方块。
     ⚠️ 齿轮是**竖直的圆盘**，正面看就是正圆 —— 这里不能套 2.5D 的椭圆压缩
        （花坛、石台基那些是水平面，才要压）。 */
  const NT = 24;
  for (let i = 0; i < NT; i++) {
    const a = i / NT * Math.PI * 2;
    const nx = Math.cos(a), ny = Math.sin(a);
    /* 齿基在 R-1、齿尖在 R+3，宽 2 收窄到 1（等腰三角形）。
       R=20 时周长 125px、24 个齿即间隔 5.2px —— 齿宽最多只能给 2px，
       再宽就并成一圈实边，"齿"的节奏全丢。 */
    for (let d = R - 1; d <= R + 3; d++) {
      const w = Math.max(1, Math.round((R + 3 - d) / 4 * 2));
      px(g, Math.round(cx + nx * d - w / 2), Math.round(cy + ny * d - w / 2), w, w, DIA_IR_L);
    }
  }
  /* ② 环体：外椭圆 - 内椭圆，北半边（左上）受光。
        ⚠️ 环体整体提亮到 DIA_IR_L（而不是和铁砧同用 DIA_IR_M）——
           齿轮在后、铁砧在前，两者同色会糊成一整块黑，齿轮环就"消失"了；
           拉开一档亮度，环的轮廓才能从铁砧上读出来。 */
  ellipRing(g, cx, cy, R, R, R - T, R - T, DIA_IR_L);
  for (let y = cy - R; y <= cy + R; y++) {
    const s = 1 - ((y - cy) / R) ** 2;
    if (s <= 0) continue;
    const hw = R * Math.sqrt(s), xl = Math.round(cx - hw), xr = Math.round(cx + hw);
    const u = 1 - ((y - cy) / (R - T)) ** 2;
    const ihw = u > 0 ? (R - T) * Math.sqrt(u) : 0;
    const il = Math.round(cx - ihw), ir = Math.round(cx + ihw);
    const lit = y < cy;                                    // 北半边
    if (il > xl) { px(g, xl, y, il - xl, 1, lit ? DIA_IR_L : DIA_IR_M); px(g, xl, y, 1, 1, lit ? DIA_IR_L : DIA_IR_D); }
    if (xr > ir) { px(g, ir, y, xr - ir, 1, lit ? DIA_IR_M : DIA_IR_D); px(g, xr - 1, y, 1, 1, DIA_IR_D); }
  }
  /* ③ 垂链：齿轮右侧挂下来的一小段起重链（照片里很显眼，三节方环） */
  const chX = DIA_CX + R - 1, chY = DIA_GEAR_CY + 8;
  for (let i = 0; i < 3; i++) {
    px(g, diaX(chX), diaY(chY + i * 4), 3, 1, DIA_IR_L);
    px(g, diaX(chX), diaY(chY + i * 4 + 1), 1, 2, DIA_IR_M);
    px(g, diaX(chX) + 2, diaY(chY + i * 4 + 1), 1, 2, DIA_IR_M);
    px(g, diaX(chX), diaY(chY + i * 4 + 3), 3, 1, DIA_IR_M);
  }
}

/* --- 5.3.6 铁砧：喇叭砧座 + 横置砧体 + 方柱/斜料 + 前沿斜杆 --- */
function diaAnvil(g) {
  const cx = DIA_CX;
  /* ① 砧座：下窄上宽的喇叭形柱体（下宽 12、上宽 20、高 9） */
  const by = DIA_ANV_BY, ty = by - DIA_ANV_H;
  for (let y = ty; y <= by; y++) {
    const t = (by - y) / DIA_ANV_H;                        // 0 = 底、1 = 顶
    const hw = 5 + t * 3;                                  // 下宽 10 → 上宽 16
    px(g, diaX(Math.round(cx - hw)), diaY(y), Math.round(hw * 2), 1,
       y <= ty + 1 ? DIA_IR_L : (y >= by - 1 ? DIA_IR_D : DIA_IR_M));
  }
  px(g, diaX(cx - 5), diaY(by), 10, 2, DIA_IR_D);          // 底座加厚一圈
  px(g, diaX(cx - 6), diaY(by), 12, 1, DIA_IR_M);
  /* ② 砧体：横置，右端出"喙"（照片里砧的右端是尖的） */
  const aY = ty - 6;
  px(g, diaX(cx - 12), diaY(aY), 24, 6, DIA_IR_M);
  px(g, diaX(cx - 12), diaY(aY), 24, 2, DIA_IR_L);         // 顶面受光
  px(g, diaX(cx - 12), diaY(aY + 5), 24, 1, DIA_IR_D);     // 底面背光
  px(g, diaX(cx - 12), diaY(aY), 2, 6, DIA_IR_L);          // 左端面
  for (let i = 0; i < 6; i++)                              // 右端"喙"：逐行收窄的三角
    px(g, diaX(cx + 12), diaY(aY + i), Math.max(1, 6 - i), 1, i < 2 ? DIA_IR_L : DIA_IR_D);
  /* ③ 砧体上的工件：两块方柱（一高一矮）+ 两块斜方料 */
  px(g, diaX(cx - 7), diaY(aY - 15), 5, 15, DIA_IR_M);     // 高柱
  px(g, diaX(cx - 7), diaY(aY - 15), 5, 2, DIA_IR_L);
  px(g, diaX(cx - 7), diaY(aY - 15), 1, 15, DIA_IR_L);
  px(g, diaX(cx - 2), diaY(aY - 15), 1, 15, DIA_IR_D);
  px(g, diaX(cx), diaY(aY - 9), 5, 9, DIA_IR_M);           // 矮柱
  px(g, diaX(cx), diaY(aY - 9), 5, 2, DIA_IR_L);
  px(g, diaX(cx + 4), diaY(aY - 9), 1, 9, DIA_IR_D);
  /* 右边那本"书"：**向左倾** —— 长轴从右下延伸到左上，上端在左、下端在右。
     ⚠️ 第一版写反了（`cx + 6 + i*0.5` 是上端朝右），用户照着照片一眼看出方向不对：
       照片里这块板是**上端偏左**的。判据只有"上端在哪一侧"，别再写反。 */
  for (let i = 0; i < 12; i++) {
    px(g, diaX(cx + 12 - i), diaY(aY - 4 - i), 4, 1, i % 4 === 0 ? DIA_IR_L : DIA_IR_M);
  }
  for (let i = 0; i < 8; i++) {                            // 左上斜方块
    px(g, diaX(cx - 13 + i * 0.4), diaY(aY - 12 + i), 4, 1, DIA_IR_M);
    px(g, diaX(cx - 13 + i * 0.4), diaY(aY - 12 + i), 1, 1, DIA_IR_L);
  }
  /* ④ 砧座前沿斜插的细杆（照片里垂在砧座前面那根，像凿子） */
  for (let i = 0; i < 12; i++) {
    px(g, diaX(cx - 2 - i * 0.5), diaY(aY + 6 + i), 1, 1, i < 3 ? DIA_IR_L : DIA_IR_M);
    px(g, diaX(cx - 3 - i * 0.5), diaY(aY + 6 + i), 1, 1, DIA_IR_D);
  }
}

/* --- 5.3.7 方形台座：顶面板 + 南立面 + 立面上的一排圆孔 --- */
function diaPedestal(g) {
  const x0 = DIA_CX - DIA_PED_W / 2, x1 = DIA_CX + DIA_PED_W / 2;
  const tY = DIA_PED_TY, fY = tY + DIA_PED_T;              // 1790 / 1810
  /* 顶面：磨光浅灰，北缘受光、东缘背光 */
  px(g, diaX(x0), diaY(tY), DIA_PED_W, DIA_PED_T, DIA_PED_TOP);
  px(g, diaX(x0), diaY(tY), DIA_PED_W, 1, shade(DIA_PED_TOP, 0.26));
  px(g, diaX(x0), diaY(tY), 1, DIA_PED_T, shade(DIA_PED_TOP, 0.14));
  px(g, diaX(x1) - 2, diaY(tY), 2, DIA_PED_T, shade(DIA_PED_TOP, -0.22));
  for (let x = x0 + 8; x < x1 - 2; x += 8)
    px(g, diaX(x), diaY(tY) + 1, 1, DIA_PED_T - 2, "rgba(14,18,28,0.05)");
  /* 南立面：顶棱提亮、底部压暗 */
  px(g, diaX(x0), diaY(fY), DIA_PED_W, DIA_PED_F, DIA_PED_SIDE);
  px(g, diaX(x0), diaY(fY), DIA_PED_W, 1, shade(DIA_PED_SIDE, 0.44));
  px(g, diaX(x0), diaY(fY + DIA_PED_F - 2), DIA_PED_W, 2, shade(DIA_PED_SIDE, -0.30));
  /* 一排圆孔：照片里立面上等距 5 个，是这块石头唯一的细节 */
  for (let i = 0; i < 5; i++) {
    const hx = Math.round(x0 + 5 + i * (DIA_PED_W - 10) / 4);
    px(g, diaX(hx), diaY(fY + 2), 2, 2, "#3a362f");
    px(g, diaX(hx), diaY(fY + 1), 2, 1, "rgba(14,18,28,0.18)");
  }
  contactBand(g, diaX(x0) + 1, diaX(x1) - 1, diaY(DIA_PED_FOOT), 1, 0.20);
}

/* --- 5.3.8 圆柱：四根，2×2。先北排后南排，统一"左亮右暗" --- */
function diaColumn(g, ccx, footY) {
  const x0 = Math.round(ccx - DIA_COL_W / 2), topY = footY - DIA_COL_H;
  px(g, diaX(x0), diaY(topY), DIA_COL_W, DIA_COL_H, DIA_COL_M);
  px(g, diaX(x0), diaY(topY), 2, DIA_COL_H, DIA_COL_L);
  px(g, diaX(x0 + DIA_COL_W - 2), diaY(topY), 2, DIA_COL_H, DIA_COL_D);
  px(g, diaX(x0), diaY(footY - 2), DIA_COL_W, 2, DIA_COL_D);      // 柱脚接地压暗
  px(g, diaX(x0 - 1), diaY(footY - 1), DIA_COL_W + 2, 1, "rgba(14,18,28,0.22)");
}

/* --- 5.3.8b 后围石：四块浅棕长方石，沿花坛外圈**朝北**排成 120° 的弧
   （用户 2026-09-13 追加；同日再改两处：块尺寸 ×2、弧从"前半个圆"翻到"后半个圆"）。
   口述：「在这个校徽周围放四个浅棕色的长方形石块围起来，石块差不多围成一个半圆
   （120度），每个石块之间是有间隔的」→「这四个石头比较大，差不多是现在的两倍，
   而且围起来的方向不太对，我们目前是围着前半个圆，其实应该是围着后半个圆形」。
   ⚠️ 角度约定：0° = 东、90° = **正南**（世界 y 向下）、270° = 正北。
      第一版取 [42,74,106,138]（弧心 90° = 正南），围的是"前半个圆"；用户要的是围在
      **雕塑背后**（草坪那一侧）= 正北，所以弧心改 270°，四块取 [225,255,285,315]。
   ⚠️ 半径 R 不是随便挑的，被两条约束钉死 —— 改 LEN / THICK / 角度之前先回这里重算：
      ① **北侧两块必须整体落在草坪上**。草坪南缘 = 凹口北沿 y1776，θ=255° 那块的最南角
         y = 1832 − 0.5848·R·0.9659 + 0.5848·(0.2588·LEN/2 + 0.9659·THICK/2) ≤ 1776
         → R ≥ 112.5，取 113。
      ② **东西两块不许压到凹口西北/东北角**（凹口 x1968..2079）：θ=225° 那块的最东角
         x = 2024 − 0.7071·R + 0.7071·(LEN+THICK)/2 ≤ 1968 → R ≥ 107.2，113 满足。
      相邻块心距 2R·sin15° = 58.5 > LEN 40 → 块间留 18.5px，就是用户说的"有间隔"。
   ⚠️ R=113 让整条弧横跨 200px，比 112px 宽的凹口还宽 —— 这正是用户拍板的方案
      （选「铺装不动，石头坐在草坪上」）：凹口一格没动，弧坐在凹口两侧与北侧的草地上。
      ⚠️ ① 解出的是"北侧两块恰好压在草坪边线上（余量 0.3px）"这个临界值；用户随后要求
      「石头整体往下一点」，于是加 DIA_ST_DY=10 整体南移 —— 北侧两块现在**压在凹口北沿上**
      10px。凹口仍是一格没动，只是石阵不再完全落在草里了。
   ⚠️ 石头画在**地面上**，所以短轴要按 1/1.71 压扁（与花坛、石台基同一套投影）；
      它不是立着的板。 */
const DIA_ST_R = 113, DIA_ST_LEN = 40, DIA_ST_THICK = 16, DIA_ST_H = 6;
const DIA_ST_ANG = [225, 255, 285, 315];                   // 块心方位角（度），270 = 正北
const DIA_ST_SH = "rgba(30,44,22,0.26)";                   // 草地上的软影：让石头与草地脱开
/* ⚠️ 整圈**南移**的偏移（用户 2026-09-13：「石头整体往下一点」）。
   只加在块心的 y 上 → 四块**整体平移**，环的形状与朝向一个字不动。
   代价：北侧两块会探进凹口铺装 10px（原本只剩 0.3px 余量），即石南沿压在铺装北沿上 ——
   这是"往下"必然的代价，凹口本身仍然一格没动。想改这个数，三处联动照旧要重算
   （见下面 DIA_RING_* / DIA_ST_BY 的注释）。 */
const DIA_ST_DY = 10;

/* 石阵**单独一个精灵**（tag "diaRing"），不并进雕塑那张画布 —— 见 §5.3.9b。
   画布框按四块石的实测算：落地足迹 x1924.3..2123.7 / y1771.2..1806.8（已含 DIA_ST_DY），
   顶面再上抬 6（→ y1765.2），软影再往右下铺 (2,3) → 需要 x1924..2126 / y1765..1810，
   四边各留 ~4px → 1920..2130 / 1762..1814。⚠️ canvas 越界是静默的，改 R / LEN / THICK /
   DY 之后必须回头重算这个框，否则石头会被裁掉一条边还不报错。 */
const DIA_RING_X0 = 1920, DIA_RING_Y0 = 1762, DIA_RING_W = 210, DIA_RING_H = 52;
const ringX = v => v - DIA_RING_X0, ringY = v => v - DIA_RING_Y0;
const DIA_ST_BY = 1807;                                    // 精灵落地基准 = 四块石南沿的最南值

/* 单块石的**落地足迹**（四个世界坐标角点，顺序无所谓 —— quadScan 自己求外轮廓）。
   长轴半向量取切向、短轴半向量取径向，两者都按 1/1.71 压扁。 */
function diaStoneFoot(deg) {
  const K = 1 / 1.71;
  const a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const mx = DIA_CX + DIA_ST_R * ca;
  const my = DIA_FLW_CY + K * DIA_ST_R * sa + DIA_ST_DY;                   // 块心（地面）
  const ux = -sa * DIA_ST_LEN / 2, uy = K * ca * DIA_ST_LEN / 2;           // 长轴半向量
  const vx = ca * DIA_ST_THICK / 2, vy = K * sa * DIA_ST_THICK / 2;        // 短轴半向量
  return [
    [mx - ux - vx, my - uy - vy], [mx + ux - vx, my + uy - vy],
    [mx + ux + vx, my + uy + vy], [mx - ux + vx, my - uy + vy],
  ];
}

function diaStones(g) {
  for (const deg of DIA_ST_ANG) {
    const base = diaStoneFoot(deg).map(p => [ringX(p[0]), ringY(p[1])]);
    const top = base.map(p => [p[0], p[1] - DIA_ST_H]);       // 顶面 = 落地足迹整体上抬
    quadPx(g, base.map(p => [p[0] + 2, p[1] + 3]), DIA_ST_SH); // ① 草地软影（偏右下＝服从 SUN）
    quadPx(g, base, DIA_ST_D);                                // ② 侧壁（顶面盖上去后南侧剩的那条）
    quadPx(g, top, DIA_ST_M);                                 // ③ 顶面
    quadLit(g, top, DIA_ST_L);                                // ④ 顶面北棱受光
    const bot = new Map();                                    // ⑤ 接地线再压一档
    quadScan(base, (y, xa, xb) => {
      for (let x = xa; x < xb; x++) if (!bot.has(x) || y > bot.get(x)) bot.set(x, y);
    });
    for (const [x, y] of bot) px(g, x, y, 1, 1, shade(DIA_ST_D, -0.28));
  }
}

/* --- 5.3.9 雕塑精灵：一层层叠上去（次序即遮挡关系） ---
   锚点约定与其它道具一致（ax/ay = 精灵内到"底部中心"的偏移）。
   画布尺寸按内容实测定：齿轮顶 1749 → 投影南沿 1862，宽 x1984..2070，
   四边各留 4px 余量就是下面这个框。后围石**不在**这张画布里（见 §5.3.9b）。 */
const DIA_CV_X0 = 1972, DIA_CV_Y0 = 1740, DIA_CV_W = 108, DIA_CV_H = 130;
const diaX = v => v - DIA_CV_X0, diaY = v => v - DIA_CV_Y0;

/* phase = 喷泉相位（0..DIA_FRAMES-1），只影响水柱；其余部分逐帧像素完全一致
   （rng 自带固定种子 20260917，重跑必得同一份结果 —— 这是"预烘焙 N 帧换 img"
   能成立的前提，换了种子就会每帧看到花坛的红花在闪）。 */
function diaStand(phase) {
  const c = mkCanvas(DIA_CV_W, DIA_CV_H), g = c.getContext("2d");
  const rng = makeRng(20260917);
  /* ① 方向性投影：花坛外围一圈，量取 (6,8) 而不取石台基的 (8,10) ——
        花坛是贴地的低矮物，影子拉长会盖住整圈铺装，读起来像地砖脏了一块。 */
  shadowQuad(g, diaX(1988), diaY(1812), diaX(2060), diaY(DIA_FOOT), 6, 8, 0.22, 5);
  /* ② 花坛 → 石台基 → **喷泉** → 齿轮（最远）→ 柱 → 台座 → 铁砧（次序即遮挡关系）。
        水柱排在石台基之后（它坐在水盆面上）、柱之前 ——
        与柱子横向不重叠（水柱在中间两柱的缝里），顺序其实不敏感，但按"从低到高、
        从远到近"摆着读起来才对。⚠️ 后围石**不在这里** —— 见 §5.3.9b，它单独一个道具。 */
  diaFlowerBed(g, rng);
  diaPlinth(g);
  diaJet(g, phase);
  diaGear(g);
  for (let i = 0; i < 4; i++) diaColumn(g, DIA_CX + (i - 1.5) * DIA_COL_GAP, DIA_COL_FOOT);
  diaPedestal(g);
  diaAnvil(g);
  return { canvas: c, ax: DIA_CX - DIA_CV_X0, ay: DIA_FOOT - DIA_CV_Y0 };
}

/* --- 5.3.9a 喷泉逐帧（预烘焙 + 每帧换 prop.img，与 §5.2 国旗同构） ---
   ⚠️ 为什么不是"每帧重画一遍 diaStand"：整个精灵每帧重画要跑花坛的逐行扫描 + 齿轮
      24 个齿 + 4 根柱，一次 ~600 次 px()，而帧间**只有水柱那几个像素不同**。
      也没做成独立道具 —— 道具按 baseY 排序，雕塑 baseY=1854（花坛落地线），
      水柱的落地点只有 1830，单独立项会被排到雕塑**背后**、被前排柱子吃干净。
   代价：8 张 108×130 ≈ 450 KB 显存 + 烘焙 8 次（实测 +5~20 ms，见 verify.py）。 */
const DIA_FRAMES = 8, DIA_FPS = 9;
const diaFrames = [];
let diaT = 0, diaFrameI = -1, diaProp = null;

function bakeDiaFountain(first) {
  diaFrames.length = 0;
  diaFrames.push(first || diaStand(0).canvas);          // 第 0 帧可直接复用已烘好的那张
  for (let i = 1; i < DIA_FRAMES; i++) diaFrames.push(diaStand(i).canvas);
}

/* 每帧由主循环调用（build.py 补丁 13）。⚠️ 三道闸一条都不能省 ——
   2026-09-13 那次"整页永久定格"（Edge 上 rAF 断链）就是漏了闸③：
   dt 转负 → `%` 返回负 → 数组负下标 → img 变 undefined →
   下一帧 render 死在 p.img.width → 整页再也不动，而外部完全看不出。
   闸② 用的是 utils 里的 `wrapi(i,m) = ((i%m)+m)%m`（Demo 切片 :51，本文件可见），
   不自己再写一遍取模 —— 项目里已经有一份，两份迟早会漂开。 */
function animateDiaosu(dt) {
  if (!(dt > 0)) dt = 0;                                       // 闸①：dt 非正当 0
  diaT += dt;
  if (!diaProp || !diaFrames.length) return;
  const i = wrapi(Math.floor(diaT * DIA_FPS), DIA_FRAMES);     // 闸②：夹正
  if (i !== diaFrameI) {                                       // 闸③：判存在再写
    diaFrameI = i;
    if (diaFrames[i]) diaProp.img = diaFrames[i];
  }
}

/* --- 5.3.9b 后围石精灵（tag "diaRing"）---
   ⚠️ **必须单独一个道具，不能并进 diaStand 那张画布**。道具按 baseY 排序，一张画布只有一个
      baseY：雕塑的 baseY 是 DIA_FOOT=1854（花坛落地线），而石阵最南沿只有 1797。
      并在一起的话，人走在石阵西侧/东侧那片草坪上（x1924..1968 / x2080..2124，y1799..1854，
      完全可以走）会被 baseY=1854 判定为"在雕塑之前"，于是**石头画到人身上** —— 石头明明
      在人的北侧（背后）。拆开后石阵 baseY=1797：人 y>1797 画在人前、y<1797 画在人后，全对。
      两侧草地恰好没有第三人（雕塑自己在 1854 那侧），所以一个 baseY 就够，不用逐块拆。 */
function diaRing() {
  const c = mkCanvas(DIA_RING_W, DIA_RING_H), g = c.getContext("2d");
  diaStones(g);
  return { canvas: c, ax: DIA_CX - DIA_RING_X0, ay: DIA_ST_BY - DIA_RING_Y0 };
}

/* 四块石的**落地 AABB**，给 §6.5c 逐块 addSolid 用（旋转矩形只能用外接轴对齐盒近似，
   四角最多外扩 5px，对 6px 高的矮石无所谓）。 */
function diaStoneBoxes() {
  const out = [];
  for (const deg of DIA_ST_ANG) {
    const P = diaStoneFoot(deg);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of P) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    out.push({ cx: (x0 + x1) / 2, by: y1, w: x1 - x0, d: y1 - y0 });
  }
  return out;
}

/* --- 5.3.10 雕塑净空 ---
   散射与行道树各摆各的：凹口本身挡住了台子那一小块，但**外围**（凹口南北两侧的
   草坪上）照样可能长出树，树冠（最宽 86、最高 104）一盖就把齿轮环或柱身糊掉。
   净空区覆盖"雕塑精灵的整个包围盒 + 树冠那半个身位"。
   ⚠️ 后围石（§5.3.8b）把包围盒往西/往东各撑出 ~36px：弧 x1924..2124 / y1752..1800，
      跟雕塑本体（x1972..2080 / y1749..1862）并起来就是 x1922..2128 / y1745..1863。
      少了这一段，两块北侧石之间那 18px 缝里会被 scatter() 塞进一棵树（ptBlocked 的探针
      只有 14×10，正好塞得下），树冠一盖石头就看不见了。
   ⚠️ 必须排在 §6.6c 的 clearPropTreeClash() **之后** —— 先跑会改变它保留/丢弃的
      集合，clashDropped 的计数跟着变，验收数字就对不上了（与 §5.2.8 同款约束）。 */
const DIA_CLR = { x: 1922, y: 1745, w: 206, h: 118 };     // x1922..2128 / y1745..1863
function clearDiaClearance() {
  const C = DIA_CLR, cx1 = C.x + C.w, cy1 = C.y + C.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* 雕塑与后围石自己保留；宽 > 110 的当楼处理（这一片没有楼，保险起见） */
    if (p.tag === "diaosu" || p.tag === "diaRing" || p.img.width > 110) { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    if (x0 < cx1 && x0 + p.img.width > C.x && y0 < cy1 && y0 + p.img.height > C.y) {
      dropped++;
      continue;
    }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

const SM_DW = SM_W >> 1, SM_DH = SM_H >> 1;       // 102×63 ← **成品尺寸**（§5.4.1b 减半）
/* 碑心 x2204（画布横跨 2153..2255）；落地线 = 南门拱根的 y —— 用与 49 段

/* --- 5.4.1b 整只精灵减半（用户「大小变为原来的一半」的唯一实现） ---
   石框 + 石板这类**实心色块**走这里：2×2 取块，输出 alpha = 块内最大 alpha
   （软影不会变淡），颜色取实心样本里最先遇到的那个（为什么不用更聪明的规则，
   见函数内那段注）。
   ⚠️ 唯一**不能**走这里的是**金字**：笔画只有 1-2px，就近抽样必然糊、
      `drawImage` 缩更会把细笔画整根抹掉 —— 金字用 `sgHalf()` 从点阵按覆盖率
      直接降到一半，点在降半之后的画布上（见 §5.4.7）。 */
function halfSprite(src) {
  const sw = src.width, sh = src.height, w = sw >> 1, h = sh >> 1;
  const d = src.getContext("2d").getImageData(0, 0, sw, sh).data;
  const out = mkCanvas(w, h), g = out.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      /* 2×2 块的四个样本下标（行优先：左上 / 右上 / 左下 / 右下） */
      const i0 = (y * 2 * sw + x * 2) * 4;
      const q = [i0, i0 + 4, i0 + sw * 4, i0 + sw * 4 + 4];
      let a = 0;
      for (const i of q) if (d[i + 3] > a) a = d[i + 3];
      if (a < 24) continue;                              // 整块几乎全空 ⇒ 不落笔
      /* 颜色取"实心样本里最先遇到的那个"。
         ⚠️⚠️ 试过更聪明的规则，全都**更糟**，写在这里免得后人再走一遍：
            ① 取"离块内均值色最远的样本"（想保住亮棱/描边这类离群色）——
               它把**抖点层**也一起放大了：`speckle()` 撒的几十颗亮斑在 4 个样本里
               天然是离群色、必然胜出，半尺寸下密度是设计尺寸的 4 倍
               （石板 107 颗金点、狮身 46 颗白霜），成品直接变成电视雪花。
            ② `drawImage` 直接缩小 —— 隔行隔列抽样，1px 的亮棱整根消失。
        所以规则就一条：**软影看 alpha、实心区域就近取一个样本**。
        真正需要抗抽样的只有**金字**，那是另一条路：不参与降采样，
        在降半之后的画布上用 `sgHalf()` 直接点（见 §5.4.7）。 */
      const ci = q[0];
      g.fillStyle = "rgba(" + d[ci] + "," + d[ci + 1] + "," + d[ci + 2] + "," + (a / 255) + ")";
      g.fillRect(x, y, 1, 1);
    }
  }
  return out;
}
/* 1bit 点阵减半（金字专用）：2×2 块**覆盖率 ≥ 2/4** 才留墨。
   一条 1px 的笔画在每个 2×2 块里恒占 2/4 ⇒ 原样保留；孤立单点（1/4）丢掉
   —— 这正是"半尺寸下该有的笔画"。⚠️ 真正的隔行抽样会把细笔画整根抹掉，
   所以金字**绝不能**走 halfSprite（那是给实心色块用的）。 */
function sgHalf(b64, nw, nh) {
  const src = sgBits(b64, nw * nh), w = Math.ceil(nw / 2), h = Math.ceil(nh / 2);
  const m = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const x0 = Math.round(x * nw / w), x1 = Math.max(x0 + 1, Math.round((x + 1) * nw / w));
    const y0 = Math.round(y * nh / h), y1 = Math.max(y0 + 1, Math.round((y + 1) * nh / h));
    let ink = 0, tot = 0;
    for (let sy = y0; sy < y1 && sy < nh; sy++)
      for (let sx = x0; sx < x1 && sx < nw; sx++) { tot++; if (src[sy * nw + sx]) ink++; }
    m[y * w + x] = (ink * 2 >= tot) ? 1 : 0;
  }
  return { m: m, w: w, h: h };
}

  I: ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "#####"],
  J: ["....#", "....#", "....#", "....#", "#...#", "#...#", ".###."],
  N: ["#...#", "##..#", "##..#", "#.#.#", "#..##", "#..##", "#...#"],
  G: [".###.", "#...#", "#....", "#..##", "#...#", "#...#", ".###."],
  A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
  O: [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
  T: ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "..#.."],
  U: ["#...#", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
  S: [".####", "#....", "#....", ".###.", "....#", "....#", "####."],
  Y: ["#...#", "#...#", ".#.#.", "..#..", "..#..", "..#..", "..#.."],
  R: ["####.", "#...#", "#...#", "####.", "#.#..", "#..##", "#...#"],
  V: ["#...#", "#...#", "#...#", "#...#", ".#.#.", ".#.#.", "..#.."]
};
const SM_TEXT = "BEIJING JIAOTONG UNIVERSITY";
const SM_ADV = 6, SM_GLYPH_W = 5, SM_SP = 3;
const SM_TEXT_W = (() => {
  let w = 0;
  for (const ch of SM_TEXT) w += (ch === " " ? SM_SP : SM_ADV);
  return w - 1;
})();                                             // 153

/* --- 5.4.4 金字：点阵 → 逐像素落笔（带 1px 斜面） ---
   §4.9 的 sgGlyph 是"沿拱的切线旋转 + 裁进拱轮廓"专用的；这里不旋转也不裁，
   但要求**立体金字**（照片里的字是凸起的，左下压暗、左上提亮），所以单写一个：
     fill  —— 字面；
     edge(ox,oy) —— 沿 (ox,oy) 方向的 1px 外边，用位移邻居反查，只落在外轮廓上。
   ⚠️ 提亮边取的是**左上**（ox=-1,oy=-1 ⇒ 查右下邻居有没有墨），压暗边取**右下**。 */
function smStamp(g, m, nw, nh, x0, y0, col) {
  for (let y = 0; y < nh; y++)
    for (let x = 0; x < nw; x++)
      if (m[y * nw + x]) px(g, x0 + x, y0 + y, 1, 1, col);
}
function smGold(g, m, nw, nh, x0, y0) {
  const hit = (x, y) => (x >= 0 && y >= 0 && x < nw && y < nh && m[y * nw + x]) ? 1 : 0;
  const lit = [], dark = [];
  for (let y = -1; y <= nh; y++) {
    for (let x = -1; x <= nw; x++) {
      if (hit(x, y)) continue;
      if (hit(x + 1, y + 1)) lit.push(x, y);       // 本格空、右下有墨 ⇒ 左上边
      if (hit(x - 1, y - 1)) dark.push(x, y);      // 本格空、左上有墨 ⇒ 右下边
    }
  }
  for (let i = 0; i < lit.length; i += 2) px(g, x0 + lit[i], y0 + lit[i + 1], 1, 1, SM_GOLD_L);
  smStamp(g, m, nw, nh, x0, y0, SM_GOLD);
  for (let i = 0; i < dark.length; i += 2) px(g, x0 + dark[i], y0 + dark[i + 1], 1, 1, SM_GOLD_D);
}
/* 英文那行：5×7 太细，压斜边会糊，只填一个偏亮的金 —— 照片里这行也比中文更亮。
   ⚠️ 当前无调用点（见 §5.4.3 的注）。 */
function smText(g, s, x0, y0, col) {
  let x = x0;
  for (const ch of s) {
    if (ch === " ") { x += SM_SP; continue; }
    const rows = SM_FONT[ch];
    for (let y = 0; y < rows.length; y++)
      for (let i = 0; i < SM_GLYPH_W; i++)
        if (rows[y][i] === "#") px(g, x + i, y0 + y, 1, 1, col);
    x += SM_ADV;
  }
}

/* --- 5.4.5 毛面花岗岩框 ---
   石块砌法：横缝通长、竖缝错缝。框只有 13px 厚 ⇒ 上下两条带各两皮（6/7px），
   左右两条带按 18px 一皮。每块石头左上受光、右下背光（1px），再撒一层颗粒
   —— 照片里这块墙的"毛面"就靠这三件事读出来。 */
function smBlockBand(g, x0, y0, w, h, rows, rng) {
  px(g, x0, y0, w, h, SM_GRAN);
  const rh = h / rows;
  for (let r = 0; r < rows; r++) {
    const ry = y0 + Math.round(r * rh), rb = y0 + Math.round((r + 1) * rh) - 1;
    const off = (r % 2) * 17;
    for (let x = x0 + off; x < x0 + w; x += 34) {
      px(g, Math.max(x0, x), ry, 1, rb - ry + 1, SM_GRAN_S);          // 竖缝
      if (x > x0) px(g, Math.max(x0, x) - 1, ry, 1, rb - ry + 1, SM_GRAN_L);  // 缝右的受光棱
    }
    px(g, x0, rb, w, 1, SM_GRAN_S);                                    // 横缝
    px(g, x0, ry, w, 1, SM_GRAN_L);                                    // 每皮上棱受光
  }
  px(g, x0, y0, w, 1, SM_GRAN_L);                                      // 顶棱
  px(g, x0, y0 + h - 1, w, 1, SM_GRAN_D);                              // 底棱
  speckle(g, x0, y0, w, h, SM_GRAN_L, Math.round(w * h * 0.035), rng);
  speckle(g, x0, y0, w, h, SM_GRAN_D, Math.round(w * h * 0.030), rng);
}
function smBlockCol(g, x0, y0, w, h, rng) {
  px(g, x0, y0, w, h, SM_GRAN);
  for (let y = y0; y < y0 + h; y += 18) {
    px(g, x0, y, w, 1, SM_GRAN_L);                                     // 每皮上棱
    px(g, x0, Math.min(y0 + h - 1, y + 17), w, 1, SM_GRAN_S);          // 下缝
  }
  px(g, x0, y0, 1, h, SM_GRAN_L);                                      // 左棱受光
  px(g, x0 + w - 1, y0, 1, h, SM_GRAN_D);                              // 右棱背光
  speckle(g, x0, y0, w, h, SM_GRAN_L, Math.round(w * h * 0.05), rng);
  speckle(g, x0, y0, w, h, SM_GRAN_S, Math.round(w * h * 0.05), rng);
}

/* --- 5.4.6 磨光红石板 ---
   照片里的红石板是抛光面：上缘有一道天光反射（亮），左上角映着树影（暗），
   板面还看得见拼缝。三样都画，但都压得很淡 —— 稍重一点就会盖住金字。 */
function smSlab(g, x0, y0, w, h, rng) {
  px(g, x0, y0, w, h, SM_RED);
  for (let i = 0; i < h; i++) {                                        // 上亮下暗的竖向渐变
    const k = (1 - i / h);
    px(g, x0, y0 + i, w, 1, mix(SM_RED_D, SM_RED_L, 0.18 + k * 0.34));
  }
  /* ⚠️ 反射/树影一律压到 0.2 以下：石板只有 100px 高，而金字要压在它上面 ——
     影子的 alpha 稍大一点，放大看就是两块脏抹布，还会把金字衬得发灰。 */
  ellipsePx(g, x0 + w * 0.30, y0 + h * 0.24, w * 0.30, h * 0.30, rgba(SM_RED_D, 0.20));   // 树影
  ellipsePx(g, x0 + w * 0.22, y0 + h * 0.16, w * 0.18, h * 0.22, rgba(SM_RED_S, 0.15));
  ellipsePx(g, x0 + w * 0.80, y0 + h * 0.72, w * 0.22, h * 0.26, rgba(SM_RED_L, 0.10));   // 右下返光
  px(g, x0 + Math.round(w * 0.62), y0, 1, h, rgba(SM_RED_S, 0.5));                        // 拼缝
  px(g, x0, y0 + Math.round(h * 0.66), w, 1, rgba(SM_RED_S, 0.34));
  speckle(g, x0, y0, w, h, rgba(SM_RED_L, 0.5), Math.round(w * h * 0.006), rng);
  px(g, x0, y0, w, 1, rgba(SM_RED_L, 0.55));                            // 上缘天光
  px(g, x0, y0 + h - 1, w, 1, SM_RED_S);
  px(g, x0 + w - 1, y0, 1, h, SM_RED_S);
}

/* --- 5.4.7 整块校名石 ---
   全部按**设计尺寸**（204×126）画，最后一步 `halfSprite()` 降到 102×63。
   板面上只有中文六字一行（英文按用户决定去掉了，见头注【五】）。 */
function makeSchoolStone() {
  const c = mkCanvas(SM_W, SM_H + 5), g = c.getContext("2d");
  const rng = makeRng(54401);
  const F = SM_FRAME, SW = SM_SLAB_W, SH = SM_SLAB_H;
  /* 框：上下两条横带各两皮，左右两条竖带按 18px 一皮 */
  smBlockBand(g, 0, 0, SM_W, F, 2, rng);
  smBlockBand(g, 0, F + SH, SM_W, F, 2, rng);
  smBlockCol(g, 0, F, F, SH, rng);
  smBlockCol(g, F + SW, F, F, SH, rng);
  /* 石板嵌进去：先在框上压一圈暗缝（石板比框低，接缝必须看得见），再画板面 */
  px(g, F, F, SW, SH, SM_RED_S);
  smSlab(g, F, F, SW, SH, rng);
  px(g, F - 1, F - 1, SW + 2, 1, rgba(SM_GRAN_S, 0.55));               // 框压石板的投影
  px(g, F - 1, F - 1, 1, SH + 2, rgba(SM_GRAN_S, 0.55));
  /* 落地：石框自身的接地暗带 + 地上的软影（往南 5 行，两层递淡） */
  px(g, 0, SM_H - 1, SM_W, 1, rgba(SM_GRAN_S, 0.75));
  shadowBlob(g, SM_W / 2, SM_H + 2, SM_W * 0.54, 4, 0.30, 3);

  /* --- 减半，然后**在半尺寸上点金字** ---
     ⚠️ 顺序是硬的：金字必须在 `halfSprite()` **之后**画。之前是"一起降采样"，
        28px 的笔画降成 14px 之后「通」的辶、「学」的上半截全都糊掉了
        （`_propview.py` 8× 一眼就看出来）。 */
  const out = halfSprite(c), g2 = out.getContext("2d");
  const HF = SM_FRAME >> 1;                       // 半尺寸下的框厚：13 → 6
  const SH2 = SM_DH - HF * 2;                     // 半尺寸下的石板高：63 − 12 = 51
  /* 中文六字一行：字高 14（= 28 的一半），字距 2，整块板上居中 */
  const GAP = 2;
  const hs = SG_ROW6.map(cs => sgHalf(cs[0], cs[1], cs[2]));
  let tw = hs.reduce((s, h) => s + h.w, 0) + GAP * (hs.length - 1);
  let tx = Math.round((SM_DW - tw) / 2);
  const ty = HF + Math.round((SH2 - hs[0].h) / 2);
  for (const h of hs) {
    smGold(g2, h.m, h.w, h.h, tx, ty);
    tx += h.w + GAP;
  }
  /* 锚点也减半：ax 51 / ay 63 就是成品的中心与落地线 */
  return { canvas: out, ax: SM_DW / 2, ay: SM_DH };
}

/* ---------------------------------------------------------
   5.4.8 石狮（**直接按成品 34×62 画**）
   ---------------------------------------------------------
   ⚠️⚠️ 石狮是**重画**出来的，不走 `halfSprite()`。第一版按 56×92 画完再降采样，
      成品在 `_propview.py`（8× 原精灵放大图）下是一坨读不出狮形的斑驳色块 ——
      两种 2×2 抽样规则都试过，各自死法不同：
        · 就近抽样 → r3~r5 的卷毛彼此咬死，鬃、眉、下颌卷须全糊成一块抹布；
        · 取"离群色" → 风化亮斑在各自的 2×2 块里恒为离群点、被逐颗放大成
          满身白点，整只狮子变成电视雪花。
      于是退成 28×46 重画。**但用户 2026-09-13 报「石狮子…画的效果太差了」。**
      复盘后的结论是：28×46 的毛病不在画技，在**面积** —— 那点像素放不下石狮
      赖以成形的细节（卷毛 / 亮棱 / 绣球 / 皮孔），只能被迫"减特征"，减完只剩轮廓。
   ⇒  这一版放大到 **34×62**（面积 ×1.66），把减掉的细节逐条加回来（清单见
      `makeStoneLion()` 头注）。尺寸不是拍脑袋：实拍照片里石狮（含台基）的包围盒
      是 440×810 = **1:1.84**，校名石成品 63 高 ⇒ 狮 62 高正好"与碑齐肩"，也符合
      照片里"狮高到石框下沿"的量感。34 则是那个口袋（x2103..2153 = 50px）减掉
      两侧各 8px 净空之后放得下的最大宽度。
      ⚠️ 别把 34×62 读成"28×46 的 1.2 倍"：两者比例不同（1:1.82 vs 1:1.64），
         28×46 那版是**偏矮胖**的，不是同一只狮子等比缩放。
   ---------------------------------------------------------
   画法（三层，与 §5.3 齿轮雕塑同一套路）：
     ① 底板：把整只狮子的**剪影**按要求逐块画出来（鬃毛 → 身体 → 腿 → 头 → 五官），
        全部平涂中间调 SL_M；
     ② 描边：slEdge() 从画布像素反查 —— 凡是"本格透明、邻居有墨"的格子按方向补 1px，
        左上补 SL_L（受光）、右下补 SL_D（背光）。整只狮子立刻有了体积，
        不必给每块单独算光。
     ③ 刻画：卷毛、鬃、眉眼、绣球孔、台基线脚 —— 这些是**形**不是光，
        必须手画，描边补不出来。
   ⚠️ slEdge 只能读一次、写完再读第二遍（两次方向不同），所以读→算→写要分三拍。
   ⚠️ ① 里那些**位移的实心形状**（暗底 + 上移 1px 的亮面）才是主要的光，
      ② 的 1px 描边只负责把整只从地上抠出来 —— 反过来依赖描边，34px 宽的面积
      上根本读不出体积。
   --------------------------------------------------------- */
/* 沿 (ox,oy) 给不透明区域补 1px 外边：本格透明、沿该方向有墨才落笔。
   ox=-1,oy=-1 ⇒ 查右下邻居 ⇒ 补出来的是**左上**的边。 */
function slEdge(g, w, h, ox, oy, col) {
  const d = g.getImageData(0, 0, w, h).data;
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
  const pts = [];
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      if (!A(x, y) && A(x + ox, y + oy) > 110) pts.push(x, y);
  g.fillStyle = col;
  for (let i = 0; i < pts.length; i += 2) g.fillRect(pts[i], pts[i + 1], 1, 1);
}
/* 一个卷毛：暗底环 + 卷面 + 一道"回勾"，读成螺旋而不是一颗珠子 ——
   石狮从头到脚最认得出的东西就是这一颗颗卷（鬃、眉、下颌的须、尾巴尖全是它）。 */
function slCurl(g, cx, cy, r, light) {
  circlePx(g, cx, cy, r, SL_D);
  circlePx(g, cx, cy, r - 1, light ? SL_L : SL_M);
  px(g, cx - 1, cy + r - 2, 2, 1, SL_D);             // 回勾
  px(g, cx - 1, cy - 1, 1, 1, SL_HI);                // 卷顶高光
}
/* 沿一段圆弧摆一排卷（角度用度、y 朝上，90° = 正上方）—— 鬃用。 */
function slCurlArc(g, cx, cy, arcR, a0, a1, n, r, squash) {
  const sq = squash === undefined ? 0.86 : squash;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), a = (a0 + (a1 - a0) * t) * Math.PI / 180;
    slCurl(g, Math.round(cx + Math.cos(a) * arcR), Math.round(cy - Math.sin(a) * arcR * sq),
      r + (i % 2), i % 2 === 0);            // 大小交替 ⇒ 鬃不是一串等大的珠子
  }
}
/* 沿水平线摆一排卷、左右对称收窄 —— 下颌那挂"卷须"用（照片里是上宽下窄的一挂围脖）。
   ⚠️ 不能用 slCurlArc 画这个：圆弧的**最高点**在半圆的顶上，squash=1 时
      半径 15 的弧顶会落到 y=cy-15，正好糊在脸上（第一版就是这么把五官盖掉的）。 */
function slCurlRow(g, cx, y, halfW, n, r) {
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    slCurl(g, Math.round(cx - halfW + 2 * halfW * t), y, r, i % 2 === 0);
  }
}
function makeStoneLion() {
  /* ⚠️⚠️ 石狮**直接按成品尺寸画**，不走 `halfSprite()` —— 实测两种 2×2 抽样规则
      都读不出狮形（就近抽样 → 卷毛咬死成一块抹布；取离群色 → 风化亮斑在各自的
      2×2 块里恒为离群点、被逐颗放大成满身白点，整只变电视雪花，见 §5.4.1b 注）。
      所以下面每个坐标都是**成品像素**，没有"设计尺寸"那一层。

      ⚠️ 这张"细节清单"是 34×62 相对 28×46 **加回来**的东西，以后再改尺寸照着核：
         鬃卷      4 颗 r2，只摆头顶       → 8 颗 r2/r3，绕脸一整圈（20°~160°）
         下颌卷须  3 颗 r3 + 2 颗 r2（珠）→ 5 道出挑的暗齿（半圆，不是珠子）
         风化亮斑  6，撒满整只            → 9，**只撒躯干**（撒到鬃上 = 雪人）
         绣球      4 个镂空孔             → r4 球 + 4 个孔 + 左前爪压在球顶上
         牙        1 排                   → 上下各 1 排（各 3 颗）
         脚爪趾    3 根/只                 → 4 根/只
         台基      三级、只有底线          → 三级 + 每级上棱提亮 / 级间压暗（线脚）
         前腿      三块同色中间挖黑缝      → 每条腿自带左亮右暗 + 2px 腿缝
         躯干凿痕  无                     → 5 颗深色小斑
         耳朵      —                      → **仍然没有**：34px 放不下，画了只剩斜刺。
                                            鬃上 20°/160° 那两颗 r3 大卷就是"耳"。 */
  const W = SL_DW, H = SL_DH;                        // 34 × 62
  const c = mkCanvas(W, H + 2), g = c.getContext("2d");
  const rng = makeRng(54402);
  const CX = W >> 1;                                 // 狮身中轴 = 17

  /* ---- ① 剪影 ----
     照片里各段的竖向占比如下（实拍包围盒 810px 高，按比例折到 62）：
       头带鬃 2..26（39%）/ 躯干 27..48（35%）/ 台基 48..62（22%）。
     这个"大头大鬃"的比例不能按正常动物改 —— 石狮就是头大鬃大。
     ⚠️ 明暗必须在第一步就用**位移的实心形状**定死，② 那圈 1px 描边只负责把
        整只从地上"抠"出来。像素风的规矩是**形状本身就是光**。

     ⚠️ 画序（改哪一步插哪儿都用这张表核）：
        台基 → 躯干 → 腿 → 尾巴 → 绣球 → 鬃底 → 鬃卷 → **脸** → 下颌卷须
        → 描边 → 五官/线脚/亮斑。
        鬃卷必须在脸**之前**（脸要把扫进五官区的半个卷盖掉），
        下颌卷须必须在脸**之后**（它是从下巴挂下来、压在胸口的）。 */
  /* 三级台基：狮子坐的那一级 / 深色磨光的一级 / 最宽的一级 */
  px(g, 9, 48, 16, 3, SL_M);
  px(g, 6, 51, 22, 4, SL_DARK);
  px(g, 3, 55, 28, 4, SL_BASE_L);
  /* 躯干：**一整块钟形**（肩 9..25、臀 5..29），不是几个圆叠起来
     ⚠️ 臀(24 宽) 必须**窄于鬃(30 宽)**：反过来就成了"身子比头大"的熊。 */
  poly(g, [[9, 27], [25, 27], [28, 40], [29, 48], [5, 48], [6, 40]], SL_M);
  poly(g, [[21, 27], [25, 27], [28, 40], [29, 48], [21, 48]], SL_D);   // 右半身背光
  ellipsePx(g, 9, 41, 6, 7, SL_L);                   // 左臀受光
  /* 前腿两根立柱 + 脚爪（x10..23 切成 腿6 / 缝2 / 腿6，整块居中在狮心 17）
     ⚠️ 每条腿**自己带左亮右暗**，缝只给 2px —— v2 是"三块同样亮的 SL_M 中间挖
        一道 3px 的 SL_S"，放大后那 3px 黑条读成了狮子胸前挂的一条领带，
        两条腿反而因为和躯干同色、完全看不出是腿。 */
  for (const lx of [10, 18]) {
    px(g, lx, 33, 6, 15, SL_M);
    px(g, lx, 33, 1, 15, SL_L);                      // 左缘受光
    px(g, lx + 5, 33, 1, 15, SL_D);                  // 右缘背光
  }
  px(g, 16, 33, 2, 15, SL_D);                        // 腿缝
  ellipsePx(g, 13, 47, 4, 2, SL_M);                  // 左脚爪
  ellipsePx(g, 21, 47, 4, 2, SL_M);                  // 右脚爪
  /* 尾巴：贴右臀外侧甩上来。
     ⚠️ 圆心必须**压在身躯轮廓上**：整颗摆在轮廓外面就成了一个悬空的疙瘩。 */
  circlePx(g, 28, 33, 3, SL_M);
  circlePx(g, 26, 27, 2, SL_M);
  /* 绣球：压在左前爪前面（照片里球就杵在左前腿根上，是透雕的）。
     ⚠️ 半径只给 4：r5/r6 那版球跟脸一样大，一眼看过去分不清哪边是头。
        球面**不能比身子亮**（整颗刷 SL_L 会把眼睛抢过去），所以是
        SL_S 环 + SL_M 面 —— 那圈 SL_S 正是把它从肚子上"切"出来的全部依据。 */
  circlePx(g, 10, 44, 4, SL_S);
  circlePx(g, 10, 44, 3, SL_M);
  px(g, 8, 43, 2, 1, SL_L);                          // 只留左上一点受光
  /* 左前爪压在球顶上（照片里是"脚踩绣球"，球必须在爪**之下**） */
  ellipsePx(g, 11, 41, 3, 2, SL_M);
  px(g, 10, 40, 3, 1, SL_L);

  /* 鬃：**暗底椭圆 + 沿上缘一整圈卷**。石狮的鬃就是一圈卷毛围着瞪眼的脸。
     ⚠️ 卷必须**绕着脸成圈**（20°~160°），不能只在头顶摆一排：只摆头顶那版
        放大后读成了"戴毛线帽的雪人"—— 两侧没有卷，鬃在轮廓上根本不存在。
     ⚠️ 8 颗 r2/r3 是"刚好互相咬住"的密度：相邻圆心距 3.5~4.1px、半径和 5px，
        于是卷与卷之间只留一道 1px 的暗缝 —— 读成一圈卷毛，而不是一串珠子。
        低于 6 颗就散成珠子，高于 10 颗就糊成一条毛边。
     ⚠️ 弧半径 13 + 脸半宽 8 ⇒ 鬃圈净厚 ~5px。**脸一定要比鬃小一圈**：
        v2 那版脸半宽 10、弧半径 12，脸把每个卷的内半边全盖掉，鬃只剩
        头顶一排骨刺。 */
  ellipsePx(g, CX, 16, 14, 13, SL_D);
  slCurlArc(g, CX, 15, 13, 20, 160, 8, 2, 0.86);
  /* 脸：**整只最亮的地方**（照片里狮脸是浅色的，鬃是深色的）。
     三层：SL_L 底 + SL_M 下巴（否则下脸和额头一样亮，嘴就陷进去看不见）
     + SL_HI 额头一点。⚠️ SL_HI 只给额头那 4×3，整张脸刷满 = 一块没五官的惨白斑。 */
  ellipsePx(g, CX, 18, 8, 9, SL_L);
  ellipsePx(g, CX, 23, 6, 4, SL_M);                  // 下巴（稍暗）
  ellipsePx(g, CX - 1, 14, 4, 3, SL_HI);             // 额头受光
  /* ⚠️ 没有耳朵：34px 宽的石狮放不下那对三角耳 —— 画上去只剩一条 1px 的斜刺
     （v2 就是），反而在轮廓上戳出两根天线。实拍照片里狮耳也基本埋在鬃里。
     头顶那两团略大的卷（20°/160°，r3）就是它全部的"耳"。 */

  /* ---- ② 描边（左上受光 / 右下背光，读→算→写各一拍） ----
     ⚠️ 左上用 SL_L 而不是 SL_HI：最亮的那档留给脸上，描边一提亮，
        连台基都会被镶上一圈白边（放大看像贴纸）。 */
  slEdge(g, W, H, -1, -1, SL_L);
  slEdge(g, W, H, 1, 1, SL_D);

  /* ---- ③ 刻画 ---- */
  /* 台基线脚：每级上棱提亮、级间压一道暗缝（照片里的台基是有线脚的） */
  px(g, 3, 55, 28, 1, SL_L);
  px(g, 6, 51, 22, 1, SL_DARK_D);
  px(g, 9, 48, 16, 1, SL_L);
  px(g, 3, 58, 28, 1, SL_BASE_D);
  px(g, 3, 61, 28, 1, SL_BASE_D);
  /* 眉：两道上挑的暗拱（**只画上半圈**）。
     ⚠️ 画整颗圆就成了"两眼上方各一颗黑痣"，而且圆心一挨近就连成一道帽檐。
        这里先落一颗 r2 暗珠、再用脸的中间调把下半圈抹掉 —— 剩下半道拱。
     ⚠️ 脸只有 15px 宽，两眉 r3 圆心距 10 ⇒ 中间只剩 3px，会连成一条横杠
        （整张脸读成"戴帽子的雪人"）。所以必须是 r2 + 圆心距 10。 */
  for (const bx of [12, 22]) {
    circlePx(g, bx, 13, 2, SL_D);
    px(g, bx - 2, 13, 5, 3, SL_L);
  }
  /* 眼：两颗凸出来的圆珠（石狮的标志），一深一亮。
     ⚠️ 3×3 是下限：2×2 在 34px 的狮子上就是两个点，读不出"瞪"。 */
  for (const ex of [13, 21]) {
    px(g, ex, 16, 3, 3, SL_S);
    px(g, ex, 16, 2, 2, SL_L);
    px(g, ex, 16, 1, 1, SL_HI);
  }
  /* 鼻：又宽又扁（比脸暗一档才看得见 —— 刷 SL_L 等于没画）。
     ⚠️ 鼻梁顶**只许提一档到 SL_L**：压一行 SL_HI 会在眉—眼—鼻之间连出一个
        亮"T"字，五官全糊在一起。 */
  poly(g, [[14, 20], [20, 20], [22, 22], [12, 22]], SL_M);
  px(g, 12, 20, 8, 1, SL_L);
  /* 嘴：张着，一道暗口 + 上下两排牙 */
  px(g, 14, 23, 6, 3, SL_S);
  for (let i = 0; i < 3; i++) {
    px(g, 14 + i * 2, 23, 1, 1, SL_M);               // 上排牙
    px(g, 14 + i * 2, 25, 1, 1, SL_M);               // 下排牙
  }
  /* 下颌那挂卷须：**一排半圆齿**，挂在下巴正下方的胸口上。
     ⚠️ 不能用 slCurl 排一排：那样每颗都是"暗环 + 亮芯 + 高光点"，4 颗并排
        放大后读成一串**珠子项链**（试过，比没有还糟）。
        这里改成和眉同一招 —— 落一排 r3 暗珠，再用躯干的中间调把**下半**抹掉，
        剩下 5 个向上出挑的暗齿 ⇒ 读成毛不是珠。
     ⚠️ **必须比鬃窄、比鬃短**：v2 那版上下各一排、上排 5 颗 r3 横跨 14px，
        放大后跟鬃连成一片，整只狮子变成一颗爆米花。
     ⚠️ 排在脸**之后**：它是从下巴挂下来的，压在胸口。 */
  for (let i = 0; i < 5; i++) {
    const bx = 9 + i * 4;
    circlePx(g, bx, 30, 3, SL_D);
    px(g, bx - 3, 30, 7, 2, SL_M);
  }
  /* 脚爪趾 */
  for (const fx of [10, 18]) for (let i = 0; i < 4; i++) px(g, fx + i, 47, 1, 2, SL_D);
  /* 绣球的镂空孔（透雕，一眼就能认出这是绣球而不是石头）。
     ⚠️ 球只有 r4，孔最多 4 颗：5 颗以上这颗球就散架了。 */
  for (const h of [[9, 42], [12, 42], [10, 46], [8, 44]]) px(g, h[0], h[1], 1, 1, SL_S);
  /* 尾巴尖那撮卷 */
  slCurl(g, 28, 33, 2, true);
  /* 躯干上的凿痕（照片里石狮身上散布着深色小斑，不是纯平涂） */
  for (const s of [[13, 37], [22, 38], [24, 31], [8, 39], [21, 44]]) px(g, s[0], s[1], 1, 1, SL_D);
  /* 收尾：撒一点风化亮斑（青石在户外会起白霜）。
     ⚠️ 只撒在**躯干**（y30..48），绝对不能撒到鬃和脸上 —— v2 那版铺满整只
        20 颗，鬃是暗底，亮斑在暗底上全亮起来，整只成了雪人。
     ⚠️ 数量按**成品面积**定：34×62 = 2108 像素，9 颗 = 0.43% ——
        和 28×46 那版（6 颗 / 1288 = 0.47%）同密度。密度是硬指标，不是手感。 */
  speckle(g, 5, 30, W - 10, 18, rgba(SL_L, 0.34), 9, rng);
  /* 台基在地上的接触影 */
  px(g, 3, H, 28, 1, "rgba(14,18,28,0.30)");
  px(g, 3, H + 1, 28, 1, "rgba(14,18,28,0.16)");
  return { canvas: c, ax: W / 2, ay: H };
}

/* --- 5.4.9 摆进世界 ---
   ⚠️ 碰撞盒一律按**成品尺寸**算（SM_DW/SL_DW），不是设计尺寸 —— 用 SM_W 会在
      已经减半的碑周围凭空围出一圈 100px 宽的"空气墙"。 */
function buildSouthStone() {
  addProp(Object.assign({}, makeSchoolStone(), { x: SM_X, y: SM_BY, tag: "smStone" }));
  /* 碑是一堵墙：碰撞盒给"足迹"（南沿 SM_BY 往北 11px），玩家绕得过去、穿不过去 */
  addSolid(SM_X, SM_BY, SM_DW - 12, 11);
  /* 石狮并排在西侧、同一条落地线（baseY 相等 ⇒ 谁也不压谁，水平上也不重叠） */
  addProp(Object.assign({}, makeStoneLion(), { x: SL_X, y: SL_BY, tag: "smLion" }));
  addSolid(SL_X, SL_BY, SL_DW - 6, 13);
}

   世界 x 左缘 = CAMPUS「老体育馆」的 IX(0.1271) = 49.7 —— 与建筑同一个源。 */
const GYM_CLR = { x: 110, y: 895, w: 209, h: 52 };   // x110..319 / y895..947

/* --- 5.5.2 点阵字：1bit 掩膜 → 金字（上亮下暗的浮雕感） --- */
function gyBits(b64, cnt) {
  const s = atob(b64), out = new Uint8Array(cnt);
  for (let i = 0; i < cnt; i++) out[i] = (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  return out;
}
/* 逐列取"竖run"整段铺金，再给 run 的两端点高光/暗金。
   ⚠️ 门槛是 **run 长 ≥ 3**，不是 ≥2。毛笔字的笔画在 26px 字高下大多正好落在
      2px 的 run 上；对 2px 的 run 点上高光+暗金，就等于把这一列**整列**替换成
      "上浅下深"、一点实金 (#c8963c) 都不剩 —— 整排字看上去又虚又断，第一版
      就是这么"发毛"的。≥3 时中间至少留一行实金，浮雕才成立。 */
function gyGlyph(g, b64, nw, nh, x, y) {
  const b = gyBits(b64, nw * nh);
  const HI = "#ecc97c", GO = "#c8963c", DK = "#7c5a24";
  for (let i = 0; i < nw; i++) {
    let j = 0;
    while (j < nh) {
      if (!b[j * nw + i]) { j++; continue; }
      let k = j;
      while (k + 1 < nh && b[(k + 1) * nw + i]) k++;
      px(g, x + i, y + j, 1, k - j + 1, GO);
      if (k - j + 1 >= 3) { px(g, x + i, y + j, 1, 1, HI); px(g, x + i, y + k, 1, 1, DK); }
      j = k + 1;
    }
  }
}

/* --- 5.5.3 青绿竖肋带上的门头字 --- */
function gymSign(g) {
  let tw = 0;
  for (const e of GY_CHARS) tw += e[1];
  tw += GY_GAP * (GY_CHARS.length - 1);
  let x = GY_CX - tw / 2;
  for (const e of GY_CHARS) {
    const nw = e[1], nh = e[2];
    gyGlyph(g, e[0], nw, nh, Math.round(x), GY_BASE_Y - nh);
    x += nw + GY_GAP;
  }
  /* 落款：照片里「馆」右下方还有一行小字与一方印（金色的，很小）。
     1bit 尺度下画不出字形，按照片的位置与大小直接点两块 —— 有它才像实拍。
     ⚠️ 起点必须取**馆的右缘**，不能拿循环跑完的 x 去减（x 已经在字距之外了，
        减 34/22 会正好落回「馆」身上，第一版就是这么把印盖在字上的）。 */
  const sx = Math.round(GY_CX + tw / 2) + 2;
  px(g, sx, GY_BASE_Y - 4, 8, 3, "#b98d38");            // 小字一行
  px(g, sx, GY_BASE_Y - 4, 8, 1, "#d8ae56");
  px(g, sx + 11, GY_BASE_Y - 6, 4, 4, "#a87f30");       // 印：外框
  px(g, sx + 12, GY_BASE_Y - 5, 2, 2, "#e0c07a");       // 印：中空提亮（实心会读成一块金疙瘩）
}

/* --- 5.5.4 立面 --- */
function gymFacade(g) {
  /* 1) 白瓷砖压顶（照片最上面那条细密的白色小方砖） */
  px(g, GY_X0, GY_EAVE, GY_X1 - GY_X0, GY_CAP - GY_EAVE, "#e4dfd3");
  for (let x = GY_X0; x < GY_X1; x += 9) px(g, x, GY_EAVE, 1, GY_CAP - GY_EAVE, "#d3cdbe");
  px(g, GY_X0, GY_CAP - 1, GY_X1 - GY_X0, 1, "#b3ac9c");

  /* 2) 青绿竖肋带 + 门头金字（照片里这一带占立面近四成高） */
  px(g, GY_X0, GY_CAP, GY_X1 - GY_X0, GY_BAND - GY_CAP, "#63897f");
  for (let x = GY_X0 + 1; x < GY_X1; x += 4) px(g, x, GY_CAP, 1, GY_BAND - GY_CAP, "#587c73");
  px(g, GY_X0, GY_CAP, GY_X1 - GY_X0, 1, "#4a6b63");
  px(g, GY_X0, GY_BAND - 2, GY_X1 - GY_X0, 2, "#4a6b63");
  gymSign(g);

  /* 3) 白瓷砖 + 一排蓝绿玻璃窗 */
  px(g, GY_X0, GY_BAND, GY_X1 - GY_X0, GY_WIN - GY_BAND, "#e4dfd3");
  for (let x = GY_X0; x < GY_X1; x += 9) px(g, x, GY_BAND, 1, GY_WIN - GY_BAND, "#d3cdbe");
  px(g, GY_X0 + 6, GY_BAND + 5, GY_X1 - GY_X0 - 12, 13, "#3f6169");
  px(g, GY_X0 + 6, GY_BAND + 5, GY_X1 - GY_X0 - 12, 2, "#6f949c");
  px(g, GY_X0 + 6, GY_BAND + 16, GY_X1 - GY_X0 - 12, 2, "#2b3d42");
  for (let x = GY_X0 + 6; x < GY_X1 - 8; x += 26)
    px(g, x, GY_BAND + 5, 2, 13, "#e4dfd3");          // 窗间瓷砖柱

  /* 4) 入口区：白瓷砖墙 + 白色弧面雨棚 + 青铜柱深色玻璃门 */
  px(g, GY_X0, GY_WIN, GY_X1 - GY_X0, GY_BASE - GY_WIN, "#e4dfd3");
  for (let x = GY_X0; x < GY_X1; x += 9) px(g, x, GY_WIN, 1, GY_BASE - GY_WIN, "#d3cdbe");

  /* 雨棚：照片里是一整片**白色弧面**，前缘微微下垂 —— 不是尖角。
     所以用等宽横带堆出厚度，收分只给 2px（第一版按 i*7 收，画出来是个白楔子）。 */
  const CW = GY_BAY + 16;                                   // 半宽 68
  for (let i = 0; i < 8; i++) {
    const w = CW * 2 - i * 2;
    px(g, Math.round(GY_CX - w / 2), GY_WIN + 1 + i, Math.round(w), 1,
       i < 5 ? "#eeeadf" : "#d6cfbf");
  }
  px(g, GY_CX - CW + 1, GY_WIN + 9, CW * 2 - 2, 2, "#b8b1a0");        // 前缘暗面
  px(g, GY_CX - CW + 1, GY_WIN + 11, CW * 2 - 2, 1, "rgba(40,44,50,0.20)");

  /* 入口两翼的深色玻璃窗（照片里门左右各有一段，不是一片白瓷砖） */
  for (const [w0, w1] of [[GY_X0 + 12, GY_CX - GY_BAY - 22], [GY_CX + GY_BAY + 22, GY_X1 - 12]]) {
    px(g, w0, GY_WIN + 12, w1 - w0, 18, "#3f6169");
    px(g, w0, GY_WIN + 12, w1 - w0, 2, "#6f949c");
    px(g, w0, GY_WIN + 28, w1 - w0, 2, "#2b3d42");
    for (let x = w0 + 11; x < w1 - 3; x += 13) px(g, x, GY_WIN + 14, 1, 14, "#8d9aa0");
  }

  /* 门：青铜柱 + 深色玻璃 + 竖梃 + 门扇上的三角斜撑（照片里每扇门一片） */
  px(g, GY_CX - GY_BAY, GY_WIN + 11, GY_BAY * 2, GY_BASE - GY_WIN - 11, "#7d5c42");
  px(g, GY_CX - GY_BAY + 6, GY_WIN + 13, GY_BAY * 2 - 12, GY_BASE - GY_WIN - 15, "#2e3c40");
  px(g, GY_CX - GY_BAY + 6, GY_WIN + 13, GY_BAY * 2 - 12, 2, "#59767c");
  for (let x = GY_CX - GY_BAY + 12; x < GY_CX + GY_BAY - 8; x += 13)
    px(g, x, GY_WIN + 15, 1, GY_BASE - GY_WIN - 18, "#8d9aa0");
  for (let i = -1; i <= 1; i++) {
    const x = GY_CX + i * 26;
    for (let j = 0; j < 6; j++) {
      const w = 11 - j * 2, half = w >> 1;
      /* 只描 1px 的边：实心三角在门玻璃上太抢戏（照片里那圈金属框很细） */
      px(g, x - half, GY_WIN + 22 + j, j === 5 ? w : 1, 1, "#9aa7ac");
      if (j < 5) px(g, x + half, GY_WIN + 22 + j, 1, 1, "#9aa7ac");
    }
  }
}

/* --- 5.5.5 门前长台阶（照片里 13 级、米黄石材、钢管扶手） --- */
function gymStair(g) {
  const SX0 = GY_CX - 100, SW = 200, NT = 13, TH = GY_STAIR / NT;
  /* 两翼侧帮 */
  px(g, SX0 - 4, GY_BASE, 4, GY_STAIR, "#a8967a");
  px(g, SX0 + SW, GY_BASE, 4, GY_STAIR, "#a8967a");
  px(g, SX0 - 4, GY_BASE, 4, 1, "#c6b491");
  px(g, SX0 + SW, GY_BASE, 4, 1, "#c6b491");
  /* 13 级：踏步鼻迎光 + 踢面阴影，逐级微色差免得像一整块板 */
  for (let i = 0; i < NT; i++) {
    const y = GY_BASE + i * TH;
    px(g, SX0, y, SW, TH, i % 2 ? "#c9b795" : "#d2c0a0");
    px(g, SX0, y, SW, 1, "#e0cfa8");
    px(g, SX0, y + TH - 1, SW, 1, "#a08e6e");
  }
  /* 楼体落地线与台阶顶的接缝 */
  px(g, SX0, GY_BASE - 1, SW, 1, "rgba(30,34,40,0.35)");
  /* 钢管扶手：照片里是斜着往上收的（近宽远窄），像素上就是一条微斜的暗线 */
  for (const rx of [GY_CX - 46, GY_CX, GY_CX + 46]) {
    const botX = rx + Math.round((rx - GY_CX) * 0.10);
    const n = GY_STAIR - 14;
    for (let j = 0; j <= n; j++) {
      const rb = Math.round(rx + (botX - rx) * (j / n));
      /* 2px 实心杆 + 左缘高光（按行交替明暗会画成一条虚线，像绳子不像钢管） */
      px(g, rb, GY_BASE + 12 + j, 2, 1, "#4b5155");
      px(g, rb, GY_BASE + 12 + j, 1, 1, "#7d858a");
    }
    px(g, Math.round(botX) - 1, GY_BASE + 12 + n, 3, 2, "#3f4549");
  }
  /* 梯脚两盏立灯（照片左下那根） */
  for (const lx of [SX0 - 12, SX0 + SW + 6]) {
    px(g, lx, GY_BASE + 24, 4, GY_STAIR - 24, "#3a4145");
    px(g, lx, GY_BASE + 24, 1, GY_STAIR - 24, "#5c6569");
    px(g, lx - 1, GY_BASE + 20, 6, 4, "#c8963c");
    px(g, lx - 1, GY_BASE + 20, 6, 1, "#ecc97c");
  }
  /* 台阶外沿的接地影，让它"坐"在砖石路上 */
  px(g, SX0 - 4, GY_BASE + GY_STAIR, SW + 8, 1, "rgba(30,34,40,0.20)");
}

/* --- 5.5.6 覆盖重绘入口 --- */
function gymRestyle(b) {
  const old = b.canvas;
  /* 几何闸：30_building.js 的算式一旦改动，这里立刻在控制台报出来（好过默默画歪）。
     判据取**落地线以下的那截尾巴**（SHY 21 + 画布尾 14 = 35）而不是画布总高 ——
     总高跟着 roofT 走（本轮 345 → 504，因为屋面板改成铺满进深），尾巴才是
     "30 段的 PADT / SHY / 画布高公式没动"的那个不变量（PADT 一改它就变 37）。 */
  if (old.height - GY_BASE !== 35)
    console.warn("55_gym: 精灵高 %d − 落地线 %d ≠ 35，30 段的 PADT/roofT/SHY 公式可能改了",
                 old.height, GY_BASE);
  const c = mkCanvas(old.width, old.height + GY_STAIR);
  const g = c.getContext("2d");
  g.drawImage(old, 0, 0);
  /* 檐下沿以下整段擦掉重画（见文件头"为什么是覆盖重绘"） */
  g.clearRect(0, GY_EAVE, c.width, c.height - GY_EAVE);
  gymFacade(g);
  gymStair(g);
  b.canvas = c;
  return b;
}

/* --- 5.5.7 台阶净空（世界坐标，见文件头第三段） --- */
function clearGymStairs() {
  const C = GYM_CLR, cx1 = C.x + C.w, cy1 = C.y + C.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* 楼自己保留；宽 > 110 的当楼处理（体育馆本体宽 382） */
    if (p.img.width > 110) { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    if (x0 < cx1 && x0 + p.img.width > C.x && y0 < cy1 && y0 + p.img.height > C.y) {
      dropped++;
      continue;
    }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/*__MH_GEN_BEGIN__*/

/* --- 5.6.1 三件东西的落点（世界像素；与 minghudetail.txt 的对应见文件头一） --- */
const MH_ST_X = 2727, MH_ST_BY = 1187;        // 石碑：碑心 x / 落地线 y（**照抄用户值**）
const MH_ISLE_X = 2804, MH_ISLE_BY = 1108;    // 湖心岛：亭子中轴 x / 精灵落地线
