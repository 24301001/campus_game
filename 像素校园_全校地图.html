 * 四、⚠️ 本轮必须**单独声明**的一件事：addSolid 变了 ⇒ 又一次重掷全校园散射
 *   碰撞盒 `addSolid(WR_CX, WR_RAIL_Y1, WR_RAIL_W, WR_RAIL_D)` 随围栏从
 *   132×84 缩到 66×42 ⇒ `ptBlocked` 的判定变了 ⇒ 散射循环里既当"已接受点数"
 *   又当"物种种子"的那个 `n` 平移 ⇒ 全校园的树 / 灌木 / 花坛 / 垃圾桶重掷一遍
 *   （60 段 §6.6 头部那条地雷，[[pixel-campus-scatter-seed-landmine]]）。
 *   accept / verify / zoomtest 三套**一个数都不会变**；唯一探针是
 *   `_build/_propdiff.py`（必须跳过 `tag==='duck'`）。
 *   这不是"顺手多做的一件事"：用户要求围栏"大幅度收缩"，碰撞盒不跟着缩就是
 *   "玩家被一堵看不见的墙挡在栏杆外一圈"，交付说明里单独写了。
 *
 * 五、几何一律从**用户坐标**派生，不存第二份
 *   `WR_CX/WR_CY` 是用户给的那两个数，其余（底座四边、栏杆圈四边、精灵画布框、
 *   锚点、碰撞盒、净空框）全部由它们现算 —— 铁律「派生量不许再存一份常量」
 *   （56_minghu.js 踩过：湖一缩小，贴着湖的旧坐标全废）。
 * ==========================================================================*/

const WR_CX = 2439, WR_CY = 1880;      // ← 用户指定的世界坐标（整组件的中心落地点）

/* --- 5.10.1 底座：22 宽 × 16 进深 × 26 高（世界像素）---
   ⚠️ 屏幕上"顶面"占的是**进深**那一段（高 16）、"南立面"占的是**高度**那一段（高 26）
      —— 这套 2.5D 的映射是 (x, y, z) → 屏幕 (x, y − z)，所以：
        顶面屏幕 y ∈ [yB − D − H, yB − H]、立面屏幕 y ∈ [yB − H, yB]。
      第一版把这两段写反了（顶面放在立面**下面**），画出来是一个倒扣的盒子。 */
const WR_PED_W = 22, WR_PED_D = 16, WR_PED_H = 26;
const WR_PED_BS = 8, WR_PED_O = 1;     // 下段台座高 / 每边外挑（原 16 / 2）
const WR_PED_X0 = WR_CX - WR_PED_W / 2;              // 2428
const WR_PED_BY = WR_CY + WR_PED_D / 2;              // 1888 = 底座南沿（落地线）
const WR_PED_YF = WR_PED_BY - WR_PED_H;              // 1862 = 顶面南沿 = 立面上沿
const WR_PED_YT = WR_PED_YF - WR_PED_D;              // 1846 = 顶面北沿

/* --- 5.10.2 栏杆圈：50 × 38、高 10（原 132 × 84、高 20）---
   一个"栏板单元"＝两根望柱 + 中间一块石栏板，单元宽 WR_RAIL_UW，首尾相接成整圈。
   透空 3px 是"栏杆"与"矮墙"在像素尺度上的唯一区别（同 37 段网球场围栏的 tbMesh）——
   折半后只剩 3px，不能再少，否则整圈读成一条实心矮墙。

   ⚠️ 为什么**不是**跟着雕像一起折半（66 × 42）——那是第一版折半后的值，出图一看
      还是个"围场"：底座外轮廓 24 × 18（含台座外挑），圈在 66 × 42 里两侧各空
      21px、南北各空 12px，空得比底座本身还宽。用户原话是**两句**：
      「围栏应该大幅度收缩」＋「整个雕像也需要大幅收缩到原来的一半左右」——
      「也」字说明这是两件事，前一句要的是**相对**收缩（缩小圈/底座之比），
      只按同一比例折半的话这个比值 2.75 一点没动，等于没修。
      ⇒ 取 50 × 38：圈/底座 = 2.08（原 2.75），四周各余 13 / 11px。
   ⚠️ 进深不能压到 34 以下：南道栏杆立在 world y = WR_RAIL_Y1，**屏幕底边就等于
      Y1**，而底座台座的屏幕底边是 WR_PED_BY = 1888 —— Y1 必须比它大一点，
      否则最后画的南道会盖掉底座台座的最下一行（D = 38 ⇒ Y1 = 1899 ⇒ 留 11px）。
   ⚠️ 宽/进深都取**偶数**：奇数会让 WR_RAIL_X0/X1/Y0/Y1 落半像素（硬边项目）。 */
const WR_RAIL_W = 50, WR_RAIL_D = 38, WR_RAIL_H = 10;
const WR_RAIL_UW = 15, WR_RAIL_PW = 2;               // 单元宽 / 望柱宽
const WR_RAIL_T = 2, WR_RAIL_M = 4, WR_RAIL_B = 1;   // 上枋厚 / 板身高 / 下枋厚（合计 7，下面 3 透空）
const WR_RAIL_X0 = WR_CX - WR_RAIL_W / 2;            // 2406
const WR_RAIL_X1 = WR_CX + WR_RAIL_W / 2;            // 2472
const WR_RAIL_Y0 = WR_CY - WR_RAIL_D / 2;            // 1859
const WR_RAIL_Y1 = WR_CY + WR_RAIL_D / 2;            // 1901 ← **精灵落地线**（最南）

/* --- 5.10.3 雕像本体：32 高，站在底座**顶面**上 ---
   ⚠️ 脚取顶面中部偏南（`WR_PED_YF − 7`）而不是正中：轴测里"站在台面正中"会读成
      "悬在台口上方"，往南压半个进深才像踩实了（与 53 段台座上的砧座同一个经验，
      第一版取 14/34 ≈ 41%，现在 7/16 ≈ 44%，同一比例）。 */
const WR_FIG_H = 32;
const WR_FIG_FOOT = WR_PED_YF - 7;                   // 1855

/* --- 5.10.4 调色 ---
   雕像取**青灰石**（照片是被风雨洗出来的青绿灰，不是纯黑铜）；底座与栏杆按用户口径
   取"石头灰色"，比雕像**暖**一档 —— 两者同色会糊成一坨（53 段齿轮环与铁砧分开一档
   亮度的同一条经验）。折半后**一个色号都没动**，只动了尺寸。 */
const WR_FIG_L = "#aeb8b4", WR_FIG_M = "#8e9a96", WR_FIG_D = "#6b7672";
const WR_FIG_PANT = "#7d8783", WR_FIG_SHOE = "#4e5754";
const WR_FIG_HAIR = "#5a6461", WR_FIG_FACE = "#b7c0bb", WR_HAT = "#49524f";
const WR_ST_L = "#c9c6be", WR_ST_TOP = "#b5b2aa", WR_ST_M = "#9c998f";
const WR_ST_D = "#7c7972", WR_ST_FACE = "#a8a59d", WR_ST_BASE = "#918e86";
const WR_ST_PLAQ = "#cdc9c0";

/* ============================================================================
 * 5.10.5 栏杆构件
 * ⚠️ 画法与 37 段网球场围栏**同源**（"沿一条线立柱子、高一律读成屏幕竖直"），
 *    但石栏杆有三层板（上枋/板身/下枋）要分层，而网是网格 —— 所以没共用函数。
 *    真正共用的是那条**投影口径**：世界点 (x, y, z) → 屏幕 (x, y − z)。
 * ==========================================================================*/

/* 一根望柱：立在地脚线 (x, y) 上的石方柱 + 外挑柱头 + 接地影
   ⚠️ 柱身只画 8 高（WR_RAIL_H − 2）而不是 −4：折半前柱头占 4、柱身占 16，
      折半后柱头 2、柱身 8 —— 那三个 `top + 4` 必须跟着变 `top + 2`，
      否则柱头顶到 4px 而柱身从 4 开始画、总高变成 12 ≠ WR_RAIL_H。
      这是本函数唯一的硬编码偏移，改 WR_RAIL_H 时必须回头看它。 */
function wrPost(g, x, y) {
  const X = Math.round(x) - WR_RAIL_PW / 2, Y = Math.round(y);
  const top = Y - WR_RAIL_H;
  px(g, X, top + 2, WR_RAIL_PW, WR_RAIL_H - 2, WR_ST_M);          // 柱身
  px(g, X, top + 2, 1, WR_RAIL_H - 2, WR_ST_L);                   // 西棱受光
  px(g, X + WR_RAIL_PW - 1, top + 2, 1, WR_RAIL_H - 2, WR_ST_D);  // 东棱背光
  px(g, X - 1, top, WR_RAIL_PW + 2, 2, WR_ST_L);                  // 柱头（外挑 1px）
  px(g, X - 1, top, WR_RAIL_PW + 2, 1, shade(WR_ST_L, 0.24));
  px(g, X - 1, Y + 1, WR_RAIL_PW + 2, 1, "rgba(14,18,28,0.30)");  // 接地影
}

/* 东西走向的一段：地脚线 y、从 xa 到 xb。
   屏幕矩形 x[xa..xb] × y[Y−H .. Y]，三层是**横条**。 */
function wrRailEW(g, xa, xb, y) {
  const x0 = Math.round(xa), x1 = Math.round(xb), Y = Math.round(y), w = x1 - x0;
  if (w <= 0) return;
  const L = [[WR_RAIL_H - WR_RAIL_T, WR_RAIL_T, WR_ST_L],                        // 上枋
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M, WR_RAIL_M, WR_ST_M],            // 板身
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M - WR_RAIL_B, WR_RAIL_B, WR_ST_D]]; // 下枋
  for (const [z, t, c] of L) px(g, x0, Y - z - t, w, Math.max(1, t), c);
  px(g, x0, Y - WR_RAIL_H, w, 1, shade(WR_ST_L, 0.24));            // 上枋顶棱
  px(g, x0, Y - WR_RAIL_H + WR_RAIL_T, w, 1, shade(WR_ST_M, -0.16));// 板身上棱
  /* 石板拼缝：**每单元正中一道**。原来写死 `x0 + 11; x += 11`（与 30px 的单元宽
     并不对齐）；折半后单元只有 15px，拼缝必须落在两柱之间才读得出"一块块石板"，
     所以改成从单元宽现算（半步起、整步走）。 */
  for (let x = x0 + (WR_RAIL_UW >> 1); x < x1 - 2; x += WR_RAIL_UW)
    px(g, x, Y - WR_RAIL_H + WR_RAIL_T, 1, WR_RAIL_M, shade(WR_ST_M, -0.16));
  const n = Math.max(1, Math.round(w / WR_RAIL_UW));
  for (let k = 0; k <= n; k++) wrPost(g, x0 + (w * k) / n, Y);
}

/* 南北走向的一段：地脚线 x、从 ya 到 yb。
   ⚠️ 屏幕上是**竖长条**，三层也是**竖条**（沿栏杆走向 = 屏幕竖直）——
      每层的屏幕高是 (yb−ya)+本层厚，起点 y0−z−t。写成"一个矩形往下切三层"是错的：
      那样北端 3px 之后就没有上枋了（第一次就写错了，出图才看见栏板缺半截）。 */
function wrRailNS(g, x, ya, yb) {
  const X = Math.round(x) - WR_RAIL_PW / 2, y0 = Math.round(ya), y1 = Math.round(yb);
  const len = y1 - y0;
  if (len <= 0) return;
  const L = [[WR_RAIL_H - WR_RAIL_T, WR_RAIL_T, WR_ST_L],
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M, WR_RAIL_M, WR_ST_M],
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M - WR_RAIL_B, WR_RAIL_B, WR_ST_D]];
  for (const [z, t, c] of L) px(g, X, y0 - z - t, WR_RAIL_PW, len + t, c);
  px(g, X, y0 - WR_RAIL_H, WR_RAIL_PW, 1, shade(WR_ST_L, 0.24));
  px(g, X, y0 - WR_RAIL_H + WR_RAIL_T, WR_RAIL_PW, 1, shade(WR_ST_M, -0.16));
  const n = Math.max(1, Math.round(len / WR_RAIL_UW));
  for (let k = 0; k <= n; k++) wrPost(g, x, y0 + (len * k) / n);
}

/* ============================================================================
 * 5.10.6 底座（灰石方柱 + 下段外挑台座 + 正面铭牌）
 * ==========================================================================*/
function wrPedestal(g) {
  const x0 = WR_PED_X0, x1 = x0 + WR_PED_W, yT = WR_PED_YT, yF = WR_PED_YF, yB = WR_PED_BY;
  /* ① 顶面（22 × 16）：北棱受光、东棱背光（全局 SUN = (-0.60, -0.80) 在西北）。
        ⚠️ 折半后受光/背光棱由 2px 收成 1px —— 22 宽的面上再压 2px 棱就占掉 1/5。 */
  px(g, x0, yT, WR_PED_W, WR_PED_D, WR_ST_TOP);
  px(g, x0, yT, WR_PED_W, 1, shade(WR_ST_TOP, 0.28));
  px(g, x0, yT, 1, WR_PED_D, shade(WR_ST_TOP, 0.14));
  px(g, x1 - 1, yT, 1, WR_PED_D, shade(WR_ST_TOP, -0.20));
  px(g, x0, yF - 1, WR_PED_W, 1, shade(WR_ST_TOP, -0.26));        // 顶面南棱（与立面交界）
  /* ② 立面：上段整宽 22，高 H−BS = 18 */
  px(g, x0, yF, WR_PED_W, WR_PED_H - WR_PED_BS, WR_ST_FACE);
  px(g, x0, yF, 1, WR_PED_H - WR_PED_BS, shade(WR_ST_FACE, 0.16));
  px(g, x1 - 1, yF, 1, WR_PED_H - WR_PED_BS, shade(WR_ST_FACE, -0.20));
  /* ③ 下段台座：每边外挑 WR_PED_O，一整圈"更宽的底座"（照片里最下面那一圈） */
  px(g, x0 - WR_PED_O, yB - WR_PED_BS, WR_PED_W + WR_PED_O * 2, WR_PED_BS, WR_ST_BASE);
  px(g, x0 - WR_PED_O, yB - WR_PED_BS, WR_PED_W + WR_PED_O * 2, 1, shade(WR_ST_BASE, 0.26));
  px(g, x0 - WR_PED_O, yB - 1, WR_PED_W + WR_PED_O * 2, 1, shade(WR_ST_BASE, -0.26));
  /* ④ 正面铭牌：浅色方板（照片里立面上唯一的高光细节）。22 宽的立面上放 12 × 7，
        底边离台座沿还有 6px —— 折半前是 22×15 放 44 宽立面上、底边余 12，比例一致。 */
  const pw = 12, ph = 7, qx = WR_CX - pw / 2, qy = yF + 5;
  px(g, qx - 1, qy - 1, pw + 2, ph + 2, shade(WR_ST_FACE, -0.32));
  px(g, qx, qy, pw, ph, WR_ST_PLAQ);
  px(g, qx, qy, pw, 1, shade(WR_ST_PLAQ, 0.22));
  px(g, qx, qy + ph - 1, pw, 1, shade(WR_ST_PLAQ, -0.24));
  px(g, qx, qy, 1, ph, shade(WR_ST_PLAQ, 0.10));
  px(g, qx + pw - 1, qy, 1, ph, shade(WR_ST_PLAQ, -0.14));
  /* ⑤ 接地：底座那一圈最深 */
  contactBand(g, x0 - WR_PED_O + 1, x1 + WR_PED_O - 1, yB - 1, 2, 0.32);
}

/* ============================================================================
 * 5.10.7 雕像本体（站立挥手像）
 *   自上而下：脸 5（含发 2）/ 颈 1 / 躯干 12 / 裤 12 / 鞋 2 = 32。
 *   ⚠️ 挥手的是**右臂**（照片里在观众看来在**左边**）—— 本项目所有建筑精灵都画朝南
 *      立面、人物也一律面朝南，所以雕像的右手 = 屏幕左侧。**别画反**。
 * ==========================================================================*/
function wrFigure(g) {
  const cx = WR_CX, foot = WR_FIG_FOOT;
  const T = foot - WR_FIG_H;                 // 1823 头顶
  const faceB = T + 5;                       // 1828 下颌
  const neckB = T + 6;                       // 1829 肩线
  const torsoB = T + 18;                     // 1841 下摆
  /* ① 头：发 2 + 脸 3；两侧各 1px 侧发把脑袋从背景里"切"出来 */
  px(g, cx - 2, T, 4, 5, WR_FIG_FACE);
  px(g, cx - 2, T, 4, 2, WR_FIG_HAIR);
  px(g, cx - 3, T + 1, 1, 3, WR_FIG_HAIR);
  px(g, cx + 2, T + 1, 1, 3, WR_FIG_HAIR);
  px(g, cx - 1, faceB - 1, 2, 1, shade(WR_FIG_FACE, -0.22));       // 下颌影
  /* ② 颈（折半后只剩 1px —— 再薄就没了，再厚就顶掉一格躯干） */
  px(g, cx - 1, faceB, 2, 1, shade(WR_FIG_FACE, -0.16));
  /* ③ 躯干：**上下同宽 8**（用户口径 ⑤）—— 没有收分，直筒。 */
  px(g, cx - 4, neckB, 8, torsoB - neckB, WR_FIG_M);
  px(g, cx - 4, neckB, 1, torsoB - neckB, WR_FIG_L);               // 西侧受光
  px(g, cx + 3, neckB, 1, torsoB - neckB, WR_FIG_D);               // 东侧背光
  /* 翻领（两块浅色小方）+ 领口开缝 */
  px(g, cx - 3, neckB, 2, 3, WR_FIG_L);
  px(g, cx + 1, neckB, 2, 3, WR_FIG_L);
  px(g, cx - 1, neckB, 1, 4, shade(WR_FIG_M, -0.26));
  /* 门襟扣：中线一列 */
  for (let y = neckB + 5; y < torsoB - 2; y += 4) px(g, cx - 1, y, 1, 1, WR_FIG_D);
  /* 下摆两个口袋：折半后每个只剩 2 宽（原来 5 宽，8 宽的躯干上放不下两个 5） */
  px(g, cx - 4, torsoB - 6, 2, 3, shade(WR_FIG_M, -0.16));
  px(g, cx + 1, torsoB - 6, 2, 3, shade(WR_FIG_M, -0.16));
  px(g, cx - 4, torsoB - 6, 2, 1, WR_FIG_L);
  px(g, cx + 1, torsoB - 6, 2, 1, WR_FIG_L);
  px(g, cx - 4, torsoB - 1, 8, 1, shade(WR_FIG_M, -0.14));         // 下摆压暗
  /* ④ 裤 + 鞋（用户口径 ④⑤）：一整块 8 宽，**与躯干同宽**，中间只一道同色系
        明暗线当裤缝 —— 是明暗不是缝隙，背景不会从裆里透出来。 */
  const paw = foot - torsoB - 2;             // 裤长 12（留 2 给鞋）
  px(g, cx - 4, torsoB, 8, paw, WR_FIG_PANT);
  px(g, cx - 4, torsoB, 1, paw, shade(WR_FIG_PANT, 0.14));         // 西侧受光
  px(g, cx + 3, torsoB, 1, paw, shade(WR_FIG_PANT, -0.18));        // 东侧背光
  px(g, cx, torsoB, 1, paw, shade(WR_FIG_PANT, -0.10));            // 裤缝（明暗线）
  /* 鞋：同样一整块 8 宽 2 高，中间 1px 暗线分出左右脚 */
  px(g, cx - 4, foot - 2, 8, 2, WR_FIG_SHOE);
  px(g, cx - 4, foot - 2, 8, 1, shade(WR_FIG_SHOE, 0.24));
  px(g, cx, foot - 2, 1, 2, shade(WR_FIG_SHOE, -0.30));
  /* ⑤ 右臂（**屏幕左侧**）向外上举。用户口径 ①：
        臂长 5 步（原来 12）、指尖只高过头顶 4px（原来 18）；
        **手不单独画** —— 臂端直接收一个 3×3 的方块（与臂同宽），不向外突出。
        斜带用"每步 1px 横 / 2px 竖"的阶梯逼近，3px 宽的方带在像素尺度下
        比逐点 1px 更结实（后者会画成一条毛毛的虚线）。
        ⚠️ 起笔 x 取 `cx − 5` 而不是 `cx − 4`：块是 (X−1) 起、3 宽，取 cx−4 时
           最右一列正好落在 cx−3，与**左侧鬓发同一列** ⇒ 斜带读成"从脑袋上长出来"。
           往左挪 1px 后，块右缘 cx−4 = 躯干左缘，仍与肩相连但离开了头。 */
  for (let i = 0; i <= 4; i++) {
    const X = cx - 5 - i, Y = neckB + 1 - i * 2;
    px(g, X - 1, Y - 1, 3, 3, WR_FIG_M);
    px(g, X - 1, Y - 1, 1, 3, WR_FIG_L);
    px(g, X + 1, Y - 1, 1, 3, WR_FIG_D);
  }
  px(g, cx - 11, T - 4, 3, 3, WR_FIG_FACE);                        // 手（3×3，与臂同宽）
  /* ⑥ 左臂（屏幕右侧）垂在身侧，手里一顶帽子（照片里胯边那块深色） */
  px(g, cx + 4, neckB + 1, 2, 9, WR_FIG_M);
  px(g, cx + 4, neckB + 1, 1, 9, WR_FIG_L);
  px(g, cx + 5, neckB + 2, 1, 8, WR_FIG_D);
  px(g, cx + 3, neckB + 9, 4, 2, WR_HAT);                          // 帽子（比臂宽 1px/侧）
  px(g, cx + 3, neckB + 9, 4, 1, shade(WR_HAT, 0.26));
  /* ⑦ 站在台面上的接地：脚下一道深带（不是投影 —— 投影落在台面上会读成"影子悬空"） */
  contactBand(g, cx - 4, cx + 4, foot - 1, 2, 0.22);
}

/* ============================================================================
 * 5.10.8 雕像精灵
 *   ⚠️ canvas 越界是**静默**的 —— 手指尖或柱头会被裁掉一条边还不报错
 *      （53 段的 DIA_RING_* 同理）。所以这个框**一律从上面那些尺寸派生**，
 *      不再各写一个绝对数字（第一版是一排手量的整数 2366/1744/146/186）：
 *        西 / 东 = 栏杆圈外 4px（柱头外挑 1 + 余量）
 *        北      = 头顶再往上 8（举起的右手要 6）
 *        南      = 底座落地线 + 26（方向性投影 SHY=21 + 余量）
 *   ⚠️ 绘制次序 = 遮挡关系：北栏杆（最远）→ 东西栏杆 → 底座+雕像 → 南栏杆（最近）。
 *      北栏杆的中间段会被后画的底座盖住，**这正是对的**（底座在圈内、离镜头更近）。
 * ==========================================================================*/
const WR_CV_X0 = WR_RAIL_X0 - 4;                       // 2402
const WR_CV_X1 = WR_RAIL_X1 + 20;                      // 2492（东侧容下投影 SHX=16）
const WR_CV_Y0 = WR_FIG_FOOT - WR_FIG_H - 8;           // 1815（头顶 1823 − 8）
const WR_CV_Y1 = WR_PED_BY + 26;                       // 1914（南侧容下投影 SHY=21）
const WR_CV_W = WR_CV_X1 - WR_CV_X0;                   // 90
const WR_CV_H = WR_CV_Y1 - WR_CV_Y0;                   // 99

function wrStand() {
  const c = mkCanvas(WR_CV_W, WR_CV_H), g = c.getContext("2d");
  /* ⚠️ 用 canvas 变换把画布原点挪到世界 (WR_CV_X0, WR_CV_Y0)，于是下面每个绘图函数
     都直接吃**世界坐标**（等价于 53 段到处包一层的 diaX/diaY，只是少写几百个括号）。
     能这么干的前提：px / poly / shadowQuad / contactBand 全都只走 fillRect 路径 ——
     已核实（_syn.js:180-195）。哪天有工具改成 getImageData / 或读 g.canvas 的像素，
     这条就失效，那时必须退回逐个坐标转换。 */
  g.translate(-WR_CV_X0, -WR_CV_Y0);
  /* ⚠️ SHX / SHY 是**函数内现算**的两个局部量，**不是**全局常量 —— 30_building.js:83 与
     36_library.js:472 都是这个写法，全校没有第二份。第一版本段直接写了 `SHX, SHY`
     ⇒ 加载期 `ReferenceError: SHX is not defined`（那时 props 已装到 67 件）
     ⇒ 整页 JS 死、雕像根本没进 props，而 `_propview.py` 只会报一句
     `no prop tag weiren`，看不出是页面死了（三套自动验收同样全绿）。
     SUN 定义在 10_const.js（最前），本段顶层读它是安全的。 */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  /* 方向性投影（SUN 在西北 ⇒ 影子朝右下）：只给底座投，栏杆投了会把草地糊脏 */
  shadowQuad(g, WR_PED_X0 + 2, WR_PED_BY - 9, WR_PED_X0 + WR_PED_W - 2, WR_PED_BY,
             SHX, SHY, 0.26, 4);
  wrRailEW(g, WR_RAIL_X0, WR_RAIL_X1, WR_RAIL_Y0);       // 北（远）
  wrRailNS(g, WR_RAIL_X0, WR_RAIL_Y0, WR_RAIL_Y1);       // 西
  wrRailNS(g, WR_RAIL_X1, WR_RAIL_Y0, WR_RAIL_Y1);       // 东
  wrPedestal(g);
  wrFigure(g);
  wrRailEW(g, WR_RAIL_X0, WR_RAIL_X1, WR_RAIL_Y1);       // 南（近）
  /* ⚠️ 锚点是**画布坐标**（不受 translate 影响，addProp 认的就是这个）*/
  return { canvas: c, ax: WR_CX - WR_CV_X0, ay: WR_RAIL_Y1 - WR_CV_Y0 };
}

/* --- 5.10.9 净空：把雕像圈周围的草树清掉 ---
   散射与规则树阵各摆各的，这块草坪上本来就有柏树 / 樱花 / 灌木（实测散点落在
   圈内与圈边），不清理就是"栏杆从树里长出来"。
   净空框 = **精灵画布框（WR_CV_*）四边各外扩 8** —— 折半前是一排手量的
   `栏杆圈 ± 32/16`（196×132）；改成从画布框派生有两条好处：
     ① 整个组件再缩再长，净空自己跟上（第一版的绝对数字正是"上一轮改尺寸忘了改它"
        那一类地雷）；
     ② 判据对的是**画出来的东西**（画布框），不是"圈多大"这个间接量 ——
        树只要可能压到任何一笔（包括举起来的那只手）就得清掉。
   框本身比第一版小得多（106×115 vs 196×132 = 少 54%），落在框外的树自然就多了。
   ⚠️ 必须排在 §6.6c 的 clearPropTreeClash() **之后**（先跑会改它的保留集，
      clashDropped 的计数跟着变，验收数字就对不上了 —— 与 §5.2.8/§5.3.10 同款约束）。 */
const WR_CLR = { x: WR_CV_X0 - 8, y: WR_CV_Y0 - 8,
                 w: WR_CV_W + 16, h: WR_CV_H + 16 };
function clearWrClearance() {
  const C = WR_CLR, cx1 = C.x + C.w, cy1 = C.y + C.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* 雕像自己保留；宽 > 110 的当楼处理（这一片没有楼，保险起见 —— 同 §5.3.10） */
    if (p.tag === "weiren" || p.img.width > 110) { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    if (x0 < cx1 && x0 + p.img.width > C.x && y0 < cy1 && y0 + p.img.height > C.y) {
      dropped++;
      continue;
    }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* ============================================================================
 * §5.21 詹天佑雕塑 —— 思源楼前雕塑区西侧铺装走道（用户指定世界坐标 1818, 1927）

const ZT_CX = 1818, ZT_CY = 1927;      // ← 用户指定的世界坐标（**最底盘底椭圆的中心**）

/* --- 5.11.1 圆柱：底盘三层 + 柱身 + 柱头（世界像素）---

      "半径"占**水平**那一段 —— 与伟人像底座顶面/立面那段注释同一条口径。
   ⚠️ 半径（rx）一律取**偶数对齐的整数**、且左右对称：本项目全程硬边，
      px() 走 fillRect，半像素立刻糊出抗锯齿边（59b 踩过）。
   ⚠️ 椭圆投影比 1.71:1（53 段文件头实测值），ry = round(rx / 1.71)。 */
const ZT_B1_RX = 11, ZT_B1_RY = 6, ZT_B1_H = 2;   // 底盘第 1 层（最下、最宽）
const ZT_B2_RX =  9, ZT_B2_RY = 5, ZT_B2_H = 2;   // 底盘第 2 层
const ZT_B3_RX =  8, ZT_B3_RY = 5, ZT_B3_H = 2;   // 底盘第 3 层
const ZT_SH_RX =  7, ZT_SH_RY = 4, ZT_SH_H = 24;  // 柱身
const ZT_CP_RX =  6, ZT_CP_RY = 4, ZT_CP_H = 2;   // 柱头（比柱身**收** 1px ⇒ 照片里柱子上细下粗）

/* 三层底盘的底心（自下而上），全部由 ZT_CY 现算 */
const ZT_B1_YB = ZT_CY;                            // 1927 ← 精灵落地基准（最南沿 = YB + RY）
const ZT_B2_YB = ZT_B1_YB - ZT_B1_H;               // 1925
const ZT_B3_YB = ZT_B2_YB - ZT_B2_H;               // 1923
const ZT_SH_YB = ZT_B3_YB - ZT_B3_H;               // 1921 柱身底心
const ZT_SH_YT = ZT_SH_YB - ZT_SH_H;               // 1897 柱身顶心
const ZT_CP_YB = ZT_SH_YT;                         // 1897 柱头底心
const ZT_CP_YT = ZT_CP_YB - ZT_CP_H;               // 1894 柱头顶面（= 人的落脚基准）

/* 最南沿：第 1 层底椭圆的南极点。addProp 的 y / addSolid 的 by 都用它。 */
const ZT_S  = ZT_B1_YB + ZT_B1_RY;                 // 1933
/* 最南的**画出来**的点也是它（底盘 1 的底椭圆），所以落地线与画布基准同一处。 */

/* --- 5.11.3 铭牌：柱身中段正面 ---

/* --- 5.11.4 调色 ---

const ZT_CU_L = "#ab9280", ZT_CU_M = "#8a7364", ZT_CU_D = "#5f4e43";   // 铜（脸/手）
const ZT_CO_L = "#8a7261", ZT_CO_M = "#655245", ZT_CO_D = "#443830";   // 大衣
const ZT_VEST = "#4a3e36", ZT_SHIRT = "#cdc5b6", ZT_TIE = "#2b2420";   // 马甲/衬衫/领带
const ZT_PANT = "#4a3d36", ZT_SHOE = "#2a2422", ZT_HAIR = "#2a2320";   // 裤/鞋/发须
const ZT_GR_L = "#8a736a", ZT_GR_M = "#6d5952", ZT_GR_D = "#4c3b35";   // 花岗岩受光/侧/暗
const ZT_GR_T = "#96827a";                                            // 花岗岩顶面
const ZT_GOLD = "#f2d78e", ZT_GOLD_L = "#fff2c0", ZT_GOLD_D = "#a8894a"; // 铭牌

/* ============================================================================
 * 5.11.5 椭圆工具（逐行扫描线，硬边、无抗锯齿）
 *   ⚠️ **不引用 53 段的 ellipPx** —— 那两个函数（ellipPx / ellipRing）是为
 *      齿轮环写的，本件只需要"实心椭圆"这一个能力，自带一份比跨文件耦合更省事：
 *      53 段哪天把 ellipPx 改名/改签名，本件不会跟着碎。
 *   ⚠️ 每行都过 Math.max(1, ...)：rx 衰减到 0 的那一两行若不兜底，
 *      会画出零宽 fillRect（静默无事）或负宽（Chrome 直接忽略），都不报错但缺像素。
 * ==========================================================================*/
function ztEllip(g, cx, cy, rx, ry, col) {
  if (!(rx > 0) || !(ry > 0)) return;
  const X = Math.round(cx), Y = Math.round(cy);
  for (let y = Math.ceil(Y - ry); y <= Math.floor(Y + ry); y++) {
    const s = 1 - ((y - Y) / ry) ** 2;
    if (s <= 0) continue;
    const hw = rx * Math.sqrt(s), x0 = Math.round(X - hw);
    px(g, x0, y, Math.max(1, Math.round(X + hw) - x0), 1, col);
  }
}

/* 一段圆柱（直筒，不是锥台）：底心 (cx, yB)、半轴 (rx, ry)、高 h。
   屏幕上的三步 = ① 底圈（下半弧露在矩形外）② 柱身矩形 ③ 顶面椭圆。
   ⚠️ 次序不能换：顶面必须**最后**画，否则柱身矩形会把它盖掉；
      底圈必须**最先**画，否则它会被柱身矩形齐刷刷切掉下半。
   ⚠️ "上细下粗"不靠锥台插值实现，靠**叠三层半径递减的直筒** ——
      三层之间的台阶正好读成线脚（照片里柱子本来就是分段的）。 */
function ztDrum(g, cx, yB, rx, ry, h, cTop, cSide, cDark) {
  const yT = yB - h;
  ztEllip(g, cx, yB, rx, ry, cDark);                       // ① 底圈
  px(g, cx - rx, yT, rx * 2, h, cSide);                    // ② 柱身
  px(g, cx - rx, yT, 1, h, shade(cSide, 0.18));            //    西棱受光（SUN 在西北）
  px(g, cx + rx - 1, yT, 1, h, shade(cSide, -0.22));       //    东棱背光
  ztEllip(g, cx, yT, rx, ry, cTop);                        // ③ 顶面
}

/* ============================================================================
 * 5.11.6 柱座（三层底盘 → 柱身 → 柱头）
 * ==========================================================================*/
function ztPedestal(g) {
  ztDrum(g, ZT_CX, ZT_B1_YB, ZT_B1_RX, ZT_B1_RY, ZT_B1_H, ZT_GR_T, ZT_GR_M, ZT_GR_D);
  ztDrum(g, ZT_CX, ZT_B2_YB, ZT_B2_RX, ZT_B2_RY, ZT_B2_H, ZT_GR_T, ZT_GR_M, ZT_GR_D);
  ztDrum(g, ZT_CX, ZT_B3_YB, ZT_B3_RX, ZT_B3_RY, ZT_B3_H, ZT_GR_T, ZT_GR_M, ZT_GR_D);
  ztDrum(g, ZT_CX, ZT_SH_YB, ZT_SH_RX, ZT_SH_RY, ZT_SH_H, ZT_GR_T, ZT_GR_M, ZT_GR_D);
  ztDrum(g, ZT_CX, ZT_CP_YB, ZT_CP_RX, ZT_CP_RY, ZT_CP_H, ZT_GR_T, ZT_GR_M, ZT_GR_D);
}

/* 金色铭牌（柱身中段正面）+ 三个字位点。见文件头 §六：字**认不出来**，只示意。 */
function ztPlaque(g) {
  const x0 = ZT_PLQ_X0, y0 = ZT_PLQ_Y0, w = ZT_PLQ_W, h = ZT_PLQ_H;
  px(g, x0 - 1, y0 - 1, w + 2, h + 2, shade(ZT_GR_D, -0.24));   // 暗底衬（把牌从柱面上切出来）
  px(g, x0, y0, w, h, ZT_GOLD);
  px(g, x0, y0, w, 1, ZT_GOLD_L);                               // 上棱受光
  px(g, x0, y0 + h - 1, w, 1, ZT_GOLD_D);                       // 下棱背光
  px(g, x0, y0, 1, h, ZT_GOLD_L);
  px(g, x0 + w - 1, y0, 1, h, ZT_GOLD_D);
  for (let i = 0; i < 3; i++)                                   // 三个字位点（10/3 ≈ 3px 一格）
    px(g, x0 + 2 + i * 3, y0 + 2, 1, 2, ZT_GOLD_D);
}

/* ============================================================================
 * 5.11.7 人（站立像，双臂垂在身侧，右手屈肘搭在腰腹前）
 *   自上而下：头 5（含发 2）/ 颈 1 / 躯干 21 / 裤 5 / 鞋 2 = 34。
 *   ⚠️ 人物一律面朝南 ⇒ **右手 = 屏幕左侧**，与 59b 伟人像同一条口径，别画反。
 * ==========================================================================*/
function ztFigure(g) {
  const cx = ZT_CX, foot = ZT_FOOT, T = ZT_FIG_T;
  const faceB = T + 5, neckB = T + 6;        // 下颌 / 肩线
  const hemB  = T + 27;                      // 大衣下摆
  const pantB = foot - 2;                    // 裤脚（鞋上沿）

  /* ① 头：发 2 + 脸 3，**不加鬓发** —— 照片里头宽/头高 = 103/131 = 0.79，
        4 宽 × 5 高正好 0.80 ✓；两侧各加 1px 鬓发会把比例顶到 1.2，脑袋立刻变方
        （第一版即如此）。这里的背景是深棕柱子，深色短发本来就切得出来。 */
  px(g, cx - 2, T, 4, 2, ZT_HAIR);
  px(g, cx - 2, T + 2, 4, 3, ZT_CU_L);
  px(g, cx - 2, T + 2, 1, 1, shade(ZT_CU_L, -0.34));          // 左眼
  px(g, cx + 1, T + 2, 1, 1, shade(ZT_CU_L, -0.34));          // 右眼
  /* ⭐ 八字胡：**占满脸宽的那一整行**。这是詹天佑最好认的特征，
     34px 尺度下别的都可以省，这一行不能省（见文件头 §二③）。 */
  px(g, cx - 2, T + 3, 4, 1, ZT_HAIR);
  px(g, cx - 1, T + 4, 2, 1, shade(ZT_CU_M, -0.10));          // 下巴影

  /* ② 颈（1px —— 再薄就没了，再厚就顶掉一格躯干） */
  px(g, cx - 1, faceB, 2, 1, shade(ZT_CU_M, -0.12));

  /* ③ 躯干：大衣 8 宽（cx−4..cx+4），中间 4 宽敞开露马甲 */
  const tb = neckB, tbH = hemB - tb;
  px(g, cx - 4, tb, 8, tbH, ZT_CO_M);
  px(g, cx - 4, tb, 1, tbH, ZT_CO_L);                         // 西侧受光
  px(g, cx + 3, tb, 1, tbH, ZT_CO_D);                         // 东侧背光
  /* 敞开处：白衬衫领（顶 2 行）→ 领带 → 马甲 */
  px(g, cx - 2, tb, 4, tbH - 2, ZT_VEST);
  px(g, cx - 2, tb, 2, 2, ZT_SHIRT);
  px(g, cx, tb, 2, 2, ZT_SHIRT);
  px(g, cx - 1, tb + 2, 2, 6, ZT_TIE);
  for (let y = tb + 4; y < hemB - 3; y += 4) px(g, cx - 1, y, 1, 1, shade(ZT_VEST, -0.34));
  /* 大衣翻领：V 形两块（比大衣亮一档，才读得出"翻"） */
  px(g, cx - 4, tb, 2, 3, shade(ZT_CO_M, 0.22));
  px(g, cx + 2, tb, 2, 3, shade(ZT_CO_M, 0.22));
  /* ④ 下摆：比躯干外挑 1px/侧（照片 330/245 = 1.35，本件 10/8 = 1.25） */
  px(g, cx - 5, hemB - 6, 10, 6, ZT_CO_M);
  px(g, cx - 5, hemB - 6, 1, 6, shade(ZT_CO_M, 0.16));
  px(g, cx + 4, hemB - 6, 1, 6, shade(ZT_CO_M, -0.20));
  px(g, cx - 5, hemB - 1, 10, 1, shade(ZT_CO_M, -0.16));      // 下摆压暗

  /* ⑤ 裤：8 宽（**与躯干同宽**，照片 200/245 ≈ 0.8 —— 本件 8/8=1.0 略宽，
        是硬边项目"再窄就只剩 6px、两条腿并成一根"的下限，见文件头 §三①） */
  px(g, cx - 4, hemB, 8, pantB - hemB, ZT_PANT);
  px(g, cx - 4, hemB, 1, pantB - hemB, shade(ZT_PANT, 0.16));
  px(g, cx + 3, hemB, 1, pantB - hemB, shade(ZT_PANT, -0.20));
  px(g, cx, hemB, 1, pantB - hemB, shade(ZT_PANT, -0.12));    // 裤缝（明暗线，不是缝隙）
  /* 鞋 */
  px(g, cx - 4, pantB, 8, foot - pantB, ZT_SHOE);
  px(g, cx - 4, pantB, 8, 1, shade(ZT_SHOE, 0.28));
  px(g, cx, pantB, 1, foot - pantB, shade(ZT_SHOE, -0.34));

  /* ⑥ 右臂（**屏幕左侧**）垂到肘后屈向腹前。照片：手在**胸口下方**（y425 ⇒ T+10）。
        ⚠️ 两条手臂**不能同色** —— 屏幕左侧是受光面（SUN 在西北），右臂取大衣的
          亮档、左臂取暗档；同色的话 12px 宽的身子会读成一根直筒（第一版即如此）。
        ⚠️ 高度照照片：右手 T+10、左手 T+14 ⇒ **右高左低**，别画成对称。 */
  px(g, cx - 6, tb + 1, 2, 6, ZT_CO_L);                       // 上臂（垂下）T+7..T+13
  px(g, cx - 6, tb + 1, 1, 6, shade(ZT_CO_L, 0.14));
  px(g, cx - 5, tb + 4, 4, 2, ZT_CO_L);                       // 前臂（往内收）T+10..T+12
  px(g, cx - 5, tb + 4, 4, 1, shade(ZT_CO_L, 0.16));
  px(g, cx - 1, tb + 4, 2, 2, ZT_CU_L);                       // 手（铜 · 亮档）
  px(g, cx - 1, tb + 4, 2, 1, shade(ZT_CU_L, 0.18));
  /* ⑦ 左臂（屏幕右侧）垂得更低（照片 y505 ⇒ T+14） */
  px(g, cx + 4, tb + 1, 2, 7, ZT_CO_M);
  px(g, cx + 4, tb + 1, 1, 7, shade(ZT_CO_M, -0.10));
  px(g, cx + 5, tb + 1, 1, 7, ZT_CO_D);
  px(g, cx + 4, tb + 8, 2, 2, ZT_CU_M);                       // 手（铜 · 中档）T+14..T+16

  /* ⑧ 站在柱头顶面上的接地：脚下一道深带（不是投影 —— 投影落在顶面上会读成"悬空"） */
  contactBand(g, cx - 4, cx + 4, foot - 1, 2, 0.22);
}

/* ============================================================================
 * 5.11.8 几何自检（构建时跑一次，只 warn 不抛 —— 与本项目其余段同款）
 *   ⚠️ canvas 越界是**静默**的：多画 1px 就被裁掉一条边还不报错。所以这些
 *      判据必须"照着画布框与画出来的东西"核对，不能只看尺寸表自洽。
 * ==========================================================================*/
function ztAudit() {
  /* ⚠️ 每一条都写成**独立的 console.warn 字面量**（而不是抽一个 bad() 助手）：
     build.py 的几何闸是按 `console.warn(` 的出现次数数的 —— 抽成助手的话
     八条自检只算一处，闸门就形同虚设（70b 段同样写法，同一条理由）。 */
  if (!(ZT_CP_YT < ZT_CP_YB))
    console.warn("[§5.21 詹天佑] 柱头没有高度");
  if (!(ZT_FOOT <= ZT_CP_YT + ZT_CP_RY))
    console.warn("[§5.21 詹天佑] 脚底不在柱头顶面椭圆内（会读成悬空）");
  if (!(ZT_FIG_T > ZT_CV_Y0))
    console.warn("[§5.21 詹天佑] 头顶出画布北沿（会被静默裁掉）");
  if (!(ZT_S < ZT_CV_Y1))
    console.warn("[§5.21 詹天佑] 底盘南沿出画布南沿（投影没地方了）");
  if (!(ZT_CX - ZT_B1_RX > ZT_CV_X0))
    console.warn("[§5.21 詹天佑] 底盘西沿出画布西沿");
  if (!(ZT_CX + ZT_B1_RX + Math.round(-SUN.x * 26) <= ZT_CV_X1))
    console.warn("[§5.21 詹天佑] 底盘东沿 + 方向性投影出画布东沿");
  if (!(ZT_PLQ_Y0 > ZT_SH_YT && ZT_PLQ_Y0 + ZT_PLQ_H < ZT_SH_YB))
    console.warn("[§5.21 詹天佑] 铭牌不在柱身范围内（会压到柱头或柱脚上）");
  if (!(ZT_B1_RX > ZT_SH_RX && ZT_SH_RX > ZT_CP_RX))
    console.warn("[§5.21 詹天佑] 底盘/柱身/柱头半径次序反了（照片里是上细下粗，单调收分）");
}

/* ============================================================================
 * 5.11.9 雕塑精灵
 *   ⚠️ 画布框**一律从上面那些尺寸派生**，不各写一个绝对数字 ——
 *      整个组件再挪再长，框自己跟上（59b 第一版正是"一排手量的整数"出的血）。
 *        西 = 底盘 1 西沿再往外 4
 *        东 = 底盘 1 东沿 + 方向性投影 SHX + 4
 *        北 = 头顶再往上 8
 *        南 = 落地线 + 26（方向性投影 SHY=21 + 余量）
 *   ⚠️ SHX / SHY 是**函数内现算**的局部量，**不是**全局常量（59b 踩过：
 *      顶层直接写 SHX ⇒ 加载期 ReferenceError，整页 JS 死、而三套自动验收全绿）。
 * ==========================================================================*/
const ZT_CV_X0 = ZT_CX - ZT_B1_RX - 4;                 // 1803
const ZT_CV_X1 = ZT_CX + ZT_B1_RX + 20;                // 1849（含 SHX=16）
const ZT_CV_Y0 = ZT_FIG_T - 8;                         // 1854
const ZT_CV_Y1 = ZT_S + 26;                            // 1959（含 SHY=21）
const ZT_CV_W = ZT_CV_X1 - ZT_CV_X0;                   // 46
const ZT_CV_H = ZT_CV_Y1 - ZT_CV_Y0;                   // 105

function ztStand() {
  const c = mkCanvas(ZT_CV_W, ZT_CV_H), g = c.getContext("2d");
  /* ⚠️ 用 canvas 变换把画布原点挪到世界 (ZT_CV_X0, ZT_CV_Y0)，于是下面每个绘图
     函数都直接吃**世界坐标**（等价于 53 段到处包一层的 diaX/diaY，只是少写几百个
     括号）。能这么干的前提：px / shadowQuad / contactBand 全都只走 fillRect 路径
     —— 已核实（_build/_syn.js:180-195）；ztEllip 是本件自己的，也是纯 fillRect。
     哪天有工具改成 getImageData / 或读 g.canvas 的像素，这条就失效。 */
  g.translate(-ZT_CV_X0, -ZT_CV_Y0);
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);

  /* ① 地面投影（SUN 在西北 ⇒ 影子朝右下）。先接地影椭圆（贴柱脚一圈），
        再方向性拖影 —— 两笔合起来才读得出"这柱子压在地上"。 */
  ztEllip(g, ZT_CX + 1, ZT_B1_YB + 2, ZT_B1_RX + 1, ZT_B1_RY + 1, "rgba(14,18,28,0.22)");
  shadowQuad(g, ZT_CX - ZT_B1_RX + 3, ZT_B1_YB - 8, ZT_CX + ZT_B1_RX - 3, ZT_B1_YB + 4,
             SHX, SHY, 0.24, 4);

  ztPedestal(g);
  ztPlaque(g);
  ztFigure(g);

  ztAudit();
  /* ⚠️ 锚点是**画布坐标**（不受 translate 影响，addProp 认的就是这个）*/
  return { canvas: c, ax: ZT_CX - ZT_CV_X0, ay: ZT_S - ZT_CV_Y0 };
}

/* ============================================================================
 * 5.21.10 碰撞盒：**只封柱座**，不封人
 *   用户口径里没有栏杆，所以盒子就是柱座那圈。宽取底盘 1 的直径（22）、
 *   进深取"南沿往回 13"（盖住底盘三层的全部可见占地 + 一点点余量）。
 *   ⚠️ 与 59b 不同：那边盒子 = 整个栏杆圈（把玩家挡在圈外）；这边玩家可以
 *      贴着柱子走，只是**进不去柱子**。
 * ==========================================================================*/
const ZT_SOL_W = ZT_B1_RX * 2;                         // 22
const ZT_SOL_D = 13;

/* ============================================================================
 * 5.21.11 净空：把柱座周围的散落道具清掉（树 / 灌木 / 路灯）
 *   净空框 = **精灵画布框（ZT_CV_*）本身，不往外扩** —— 判据对的是"画出来的东西"
 *   （画布框），不是"柱子多大"这个间接量。
 *   ⚠️ 与 §5.10.9 的 ±8 不同，这里**故意不留余量**，理由是实测出来的：
 *      画布框南沿 = ZT_S + 26 = 1959，而正南恰好有一棵树
 *      （signature `tree,1844,2091,46,132`，它树顶的屏幕 y = 2091 − 132 = 1959），
 *      **正好相切**。外扩 8 会把"美术盒 ∩ 净空框 = 6px"判成冲突 ⇒ 凭空删掉一棵
 *      离柱座 164px、树冠比柱座落地线还低 26px 的树（`_propdiff` 实录：
 *      ONLY-OLD 就是它）。画布框已经把投影余量（南 +26 / 东 +20）算进去了，
 *      所以"不压进框"= "不压到任何一画"，再加余量只会误伤。
 *   ⚠️ 必须排在 §6.6c 的 clearPropTreeClash() **之后**（先跑会改它的保留集，
 *      clashDropped 的计数跟着变，验收数字就对不上了 —— 同 §5.10.9 的约束）。
 * ==========================================================================*/
const ZT_CLR = { x: ZT_CV_X0, y: ZT_CV_Y0, w: ZT_CV_W, h: ZT_CV_H };
function clearZtClearance() {
  const C = ZT_CLR, cx1 = C.x + C.w, cy1 = C.y + C.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* 雕塑自己保留；宽 > 110 的当楼处理（同 §5.10.9 —— 小道具最大 ≈86px，楼最小 ≈150px） */
    if (p.tag === "zhantianyou" || p.img.width > 110) { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    if (x0 < cx1 && x0 + p.img.width > C.x && y0 < cy1 && y0 + p.img.height > C.y) {
      dropped++;
      continue;
    }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* =========================================================
   §5.11 科学会堂：正面按用户给的 ppt 正面图覆盖重绘
   ---------------------------------------------------------
   用户口径（2026-09-17）：
     「然后进行科学会堂的复刻，也就是思源东楼北边的科学会堂。字体和照片以及 ppt
       制作的正面图都有，注意阶梯，ppt 左右的三角形和门下边的矩形都是阶梯，
       字体 1 比 1 复刻，阶梯旁边有两个柱子上边两个用来放花的半圆形盆。有可能
       会因为思源东楼遮挡一些，你适当将科学会堂向上移动一些」

   三件输入件各管一段，**不重叠**：
     ① `D:\desktop\校园示意图.pptx` **第 4 页** = **唯一的几何权威**
        （红线 3：PPT 是地图数据的唯一来源，正面图的逐形状几何同样从它读）。
        `_build/_kxslide.py 4` 把这一页 13 个形状打成英寸表 —— 本文件的 KX_EL
        就是那张表，**任何尺寸不许在别处再写一份**（坑 18：派生量不许存第二份）。
        ⚠️ `_kxslide.py` 的 union 行**没算旋转**（rtTriangle 21 的 rot=270 会把
           外框撑到 3.9431），真外框是 11.5299 × 3.6354 —— 见该工具头注释。
     ② `预览/kexuehuitang.jpg`（实拍）= **配色与材质**权威：浅灰石板檐口带 + 金字、
        白瓷砖墙、近黑玻璃幕墙（映着门前的树）、浅灰石台阶、柱顶半圆盆里两颗
        蓝绿半球植株。**比例不照照片** —— 那是地面机位的透视片，量出来是错的
        （照片里檐口带只占立面 27%，正面图是 37%）；按用户拍板，比例一律以正面图为准。
     ③ `预览/kexuehuitangfont.png`（金笔四字）= 檐口带上的「科學會堂」，
        由 `_build/_kxfont.py` 逐点降采样成 1bit 点阵（1:1 复刻字形）。

   ⚠️ 与 ppt 的三处**有意偏离**（交付说明里已声明）：
     ① ppt 把檐口带涂成默认蓝（`scheme:accent1` = #4874CB，见 `_kxslide.py`
        的 fill 列）—— 实拍是浅灰石板，按实拍画；
     ② 白底带字那一条（矩形3，x 3.4375..10.1625）实拍里与两侧同色 ⇒ 不做白/蓝
        分色，整条一色（金字因此按**檐口板**居中，比按矩形3 居中右偏 1.3px）；
     ③ 右侧的柱 / 三角 / 盆在 ppt 里比左侧低 0.03~0.1 英寸（手绘误差）⇒
        一律按**左侧的底线**归一，左右对称。

   ⚠️ 两个已知代价（用户拍板时已知，交付说明里也要写）：
     · 为让整栋从思源东楼屋脊后露出来，**精灵锚点北移 KX_DY = 85 行**。
       只动 `b.ay`：PPT 轮廓 / 灰硬地 / 碰撞盒 / 全校园散射随机流一个数都不动
       （见 60_assemble.js §6.6 那颗地雷）。
     · 北边第一教学楼最底 **8 行**（含门的下半截 ~6 行，门把手仍露）会被本栋的
       屋面板压住 —— 3/4 视角里"近楼挡远楼"的常态遮挡，不是画错。
       实测：第一教学楼精灵 = `-,2460,897,377,303`（世界行 594..897），
       本栋最上一行不透明像素 = (1206.5 − 334) + KX_PADT(18) = 890.5 ⇒ 压 890..897。

   ⚠️ 本段**只盖不擦**：立面整段是在**新画布**上重画的，不是 clearRect ——
      见 kxRestyle() 的三段说明。全零件只有一处 clearRect（撤屋名标牌，
      它挂在檐口**之上**，不擦掉会有个牌子浮在平屋面上）。
   ========================================================= */

const KX_NAME   = "科学会堂";
const KX_PADX   = 26, KX_PADT = 18;          // 与 30 段同值
const KX_PADB   = 21 + 14;                   // SHY + 14 —— 30 段画布高公式的尾巴
const KX_FLOORS = 2;                         // ⚠️ 必须等于 styleOf("科学会堂").floors

/* --- 5.11.6 檐下投影带：出挑的板在墙顶上压出来的一条深色带（渐隐）+ 筒灯暗点 ----
   ⚠️ 必须画在**墙之后** —— 正面图里两翼顶是抵着檐口板底的（1.3667 vs 1.3576，
      差 0.009 英寸 = 0.3px），中间没有缝；这条带只能在墙顶那几行上。 */
function kxSoffit(g, G, C) {
  const r = G.rect(KX_EL.slab);
  for (let i = 0; i < G.soff; i++)
    px(g, r[0], G.wallTop + i, r[2], 1,
       "rgba(14,18,28," + (0.46 * (1 - i / G.soff)).toFixed(3) + ")");
  const n = Math.max(3, Math.round(r[2] / 46));                // 板底筒灯（点数现算）
  for (let i = 0; i < n; i++)
    px(g, r[0] + Math.round(r[2] * (i + 0.5) / n) - 1, G.wallTop, 3, 2, KX_PAL.LAMP);
}

/* --- 5.11.7 白瓷砖墙：**一整片**（两翼之间不留缝） ---------------------------
   正面图里两翼是两块（12..75 / 292..355），中间那条 75..106 是作者漏画的墙 ——
   实拍里玻璃就是嵌在整片白瓷砖墙里的，所以这里整片铺，幕墙再压上去；
   幕墙左右**不等内缩**（左 31 / 右 20）照 ppt 原样保留（用户口径：忠于正面图，
   不做居中对称）。 */
function kxWall(g, G, C) {
  const r = G.rect(KX_EL.wing);
  px(g, r[0], r[1], r[2], G.baseY - r[1], C.TILE);
  for (let y = r[1] + KX_TILE; y < G.baseY; y += KX_TILE)      // 缝相位由 x0/y0 定死
    px(g, r[0], y, r[2], 1, KX_PAL.JOINT);
  for (let x = r[0] + KX_TILE; x < r[0] + r[2]; x += KX_TILE)
    px(g, x, r[1], 1, G.baseY - r[1], KX_PAL.JOINT);
  speckle(g, r[0], r[1], r[2], G.baseY - r[1], "rgba(255,255,255,0.05)", (r[2] / 3) | 0, makeRng(6121));
  speckle(g, r[0], r[1], r[2], G.baseY - r[1], "rgba(0,0,0,0.06)", (r[2] / 2) | 0, makeRng(6122));
  px(g, r[0], r[1], r[2], 1, C.TILE_T);
  px(g, r[0], r[1], 2, G.baseY - r[1], C.TILE_L);              // 左棱受光
  px(g, r[0] + r[2] - 3, r[1], 3, G.baseY - r[1], C.TILE_R);   // 右棱背光
}

/* --- 5.11.8 玻璃幕墙 + 三组双扇门 -------------------------------------------
   实拍：近黑玻璃，映着门前的树，下面三组双扇门（各有把手），门内一点暖光。 */
function kxGlass(g, G, C) {
  const r = G.rect(KX_EL.glass), gx0 = r[0], gy0 = r[1], gw = r[2], gh = r[3];
  const gy1 = gy0 + gh;
  px(g, gx0 - 2, gy0 - 2, gw + 4, gh + 4, C.GLASS_F);          // 外框（凹进去一块）
  px(g, gx0, gy0, gw, gh, C.GLASS);
  px(g, gx0, gy0, gw, 2, "rgba(8,10,16,0.55)");                // 顶内侧阴影
  px(g, gx0, gy0, 2, gh, "rgba(8,10,16,0.40)");                // 左内侧阴影（光源左上）
  /* 映进来的树影 / 天光：斜向的浅色块（贴在玻璃内，不越界） */
  px(g, gx0 + Math.round(gw * 0.08), gy0 + Math.round(gh * 0.30), Math.round(gw * 0.20), gh - Math.round(gh * 0.30), KX_PAL.MIRROR);
  px(g, gx0 + Math.round(gw * 0.40), gy0 + Math.round(gh * 0.18), Math.round(gw * 0.16), gh - Math.round(gh * 0.18), KX_PAL.MIRROR);
  px(g, gx0 + Math.round(gw * 0.74), gy0 + Math.round(gh * 0.36), Math.round(gw * 0.18), gh - Math.round(gh * 0.36), KX_PAL.MIRROR);
  px(g, gx0 + 2, gy0 + 2, gw - 4, Math.round(gh * 0.16), KX_PAL.SKY);
  for (let i = 1; i <= 4; i++)                                 // 竖梃（位置现算）
    px(g, gx0 + Math.round(gw * i / 5), gy0, 1, gh, C.GLASS_F);
  px(g, gx0, gy0 + Math.round(gh * 0.30), gw, 1, C.GLASS_F);   // 一道横档
  /* 三组双扇门：门组中线按玻璃宽现算，不写死 */
  const dh = Math.round(gh * 0.54), dy = gy1 - dh;
  const dwg = Math.round(gw * 0.155);
  for (let k = 0; k < 3; k++) {
    const cx = gx0 + Math.round(gw * (0.22 + 0.28 * k));
    const x0 = cx - Math.round(dwg / 2);
    px(g, x0, dy, dwg, dh, C.DOOR);
    px(g, x0, dy, dwg, 1, "rgba(8,10,16,0.55)");
    px(g, cx - 1, dy, 2, dh, C.GLASS_F);                                 // 中缝
    px(g, x0 + 2, dy + 2, Math.round(dwg / 2) - 3, dh - 4, KX_PAL.LIT);  // 左扇暖光
    px(g, cx + 1, dy + 2, Math.round(dwg / 2) - 3, dh - 4, KX_PAL.LIT);  // 右扇暖光
    px(g, cx - 3, dy + Math.round(dh * 0.42), 2, 4, KX_PAL.HANDLE);      // 把手
    px(g, cx + 2, dy + Math.round(dh * 0.42), 2, 4, KX_PAL.HANDLE);
    px(g, x0 + 2, dy + 2, dwg - 4, 1, "rgba(226,236,244,0.10)");         // 门楣一道反光
  }
}

/* --- 5.11.9 台阶：中央 6 级 + 两侧三角阶梯（**逐级台阶剖面**，不是光滑斜边） ----
   笔法照 55 段 gymStair / 36 段 libStair：每级 **踏步鼻受光 1 行 / 级面 1 行 /
   级间投影 1 行**，逐级微色差，免得整跑读成一块板。
   用户口径：「ppt 左右的三角形和门下边的矩形都是阶梯」—— 中央矩形 6 级、
   两侧三角各 6 级，级数以 KX_STEPS 为准（同一支）。 */
function kxStairs(g, G, C) {
  const r = G.rect(KX_EL.step);
  const yTop = G.py(KX_EL.stairY), yBot = G.baseY;
  for (let i = 0; i < KX_STEPS; i++) {
    const ya = yTop + Math.round((yBot - yTop) * i / KX_STEPS);
    const yb = yTop + Math.round((yBot - yTop) * (i + 1) / KX_STEPS);
    px(g, r[0], ya, r[2], yb - ya, i % 2 ? C.ST_A : C.ST_B);
    px(g, r[0], ya, r[2], 1, C.ST_T);
    px(g, r[0], yb - 1, r[2], 1, KX_PAL.SEAM);
  }
  px(g, r[0] - 1, yTop, 1, yBot - yTop, C.ST_S);               // 两侧石帮
  px(g, r[0] + r[2], yTop, 1, yBot - yTop, C.ST_S);
  /* 两侧三角阶梯：外缘沿斜边逐级收、内缘贴柱 —— 每级是一块**水平错台** */
  for (const left of [true, false]) {
    const E = left ? KX_EL.triL : KX_EL.triR;
    const xIn  = left ? G.px(E.x + E.w) : G.px(E.x);          // 贴柱那一端（高）
    const xOut = left ? G.px(E.x)       : G.px(E.x + E.w);    // 落地那一端（低）
    for (let i = 0; i < KX_STEPS; i++) {
      const ya = yTop + Math.round((yBot - yTop) * i / KX_STEPS);
      const yb = yTop + Math.round((yBot - yTop) * (i + 1) / KX_STEPS);
      const xe = Math.round(xIn + (xOut - xIn) * (i + 1) / KX_STEPS);
      const a = Math.min(xIn, xe), b = Math.max(xIn, xe);
      px(g, a, ya, b - a, yb - ya, i % 2 ? C.ST_A : C.ST_B);
      px(g, a, ya, b - a, 1, C.ST_T);                          // 踏步鼻
      px(g, a, yb - 1, b - a, 1, KX_PAL.SEAM);                 // 级间投影
      px(g, left ? a : b - 1, ya, 1, yb - ya, C.ST_S);         // 外端那道踢面棱
    }
  }
}

/* --- 5.11.10 花盆柱 + 半圆盆 + 盆里那颗蓝绿半球 -------------------------------
   ⚠️ 盆底 = 柱顶、盆口 = 圆心行（见 KX_EL 下面那段注释）。 */
function kxPot(g, G, C) {
  const R  = G.U(KX_EL.pot.r);                                 // 外半径
  const RI = Math.max(2, G.U(KX_EL.pot.r - KX_EL.pot.t));      // 内半径（盆壁那一圈）
  for (const E of [KX_EL.colL, KX_EL.colR]) {
    const cx0 = G.px(E.x), cx1 = G.px(E.x + E.w), cw = cx1 - cx0;
    const cx = cx0 + Math.round(cw / 2);
    /* 柱身：白瓷砖同规 + 左棱受光 / 右棱背光 + 柱脚压暗 */
    px(g, cx0, G.colTop, cw, G.baseY - G.colTop, C.TILE);
    for (let x = cx0 + KX_TILE; x < cx1; x += KX_TILE)
      px(g, x, G.colTop, 1, G.baseY - G.colTop, KX_PAL.JOINT);
    px(g, cx0, G.colTop, cw, 2, C.COL_T);                      // 柱顶面
    px(g, cx0, G.colTop, 2, G.baseY - G.colTop, C.COL_L);
    px(g, cx1 - 3, G.colTop, 3, G.baseY - G.colTop, C.COL_R);
    px(g, cx0, G.baseY - 3, cw, 3, C.COL_F);                   // 柱脚
    /* 盆：下半圆实心（盆口行 = 圆心行）。实拍是一只**浅白石盆**，从上方看几乎见不到
       土 —— 第一轮把整个内径都涂成暗色，出图里读成"一只空的黑盆"，所以盆内只留
       紧贴盆口的两行暗缝，其余全是盆体。 */
    const rimY = G.colTop - R;
    for (let dy = 0; dy <= R; dy++) {
      const w = Math.round(Math.sqrt(R * R - dy * dy));
      px(g, cx - w, rimY + dy, w * 2 + 1, 1, dy < 2 ? C.POT : C.POT_D);
    }
    const RS = RI + 1;                                         // 土面比盆口内径略宽（压在盆沿下）
    for (let dy = 1; dy <= 2; dy++) {
      const w = Math.round(Math.sqrt(RS * RS - dy * dy));
      px(g, cx - w, rimY + dy, w * 2 + 1, 1, C.POT_IN);
    }
    /* 植株：上半圆（半径 RI+1 ⇒ 盆沿上探出一点）。光照从上 ⇒ **上面亮、根部暗**：
       第一轮把两档弄反了（顶上一圈暗绿、根部一圈亮青），出图里那颗半球是"倒扣"的。
       半径的竖直半轴取 RI+0.7（略大于横向）⇒ 顶部不会收成一根 1px 的尖刺。 */
    const RH = RI + 1, RV = RI + 0.7;
    for (let dy = 0; dy <= RI; dy++) {
      const w = Math.round(RH * Math.sqrt(Math.max(0, 1 - (dy / RV) * (dy / RV))));
      px(g, cx - w, rimY - dy, w * 2 + 1, 1,
         dy > RI * 0.72 ? KX_PAL.LEAF_L : (dy < 3 ? KX_PAL.LEAF_D : KX_PAL.LEAF));
    }
    px(g, cx - RH + 2, rimY - RI + 1, 4, 3, KX_PAL.LEAF_L);    // 左上一点高光
    for (let dy = Math.round(RI * 0.28); dy <= Math.round(RI * 0.86); dy++) {
      const w = Math.round(RH * Math.sqrt(Math.max(0, 1 - (dy / RV) * (dy / RV))));
      px(g, cx - w, rimY - dy, 2, 1, KX_PAL.LEAF_L);           // 受光侧沿轮廓提一档
    }
    speckle(g, cx - RH, rimY - RI, RH * 2, RI, "rgba(255,255,255,0.07)", 5, makeRng(6131));
    /* 盆沿（下半圆环，照 ppt 的空心弧：R 与 R−t 之间那一圈）—— **最后画**，
       压在植株根部上 ⇒ 读起来才是"花长在盆里"，而不是"盆上飘着个球"。
       环的左半受光、右半背光（光源左上），最外一圈再压一档暗棱 ——
       盆与脚下的白瓷砖墙**同色系**，没有这圈棱就分不出来（第一轮出图那只盆
       之所以"看不见"，就是盆体只比墙亮 0.1 档、又没有外棱）。 */
    for (let dy = 0; dy <= R; dy++) {
      const wo = Math.round(Math.sqrt(R * R - dy * dy));
      const wi = dy <= RI ? Math.round(Math.sqrt(RI * RI - dy * dy)) : -1;
      if (wi < 0) { px(g, cx - wo, rimY + dy, wo * 2 + 1, 1, C.POT); continue; }
      px(g, cx - wo, rimY + dy, wo - wi, 1, C.POT_L);
      px(g, cx + wi, rimY + dy, wo - wi, 1, C.POT_R);
    }
    for (let dy = 0; dy <= R; dy++) {                          // 外棱一圈
      const wo = Math.round(Math.sqrt(R * R - dy * dy));
      px(g, cx - wo, rimY + dy, 1, 1, C.POT_E);
      px(g, cx + wo, rimY + dy, 1, 1, C.POT_E);
    }
    px(g, cx - R, rimY, R * 2 + 1, 1, C.POT_L);                // 盆口平顶受光
  }
}

/* --- 5.11.11 立面总装（只在**新画布**上画，不 clearRect） --------------------
   次序即遮挡：平屋顶（含檐口投影线）→ 檐口板 → 白瓷砖墙 → 檐下投影带 → 幕墙 →
   台阶 → 柱盆 → 轮廓与接地带。 */
function kxFront(g, G, C) {
  kxRoof(g, G, C);
  kxSlab(g, G, C);
  kxWall(g, G, C);
  kxSoffit(g, G, C);
  kxGlass(g, G, C);
  kxStairs(g, G, C);
  kxPot(g, G, C);
  /* 外轮廓分两段：檐口板那一层**满宽**（它两侧各出挑 12px），墙那一层只有墙宽 ——
     合成一条会在出挑的空档里拉出一条悬空的暗线。 */
  px(g, G.x0 - 1, G.y0, 1, G.slabH, C.OUT);
  px(g, G.x1, G.y0, 1, G.slabH, C.OUT);
  const rw = G.rect(KX_EL.wing);
  px(g, rw[0] - 1, G.wallTop, 1, G.baseY - G.wallTop, C.OUT);
  px(g, rw[0] + rw[2], G.wallTop, 1, G.baseY - G.wallTop, C.OUT);
  contactBand(g, rw[0] + 1, rw[0] + rw[2] - 1, G.baseY - 1, 2, 0.34);
}

/* --- 5.11.12 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是同一张 canvas
      的内容，晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/dxRestyle/
      xgRestyle 同一规矩）。
   ⚠️ 本函数**不碰共享 RNG**（斑点/盆里颗粒一律局部 makeRng）—— 碰了就会重掷
      全校园散射（那是有专属探针才看得见的地雷，见 60_assemble.js §6.6）。
   ⚠️ 第三个实参照 58/59 段传 `pal` —— `makeBuilding` 的返回值里没有色号，
      而补屋面板面必须与它同色，所以只能由调用点给（本段不许再存一份 PALETTE）。
   ⚠️ **立面高 117 行 ≠ styleOf 的 2 层（68 行）** ⇒ 画布要换一张高的（30 段的 H
      公式里 wallH 那一项被 FH 顶掉）。为此**只拷旧画布顶部 y0+1 行**（y0 = 檐口行，
      +1 是为了把檐口投影线那 2 行的下半行也带上）：檐口以下整段根本不进新画布
      ⇒ 既不用 clearRect，也不怕旧立面 / 旧投影 / 旧接地带残留。
      换画布**不改** `b.w` —— addSolid 用的是世界坐标，与精灵高矮无关。 */
function kxRestyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const G = kxGeo(c), C = kxCol(pal);
  /* ① 撤屋名牌。30 段把牌子挂在**檐口之上**（signRect: y = eaveY − 8 − h），
        所以必须单独擦（这是全零件唯一的一次 clearRect）。调 makeSign 只为填
        _signCache（verify.py 要 / 见契约），拿到矩形就够 —— **不画**。
        补的板面色只求"擦过的地方不是透明洞"，它随后会被 5.11.4 的平屋面整片盖掉
        ⇒ 这里**不补分坡脊线**（平屋面没有脊；第一版照 30 段补了 3 道，出图里
        那 3 道脊线还留在褐色坡顶上）。 */
  const sgn = makeSign(KX_NAME);
  if (sgn) {
    const sg = signRect(sgn, G.x0, G.w, G.eaveY);
    const px0 = sg.x - 2, py0 = sg.y - 2, pw = sg.w + 7, ph = sg.h + 7;
    g.clearRect(px0, py0, pw, ph);
    px(g, px0, py0, pw, ph, C.ROOF);                       // 平台面（与 5.11.4 同色）
    speckle(g, px0, py0, pw, ph, "rgba(255,255,255,0.05)", 6, makeRng(6103));
    speckle(g, px0, py0, pw, ph, "rgba(0,0,0,0.07)", 5, makeRng(6104));
  }
  /* ② 新画布：旧画布的檐口以上搬过来（同一行；屋面随后由 5.11.4 整片改平） */
  const nc = mkCanvas(c.width, G.H), ng = nc.getContext("2d");
  ng.drawImage(c, 0, 0, c.width, G.y0 + 1, 0, 0, c.width, G.y0 + 1);
  /* ③ 方向性投影（照 30 段 §3.1：footprint 朝右下拉伸，画在楼体**之前**，
        所以只有落地线以下那一截留在画面里）+ 立面总装 */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  shadowQuad(ng, G.x0 + 2, G.baseY - KX_SHADOW_H, G.x1 - 2, G.baseY, SHX, SHY, 0.28, 4);
  kxFront(ng, G, C);
  b.canvas = nc;
  /* ④ **只挪锚点**：`b.y`（世界落地线）与 addSolid 用的世界坐标一个字节都不动。
        `ay` 里多出来的 KX_DY 就是"整栋北移"在精灵上的全部痕迹。 */
  b.ay = G.baseY + KX_DY;
  return b;
}

/* ============================================================================
 * §5.12 16 号宿舍楼：两个灰蓝门楼 + 红砖墙 + 白色空调外机
 * ----------------------------------------------------------------------------
 * 源（两份，用户 2026-09-19 指定）：
 *   ① `预览/18haosushelou.jpg`（正拍，1545×1280）—— **楼体**的权威：
 *      砖红墙、成排的窗、密布的白色空调外机、通高的灰蓝门楼、雨篷下四柱
 *      + 两片白色格栅 + 暗红双开门。
 *      ⚠️ 文件名是 18 号，但用户当天明确「额之前说错了，我说的是 16 号宿舍楼」，
 *         照片里门上那块"16"门牌也印证了 —— **照片就是 16 号楼**。
 *   ② `校园示意图.pptx` 第 5 页 —— **门楼**的权威（用户自己画的门楼立面）：
 *      门楼正墙 + 4 条窗户带 + 雨篷 + 4 根柱 + 中间的门 + 门下梯形阶梯。
 *      ⚠️ **那一页的蓝色是 PPT 主题色 accent1（渲染约 #2E54A1），是"窗户带"的
 *         标识色，不是门楼的实际颜色** —— 用户原话「蓝色代表窗户带，梯形是阶梯」。
 *         门楼的实际颜色只有一个来源：照片实测的 grayblue #afb3bf。
 *         （§10.3 的坑：ppt 里 scheme:bg1 读出来是白、渲染出来是灰，一切以渲染图为准。）
 *
 * 一、为什么是"覆盖重绘"
 *   同 §5.5 老体育馆 / §5.8 思源东西楼 / §5.9 新体育馆 / §5.11 科学会堂：
 *   30_building.js 是全校**所有**楼的通用生成器，16 号楼只是它的两行数据
 *   （一行占位、一行 styleOf）。这里不动模板，事后在**同一张 canvas** 上重绘。
 *   楼体、屋面、屋名标牌一概不碰。
 *
 * 二、用户点名的五件事（照做）
 *   ① **楼体是红色的** —— 新增 PALETTE 第 6 档（红砖 p:5），见 60_assemble.js §6.1；
 *   ② **窗户** —— 不重画，**保留 30 段已经画好的**（见 §三.3）；
 *   ③ **白色空调外机** —— 30 段对全校都不画，本段按实拍补（§五）；
 *   ④ **两个门楼，一左一右，都距边 2 个窗户** —— §四；
 *   ⑤ **大门前四根柱子，正对门之外的两个空挡是白色小柱子组成的网格** —— §四.4。
 *
 * 三、几何：**从精灵高度反推 + 从 30 段的窗列公式现算，不硬编码任何一栋楼的数**
 *   1. 纵向：30 段的 canvas 高 H = PADT(18) + roofT + wallH + SHY + 14，
 *            eaveY = PADT + roofT、baseY = eaveY + wallH
 *            ⇒ 消去 roofT 得 **eaveY = baseY − wallH**（与 58 段同一把尺子）。
 *            makeBuilding 的返回值里没有 eaveY，但有 `ay = baseY` ⇒ eaveY 现推。
 *      ⚠️ 这也是为什么层数是"数据"：D16_FLOORS 一变，wallH 跟着变，本段跟着对。
 *   2. 横向：canvas 宽 = w + PADX·2 = w + 52，**墙**在 [26, 26 + w]。
 *   3. 窗列：30 段 §3.5 的公式（`margin` = 22）——
 *              cols  = max(1, floor((w − 44 + WIN_GAP) / (WIN_W + WIN_GAP)))
 *              stepX = (w − 44 − cols·WIN_W) / (cols − 1)
 *              wx(cn) = round(margin + cn · (WIN_W + stepX))
 *      ⚠️ 这里**必须把同一个公式再算一遍**，不能另立一套 —— 门楼一旦与窗列错开，
 *         门楼边缘就会切在半扇窗户上，而这个错位在四套自动验收里**一个都查不出来**
 *         （它们不量像素），只有出图看得见。
 *      ⚠️ 为什么不是把窗"擦掉重排"：窗是 30 段画的，**保留它**就自动与全校园同一套
 *         窗距、同一套窗型、同一套楼层线；重排等于在门楼里造第二套窗，还会和上下层
 *         的窗台、雨水管打架。所以门楼区只**换墙色**、不碰窗（见 §四.1）。
 *
 * 四、两个门楼
 *   0. 尺寸：**宽 = 2 个窗周期**（照片里门楼宽 ≈ 2 个窗位，实测吻合）。
 *      位置：外边缘距墙边**对称相等**，取值 = "第 3 列窗左缘再左移半个窗距 − 墙左"，
 *      即门楼外恰好**完整留下 2 列窗** —— 这就是用户说的"都距离边 2 个窗户"。
 *      ⚠️ 加长后 cols = 13 是**奇数** ⇒ 逐列对齐的话左右必差一列。所以取"左门楼
 *         外边缘落在空隙中线"这个值、**右侧镜像同一个值**；实测右门楼与窗列的
 *         错位 < 1px，肉眼不可见。这是"用户要的对称"与"窗户要对齐"两条约束下
 *         唯一可行的交点。
 *   1. 换色：门楼区（eaveY..baseY）内**逐个像素**判定，凡"红通道显著高于绿蓝"
 *      （即 30 段画的砖红墙、砖纹、楼层线、窗台、窗框外缘）一律换成灰蓝，
 *      按**原亮度比例**缩放 ⇒ 明暗层次（砖纹、楼层线、窗台受光）全部保留；
 *      不是红的（窗洞 #2c3746、玻璃、白框、阴影）**原样留下** ⇒ 窗户自动进门楼。
 *   2. 门楼立面（自上而下，比例全部取自 ppt 第 5 页，以门楼宽 W 为 1）：
 *         灰蓝墙面      通高 eaveY..baseY（含已画好的窗）
 *         雨篷          宽 1.000W，高 13，顶面在 baseY − 57
 *         柱 ×4         宽 0.049W，左缘在 0 / 0.1908 / 0.7586 / 0.951（末根贴右棱）
 *         白色网格 ×2   在 0.049~0.1908 与 0.8076~0.951 两档 = 用户说的"另外两个空挡"
 *         门            0.2954W ~ 0.6988W（宽 0.403W），高 44
 *         梯形阶梯      宽 1.11W（ppt 实测比门楼各出 5.6%），上窄下宽
 *       ⚠️ 四根柱形成**三个**空挡：中间那个正对门，左右两个才是白网格 —— 与照片逐点吻合。
 *
 * 五、白色空调外机
 *   ⚠️ 30 段**不画空调**（全校都没有）⇒ 这是本段独有，只写在**红墙上**，
 *      门楼区里一台不挂（照片里灰蓝门楼上确实没有）。
 *   位置 = 每层每列窗的**右侧外挂**（照片里绝大多数挂在窗右，少数挂窗左），
 *      三成不装。用**局部 `makeRng(1607)`** 定每台的位置与有无
 *      —— ⚠️ 绝不能碰共享 RNG：那会把全校园的散射重掷一遍（§6.6 那颗地雷）。
 *
 * 六、⚠️ 本段遵守的三条纪律（都是别的段栽过的）
 *   ① **必须由 60_assemble.js 在 `addProp()` 之前调** —— addProp 取的就是
 *      `s.canvas`，晚一步挂进 props 的还是旧精灵（55/58/59/61 都栽过）；
 *   ② **不动 `b.ay`**（与 61 段的 KX_DY 不同）：楼高、世界落地线、碰撞盒一字不动，
 *      这栋楼在画面上的位置与改前完全一致；
 *   ③ **不动 `bSeed`、不碰共享 RNG**；本段只用局部 `makeRng(1607)`。
 *   ⚠️ 以及那条最贵的：**改完必须出图**。曾有一版门区被 clearRect 擦空后早退，
 *      交付件里的门是一片透明，而 accept 34/34、verify、zoomtest 28/28、
 *      _propdiff 306/306 四套自动验收全部绿灯 —— 它们都不看画面。
 * ========================================================================= */

const D16_FLOORS = 6;             // ⚠️ 必须与 60_assemble.js styleOf 的 `/^16宿舍楼$/` 那行一致；build.py 有断言
const D16_GRAY   = "#afb3bf";     // 门楼灰蓝（照片实测 grayblue n=35320 中位色，直接可用）
const D16_GRAY_D = "#8e96a6";     // 灰蓝暗部（门洞内、网格底、柱侧）
const D16_MESH   = "#e9ecf2";     // 白色小柱网格（照片里白得很亮）
const D16_DOOR   = "#8c3a34";     // 暗红双开门（照片实测门上比墙更深更沉）
const D16_APRON  = "#c6c7c2";     // 门前地坪（浅灰石板）
const D16_AC     = "#e2e5ea";     // 空调外机白壳
const D16_AC_D   = "#9aa0aa";     // 外机暗部 / 格栅

const D16_DH     = 44;            // 门洞高（与 30 段 §3.4 的 dh 同一个数）
const D16_CY_OF  = 57;            // 雨篷顶面在 baseY 上方多少（= 门洞 44 + 雨篷 13，与 30 段 §3.7 同）

function dorm16Restyle(b, pal) {
  const g = b.canvas.getContext("2d");
  const baseY = b.ay, bw = b.w;                 // ⚠️ b.ay 就是 30 段的 baseY（返回结构里只有它）
  const x0 = 26, x1 = x0 + bw;                  // 墙的左 / 右边缘（canvas 坐标）
  const eaveY = baseY - D16_FLOORS * FLOOR_H;   // 消去 roofT：eaveY = baseY − wallH

  /* --- 3. 复算 30 段 §3.5 的窗列（逐字同一套公式，保证门楼与窗严格对齐） --- */
  const margin = 22;
  const cols = Math.max(1, Math.floor((bw - margin * 2 + WIN_GAP) / (WIN_W + WIN_GAP)));
  const stepX = (bw - margin * 2 - cols * WIN_W) / (cols - 1 || 1);
  /* ⚠️ 30 段 §3.5 那行是 `Math.round(margin + cn * (WIN_W + stepX))`，**没加 x0**。
     于是窗带起点落在 22，而墙左缘 x0 = 26 ⇒ 整条窗带比墙偏左 26px
     （左 margin = −4、右 margin = 48）。照抄就会把门楼一起带歪：
     左门楼左边留 2 列窗、右边一列都不留。
     这里补上 x0，窗带在墙内左右各留 22 ⇒ 两个门楼严格对称（inset 本来就是
     按"相对 x0"写的，补上之后自动回到 72，别的数一个都不用改）。 */
  const colX = cn => x0 + Math.round(margin + cn * (WIN_W + stepX));
  const P = WIN_W + stepX;                      // 窗周期

  /* --- 0. 两个门楼：宽 = 2 个窗周期，外边缘距墙边对称 --- */
  const mw = Math.round(P * 2);
  const inset = Math.round(colX(2) - stepX / 2 - x0);
  const mAns = [
    { a: x0 + inset,     b: x0 + inset + mw },  // 左门楼
    { a: x1 - inset - mw, b: x1 - inset }       // 右门楼（镜像同一个 inset）
  ];

  /* === 6.2 窗阵重排：修掉 30 段那个"最下两排窗叠在一起"的缺陷（只修 16 号楼） ===
     ⚠️ 病根（2026-09-19 出图比对 16 号楼与 18 号楼，两栋一模一样地叠）：
        30 段 §3.5 的行公式对**任何层数**都把首层窗放在 `baseY − 30 − WIN_H`，
        而它自己那套"最上一层"公式算出来的位置是 `eaveY + floors·34 − 48`
        —— 两者**只差 4px**，而窗本身高 22 ⇒ **最下面两排窗叠掉 18px**。
        3 / 4 / 6 层全部如此 ⇒ **全校每一栋楼都这样**（红砖对比度高于米色墙，
        所以这个缺陷在 16 号楼上最扎眼）。
     ⚠️ 本轮**只修 16 号楼**，30 段模板一个字不动（其余楼维持原样，等用户拍板要不要
        全校统一下手）。做法是**把整面墙按 30 段 §3.3 / §3.6 的笔法重画一遍**，
        再画新窗 —— 擦与补合成一件事，墙是连续的，擦除区边缘不会留下接缝。
        同理补回：檐下阴影带、楼层腰线、左右棱、雨水管、接地带（都在重画区里）。
     正确的排布：每层 34px、窗高 22、上下各留 6 ⇒ 第 f 层（0 = 顶层）窗顶
        `eaveY + 6 + f·34`。6 排正好**各自落在 6 条楼层腰线内**（30 段那套本来就与
        腰线错位），首层窗底距地 6px。
     ⚠️ 顺序：必须在 §1 门楼区换色**之前** —— 换色只认"红的"，新窗不是红的，
        所以先重画墙和窗、再换色，门楼里的窗才会自动跟着进门楼。 */
  /* ⚠️ 先擦掉 30 段旧窗带**伸出墙外**的那一窄条：colX(0) = 22（30 段的老公式），
     墙左缘却是 x0 = 26，而 `winAt` 又从 `wx − 1` 起画 ⇒ 残留 [21, 26) 一条 5px 窗渣。
     重铺墙是从 x0 起的，**擦不到它** —— 出图看就是楼左缘外挂着半截窗框。
     只擦**左侧**：右侧旧窗（最右 377）全在墙内 424 之内；而右侧 padding 里有
     30 段的落地投影（`shadowQuad` 右移 SHX = 16px），跟着一起擦会削掉楼角影子。
     擦完补回 30 段那根 1px 左缘描边（§3.x 尾巴上那两行，它正落在被擦的列上）。 */
  g.clearRect(0, eaveY + 1, x0, baseY - eaveY - 1);
  px(g, x0 - 1, eaveY + 1, 1, baseY - eaveY + 2, shade(pal.wall, -0.44));
  px(g, x0, eaveY + 2, bw, baseY - eaveY - 2, shade(pal.wall, -0.10));          // 墙底
  for (let yy = eaveY + 7; yy < baseY; yy += 5) {                               // 砖纹（照 §3.3）
    px(g, x0, yy, bw, 1, "rgba(0,0,0,0.09)");
    const off = ((((yy - eaveY) / 5) | 0) & 1) ? 4 : 0;
    for (let xx = x0 + off; xx < x1; xx += 8) px(g, xx, yy - 5, 1, 5, "rgba(0,0,0,0.06)");
  }
  for (let i = 0; i < 10; i++)                                                  // 檐下阴影带
    px(g, x0, eaveY + 2 + i, bw, 1, "rgba(14,18,28," + (0.34 * (1 - i / 10)).toFixed(3) + ")");
  for (let f = 0; f < D16_FLOORS; f++)                                          // 楼层腰线
    px(g, x0, eaveY + f * FLOOR_H, bw, 2, shade(pal.wall, -0.20));
  px(g, x0, eaveY + 2, 3, baseY - eaveY - 2, shade(pal.wall, 0.18));            // 左棱受光
  px(g, x1 - 4, eaveY + 2, 4, baseY - eaveY - 2, shade(pal.wall, -0.30));       // 右棱背光
  const pipeX = x1 - 7;                                                         // 雨水管（照 §3.6）
  px(g, pipeX, eaveY + 3, 3, baseY - eaveY - 3, shade(pal.wall, -0.24));
  px(g, pipeX, eaveY + 3, 1, baseY - eaveY - 3, shade(pal.wall, 0.04));
  px(g, pipeX - 1, Math.round((eaveY + baseY) / 2) - 5, 5, 2, shade("#8b8f96", -0.10));
  px(g, pipeX - 1, baseY - 12, 5, 2, shade("#8b8f96", -0.22));
  contactBand(g, x0 + 1, x1 - 1, baseY - 1, 2, 0.34);                           // 接地带
  /* 6 排窗 × cols 列（窗型逐字照抄 §3.5 的 winAt，只换色源 pal.glass / pal.wall） */
  const winAt = (wx, wy) => {
    px(g, wx - 1, wy - 1, WIN_W + 2, WIN_H + 2, shade(pal.wall, 0.12));
    px(g, wx + WIN_W, wy - 1, 1, WIN_H + 2, shade(pal.wall, -0.34));
    px(g, wx, wy, WIN_W, WIN_H, "#2c3746");
    px(g, wx, wy, WIN_W, 2, "rgba(10,13,20,0.58)");
    px(g, wx, wy, 2, WIN_H, "rgba(10,13,20,0.44)");
    px(g, wx + 2, wy + 2, WIN_W - 6, 3, shade(pal.glass, 0.28));
    px(g, wx + 3, wy + 6, WIN_W - 9, 2, shade(pal.glass, 0.12));
    px(g, wx + 6, wy + 4, 1, WIN_H - 8, shade(pal.wall, -0.52));
    px(g, wx + 2, wy + Math.round(WIN_H * 0.62), WIN_W - 4, Math.round(WIN_H * 0.34), shade(pal.glass, -0.24));
    px(g, wx - 2, wy + WIN_H, WIN_W + 4, 3, shade(pal.wall, 0.24));
    px(g, wx - 2, wy + WIN_H + 3, WIN_W + 4, 1, "rgba(14,18,28,0.28)");
  };
  for (let f = 0; f < D16_FLOORS; f++) {
    const wy = eaveY + 6 + f * FLOOR_H;
    for (let cn = 0; cn < cols; cn++) winAt(colX(cn), wy);
  }

  /* --- 1. 门楼区换色：砖红 → 灰蓝；窗洞 / 玻璃 / 白框原样留下 --- */
  const GY = rgb(D16_GRAY);
  const wl = rgb(pal.wall);
  const baseLum = wl[0] * 0.299 + wl[1] * 0.587 + wl[2] * 0.114;
  const gh = baseY - eaveY;
  for (const m of mAns) {
    const gw = m.b - m.a;
    const img = g.getImageData(m.a, eaveY, gw, gh), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] === 0) continue;                       // canvas 透明处不动
      const r = d[i], gg = d[i + 1], bb = d[i + 2];
      if (!(r > gg + 18 && r > bb + 18)) continue;        // 不是红 ⇒ 是窗/玻璃/白框，留下
      const k = (r * 0.299 + gg * 0.587 + bb * 0.114) / baseLum;
      d[i]     = Math.min(255, GY[0] * k) | 0;
      d[i + 1] = Math.min(255, GY[1] * k) | 0;
      d[i + 2] = Math.min(255, GY[2] * k) | 0;
    }
    g.putImageData(img, m.a, eaveY);
    /* 两侧各压一道棱（照 30 段 §3.3 的左受光 / 右背光） */
    px(g, m.a, eaveY, 2, gh, shade(D16_GRAY, 0.20));
    px(g, m.b - 3, eaveY, 3, gh, "rgba(20,24,32,0.20)");
  }

  /* --- 2. 门楼细部：地坪 / 梯 / 柱 / 网格 / 门 / 雨篷 --- */
  const CY = baseY - D16_CY_OF;                 // 雨篷顶面
  for (const m of mAns) {
    const gw = m.b - m.a;
    const X = t => Math.round(m.a + gw * t);    // 比例 → canvas 坐标

    /* 2.1 门前地坪：最先铺 —— 顺手压掉 30 段留在 baseY 附近的原雨棚台阶 */
    px(g, m.a - 8, baseY - 1, gw + 16, 13, D16_APRON);
    px(g, m.a - 8, baseY - 1, gw + 16, 2, shade(D16_APRON, 0.24));
    px(g, m.a - 8, baseY + 11, gw + 16, 1, "rgba(14,18,28,0.26)");

    /* 2.2 梯形阶梯（ppt 第 5 页那个梯形：上窄下宽，比门楼各出 5.6%） */
    const out = Math.round(gw * 0.055);
    poly(g, [[X(0.05), baseY - 1], [X(0.95), baseY - 1],
             [m.b + out, baseY + 9], [m.a - out, baseY + 9]],
         shade(D16_APRON, -0.12));
    px(g, Math.round(m.a - out * 0.5), baseY + 4, gw + out, 1, "rgba(14,18,28,0.20)");
    px(g, Math.round(m.a - out), baseY + 9, gw + out * 2, 1, "rgba(14,18,28,0.30)");

    /* 2.3 四根柱（先画，雨篷压在上面）。左缘比例取自 ppt：#6/#7/#9/#10 */
    const CW = Math.max(3, Math.round(gw * 0.049));
    for (const t of [0, 0.1908, 0.7586, 0.951]) {
      const cxp = X(t), cw = Math.min(CW, m.b - cxp);
      px(g, cxp, CY, cw, baseY - CY, shade(D16_GRAY, 0.06));
      px(g, cxp, CY, 2, baseY - CY, shade(D16_GRAY, 0.24));          // 左棱受光
      px(g, cxp + cw - 2, CY, 2, baseY - CY, "rgba(20,24,32,0.24)"); // 右棱背光
    }

    /* 2.4 两片白色小柱网格 —— 用户：「除了正对门之外另外两个空挡是白色小柱子组成的网格」
           照片里是**交叉斜格**（菱形花格），所以用 clip + lineWidth 2 的斜线交织。 */
    for (const band of [[0.049, 0.1908], [0.8076, 0.951]]) {
      const mx0 = X(band[0]), mx1 = X(band[1]);
      const my0 = CY + 13, my1 = baseY;
      px(g, mx0, my0, mx1 - mx0, my1 - my0, D16_GRAY_D);
      g.save();
      g.beginPath(); g.rect(mx0, my0, mx1 - mx0, my1 - my0); g.clip();
      g.strokeStyle = D16_MESH; g.lineWidth = 2;
      const hh = my1 - my0;
      for (let dd = -hh; dd < (mx1 - mx0) + hh; dd += 7) {
        g.beginPath(); g.moveTo(mx0 + dd, my0); g.lineTo(mx0 + dd - hh, my1); g.stroke();
        g.beginPath(); g.moveTo(mx0 + dd, my0); g.lineTo(mx0 + dd + hh, my1); g.stroke();
      }
      g.restore();

      else if (ax + AC_W > x1 - 1) ax = wx - AC_W - 2;

      px(g, ax, ay + AC_H - 1, AC_W, 1, D16_AC_D);                     // 底面
      px(g, ax, ay + 2, AC_W - 3, 1, "rgba(20,24,32,0.20)");           // 格栅暗线
      px(g, ax + AC_W - 3, ay + 2, 3, AC_H - 4, D16_AC_D);             // 右侧
      px(g, ax - 1, ay + AC_H, AC_W + 2, 1, "rgba(14,18,28,0.22)");    // 投影

/* --- 5.13.8 标牌画笔 ----------------------------------------------------
   与 61 段的 kxGlyph 是同一套（1bit 掩膜逐像素填色 + 笔画下沿压一道暗色），
   区别只在**颜色是传进来的**：61 段只服务一块金字牌，色可以写死；本段两块牌
   压在深红与鲜红两种底上，白字的"下沿"要分别配。 */
function yfGlyph(g, b64, nw, nh, x, y, light, dark) {
  const s = atob(b64), bit = (i) => (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  for (let j = 0; j < nh; j++) {
    for (let i = 0; i < nw; i++) {
      if (!bit(j * nw + i)) continue;
      px(g, x + i, y + j, 1, 1, light);
      if (j + 1 < nh && !bit((j + 1) * nw + i)) px(g, x + i, y + j + 1, 1, 1, dark);
    }
  }
}

function yifuRestyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const baseY = b.ay, bw = b.w;                 /* ⚠️ b.ay 就是 30 段的 baseY */
  const x0 = 26, x1 = x0 + bw;                  /* 墙的左 / 右边缘（canvas 坐标） */
  const wallH = YF_FLOORS * FLOOR_H;
  const eaveY = baseY - wallH;                  /* 消去 roofT：eaveY = baseY − wallH（同 58/62 段） */

  /* 世界坐标 → canvas：x 与行**两条比例不同**（见文件头 §一的换算）。
     本栋 SX 恒为 1（占位宽就是 662.1）、SY 恒为 1（8 层 ⇒ wallH = 272），
     写成比例而不是写死，是为了跟 30 段"能靠数据改的绝不改模板"同一条规矩。 */
  const SX = bw / 662, SY = wallH / 272;
  const XW = v => x0 + Math.round(v * SX);
  const YW = v => eaveY + Math.round(v * SY);
  const WW = v => Math.max(1, Math.round(v * SX));
  const HH = v => Math.max(1, Math.round(v * SY));
  const R2C = r => [XW(r[0]), YW(r[2]), Math.max(1, XW(r[1]) - XW(r[0])),
                    Math.max(1, YW(r[3]) - YW(r[2]))];

  /* --- 5.13.9 撤屋名牌。30 段把牌子挂在**檐口之上**（signRect: y = eaveY − 8 − h），
         所以立面那段 clearRect 擦不到它，必须单独擦。调 makeSign 只为填 _signCache
         （verify.py 的屋名标牌自检读它），拿到矩形就够 —— **不画**。 */
  const sgn = makeSign(YF_NAME);
  if (sgn) {
    const sg = signRect(sgn, x0, bw, eaveY);
    const px0 = sg.x - 2, py0 = sg.y - 2, pw = sg.w + 7, ph = sg.h + 7;
    g.clearRect(px0, py0, pw, ph);
    px(g, px0, py0, pw, ph, shade(pal.roof, -0.04));      /* 板面色（30 段 §3.2 同式） */
    /* 屋面进深要从画布反推：30 段是 eaveY = PADT + roofT ⇒ roofT = eaveY − PADT。
       （makeBuilding 的返回值里没有 roofT，只有 canvas / ax / ay / w / h。） */
    const roofT = eaveY - YF_PADT;
    for (let j = 1; j <= 3; j++) {                        /* 分坡脊线（30 段只画 j=1..3） */
      const y = YF_PADT + Math.round((roofT - 12) * j / 4) + 6;
      if (y >= py0 && y < py0 + ph)
        px(g, x0 + 5, y, bw - 10, 1, "rgba(255,255,255,0.08)");
    }
    /* 斑点：密度照 30 段 §3.2 的 (w/3)|0 / (w/4)|0 折到这一小块。
       ⚠️ 必须用**局部** makeRng —— 碰共享流会重掷全校园散射（§6.6）。 */
    speckle(g, px0, py0, pw, ph, "rgba(255,255,255,0.05)", 6, makeRng(6317));
    speckle(g, px0, py0, pw, ph, "rgba(0,0,0,0.07)", 5, makeRng(6318));
  }

  /* === 立面总装：整段在**墙矩形**的裁剪里画，越界的一律自动切掉 ===
     （右翼比左翼低一截、台明带比墙略宽，都要靠这条裁剪收边）
     ⚠️ 上边界要**抬到墙顶之上 52 行**，不能正好是 eaveY：ppt 里有两个浅灰块压在
        墙**顶线以上**（id=15 在行 −45.8..−27.2、id=14 在行 −27.2..0.0），
        裁剪从 eaveY 起画时它们**一个像素都画不出来** —— 而四套自动验收全绿、
        验收表里 5 个玻璃区也照样报"5"。这是"改完必须出图"那条规矩的又一个实例。
        （这两块不是凭空要的：id=15 与 id=14 正好是 §5.13.1 那段口径里的檐下体块。） */
  g.save();
  g.beginPath();
  g.rect(x0, eaveY - 52, bw, wallH + 52);
  g.clip();

  /* --- 1. 整面墙先铺深红底。这一步**必须覆盖满** —— 30 段画的米色墙、砖纹、
         楼层腰线、旧窗阵、雨水管全在这一下里被盖掉，之后画什么都在新底上。 --- */
  px(g, x0, eaveY, bw, wallH, YF_RED);

  /* --- 2. 右翼屋面：右翼从第 38.6 行起（比左翼低 34 行 ≈ 一层），
         上面那一截露出来的是**右翼的屋面**，不是墙。用屋面同色 + 一道檐口线。 --- */
  /* ⚠️ 左缘取 421.2（= 中央大玻璃块的右缘），**不能取 YF_REDS[2] 的 423.3**：
     ppt 里形状 id=17（右翼）从 419.8 起、形状 id=13（大玻璃块）到 419.3，两块**是贴着的**，
     屋面在 ppt 里一点红都不该露。取 423.3 会在 421.2..423.3 留一根 2px 宽的
     **深红竖条**插在玻璃块与右翼屋面之间 —— 1× 下就是一条扎眼的红线。 */
  const RF = R2C([421.2, 661.6, 0.0, 38.6]);
  px(g, RF[0], RF[1], RF[2], RF[3], shade(pal.roof, -0.14));
  px(g, RF[0], RF[1], RF[2], 2, shade(pal.roof, 0.10));                 /* 女儿墙顶受光 */
  px(g, RF[0], RF[1] + RF[3] - 2, RF[2], 2, shade(pal.roof, -0.52));    /* 右翼檐口投影线 */

  /* --- 3. 三个凹区先给暗底 --- */
  for (const r of [YF_SLOT, YF_LOBBY, YF_PILZ]) {
    const q = R2C(r);
    px(g, q[0], q[1], q[2], q[3], YF_RECESS);
  }

  /* --- 4. 深灰玻璃（**五个区域**）+ 网格 --- */
  for (const z of YF_GLASSES) {
    for (const r of z.r) {
      const X = XW(r[0]), Y = YW(r[2]);
      const W = Math.max(1, XW(r[1]) - XW(r[0])), H = Math.max(1, YW(r[3]) - YW(r[2]));
      px(g, X, Y, W, H, YF_GLASS);
      px(g, X, Y, W, 1, shade(YF_GLASS, 0.26));               /* 上沿受光 */
      px(g, X, Y + H - 1, W, 1, shade(YF_GLASS, -0.34));      /* 下沿背光 */
      /* 网格：竖挺每 10、横梁每 11，按**各块自己的**左上角对齐。
         ⚠️ 不能全校统一对齐 —— ②竖带与③大块的高差 72px，统一对齐后两块的交界处
            会出现一条"只有半格"的碎格子，比不对齐还难看。 */
      g.save();
      g.beginPath(); g.rect(X, Y, W, H); g.clip();
      for (let xx = X + 10; xx < X + W; xx += 10) px(g, xx, Y, 1, H, rgba(YF_MULL, 0.85));
      for (let yy = Y + 11; yy < Y + H; yy += 11) px(g, X, yy, W, 1, rgba(YF_MULL, 0.85));
      g.restore();

  for (const r of YF_BLOCKS) {
    const q = R2C(r);
    px(g, q[0], q[1], q[2], q[3], YF_BLOCK);
    px(g, q[0], q[1], q[2], 1, shade(YF_BLOCK, 0.24));            /* 顶面受光 */
    px(g, q[0], q[1], 1, q[3], shade(YF_BLOCK, 0.14));            /* 左棱 */
    px(g, q[0], q[1] + q[3] - 1, q[2], 1, shade(YF_BLOCK, -0.30));/* 底面 */
    px(g, q[0] + q[2] - 1, q[1], 1, q[3], shade(YF_BLOCK, -0.24));/* 右棱背光 */
  }

  for (const r of YF_BRIGHTS) {
    const q = R2C(r);
    px(g, q[0], q[1], q[2], q[3], YF_BRIGHT);
    px(g, q[0], q[1], q[2], 1, shade(YF_BRIGHT, 0.22));
    px(g, q[0], q[1], 1, q[3], shade(YF_BRIGHT, 0.14));
    px(g, q[0], q[1] + q[3] - 1, q[2], 1, shade(YF_BRIGHT, -0.30));
    px(g, q[0] + q[2] - 1, q[1], 1, q[3], shade(YF_BRIGHT, -0.26));
  }
  for (const [a, b] of YF_STONEBAND) {
    const q = R2C([a, b, YF_STONE_ROWS[0], YF_STONE_ROWS[1]]);
    px(g, q[0], q[1], q[2], q[3], YF_STONE);
    px(g, q[0], q[1], q[2], 2, shade(YF_STONE, 0.26));            /* 台明顶面受光 */
    px(g, q[0], q[1] + q[3] - 1, q[2], 1, shade(YF_STONE, -0.34));
    for (let i = 1; i < 3; i++)                                   /* 两级踏步线 */
      px(g, q[0], q[1] + Math.round(q[3] * i / 3), q[2], 1, shade(YF_STONE, -0.16));

  /* --- 7. 黑色阳台（五条，挂在凹槽里） --- */
  const SL = R2C(YF_SLOT);
  for (const [a, b] of YF_BALCONIES) {
    const y = YW(a), h = Math.max(2, YW(b) - YW(a));
    px(g, SL[0], y, SL[2], h, YF_BALC);
    px(g, SL[0], y, SL[2], 1, shade(YF_BALC, 0.34));              /* 阳台顶面受光 */
    px(g, SL[0], y + h - 1, SL[2], 1, "rgba(0,0,0,0.6)");         /* 底面 */
    px(g, SL[0], y + h, SL[2], 1, "rgba(0,0,0,0.34)");            /* 阳台投影 */
  }

  /* --- 8. 窗阵：竖向长条 --- */
  const FP = 272 / YF_FLOORS;                       /* 层高（世界行） */
  const winAt = (wx, wy) => {
    px(g, XW(wx) - 1, YW(wy) - 1, WW(YF_WIN_W) + 2, HH(YF_WIN_H) + 2, shade(YF_RED, 0.22));
    px(g, XW(wx + YF_WIN_W), YW(wy) - 1, 1, HH(YF_WIN_H) + 2, shade(YF_RED, -0.44));
    px(g, XW(wx), YW(wy), WW(YF_WIN_W), HH(YF_WIN_H), YF_WIN);
    px(g, XW(wx), YW(wy), WW(YF_WIN_W), 2, "rgba(0,0,0,0.42)");   /* 洞口上内侧 */
    px(g, XW(wx), YW(wy), 1, HH(YF_WIN_H), "rgba(0,0,0,0.30)");   /* 洞口左内侧 */
    px(g, XW(wx) + 2, YW(wy) + 2, WW(YF_WIN_W) - 4, 4, YF_WIN_L);       /* 玻璃上反光 */
    px(g, XW(wx) + 2, YW(wy + YF_WIN_H) - 5, WW(YF_WIN_W) - 4, 4, shade(YF_WIN_L, -0.46));
    px(g, XW(wx) - 1, YW(wy + YF_WIN_H), WW(YF_WIN_W) + 2, 2, shade(YF_RED, 0.32));  /* 窗台 */
    px(g, XW(wx) - 1, YW(wy + YF_WIN_H) + 2, WW(YF_WIN_W) + 2, 1, "rgba(10,12,18,0.28)");
  };
  for (const r of YF_REDS) {
    const W = r[1] - r[0];
    const n = Math.max(1, Math.floor((W - YF_WIN_MARGIN * 2 + YF_COL_GAP) / (YF_WIN_W + YF_COL_GAP)));
    const step = (W - YF_WIN_MARGIN * 2 - n * YF_WIN_W) / (n - 1 || 1);
    /* 竖牌所在列整列不排窗（判列不判窗，见 YF_V_BAND 的注释）。 */
    const inSignBand = (wx) => wx + YF_WIN_W > YF_V_BAND[0] && wx < YF_V_BAND[1];
    for (let f = 0; f < YF_FLOORS; f++) {
      const wy = f * FP + (FP - YF_WIN_H) / 2;
      if (wy < r[2] - 1 || wy + YF_WIN_H > r[3] + 1) continue;   /* 这层不落在这块墙上 */
      for (let i = 0; i < n; i++) {
        const wx = r[0] + YF_WIN_MARGIN + i * (YF_WIN_W + step);
        if (inSignBand(wx)) continue;   /* 竖牌那一列通高留空 */
        /* 鲜红实墙板区**一扇窗不排**（用户：「鲜红部分代表墙面，不用安排窗户」）。
           余量取 3：实测这个数让实墙板左右**各空掉一列**、两边留白相等；取 2 会紧贴板边
           （板缘与窗套只差 1px，出图看就是"窗户咬住了红板"）。 */
        let hit = false;
        for (const q of YF_BRIGHTS)
          if (wx + YF_WIN_W > q[0] - 3 && wx < q[1] + 3 &&
              wy + YF_WIN_H > q[2] && wy < q[3]) { hit = true; break; }
        if (hit) continue;
        winAt(wx, wy);
      }
    }
  }

  /* --- 9. 两块楼名标牌 --- */
  /* 9.1 「逸夫教学楼」竖排，贴右翼最右端（ppt 里是黑字，源图是银白字；
         深红底上黑字几乎读不出来，按**源图**用银白 —— 用户给的就是这套字）。
         ⚠️ 这块竖牌**下面没有窗**：那一列已在窗阵里被 YF_V_BAND 整列排除（用户明确要求）。
            不要在这里"补窗"或让标牌挪位去躲窗 —— 留空是效果、不是遮挡。 */
  for (let i = 0; i < YF_V_CHARS.length; i++) {
    const m = YF_V_CHARS[i];
    yfGlyph(g, m[0], m[1], m[2],
            Math.round(XW(YF_V_CX - m[1] * SX / 2)),
            YW(YF_V_Y + i * YF_V_PITCH), YF_SIGN_L, YF_SIGN_D);
  }
  /* 9.2 「研究生院」横排，贴在研究生院门牌上（ppt 里就是白字压在鲜红牌上）。
         ⚠️ 逐字宽随各字长宽比、**不拉方**：「生」的 h/w 是 1.59，拉方要横向撑 1.38 倍。 */
  let totW = 0;
  for (const m of YF_H_CHARS) totW += m[1] * SX;
  totW += YF_H_GAP * (YF_H_CHARS.length - 1);
  const panelW = YF_H_PANEL[1] - YF_H_PANEL[0];
  const panelMid = (YF_H_PANEL[2] + YF_H_PANEL[3]) / 2;
  let hx = XW(YF_H_PANEL[0] + (panelW - totW / SX) / 2);
  const hy = YW(panelMid - YF_H_H / 2);
  for (const m of YF_H_CHARS) {
    yfGlyph(g, m[0], m[1], m[2], Math.round(hx), hy, YF_SIGN_L, YF_SIGN_D);
    hx += (m[1] + YF_H_GAP) * SX;
  }

  /* --- 10. 檐下阴影带 / 左右棱 / 外轮廓（照 30 段 §3.3 与 §3.8 的笔法）。
         放在**最后**：让整面墙（含玻璃、标牌）一起沉进檐口阴影里，
         否则重铺的红墙会与檐口脱开、读起来像贴上去的一块板。 --- */
  for (let i = 0; i < 10; i++)
    px(g, x0, eaveY + 2 + i, bw, 1, "rgba(14,18,28," + (0.34 * (1 - i / 10)).toFixed(3) + ")");
  px(g, x0, eaveY + 2, 3, wallH - 2, shade(YF_RED, 0.20));            /* 左棱受光 */
  px(g, x1 - 4, eaveY + 2, 4, wallH - 2, shade(YF_RED, -0.34));       /* 右棱背光 */
  g.restore();                                                        /* ← 裁剪结束 */

  /* --- 11. 外轮廓与接地带（在裁剪之外画，才落在墙沿上） --- */
  px(g, x0 - 1, eaveY + 1, bw + 2, 1, shade(YF_RED, -0.46));
  px(g, x0 - 1, eaveY + 1, 1, wallH + 2, shade(YF_RED, -0.46));
  px(g, x1, eaveY + 1, 1, wallH + 2, shade(YF_RED, -0.46));
  contactBand(g, x0 + 1, x1 - 1, baseY - 1, 2, 0.34);

  return b;
}

/* --- 6.4.4 用色（全部取 nanmen.jpg 的中位色） ---

const SW_EAVE_L = "#cfc0b8", SW_EAVE_D = "#a89a91";
const SW_CAP = "#5d564f";                 // 压顶 / 勒脚那道深线（照片实测 93,86,79）

const SW_DOOR_L = "#5b6690", SW_DOOR = "#48516f", SW_DOOR_D = "#2e3550";

/* --- 6.4.5 画砖墙 ---
   照片里的砖是**横长条**：碑墙上每行高约 14px、长约 40px（世界 6.8 / 23），
   左围墙上略大（世界 7 / 28）。行高取 7 是"一眼能看出是砖、又不至于发花"的下限。 */
function swBrick(g, x0, y0, w, h, bw, bh, cl, cd) {
  px(g, x0, y0, w, h, cl);
  for (let y = bh; y < h; y += bh) px(g, x0, y0 + y, w, 1, cd);   // 横缝
  let row = 1;                                                     // 竖缝错缝
  for (let y = bh; y < h; y += bh, row++) {
    const off = (row & 1) ? Math.round(bw / 2) : 0;
    for (let x = off; x < w; x += bw) {
      if (x <= 0) continue;
      px(g, x0 + x, y0 + y - bh, 1, bh, cd);
    }
  }
}

function swVgrain(g, x0, y0, w, h, step, c) {
  for (let x = step; x < w; x += step) px(g, x0 + x, y0, 1, h, c);
}

  px(g, 0, GH_LWY, GH_LWW, 2, SW_CAP);               // 压顶

  const bx = GH_BWX, by = GH_H - GH_BWH;

  swVgrain(g, bx, by, GH_BWW, GH_BWH, 5, rgba(SW_BOOTH_D, 0.34));
  /* 檐下由近及远的两档暗部（照片里雨篷底下那条深带，越贴近檐口越暗） */
  px(g, bx, by, GH_BWW, 6, rgba(SW_BOOTH_D, 0.26));
  px(g, bx, by + 6, GH_BWW, 5, rgba(SW_BOOTH_D, 0.12));
  px(g, bx, by, GH_BWW, 1, SW_BOOTH_D);
  px(g, bx, by, 1, GH_BWH, SW_BOOTH_D);
  px(g, bx + GH_BWW - 1, by, 1, GH_BWH, SW_BOOTH_D);

  /* ③ 深蓝门（照片 x264..294 / y655..722 ⇒ 画布 x130..147, y68..100）
     ⚠️ 门比门卫室左缘只缩进 3px —— 照片里门就贴在门卫室左端，不是居中。 */
  const dx = 130, dy = GH_H - 32;
  px(g, dx, dy, 18, 32, SW_DOOR_D);
  px(g, dx + 1, dy, 16, 30, SW_DOOR);
  px(g, dx + 1, dy, 1, 30, SW_DOOR_L);               // 门边提亮（光从左上）
  px(g, dx + 15, dy + 1, 1, 29, SW_DOOR_D);
  px(g, dx + 14, dy + 8, 2, 2, SW_WFRAME);           // 门把手

  /* ④ 两扇窗：大窗 2×2（正面）＋ 窄窗（照片里在右侧面上、掰正后落在正面右端）
     照片窗 A x310..380 y632..685 ⇒ 画布 x156..196, y58..84（40×26）
     照片窗 B x399..432 y640..688 ⇒ 画布 x205..222, y61..84（17×23） */
  const win = function (wx, wy, ww, wh, cols, rows) {
    px(g, wx, wy, ww, wh, SW_WFRAME);                // 白框
    const ix = wx + 2, iy = wy + 2, iw = ww - 4, ih = wh - 4;
    px(g, ix, iy, iw, ih, SW_GLASS);
    px(g, ix, iy, iw, Math.max(1, ih >> 1), SW_GLASS_L);   // 上半提亮（玻璃反光）
    px(g, ix, iy + ih - 1, iw, 1, SW_GLASS_D);
    for (let i = 1; i < cols; i++) px(g, ix + Math.round(iw * i / cols), iy, 1, ih, SW_WFRAME);
    for (let j = 1; j < rows; j++) px(g, ix, iy + Math.round(ih * j / rows), iw, 1, SW_WFRAME);
    px(g, wx, wy + wh, ww, 1, rgba(SW_BOOTH_D, 0.5));       // 窗台投影
  };
  win(156, 58, 40, 26, 2, 2);
  win(205, 61, 17, 23, 2, 3);

  /* ⑤ 右矮墙：横砖 + 压顶。照片里它比左围墙矮一半（43 vs 100） */
  const rx = GH_BWX + GH_BWW, ry = GH_H - GH_RWH;
  swBrick(g, rx, ry, GH_RWW, GH_RWH, 24, 7, SW_BRICK_L, SW_BRICK_D);
  px(g, rx, ry, GH_RWW, 2, SW_CAP);
  px(g, rx, ry + 2, GH_RWW, 1, SW_CAP_HI);

  /* ⑥ 雨篷（最前层）：左段高、右段低，中间一个 8px 的台阶 —— 照片里那是个进深折角，
     掰正后就是这道台阶。它压住左围墙顶、门卫室顶、矮墙顶。 */
  const eave = function (ex, ew, et, pleat) {
    const eh = GH_EB - et;
    px(g, ex, et, ew, eh, SW_EAVE_L);                    // 板面：正面看就是一条横板
    /* ⚠️ 折扇密棱**只给左段**：照片里收起来的那一半（x205..305 ⇒ 画布 98..181）
       才有一根根竖棱，展开的右半是平板。首轮两段都压了竖纹 ⇒ 整条雨篷像拉了一排百叶。 */
    /* 左段密棱、右段疏淡棱：照片里展开的那一半也还有痕，只是浅得多。
       两段都压同样重的棱时整条雨篷像一排百叶（首轮渲染）。 */
    if (pleat) swVgrain(g, ex, et, ew, eh, 3, SW_EAVE_D);
    else swVgrain(g, ex, et, ew, eh, 8, rgba(SW_EAVE_D, 0.38));
    px(g, ex, et, ew, 1, SW_EAVE_D);                     // 上沿
    px(g, ex, GH_EB - 2, ew, 2, SW_CAP);                 // 檐口：下沿压深（照片里最重的一笔）
    px(g, ex, GH_EB, ew, 2, rgba(SW_CAP, 0.32));         // 檐下投影，落在底下的墙面上
  };
  eave(GH_EX, 78, GH_ET_L, true);                        // 左段 98..176（折扇收起段）
  eave(GH_EX + 78, GH_EW - 78, GH_ET_R, false);          // 右段 176..287（展开的平板）
  px(g, GH_EX, GH_ET_L, 1, GH_EB - GH_ET_L, SW_CAP);     // 左封头
  px(g, GH_EX + GH_EW - 1, GH_ET_R, 1, GH_EB - GH_ET_R, SW_EAVE_D);

  /* ⑦ 接地影：整条落在落地线上（画布最后两行） */
  px(g, 0, GH_H, GH_W, 1, "rgba(14,18,28,0.26)");
  px(g, 0, GH_H + 1, GH_W, 1, "rgba(14,18,28,0.12)");
  return { canvas: c, ax: 0, ay: GH_H };                 // ax:0 ⇒ x 就是画布左缘
}

/* --- 6.4.7 校名碑墙 --- */
function makeSteleWall() {
  const c = mkCanvas(ST_W, ST_H + 4), g = c.getContext("2d");
  /* 砖墙：照片里砖更长（世界 23）、行高 7，与左围墙同族但更规整 */
  swBrick(g, ST_SW, 0, ST_W - ST_SW, ST_H, 23, 7, SW_BRICK_L, SW_BRICK_D);
  /* 顶：深压顶 + 上沿亮线；底：勒脚亮线 + 深线（照片实测 y534 与 y724 两处） */
  px(g, ST_SW, 0, ST_W - ST_SW, 2, SW_CAP);
  px(g, ST_SW, 2, ST_W - ST_SW, 1, SW_CAP_HI);
  px(g, ST_SW, ST_H - 2, ST_W - ST_SW, 1, SW_CAP_HI);
  px(g, ST_SW, ST_H - 1, ST_W - ST_SW, 1, SW_CAP);
  /* 左端面：照片里墙有厚度，左侧露出一条深色竖带 */
  px(g, 0, 0, ST_SW, ST_H, SW_SIDE);
  px(g, 0, 0, 1, ST_H, SW_CAP);
  px(g, ST_W - 1, 0, 1, ST_H, SW_CAP);       // 右缘收头（照片里墙到 x1395 就断了）

  /* 石碑：直接搬到 §5.4.7 的成品上裁掉花岗岩框（见头注【四】）——
     `makeSchoolStone()` 出 102×63、框厚 HF=6，所以 (6,6) 起 90×51 就是石板本身。 */
  const HF = SM_FRAME >> 1;
  const full = makeSchoolStone();
  const sx = SLB_CX - ST_X - (SLB_W >> 1);              // 画布内碑左缘
  const sy = SLB_TOP;
  /* 碑比墙高，先在外圈压一道深缝（嵌进去的碑比砖面低，接缝必须看得见） */
  px(g, sx - 1, sy - 1, SLB_W + 2, SLB_H + 2, rgba(SW_CAP, 0.55));
  px(g, sx, sy + SLB_H, SLB_W, 2, rgba(SW_CAP, 0.30));  // 碑下沿的落影
  g.drawImage(full.canvas, HF, HF, SLB_W, SLB_H, sx, sy, SLB_W, SLB_H);
  return { canvas: c, ax: 0, ay: ST_H };
}

/* --- 6.4.8 摆进世界 ---
   ⚠️ 与 §6.5b/§6.5c/§6.5d 同款约束：必须在 scatter() / plantRows() **之前**
      addProp + addSolid，否则这两块地会长出散射树、垃圾桶与行道树。 */
function buildSouthWest() {
  addProp(Object.assign({}, makeGuardHouse(), { x: GH_X, y: SW_BY, tag: "ghouse" }));
  /* 碰撞盒：给左围墙 / 门卫室 / 右矮墙三段各一块（雨篷悬空、不落盒）。
     南沿就是落地线 ⇒ 玩家沿南墙走时贴着正面擦过去，绕得过去、穿不过去。 */
  addSolid(GH_X + GH_LWW / 2, SW_BY, GH_LWW, 10);
  addSolid(GH_X + GH_BWX + GH_BWW / 2, SW_BY, GH_BWW, 10);
  addSolid(GH_X + GH_BWX + GH_BWW + GH_RWW / 2, SW_BY, GH_RWW, 10);

  addProp(Object.assign({}, makeSteleWall(), { x: ST_X, y: SW_BY, tag: "stwall" }));
  addSolid(ST_X + ST_W / 2, SW_BY, ST_W, 10);
}

/* --- 6.4.9 净空 ---
   两件都落在"围墙内侧贴着墙根"的那一条带上，那一带原本有散射树、路灯与
   行道树（现状：拱门西侧有一棵桧柏 + 一棵粉色花树；碑墙东端压在既有路灯
   （2272,2457，32×84，横跨 x2256..2288）上）。
   ⚠️ 必须排在 §6.6c 的 clearPropTreeClash() **之后** —— 先跑会改变它保留/丢弃的
      集合，clashDropped 的计数跟着变（与 §5.2.8 / §5.3.9b 同款约束）。
   ⚠️ 石狮（tag `smLion`，x2111..2145）落在两个框**之间**的空档里，本函数碰不到它；
      保险起见仍把两块地的**所有**已放道具都纳入判据，只放行自己与楼（宽>110）。 */
const GHC_CLR = { x: 1600, y: 2385, w: 315, h: 112 };   // 保安厅 1607..1908 往外各留 7px
/* ⚠️ 左缘必须是 **2146**，不是 2143。
   `_propdiff.py` 2026-09-27 实测：写 2143 时石狮（tag `smLion`，锚点 SL_X=2128、
   `ax=17`、宽 34 ⇒ 足迹 **2111..2145**）右沿 2145 顶进框里 2px ⇒ **石狮被本函数删掉**，
   而用户的原话是「石狮子不用动」。2146 让判据 `x1 > C.x` 恰好不成立，狮子整只放行。
   （碑墙足迹 2150..2384 与狮子右沿仍差 5px，本来就不重叠 —— 见 §6.4.2。） */
const STW_CLR = { x: 2146, y: 2390, w: 247, h: 107 };   // 碑墙 2150..2384，西端留 4px
function clearSouthWest() {
  const boxes = [GHC_CLR, STW_CLR];
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* ⚠️ `smLion` **显式放行**，不靠"盒子算准了没碰到"。用户的原话是「石狮子不用动」，
       这颗 5px 的余量一旦哪天被谁挪一下锚点就会静默吞掉狮子 —— 而 `_propdiff` 只在自己
       想得起来跑的时候才报。宽 >110 那条留的是楼与围墙（大件一律不动）。 */
    if (p.tag === "ghouse" || p.tag === "stwall" || p.tag === "smLion" || p.img.width > 110) {
      keep.push(p); continue;
    }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    const x1 = x0 + p.img.width, y1 = y0 + p.img.height;
    let hit = false;
    for (const C of boxes) {
      if (x0 < C.x + C.w && x1 > C.x && y0 < C.y + C.h && y1 > C.y) { hit = true; break; }
    }
    if (hit) { dropped++; continue; }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* --- 5.14.3 几何：宽锚现算，一处写死 ---------------------------------------- */
function jxGeo(c) {
  const wallH0 = JX_FLOORS * FLOOR_H;
  const roofT  = c.height - JX_PADT - wallH0 - JX_PADB;   // 反解，不存第二份
  const eaveY  = JX_PADT + roofT;                         // 檐下沿 = 墙顶
  const w      = c.width - JX_PADX * 2;                   // 立面外框宽 = footprint 宽
  const sc     = w / JX_EW;                               // 每英寸多少世界像素
  const U      = (v) => Math.round(v * sc);
  const FH     = U(JX_EH);                                // 立面高 = 114
  const y0     = eaveY;                                   // 立面第 0 行（外框顶）
  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, y0: y0,
    x0: JX_PADX, x1: JX_PADX + w, w: w, sc: sc, U: U,
    FH: FH, baseY: y0 + FH, H: y0 + FH + JX_PADB,
    /* 英寸 → 画布；矩形一律**两端各取整再相减**（不许把宽单独取整 ——
       相邻两块会因此差 1px 露缝，见 30 段的教训）。 */
    rect: (o) => [JX_PADX + Math.round(o.x * sc), y0 + Math.round(o.y * sc),
                  Math.round((o.x + o.w) * sc) - Math.round(o.x * sc),
                  Math.round((o.y + o.h) * sc) - Math.round(o.y * sc)]
  };
  /* 几何闸：30 段的 PADT/画布高公式一动，反解出来的 roofT 立刻出界 ——
     出图时是一栋比例崩掉的楼，而三套自动验收都不看画面。 */
  if (roofT < 20 || roofT > 190)
    console.warn("65_jixie: 反解出的 roofT=%d 出了 30 段的 clamp 区间[20,190]，" +
                 "画布高 %d 与 PADT/wallH/SHY 公式对不上了", roofT, c.height);
  /* 字体闸：点阵字高必须 ≈ 楼名带高的 JX_GLYPH_R —— 换字体、改带高，
     这一条会先响，而不是等出图才发现字太大太小。 */
  const gh = JX_CHARS[0][2];
  let tw = JX_GAP * (JX_CHARS.length - 1);
  for (const e of JX_CHARS) tw += e[1];
  const bandH = U(JX_BAND.h), bandW = U(JX_BAND.w);
  if (Math.abs(gh - Math.round(bandH * JX_GLYPH_R)) > 1 || tw > bandW * 0.5)
    console.warn("65_jixie: 点阵 %d 行 / 总宽 %d 与楼名带 %d×%d 行对不上" +
                 "（字高应 ≈%d 行、总宽应 < %d）—— 重跑 _build/_jxfont.py？",
                 gh, tw, bandW, bandH, Math.round(bandH * JX_GLYPH_R), bandW >> 1);
  return G;
}

/* --- 5.14.4 楼名带五字：逐点 1bit 掩膜 + 平涂墨 --------------------------------
   与 `_build/_jxfont.py` 的 brush() **逐条同构**（probe 图就是按这支笔出的，
   观感判据才有效）：`L` 是"上方为空"的那一列（金底黑字下与 M 同值，留档是为了
   换成用户口径的「金字」时不用改这里）。 */
function jxGlyph(g, b64, nw, nh, x, y) {
  const s = atob(b64), bit = (i) => (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  for (let j = 0; j < nh; j++) {
    for (let i = 0; i < nw; i++) {
      if (!bit(j * nw + i)) continue;
      const up = (j === 0) || !bit((j - 1) * nw + i);
      px(g, x + i, y + j, 1, 1, up ? JX_INK.L : JX_INK.M);
      if (j + 1 < nh && !bit((j + 1) * nw + i)) px(g, x + i, y + j + 1, 1, 1, JX_INK.D);
    }
  }
}

/* 五字在楼名带里**居中**排布（正面图里也是居中的：墨迹中心 527.4pt、
   带中心 527.7pt，差 0.3pt ⇒ 就是居中，不是左对齐）。 */
function jxPlaque(g, r) {
  let tw = JX_GAP * (JX_CHARS.length - 1);
  for (const e of JX_CHARS) tw += e[1];
  const gh = JX_CHARS[0][2];
  let x = r[0] + ((r[2] - tw) >> 1);
  const y = r[1] + Math.max(0, (r[3] - gh) >> 1);
  for (const e of JX_CHARS) {
    jxGlyph(g, e[0], e[1], e[2], x, y);
    x += e[1] + JX_GAP;
  }
}
