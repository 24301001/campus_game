     进深与 `20_ground.js` 的 CAMPUS 对一遍。两条错法都能被它抓住：
       ① 60 段那一行漏了给本楼开 `roofFull` ⇒ 30 段的画布高变成
          `PADT + round(0.6·进深) + 墙高 + PADB`，反解出来的数**偏小一大截**；
       ② CAMPUS 的 `h` 被改了而这里没跟着动。 */
  const _row = CAMPUS.find((e) => e[0] === WJ_NAME);
  if (!_row) console.warn("69_wujiao: CAMPUS 里找不到「%s」—— 名字被改过了？", WJ_NAME);
  else if (Math.abs(depth - Math.ceil(IX(_row[5]))) > 1)
    console.warn("69_wujiao: 从画布高反解出的进深 %d 与 CAMPUS 的 ceil(IX(h)) = %d 对不上" +
                 "（差 %d）—— 多半是 60 段没给本楼开 roofFull，或 CAMPUS 那一行刚改过",
                 depth, Math.ceil(IX(_row[5])), Math.abs(depth - Math.ceil(IX(_row[5]))));
  if (H !== WJ_PADT + roofT + wallH0 + WJ_PADB)
    console.warn("69_wujiao: 自算画布高 %d ≠ PADT+roofT+wallH+PADB = %d ⇒ 楼会被裁掉或底下留空",
                 H, WJ_PADT + roofT + wallH0 + WJ_PADB);
  if (roofT + wallH0 < depth)
    console.warn("69_wujiao: 屋带 %d + 墙高 %d = %d < 进深 %d ⇒ 精灵盖不满 footprint，" +
                 "北缘会露出一条灰石板（`paintCells` 给 K.BLD 铺的楼前硬地）",
                 roofT, wallH0, roofT + wallH0, depth);
  if (wallH0 !== WJ_WALL_MUL * FLOOR_H)
    console.warn("69_wujiao: 墙高 %d ≠ WJ_WALL_MUL(%d) × FLOOR_H(%d)",
                 wallH0, WJ_WALL_MUL, FLOOR_H);
  if (G.gable * 3 > roofT)
    console.warn("69_wujiao: 山墙高 %d 吃掉屋带 %d 的三分之一以上 ⇒ 屋带只剩两个小坡，" +
                 "南北向正脊的「长」就读不出来了", G.gable, roofT);
  if (G.cxi !== Math.round(cx))
    console.warn("69_wujiao: 正脊列 %d ≠ 立面中轴 %d —— 脊没走在轴上", G.cxi, Math.round(cx));
  if (G.ridgeY <= WJ_PADT || G.ridgeY >= eaveY)
    console.warn("69_wujiao: 山墙尖第 %d 行跑到屋带 [%d,%d] 外面了", G.ridgeY, WJ_PADT, eaveY);
  const stack = [G.under.top, G.under.bot, G.cope.top, G.cope.bot, G.brickT,
                 G.plin.top, G.plin.bot, G.gnd.top, G.gnd.bot];
  for (let i = 1; i < stack.length; i++)
    if (stack[i] < stack[i - 1])
      console.warn("69_wujiao: 立面竖带第 %d 项(%d) 跑到上一项(%d) 上面了 —— %s",
                   i, stack[i], stack[i - 1], stack.join(","));
  G.band.forEach((b, i) => {
    if (b.top >= b.bot) console.warn("69_wujiao: 第 %d 条层间灰带上下沿反了", i + 1);
    if (b.top <= G.brickT || b.bot >= G.plin.top)
      console.warn("69_wujiao: 第 %d 条层间灰带 %d..%d 越出砖墙 [%d,%d]",
                   i + 1, b.top, b.bot, G.brickT, G.plin.top);
  });
  if (!(G.winRow[0] < G.winRow[1] && G.winRow[1] < G.winRow[2]))
    console.warn("69_wujiao: 三排窗的行 %s 不是自上而下递增", G.winRow.join(","));
  for (let f = 0; f < 3; f++) {
    if (G.winRow[f] <= G.cope.bot)
      console.warn("69_wujiao: 第 %d 排窗顶 %d 压到檐口带上", f + 1, G.winRow[f]);
    if (G.winRow[f] + WJ_WIN_H > G.plin.top)
      console.warn("69_wujiao: 第 %d 排窗底 %d 压到墙裙 %d 上",
                   f + 1, G.winRow[f] + WJ_WIN_H, G.plin.top);
  }
  if (G.door.bot > G.baseY - 4 || G.door.top < G.cope.bot)
    console.warn("69_wujiao: 大门行 %d..%d 越出墙面 [%d,%d]",
                 G.door.top, G.door.bot, G.cope.bot, G.baseY - 4);
  if (G.door.x0 <= G.pil2[0][1] || G.door.x1 >= G.pil2[1][0])
    console.warn("69_wujiao: 大门列 %d..%d 压到两根中柱上了", G.door.x0, G.door.x1);
  if (G.winC[1] !== Math.round(cx))
    console.warn("69_wujiao: 中间那扇窗的中心 %d ≠ 立面中轴 %d —— 立面对不齐了",
                 G.winC[1], Math.round(cx));
  /* ⚠️ 占位要按**含白框(±1)与凹边(±2)**算，不是按玻璃宽算 —— 否则"没压柱子"
     是假绿。第一版就是按玻璃宽判的，框画在框外以后判据就松了。 */
  const oxw = (WJ_WIN_W - 1) >> 1;
  G.winC.forEach((c0, i) => {
    const a0 = c0 - oxw - 2, a1 = c0 + (WJ_WIN_W - 1 - oxw) + 2;
    const bad = (i === 0 && a1 >= G.pil2[0][0]) || (i === 1 && (a0 <= G.pil2[0][1] || a1 >= G.pil2[1][0]))
             || (i === 2 && a1 >= G.corner[1][0]);
    if (bad) console.warn("69_wujiao: 第 %d 扇窗 %d..%d 压到相邻的灰壁柱上", i + 1, a0, a1);
    if (a0 < 0 || a1 >= c.width) console.warn("69_wujiao: 第 %d 扇窗出了画布", i + 1);
  });
  if (G.ex0 < 0 || G.ex1 >= c.width)
    console.warn("69_wujiao: 檐口列 %d..%d 出了画布宽 %d", G.ex0, G.ex1, c.width);
  return G;
}

/* --- 5.18.4 屋面：**南北向正脊的双坡顶**（第三十三轮重做） -------------------
   屏上从上到下依次是：北端远檐边 → 两个坡面夹一条**竖直的正脊** → 南端山墙三角 → 南檐口。
   ⚠️ 全程**不取随机数**：屋面板不用 30 段那套 speckle ⇒ 建筑 RNG 序列一个数不动。
   ⚠️ 每一笔都被 `F()` 夹在 [ex0, ex1] 里、行也只在 [yTop, yBot) 里
      ⇒ 结构上不可能留缝、也不可能画到画布外面去（旧的"三段铺满"换成"两段铺满"）。 */
function wjRoof(g, G) {
  const ex0 = G.ex0, ex1 = G.ex1, yTop = WJ_PADT, yBot = G.eaveY;
  const cxi = G.cxi, YR = G.ridgeY, GA = G.gable;
  const half = (ex1 - ex0) / 2;               // 半宽（列）—— 山墙三角的底半宽
  const STEP = 7, R = Math.round;             // 瓦纹间距
  /* 瓦纹暗线：比坡面本色压暗的幅度。
     ⚠️ 原值 −0.30 在第一版出图上把整个屋面读成**瓦楞铁皮**（一条 1px 暗线每 7 列、
        拉满 426 行 ⇒ 罗纹太硬）。**−0.18 是"看得出瓦垄、但不抢脊线"的那一档** ——
        南北向脊的屋面本来就长（426 行），纹路一硬就整片压过山墙三角。 */
  const SEAM = -0.18;
  const se = { W: shade(WJ_C.TW, SEAM), E: shade(WJ_C.TE, SEAM),
               T: shade(WJ_C.TILE, SEAM) };
  const F = (a, b, y, col) => wjFill(g, Math.max(ex0, a), Math.min(ex1, b), y, col);
  /* `fOf(x)` = 第 x 列上**山墙三角的上边界**（距檐口的行数）。
     三角在第 t 行（t = yBot − y）的半宽 = half·(1 − t/GA)；
     令 half·(1 − t/GA) = |x − cxi| ⇒ **t = GA·(1 − |x − cxi|/half)**。
     x 越靠外 ⇒ 三角越早收掉（f 越小）⇒ 那条列上的坡面越长。 */
  const fOf = (x) => GA * (1 - Math.abs(x - cxi) / half);
  /* ① 逐行铺底。
     ⚠️ 两侧段在这遍必须铺**纯本色** —— 它们的瓦纹由 ② 竖着画。旧版在这里对侧段
        也套了横纹 ⇒ 两个坡被横竖两遍纹理叠成"网格布"；这遍只铺纯色，不会重犯。
     ⚠️ 山墙那一段**横纹**（照片上屋顶内部就是横条纹）：三角越往上越窄，
        所以横纹自然越来越短 —— 这正是照片上的样子。 */
  for (let y = yTop; y < yBot; y++) {
    const t = yBot - y;
    if (t >= GA) {                                        // 山墙尖以上：纯两坡 + 正脊
      F(ex0, cxi - 2, y, WJ_C.TW);                        // 西坡（迎光）
      F(cxi + 2, ex1, y, WJ_C.TE);                        // 东坡（背光）
      px(g, cxi - 1, y, 3, 1, WJ_C.RIDGE);                // 正脊（屏上那条竖线）
      px(g, cxi - 1, y, 1, 1, WJ_C.RIDGEL);               // 脊顶受光的 1 列
    } else {                                              // 山墙三角那几行
      const hw = R(half * (1 - t / GA));                  // 该行三角的半宽
      const hi = (t % STEP) === 0;
      F(ex0, cxi - hw - 1, y, WJ_C.TW);                   // 坡脚（三角左边）
      F(cxi - hw, cxi + hw, y, hi ? se.T : WJ_C.TILE);    // 山墙面（横纹）
      F(cxi + hw + 1, ex1, y, WJ_C.TE);                   // 坡脚（三角右边）
    }
  }
  /* ② 瓦垄：**平行于正脊**（正脊南北向 ⇒ 屏上是竖线）。
     第 x 列上坡面的行范围 = [yTop, yBot − fOf(x))：山墙三角把下头切掉一块。
     ⚠️ 与 ① 的三角**首尾相接**（三角占 t ≤ f、坡面占 t > f）⇒ 不会两遍叠色。 */
  for (let x = ex0 + 3; x < cxi - 1; x += STEP) {
    const y1 = yBot - R(fOf(x));
    if (y1 - yTop > 2) px(g, x, yTop, 1, y1 - yTop, se.W);
  }
  for (let x = ex1 - 3; x > cxi + 1; x -= STEP) {
    const y1 = yBot - R(fOf(x));
    if (y1 - yTop > 2) px(g, x, yTop, 1, y1 - yTop, se.E);
  }
  /* ③ 两条戗脊（博风）：南檐两角 → 山墙尖。
     ⚠️ 旧版那四条"全汇到顶点"的脊到此为止 —— 南北向正脊的**北端不收敛**
         （那边是北山墙，背对我们、看不见），所以北端只留 ⑤ 那条远檐边。 */
  wjHip(g, ex0, yBot, cxi, YR);
  wjHip(g, ex1, yBot, cxi, YR);
  /* ④ 山墙尖上那一小块暗件（照片峰顶是深色的）—— 只压 3 行，别做成宝顶 */
  px(g, cxi - 1, YR - 3, 3, 3, WJ_C.APEX);
  px(g, cxi - 2, YR, 5, 2, WJ_C.RIDGE);
  /* ⑤ 北端的远檐边：屏上最高那两行就是屋顶**最远**的一条边，压一道暗线收口 */
  px(g, ex0, yTop, ex1 - ex0 + 1, 2, shade(WJ_C.TILE, -0.50));
  /* ⑥ 南檐口：出挑的外沿线 + 压在墙顶上的那道暗投影（照片 583..594） */
  px(g, ex0, yBot - 2, ex1 - ex0 + 1, 2, shade(WJ_C.TILE, -0.55));
  px(g, ex0, yBot, ex1 - ex0 + 1, 1, shade(WJ_C.TILE, -0.72));
}
/* 一段坡面/山墙面的单行。同一个 y 上，瓦纹行在两坡之间是**接得上**的 */
function wjFill(g, x0, x1, y, col) {
  if (x1 < x0) return;
  px(g, x0, y, x1 - x0 + 1, 1, col);
}
/* 一条戗脊：檐角 (x1,y1) → 脊端 (x2,y2)，逐行插值铺 3 列瓦 */
function wjHip(g, x1, y1, x2, y2) {
  const n = Math.abs(y2 - y1), s = y2 > y1 ? 1 : -1;
  for (let i = 0; i <= n; i++) {
    const x = Math.round(x1 + (x2 - x1) * (i / (n || 1)));
    px(g, x - 1, y1 + i * s, 3, 1, WJ_C.RIDGE);
    px(g, x - 1, y1 + i * s, 1, 1, WJ_C.RIDGEL);
  }
}

/* --- 5.18.5 立面构件 ------------------------------------------------------- */
/* 红砖：照片这个尺度上砖缝很浅（直方图上没有暗色簇）
   ⚠️ 第一版是 4 行横缝 + 8 列竖缝、对比 7% —— 放大对照时**整面墙读成"格子布"**，
      而照片上根本看不见砖缝。现在：横缝留（这是砖的层理），竖缝稀疏到每 16 列一个点。
   ⚠️ 竖缝**必须裁到砖带底边**：缝高固定 4 行，而循环只卡了起点 ⇒ 起点落在最后 3 行以内时，
      这道缝会从墙脚探出去，在落地线外面留下若干个砖红色的 1px 点（第三十一轮从 2x 放大图上
      才看出来，五套自动验收全绿 —— 又一个"纯像素"盲区）。`Math.min` 就是那道裁刀。 */
function wjBrick(g, x, y, w, h) {
  px(g, x, y, w, h, WJ_C.BRI);
  for (let yy = y + 3; yy < y + h; yy += 4) px(g, x, yy, w, 1, WJ_C.BRD);
  for (let yy = y, k = 0; yy < y + h; yy += 4, k++)
    for (let xx = x + (k & 1 ? 8 : 0); xx < x + w; xx += 16)
      px(g, xx, yy, 1, Math.min(4, y + h - yy), WJ_C.BRD);
}
/* 灰件（角柱 / 中柱 / 檐口带 / 层间带 / 墙裙）：左上受光、右下背光，服从 SUN。
   ⚠️ 颜色从**实参**进来（BAND / PLIN 与 PIL 不同档），本函数不吃全局 WJ_C。 */
function wjGray(g, x, y, w, h, col) {
  if (h <= 0 || w <= 0) return;
  px(g, x, y, w, h, col);
  px(g, x, y, w, 1, "rgba(255,255,255,0.20)");
  px(g, x, y, 1, h, "rgba(255,255,255,0.14)");
  px(g, x + w - 1, y, 1, h, "rgba(14,18,28,0.20)");
  px(g, x, y + h - 1, w, 1, "rgba(14,18,28,0.26)");
}
/* 一扇窗：**上亮子 + 下两扇**（`_look/_wj_win.png` 放大看：横挺在 37% 高处通到两边，
   竖挺只走横挺以下、落在 53% 处；上亮子反天光所以最亮，下部左扇最深）
   ⚠️ (x,y,w,h) 是**玻璃那块**，白框与凹边都画在它外面 —— 与照片读数一一对应。 */
function wjWin(g, x, y, w, h) {
  /* ① 窗洞凹边：照片 x428..440 / x513..520 各有一圈比墙暗 ~5% 的红（#a73841 / #a1323b）
     ⇒ 窗是**凹进墙里**的。不加这一圈，窗就是"贴在墙上的一张纸"。 */
  px(g, x - 2, y - 2, w + 4, h + 4, WJ_C.WREV);
  /* ② 白框只占 1 列/行。照片里框宽 4px ≈ 0.7 列（x 440..444、440..513 是玻璃），
     第一版画了 1 列全周 + 2 行窗台，出图看是"厚白边"，与照片的窄框不符。 */
  px(g, x - 1, y - 1, w + 2, h + 2, WJ_C.FRM);
  px(g, x + w, y - 1, 1, h + 2, WJ_C.FRMD);                    // 框右背光
  px(g, x - 1, y + h + 1, w + 2, 1, WJ_C.FRMD);                // 框下背光
  const ty = y + Math.max(4, Math.round(h * 0.37));            // 横挺（实测在 37% 高处）
  px(g, x, y, w, ty - y, WJ_C.GLAL);                           // 上亮子
  px(g, x, ty, w, 1, WJ_C.FRM);                                // 横挺通到两边
  px(g, x, ty + 1, w, y + h - ty - 1, WJ_C.GLA);               // 下扇玻璃（右下扇本色）
  /* 中缝竖挺落在 36% 处（照片：左扇 24px / 右扇 33px ⇒ 左窄右宽）。
     ⚠️ 上一版按"53%"画（那是从缩放过的 `_wj_win.png` 上量的），左右扇宽窄是反的。 */
  const mx = x + Math.max(3, Math.round(w * 0.36));
  px(g, mx, ty + 1, 1, y + h - ty - 1, WJ_C.FRM);              // 中缝竖挺
  px(g, x, ty + 1, Math.max(1, mx - x - 1), y + h - ty - 1, WJ_C.GLAD);  // 左扇更深
  /* 下扇越往下越深（照片 x460 列：710..739 #5d708e → 753..778 #48648b） */
  px(g, x, y + h - 3, w, 3, "rgba(20,30,44,0.14)");
  /* ⚠️ 窗台：照片窗下**只有白框自己那一道浅线**（#dfdfe9），没有投影。
     第一版在窗下画了 2 行窗台 + 1 行影、又给亮子加了顶行反光 —— 对照图上
     这两笔让窗读成"贴上去的白相框"，而照片里窗是**沉在墙里**的。两笔都删。 */
}
/* 大门：深蓝双开门 + 门顶横亮子（照片上是**一整层高**的门洞，见文件头表）
   ⚠️ 三段色是照片实测，不是想当然：门洞上沿 #43080a（暗红影）→ 门顶亮子 #040c0f
      （**近黑**，第一版按藏青画是错的）→ 两扇门 #0e2e47（藏青）。 */
function wjDoor(g, G) {
  const d = G.door, w = d.x1 - d.x0 + 1, h = d.bot - d.top + 1;
  const dy = d.top + 3;                                        // 门叶真正起画的行（照片 1165）
  px(g, d.x0 - 2, d.top, w + 4, 3, WJ_C.DOORS);                // 门洞上沿的暗红阴影
  px(g, d.x0 - 2, dy - 1, w + 4, h - 2, WJ_C.DFRM);            // 门洞暗框
  px(g, d.x0 - 1, dy, w + 2, h - 3, "#2b333c");
  /* 亮子只占门高 **1/4**：采样只到 1180~1230（门高 16%~37%）是近黑，再往下 1290 起就是藏青。
     第一版按 41% 画，出图门上是一大块黑，与照片"整扇藏青、只顶上压一道暗"不符。 */
  const ty = dy + Math.max(5, Math.round((d.bot - dy + 1) * 0.25));
  px(g, d.x0, dy, w, ty - dy, WJ_C.DOORD);                     // 横亮子（近黑）
  px(g, d.x0, dy, w, 1, WJ_C.DFRM);
  px(g, d.x0, ty, w, 1, WJ_C.DFRM);                            // 亮子下的横框
  px(g, d.x0, ty + 1, w, d.bot - ty, WJ_C.DOOR);               // 两扇门（藏青）
  const mx = Math.round(d.x0 + w / 2);
  px(g, mx - 1, ty + 1, 2, d.bot - ty, WJ_C.DFRM);             // 中缝
  const gy = ty + Math.round((d.bot - ty) * 0.42);             // 门上玻璃下沿
  px(g, d.x0 + 2, ty + 3, (mx - 1) - (d.x0 + 2), gy - ty - 3, "#1c3f5e");
  px(g, mx + 1, ty + 3, (d.x0 + w - 1) - (mx + 1), gy - ty - 3, "#1c3f5e");
  px(g, d.x0 + 2, gy, w - 4, 1, WJ_C.DFRM);
  px(g, mx - 4, gy + 6, 2, 5, "#c9c4b4");                      // 门把手（一对）
  px(g, mx + 2, gy + 6, 2, 5, "#c9c4b4");
  px(g, d.x0, dy, 1, d.bot - dy + 1, "rgba(255,255,255,0.16)");
  px(g, d.x0 + w - 1, dy, 1, d.bot - dy + 1, "rgba(14,18,28,0.30)");
  px(g, d.x0, d.bot - 2, w, 3, "rgba(14,18,28,0.34)");         // 落地最暗
}

/* --- 5.18.6 立面总装（只在**新画布**上画） ---------------------------------- */
function wjFront(g, G) {
  const x0 = G.x0, x1 = G.x1, w = G.w;
  /* ① 檐下暗带（照片 583..598 —— 屋面板压在墙顶上的那道投影，实测 #25282d **几乎全黑**） */
  px(g, x0, G.under.top, w, G.under.bot - G.under.top + 1, WJ_C.UND);
  /* ② 檐口带（600..619，灰、比壁柱暗一档 —— 檐下背光） */
  wjGray(g, x0 - 1, G.cope.top, w + 2, G.cope.bot - G.cope.top + 1, WJ_C.GRY);
  /* ②' 檐口下缘那道近黑的红边（照片 620..632 实测 #23060a）—— 有无这一笔，
      红墙与灰檐口"贴不贴得住"差别很大 */
  px(g, x0, G.copeb, w, 1, WJ_C.COPEB);
  /* ③ 砖墙底（从砖顶一路到墙脚） */
  wjBrick(g, x0, G.brickT, w, G.gnd.bot - G.brickT + 1);
  /* ④ 红墙里的两根基柱（亮砖 + 两侧暗边） */
  for (const r of G.relief) {
    const rw = r[1] - r[0] + 1;
    if (rw < 3 || r[0] < x0 || r[1] > x1) continue;
    px(g, r[0], G.brickT, rw, G.gnd.bot - G.brickT + 1, WJ_C.BRL);
    px(g, r[0], G.brickT, 1, G.gnd.bot - G.brickT + 1, WJ_C.BRLD);
    px(g, r[1], G.brickT, 1, G.gnd.bot - G.brickT + 1, WJ_C.BRLD);
  }
  /* ⑤ 两条层间灰横带（压在砖与基柱之上，通到两根角柱 —— 照片如此）
     ⚠️ 带子**下沿那道投影必须画**：照片 876~892 里有一簇 #47090a，是灰带在红墙上
        投的影。第一版只有 wjGray 自带的 0.26 暗边，出图看带子是"浮"在墙上的。 */
  for (const b of G.band) {
    wjGray(g, x0, b.top, w, b.bot - b.top + 1, WJ_C.BAND);
    px(g, x0, b.bot + 1, w, 1, WJ_C.BANDSH);
  }
  /* ⑥ 墙裙 + 墙脚最暗那几行 */
  wjGray(g, x0, G.plin.top, w, G.plin.bot - G.plin.top + 1, WJ_C.PLIN);
  px(g, x0, G.gnd.top, w, G.gnd.bot - G.gnd.top + 1, WJ_C.GND);
  /* ⑦ 两根角柱 + 两根中柱（檐口带下沿通到墙裙上沿），底部外扩成基座 */
  const posts = G.corner.concat(G.pil2);
  const pTop = G.cope.bot + 1, pBot = G.plin.top - 1, pph = pBot - pTop + 1;
  for (const p of posts) {
    wjGray(g, p[0], pTop, p[1] - p[0] + 1, pph, WJ_C.PIL);
    px(g, p[1], pTop, 1, pph, WJ_C.PILD);
  }
  for (const p of posts) {                                   // 基座（照片上明显外扩）
    const bx = p[0] - 2, bw = (p[1] - p[0] + 1) + 4, by = G.plin.top - 6;
    /* ⚠️ 基座止于**墙裙下沿**，不许压到 gnd（那道浅散水）：照片上墙脚外是浅色地面，
       第一版基座一路铺到 baseY，把浅带盖成灰的，整个墙脚读成"暗红" */
    px(g, bx, by, bw, G.plin.bot - by + 1, WJ_C.PILB);
    px(g, bx, by, bw, 1, "rgba(255,255,255,0.22)");
    px(g, bx, G.plin.bot, bw, 1, "rgba(14,18,28,0.30)");
  }
  /* ⑧ 窗阵：三列 × 三层；**首层中列让给大门**（照片如此） */
  const ox = (WJ_WIN_W - 1) >> 1;
  for (let f = 0; f < 3; f++)
    for (let i = 0; i < 3; i++) {
      if (f === 2 && i === 1) continue;                      // 首层中间 = 门
      wjWin(g, G.winC[i] - ox, G.winRow[f], WJ_WIN_W, WJ_WIN_H);
    }
  /* ⑨ 雨水管（贴在两根基柱内侧，压在砖上） */
  for (const qx of G.pipes) {
    if (qx < x0 || qx + 2 > x1) continue;
    px(g, qx, pTop, 3, pph, "rgba(14,18,28,0.20)");
    px(g, qx, pTop, 2, pph, WJ_C.PIL);
    px(g, qx, pTop, 1, pph, "#dfe4ea");
  }
  /* ⑩ 大门（最后画，压在首层砖面与两条中柱之间） */
  wjDoor(g, G);
  /* ⑪ 整栋外轮廓 + 接地最深窄带（照 30 段 §3.8） */
  px(g, x0 - 1, G.cope.top, 1, G.baseY - G.cope.top, "#6c6f76");
  px(g, x1, G.cope.top, 1, G.baseY - G.cope.top, "#5c5f66");
  contactBand(g, x0 + 1, x1 - 1, G.baseY - 1, 2, 0.34);
}
/* 台阶：3 级，**画在落地线以外**（照 30 段 §3.7 的处理，本段自己画不搬旧画布） */
function wjSteps(g, G) {
  const cx = Math.round(G.cxr), dw = G.door.x1 - G.door.x0 + 1;
  for (let i = 0; i < 3; i++) {
    const sw = dw + 4 + i * 6, sx = cx - Math.round(sw / 2), sy = G.baseY + i * 3 - 2;
    px(g, sx, sy, sw, 3, shade(WJ_C.STEP, 0.10 - i * 0.11));
    px(g, sx, sy + 3, sw, 1, "rgba(14,18,28,0.26)");
  }
}

/* --- 5.18.7 屋名标牌 --------------------------------------------------------
   30 段 §3.2.9 的牌子挂在 `signRect(sgn, x0, w, eaveY)` = 第 `eaveY−8−h` 行起。
   牌子落在**南端山墙三角**上（第三十三轮起：三角占第 `eaveY−44` ~ `eaveY−1` 行）
   —— 位置、画法、投影偏移全部照 30 段原样，只是脚下的面从平板变成了山墙面。
   ⚠️ 牌子左右两端会压到两个坡面上（见文件头 ⑥），可接受。
   ⚠️ `makeSign(WJ_NAME)` 这一句**必须留着**：`verify.py` 的屋名标牌自检读 `_signCache`，
      少了它这一栋在自检里就"没名字"。 */
function wjSign(g, G) {
  const sgn = makeSign(WJ_NAME);
  const sg  = signRect(sgn, G.x0, G.w, G.eaveY);
  if (!sg) { console.warn("69_wujiao: makeSign 没拿到字形 —— 屋名标牌挂不上"); return; }
  if (sg.y < G.ridgeY + 2)
    console.warn("69_wujiao: 屋名牌第 %d 行顶到正脊（第 %d 行）了", sg.y, G.ridgeY);
  px(g, sg.x + 3, sg.y + 3, sg.w, sg.h, "rgba(14,18,28,0.30)");
  g.drawImage(sgn.c, sg.x, sg.y);
}

/* --- 5.18.8 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是精灵，
      晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/…/qjRestyle 同一规矩）。
   ⚠️ 本函数**不碰共享 RNG、不取任何随机数** ⇒ 建筑序列与全校园散射流一个数不动。
   ⚠️ 与 68 段的分水岭：**不搬旧画布一行**。旧画布的平屋顶板、女儿墙、屋面设备、
      屋面斑点、旧台阶全部作废，新画面从零画（用户要的就是这个）。
      `x0/x1` 是 30 段算出来的原值 ⇒ 立面宽度与占地无关（碰撞盒在 60 段）。
   ⭐ 第三十二轮起：**画布尺寸 `G.H` 与 `b.ay` 都回到 30 段的原值**
      （`roofFull` 那条规矩的附带效果，见文件头）⇒ 这一轮**没有**第三十一轮
      那种"整体上滑 34 行、屋顶压住马路"的副作用。 */
function wjRestyle(b, pal) {
  const c = b.canvas;
  const G = wjGeo(c);
  const nc = mkCanvas(c.width, G.H), ng = nc.getContext("2d");
  /* ① 方向性投影（照 30 段 §3.1，画在立面之前 ⇒ 只有落地线以下留在画面里） */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  shadowQuad(ng, G.x0 + 2, G.baseY - WJ_SHADOW_H, G.x1 - 2, G.baseY, SHX, SHY, 0.28, 4);
  /* ② 自设计的南北向正脊双坡顶 */
  wjRoof(ng, G);
  /* ③ 立面 */
  wjFront(ng, G);
  /* ④ 屋名标牌（照 30 段原式挂在新屋面上） */
  wjSign(ng, G);
  /* ⑤ 台阶 */
  wjSteps(ng, G);
  b.canvas = nc;
  b.ay = G.baseY;                    // 同高同锚 ⇒ 与改前逐字节相同（写出来只为把契约写明）
  return b;
}

  TOWD:  "#2b323b",   // 塔的层间横线（深）
  LT:    "#ffffff",   // BJTUSA 字母
  R_EDGE:"#cfc9a4",   // 屋面檐口外沿
  R_DECK:"#e9e4bc",   // 屋面板面
  R_TOP: "#f7f2d0",   // 女儿墙顶受光面
  R_LIT: "#f0ebc4",   // 屋面左内侧受光
  R_DIM: "#dcd6ae",   // 屋面右内侧背光
  R_EAVE:"#bdb894",   // 檐口投影线
  DEV:   "#d5d2c0",   // 屋面设备
  DEVD:  "#b5b2a2",
  GLA:   "#9dbdd4",   // 棚架玻璃栏板
  GLAL:  "#c2dbe8",
  GLAD:  "#7fa3bd",
  WD:    "#c49a78",   // 木顶板
  WDL:   "#e3b896",   // 木顶板受光面
  WDD:   "#a67f5f",   // 木顶板暗面
  WEDGE: "#865d3f",   // 棚架前缘（深木）
  COL:   "#8a6145",   // 木柱
  COLL:  "#b18362",   // 木柱受光
  COLD:  "#6b4a33",   // 木柱背光
  SIGN:  "#5c3e36",   // 招牌底（实测 #5c3e36）
  SIGNL: "#6d4a40",   // 招牌上棱
  SIGND: "#472e28",   // 招牌下棱
  GOLD:  "#e8d9a8",   // 招牌金字（与 30 段屋名牌同一支金）
  PIPE:  "#b8bcc2"    // 墙面雨水管
};

/* --- 5.19.3 几何：一律现算，一处写死 ----------------------------------------
   ⚠️ `roofT` 是**反解**的（`c.height` 减去 30 段那四段固定高），不存第二份 ——
      30 段的画布高公式一改，这里立刻跟着走，而不是留一个对不上的死数。 */
function jyGeo(c) {
  const wallH0 = JY_FLOORS * FLOOR_H;
  const roofT  = c.height - JY_PADT - wallH0 - JY_PADB;   // 反解（本楼 = 96）
  const eaveY  = JY_PADT + roofT;                         // 檐下沿 = 立面顶
  const w      = c.width - JY_PADX * 2;                   // 立面宽 = footprint 宽
  const sc     = w / JY_PW;                               // 照片 px → 精灵 px（横向）
  const sv     = wallH0 / JY_RISE;                        // 照片 px → 精灵行（纵向）
  const baseY  = eaveY + wallH0;
  const x0     = JY_PADX, x1 = JY_PADX + w;
  /* 照片 x → 画布 x（**两端各取整再相减**：相邻两块才不会差 1px 露缝，30 段的教训） */
  const X = (v) => JY_PADX + Math.round((v - 152) * sc);
  /* 照片 y → 画布行（锚在"地面线"上；照片 y 越小越靠上 ⇒ 行越小） */
  const Y = (v) => baseY - Math.round((JY_GY - v) * sv);
  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, baseY: baseY,
    x0: x0, x1: x1, w: w, sc: sc, sv: sv, X: X, Y: Y,
    cx: JY_PADX + w / 2, H: c.height
  };
  /* 均匀窗阵：8 扇窗，窗左沿 = x0 + 15 + k·58 */
  const step = Math.round((w - 2 * 15 - JY_WIN_W) / (JY_COLS - 1));
  G.winX = [];
  for (let k = 0; k < JY_COLS; k++) G.winX.push(x0 + 15 + k * step);
  G.winStep = step;
  /* 每层窗顶：自下而上第 f 层（f=0 是首层）。首层是落地大玻璃，不排窗 */
  G.winTop = [];
  for (let f = 0; f < JY_FLOORS; f++)
    G.winTop.push(eaveY + (JY_FLOORS - 1 - f) * FLOOR_H + JY_WIN_PAD);
  /* 玻璃塔 */
  G.tower = { x0: X(JY_TOWER[0]), x1: X(JY_TOWER[1]), top: Y(JY_TTOP) };
  /* 塔上的竖排字母：x 居中在字母列区，6 个字母自上而下 */
  const lw = 10, lh = 14, lstep = 17;                     // 5×7 点阵放大 2 倍 → 10×14
  G.letter = {
    x: Math.round((X(JY_TLET[0]) + X(JY_TLET[1])) / 2 - lw / 2),
    y0: Y(JY_TLET[2]), step: lstep, s: 2, w: lw, h: lh
  };
  /* 棚架 */
  G.canopy = {
    x0: Math.max(4, X(JY_CANOP[0])), x1: Math.min(x1 + 3, X(JY_CANOP[1])),
    glaTop: Y(JY_CANOPY[0]), deckTop: Y(JY_CANOPY[1]),
    deckBot: Y(JY_CANOPY[2]), edgeBot: Y(JY_CANOPY[3])
  };
  /* 树状柱：与窗列同一组中轴，柱身 8 行宽 */
  G.colX = G.winX.map((wx) => wx + Math.round(JY_WIN_W / 2));
  G.colW = 8;
  /* 招牌 */
  G.sign = { x0: X(JY_SIGN[0]), x1: X(JY_SIGN[1]), top: Y(JY_SIGN[2]), bot: Y(JY_SIGN[3]) };
  /* 塔前台阶 + 墙面雨水管 */
  G.stair = { x0: X(JY_STAIR[0]), x1: X(JY_STAIR[1]), top: Y(JY_STAIR[2]) };
  G.pipe  = X(JY_PIPE);

  /* --- 闸们：这一组数一错，出图是一栋比例崩掉的楼，而五套自动验收全不看画面 --- */
  if (roofT < 20 || roofT > 190)
    console.warn("70_jianyi: 反解出的 roofT=%d 出了 30 段的 clamp 区间[20,190] —— " +
                 "画布高 %d 与 PADT/wallH/SHY 公式对不上了", roofT, c.height);
  /* 屋面盖满 footprint 的判据（30 段那条 `wallH >= 0.4·进深`）：
     本楼墙高 170 ≥ 0.4×160.2 = 64.1 ⇒ 默认 roofT 就够，**不需要 roofFull**。
     这一条要是哪天不成立（比如有人把层数改成 3），北缘会露出灰石板。 */
  if (wallH0 < 0.4 * 160)
    console.warn("70_jianyi: 墙高 %d 已薄于 0.4×进深(64)——北缘会露出 K.BLD 的灰石板，" +
                 "要么加层、要么给 60 段传 roofFull", wallH0);
  /* 塔闸：塔必须比女儿墙高、且顶端要落在画布内（照片高 140 px ≈ 32 行） */
  if (G.tower.top >= eaveY || G.tower.top < JY_PADT)
    console.warn("70_jianyi: 塔顶第 %d 行（檐口第 %d 行）—— 要么没冒出屋面、要么冲出画布",
                 G.tower.top, eaveY);
  if (G.tower.x0 <= x0 || G.tower.x1 >= x1)
    console.warn("70_jianyi: 塔 x[%d,%d] 越出立面 [%d,%d]", G.tower.x0, G.tower.x1, x0, x1);
  /* 字母闸：6 个字母要全部落在塔面上 */
  const lBot = G.letter.y0 + 6 * G.letter.step - (G.letter.step - G.letter.h);
  if (G.letter.x < G.tower.x0 || G.letter.x + G.letter.w > G.tower.x1 ||
      G.letter.y0 < G.tower.top || lBot > baseY)
    console.warn("70_jianyi: BJTUSA 字母块 x[%d,%d] 行[%d,%d] 越出塔面 [%d,%d]×[%d,%d]",
                 G.letter.x, G.letter.x + G.letter.w, G.letter.y0, lBot,
                 G.tower.x0, G.tower.x1, G.tower.top, baseY);
  /* 棚架闸：栏板在顶板之上、前缘在顶板之下，三段不能叠 */
  const cp = G.canopy;
  if (!(cp.glaTop < cp.deckTop && cp.deckTop < cp.deckBot && cp.deckBot <= cp.edgeBot))
    console.warn("70_jianyi: 棚架三段行序乱了 [%d,%d,%d,%d] —— JY_CANOPY 四个 y 配不上",
                 cp.glaTop, cp.deckTop, cp.deckBot, cp.edgeBot);
  if (cp.edgeBot >= baseY)
    console.warn("70_jianyi: 棚架前缘第 %d 行已落到落地线(%d)以下 —— 把底层玻璃整条吃掉了",
                 cp.edgeBot, baseY);
  /* 招牌闸：板面要整个落在立面里、且不与棚架柱区重叠到看不见 */
  const s = G.sign;
  if (s.x0 <= x0 || s.x1 >= x1 || s.top <= cp.edgeBot || s.bot > baseY - 2)
    console.warn("70_jianyi: 招牌 x[%d,%d] 行[%d,%d] 位置不对（棚架前缘第 %d 行 / 落地线 %d）",
                 s.x0, s.x1, s.top, s.bot, cp.edgeBot, baseY);
  return G;
}

/* --- 5.19.4 BJTUSA 五个点的字模 ---------------------------------------------
   5 宽 × 7 高、行优先 MSB 在左（只用到低 5 位）。手写而不是走系统字体二值化：
   这六个字母是要**放大 2 倍**贴到塔上的，二值化出来的 11px 抗锯齿字放大后会带
   灰边（30 段 §3.0 讲的同一件事），而 5×7 点阵放大 2 倍是干净的 10×14 硬边。 */
const JY_LET = {
  B: [0x1E, 0x11, 0x11, 0x1E, 0x11, 0x11, 0x1E],
  J: [0x07, 0x02, 0x02, 0x02, 0x02, 0x12, 0x0C],
  T: [0x1F, 0x04, 0x04, 0x04, 0x04, 0x04, 0x04],
  U: [0x11, 0x11, 0x11, 0x11, 0x11, 0x11, 0x0E],
  S: [0x0F, 0x10, 0x10, 0x0E, 0x01, 0x01, 0x1E],
  A: [0x0E, 0x11, 0x11, 0x1F, 0x11, 0x11, 0x11]
};
const JY_TLET_TXT = "BJTUSA";

/* --- 5.19.5 招牌金字：系统字体 → 二值化（照 30 段 §3.0 makeSign 那一套） -------
   与 30 段那份的区别只有一处：**字号可传**。30 段的 SIGN_FS=18 是"屋名牌"的规格
   （楼名最宽 6 字、牌面 128），而本段的招牌板只有 84 行宽、要塞 6 个中文字，
   只能走 12px。所以这里另起一个（**不复用 `_signCache`**：那份缓存按"名字"存，
   存的却是 18px 的牌面，混用会让本段的招牌静默变成 128 行宽的大牌子）。 */
function jyPlate(txt, fs) {
  const t = mkCanvas(8, 8);
  let tc = t.getContext("2d");
  const FONT = "bold " + fs + "px 'Microsoft YaHei','SimHei','PingFang SC',sans-serif";
  tc.font = FONT;
  const tw = Math.ceil(tc.measureText(txt).width) + 4, th = fs + 8;
  t.width = tw; t.height = th;                 // ⚠️ 改尺寸会重置上下文，必须重取
  tc = t.getContext("2d");
  tc.font = FONT;
  tc.textBaseline = "top";
  tc.fillStyle = "#000";
  tc.fillText(txt, 2, 3);
  const d = tc.getImageData(0, 0, tw, th).data;
  const pts = [];
  let minX = tw, maxX = -1, minY = th, maxY = -1;
  for (let y = 0; y < th; y++) {
    for (let x = 0; x < tw; x++) {
      if (d[(y * tw + x) * 4 + 3] > 100) {
        pts.push(x, y);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;                   // 拿不到字形
  return { pts: pts, w: maxX - minX + 1, h: maxY - minY + 1, minX: minX, minY: minY };
}
function jyStamp(g, pl, x, y, col) {
  g.fillStyle = col;
  for (let i = 0; i < pl.pts.length; i += 2)
    g.fillRect(x + pl.pts[i] - pl.minX, y + pl.pts[i + 1] - pl.minY, 1, 1);
}

/* --- 5.19.6 屋面（行 [PADT, eaveY)）------------------------------------------
   照片是正射图、看不到顶面，所以这一块是**自设计**的：浅米色平顶 + 女儿墙 +
   两个设备箱。笔法照 30 段 §3.2（同一套明暗层次），只是换了色 —— 楼的女儿墙
   在照片里是浅黄白（与墙同色系），不是 30 段 `pal.roof` 的棕色。
   ⚠️ 覆盖范围含 30 段的**檐口外沿**那两笔（`x0-3 .. x1+3`）：不盖的话，浅色
      屋面的左右各会留下两条棕色竖边（出图像"屋顶镶了棕框"）。 */
function jyRoof(g, G) {
  const ex0 = G.x0 - 3, ex1 = G.x1 + 3;
  px(g, ex0, JY_PADT, ex1 - ex0, G.roofT, JY_C.R_EDGE);          // 檐口外沿
  px(g, G.x0, JY_PADT + 2, G.w, G.roofT - 5, JY_C.R_DECK);       // 板面
  px(g, G.x0, JY_PADT + 2, G.w, 4, JY_C.R_TOP);                  // 女儿墙顶受光
  px(g, G.x0, JY_PADT + 6, G.w, 3, "rgba(14,18,28,0.30)");       // 女儿墙内阴影
  px(g, G.x0, JY_PADT + 6, 4, G.roofT - 9, JY_C.R_LIT);          // 左内侧受光
  px(g, G.x1 - 4, JY_PADT + 6, 4, G.roofT - 9, JY_C.R_DIM);      // 右内侧背光
  px(g, ex0, JY_PADT + G.roofT - 1, ex1 - ex0, 2, JY_C.R_EAVE);  // 檐口投影线
  /* 设备箱：两个固定位置（**不掷 RNG** —— 本段不许碰共享流）。
     左边一个、中间偏左一个；右边那片留给玻璃塔（塔会自己盖上来的）。 */
  const dev = [[G.x0 + 56, JY_PADT + 30, 48, 20], [G.x0 + 236, JY_PADT + 46, 62, 24]];
  for (let i = 0; i < dev.length; i++) {
    const dx = dev[i][0], dy = dev[i][1], dw = dev[i][2], dh = dev[i][3];
    px(g, dx + 4, dy + 4, dw, dh, "rgba(14,18,28,0.30)");        // 投影
    px(g, dx, dy + dh - 4, dw, 4, JY_C.DEVD);                    // 侧墙
    px(g, dx, dy, dw, dh, JY_C.DEV);
    px(g, dx, dy, dw, 3, JY_C.R_TOP);
    px(g, dx, dy + dh - 1, dw, 1, "rgba(14,18,28,0.30)");
  }
  /* 斑点（30 段同款），局部 RNG ⇒ 不碰建筑序列 */
  const rng = makeRng(7019);
  speckle(g, G.x0 + 4, JY_PADT + 7, G.w - 8, G.roofT - 12, "rgba(255,255,255,0.06)", (G.w / 3) | 0, rng);
  speckle(g, G.x0 + 4, JY_PADT + 7, G.w - 8, G.roofT - 12, "rgba(0,0,0,0.06)", (G.w / 4) | 0, rng);
}

/* --- 5.19.7 墙面 + 五排窗 ----------------------------------------------------
   排窗自下而上 f = 0（首层落地大玻璃）… f = 4（顶层）。
   窗的绘制元素照照片：白框（外缘一圈受光）+ 洞口 + 上高光 + 中横棂 + 下部白百叶
   （照片里中层那三排窗的下半部有一条白色横栅，顶层没有）。 */
function jyFront(g, G) {
  const x0 = G.x0, x1 = G.x1, w = G.w, eaveY = G.eaveY, baseY = G.baseY;
  /* 墙底：整面浅黄（左棱受光、右棱背光，同 30 段同一套 SUN 方向） */
  px(g, x0, eaveY, w, G.wallH, JY_C.WALL);
  px(g, x0, eaveY, 3, G.wallH, JY_C.WALLT);                      // 左棱受光
  px(g, x1 - 4, eaveY, 4, G.wallH, JY_C.WALLD);                  // 右棱背光
  for (let i = 0; i < 10; i++)                                   // 檐下阴影带
    px(g, x0, eaveY + i, w, 1, "rgba(14,18,28," + (0.30 * (1 - i / 10)).toFixed(3) + ")");
  px(g, x0, eaveY + 1, w, 1, "#efe8bc");                         // 檐口线
  /* 层间腰线：每层分界一道（全校统一的 34 行网格） */
  for (let f = 1; f < JY_FLOORS; f++) {
    const y = eaveY + f * FLOOR_H;
    px(g, x0, y, w, 1, JY_C.WALLD);
    px(g, x0, y + 1, w, 1, "rgba(255,255,255,0.42)");
  }
  /* 窗阵：f = 1..4 是标准层；f = 0 是首层落地大玻璃（另画） */
  for (let f = 1; f < JY_FLOORS; f++) {
    const wy = G.winTop[f];
    for (let k = 0; k < JY_COLS; k++) jyWin(g, G.winX[k], wy, JY_WIN_W, JY_WIN_H, f);
  }
  /* 首层：贯通全宽的落地玻璃门厅（照片里底层是被柱子分段的一整条大玻璃） */
  jyLobby(g, G);
  /* 墙面雨水管（照片里那根从檐口直落到底的灰色竖管） */
  px(g, G.pipe, eaveY + 3, 3, baseY - eaveY - 3, JY_C.PIPE);
  px(g, G.pipe, eaveY + 3, 1, baseY - eaveY - 3, "#d2d6da");
  px(g, G.pipe + 2, eaveY + 3, 1, baseY - eaveY - 3, "#9aa0a8");
  px(g, G.pipe - 1, eaveY + Math.round(G.wallH * 0.5), 5, 2, "#9aa0a8");
  px(g, G.pipe - 1, baseY - 14, 5, 2, "#9aa0a8");
  /* 外轮廓（照 30 段 §3.8 的位置，换成这栋楼的浅黄色系） */
  px(g, x0 - 1, eaveY, 1, G.wallH + 1, "#d9d0a4");
  px(g, x1, eaveY, 1, G.wallH + 1, "#b8b08a");
}

/* --- 5.19.7a 一扇窗（白框 + 洞 + 高光 + 横棂 + 下百叶）---------------------- */
function jyWin(g, x, y, w, h, f) {
  const lv = (f === 2 || f === 3 || f === 4);      // 照片：上面三排有白百叶，顶层没有
  px(g, x - 1, y - 1, w + 2, h + 2, JY_C.FRAME);   // 白框外缘
  px(g, x, y, w, h, "#2c3746");                    // 洞口（深底，四边留一圈）
  px(g, x + 1, y + 1, w - 2, h - 2, JY_C.WIND);    // 玻璃
  px(g, x + 1, y + 1, w - 2, 5, JY_C.WIN);         // 玻璃上段
  px(g, x + 2, y + 2, w - 4, 3, JY_C.WINL);        // 上高光
  px(g, x + w - 3, y + 2, 2, h - 8, "rgba(10,13,20,0.30)");
  px(g, x + Math.round(w / 2), y + 1, 1, h - 2, JY_C.FRAME);   // 竖窗棂（照片里每扇一分为二）
  if (lv) {                                        // 窗下白百叶
    const by = y + h - Math.round(h * 0.34);
    px(g, x + 1, by, w - 2, y + h - by - 1, JY_C.LOUVER);
    for (let yy = by + 1; yy < y + h - 1; yy += 2) px(g, x + 1, yy, w - 2, 1, "#c9c7b4");
  }
  px(g, x - 2, y + h, w + 4, 2, JY_C.WALLT);       // 窗台受光
  px(g, x - 2, y + h + 2, w + 4, 1, "rgba(14,18,28,0.24)");    // 窗台投影
}

/* --- 5.19.7b 首层落地大玻璃门厅 ---------------------------------------------- */
function jyLobby(g, G) {
  const y0 = G.winTop[0], y1 = G.baseY - 1;
  const x0 = G.x0 + 6, x1 = G.x1 - 6;
  px(g, x0 - 2, y0 - 2, x1 - x0 + 4, y1 - y0 + 3, JY_C.FRAME);
  px(g, x0, y0, x1 - x0, y1 - y0 + 1, JY_C.WIND);
  px(g, x0, y0, x1 - x0, 6, JY_C.WIN);
  px(g, x0 + 2, y0 + 2, x1 - x0 - 4, 4, JY_C.WINL);
  /* 竖框：与窗阵同一组中轴，读作"门厅被柱后的一排竖框分格" */
  for (let k = 0; k < JY_COLS; k++) {
    const vx = G.winX[k] + Math.round(JY_WIN_W / 2);
    px(g, vx - 1, y0, 2, y1 - y0 + 1, JY_C.FRAME);
    px(g, vx + 1, y0, 1, y1 - y0 + 1, "rgba(10,13,20,0.22)");
  }
  px(g, x0, y1 - 5, x1 - x0, 6, JY_C.WALLD);       // 底部墙裙
  px(g, x0, y1 - 5, x1 - x0, 1, "rgba(255,255,255,0.30)");
}

/* --- 5.19.8 玻璃塔 + BJTUSA --------------------------------------------------
   塔画在**墙与窗之后、棚架之前**：照片里塔是凸出立面的体块（前景），而棚架又在
   塔前面。塔的左缘紧贴第 5 扇窗的右沿，这是照片上的实际关系（不刻意对齐）。 */
function jyTower(g, G) {
  const t = G.tower, x0 = t.x0, x1 = t.x1, y0 = t.top, y1 = G.baseY - 1;
  const w = x1 - x0 + 1;
  /* 塔体：深蓝灰幕墙 + 左受光 / 右背光 */
  px(g, x0, y0, w, y1 - y0 + 1, JY_C.TOWER);
  px(g, x0, y0, 3, y1 - y0 + 1, JY_C.TOWL);
  px(g, x1 - 2, y0, 3, y1 - y0 + 1, JY_C.TOWD);
  /* 竖向分格：每 16 行一道浅线（幕墙的竖梃） */
  for (let x = x0 + 16; x < x1 - 3; x += 16) px(g, x, y0 + 2, 1, y1 - y0 - 3, JY_C.TOWL);
  /* 层间横线：与全校 34 行层网格同线（读作"塔的楼板与主楼对齐"） */
  for (let f = 1; f < JY_FLOORS; f++) {
    const y = G.eaveY + f * FLOOR_H;
    if (y <= y0 || y >= y1) continue;
    px(g, x0, y, w, 2, JY_C.TOWD);
  }
  px(g, x0, y0, w, 2, "#5a646f");                  // 塔顶受光棱
  px(g, x0, y0, 2, y1 - y0 + 1, "#5a646f");
  px(g, x0 - 1, y0, 1, y1 - y0 + 1, "#232a32");    // 左轮廓
  px(g, x1 + 1, y0, 1, y1 - y0 + 1, "#232a32");    // 右轮廓
  /* BJTUSA：6 个字母竖排（照片上就贴在塔的右缘） */
  for (let i = 0; i < JY_TLET_TXT.length; i++) {
    const ch = JY_TLET_TXT.charAt(i);
    const rows = JY_LET[ch];
    if (!rows) continue;
    const ly = G.letter.y0 + i * G.letter.step;
    for (let r = 0; r < 7; r++) {
      const bits = rows[r];
      for (let c = 0; c < 5; c++)
        if (bits & (16 >> c))
          px(g, G.letter.x + c * G.letter.s, ly + r * G.letter.s, G.letter.s, G.letter.s, JY_C.LT);
    }
  }
}

/* --- 5.19.9 木棚架 + 树状柱 --------------------------------------------------
   自上而下三段：玻璃栏板（浅蓝）→ 木顶板（亮木色高面 + 暗面）→ 深木前缘。
   柱在棚架**之后**画（柱顶接板底、不重叠），每根柱自下而上由一条柱身张开成两撇
   —— 这就是照片上那套"树枝托顶板"的读法。 */
function jyCanopy(g, G) {
  const c = G.canopy, x0 = c.x0, x1 = c.x1, w = x1 - x0;
  /* ① 玻璃栏板（在顶板**北侧**，屏幕上更靠上） */
  px(g, x0, c.glaTop, w, c.deckTop - c.glaTop, JY_C.GLA);
  px(g, x0, c.glaTop, w, 2, JY_C.GLAL);
  px(g, x0, c.deckTop - 2, w, 2, JY_C.GLAD);
  for (let x = x0 + 8; x < x1 - 4; x += 26) px(g, x, c.glaTop + 2, 1, c.deckTop - c.glaTop - 3, JY_C.GLAL);
  /* ② 木顶板 */
  px(g, x0, c.deckTop, w, c.deckBot - c.deckTop, JY_C.WD);
  px(g, x0, c.deckTop + 1, w, 4, JY_C.WDL);                    // 顶板受光面
  px(g, x0, c.deckBot - 4, w, 4, JY_C.WDD);                    // 板下暗面
  px(g, x0, c.deckTop, 3, c.deckBot - c.deckTop, JY_C.WDL);    // 左端受光
  px(g, x1 - 3, c.deckTop, 3, c.deckBot - c.deckTop, JY_C.WDD);// 右端背光
  /* ③ 深木前缘（照片里板前那一条深色的收边） */
  px(g, x0, c.deckBot, w, c.edgeBot - c.deckBot + 1, JY_C.WEDGE);
  px(g, x0, c.deckBot, w, 1, "#a4764f");
  px(g, x0, c.edgeBot, w, 1, "#5d3c28");
  /* ④ 树状柱 */
  const yTop = c.edgeBot + 1, yBot = G.baseY, ySplay = yTop + Math.round((yBot - yTop) * 0.42);
  const hw = Math.round(G.colW / 2);
  for (let k = 0; k < G.colX.length; k++) {
    const cx = G.colX[k];
    if (cx - 10 < x0 || cx + 10 > x1) continue;                // 棚架之外不长柱
    /* 柱身（下段直的） */
    px(g, cx - hw, ySplay, G.colW, yBot - ySplay, JY_C.COL);
    px(g, cx - hw, ySplay, 2, yBot - ySplay, JY_C.COLL);
    px(g, cx + hw - 2, ySplay, 2, yBot - ySplay, JY_C.COLD);
    /* 张开的两撇（上段，越往上越开） */
    const n = ySplay - yTop;
    for (let i = 0; i < n; i++) {
      const y = ySplay - 1 - i;
      const t = i / (n || 1);
      const spread = hw + Math.round(t * (hw + 3));            // hw → 2hw+3
      px(g, cx - spread, y, 3, 1, JY_C.COLL);
      px(g, cx + spread - 2, y, 3, 1, JY_C.COLD);
      px(g, cx - spread + 3, y, spread - hw, 1, JY_C.COL);
      px(g, cx + hw, y, spread - hw, 1, JY_C.COL);
    }
    px(g, cx - 2, yTop, 5, 2, JY_C.WEDGE);                     // 柱顶与板底的接头
  }
}

/* --- 5.19.10 塔前台阶 + 招牌 -------------------------------------------------- */
function jyStair(g, G) {
  const s = G.stair, y1 = G.baseY;
  /* 照片里这是塔前一段斜向上的踏步。画成四级、逐级变窄的浅灰台阶 */
  const steps = 4, h = Math.round((y1 - s.top) / steps);
  for (let i = 0; i < steps; i++) {
    const y = y1 - (i + 1) * h;
    const inset = i * 3;
    px(g, s.x0 + inset, y, (s.x1 - s.x0) - inset * 2, h, i % 2 ? "#c9c6ba" : "#d6d3c6");
    px(g, s.x0 + inset, y, (s.x1 - s.x0) - inset * 2, 1, "#e6e3d6");
    px(g, s.x0 + inset, y + h - 1, (s.x1 - s.x0) - inset * 2, 1, "rgba(14,18,28,0.26)");
  }
}
function jySign(g, G) {
  const s = G.sign;
  const w = s.x1 - s.x0 + 1, h = s.bot - s.top + 1;
  px(g, s.x0 + 3, s.top + 3, w, h, "rgba(14,18,28,0.34)");       // 投影
  px(g, s.x0, s.top, w, h, JY_C.SIGN);
  px(g, s.x0, s.top, w, 1, JY_C.SIGNL);                          // 上棱受光
  px(g, s.x0, s.bot, w, 1, JY_C.SIGND);                          // 下棱背光
  px(g, s.x0, s.top, 1, h, JY_C.SIGNL);
  px(g, s.x1, s.top, 1, h, JY_C.SIGND);
  /* 金色中文（12px 二值化）+ 下面一行小字英文（那个尺度画成一条浅色虚线） */
  const pl = jyPlate(JY_NAME, 12);
  if (pl) {
    jyStamp(g, pl, s.x0 + Math.round((w - pl.w) / 2), s.top + 3, JY_C.GOLD);
  } else {
    console.warn("70_jianyi: 招牌的金字没拿到字形（jyPlate 返回 null）—— 只剩一块空板");
  }
  const eY = s.bot - 7;
  for (let x = s.x0 + 6; x < s.x1 - 4; x += 3) px(g, x, eY, 2, 1, "#bfae86");
  px(g, s.x0 + 4, s.bot - 9, w - 8, 1, "rgba(0,0,0,0.22)");
}

/* --- 5.19.11 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是精灵，
      晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/…/qjRestyle 同一规矩）。
   ⚠️ 本函数**不碰共享 RNG**（唯一的随机量是 §5.19.6 屋面斑点的局部 makeRng(7019)）。
   ⚠️ 它**不换画布、不动 b.ay**：覆盖的只有行 [PADT, baseY)（屋面 + 立面），
      台阶与投影全在 baseY 以下 —— 与 61/67/68 段那条"换画布 + 挪 b.ay"的路
      不是一回事，不要照抄那几段。世界落地线、碰撞盒、footprint 一个字节不动。
   ⚠️ 第三个实参照 65/67/68/69 段传 `pal`：本段用不上它（色全是照片实测的），
      实参留着只为与那一串调用签名对齐。本段不许再存一份 PALETTE（TDZ，58 段栽过）。 */
function jyRestyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const G = jyGeo(c);
  /* ① 覆盖整个立面（含 30 段那两条外轮廓，左右各多盖 1px）+ 整个屋面 */
  px(g, G.x0 - 1, G.eaveY, G.x1 - G.x0 + 2, G.baseY - G.eaveY, JY_C.WALL);
  jyRoof(g, G);
  /* ② 立面：墙 → 窗 → 首层门厅 → 雨水管，然后塔 → 棚架 → 柱 → 台阶 → 招牌 */
  jyFront(g, G);
  jyTower(g, G);
  jyCanopy(g, G);
  jyStair(g, G);
  jySign(g, G);
  /* ③ 接地阴影带（30 段 §3.8 那一笔，被 ② 的立面覆盖吃掉了，按同一支笔补回） */
  contactBand(g, G.x0 + 1, G.x1 - 1, G.baseY - 1, 2, 0.34);
  return b;
}

  R_EAVE:"#bcae8c",   // 檐口投影线
  DEV:   "#dad3bd",   // 屋面设备
  DEVD:  "#b8b09a",
  STEP:  "#efe4c4",   // 台阶踏面
  STEPL: "#fbf3da",   // 踏面受光边
  STEPD: "#c9ba94",   // 踏步竖面
  PAINT: ["#e8615c", "#f2c53d", "#79cf5b", "#4ecbf9"]  // 彩绘四色（红黄绿蓝）
};

/* --- 5.20.2 几何：一律现算，一处写死 ----------------------------------------
   ⚠️ `roofT` 是**反解**的（c.height 减去 30 段那四段固定高），不存第二份。 */
function tyGeo(c) {
  const wallH0 = TY_FLOORS * FLOOR_H;
  const roofT  = c.height - TY_PADT - wallH0 - TY_PADB;   // 反解（本楼 = 114）
  const eaveY  = TY_PADT + roofT;
  const w      = c.width - TY_PADX * 2;
  const sc     = w / TY_PW;
  const sv     = wallH0 / TY_RISE;
  const baseY  = eaveY + wallH0;
  const x0     = TY_PADX, x1 = TY_PADX + w;
  /* 照片 x → 画布 x（两端各取整再相减：相邻两块才不会差 1px 露缝） */
  const X = (v) => TY_PADX + Math.round((v - TY_PX0) * sc);
  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, baseY: baseY,
    x0: x0, x1: x1, w: w, sc: sc, sv: sv, X: X, H: c.height
  };
  /* 纵向分带端点（自设计，见文件头 §二） */
  G.yE0  = eaveY;                          // 幕墙顶檐带 顶
  G.yE1  = eaveY + TY_B_EAVE;              // 幕墙 顶
  G.yC1  = G.yE1 + TY_B_CURT;              // 幕墙 底 / 平台 顶
  G.yP1  = G.yC1 + TY_B_PLAT;              // 平台 底 / 雨棚 顶
  G.yN1  = G.yP1 + TY_B_CAN;               // 雨棚 底 / 门区 顶
  /* 横向四条 */
  G.curt = { x0: X(TY_CURT[0]),  x1: X(TY_CURT[1])  };
  G.wnl  = { x0: X(TY_WNL[0]),   x1: X(TY_WNL[1])   };
  G.wnr  = { x0: X(TY_WNR[0]),   x1: X(TY_WNR[1])   };
  G.gold = { x0: X(TY_GOLDS[0]), x1: X(TY_GOLDS[1]) };
  /* 台阶（画在 baseY 以下的 22 行里） */
  G.stair = { x0: x0, x1: x1, y0: baseY, y1: baseY + 22, n: 7 };
  /* 彩绘（台阶下 8 行） */
  G.paint = { x0: X(TY_PAINT[0]), x1: X(TY_PAINT[1]),
              y0: baseY + 22, y1: baseY + 30 };

  /* --- 闸们：这一组数一错，出图是一栋比例崩掉的楼，而五套自动验收全不看画面 --- */
  if (roofT < 20 || roofT > 190)
    console.warn("70b_tyht: 反解出的 roofT=%d 出了 30 段的 clamp 区间[20,190] —— " +
                 "画布高 %d 与 PADT/wallH/SHY 公式对不上了", roofT, c.height);
  if (G.yE1 >= G.yC1 || G.yC1 >= G.yP1 || G.yP1 >= G.yN1 || G.yN1 >= baseY)
    console.warn("70b_tyht: 立面五段的行序乱了 [%d,%d,%d,%d,%d] —— " +
                 "TY_B_* 四个分带数配不上 wallH(%d)", G.yE0, G.yE1, G.yC1, G.yP1, G.yN1, wallH0);
  if (TY_B_EAVE + TY_B_CURT + TY_B_PLAT + TY_B_CAN >= wallH0)
    console.warn("70b_tyht: 四个分带(%d)已经吃光墙高(%d)，首层门区没地方了",
                 TY_B_EAVE + TY_B_CURT + TY_B_PLAT + TY_B_CAN, wallH0);
  if (G.curt.x0 <= x0 || G.curt.x1 >= x1)
    console.warn("70b_tyht: 幕墙 x[%d,%d] 越出立面 [%d,%d]", G.curt.x0, G.curt.x1, x0, x1);
  if (G.wnl.x1 >= G.curt.x0 || G.wnr.x0 <= G.curt.x1)
    console.warn("70b_tyht: 左右窄窗带与中央幕墙重叠了 [%d,%d] / [%d,%d] / [%d,%d]",
                 G.wnl.x0, G.wnl.x1, G.curt.x0, G.curt.x1, G.wnr.x0, G.wnr.x1);
  if (G.gold.x0 <= G.curt.x1 || G.gold.x1 >= G.wnr.x0)
    console.warn("70b_tyht: 金字列 x[%d,%d] 没夹在幕墙(%d)与右窄窗带(%d)之间 —— " +
                 "要么压幕墙、要么压窗带", G.gold.x0, G.gold.x1, G.curt.x1, G.wnr.x0);
  return G;
}

/* --- 5.20.3 右墙竖排金字：系统字体 → 二值化（照 30 段 §3.0 makeSign 那一套）---
   与 30 段那份的区别：**单字**、字号可传。竖排由调用方按字逐个贴。 */
function tyGlyph(ch, fs) {
  const t = mkCanvas(8, 8);
  let tc = t.getContext("2d");
  const FONT = "bold " + fs + "px 'Microsoft YaHei','SimHei','PingFang SC',sans-serif";
  tc.font = FONT;
  const tw = Math.ceil(tc.measureText(ch).width) + 6, th = fs + 10;
  t.width = tw; t.height = th;                 // ⚠️ 改尺寸会重置上下文，必须重取
  tc = t.getContext("2d");
  tc.font = FONT;
  tc.textBaseline = "top";
  tc.fillStyle = "#000";
  tc.fillText(ch, 3, 4);
  const d = tc.getImageData(0, 0, tw, th).data;
  const pts = [];
  let minX = tw, maxX = -1, minY = th, maxY = -1;
  for (let y = 0; y < th; y++) {
    for (let x = 0; x < tw; x++) {
      if (d[(y * tw + x) * 4 + 3] > 100) {
        pts.push(x, y);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;                   // 拿不到字形
  return { pts: pts, w: maxX - minX + 1, h: maxY - minY + 1, minX: minX, minY: minY };
}
function tyStamp(g, pl, x, y, col) {
  g.fillStyle = col;
  for (let i = 0; i < pl.pts.length; i += 2)
    g.fillRect(x + pl.pts[i] - pl.minX, y + pl.pts[i + 1] - pl.minY, 1, 1);
}

/* --- 5.20.4 屋面（行 [PADT, eaveY)）------------------------------------------
   照片是正射图、看不到顶面 ⇒ 这一块是**自设计**的：浅米色平顶 + 女儿墙 + 两个
   设备箱（笔法照 30 段 §3.2，只是换成这栋楼的米色系）。
   ⚠️ 覆盖范围含 30 段的檐口外沿那两笔（x0−3 .. x1+3）：不盖的话左右各会留下
      两条棕色竖边（出图像"屋顶镶了棕框"）。 */
function tyRoof(g, G) {
  const ex0 = G.x0 - 3, ex1 = G.x1 + 3;
  px(g, ex0, TY_PADT, ex1 - ex0, G.roofT, TY_C.R_EDGE);          // 檐口外沿
  px(g, G.x0, TY_PADT + 2, G.w, G.roofT - 5, TY_C.R_DECK);       // 板面
  px(g, G.x0, TY_PADT + 2, G.w, 4, TY_C.R_TOP);                  // 女儿墙顶受光
  px(g, G.x0, TY_PADT + 6, G.w, 3, TY_C.SHAD);                   // 女儿墙内阴影
  px(g, G.x0, TY_PADT + 6, 4, G.roofT - 9, TY_C.R_LIT);          // 左内侧受光
  px(g, G.x1 - 4, TY_PADT + 6, 4, G.roofT - 9, TY_C.R_DIM);      // 右内侧背光
  px(g, ex0, TY_PADT + G.roofT - 1, ex1 - ex0, 2, TY_C.R_EAVE);  // 檐口投影线
  /* 设备箱：两个固定位置（不掷 RNG —— 本段不许碰共享流） */
  const dev = [[G.x0 + 92, TY_PADT + 28, 46, 18], [G.x0 + 300, TY_PADT + 44, 56, 22]];
  for (let i = 0; i < dev.length; i++) {
    const dx = dev[i][0], dy = dev[i][1], dw = dev[i][2], dh = dev[i][3];
    px(g, dx + 4, dy + 4, dw, dh, TY_C.SHAD);                    // 投影
    px(g, dx, dy + dh - 4, dw, 4, TY_C.DEVD);                    // 侧墙
    px(g, dx, dy, dw, dh, TY_C.DEV);
    px(g, dx, dy, dw, 3, TY_C.R_TOP);
    px(g, dx, dy + dh - 1, dw, 1, TY_C.SHAD);
  }
  /* 斑点（30 段同款），局部 RNG ⇒ 不碰建筑序列 */
  const rng = makeRng(7020);
  speckle(g, G.x0 + 4, TY_PADT + 7, G.w - 8, G.roofT - 12, "rgba(255,255,255,0.06)", (G.w / 3) | 0, rng);
  speckle(g, G.x0 + 4, TY_PADT + 7, G.w - 8, G.roofT - 12, "rgba(0,0,0,0.06)", (G.w / 4) | 0, rng);
}

/* --- 5.20.5 一条通高窄窗带（左右各一条）------------------------------------- */
function tyStrip(g, sx0, sx1, y0, y1) {
  const w = sx1 - sx0 + 1;
  px(g, sx0 - 1, y0, w + 2, y1 - y0, TY_C.MULLD);              // 外框（米白宽边）
  px(g, sx0, y0 + 1, w, y1 - y0 - 2, TY_C.CURT);
  px(g, sx0, y0 + 1, 2, y1 - y0 - 2, TY_C.CURTL);              // 左棱受光
  px(g, sx1 - 1, y0 + 1, 2, y1 - y0 - 2, TY_C.CURTD);          // 右棱背光
  px(g, sx0, y0 + 1, w, 5, TY_C.CURTL);                        // 顶部映天
  /* 横分格：每 12 行一道（读作"这几扇窗上下叠着"） */
  for (let y = y0 + 12; y < y1 - 3; y += 12)
    px(g, sx0, y, w, 1, TY_C.MULLD);
  px(g, sx0 - 1, y0, 1, y1 - y0, "#dcd6c4");                   // 左轮廓
  px(g, sx1 + 1, y0, 1, y1 - y0, "#b9b3a0");                   // 右轮廓
}

/* --- 5.20.6 中央玻璃幕墙（含顶檐板）------------------------------------------- */
function tyCurtain(g, G) {
  const c = G.curt, x0 = c.x0, x1 = c.x1, w = x1 - x0 + 1;
  /* ① 顶檐白板（照片里幕墙顶上那条出檐，两端各有一个支点块） */
  px(g, x0 - 4, G.yE0, w + 8, TY_B_EAVE - 1, TY_C.EAVE);
  px(g, x0 - 4, G.yE0, w + 8, 2, TY_C.EAVL);                   // 板顶受光
  px(g, x0 - 4, G.yE0 + TY_B_EAVE - 1, w + 8, 1, TY_C.EAVD);   // 板下背光
  px(g, x0 - 4, G.yE0, 1, TY_B_EAVE - 1, TY_C.EAVL);
  px(g, x1 + 3, G.yE0, 1, TY_B_EAVE - 1, TY_C.EAVD);
  /* ② 幕墙玻璃（上段映天浅、下段深蓝） */
  const y0 = G.yE1, y1 = G.yC1;
  px(g, x0, y0, w, y1 - y0, TY_C.CURT);
  px(g, x0, y0, w, Math.round((y1 - y0) * 0.34), TY_C.CURTL);  // 上部映天
  px(g, x0, y1 - 5, w, 5, TY_C.CURTD);                         // 底部压深
  /* ③ 竖梃：每 12 列一道米白竖条（照片里蓝玻璃与米白框交替） */
  for (let x = x0 + 11; x < x1 - 2; x += 12) {
    px(g, x, y0, 3, y1 - y0, TY_C.MULL);
    px(g, x + 3, y0, 1, y1 - y0, TY_C.MULLD);
  }
  px(g, x0, y0, 3, y1 - y0, TY_C.MULL);                        // 左端框
  px(g, x1 - 2, y0, 3, y1 - y0, TY_C.MULLD);                   // 右端框
  /* ④ 中段一道横梁（照片幕墙腰间那条浅线） */
  const ymid = y0 + Math.round((y1 - y0) * 0.52);
  px(g, x0, ymid, w, 1, TY_C.MULL);
  px(g, x0 - 3, y0, 1, y1 - y0, "#c9c2ae");                    // 左轮廓
  px(g, x1 + 2, y0, 1, y1 - y0, "#a9a292");                    // 右轮廓
}

/* --- 5.20.7 白平台 + 栏杆 ----------------------------------------------------- */
function tyPlatform(g, G) {
  const c = G.curt, x0 = c.x0 - 6, x1 = c.x1 + 6, w = x1 - x0 + 1;
  const y0 = G.yC1, y1 = G.yP1;
  px(g, x0, y0, w, y1 - y0, TY_C.PLAT);                        // 平台板
  px(g, x0, y0, w, 2, TY_C.EAVL);                              // 板顶受光
  px(g, x0, y1 - 1, w, 1, TY_C.PLATD);                         // 板底背光
  px(g, x0 + 2, y0 - 2, w - 4, 2, TY_C.RAIL);                  // 栏杆（在平台之上一条）
  for (let x = x0 + 4; x < x1 - 2; x += 8) px(g, x, y0 - 2, 1, 3, TY_C.PLATD);
}

/* --- 5.20.8 灰色悬挑雨棚 + 筒灯 ----------------------------------------------- */
function tyCanopy(g, G) {
  const c = G.curt, x0 = c.x0 - 10, x1 = c.x1 + 10, w = x1 - x0 + 1;
  const y0 = G.yP1, y1 = G.yN1;
  px(g, x0, y0, w, 3, TY_C.CANL);                              // 棚顶受光
  px(g, x0, y0 + 3, w, y1 - y0 - 4, TY_C.CAN);                 // 板面
  px(g, x0, y1 - 1, w, 1, TY_C.CAND);                          // 板下沿背光
  px(g, x0, y0 + 3, 2, y1 - y0 - 4, TY_C.CANL);                // 左端受光
  px(g, x1 - 2, y0 + 3, 2, y1 - y0 - 4, TY_C.CAND);            // 右端背光
  /* 檐底一排筒灯（照片里那排小白点） */
  for (let x = x0 + 10; x < x1 - 6; x += 22)
    px(g, x, y1 - 2, 3, 2, TY_C.LAMP);
}

/* --- 5.20.9 首层三组大门 ------------------------------------------------------ */
function tyDoors(g, G) {
  const c = G.curt, y0 = G.yN1, y1 = G.baseY - 1;
  const gw = c.x1 - c.x0 + 1;
  px(g, c.x0, y0, gw, y1 - y0 + 1, TY_C.DFRA);                 // 门厅底色（灰框）
  /* 三组门：等宽三分，每组内部再分 4 扇 */
  const ng = 3, gap = 6;
  const seg = Math.floor((gw - gap * (ng + 1)) / ng);
  for (let gi = 0; gi < ng; gi++) {
    const gx0 = c.x0 + gap + gi * (seg + gap), gx1 = gx0 + seg - 1;
    /* 每组门扇 */
    px(g, gx0, y0 + 2, seg, y1 - y0 - 1, TY_C.DOOR);
    px(g, gx0, y0 + 2, seg, Math.round((y1 - y0) * 0.30), TY_C.DOORL);  // 上方映天
    px(g, gx0, y1 - 4, seg, 5, TY_C.DOORD);                             // 下部深
    /* 组内竖框：4 扇 */
    const ns = 4, sw = Math.floor(seg / ns);
    for (let si = 1; si < ns; si++)
      px(g, gx0 + si * sw, y0 + 2, 1, y1 - y0 - 1, TY_C.DFRL);
    px(g, gx0 - 1, y0 + 2, 1, y1 - y0 - 1, TY_C.DFRL);                  // 组左框
    px(g, gx1 + 1, y0 + 2, 1, y1 - y0 - 1, "#9aa0a8");                  // 组右框
    px(g, gx0 + Math.round(seg / 2) - 1, y0 + Math.round((y1 - y0) * 0.55), 3, 5, "#dfe3e7"); // 门把手
  }
  px(g, c.x0, y0, gw, 2, TY_C.DFRL);                           // 门厅上沿
  px(g, c.x0 - 1, y0, 1, y1 - y0 + 1, "#9aa0a8");              // 左轮廓
  px(g, c.x1 + 1, y0, 1, y1 - y0 + 1, "#8f959d");              // 右轮廓
}

/* --- 5.20.10 立面总装 -------------------------------------------------------- */
function tyFront(g, G) {
  const x0 = G.x0, x1 = G.x1, w = G.w, eaveY = G.eaveY, baseY = G.baseY;
  /* ① 整面米黄石材墙 */
  px(g, x0, eaveY, w, G.wallH, TY_C.WALL);
  px(g, x0, eaveY, 3, G.wallH, TY_C.WALLT);                    // 左棱受光
  px(g, x1 - 4, eaveY, 4, G.wallH, TY_C.WALLD);                // 右棱背光
  px(g, x0, eaveY, w, 1, TY_C.STONE);                          // 墙顶线
  for (let i = 0; i < 10; i++)                                 // 檐下阴影带
    px(g, x0, eaveY + 1 + i, w, 1, "rgba(14,18,28," + (0.26 * (1 - i / 10)).toFixed(3) + ")");
  /* 石材横缝（每 9 行一条浅线，照片里是水刷石的细横纹） */
  for (let y = eaveY + 9; y < baseY - 2; y += 9) px(g, x0, y, w, 1, TY_C.STONE);
  /* ② 左右通高窄窗带 */
  tyStrip(g, G.wnl.x0, G.wnl.x1, eaveY + 2, baseY - 1);
  tyStrip(g, G.wnr.x0, G.wnr.x1, eaveY + 2, baseY - 1);
  /* ③ 中央：幕墙 → 平台 → 雨棚 → 门 */
  tyCurtain(g, G);
  tyPlatform(g, G);
  tyCanopy(g, G);
  tyDoors(g, G);
  /* ④ 外轮廓（照 30 段 §3.8 的位置，换成米黄系） */
  px(g, x0 - 1, eaveY, 1, G.wallH + 1, "#cbbd98");
  px(g, x1, eaveY, 1, G.wallH + 1, "#a89b78");
}

/* --- 5.20.11 右墙竖排金字「天佑会堂」-----------------------------------------
   竖跨 [yE1, baseY)：4 字 × 15 行。⚠️ 这是**自设计的字号**（照片上每字只 7 行，
   二值化出来是一团墨）—— 见文件头 §二 最后一段。 */
function tyGold(g, G) {
  const fs = 14, step = 15;
  const gw = G.gold.x1 - G.gold.x0 + 1;
  let y = G.yE1 + 2;
  for (let i = 0; i < TY_NAME.length; i++) {
    const pl = tyGlyph(TY_NAME.charAt(i), fs);
    if (pl) {
      const gx = G.gold.x0 + Math.round((gw - pl.w) / 2);
      /* 先扫一圈暗描边（让金字在米黄墙上立得住），再补金 */
      for (let d = 0; d < pl.pts.length; d += 2)
        px(g, gx + pl.pts[d] - pl.minX - 1, y + pl.pts[d + 1] - pl.minY + 1, 1, 1, TY_C.GOLDD);
      tyStamp(g, pl, gx, y, TY_C.GOLD);
    }
    y += step;
  }
  if (y - step > G.baseY) console.warn("70b_tyht: 竖排金字溢出立面底（末字底 %d > %d）", y - step, G.baseY);
}

/* --- 5.20.12 大台阶 + 彩色地面涂装 -------------------------------------------
   ⚠️ 这一段画在 **baseY 以下**（30 段原本画小台阶的那 35 行）—— 是本段与
      70_jianyi「只覆盖 [PADT, baseY)」的唯一分歧点，起因是用户点名要台阶与彩绘。
      不改任何世界坐标：台阶底就是精灵底，仍在 footprint 之内。 */
function tyStair(g, G) {
  const s = G.stair, w = s.x1 - s.x0 + 1;
  const bn = s.y1 - s.y0;                                      // 22 行
  const n = s.n, sh = Math.floor(bn / n);                      // 每级台阶行数
  px(g, s.x0, s.y0, w, bn, TY_C.STEPD);                        // 台阶侧壁底色
  for (let i = 0; i < n; i++) {
    const y = s.y0 + i * sh;
    px(g, s.x0, y, w, sh - 1, i % 2 ? TY_C.STEP : TY_C.STEPL); // 踏面
    px(g, s.x0, y, w, 1, TY_C.STEPL);                          // 踏面前缘受光
    px(g, s.x0, y + sh - 1, w, 1, "rgba(14,18,28,0.22)");      // 踏步投影
  }
  /* 台阶两端各一段扶手（照片里那对不锈钢斜杆）—— 画成两条浅灰斜线 */
  for (let i = 0; i < n; i++) {
    const y = s.y0 + i * sh;

    px(g, G.wnr.x1, y, 1, sh, "#c6cacf");                      // 右扶手
  }
  /* 彩色地面涂装（台阶下 8 行，红黄绿蓝分块） */
  const p = G.paint, pw = p.x1 - p.x0 + 1, np = TY_C.PAINT.length;
  const segw = Math.floor(pw / np);
  for (let i = 0; i < np; i++) {
    const xa = p.x0 + i * segw, xb = (i === np - 1) ? p.x1 : xa + segw - 1;
    px(g, xa, p.y0, xb - xa + 1, p.y1 - p.y0, TY_C.PAINT[i]);
  }
  px(g, p.x0, p.y1 - 1, pw, 1, "rgba(14,18,28,0.26)");         // 彩绘下缘压深

  const c = b.canvas, g = c.getContext("2d");

  tyRoof(g, G);
  /* ② 立面：墙 → 窄窗带 → 幕墙 → 平台 → 雨棚 → 门 → 轮廓 */

  tyGold(g, G);
  /* ③ 大台阶 + 彩绘（30 段的小台阶与投影就在这片区域，整块重画） */

     <1× 不补偿 —— 世界速度恒定，缩小时走得慢是符合直觉的。 */

  const sx = Math.max(0, x0), sy = Math.max(0, y0);

/* ⚠️ 传的是 groundCanvas 的 **2d context**，不是 canvas 本身 ——

const leafTrees = paintLeafFall(groundCanvas.getContext("2d"), props, makeRng(80808));

(function buildMips() {
  mips.push(groundCanvas);
  for (let L = 1; L <= 3; L++) {
    const p = mips[L - 1];
    const m = mkCanvas(Math.ceil(WORLD_W / (1 << L)), Math.ceil(WORLD_H / (1 << L)));
    const g = m.getContext("2d");
    g.imageSmoothingEnabled = true;           // 降采样必须开平滑，否则会整行整列地丢
    g.imageSmoothingQuality = "high";
    g.drawImage(p, 0, 0, p.width, p.height, 0, 0, m.width, m.height);
    mips.push(m);
  }
})();

/* --- 6.8 出生点：南门（G2）门内，沿轴向校园里推进到第一个可走点 ---
   ⚠️ 必须同时要求"界内 + 离墙 > 60"：门洞放行后 canWalk 在 d=0（门中心线上）
   就是真，光判 canWalk 会把人直接生成在边界线上、半个身子在墙外。 */
const SPAWN = (() => {
  const G = GATES.find(g => g.id === "G2") || GATES[0];
  for (let d = 60; d <= 480; d += 4) {
    const y = G.y - d;
    if (canWalk(G.x, y) && !ptBlocked(G.x, y) && insideBoundary(G.x, y) && distToBound(G.x, y) > 60)
      return { x: G.x, y: y };
  }
  return { x: G.x, y: G.y - 200 };
})();

  if (!_hudEl) return;
  let best = null, bd = 1e9;
  for (const L of _landmarks) {

    if (d < bd) { bd = d; best = L; }

  for (const e of CAMPUS) {

    const R = zoneRect(e);

                 ax: G.x + (G.dir === "h" ? inX : 0),
