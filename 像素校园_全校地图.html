}
const _rowUsed = [];
function plantRows() {
  const OFF = [[0, 0], [0, -7], [0, 7], [-7, 0], [7, 0], [-7, -7], [7, 7],
               [-7, 7], [7, -7], [0, -14], [0, 14], [-14, 0], [14, 0]];
  let n = 0;
  for (let py = ROW_SP >> 1; py < WORLD_H; py += ROW_SP) {
    for (let px = ROW_SP >> 1; px < WORLD_W; px += ROW_SP) {
      for (const o of OFF) {
        const x = px + o[0], y = py + o[1];
        if (!treeSpotOK(x, y)) continue;
        let near = false;
        for (const u of _rowUsed)
          if (Math.abs(u[0] - x) < 70 && Math.abs(u[1] - y) < 70) { near = true; break; }
        if (near) continue;
        addProp(Object.assign({}, makeStreetTree((n * 761 + 97) | 0, x, y), { x: x, y: y }));
        _rowUsed.push([x, y]);
        n++;
        break;
      }
    }
  }
  return n;
}

/* --- 4.7.6b 思源楼前大草坪：边界一圈树，中间只留草（用户 2026-09-13 追加）---
   口述：「对于思源楼门口的草坪，我需要草坪外围都围上树，也就是草坪的边界都是树，
   中间只有草地」。
   做法：沿草坪矩形的四条边按 LAWN_SP 排一圈行道树（带树坑），再由 §4.7.6c 把草坪里
   其余道具清掉。
   ⚠️ 四个非显然点：
     ① **调用点在 §6.6 里的位置**：必须排在 plantRows() **之后**、四个 clear* **之后**、
        鸭子下水**之前**（三条理由写在 60_assemble.js 的挂点上，实测数据也在那里）。
     ② **判据要求 K.GRASS** —— 这一条顺带把两个凹口（升旗台 §5.2 / 雕塑 §5.3，格子都是
        K.BLD）自动跳过了，不用另写"避开凹口"。
     ③ 树基取**草坪边线往里 LAWN_INSET**：树冠（最宽 86）因此有约 35px 探到草坪外的
        路上 —— 真实校园里草坪边那圈树就是这样半悬在路缘上的。
     ④ 间距 LAWN_SP 取得比行道树（118）密得多 —— 用户要的是"边界**都是**树"，
        不是"边界有树"。62 那版实测只有 13 棵 / 周长约 1422px（平均 110px 一棵），
        画面上是一圈稀稀拉拉的树；50 才连成一道树墙。
        ⚠️ 间距必须 > 46（`_lawnUsed` 的去重半径），否则相邻两棵互判"太近"，
           一圈又只剩下零星几棵 —— 这是把 62 调小之前唯一要看的数。
   ⚠️ 草坪矩形取 CAMPUS 里**与思源楼同 x** 的那条 grass（4.6056 / 4.0208 / 1.1528 /
      0.7799）：全校园 5 块草坪只有它和思源楼共用 x，也就是"楼正前方那一整块"。
      实测这条矩形（x1798.9..2249.2 / y1570.5..1875.1）与栅格化后的草地差 ≤13px，
      四条边都正好落在草格里，靠 ② 的 K.GRASS 判据兜底。 */
const LAWN_INSET = 16;                                 // 树基距草坪边线（世界像素）
const LAWN_SP    = 50;                                 // 沿线间距 ≈ 5.6 m（> _lawnUsed 的 46）
const LAWN = (() => {
  const sy = CAMPUS.find(c => c[1] === "siyuan");
  const e  = CAMPUS.find(c => c[1] === "grass" && Math.abs(c[2] - sy[2]) < 1e-6);
  return { x: IX(e[2]), y: IX(e[3]), w: IX(e[4]), h: IX(e[5]) };
})();
/* 草坪"整治区" = 草坪矩形 + 四周 LAWN_BAND 的一条带（§4.7.6c 用它清场）。
   ⚠️ 为什么是**外扩的带**而不只是草坪本身：贴草坪边线外侧 4~30px 站着的散射树 /
   路灯，根**不在**草坪上，可它们的树冠盒正好压住边界树的坑 —— 实测北边两棵、东边
   两棵就是这么把树圈顶出缺口的。这些"冒充边界树"的东西必须一起清掉（用户原话：
   「树的根部要求在草坪上，不能跑其他地方去」），否则树圈永远围不满。 */
const LAWN_BAND = 40;
const LAWN_ZONE = { x: LAWN.x - LAWN_BAND, y: LAWN.y - LAWN_BAND,
                    w: LAWN.w + LAWN_BAND * 2, h: LAWN.h + LAWN_BAND * 2 };
const _lawnUsed = [];
function lawnSpotOK(x, y) {
  if (!insideBoundary(x, y) || distToBound(x, y) < 30) return false;
  if (ptBlocked(x, y, 16, 11)) return false;
  if (cellAtSafe(x, y) !== K.GRASS) return false;
  for (const u of _lawnUsed)
    if (Math.abs(u[0] - x) < 46 && Math.abs(u[1] - y) < 46) return false;
  return treeFreeOfProps(x, y, "lawnTree", LAWN_ZONE);
}
function lawnTree(n, x, y) {
  /* tag 用 "lawnTree"：§4.7.6c 的清理**只放行**这个 tag，用它把"边界树"与草坪里
     散落的树区分开（两者都是 tag "tree" 的话，边界树会被自己的清理删掉）。 */
  addProp(Object.assign({}, makeStreetTree((n * 419 + 23) | 0, x, y),
                        { x: x, y: y, tag: "lawnTree" }));
  _lawnUsed.push([x, y]);
}
function plantLawnRing() {
  const L = LAWN, i = LAWN_INSET, s = LAWN_SP;
  const x0 = L.x + i, x1 = L.x + L.w - i, y0 = L.y + i, y1 = L.y + L.h - i;
  const OFF = [[0, 0], [0, -6], [0, 6], [-6, 0], [6, 0], [0, -12], [0, 12], [-12, 0],
               [12, 0], [-12, -12], [12, 12], [-12, 12], [12, -12]];
  let n = 0;
  /* 每个位置试一圈小偏移取第一个合法点 —— 与 plantRows 同一套做法：绝大多数落在
     (0,0) 上，于是线是直的；个别被占的点也能就近挪开，而不是整棵消失（留个洞）。 */
  const put = (bx, by) => {
    for (const o of OFF)
      if (lawnSpotOK(bx + o[0], by + o[1])) { lawnTree(n, bx + o[0], by + o[1]); n++; return; }
  };
  /* ⚠️ 两个轴向都按**等分**取点，不是 `for (x = x0; x <= x1; x += s)`：
     后者步长固定，最后一格落在哪里看运气 —— 实测草坪东西向 418.3px / 步长 50
     走到 2214.9 就没了，**东侧两个角（x1 = 2233.2）永远轮不到**，东北 / 东南角
     于是秃着（`_lawnUsed` 的去重半径 46 也不允许在末尾硬补一棵）。
     等分之后首尾都恰好压在 x0 / x1 上，间距 52.3 / 54.5 也都 > 46。 */
  const nx = Math.max(1, Math.round((x1 - x0) / s));
  const ny = Math.max(1, Math.round((y1 - y0) / s));
  for (let i = 0; i <= nx; i++) {                       // 北 / 南两边（含四个角）
    const x = x0 + (x1 - x0) * i / nx;
    put(x, y0); put(x, y1);
  }
  for (let j = 1; j < ny; j++) {                        // 西 / 东两边（角已由上一行负责）
    const y = y0 + (y1 - y0) * j / ny;
    put(x0, y); put(x1, y);
  }
  return n;
}

/* --- 4.7.6c 草坪整治区清场（用户 2026-09-13）---
   清两件事：① 草坪**内部**散落的小道具（灯 / 桶 / 椅 / 花坛 / 蒲公英……）——
   用户要「中间只有草地」；② 草坪**边线外 LAWN_BAND 以内**、根不在草坪上的东西
   —— 用户要「树的根部要求在草坪上，不能跑其他地方去」，且它们会把树圈的坑顶掉
   （见 LAWN_ZONE 的注释）。
   ⚠️ 四条：
     ① 与 §5.2.8 / §5.3.10 同款：必须排在 §6.6c 的 clearPropTreeClash() **之后**，
        先跑会改变它保留 / 丢弃的集合，clashDropped 的计数跟着变。
     ② 判据用**接地点**（p.x, p.y），**不用美术盒**：树冠探到草坪上空正是"边界树"该有的
        样子，按盒判会把草坪外那一圈树也一起删掉（与 §5.2.8 的净空框是两种相反的需求
        —— 那里要防树冠盖住主体，这里只看"根扎在哪"）。
     ③ 必须在 plantLawnRing() **之前**：清完场树圈才围得满（`60_assemble.js` 有断言）。
     ④ 白名单放行边界树 + 草坪上本来就该有的主体（升旗台 §5.2 / 雕塑 §5.3 与后围石）
        + 楼（宽 > 90）。树的最宽是 86，所以树一律进不了白名单 —— 正是要清的对象。 */
function clearLawnZone() {
  const Z = LAWN_ZONE, x1 = Z.x + Z.w, y1 = Z.y + Z.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    if (p.tag === "lawnTree" || p.tag === "flag" || p.tag === "diaosu" ||
        p.tag === "diaRing" || p.img.width > 90) { keep.push(p); continue; }
    if (p.x > Z.x && p.x < x1 && p.y > Z.y && p.y < y1) { dropped++; continue; }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* =========================================================
   2.8 地面 / 路面细节（第 3 项）
   ---------------------------------------------------------
   地面管线（§2.7）原本已经有：草地噪声、沥青、人行道砖缝、广场石板、
   路缘石、标线、泥土过渡带。这一节只补**原本没有的四样**：

     · brickTone + paintRoadCell(cls=1)  逐砖色差（原来只有整体噪声，
       1× 下人行道是一片平色，读不出"砖"）
     · paintManholes                      井盖
     · paintWear                          斑马线磨损 + 车辙压痕
     · paintLeafFall                      树下落花 / 落叶

   ⚠️ 前三个走 buildGround 流水线（在 §2.7.6 标线之后、泥土带之前）。
   ⚠️ paintLeafFall **不在流水线里** —— 要等 props 排好才知道树在哪，
      由 60_assemble §6.6d 在 buildMips() **之前**调用（mip 是从地面画布降采样
      出来的，晚于 mip 就再也进不去 mip 了）。
   ⚠️ 一律不碰 solids / props 的坐标，只往地面画布上加像素。
   ========================================================= */

/* --- 2.8.0 "这里真的是沥青吗" -----------------------------------------
   ⚠️ 别用 CELLK 判：`classifyFree` 把 ARTERY 矩形**整块**标成 K.ROAD，
   连压着广场的那一段也标了；而广场是第 3 步画的、比路面亮得多。
   直接读**已烘焙好的画布**取样最可靠：沥青 = 暗且近中性灰
   （ramp #4b4b53…#606068；广场石板 #b3ada0 的 R≈168 会被挡住）。
   取 5×5 均值，避开 speckle 的 1px 白点。 */
function asphaltAt(g, x, y) {
  const px0 = Math.min(Math.max(0, (x | 0) - 2), WORLD_W - 5);
  const py0 = Math.min(Math.max(0, (y | 0) - 2), WORLD_H - 5);
  const d = g.getImageData(px0, py0, 5, 5).data;
  let r = 0, gg = 0, b = 0, n = 0;
  for (let k = 0; k < d.length; k += 4) { r += d[k]; gg += d[k + 1]; b += d[k + 2]; n++; }
  r /= n; gg /= n; b /= n;
  const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
  return mx <= 130 && mx - mn <= 30;
}
/* 沿一条横/纵带按 12px 分段，只画"落在真沥青上"的那几段。
   跨广场时带子自然断开 —— 这正是铺装广场该有的样子。 */
function bandOnAsphalt(g, x, y, w, h, col) {
  if (w >= h) { for (let t = 0; t < w; t += 12) { const sw = Math.min(12, w - t); if (asphaltAt(g, x + t + 6, y + (h >> 1))) px(g, x + t, y, sw, h, col); } }
  else        { for (let t = 0; t < h; t += 12) { const sh = Math.min(12, h - t); if (asphaltAt(g, x + (w >> 1), y + t + 6)) px(g, x, y + t, w, sh, col); } }
}

/* --- 2.8.1 逐砖色差 --------------------------------------------------
   ⚠️ 色调用**世界砖号的哈希**而不是 rng：一块 16×8 的砖常横跨两个 CELL，
   而每个 CELL 是各画各的 —— 用 rng 的话同一块砖的两半会拿到不同色调，
   在格子边界上留一条 16px 接缝（= 把 CELL 网格暴露出来）。
   哈希与"谁在画"无关，跨格天然一致。 */
function brickTone(bx, by) {
  let h = Math.imul(bx, 73856093) ^ Math.imul(by, 19349663);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h >>> 8) & 255) / 255;
}

/* --- 2.8.2 井盖 ------------------------------------------------------
   3/4 俯视：圆盖压成椭圆（rx6 / ry4）。只落主干道、且不落广场。 */
const MH_RIM = "#4d4d54", MH_FACE = "#6b6b73";
function manholeAt(g, cx, cy) {
  const rx = 6, ry = 4;
  ellipsePx(g, cx, cy + 2, rx + 1, ry, "rgba(14,18,28,0.16)");      // 接地影
  ellipsePx(g, cx, cy, rx, ry, MH_RIM);                             // 铸铁框
  ellipsePx(g, cx, cy - 1, rx, ry, shade(MH_FACE, -0.10));          // 盖面
  ellipsePx(g, cx, cy - 1, rx - 3, ry - 2, shade(MH_FACE, 0.12));   // 内圈
  for (let i = -1; i <= 1; i++)                                     // 盖面方格纹
    px(g, cx - 3, cy - 2 + i, 7, 1, "rgba(14,18,28,0.26)");
  px(g, cx - rx, cy - 1, rx * 2 + 1, 1, "rgba(255,255,255,0.15)");  // 上缘受光
  px(g, cx - rx, cy + ry - 2, rx * 2 + 1, 1, "rgba(14,18,28,0.20)"); // 下缘背光
}
function paintManholes(g, rng) {
  let n = 0;
  for (const a of ARTERY) {
    if (a.cls !== 2) continue;                     // 只落主干道
    const horiz = a.w >= a.h, len = horiz ? a.w : a.h;
    const half = (horiz ? a.h : a.w) / 2;
    for (let t = 130; t < len - 90; t += 170 + ((rng() * 90) | 0)) {
      /* ⚠️ 偏移量**必须避开正中**（±14px 起）：主干道正中是双黄中线，
         偏移取 ±(0.42*half) 的旧写法会让井盖骑在黄线上。 */
      const off = (rng() < 0.5 ? -1 : 1) * (14 + rng() * Math.min(16, half - 18));
      const x = Math.round(horiz ? a.x + t : a.x + a.w / 2 + off);
      const y = Math.round(horiz ? a.y + a.h / 2 + off : a.y + t);
      if (x < 8 || y < 8 || x > WORLD_W - 8 || y > WORLD_H - 8) continue;
      if (!asphaltAt(g, x, y)) continue;           // 只落在真沥青上
      manholeAt(g, x, y);
      n++;
    }
  }
  return n;
}

/* --- 2.8.3 磨损：斑马线缺口 + 车辙压痕 -------------------------------
   ⚠️ 补洞要用**路面底色**（ASPHALT_RAMP[1] = 校门车行道的整块填色），
   不能用透明 —— 底下是烘焙好的地面，透明洞会露出上一层。 */
function paintWear(g, rng) {
  for (const gt of GATES) {
    if (gt.id === "G3") continue;                  // 东南门是斜的，没铺车行道
    if (gt.dir === "h") {
      for (let i = -4; i <= 4; i++)
        for (let k = 0; k < 3; k++)
          px(g, Math.round(gt.x + i * 22 - 4 + rng() * 8), Math.round(gt.y - 26 + rng() * 50),
             1 + ((rng() * 3) | 0), 1 + ((rng() * 5) | 0), ASPHALT_RAMP[1]);
    } else {
      for (let i = -4; i <= 4; i++)
        for (let k = 0; k < 3; k++)
          px(g, Math.round(gt.x - 26 + rng() * 50), Math.round(gt.y + i * 22 - 4 + rng() * 8),
             1 + ((rng() * 5) | 0), 1 + ((rng() * 3) | 0), ASPHALT_RAMP[1]);
    }
  }
  /* 车辙：主干道两条轮迹带（5.5% 黑，很淡，只是"这条路天天有人走"的暗示） */
  for (const a of ARTERY) {
    if (a.cls !== 2) continue;
    const horiz = a.w >= a.h;
    for (const f of [0.30, 0.70])
      if (horiz) bandOnAsphalt(g, a.x, Math.round(a.y + a.h * f) - 1, a.w, 3, "rgba(14,18,28,0.055)");
      else       bandOnAsphalt(g, Math.round(a.x + a.w * f) - 1, a.y, 3, a.h, "rgba(14,18,28,0.055)");
  }
}

/* --- 2.8.4 树下落花 / 落叶 -------------------------------------------
   ⚠️ 由 60_assemble §6.6d 在**所有 props 排好之后**调用；画在地面画布上。
   开花树（66×78，四物种里唯一的 66 宽）落粉花瓣，其余树种掉黄绿落叶。
   ⚠️ 第一版是"均匀撒 6 粒"—— 结果**根本看不出来**：草地本身就有满屏的黄绿
   小点（nature 段的草纹），再撒几粒同色小点等于没画。改成**成簇**：
   先取 3~4 个簇心（离树干 8~19px），每簇再挤 4~5 粒 —— 眼睛读到的是
   "树下落了一小堆"，而不是又一层草地噪点。
   落到水面 / 界外就跳过（落水里就脏了）。 */
const FALL_BLOSSOM = ["#f2d3dd", "#e9bccb", "#dda8bb", "#c98ba4"];
const FALL_LEAF    = ["#8fae55", "#a8bf68", "#c8b455", "#b07a33", "#8a6b2c"];
function paintLeafFall(g, list, rng) {
  let n = 0;
  const put = (x, y, cols) => {
    if (x < 2 || y < 2 || x > WORLD_W - 3 || y > WORLD_H - 3) return;
    const cx = (x / CELL) | 0, cy = (y / CELL) | 0;
    if (CELLK[cy * NW + cx] === K.WATER) return;      // 落水里就脏了
    if (rng() < 0.22) px(g, x, y + 1, 2, 1, "rgba(14,18,28,0.13)");   // 先垫一点接地影
    px(g, x, y, rng() < 0.34 ? 2 : 1, 1, cols[(rng() * cols.length) | 0]);
  };
  for (const p of list) {
    if (p.tag !== "tree") continue;
    const blossom = p.img.width === 66;
    const cols = blossom ? FALL_BLOSSOM : FALL_LEAF;
    const cl = blossom ? 4 : 3;                       // 簇数
    for (let c = 0; c < cl; c++) {
      const a = rng() * 6.2832, r = 8 + rng() * 11;   // 簇心：压在树冠投影内、避开树干
      const bx = p.x + Math.cos(a) * r * 1.5, by = p.y + Math.sin(a) * r * 0.75;
      const m = 3 + ((rng() * 3) | 0);                // 每簇 3~5 粒
      for (let i = 0; i < m; i++)
        put(Math.round(bx + (rng() - 0.5) * 7), Math.round(by + (rng() - 0.5) * 4), cols);
    }
    n++;
  }
  return n;
}

   够到 r≈96.2，稍有偏差就会冒到拱外面的天空/草地上。 */

  const hx = (nw - 1) / 2, hy = (nh - 1) / 2;

    const mx = Math.round(dx * ca + dy * sa + hx), my = Math.round(-dx * sa + dy * ca + hy);
    return (mx >= 0 && my >= 0 && mx < nw && my < nh && m[my * nw + mx]) ? 1 : 0;
  };
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      const wx = cx + dx, wy = cy + dy;
      if (clip) {
        const ex = wx - SG_CX, ey = wy - SG_RO;
        if (ex * ex + ey * ey > RC * RC) continue;
      }
      if (shadow) { if (!(at(wx, wy - 1) && !at(wx, wy))) continue; }
      else if (!at(wx, wy)) continue;
      px(g, wx, wy, 1, 1, col);
    }
  }

  return (SG_CX - x) / SG_RO * 0.30 + (1 - y / SG_H) * 0.06;

/* 红底竖棱：照片上是一层极密的竖向条纹（原片间隔 ≈1.7px，缩到世界像素已不足
   1px），只能用 1px 交替列当"质感"。幅度必须小，大了 1× 下整条拱带会花成噪点。 */
function sgRib(x, y) {

/* 画一行里的一段拱带。xIn = 红拱带内缘列（null = 这一段没有内缘，即拱顶实心段）：
   dIn 0/1/2 = 亮银包边/灰压条/暗缝，dIn < 0 = 内缘再往里那层拱腹暗面。
   暗面按深度递暗（−1 最亮、−6 之后到底）—— 照片里它是从红带内缘往洞里
   渐渐沉下去的一段，平涂一层会像贴了张黑纸。 */
function sgRow(g, y, xL, xR, xIn, left) {
  if (xR < xL) return;
  for (let x = xL; x <= xR; x++) {
    const dIn = xIn === null ? 99 : (left ? xIn - x : x - xIn);
    const dOut = left ? x - xL : xR - x;
    let col;
    if (dIn < 0) col = shade(SG_SOFFIT, -0.10 - Math.min(6, -dIn) * 0.055);
    else if (dIn === 0) col = SG_SILVER;
    else if (dIn === 1) col = SG_TRIM;
    else if (dIn === 2) col = SG_SEAM;
    else if (dOut === 0) col = shade(SG_RED, sgLit(x, y) - 0.34);
    else if (dOut === 1) col = shade(SG_RED, sgLit(x, y) + 0.14);
    else col = sgRib(x, y);
    px(g, x, y, 1, 1, col);
  }
}

/* 拱腹暗面在这一行的厚度。拱顶侧是满的，到起拱线（y = RO）收成 0 ——
   不收的话两根立柱内侧会各拖出一条 17px 宽的灰条直到地面，像门背后贴了
   两张黑纸。用 t² 收，收得比线性更快，最后 20 来行几乎是立刻没了。 */
function sgSoffitAt(y) {
  if (y >= SG_RO) return 0;
  const t = (SG_RO - y) / (SG_RO - SG_SOF_Y0);
  return t >= 1 ? SG_SOF : Math.round(SG_SOF * t * t);
}

/* --- 4.9.4 整座门 --- */
function makeSouthArch() {
  const c = mkCanvas(SG_W, SG_H + 3), g = c.getContext("2d");
  for (let y = 0; y < SG_H; y++) {
    let ow, iw;
    if (y < SG_RO) {
      const dy = SG_RO - y;
      ow = Math.round(Math.sqrt(SG_RO * SG_RO - dy * dy));
      iw = dy < SG_RI ? Math.round(Math.sqrt(SG_RI * SG_RI - dy * dy)) : 0;
    } else { ow = SG_RO; iw = SG_RI; }               // 起拱线以下：直柱
    if (iw <= 2) { sgRow(g, y, SG_CX - ow, SG_CX + ow, null, false); continue; }
    const xInL = SG_CX - iw - 1, xInR = SG_CX + iw + 1;
    /* 暗面内缘：夹一下，拱顶附近洞本来就只有几像素宽，不加夹会让左右两段
       越过中线互相盖住 */
    const sof = sgSoffitAt(y);
    const eL = Math.min(xInL + sof, SG_CX), eR = Math.max(xInR - sof, SG_CX);
    sgRow(g, y, SG_CX - ow, eL, xInL, true);
    sgRow(g, y, eR, SG_CX + ow, xInR, false);
  }
  /* 起拱线的施工缝（照片里能看见一道横缝） */
  px(g, SG_CX - SG_RO, SG_RO, SG_LW, 1, "rgba(0,0,0,0.22)");
  px(g, SG_CX + SG_RI - 1, SG_RO, SG_LW, 1, "rgba(0,0,0,0.22)");

  /* 徽下的拱腹石：照片里校徽正下方垂着一块灰石（拱腹的可见面），**往下收窄**、
     到末端收成一个尖。宽 17→9、垂 20px。画成方盒子会很愣，收尖才像石头。 */
  const sy0 = SG_EM_CY + SG_EM_R - 2, sh = 20;
  for (let i = 0; i < sh; i++) {
    const hw = Math.round(8 - 4 * i / (sh - 1));          // 半宽 8 → 4
    px(g, SG_CX - hw, sy0 + i, hw * 2 + 1, 1,
       shade("#57514a", -0.30 + (i / sh) * 0.30));
    px(g, SG_CX - hw, sy0 + i, 1, 1, "#4a443e");          // 左缘
    px(g, SG_CX + hw, sy0 + i, 1, 1, "#3c3733");          // 右缘
  }
  px(g, SG_CX - 8, sy0, 17, 1, "#6a635a");                // 顶面接徽

  /* 拱顶校徽：深色托边 + 蓝底 + 金色点阵（点阵取自用户给的校徽图） */
  circlePx(g, SG_CX, SG_EM_CY, SG_EM_R + 1, "#2b1a17");
  circlePx(g, SG_CX, SG_EM_CY, SG_EM_R, SG_EMBLUE);
  /* 徽的金色点阵：不裁（徽心在 r=71、R=19，本来就整块在拱内）、不投影
     （底是深蓝，反差已经够；再压暗金边会糊掉徽里那些细线） */
  sgGlyph(g, sgBits(SG_MASK_EM, SG_EMN * SG_EMN), SG_EMN, SG_EMN,
          SG_CX, SG_EM_CY, 0, SG_GOLD, false, false);

  /* 四个金字（沿弧、随切线倾斜） */
  for (const cs of SG_CHARS) {
    const a = cs[1] * Math.PI / 180, nw = cs[2], nh = cs[3];
    sgGold(g, sgBits(cs[0], nw * nh), nw, nh,
           Math.round(SG_CX + SG_CH_R * Math.cos(a)),
           Math.round(SG_RO - SG_CH_R * Math.sin(a)), 90 - cs[1]);
  }

  /* 柱础 + 接地影：只落在两根立柱下 —— 门洞里也画一道就会像地面多了道坎 */
  px(g, SG_CX - SG_RO, SG_H - 3, SG_LW, 3, shade(SG_RED, -0.38));
  px(g, SG_CX + SG_RI - 1, SG_H - 3, SG_LW, 3, shade(SG_RED, -0.38));
  px(g, SG_CX - SG_RO, SG_H, SG_LW, 3, SG_SHADOW);
  px(g, SG_CX + SG_RI - 1, SG_H, SG_LW, 3, SG_SHADOW);
  px(g, SG_CX - SG_RI, SG_H, SG_RI * 2 + 1, 2, "rgba(14,18,28,0.16)");
  return { canvas: c, ax: SG_CX, ay: SG_H, w: SG_W, h: SG_H };
}

/* tag:"gate" 是为了让 60_assemble 的 clearPropTreeClash 跳过它 ——
   那段会按"树盖住小道具接地线"删道具，而这门宽 195 > 90 本来会走楼的分支，
   带上 tag 直接免检，省得将来改判据时误伤。 */
function buildSouthArch() {
  const G = GATES.find(o => o.id === "G2");
  const s = makeSouthArch();
  props.push({ img: s.canvas, ax: s.ax, ay: s.ay, x: G.x, y: G.y, baseY: G.y, tag: "gate" });
}

/* =========================================================
   5. 角色：四向 × 六相位（重画版，A 档：头 6px / 4.3 头身）
   ---------------------------------------------------------
   ⚠️ 对外契约（**只有 step 的取值域变了**，别的与 demo §5 逐字相同）：
        CH_W / CH_H / CH_AX / CH_AY           四个常量（值不变）
        makeChar(dir, step) -> canvas         step 0..3 行走四帧 / 4..5 待机两帧
        charSprite(dir, step)                 按 dir+step 缓存（键自动扩到 6 个相位）
      唯一的调用点是主循环里的 drawList.push({... charSprite(player.dir, player.step) ...})，
      锚点仍是 ax = CH_AX / ay = CH_AY，所以"脚踩在世界坐标 y 上"这件事没变。

   与上一版的差别（这一步新做的三件事）：
      A) **2 帧 → 4 帧行走**。原来 `& 1` 只有两个姿势，一个周期里身体只起伏一次，
         看着像"整块人在弹"。现在走的是教科书四帧：接触（跨开）→ 通过（并立抬身）
         → 接触（镜像）→ 通过（并立抬身）。
      B) **待机呼吸帧**。站着不动时不再是死定格：2 帧、约 0.4 Hz，吸气时上身抬 1px。
      C) **步态由"实际位移"驱动**（改在主循环补丁 11，不在本文件）：原来 `walk += dt`
         顶着墙走也照常累加 → 人会原地踏步；现在顶墙位移为 0，脚立刻停。
         步频也不再是硬编码的 `* 7`，而是每 WALK_STRIDE 世界像素走完一个周期。

   为什么重画（对着 demo §5 逐条数出来的五个问题，前四个是代码/肉眼，第五个是实测）：
     1) 头身比 3.4（头 8px / 全身 27px）—— Q 版娃娃。
     2) 结构是"一摞方块"：躯干 = 一个 10×8 矩形，手臂/腿都是直条 ——
        没有肩斜、肘、膝、腰。
     3) 全画面只有它没有 1px 深色收边（楼有棱线、树有暗底叶簇、灌木有背光球）
        → 剪影在草地/路面上发虚。
     4) 明暗只有左右二分（左亮右暗），没有顶光、没有遮蔽（下巴/腋下/胯下）。
     5) 【实测】朝右的精灵**接地影方向是反的**：demo 的 flipH() 用 translate+scale
        画完后不 restore，变换留在返回画布的 context 上，末尾的 ellipsePx 影子
        被又镜像了一次。实测影子重心相对身体重心的偏移：
            现版 down +1.5 / left +1.0 / right **−1.0** / up +1.5
        树、楼、灌木的影子全朝右下，只有"朝右的角色"逆着光。本版修了，四向一律 +1.5。

   ⚠️ 头身比的取舍：真人 7.5 头身，但 30px 画布里头一缩小，脸就没了。
      540 个像素撑不起写实，只能撑起"可读的真人剪影 + 真实的重心与节拍"。
      这里取头 6px（4.3 头身）：脸留 4 行（眼/鼻/嘴/下颌），成年人骨架成立。
      （头 8px 的 3.4 头身版本试过，脸会挤成一团络腮胡，且与现版同比例、没解决问题。）
   ========================================================= */
const CH_W = 18, CH_H = 30, CH_AX = 9, CH_AY = 27;

/* --- 步态相位表 ---------------------------------------------------------
   4 帧行走 + 2 帧待机，一个周期 = 左右各一步。
   ⚠️ 两个视角要**分别**给参数，不能共用一个"腿相位"：
      侧面看不到左右，只能看前后 → m（1 左腿跨在前 / 2 右腿跨在前 / 0 并立）；
      正背面看不到前后，只能看左右 → fl（抬哪条腿：0 并立 / 1 抬左 / 2 抬右）+ spread（两腿分不分）。
   踩过坑：两帧都用"并立"来当通过帧，正背面看这两帧的腿就一模一样，4 帧白给一帧
   （只有手臂不同，远看就是同一张）。所以抬腿相位在两个通过帧里**交替**，
   接触帧也各抬一条（在后的那条腿离镜头更远，画高 1px）。
   bob 骨盆起伏（只抬腰以上，脚不离地）；sw 手臂摆相。 */
const WALK_FRAMES = 4, IDLE_BASE = 4, IDLE_FRAMES = 2;
const GAIT = [
  { m: 1, fl: 2, spread: 1, bob: 0, sw: 0 },   // 0 接触：两腿分开、左腿在前（右腿远，抬 1px）
  { m: 0, fl: 2, spread: 0, bob: 1, sw: 1 },   // 1 通过：并立抬身、右腿抬起经过
  { m: 2, fl: 1, spread: 1, bob: 0, sw: 1 },   // 2 接触：两腿分开、右腿在前（左腿远，抬 1px）
  { m: 0, fl: 1, spread: 0, bob: 1, sw: 0 },   // 3 通过：并立抬身、左腿抬起经过
  { m: 0, fl: 0, spread: 0, bob: 0, sw: 0 },   // 4 待机：呼气
  { m: 0, fl: 0, spread: 0, bob: 1, sw: 0 }    // 5 待机：吸气（上身抬 1px）
];
/* 一个完整步态周期走过的世界像素。1× 档速度 200 px/s → 200/160 = 1.25 周期/秒
   = 2.5 步/秒（真人 1.8~2.0，游戏里略快是合适的）。3× 档世界速度减半，步频跟着慢下来。
   ⚠️ 两个数都必须在这里声明：主循环补丁 11 要用，而主循环段排在角色段之后。 */
const WALK_STRIDE = 160;
const IDLE_HZ = 0.4;                   // 待机呼吸约 2.5 秒一个来回

const A2 = {
  skin:  "#e9bb92", skinD: "#c4906a", skinL: "#f7d3ae",
  hair:  "#241d1a", hairL: "#3d3029", hairD: "#150f10",
  coat:  "#3f6ea8", coatD: "#2b4d76", coatL: "#5d8cc4",
  pant:  "#454c5a", pantD: "#2b303a", pantL: "#5c6474",   // 比现版提亮：描边(k=0.45)才读得出来
  shoe:  "#26282e", shoeL: "#454a54",
  pack:  "#b4552f", packD: "#8a3f22", packL: "#d1704a"
};

/* --- 自动描边：给精灵四周的透明像素补 1px 收边 ---------------------------
   ⚠️ 不用"纯黑描边"（像素画里太硬、显脏），而是**取相邻实心像素的颜色压暗**
   —— 这叫彩色描边：头发的边 = 更黑的头发、袖子的边 = 更深的蓝。剪影立刻清楚。
   一次调用可给任何精灵加收边；给树/灌木加是同一行代码。
   ⚠️ 必须画在接地影**之前**，否则影子会被描一圈边。
   ⚠️⚠️ 必须先把变换复位成单位阵 —— flipH() 用 translate+scale 画完后**不 restore**，
   返回的画布 context 上永久留着 translate(W,0) scale(-1,1)。
   往这种画布上 fillRect(x,y,1,1) 会落到 W-1-x：描边跑到另一侧、原侧留空 1px，
   镜像方向的精灵会多出"空格 + 外挂 1px"的鬼影（实测：右侧 24 个内部空洞，
   左侧 0 个）。下面这行是必须的，不是防御性代码。 */
function outlineSprite(c, k) {
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  const src = (x, y) => (x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 40)
    ? (y * W + x) * 4 : -1;
  const NB = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  const edge = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) continue;
      for (let n = 0; n < 4; n++) {                 // 四邻即可：八邻会让四角鼓 1px
        const j = src(x + NB[n][0], y + NB[n][1]);
        if (j >= 0) { edge.push(x, y, j); break; }
      }
    }
  }
  for (let i = 0; i < edge.length; i += 3) {
    const j = edge[i + 2];
    g.fillStyle = "rgb(" + ((d[j] * k) | 0) + "," + ((d[j + 1] * k) | 0) + "," + ((d[j + 2] * k) | 0) + ")";
    g.fillRect(edge[i], edge[i + 1], 1, 1);
  }
}

/* =========================================================
   参数化构建：HH = 头高（含发）。整个骨架由它推出来，改一处不散架。
   ---------------------------------------------------------
   纵向预算（画布 18×30，脚底线 gy = CH_AY = 27）：
     y1 .. y1+HH-1   头
     y1+HH           颈（1 行）
     y1+HH+1         肩/躯干起
     躯干 + 腿 平分剩下的行数（真人的肩-胯 ≈ 胯-脚底），鞋固定占 y25-26
   bob 只抬"腰以上"：走路的真实构造是**骨盆起伏、脚不离地**。
   现版是两帧整体平移（bob 直接加在全体），所以看着像"整块画在跳"。
   ========================================================= */
function buildChar(HH, PAL) {
  /* 配色表：默认 `A2`（玩家）。第二个参数是**换装入口** —— 向导 · 小北 走这条：
     同一套骨架、同一套步态、同一组相位表，只换颜色。
     ⚠️ 传 undefined 时 `C === A2`，产出与加这个参数之前**逐字节相同**，
        所以 `buildChar(6)` 那一行（玩家）一个字没动。
     ⚠️ 函数体里**一个 `A2.` 都不许留** —— 留一个就会让 NPC 身上出现一块玩家色。 */
  const C = PAL || A2;
  const TOP = 1, SHOE_TOP = 25, cx = CH_AX, gy = CH_AY;
  const NECK = TOP + HH, TOR = NECK + 1;
  const bodyRows = SHOE_TOP - TOR;
  const TORSO = Math.max(6, Math.round(bodyRows / 2));
  const LEGT = TOR + TORSO, LEGR = SHOE_TOP - LEGT;          // 腿的行数（不含鞋）
  const KNEE = LEGT + Math.max(2, Math.round(LEGR * 0.55));
  const HW = HH >= 7 ? 8 : 7;                                // 头宽
  const H2 = (HW - 1) >> 1;                                  // 头左右各伸出的像素数
  const ARMR = Math.max(4, TORSO - 3);
  const FACE = HH - 2;                                       // 脸的行数

  return function (dir, step) {
    const c = mkCanvas(CH_W, CH_H), g = c.getContext("2d");
    const P = (x, y, w, h, col) => { if (w > 0 && h > 0) px(g, x, y, w, h, col); };
    const F = GAIT[step] || GAIT[0];                         // 相位：0..3 行走 / 4..5 待机
    const b = F.bob;                                         // 骨盆起伏 1px
    const HY = TOP + b;                                      // 头顶（腰以上整体上移）
    const ty = TOR + b, ly = LEGT + b;                       // 躯干起 / 髋

    /* ---------- 头 ---------- */
    function head(face) {
      P(cx - H2 + 1, HY, HW - 2, 1, C.hairL);               // 发顶受光（顶光层）
      P(cx - H2, HY + 1, HW, 1, C.hair);
      if (!face) {                                           // 背向：后脑 + 左棱受光
        P(cx - H2, HY + 2, HW, HH - 2, C.hair);
        P(cx - H2, HY + 1, 1, HH - 1, C.hairL);
        P(cx + H2, HY + 1, 1, HH - 1, C.hairD);
        P(cx - 1, HY + 2, 2, 1, shade(C.hair, 0.20));       // 发旋小高光（不是横贯亮带）
        return;
      }
      P(cx - H2, HY + 2, HW, FACE, C.skin);                 // 脸
      P(cx - H2, HY + 2, 1, FACE, C.skinL);                 // 左颊受光（光自左上）
      P(cx + H2, HY + 2, 1, FACE, C.skinD);                 // 右颊背光
      /* ⚠️ 五官一律以 HY（会随 bob 起伏）为基准，**不能用 TOP 绝对行号**：
         b=1 时脸整体下移 1px，五官若留在原地就顶到刘海线上、嘴跑到眼睛下格，
         整张脸糊成一条黑带（sprite.py 的"头块刚性"探针会实测出来）。 */
      const EY = HY + 2 + (FACE >= 5 ? 2 : 1);               // 眼睛所在行
      P(cx - 2, EY, 1, 1, C.hairD);                         // 左眼
      P(cx + 1, EY, 1, 1, C.hairD);                         // 右眼（间距 2px）
      if (FACE >= 5) P(cx, EY + 1, 1, 1, C.skinD);          // 鼻影（脸够高才放得下）
      P(cx - 1, HY + FACE, 3, 1, shade(C.skinD, -0.28));    // 嘴（脸的倒数第二行）
      P(cx - H2 + 1, HY + FACE + 1, HW - 2, 1, C.skinD);    // 下颌收边（脸的最后一行）
    }
    /* ---------- 躯干（胸宽 9 → 腰宽 7 → 衣摆） ---------- */
    function torso(back) {
      P(cx - 4, ty, 9, 1, C.coatL);                         // 肩顶受光
      const chest = Math.max(2, TORSO - 3);
      P(cx - 4, ty + 1, 9, chest, C.coat);                  // 胸
      P(cx - 3, ty + 1 + chest, 7, TORSO - 1 - chest, C.coat);   // 腰（左右各收 1px）
      P(cx - 4, ty + 1, 2, TORSO - 1, C.coatL);             // 左侧受光面
      P(cx + 3, ty + 1, 1, TORSO - 1, C.coatD);             // 右侧背光面
      P(cx - 4, ty + chest, 9, 1, "rgba(0,0,0,0.13)");       // 胸腰分界
      P(cx - 3, ty + TORSO - 1, 7, 1, C.coatD);             // 衣摆（压实腰线，与裤头对齐）
      if (back) {
        P(cx - 3, ty + 1, 7, TORSO - 4, C.pack);            // 书包
        P(cx - 3, ty + 1, 7, 1, C.packL);
        P(cx + 2, ty + 1, 1, TORSO - 4, C.packD);
        P(cx - 2, ty - 1, 5, 1, "rgba(0,0,0,0.26)");         // 背带压肩
      } else {
        P(cx, ty + 1, 1, TORSO - 2, C.coatD);               // 前襟
        P(cx - 2, ty + chest + 2, 4, 1, C.coatD);           // 口袋线
      }
    }
    /* ---------- 手臂（2px，肘内收 1px），左右反相摆动 ---------- */
    function arms(sw, back) {
      const aL = ty + 1 + sw, aR = ty + 1 + (sw ? 0 : 1);
      P(cx - 6, aL, 2, ARMR, back ? C.coat : C.coatL);     // 左臂（受光侧）
      P(cx - 6, aL + ((ARMR / 2) | 0), 1, 1, C.coatD);      // 肘
      P(cx - 6, aL + ARMR, 2, 2, C.skin);                   // 左手
      P(cx + 5, aR, 2, ARMR, C.coatD);                      // 右臂（背光侧）
      P(cx + 6, aR + ((ARMR / 2) | 0), 1, 1, C.hairD);      // 肘
      P(cx + 5, aR + ARMR, 2, 2, C.skinD);                  // 右手
    }
    /* ---------- 腿（大腿 → 膝 → 小腿 → 鞋）----------
       fl: 0 并立 / 1 抬左腿 / 2 抬右腿。抬腿 = 小腿与鞋整体上移 1px（在后的那条腿离镜头更远）。
       spread: 接触帧两腿各外移 1px —— 正背面看"迈步"只能靠这个（前后是看不出来的）。
       ⚠️ 小腿的**起点必须跟着上移到 knee**。老写法是"大腿缩短 1px、小腿仍从 KNEE 起"，
          会在 KNEE-1 行留一条 1px 空洞 —— 描边会把这个洞填成一圈深色，肉眼看是腿中段断了一格。
          现在大腿定长、小腿从 knee 起严丝合缝，膝线**显式画**出来（不再靠缝隙让描边去填）。 */
    function legs(fl, spread) {
      function one(x, shx, edge, edgeCol, up) {
        const knee = KNEE - up, bot = SHOE_TOP - up;
        P(x, ly, 3, KNEE - ly, C.pant);                 // 大腿（定长，到 KNEE-1）
        P(x + edge, ly, 1, KNEE - ly, edgeCol);          // 受光 / 背光边
        P(x, ly, 3, 1, "rgba(0,0,0,0.18)");              // 胯下遮蔽
        P(x, knee, 3, bot - knee, C.pant);              // 小腿
        P(x, knee, 3, 1, shade(C.pant, -0.20));         // 膝线
        P(shx, bot, 4, 2, C.shoe);                      // 鞋（比腿宽 1px：脚是横的）
        P(shx, bot, 4, 1, C.shoeL);
      }
      const d = spread ? 1 : 0;
      one(cx - 3 - d, cx - 4 - d, 0, C.pantL, fl === 1 ? 1 : 0);   // 左腿（受光侧，亮边在左）
      one(cx + 1 + d, cx + 1 + d, 2, C.pantD, fl === 2 ? 1 : 0);   // 右腿（背光侧，暗边在右）
    }
    /* ---------- 侧视：额头-鼻-下巴的台阶 + 迈步的前后腿交叉 ----------
       mode: 0 并立 / 1 左腿跨在前 / 2 右腿跨在前。侧面看不到左右，只有"前后"：
       跨步靠**两条腿的横向错位**表达（前腿短 1px 显得更远、后腿长 1px 是蹬地踩实），
       所以 mode 1/2 的差别不是几何而是**亮暗边换边**——哪条腿在前，亮边就跟到哪条腿上。
       并立帧（mode 0）两腿重叠在同一列，这时由 sw 决定亮边露在哪一侧：
       1 帧与 3 帧的**像素差别就只有这个**（不然两帧完全相同，4 帧白给一帧）。 */
    function side(mode, sw) {
      const s = mode === 0 ? 2 : 0;                      // 2 = 两腿并到同一列
      const fx = cx - 3 + s, bx = cx + 1 - s;
      const fl = mode === 1 || (mode === 0 && !sw);       // 跨在前的是不是左腿
      const th = KNEE - ly;
      P(fx, ly, 3, th, C.pant);                         // 前腿（迈向前）
      P(fx + (fl ? 0 : 2), ly, 1, th, fl ? C.pantL : C.pantD);
      P(fx, KNEE, 3, SHOE_TOP - KNEE, C.pant);
      P(fx - 1, SHOE_TOP, 4, 2, C.shoe);                // 前脚（脚尖朝行进方向）
      P(fx - 1, SHOE_TOP, 4, 1, C.shoeL);
      P(bx, ly, 3, th + 1, C.pant);                     // 后腿（蹬地，长 1px）
      P(bx + (fl ? 2 : 0), ly, 1, th + 1, fl ? C.pantD : C.pantL);
      P(bx, KNEE + 1, 3, SHOE_TOP - KNEE - 1, C.pant);
      P(bx, SHOE_TOP, 4, 2, C.shoe);                    // 后脚
      P(bx, SHOE_TOP, 4, 1, C.shoeL);
    }
    /* ---------- 侧视的头与躯干（与相位无关，抽出来只为让 side() 读起来是"人"不是"色块"） ---------- */
    function sideBody(sw) {
      P(cx - H2 + 1, HY, HW - 2, 1, C.hairL);
      P(cx - H2, HY + 1, HW, 1, C.hair);
      P(cx - H2, HY + 2, HW, HH - 2, C.skin);
      P(cx + 1, HY + 2, 3, HH - 2, C.hair);                 // 后脑
      P(cx + H2, HY + 2, 1, HH - 2, C.hairD);
      P(cx - H2, HY + 2, H2 + 1, 1, C.hair);                // 刘海压额（额头有台阶）
      const EY = HY + 2 + (FACE >= 5 ? 2 : 1);               // 同正面：五官必须跟着 HY 走
      P(cx - 2, EY, 1, 1, C.hairD);                         // 眼
      P(cx - H2, EY - 1, 1, 1, C.skinL);                    // 额头受光
      P(cx - H2, EY + 1, 1, 1, C.skinL);                    // 鼻尖受光（侧脸第二个台阶）
      P(cx - H2, HY + FACE, 2, 1, C.skinD);                 // 下巴
      P(cx - 3, ty, 6, 1, C.coatL);                         // 肩顶
      P(cx - 3, ty + 1, 6, TORSO - 1, C.coat);              // 侧视厚度 6px（正/背面 9px）
      P(cx - 3, ty + 1, 1, TORSO - 1, C.coatL);             // 胸前受光
      P(cx + 2, ty + 1, 1, TORSO - 1, C.coatD);             // 后背背光
      P(cx - 3, ty + TORSO - 1, 6, 1, C.coatD);             // 衣摆
      P(cx + 1, ty + 1, 3, TORSO - 3, C.pack);              // 书包（侧视露在背后）
      P(cx + 3, ty + 1, 1, TORSO - 3, C.packD);
      P(cx + 1, ty + 1, 3, 1, C.packL);
      /* ⚠️ 侧视摆臂**故意摆 2px**（正/背面只有 1px）：侧视的"通过帧"在几何上近乎对称，
         两帧只能靠亮暗边换边 + 手臂位置区分，摆 1px 时两帧差异只有 ~20 像素、几乎看不出。
         侧视里手臂是唯一能大幅表达节奏的部位，摆大一点整个步态才读得出来。 */
      const ao = sw ? 2 : 0;
      P(cx - 4, ty + 2 + ao, 2, ARMR, C.coatL);             // 前臂摆到身前
      P(cx - 4, ty + 2 + ao + ARMR, 2, 2, C.skin);          // 手
    }

    if (dir === "up")        { head(false); torso(true);  arms(F.sw, true);  legs(F.fl, F.spread); }
    else if (dir === "down") { head(true);  torso(false); arms(F.sw, false); legs(F.fl, F.spread); }
    /* ⚠️ 顺序不能反：先头/躯干再腿，腿压在躯干上沿 —— 反过来衣摆会盖住大腿根。 */
    else                     { sideBody(F.sw); side(F.m, F.sw); }

    /* ---------- 长发（可选钩子，`C.longHair`）----------
       侧视只画**后脑那一侧**：side() 画的是朝左的人（后脑恒在 x 较大的一侧），
       前面再挂一条会盖在脸上 —— 那不是长发，那是头发糊住了五官。
       ⚠️ 必须画在**描边之前**，否则这两条不会得到彩色收边，3× 下像两片浮在肩上的色块。
       ⚠️ 落在 x = cx±(H2+1) 即躯干的最外两列上，所以它会自然压在肩上 ——
          这正是"垂到肩头"的样子，不用另外算肩线。 */
    if (C.longHair) {
      const LN = HH + 3;                                   // 发梢落到肩线下方 3px
      for (let i = 0; i < LN; i++) {
        const col = i < LN - 2 ? C.hair : C.hairD;         // 发梢两行压暗
        P(cx + H2 + 1, HY + 2 + i, 1, 1, col);             // 后脑侧（四向都有）
        if (dir === "up" || dir === "down")                // 正 / 背面才补前面那一条
          P(cx - H2 - 1, HY + 2 + i, 1, 1, shade(col, 0.10));
      }
    }

    /* ---------- 眼镜（可选钩子，`C.glasses`，第四十轮）----------
       给「算法哥」用。⚠️ `undefined` 时**一个像素都不画** ⇒ 玩家（`A2`）与小北
       （`GUIDE_PAL`）的产出与本轮之前**逐字节相同**（`buildChar` 头顶那条契约）。
       ⚠️ 必须画在**描边之前**（与上面的 `C.longHair` 同一条规矩）—— 否则镜框得不到
          彩色收边，3× 下像两片浮在脸上的色块。
       ⚠️ 背向（`dir === "up"`）**不画** —— 否则后脑勺上会凭空多出一副眼镜。
       ⚠️ 眼睛行必须复用 `head()` / `sideBody()` 那**同一个式子** —— 见上面 `:158-160`
          的警告：五官一律以 `HY`（会随 bob 起伏）为基准，**不能用 TOP 绝对行号**，
          否则 b=1 那一帧眼镜会脱开脸往上飘 1px。
       画法：只画「上沿 + 左右外框 + 鼻梁」，**两眼那两格留空** —— 留空处就是镜片，
       眼睛从镜片后面透出来。这是 18×30 这种尺寸下唯一读得出来的眼镜画法
       （试过实心 3×3 镜框：脸只有 4 行高，实心框一盖，整张脸糊成一条黑带）。 */
    if (C.glasses) {
      const GE = HY + 2 + (FACE >= 5 ? 2 : 1);             // = head() 里的 EY，同一个式子
      if (dir === "down") {
        P(cx - H2, GE - 1, HW - 1, 1, C.glasses);          // 上沿：x6..x11，右侧留 1px 脸的边
        P(cx - H2, GE,     1, 1, C.glasses);               // 左外框
        P(cx - 1,  GE,     2, 1, C.glasses);               // 鼻梁（x8..x9，正好夹在两眼中间）
        P(cx + 2,  GE,     1, 1, C.glasses);               // 右外框
      } else if (dir !== "up") {                           // left / right：侧脸只有一只眼
        P(cx - H2, GE - 1, 3, 1, C.glasses);               // 上沿（短，只罩得住那一只）
        P(cx - H2, GE,     1, 1, C.glasses);               // 外框
        P(cx,      GE - 1, 3, 1, C.glasses);               // 镜腿：横过太阳穴压在后脑发上
      }
    }

    /* --- 后处理：镜像 → 描边 → 接地影（唯一一条出口）---
       ⚠️ 镜像后必须复位变换（flipH 的 translate+scale 留在 context 上），
       否则描边和接地影都会被**再镜像一次** —— 影子跑到左下（demo 现版朝右精灵就中招）。 */
    let out = c;
    if (dir === "right") { out = flipH(c); out.getContext("2d").setTransform(1, 0, 0, 1, 0, 0); }
    outlineSprite(out, 0.45);
    /* 接地影：朝右下（与树/楼/灌木同向，偏移 +1.5）。
       ⚠️ 必须在描边之后画 —— 否则影子会被描一圈边。
       ⚠️ 几何是量出来的，不是拍的：足迹必须落在 x6..16 / y27..29 内。
          试过 (cx+3, rx=8)，会铺到 x4..20 —— 右端被画布硬切，
          y29 在最右列留下一排 α54 的实心影子（肉眼是一条竖刀口）。 */
    shadowBlob(out.getContext("2d"), cx + 2, gy + 1, 5, 2, 0.46, 3);
    return out;
  };
}
const makeChar = buildChar(6);       // A 档：头 6px（4.3 头身）

/* 缓存键就是 dir + step。step 从布尔扩到 0..5 之后键自动变成 6 个相位，
   四向 × 6 = 24 张，仍是一次性烘焙（每张 18×30，总共不到 13 KB）。 */
const _chars = Object.create(null);
function charSprite(dir, step) {
  const k = dir + step;
  if (!_chars[k]) _chars[k] = makeChar(dir, step);
  return _chars[k];
}

   ⚠️ 本段**不动主循环**：室内是独立的覆盖画布 + 自己的 rAF，主循环 `update`/`render`

/* --- 7.5.1 精灵工厂：两个 NPC 共用同一套骨架 ---------------------------
   与 `71_guide_char.js` 完全同构：同一套骨架、同一套步态，只换配色表。
   ⚠️ `HH` 必须写 **6** —— 与玩家（`buildChar(6)`）和小北同档。写别的会让 NPC
      比玩家高/矮一截，3× 档下肉眼看得见。
   ⚠️ 工厂返回的是**带缓存**的取图函数（key = `dir + step`）。缓存只负责复用，
      不改画法；`buildChar(HH, PAL)` 传什么就画什么。 */
function npcSprites(pal) {
  const make = buildChar(6, pal), cache = Object.create(null);
  return function (dir, step) {
    const k = dir + step;
    if (!cache[k]) cache[k] = make(dir, step);
    return cache[k];
  };
}

/* 算法哥的配色：戴眼镜、穿黑衣。

        玩家   = 蓝外套 #3f6ea8
        小北   = 红马甲 #c0392b（全图唯一的高饱和红）
        算法哥 = **冷黑** #2b3038 + 眼镜
        学霸姐 = **藕荷紫** #8b6cc0（见 71c，全图唯一紫）
      刻意避开大面积的暖黑：草地/沥青/米黄楼群上，冷调黑比纯黑更能立住剪影。
   ⚠️ `pack` 三色取衣服同色 = 他**不背包**（背向时 `torso(true)` 照旧画那块，
      取同色就等于什么都没加 —— 比给 buildChar 再加一个「不背包」钩子省一次改动）。 */

  coat:  "#2b3038", coatD: "#171b21", coatL: "#454c58",   // 冷黑外套
  pant:  "#2a2e36", pantD: "#1a1d23", pantL: "#3d434e",
  shoe:  "#1a1c21", shoeL: "#33373f",
  pack:  "#2b3038", packD: "#171b21", packL: "#454c58",
  glasses: "#0f1114"                                        // ← 开 50_char.js 的眼镜钩子
};
const alguySprite = npcSprites(ALG_PAL);

/* --- 7.5.2 房间表 ------------------------------------------------------
   `defRoom(r)` 把 `bld`（楼名）翻成 `rect`（`zoneRect` 换算的判定矩形）。
   ⚠️ 一律**用 `zoneRect` 换算，别手打像素数** —— 那个式子与全项目其他落位同源，
      楼的位置一挪，这里跟着走。
   ⚠️ 每间房的 `solid` 都是**本段私有的碰撞表**，一条都不许进全局 `solids`
      —— 那是全校园散射种子的地雷（60 段 §6.6），动了全校园重掷。 */
const ROOMS = Object.create(null);
function defRoom(r) {
  const e = CAMPUS.find(x => x[0] === r.bld) || null;
  r.rect = e ? zoneRect(e) : null;
  ROOMS[r.key] = r;
  return r;
}

/* --- 7.5.5 室内几何：一张 720×450 的逻辑画布 ---------------------------

   （整数倍 + image-rendering:pixelated ⇒ 像素不糊）。

/* --- 7.5.6 计算机中心 · 房内布局 --------------------------------------
   碰撞盒 [x, y, w, h]。⚠️ 一条都不许进 `solids`。 */
const CTR_SOLID = [
  [0, 0, CTR_W, CTR_WALL],                                   // 上墙
  [0, CTR_WALL, CTR_WALL, CTR_H],                            // 左墙
  [CTR_W - CTR_WALL, CTR_WALL, CTR_WALL, CTR_H],             // 右墙
  [0, CTR_H - CTR_WALL, CTR_W, CTR_WALL],                    // 下墙
  [170, CTR_WALL, 380, 46],                                  // 黑板
  [250, 60, 220, 30],                                        // 讲台
];
/* 三排电脑桌 × 四列。⚠️ 排/列的间隙就是仅有的通路，改一个数要顺手核算走道宽度：
   半宽 7 ⇒ 走道至少要 14px 才过得去，现在最窄一条 35px。 */
const CTR_DESK_C = [50, 195, 340, 485];    // 桌左沿
const CTR_DESK_R = [180, 260, 340];        // 桌上沿
const CTR_DESK_W = 110, CTR_DESK_H = 52;
for (const ry of CTR_DESK_R) for (const cx of CTR_DESK_C) CTR_SOLID.push([cx, ry, CTR_DESK_W, CTR_DESK_H]);

const CTR_SPAWN = { x: 360, y: 430 };
/* ⚠️ 算法哥这个对象**是活的**：`dir` 每帧被 `ctrUpdate` 改写（他会转头看你）。
   下面 `ROOMS.center.npc` 直接引用它，所以名字 `CTR_ALG` 仍然是唯一的真相源
   （`_centerprobe.py` 的 C8 也认这个名字）。 */
const CTR_ALG = {
  name: "算法哥", x: 180, y: 150, dir: "down", step: IDLE_BASE,
  talkR: 74, spr: alguySprite,
  ringCol: "rgba(127,214,200,0.75)",
  talkTip: "按 C 和算法哥说话"
};

/* --- 7.5.7 画法：每间房给四段（floor / walls / decor / door）---------- */
/* 一次性铺的地板砖缝：不进 solids，纯装饰 */
function ctrFloor(g) {
  g.fillStyle = "#40464d"; g.fillRect(0, 0, CTR_W, CTR_H);
  g.fillStyle = "#373c42";
  for (let x = 0; x < CTR_W; x += 32) g.fillRect(x, 0, 1, CTR_H);
  for (let y = 0; y < CTR_H; y += 32) g.fillRect(0, y, CTR_W, 1);
}
function ctrWalls(g) {
  /* 天花板那圈灯先铺一层光晕（让房间"亮着"，不然黑衣算法哥会糊进暗墙里） */
  g.fillStyle = "rgba(232,228,210,0.055)";
  g.fillRect(CTR_WALL, CTR_WALL, CTR_W - CTR_WALL * 2, 210);
  g.fillStyle = "#2b3038";
  g.fillRect(0, 0, CTR_W, CTR_WALL); g.fillRect(0, CTR_H - CTR_WALL, CTR_W, CTR_WALL);
  g.fillRect(0, 0, CTR_WALL, CTR_H); g.fillRect(CTR_W - CTR_WALL, 0, CTR_WALL, CTR_H);
  g.fillStyle = "#4a515a";
  g.fillRect(0, CTR_WALL - 2, CTR_W, 2); g.fillRect(0, CTR_H - CTR_WALL, CTR_W, 2);
  g.fillRect(CTR_WALL - 2, 0, 2, CTR_H); g.fillRect(CTR_W - CTR_WALL, 0, 2, CTR_H);
  /* 日光灯：两根，挂在光晕里 */
  g.fillStyle = "#e8e4d2";
  g.fillRect(110, 26, 190, 7); g.fillRect(420, 26, 190, 7);
  g.fillStyle = "rgba(232,228,210,0.30)";
  g.fillRect(104, 20, 202, 19); g.fillRect(414, 20, 202, 19);
}
function ctrBoard(g) {
  g.fillStyle = "#6b5a3e"; g.fillRect(170, CTR_WALL, 380, 46);      // 木框
  g.fillStyle = "#1e2a24"; g.fillRect(174, CTR_WALL + 4, 372, 38);  // 黑板面
  g.fillStyle = "#8f9a90";                                          // 粉笔字（三条横杠，别写字）
  g.fillRect(196, CTR_WALL + 13, 120, 2);
  g.fillRect(196, CTR_WALL + 22, 200, 2);
  g.fillRect(196, CTR_WALL + 31,  86, 2);
  g.fillStyle = "#4a4034"; g.fillRect(250, 60, 220, 30);            // 讲台
  g.fillStyle = "#5a4d3e"; g.fillRect(250, 60, 220, 4);
}
function ctrDesk(g, x, y) {
  g.fillStyle = "#5a4a3c"; g.fillRect(x, y, CTR_DESK_W, CTR_DESK_H);           // 木桌面
  g.fillStyle = "#6b5847"; g.fillRect(x, y, CTR_DESK_W, 4);
  g.fillStyle = "#3a4048"; g.fillRect(x, y + CTR_DESK_H - 6, CTR_DESK_W, 6);   // 桌下暗部
  /* 显示器：黑框 + **发光的屏幕** —— 地图 §5 那份美术口径里，"暗房间里一排发光方块"
     就是这间房最重要的识别特征，所以屏幕是这间房唯一的高饱和冷光。 */
  for (let i = 0; i < 2; i++) {
    const sx = x + 10 + i * 52;
    g.fillStyle = "#1a1d22"; g.fillRect(sx, y - 30, 44, 32);
    g.fillStyle = i ? "#5fa8a0" : "#7fd6c8"; g.fillRect(sx + 3, y - 27, 38, 24);
    g.fillStyle = "rgba(255,255,255,0.22)"; g.fillRect(sx + 3, y - 27, 38, 3);
  }
  g.fillStyle = "#33383f"; g.fillRect(x + 6, y + CTR_DESK_H - 2, 26, 14);       // 椅子
  g.fillStyle = "#3e444c"; g.fillRect(x + 6, y + CTR_DESK_H - 2, 26, 3);
}
function ctrDecor(g) {
  ctrBoard(g);
  for (const ry of CTR_DESK_R) for (const cx of CTR_DESK_C) ctrDesk(g, cx, ry);
}
function ctrDoor(g) {
  g.fillStyle = "#5a4632"; g.fillRect(300, CTR_H - CTR_WALL - 34, 120, 34);     // 门扇（在墙内侧）
  g.fillStyle = "#6d563d"; g.fillRect(300, CTR_H - CTR_WALL - 34, 120, 3);
  g.fillStyle = "#c9a54e"; g.fillRect(408, CTR_H - CTR_WALL - 18, 5, 5);        // 把手
}

/* ⭐ 计算机中心登记进房间表。之后引擎只认 `ROOMS`，本段对它没有特殊照顾。 */
defRoom({
  key: "center",
  bld: "计算机中心",
  /* 判定圈＝建筑矩形外扩 90px。⚠️ 用「外扩一圈」而不是「门下一小块」：
     玩家不一定找得到门在哪，绕着楼走总会撞见提示。嫌太灵敏就改这一个数。 */
  pad: 90,
  name: "计算机中心", sub: "算法哥的机房",
  hint: "← → / A D 左右移动　↑ ↓ / W S 前后移动<br>走到算法哥身边按 <b>C</b> 找他说话　·　按 <b>B</b> 出门回地图",
  enterTip: "按 F 进入计算机中心",
  floor: ctrFloor, walls: ctrWalls, decor: ctrDecor, door: ctrDoor,
  solid: CTR_SOLID,
  spawn: CTR_SPAWN,
  npc: CTR_ALG,
  /* ⚠️ **必须是 `/agent`，不能是 `/`** —— 这里栽过一次，记下来：
     `App.vue` 全站只有两个东西 —— `<router-view/>` 和 `<AgentWatch/>`；而
     `AgentWatch.visible` 里有一条 `window.self === window.top`，意思是**被人用
     iframe 嵌进来时，算法哥那个悬浮头像自动隐身**（平台的作者是故意的：被嵌走时
     让宿主页面自己给入口）。于是打开 `/` ⇒ 抽屉里是一个**没有任何算法哥入口**的
     平台首页 —— 用户按 C 是奔着"和算法哥对话"来的，结果对不上，还以为自己没登录。
     `/agent` 是平台自己写的**算法哥整页**（`router/index.js` 注释：「算法哥：登录后
     的入口，题目、题单、排名都从这里进」），页内自带「题库」和「返回地图」两个口子，
     进去之后整个平台照样逛得到。
     ⚠️ 相对路径 = 同源 = `http://localhost:3000/agent`。**绝不许写成绝对地址**。 */
  app: "/agent",
  probe: "/api/agent/status",
  coldTip: "刷题平台没在跑 —— 正在叫启动器（浏览器会问一次「是否打开」，点「打开」）…"
});

/* --- 7.5.8 状态 ------------------------------------------------------- */
const CENTER = {
  active: false,        // 在某个房间里
  plat:   false,        // 平台的 iframe 铺在上面
  room:   null,         // 当前房间（`ROOMS` 里那个对象）
  x: CTR_SPAWN.x, y: CTR_SPAWN.y, dir: "up", step: IDLE_BASE,
  walk: 0, t: 0,
  nearNpc: false,
  tipT: 0,
  waiting: false,       // 正在等协议把服务拉起来
  xbg: ""               // 学霸姐那边的登录结果："" / "ok" / "skip" / "down"
};
const CKEYS = Object.create(null);
const CTR_MOVE = { a: 1, d: 1, w: 1, s: 1,
                   arrowleft: 1, arrowright: 1, arrowup: 1, arrowdown: 1 };
const PCTR_START = "pixelcampus://start";              // 启动器注册的自定义协议

/* --- 7.5.9 判定：靠不靠近某间房 / 走进去了没有 ------------------------ */
function roomNear(R) {
  if (!R || !R.rect) return false;
  /* ⚠️ `player` 是主循环段（本段之后）的 `const` —— 运行时读没问题，加载期读会撞 TDZ。
       本函数只被 rAF / 事件调用，那时早已初始化。 */
  const p = player;
  if (!p) return false;
  const r = R.rect;
  return p.x > r.x - R.pad && p.x < r.x + r.w + R.pad
      && p.y > r.y - R.pad && p.y < r.y + r.h + R.pad;
}
/* 返回玩家当前靠近的房间；一圈都不沾则 null。
   ⚠️ 两间房的判定圈实测相隔 1700+ px（x 方向），不会同时命中。 */
function roomAt() {
  for (const k in ROOMS) if (roomNear(ROOMS[k])) return ROOMS[k];
  return null;
}
function roomFree(R, x, y) {
  const L = x - CTR_R, Rr = x + CTR_R, T = y - CTR_H2, B = y;
  if (L < CTR_WALL || Rr > CTR_W - CTR_WALL || T < CTR_WALL || B > CTR_H - CTR_WALL) return false;
  for (const s of R.solid)
    if (Rr > s[0] && L < s[0] + s[2] && B > s[1] && T < s[1] + s[3]) return false;
  return true;
}

/* --- 7.5.10 量尺寸 / 画 ------------------------------------------------ */
function ctrResize() {
  if (!ctrCv) return;
  ctrCv.width  = Math.max(320, window.innerWidth  || 320);
  ctrCv.height = Math.max(240, window.innerHeight || 240);
}
function ctrZoom() {
  if (!ctrCv) return 1;
  return Math.max(1, Math.min(Math.floor(ctrCv.width / CTR_W), Math.floor(ctrCv.height / CTR_H)));
}
function ctrDrawChar(g, spr, x, y) {
  g.drawImage(spr, Math.round(x) - CH_AX, Math.round(y) - CH_AY);
}
function ctrDraw() {
  if (!ctrCtx || !ctrCv) return;
  const R = CENTER.room;
  if (!R) return;
  const Z = ctrZoom();
  const ox = ((ctrCv.width - CTR_W * Z) / 2) | 0, oy = ((ctrCv.height - CTR_H * Z) / 2) | 0;
  const g = ctrCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#0b0d11"; g.fillRect(0, 0, ctrCv.width, ctrCv.height);
  g.setTransform(Z, 0, 0, Z, ox, oy);
  g.imageSmoothingEnabled = false;

  R.floor(g); R.walls(g); R.decor(g); R.door(g);

  /* ⚠️ 两个人按脚点 y 排序后画 —— 与主循环 `drawList` 同一条规矩，
       擦身而过时的前后遮挡才正确。 */
  const n = R.npc;
  const who = [
    { y: n.y,      f: () => ctrDrawChar(g, n.spr(n.dir, n.step), n.x, n.y) },
    { y: CENTER.y, f: () => ctrDrawChar(g, charSprite(CENTER.dir, CENTER.step), CENTER.x, CENTER.y) }
  ].sort((a, b) => a.y - b.y);
  for (const o of who) o.f();

  /* NPC 身边的交互光圈：走近了才亮，是"可以按 C 了"的第二重提示（第一重是底部那行字） */
  if (CENTER.nearNpc) {
    g.strokeStyle = n.ringCol; g.lineWidth = 2;
    g.beginPath(); g.ellipse(n.x, n.y - 1, 24, 10, 0, 0, Math.PI * 2); g.stroke();
  }
}

/* --- 7.5.11 每帧：走动 + 朝向 + 提示 ---------------------------------- */
function ctrUpdate(dt) {
  const R = CENTER.room;
  if (!R) return;
  if (CENTER.plat) return;                       // 平台铺着的时候房间冻住
  CENTER.t += dt;
  /* ⚠️ 等启动器的这段时间，提示条归 `ctrColdStart` 自己管 —— 不让这里的倒计时
     把它收走。不收的话"正在叫启动器…"会在 2 秒后消失，而用户还什么都没看见。 */
  if (!CENTER.waiting && CENTER.tipT > 0) {
    CENTER.tipT -= dt;
    if (CENTER.tipT <= 0 && ctrTipEl) ctrTipEl.hidden = true;
  }

  let dx = 0, dy = 0;
  if (CKEYS["a"] || CKEYS["arrowleft"])  dx -= 1;
  if (CKEYS["d"] || CKEYS["arrowright"]) dx += 1;
  if (CKEYS["w"] || CKEYS["arrowup"])    dy -= 1;
  if (CKEYS["s"] || CKEYS["arrowdown"])  dy += 1;
  const moving = !!(dx || dy);
  if (moving) {
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;
    const nx = CENTER.x + dx * CTR_SPEED * dt, ny = CENTER.y + dy * CTR_SPEED * dt;
    /* ⚠️ 两轴分开判：斜着撞墙时会顺着墙滑，而不是整个卡死（地图主循环同款做法）。
       ⚠️ 碰撞表是**当前房间**的 —— 引擎泛化后这里最容易出的错就是还读着计算机中心那张。 */
    if (roomFree(R, nx, CENTER.y)) CENTER.x = nx;
    if (roomFree(R, CENTER.x, ny)) CENTER.y = ny;
    if (Math.abs(dx) > Math.abs(dy)) CENTER.dir = dx < 0 ? "left" : "right";
    else                             CENTER.dir = dy < 0 ? "up" : "down";
    CENTER.walk += CTR_SPEED * dt;
    CENTER.step = Math.floor(CENTER.walk / CTR_STRIDE) % WALK_FRAMES;
  } else {
    /* 待机呼吸：与地图上的角色同一张相位表、同一个 IDLE_HZ，站姿节拍一致 */
    CENTER.step = IDLE_BASE + (Math.floor(CENTER.t * IDLE_HZ * 2) % IDLE_FRAMES);
  }

  /* NPC：站着不动，但**会转头看你** —— 走近时他面向你，是"他注意到你了"的无声提示 */
  const n = R.npc;
  const ax = CENTER.x - n.x, ay = CENTER.y - n.y;
  if (Math.abs(ax) > Math.abs(ay)) n.dir = ax < 0 ? "left" : "right";
  else                             n.dir = ay < 0 ? "up" : "down";
  CENTER.nearNpc = Math.hypot(ax, ay) < n.talkR;

  if (!ctrTipEl) return;
  if (CENTER.waiting) return;                    // 等协议那段时间的提示由它自己管
  if (CENTER.nearNpc) ctrTipMsg(n.talkTip, 0.35);
  else if (CENTER.tipT <= 0) ctrTipEl.hidden = true;
}
function ctrTipMsg(t, sec) {
  if (!ctrTipEl) return;
  ctrTipEl.textContent = t;
  ctrTipEl.hidden = false;
  CENTER.tipT = sec || 2;
}

let _ctrRaf = 0, _ctrLast = 0;
function ctrLoop(now) {
  _ctrRaf = 0;
  if (!CENTER.active) return;
  const dt = Math.max(0, Math.min(0.05, (now - _ctrLast) / 1000));
  _ctrLast = now;
  ctrUpdate(dt);
  if (!CENTER.plat) ctrDraw();
  _ctrRaf = requestAnimationFrame(ctrLoop);
}

/* --- 7.5.12 进出 ------------------------------------------------------ */
function roomEnter(R) {
  if (CENTER.active || !R) return;
  CENTER.room = R;
  CENTER.active = true;
  CENTER.x = R.spawn.x; CENTER.y = R.spawn.y;
  CENTER.dir = "up"; CENTER.step = IDLE_BASE;
  CENTER.walk = 0; CENTER.t = 0; CENTER.tipT = 0; CENTER.nearNpc = false;
  for (const k in CKEYS) CKEYS[k] = 0;
  /* ⚠️ 必须清主循环那张 `keys` 表：玩家可能是**边走边按 F** 进来的，
       不清的话那一下的移动惯性会留在表里，你在房间里逛的时候地图上的人还在走。
       （进了房间以后所有移动键都被本段吞掉，所以清这一次就够。） */
  for (const k in keys) keys[k] = 0;
  if (hudCtr) { hudCtr.textContent = ""; _hudctrLast = ""; }
  if (ctrCv) ctrCv.hidden = false;
  if (ctrHud) {
    ctrHud.hidden = false;
    /* ⚠️ 三个格子由**房间对象**填，不再硬编码在 HTML 里 —— 两间房共用一块 HUD，
       最容易出的错就是"人在逸夫楼、提示却说计算机中心"。 */
    if (ctrHudName) ctrHudName.textContent = R.name;
    if (ctrHudSub)  ctrHudSub.textContent  = R.sub;
    /* ⚠️ `hint` 是我们自己写死的常量（含 `<b>C</b>` 这类标记），不是用户输入。
       比一下再写：同一个字符串赋值也会产生一次 DOM 变更 + 样式重算。 */
    if (ctrHudHint && ctrHudHint.innerHTML !== R.hint) ctrHudHint.innerHTML = R.hint;
  }
  if (ctrTipEl) ctrTipEl.hidden = true;
  document.body.classList.add("ctr-on");
  ctrResize();
  _ctrLast = performance.now();
  if (!_ctrRaf) _ctrRaf = requestAnimationFrame(ctrLoop);
}
function roomLeave() {
  CENTER.active = false;
  if (CENTER.plat) ctrClosePlatform();
  if (_ctrRaf) { cancelAnimationFrame(_ctrRaf); _ctrRaf = 0; }
  for (const k in CKEYS) CKEYS[k] = 0;
  for (const k in keys) keys[k] = 0;
  if (ctrCv) ctrCv.hidden = true;
  if (ctrHud) ctrHud.hidden = true;
  if (ctrTipEl) ctrTipEl.hidden = true;
  document.body.classList.remove("ctr-on");
  /* ⚠️ 玩家在地图上的坐标**一个字不动** —— 他本来就站在进门前那个位置，
       出门就该回到原地，不许瞬移（用户第三十八轮在向导那边为同类问题报过 bug）。 */
}

/* --- 7.5.13 房间里的 App：同源 iframe --------------------------------- */
function ctrProbe(R) {
  /* 1.5 秒探一下那个服务在不在。⚠️ 不用 AbortSignal.timeout（老浏览器没有），
     自己搭 AbortController —— 这个页面要在各种机器上双击打开，不能赌版本。 */
  return new Promise(resolve => {
    let done = false;
    const fin = v => { if (!done) { done = true; resolve(v); } };
    try {
      const ac = new AbortController();
      const t = setTimeout(() => { try { ac.abort(); } catch (e) {} fin(false); }, 1500);
      fetch(R.probe, { signal: ac.signal })
        .then(r => { clearTimeout(t); fin(!!r && r.ok); })
        .catch(() => { clearTimeout(t); fin(false); });
    } catch (e) { fin(false); }
  });
}
function ctrOpenPlatform(R) {
  if (!ctrP) return;
  CENTER.plat = true;
  if (ctrTipEl) ctrTipEl.hidden = true;
  ctrP.hidden = false;
  /* ⚠️⚠️ 必须**比较过再 set**：第四十轮这里写的是 `!ctrF.getAttribute("src")`
     （只在第一次打开时设），于是"从计算机中心出来、进逸夫楼按 C"打开的**仍是刷题平台**。
     比较的是 `R.app` —— 引擎泛化后这是唯一知道该开哪扇门的地方。 */
  if (ctrF && ctrF.getAttribute("src") !== R.app) ctrF.setAttribute("src", R.app);
  ctrBindFrameEsc();
}
function ctrClosePlatform() {
  if (ctrP) ctrP.hidden = true;
  CENTER.plat = false;
  CENTER.waiting = false;
  _ctrLast = performance.now();                        // 免得回来第一帧 dt 巨大
}
/* ⭐ 免登录与 Esc 退出**都靠这一条**：同源 ⇒ 父页拿得到 iframe 内部的 document。
   跨源时这里会抛 SecurityError（被 catch 吞掉），那才是真的做不到。 */
function ctrFrameBindEsc() {
  if (!ctrF) return;
  try {
    const d = ctrF.contentDocument;
    if (!d || d.__pxEscBound) return;
    d.__pxEscBound = 1;
    d.addEventListener("keydown", e => {
      if (e.key === "Escape") { ctrClosePlatform(); e.preventDefault(); e.stopPropagation(); }
    }, true);
  } catch (err) { /* 跨源：拿不到就算了，用户还能用鼠标点平台自己的返回 */ }
}
/* ⚠️⚠️ 第四十轮的写法是**每次打开抽屉都 `ctrF.addEventListener("load", bind)`**，
   而 `bind` 是当场新建的函数对象 ⇒ 打开 N 次就叠 N 条 load 监听（永不回收）。
   现在改成：`load` 监听在**装配区绑一次**（本段末尾），这里只负责"已经加载完了"的
   那种情况 —— 抽屉第二次打开时 src 没变、不会触发 load，得当场补一次。 */
function ctrBindFrameEsc() {
  if (!ctrF) return;
  try {
    if (ctrF.contentDocument && ctrF.contentDocument.readyState === "complete") ctrFrameBindEsc();
  } catch (e) {}
}
function ctrTalk() {
  const R = CENTER.room;
  if (!R) return;
  if (!CENTER.nearNpc) { ctrTipMsg("先走到" + R.npc.name + "身边再按 C。", 2); return; }
  ctrProbe(R).then(ok => {
    if (ok) ctrOpenPlatform(R);
    else ctrColdStart(R);
  });
}
/* 服务没跑 ⇒ 请浏览器把启动器叫起来。⚠️ 网页**无法**自己执行本地程序（浏览器铁律），
   自定义协议是唯一合法的"网页拉起本地程序"通道；浏览器会弹一次「是否打开」。
   ⚠️ 正常路径下**根本走不到这里** —— 地图既然是从启动器打开的，服务必然在跑。 */
function ctrColdStart(R) {
  CENTER.waiting = true;
  ctrTipMsg(R.coldTip, 0);
  try { window.location.href = PCTR_START; } catch (e) {}
  let n = 0;
  const timer = setInterval(() => {
    n++;
    /* ⚠️ `waiting` 也一起判：用户可能在这段时间按 B 出屋、或者 App 已经被别的路径打开，
       不判的话这个定时器会在几十秒后**凭空把 App 再弹一次**。 */
    if (!CENTER.active || !CENTER.waiting) { clearInterval(timer); CENTER.waiting = false; return; }
    ctrProbe(R).then(ok => {
      if (ok) {
        clearInterval(timer);
        CENTER.waiting = false;
        if (ctrTipEl) ctrTipEl.hidden = true;
        ctrOpenPlatform(R);
      } else if (n >= 60) {
        clearInterval(timer);
        CENTER.waiting = false;
        ctrTipMsg("还没起来。手动双击一下「启动像素校园.bat」吧。", 8);
      }
    });
  }, 1500);
}

/* --- 7.5.14 登录门 -----------------------------------------------------
   作用只有一个：**把 token 种进 localStorage**。刷题平台跑在同一个源上，
   iframe 一加载，它的 Pinia store 从 localStorage 读到 token ⇒ 直接就是登录态。
   ⚠️ 这不是安全机制 —— 两个预设账号就明写在按钮上，它只是一道"仪式"。
   ⭐ 第四十一轮起这里还要**顺手把学霸姐那边也登一次**（同一套账号密码，
      登录一次进两边）—— 见 `xbgSync`。 */
const CTR_USERS = [
  { u: "admin", p: "admin123", n: "管理员" },
  { u: "user",  p: "user123",  n: "刷题者" }
];

/* ⭐⭐ 第四十一轮：一次登录进两边。
   学霸姐（xueba-ge，8010）走 Vite 的 `/xbg` 代理，与地图**同源**，
   所以她那边也认这一对账号密码。三步：

     ① `POST /xbg/api/login`     有号就登
     ② `POST /xbg/api/register`  401（还没这个号）⇒ 用**同一个密码**开一个

   ⚠️⚠️ **这个顺序本身就是安全设计**：`xbgSync` 只在"平台那一步
      （刷题平台自己的登录接口）已经返回 200 之后"才被调用 ⇒ 绝不会为没验证过的凭据开号。
      这也是**不预置账号**的理由 —— 再写一份 seed 就是第二处真相，密码一漂移没人知道。
   ⚠️ 三步**全都不阻塞进地图**：8010 没起来、register 冲突、凭据不满足她那边
      （nick≥2 或 pw≥4）……任何一样失败都只是 HUD 尾巴上多一句提示，
      地图照常玩；进逸夫楼时 iframe 会显示学霸姐**自己的**登录框（她内建了）。

   ⚠️⚠️⚠️ **`xbgSync` 有两个入口，缺一不可**。第一版只留了 ①，用户当场撞上：
     ① `doLogin` —— 刚在登录门上敲完账号密码，凭据就在手里。
     ② `xbgBootSync` —— 见它自己的注释（登录门**会自己藏起来**）。 */
const XBG_LOGIN = "/xbg/api/login", XBG_REG = "/xbg/api/register";
function xbgSave(t) { try { localStorage.setItem("xbg_token", t); } catch (e) {} }
function xbgPost(url, u, p) {
  return fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nick: u, password: p })
  }).then(r => r.json().then(j => ({ status: r.status, j: j })));
}
function xbgSync(u, p, left) {
  return xbgPost(XBG_LOGIN, u, p).then(res => {
    if (res.j && res.j.token) { xbgSave(res.j.token); return "ok"; }
    if (res.status === 401) {                       // 还没这个号 ⇒ 用同一个密码开一个
      return xbgPost(XBG_REG, u, p).then(r2 => {
        if (r2.j && r2.j.token) { xbgSave(r2.j.token); return "ok"; }
        return "skip";                              // 409（同昵称不同密码）/ 被拒
      }).catch(() => "skip");
    }
    return "skip";
  }).catch(() => {
    /* 8010 还在起来 —— 她要读 85 MB 向量，bind 完还要十几秒。
       退避重试 4 次（每次 3 秒，共约 12 秒），盖住启动器那条 40 秒等待的后半段。 */
    if (left > 0) return new Promise(r => setTimeout(r, 3000)).then(() => xbgSync(u, p, left - 1));
    return "down";
  });
}

/* ⚠️⚠️ 第四十一轮补丁（用户实测反馈）：**登录门会自己藏起来**。
     `loginGate()` 见到 `localStorage.token` 就直接 `loginEl.hidden = true; return;`
     （原话「24 小时内再来，直接进」）⇒ **`doLogin` 根本不会被调用**，
     `xbgSync` 也就永远不跑。而地图这个 token 是长期的，用户上一次登录可能是几天前 ——
     那时候还没有学霸姐。于是：人一路走进逸夫楼按 C，iframe 里的学霸姐读不到 `xbg_token`，
     弹出**她自己的**登录框。用户的原话就是「为啥给学霸姐对话需要我自己再登录」。

     ⇒ 登录门被跳过时**补一次同步**。补同步要密码，所以把凭据记在 `xbg_cred` 里。

     ⚠️ 是明文。之所以能接受：这道门**本来就不是安全机制** —— 两个预设账号
        （`admin/admin123`、`user/user123`）明写在 `#lgQuick` 按钮上，它只解决
        「进地图前得按一下」，不解决「防谁」。真正该当密钥看的两样
        （平台 JWT、学霸姐的 token）都不是这个。
     ⚠️ 用 `encodeURIComponent` 而**不是 `btoa`**：`btoa` 碰中文昵称直接抛异常；
        更要紧的是它**看起来像加密其实不是**，比明文更容易让后来人误判成"已保护"。 */
const XBG_CRED = "xbg_cred";
function xbgCredSave(u, p) {
  try { localStorage.setItem(XBG_CRED, encodeURIComponent(u) + "\n" + encodeURIComponent(p)); } catch (e) {}
}
function xbgCredLoad() {
  try {
    const s = localStorage.getItem(XBG_CRED) || "", i = s.indexOf("\n");
    if (i < 0) return null;
    const u = decodeURIComponent(s.slice(0, i)), p = decodeURIComponent(s.slice(i + 1));
    return (u && p) ? { u: u, p: p } : null;
  } catch (e) { return null; }
}
function xbgBootSync() {
  let tok = "", xt = "";
  try { tok = localStorage.getItem("token") || ""; xt = localStorage.getItem("xbg_token") || ""; } catch (e) {}
  /* ① 没登平台 ⇒ 页面还停在登录门上，`doLogin` 自己会同步，这里不用管。
     ② 学霸姐那边已经有票 ⇒ 没什么可补的（这是"已登录过"的常态，走这条最省事）。 */
  if (!tok || xt) return;
  const c = xbgCredLoad();
  if (!c) return;         // 第四十一轮之前登的会话，没留凭据 ⇒ 无解，等下回走登录门
  /* ⚠️ **不预先置 `CENTER.xbg`**：置成任何值都会被 `hudUserTick` 当成"结果回来了"，
     补同步那十几秒里会在 HUD 上闪一句「学霸姐没同步上」—— 可它还没失败呢。空串不显示尾巴。 */
  xbgSync(c.u, c.p, 6).then(st => { CENTER.xbg = st; hudUserTick(); });
}

function hudUserTick() {
  if (!hudUser) return;
  let u = null;
  try { u = JSON.parse(localStorage.getItem("user") || "null"); } catch (e) {}
  let t = (u && (u.nickname || u.username)) ? ("已登录 · " + (u.nickname || u.username)) : "";
  /* ⭐ 学霸姐那边的结果用一行尾巴说清楚。⚠️ 只在"平台登上了、她那边的结果也回来了"
     时才追加 —— 平台都没登就没有尾巴（否则会在地图上挂一句莫名其妙的话）。 */
  if (t && CENTER.xbg && CENTER.xbg !== "ok") {
    t += "　·　学霸姐" + (CENTER.xbg === "down" ? "没连上" : "没同步上");
  }
  hudUser.textContent = t;
  if (lgOut) lgOut.hidden = !t;
}
/* 两个预设账号按钮：**只绑一次**（加载期）。
   ⚠️ 绝不能放进 `loginGate()` 里 —— 那个函数**每登出一次就会被再调一次**，
      于是每轮往同一批按钮上再叠一条监听。叠到第三条时的症状是：
      点一下「管理员」，用户名被填上 → 被下一条清掉 → 再被最后一条填上，
      看起来像闪了一下；而"清空 → 重填"中间态在某些时序下会**留下空用户名**。
      这类"看起来能用、只是偶尔怪一下"的 bug 最难查，索性从结构上让它不可能发生。 */
(function bindQuick(){
  if (!loginEl) return;
  const btns = loginEl.querySelectorAll("#lgQuick button");
  for (const b of btns) {
    const on = () => {
      for (const o of btns) o.classList.remove("on");
      b.classList.add("on");
      if (lgU) lgU.value = b.getAttribute("data-u") || "";
      if (lgP) lgP.value = b.getAttribute("data-p") || "";
      if (lgMsg) lgMsg.textContent = "";
    };
    b.addEventListener("click", on);
  }
})();

function loginGate() {
  if (!loginEl) return;
  let tok = "";
  try { tok = localStorage.getItem("token") || ""; } catch (e) {}
  hudUserTick();
  if (tok) { loginEl.hidden = true; return; }        // 24 小时内再来，直接进
  loginEl.hidden = false;
  if (lgMsg) lgMsg.textContent = "";
  if (lgU) lgU.value = ""; if (lgP) lgP.value = "";
  /* 只清高亮，不重新绑监听（绑在加载期那一次就够） */
  for (const b of loginEl.querySelectorAll("#lgQuick button")) b.classList.remove("on");
  if (lgU) lgU.focus();
}
function doLogin() {
  if (!lgU || !lgP) return;
  const u = (lgU.value || "").trim(), p = lgP.value || "";
  if (!u || !p) { if (lgMsg) lgMsg.textContent = "用户名和密码都要填。"; return; }
  if (lgGo) { lgGo.disabled = true; lgGo.textContent = "登录中…"; }
  if (lgMsg) lgMsg.textContent = "";
  fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p })
  }).then(r => r.json()).then(res => {
    if (res && res.code === 200 && res.data && res.data.token) {
      const d = res.data;
      try {
        localStorage.setItem("token", d.token);
        /* ⚠️ 字段名必须与 campus_game 的 `stores/user.js:31-36` 一模一样
           （`{id, username, nickname, role}`）—— 那边 `setUser` 就是这么存的，
           路由守卫读的是 `user.role`，名字错了管理后台会被踢出来。 */
        localStorage.setItem("user", JSON.stringify({
          id: d.userId, username: d.username, nickname: d.nickname, role: d.role
        }));
      } catch (e) {}
      loginEl.hidden = true;
      hudUserTick();
      /* ⭐ 把凭据记下来：登录门**下次会自己藏起来**，那时候没有密码可问，
         只能靠这一份补同步（见 `xbgBootSync`）。 */
      xbgCredSave(u, p);
      /* ⭐ 平台这一步已经过了 —— **现在**才去动学霸姐（顺序反不得，见 xbgSync 的注释）。
         不 await：她那边要读 85 MB 索引，十几秒，绝不能拿它卡住进地图。 */
      xbgSync(u, p, 4).then(st => { CENTER.xbg = st; hudUserTick(); });
    } else {
      if (lgMsg) lgMsg.textContent = (res && res.message) || "登录失败，换个账号试试。";
    }
  }).catch(() => {
    if (lgMsg) lgMsg.textContent = "连不上后端（8081）。先双击「启动像素校园.bat」。";
  }).then(() => {
    if (lgGo) { lgGo.disabled = false; lgGo.textContent = "进入像素校园"; }
  });
}
function doLogout() {
  try {
    localStorage.removeItem("token"); localStorage.removeItem("user");
    /* ⚠️⚠️ 第四十一轮：**必须一并清 `xbg_token`**。只清平台那两个的话，换账号后
       进逸夫楼会**以上一个账号的身份**自动进去（iframe 直接从 localStorage 读到旧 token）。
       这条第四十轮没有 —— 因为那时候还没有第二个系统。 */
    localStorage.removeItem("xbg_token");
    /* ⚠️ `xbg_cred` 同样要清，而且**比 `xbg_token` 更不能漏**：它是明文账号密码，
       留着的话下一个在这台机器登录的人，会被 `xbgBootSync` 拿去
       **以旧账号的身份**去登学霸姐（顺带把她那边的 token 也写回来）。 */
    localStorage.removeItem(XBG_CRED);
  } catch (e) {}
  /* cookie 那份 JS 删不掉（HttpOnly，读不到也改不了）⇒ 叫服务自己删。
     fire-and-forget：删不掉也不该拦着人退登。 */
  try { fetch("/xbg/api/logout", { method: "POST" }).catch(() => {}); } catch (e) {}
  CENTER.xbg = "";
  hudUserTick();
  loginGate();
}

/* --- 7.5.15 按键 -------------------------------------------------------
   ⚠️⚠️ **注册时机是本轮最要紧的一件事**：本段排在 `72_guide.js` **之前** ⇒ 这个监听
       比向导那条、比主循环的 WATCHED、比补丁 7 的缩放**都早注册**。
       window 上同 target 的监听按注册顺序触发，所以这里的 `stopImmediatePropagation()`
       能把它们一起挡在门外 —— 室内按 Esc 才不会去触发向导那张四档梯子。

   策略分三层（顺序不能反）：
     ① App iframe 铺着   → 网页这边一概不管（焦点在 iframe 里，Esc 由 7.5.13 那条接）
     ② 在房间里          → **所有键都吞**，移动键自己收进 CKEYS、B/C/Esc 自己办。
                            ⭐ 全吞是必须的：既让地图玩家**完全冻结**（探针 C3），
                               又顺手把向导整套（E 叫人 / Esc 梯子 / 方向键关面板）关掉。
     ③ 在地图上          → **只认 F，而且必须站在某间房的门口**，其余一律放行。
                            ⚠️ 放行是新旧玩法共存的前提：向导、缩放、移动一个字都不能受影响。 */
window.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  const k = (e.key || "").toLowerCase();

  if (CENTER.plat) return;                       // ① 交给 iframe

  if (CENTER.active) {                           // ② 房间
    if (CTR_MOVE[k]) { CKEYS[k] = 1; e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (k === "b") { roomLeave(); }
    else if (k === "c") { ctrTalk(); }
    e.preventDefault(); e.stopImmediatePropagation();
    return;
  }

  if (k === "f" && !e.repeat) {                  // ③ 地图：进门
    const R = roomAt();
    if (R) {
      roomEnter(R);
      e.preventDefault(); e.stopImmediatePropagation();
    }
  }
}, false);

window.addEventListener("keyup", e => {
  if (!CENTER.active) return;
  const k = (e.key || "").toLowerCase();
  if (CTR_MOVE[k]) { CKEYS[k] = 0; e.preventDefault(); e.stopImmediatePropagation(); }
}, false);
window.addEventListener("blur", () => { for (const k in CKEYS) CKEYS[k] = 0; });

/* --- 7.5.16 起搏：地图上的「按 F」提示 --------------------------------
   本段不改主循环，所以自带一个极轻的常驻 rAF：只判一次坐标、只写一个 textContent。 */
let _hudctrLast = null;
function ctrHudPulse() {
  if (!CENTER.active && hudCtr) {
    const R = roomAt();
    const t = R ? R.enterTip : "";
    /* ⚠️ 比一下再写：textContent 赋同一个值也会产生一次 DOM 变更 + 样式重算，
       这个循环是 60Hz 常驻的，不缓存就等于让浏览器每秒白算 60 次。 */
    if (t !== _hudctrLast) { hudCtr.textContent = t; _hudctrLast = t; }
  }
  requestAnimationFrame(ctrHudPulse);
}

/* --- 7.6.1 学霸姐的精灵：长发、藕荷紫外套 ---------------------------------

   ⚠️ 四个角色的识别色必须两两拉开 —— 玩家蓝 `#3f6ea8`、小北红 `#c0392b`、

   ---------------------------------------------------------
   ⚠️ demo 的 §3.5 思源楼段是**逐字节冻结**的（build.py 末尾有 assert），
      一个字都不能改。所以这里走"覆盖重绘"：拿到 makeSiyuan() 返回的 canvas，
      把 native y<100 那一整块先擦掉，再按照片重画。
      唯一调用点是 60_assemble.js §6.3 里那行 siyuanRestyle(s.canvas, 1.5)
      —— 它插在 makeSiyuan 之后、addProp 之前，挪位置就会前功尽弃。

   擦掉是安全的：这一块在精灵图里不是天空（透明）就是楼顶那几件自己画的东西，
   clearRect 之后是干净的透明，草地/天空由地面层提供，不会擦出黑洞。
   擦除范围 y<100（= 窗顶 WIN_TOP），下面的墙、窗、瓷砖缝、幕墙主体一律不动。

   ---- 原版哪里不对（对照 建筑物照片/siyuanlou2.jpg 逐项量出来的）----
   ① 题字飘在天上：原版把六个字画在 native y 52..76，而楼体顶边 ROOF_Y=84
      —— 字其实在屋面以上 32px 的**天空**里，只有中央那根白塔柱从字缝穿过。
      照片里字是画在**楼体顶部那条白色题字带**上的，是楼的一部分。
   ② 题字带太薄：照片里这条带占楼高约 16%，原版只有 9%（84..100，16px），
      而且蓝玻璃幕墙从 native 94 就起头，比窗顶高 6px 戳进带里，
      干净的白带只剩 10px。照片里幕墙顶与窗顶齐平 → 屋面抬到 ROOF_Y=72。
   ③ 中央塔不是塔：原版是一根**直上直下的白筒**（宽 26，占楼宽 8.7%）顶个平盖，
      照片里是**方锥攒尖顶**（底宽 70 = 楼宽 23%，比高还宽），顶上一个圆灯笼，
      灯笼上再挑几根细天线针。两侧角亭照片里也有小攒尖顶，原版是平顶方块。

   ---- 照片实测（整楼宽 1255px ↔ 我们 300 native，约 4.2px/native）----
       题字带       y 680..810     → 带高约 28 native（占楼高 16%）
       题字         320×60 px      → 70.7×14 native（占整楼宽 25.5%）
       中央攒尖顶   295×100 px     → 70×23 native，檐口比锥体再外挑 2
       灯笼         75×85 px       → 12×9 native（+ 深色圈 + 小穹顶）
       天线针       105 px         → 照片 24 native，这里压到 15（见下）
       两侧角亭     墩宽 145px、高出屋面 90px → 墩 34×18 native，攒尖顶再 10
       锥面小窗     120×75px      → 20×8 native（照片里锥面下缘正中那扇）
   唯一没照搬的是**天线针**：照片里灯笼+针共 44 native，屋面抬到 72 之后到画布
   上缘只剩 58；攒尖顶是主角、保持原比例，针是几根 1px 线、压短观感不变。

   ---- 第十五轮（2026-09-17）：主楼加高 5 层 ----
   用户：「思源主楼的高度提高 5 层，加五层窗户」。加高**只能**在精灵上做：
   画布加高 SY_GROW 行 → 旧内容的下半段整体下移 → 新区画 5 层 → 把 s.ay 一起挪。
   落地线世界 y 1431.6 一动不动，楼只往屏幕上方长高，碰撞盒与深度排序都不用碰。
   ⚠️ 层高必须用思源楼**自己的** 17 native（×1.5 = 25.5 行），不能用全校
      FLOOR_H = 34：同一面墙上两套层高，加出来的窗排与下面十层会错槽（每层差 8.5 行）。
   ⚠️ SY_GROW 必须是整数：drawImage 的下移量落半像素会把整条边缘糊掉。
   ========================================================= */

/* 点阵解码（与本 part 的生成块配套，刻意不借 49_southgate.js 的 sgBits：
   那份数据是南门专用，两边各自独立，谁改动都不会牵连对方）。
   位序 MSB-first，与 _build/_syfont.py 的 b64() 严格对应。 */
function syBits(b64, cnt) {
  const raw = atob(b64), out = new Uint8Array(cnt);
  for (let i = 0; i < cnt; i++) out[i] = (raw.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  return out;
}

/* --- 5.1.1 覆盖重绘（由 60_assemble.js §6.3 调用一次） ---

      （60_assemble.js §6.3 那行 `addProp(Object.assign({}, s, { x: ax, y: ay }))`），

function siyuanRestyle(s, S) {
  const C = SY_COL;
  /* 几何常量与 §3.5 逐字同源，否则重画的东西会与楼体错位。
     只有 ROOF_Y 是**故意改的**：84 → 72（题字带 9% → 15%）。 */
  const BL = 60, BR = 360, ROOF_Y = 72, WIN_TOP = 100;
  const TX = (BL + BR) / 2;                                 // 建筑水平中心 = 210
  const GC = 209;                                           // 瓷砖缝对称轴（同 §3.5）
  const GLASS_L = 196, GW = 26;                             // 玻璃幕墙
  const SX0 = 56, SY0 = 14;

  const cut = Math.round(Y(WIN_TOP));                       // 129：题字带底 = 老墙顶

  const src = s.canvas;
  const c = mkCanvas(src.width, src.height + SY_GROW);
  const g = c.getContext("2d");

  const P = (x, y, w, h, col) => px(g, X(x), Y(y), w * S, h * S, col);
