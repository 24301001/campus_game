/* =========================================================
   4.5 水域
   ---------------------------------------------------------
   静态底烘焙进地面（paintWaterBase），动态层每帧现画（drawWater）：
   正弦波纹 + 鱼影 + 鸭子划水。动态层插在地面之后、道具之前 ——
   这样人物/树/建筑仍然压在水的上方，遮挡关系不掉。

   水位不参与深度排序（是贴地层），所以这里必须严格限制在池内绘制。
   ========================================================= */
const WATER = CAMPUS.filter(e => e[1] === "water").map(e => ({
  x: IX(e[2]), y: IX(e[3]), w: IX(e[4]), h: IX(e[5])
}));
let waterT = 0;
const ducks = [];
const fishes = [];
/* 水里的障碍（湖心岛 / 石塔）的落地范围，由 56_minghu.js 在 addSolid 时同步登记
   （见 §4.5.3d）。放这里而不是 45 自己算：岛屿的足迹表达式已经在 56 里了，
   抄一份过来迟早会和那边漂开。 */
const WATER_AVOID = [];

/* --- 鸭子的活动域（第七轮：从"湖面"扩到"湖面 ∪ 南岸石板路"） ---
   用户：「鸭子可以上岸走动或者下水，只能在湖里和下方的小广场活动」。
   ⚠️ 关键在于**湖与广场的 x 范围是同一个表达式**（都是 IX(7.0104)/IX(0.6972)，
      湖底 1328.01 与广场顶 1328.01 严丝合缝）⇒ 两者并集在几何上**就是一个矩形**，
      所以这里能直接读 WATER[0] 的 x/w，不需要写"两块区域的合并"那种判据。
   南界 = 89 * CELL = 1424，是石板路**画出来的**南缘，不是 ARTERY 声明的 1431.62 ——
      cy89（y1424..1440）那一格被后声明的「东西主路」抢走了（坑：同格重叠谁后盖）。
      再往南是沥青主路，鸭子不该上马路。
   ⚠️ 只改这里不改轨道是没用的：鸭子会一辈子在湖北半部绕圈（见 spawnDucks）。 */
const DUCK_AREA = { x: WATER[0].x, y: WATER[0].y, w: WATER[0].w,
                    h: 89 * CELL - WATER[0].y };
/* 湖的南岸线（= 石板路北缘）。鸭子越过它就算"上岸"，换陆地版精灵（见 animateWater）。 */
const WATER_S = WATER[0].y + WATER[0].h;

/* 惊走参数（世界像素 / 每秒）。⚠️ 上升快（RISE）回落慢（FALL）—— 这是用户要的
   "看到人会跑走，游远了再慢慢游回来"的全部实现：外扩用 RISE、归位用 FALL。
   safe 是警戒半径（人进这个圈就开始慌），run 是满恐慌时额外游出的距离。 */
const DUCK_SAFE = 64, DUCK_RUN = 46, DUCK_RISE = 3.2, DUCK_FALL = 0.45;
const FISH_SAFE = 40, FISH_RUN = 60, FISH_RISE = 4.0, FISH_FALL = 0.35;

/* --- 4.5.1 静态底 --- */
function paintWaterBase(g, rng) {
  for (const R of WATER) {
    const x = Math.round(R.x), y = Math.round(R.y), w = Math.round(R.w), h = Math.round(R.h);

    /* 岸边湿土带（比水面外扩一圈） */
    px(g, x - 7, y - 7, w + 14, h + 14, "#6d6151");
    px(g, x - 4, y - 4, w + 8, h + 8, "#5d5344");

    /* 水面：由外向内 4 圈浅化 */
    px(g, x, y, w, h, "#2E6E9E");
    const steps = 4, sx = [0.030, 0.058, 0.088, 0.116], sy = [0.045, 0.086, 0.130, 0.170];
    for (let i = 0; i < steps; i++) {
      const ix = Math.round(w * sx[i]), iy = Math.round(h * sy[i]);
      px(g, x + ix, y + iy, w - ix * 2, h - iy * 2, mix("#2E6E9E", "#7FB4D8", 0.16 * (i + 1)));
    }
    /* 岸线：外侧亮、内侧暗 */
    px(g, x, y, w, 2, "rgba(255,255,255,0.16)");
    px(g, x, y, 2, h, "rgba(255,255,255,0.10)");
    px(g, x, y + h - 3, w, 3, "rgba(8,22,36,0.40)");
    px(g, x + w - 3, y, 3, h, "rgba(8,22,36,0.32)");

    /* 静态鳞光（动态波浪之上还会叠亮线） */
    for (let i = 0; i < (w * h) / 5200; i++) {
      const px0 = x + 8 + rng() * (w - 16), py0 = y + 8 + rng() * (h - 16);
      px(g, px0, py0, 3 + rng() * 7, 1, "rgba(200,230,245,0.30)");
    }
    /* ⚠️ 这里原本还有一句"池心最深处压暗，做出有深度" —— 在湖心盖一个**正圆**：
       `circlePx(g, 湖心x, 湖心y, Math.min(w, h) * 0.30, 半透明深蓝)`，半径取湖短边的三成。
       明湖缩小之后（第三轮）这个半径 ≈82，占到湖宽的一大半，而湖是长方形 ⇒ 画面上
       就是一个**贴上去的暗色圆盘**。用户 2026-09-13：「把湖中间那个暗色的圆形图标
       去掉，有碍观瞻」。
       **直接删掉、不再用别的东西替代**：深度/层次交给上面那 4 圈"由岸向心浅化"负责 ——
       那套设计的意图本来就是"湖心更亮"，再叠一层方向相反的压暗圆，两者在打架。
       （删这一句不消耗 rng，所以鳞光与全校园地面噪声逐字节不变。注释里的颜色值故意
       拆成"半透明深蓝"四个字 —— build.py 有一条否定断言直接 grep 那个 rgba 字面量，
       抄进来会把注释本身当成目标。） */
  }
}

/* --- 4.5.1b 离岸深度 → 淹没比例 ---
   水面本身**没有任何深度数据**。⚠️ 别去打 CELLK 的主意：水格是 floor 盖的
   （x2736..3024 / y1008..1344），比这里画出来的水面（2738.2..3010.5 / 1016.9..1328.0）
   整整大一圈，拿它当深度边界会得到"站在岸上就已经在池心"的荒唐结果。

   判据与 paintWaterBase 那 4 圈由岸向心的浅化**同源**：都是"沿两个轴的对称内缩"。
   于是画面越深的地方，水也淹得越深 —— 观感与物理不会打架（这是刻意的：
   单独拍一个深度公式很容易做出"看着浅其实淹到腰"的错位）。

   ⚠️ 贴岸与岸上**自动收敛到 0**，所以"裁掉的部分露出的是岸不是水"这个边界情况
      不需要额外夹取：裁掉的比例与离岸距离同源，贴岸时几乎不裁。 */
function lakeDepth(x, y) {
  const R = WATER[0];
  if (x < R.x || x > R.x + R.w || y < R.y || y > R.y + R.h) return 0;   // 岸上 → 不淹
  const u = Math.min(x - R.x, R.x + R.w - x) / (R.w * 0.5);
  const v = Math.min(y - R.y, R.y + R.h - y) / (R.h * 0.5);
  return Math.min(1, Math.min(u, v));                 // 0 = 贴岸，1 = 池心
}
/* 湖心最深 = 半个身子（用户指定）。返回值是**占精灵全高的比例**，
   落笔时 `cut = Math.round(CH_H * lakeSubmerge(x, y))` 就是这么用的。

   行预算（`buildChar(6)` 的实际行位，改裁切量之前先回 50_char.js 核一遍）：
     0 顶空 / 1-6 头 / 7 颈 / 8-16 躯干（**16 = 衣摆**）/ 17-24 腿 / 25-26 鞋
     / 27-29 接地影（锚点 CH_AY=27 以下那三行）
   湖心 subm=0.5 → cut=15 → 可见 0..14 行，水线落在**第 15 行**（衣摆稍上、腰的位置）。
   贴岸 subm→0 → cut→0，连接地影都不裁 —— 岸上那一套（含影子）原样保留。

   ⚠️ 别把上界写成"裁掉 CH_AY 行"之类：那三行影子在**锚点以下**，是"落地接触影"，
      人一进水它就该消失（影子画在水面上才假）。这里的比例式会让它在前 0.2 的深度里
      自然淡出（cut 0→3），比"一进水就整块没"更顺眼。 */
const SUBMERGE_MAX = 0.5;
function lakeSubmerge(x, y) { return SUBMERGE_MAX * lakeDepth(x, y); }

/* --- 4.5.1c 水线涟漪 ---
   入水时贴在**淹没线**上的一圈亮弧。只做裁切的话，"淹没"唯一的线索就是身体被一条
   直线切断，缩到 1× 以下根本读不出来；一圈亮环一眼就懂。
   它同时还有第二个作用：压住裁切边的硬直边（环的上半圈落在身体最下面一两行上）。

   ⚠️ 这个函数**在 render() 的落笔循环里、紧跟角色那一笔之后调用**，不是独立道具：
      做成 drawList 项就要跟角色抢 baseY 排序（同 baseY 是"靠 sort 稳定性"的隐性契约，
      不同 baseY 又会插到别的道具前后，两种都是雷）。
      紧跟角色落笔的另一个好处是遮挡天然正确 —— 排在角色之后（更靠南）的道具照样盖住它。
   ⚠️ cy 必须算在**裁切边**上（`dy + (img.height - cut) * z`），不是锚点行。
      写成锚点行 `(player.y - oy) * z` 会让亮环浮到身体上方 CH_AY=27 像素的胸口位置 ——
      这是本功能里最典型的"三套验收全绿、画面上明显错"。 */
function drawSwimRing(g, it, dx, dy, cut, z) {
  const cx = dx + Math.round(it.ax * z);
  const cy = dy + (it.img.height - cut) * z;              // ← 裁切边，不是锚点行
  /* 半径呼吸：水线是一圈在扩的波，不是一根固定的箍 */
  const rx = Math.max(2, Math.round((it.img.width / 2 + 1.5 + 0.5 * Math.sin(waterT * 2.6)) * z));
  const ry = Math.max(1, Math.round(rx * 0.585));         // 水平面在屏上的压扁比（同 MH_HEX_K）
  for (let i = -ry; i <= ry; i++) {
    const t = 1 - (i / ry) ** 2;
    if (t <= 0) continue;
    const hw = Math.round(rx * Math.sqrt(t));
    if (hw < 1) continue;
    /* 北半圈亮、南半圈偏青（光自左上）—— 一圈同色会读成"箍"而不是"波" */
    const col = i < 0 ? "rgba(226,244,255,0.52)" : "rgba(150,196,226,0.42)";
    px(g, cx - hw, cy + i, 1, 1, col);
    px(g, cx + hw, cy + i, 1, 1, col);
    if (hw > 2) { px(g, cx - hw + 1, cy + i, 1, 1, col); px(g, cx + hw - 1, cy + i, 1, 1, col); }
  }
}

/* --- 4.5.2 动态层（每帧） ---
   ox/oy = 相机世界原点（主循环已取整），z = 缩放倍率。
   本函数内部**一律用背板量纲**：世界值减 ox 之后乘 z。 */
function drawWater(ox, oy, z) {
  for (let k = 0; k < WATER.length; k++) {
    const R = WATER[k];
    const sx0 = Math.round((R.x - ox) * z), sy0 = Math.round((R.y - oy) * z);
    const w = R.w * z, h = R.h * z;
    if (sx0 > VIEW_W || sx0 + w < 0 || sy0 > VIEW_H || sy0 + h < 0) continue;

    ctx.save();
    ctx.beginPath();
    ctx.rect(sx0, sy0, w, h);
    ctx.clip();

    /* 正弦亮线。缩得很小时（<0.2×）行距会掉到 1.2px，几十条半透明亮线叠起来
       只会把整池糊成一片灰白 —— 静态烘焙早就把湖色画好了，这一层直接省掉，只留鱼影。 */
    if (z >= 0.2) {
      const RP  = Math.max(3, 13 * z);              // 行距：缩小时不小于 3px，否则同样糊
      const lw  = Math.max(1, Math.round(z));       // 线厚：原先恒 1px，放大后成了发丝
      const step = 26 * z;
      const rows = Math.ceil(h / RP) + 2;
      const drift = (waterT * 5 * z) % RP;          // 相位周期必须跟行距同步，否则上浮会跳
      for (let r = 0; r < rows; r++) {
        const yy = Math.round(sy0 + r * RP + drift);
        const a = 0.07 + 0.07 * Math.sin(waterT * 1.1 + r * 0.9);
        if (a <= 0.02) continue;
        ctx.fillStyle = "rgba(198,232,248," + a.toFixed(3) + ")";
        for (let x = 0; x < w; x += step) {
          const seg = (10 + 8 * Math.sin(waterT * 0.8 + r * 1.7 + x * 0.05)) * z;
          const off = Math.round(6 * Math.sin(waterT * 0.45 + r * 0.6 + x * 0.02) * z);
          ctx.fillRect(sx0 + x + off, yy, Math.max(1, seg), lw);
        }
      }
    }

    /* 鱼影：只露一团深色，位置由 animateWater 推进（世界坐标 → 背板量纲）。
       ⚠️ 鱼**必须留在这个函数里画**，不能升级成道具：鱼在水下、人站在水面上，
          鱼影就该在人的脚底下。做成 props 会参与 baseY 排序，站到鱼南边时鱼会浮到人身上。 */
    const fw = Math.max(1, Math.round(7 * z)), fh = Math.max(1, Math.round(3 * z));
    const tw = Math.max(1, Math.round(3 * z)), th = Math.max(1, Math.round(z));
    ctx.fillStyle = "rgba(10,30,52,0.30)";
    for (const f of fishes) {
      const fx = Math.round((f.x - ox) * z), fy = Math.round((f.y - oy) * z);
      ctx.fillRect(fx, fy, fw, fh);
      ctx.fillRect(fx + Math.round((f.dir > 0 ? 7 : -3) * z), fy + th, tw, th);
    }
    ctx.restore();
  }
}

/* --- 4.5.3 鸭子（道具，参与深度排序） --- */
/* land=false → **水面版**：泡在水里，身子压到水线下、拖一道水痕。
   land=true  → **走路版**：站在地上，身子抬高 3 行，下面长出两条橙色的腿与脚蹼。
   ⚠️ 只把水痕换成接地影是不够的 —— 用户 2026-09-13：「鸭子上岸是用腿走路，不是游动」。
      没有腿的鸭子站在砖面上依然是"漂"着的，一眼假。所以两版的**身体整套差 3 行**：
      水面版 dy=3（下沉），走路版 dy=0，走路版空出的 y11..13 正好画腿。
   ⚠️ 两版必须共用 16×16 画布与同一个锚点 ay = 14（= 落地线那一行）—— spawnDucks 只存
      一份 w/h/ax/ay，两版尺寸不一致另一版就会画歪。水面版的绝对落点**逐像素与旧版相同**
      （旧 16×13 / ay 11 / 身顶画布 y5 ⇒ 世界 y−6；新 16×16 / ay 14 / 身顶画布 y8 ⇒ 同式）。
   ⚠️ 原形参 `seed` 是个**死参数**（函数体从头到尾没引用过它，三只鸭子本来就是同一张
      图）—— 第七轮顺手换成有意义的 land，调用点只有 spawnDucks 一处。 */
function makeDuck(land) {
  const c = mkCanvas(16, 16), g = c.getContext("2d");
  const dy = land ? 0 : 3;                       // 身体整套的纵向偏移（见上）
  if (land) {
    px(g, 2, 13, 11, 1, "rgba(24,20,16,0.22)");        // 接地影
    /* 两条腿**一长一短**：后腿撑地（落到落地线 y14）、前腿抬起 1px —— 两腿等长就是
       "立正站着"，有腿也读不出"走路"。长短差 1px 在 1× 下是 1 像素，3× 下看得清。 */
    px(g, 4, 11, 2, 3, "#c8862e");                     // 后腿（支撑脚，背光偏暗）
    px(g, 9, 11, 2, 2, "#e0a03a");                     // 前腿（抬起）
    px(g, 3, 14, 4, 1, "#b87c28");                     // 后脚蹼（踩在落地线上）
    px(g, 8, 13, 4, 1, "#d0902f");                     // 前脚蹼（离地 1px）
  } else {
    px(g, 1, 13, 13, 2, "rgba(8,22,36,0.34)");         // 水面版：水痕
  }
  px(g, 2, 5 + dy, 9, 6, "#e8e4d8");                   // 身
  px(g, 3, 5 + dy, 7, 3, "#f4f1e8");
  px(g, 2, 10 + dy, 9, 1, "#bfb9a8");
  px(g, 9, 2 + dy, 5, 4, "#e8e4d8");                   // 头
  px(g, 10, 3 + dy, 3, 2, "#f4f1e8");
  px(g, 13, 3 + dy, 3, 2, "#d99a3c");                  // 喙
  px(g, 13, 3 + dy, 3, 1, "#eab24f");
  px(g, 11, 3 + dy, 1, 1, "#2c2b28");                  // 眼
  px(g, 3, 7 + dy, 6, 1, "#cfc9b8");                   // 翅
  return { canvas: c, ax: 8, ay: 14, w: 16, h: 16 };
}

/* --- 4.5.3b 鱼（有状态的水下实体，但**不是道具** —— 见 drawWater 里的注释） --- */
function spawnFish() {
  /* ⚠️ 自带种子，**不许蹭 §6.7 传进来的 rng**：§6.7 之后 §6.6d 落叶还要吃同一股
     随机流，这里多抽几次就会把落叶整个重掷（历史上"改水域重掷全校园地面噪声"同因）。 */
  const rng = makeRng(20260914);
  for (const R of WATER) {
    for (let i = 0; i < 3; i++) {
      const f = {
        area: R, safe: FISH_SAFE, run: FISH_RUN, rise: FISH_RISE, fall: FISH_FALL,
        cx: R.x + R.w * (0.30 + 0.20 * i), cy: R.y + R.h * (0.28 + 0.22 * i),
        rx: R.w * 0.24, ry: R.h * 0.26, ph: rng() * 6.28, sp: 0.20 + i * 0.05,
        sc: 0, dir: 1, x0: 0, y0: 0, x: 0, y: 0
      };
      f.x0 = f.x = f.cx; f.y0 = f.y = f.cy;
      fishes.push(f);
    }
  }
}

/* --- 4.5.3b2 水里的障碍：把落点推出岛与塔 ---
   **这是一处既存缺陷，不是本轮改出来的**：鸭子与鱼的轨道本来就穿过湖心岛和石塔 ——
   鸭 1 的轨道心 (2819.9, 1104.0) 正落在岛的落地范围 2758..2850 / 1046..1108 之内；
   鸭 3 的轨道心 (2928.8, 1240.9) 紧贴石塔 2928..2948 / 1245..1253。本轮给岛和塔补了
   碰撞盒（§5.6.6）之后，人绕得过去、鸭子却照样穿石而过，会变得格外刺眼，一并收掉。

   做法是**推出**而不是改轨道：轨道公式一个数都不动，只在落点落进障碍里时，沿
   "穿得最浅"的那条轴推出去 —— 永远推最短的路，鸭子才会贴着石头滑过去而不是弹开。
   人在远处时 o.sc=0 ⇒ 落点与旧版逐像素相同，这处修复对远景零影响。 */
function avoidPush(x, y) {
  const M = 6;                                          // 离石头的余量（世界像素）
  for (const b of WATER_AVOID) {
    const x0 = b.x0 - M, x1 = b.x1 + M, y0 = b.y0 - M, y1 = b.y1 + M;
    if (x <= x0 || x >= x1 || y <= y0 || y >= y1) continue;
    const dl = x - x0, dr = x1 - x, du = y - y0, dd = y1 - y;
    const k = Math.min(dl, dr, du, dd);
    if (k === dl) x = x0; else if (k === dr) x = x1;
    else if (k === du) y = y0; else y = y1;
  }
  return [x, y];
}

/* --- 4.5.3c 恐慌包络（鸭与鱼共用） ---
   人靠近 → 迅速外扩；人走开 → 缓慢漂回原轨道。**上升快、回落慢正是用户要的
   "游远了再慢慢游回来"** —— 不需要额外的状态机与目标点，包络本身就是那件事。

   ⚠️ 方向必须取**轨道点**（x0/y0，不含惊慌位移）指向玩家的反方向，不能取当前位置 ——
      当前位置已经含了外扩量，再拿它算方向就是正反馈，人会眼睁睁看着鸭子一路顶到湖岸。
   ⚠️ 出口一律按湖面矩形内缩 M 夹一次：鸭子不会游上岸。 */
function panicStep(o, dt, px_, py_) {
  const dxo = o.x0 - px_, dyo = o.y0 - py_;
  const dist = Math.hypot(dxo, dyo) || 1;
  const want = dist < o.safe ? 1 - dist / o.safe : 0;
  o.sc += (want - o.sc) * (want > o.sc ? o.rise : o.fall) * dt;
  if (o.sc < 0) o.sc = 0; else if (o.sc > 1) o.sc = 1;
  /* ⚠️ 字段叫 `area` 而不是 `lake`：对鱼它是湖面，对鸭子它是"湖面 ∪ 南岸石板路"。
     继续叫 lake 的话，下一个人会以为鸭子还泡在水里 —— 而第七轮之后它会上岸。 */
  const R = o.area, k = o.sc * o.run / dist, M = 10;
  let x = o.x0 + dxo * k, y = o.y0 + dyo * k;
  if (x < R.x + M) x = R.x + M; else if (x > R.x + R.w - M) x = R.x + R.w - M;
  if (y < R.y + M) y = R.y + M; else if (y > R.y + R.h - M) y = R.y + R.h - M;
  /* 最后再躲一次水里的障碍（第六轮是岛与塔，第七轮加上了影壁 / 月亮门门垛 / 假山）。
     这一步必须在活动域夹取**之后**：否则被夹回边界的落点会重新落进障碍里。 */
  return avoidPush(x, y);
}

function spawnDucks(rng) {
  const A = DUCK_AREA;                                  // 活动域 = 湖面 ∪ 南岸石板路
  const sW = makeDuck(false), sL = makeDuck(true);      // 水面版 / 陆地版（见 makeDuck 头注）
  for (const R of WATER) {
    for (let i = 0; i < 3; i++) {
      const d = {
        img: sW.canvas, imgR: sW.canvas, imgL: flipH(sW.canvas),
        landR: sL.canvas, landL: flipH(sL.canvas), dir: 1,
        ax: sW.ax, ay: sW.ay, w: sW.w, h: sW.h,
        area: A, safe: DUCK_SAFE, run: DUCK_RUN, rise: DUCK_RISE, fall: DUCK_FALL,
        /* 圆心与半轴照**活动域**算，不能照湖面（R）：照 R 的话三只鸭子永远只在湖北半部
           绕圈，南边那 96px 宽的砖面一辈子等不来一只鸭子 —— 而用户这轮要的正是
           「上岸走动」。rx 仍取 A.w*0.24，因为 A.w === R.w 本来就同源（§4.5.3d）。 */
        cx: A.x + A.w * (0.30 + 0.20 * i), cy: A.y + A.h * (0.28 + 0.22 * i),
        rx: A.w * 0.24, ry: A.h * 0.22, ph: rng() * 6.28, sp: 0.16 + rng() * 0.12,
        sc: 0, x0: 0, y0: 0, x: 0, y: 0, baseY: 0
      };
      d.x0 = d.x = d.cx; d.y0 = d.y = d.cy; d.baseY = d.cy;
      ducks.push(d);
    }
  }
}

/* 每帧由主循环调用（补丁 4） */
function animateWater(dt) {
  /* ⚠️ 闸①：dt 非正一律当 0（负 dt 会一路污染累积相位，见 build.py 补丁 12 的注释） */
  if (!(dt > 0)) dt = 0;
  waterT += dt;
  for (const d of ducks) {
    const t = waterT * d.sp + d.ph;
    d.x0 = d.cx + Math.cos(t) * d.rx;                             // 轨道点：不含惊慌位移
    d.y0 = d.cy + Math.sin(t * 1.25) * d.ry;
    const p = panicStep(d, dt, player.x, player.y);
    const nx = p[0], ny = p[1] + Math.round(Math.sin(waterT * 2.2 + d.ph) * 1.2);
    /* 朝向按**合成位移**翻（绕圈 + 逃跑两种运动都涵盖）。0.05 的死区是防微抖闪烁：
       鸭子悬在轨道两端时 vx 每帧都在 0 附近跳，不设死区会左右抽搐。
       ⚠️ 但**赋 d.img 必须每帧无条件做**（第七轮改）：鸭子现在有两套图（水面版 /
          陆地版），若沿用"只在死区外赋值"，那么"匀速直行"的每一帧都不会换图 ——
          而鸭子跨过岸线的那一刻往往正是直行（轨道切线方向），于是它会上了岸
          还拖着水痕。死区只该管**朝向**，不该管**换装**。 */
    const vx = nx - d.x;
    if (Math.abs(vx) > 0.05) d.dir = vx < 0 ? -1 : 1;
    const land = ny > WATER_S;
    d.img = d.dir < 0 ? (land ? d.landL : d.imgL) : (land ? d.landR : d.imgR);
    d.x = nx;
    d.y = ny;
    d.baseY = ny;
  }
  for (const f of fishes) {
    const t = waterT * f.sp + f.ph;
    f.x0 = f.cx + Math.cos(t) * f.rx;
    f.y0 = f.cy + Math.sin(t * 1.3) * f.ry;
    const p = panicStep(f, dt, player.x, player.y);
    if (Math.abs(p[0] - f.x) > 0.05) f.dir = p[0] < f.x ? -1 : 1;  // 尾巴挂在游动的反侧
    f.x = p[0];
    f.y = p[1];
  }
}

/* =========================================================
   4.6 围墙 + 五个校门
   ---------------------------------------------------------
   围墙沿 BOUND 闭合折线，遇校门留缺。墙体**烘焙进地面**：
   玩家永远在校内（南侧），墙画在人物之下才是对的，同时省掉
   一长串长条精灵的深度排序麻烦。门柱/门楣做成道具，压在人物之上。

   碰撞：沿墙逐段切 90px 一块，取 AABB 进 solids；门口那块跳过。
   ========================================================= */
const WALL_H = 22;                       // 墙高（世界像素，≈2.4 m）

function nearestGateDist(x, y) {
  let best = 1e9;
  for (const G of GATES) {
    const d = Math.hypot(x - G.x, y - G.y) - G.w / 2;
    if (d < best) best = d;
  }
  return best;
}
const inGate = (x, y) => nearestGateDist(x, y) < 0;

/* --- 4.6.1 墙体（烘焙） --- */
function paintWalls(g, rng) {
  const P = BOUND;
  let arc = 0, nextPillar = 76;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy);
    const n = Math.max(1, Math.round(L / 2));
    for (let k = 0; k <= n; k++) {
      const x = a[0] + (dx * k) / n, y = a[1] + (dy * k) / n;
      if (k > 0) arc += L / n;
      if (inGate(x, y)) continue;                              // 门口留缺
      wallColumn(g, x, y, rng);
      if (arc >= nextPillar) {                                 // 每隔 76px 一根墙垛
        nextPillar += 76;
        px(g, Math.round(x) - 5, y - WALL_H - 5, 10, WALL_H + 5, "#b3ad9f");
        px(g, Math.round(x) - 5, y - WALL_H - 5, 10, 3, "#d6d0c2");
        px(g, Math.round(x) + 3, y - WALL_H - 5, 2, WALL_H + 5, "#807a6d");
        px(g, Math.round(x) - 5, y + 2, 10, 2, "rgba(14,18,28,0.34)");
      }
    }
  }
  /* --- 4.6.2 碰撞盒：逐段切块（任一端点/中点落进门洞就整块跳过） --- */
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy);
    const n = Math.max(1, Math.round(L / 90));
    for (let k = 0; k < n; k++) {
      const x0 = a[0] + (dx * k) / n, y0 = a[1] + (dy * k) / n;
      const x1 = a[0] + (dx * (k + 1)) / n, y1 = a[1] + (dy * (k + 1)) / n;
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      if (inGate(x0, y0) || inGate(x1, y1) || inGate(mx, my)) continue;
      solids.push({
        x: Math.min(x0, x1) - 5, y: Math.min(y0, y1) - 4,
        w: Math.abs(x1 - x0) + 10, h: Math.abs(y1 - y0) + 8
      });
    }
  }
}

function wallColumn(g, x, y, rng) {
  const X = Math.round(x) - 3;
  const Y = Math.round(y);
  px(g, X, Y - WALL_H, 6, WALL_H + 2, "#b0a999");               // 墙身
  px(g, X, Y - WALL_H + 3, 1, WALL_H - 4, "#c4bdac");           // 左棱受光
  px(g, X + 4, Y - WALL_H + 3, 2, WALL_H - 4, "#8d8677");       // 右棱背光
  for (let yy = Y - WALL_H + 5; yy < Y; yy += 6)                // 横向砖缝（读作砌体）
    px(g, X, yy, 6, 1, "rgba(0,0,0,0.11)");
  if (((x | 0) % 20) < 2) px(g, X + 1, Y - WALL_H + 3, 1, WALL_H - 5, "rgba(0,0,0,0.08)");
  px(g, X - 1, Y - WALL_H - 2, 8, 4, "#cec7b6");                // 压顶（挑出 1px）
  px(g, X - 1, Y - WALL_H + 2, 8, 1, "#7e7869");
  px(g, X - 1, Y + 2, 8, 2, "rgba(14,18,28,0.34)");             // 接地影
}

/* --- 4.6.3 可行走判定：多边形内 + 离墙 11px --- */
function distToBound(x, y) {
  let best = 1e9;
  const P = BOUND;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const ax = P[j][0], ay = P[j][1], bx = P[i][0], by = P[i][1];
    const vx = bx - ax, vy = by - ay;
    const t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy || 1), 0, 1);
    const d = Math.hypot(x - (ax + vx * t), y - (ay + vy * t));
    if (d < best) best = d;
  }
  return best;
}
/* ⚠️ 门洞必须**内外都放行**：门洞落在边界线上，若一律要求"离边界 > 11px"，
   会在每个校门上横出一道看不见的墙 —— 碰撞盒跳过了也没用，人停在门前 11px 处。
   只放宽界外也不行，界内那一侧照样过不去。
   d < 150 是防止从门洞一路逛到校外纹理区（门洞半径最大 G2 的 97.5px）。 */
function canWalk(x, y) {
  const d = distToBound(x, y);
  if (inGate(x, y) && d < 150) return true;
  return insideBoundary(x, y) && d > 11;
}

/* --- 4.6.4 门柱 / 门楣 / 门牌（道具） --- */
function makeGatePillar(side) {
  const c = mkCanvas(30, 74), g = c.getContext("2d");
  px(g, 1, 68, 28, 5, "rgba(14,18,28,0.34)");                  // 接地影
  px(g, 2, 6, 26, 64, "#bdb6a6");                              // 柱身
  px(g, 2, 6, 4, 64, "#d8d2c4");                               // 左棱受光
  px(g, 24, 6, 4, 64, "#8b8578");                              // 右棱背光
  for (let y = 12; y < 68; y += 11) px(g, 2, y, 26, 1, "rgba(0,0,0,0.14)");
  px(g, 0, 2, 30, 6, "#8b8578");                               // 柱头压顶
  px(g, 0, 0, 30, 3, "#d8d2c4");
  px(g, 4, 8, 22, 8, "#6f6a5e");                               // 嵌板
  px(g, 5, 9, 20, 6, side ? "#a3452f" : "#2f4a6b");
  px(g, 3, 70, 24, 2, "#6f6a5e");                              // 柱础
  return { canvas: c, ax: 15, ay: 71, w: 30, h: 74 };
}

function makeGateBeam(len, name) {
  const c = mkCanvas(len + 24, 30), g = c.getContext("2d");
  px(g, 0, 4, len + 24, 13, "#bdb6a6");
  px(g, 0, 4, len + 24, 3, "#d8d2c4");
  px(g, 0, 15, len + 24, 2, "#8b8578");
  const pw = Math.min(len, 150), px0 = Math.round((len + 24 - pw) / 2);
  px(g, px0, 6, pw, 10, "#5d564a");
  px(g, px0, 6, pw, 1, "#7d7669");
  g.fillStyle = "#e8d9a8";
  g.font = "8px monospace";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(name, px0 + pw / 2, 12);
  return { canvas: c, ax: (len + 24) / 2, ay: 20, w: len + 24, h: 30 };
}

/* 门楣一律横画 —— 3/4 视角里"沿 y 的门洞"没有可读的横梁，
   竖排门洞改用「门牌挂在近端门柱上」的画法。 */
function buildGates() {
  for (const G of GATES) {
    /* 南门（G2）不套这个模板 —— 它是照片里那座红色高拱门，
       由 49_southgate.js 的 buildSouthArch() 单独画（见该文件头的几何推导）。 */
    if (G.id === "G2") continue;
    const vDir = G.dir === "v";                                // 墙沿 y → 门洞在 y 向
    const a = vDir ? { x: G.x, y: G.y - G.w / 2 } : { x: G.x - G.w / 2, y: G.y };
    const b = vDir ? { x: G.x, y: G.y + G.w / 2 } : { x: G.x + G.w / 2, y: G.y };
    for (const p of [a, b]) {
      const s = makeGatePillar(G.id === "G2");
      props.push({ img: s.canvas, ax: s.ax, ay: s.ay, x: p.x, y: p.y, baseY: p.y });
    }
    if (vDir) {
      /* 近端门柱（y 大的那根）顶上一块横匾 */
      const bm = makeGateBeam(Math.min(150, G.w), G.name);
      props.push({ img: bm.canvas, ax: bm.ax, ay: bm.ay, x: G.x, y: b.y - 66, baseY: b.y - 54 });
    } else {
      const bm = makeGateBeam(Math.abs(b.x - a.x), G.name);
      props.push({ img: bm.canvas, ax: bm.ax, ay: bm.ay, x: G.x, y: a.y - 66, baseY: a.y - 54 });
    }
  }
  buildSouthArch();                    // 南门：红色高拱（49_southgate.js）
}

/* =========================================================
   4.7 植物多样化 —— 针叶 / 垂柳 / 开花树 + 行道树成行 / 广场树阵
   ---------------------------------------------------------
   为什么另开一个文件：树 / 灌木 / 灯的**原始生成器**躺在 demo 的
   nature 段（805-1049），那是逐字节切片，一行不能改。所以新物种只能
   另起一个 parts 文件，装配时插在 nature 之后。`anyTree()` 只做**分发**，
   既有生成器一个字都没动。

   ⚠️ 分发**不消耗随机数**：物种由 seed 的数值直接决定（`seed % 100`），
   不是再摇一次随机 —— 所以把 scatter() 里的 `makeTree((n*131+11)|0)` 换成
   `anyTree((n*131+11)|0, x, y)` 之后，**rngS 的序列一字不动**，全校园既有的
   灯 / 灌木 / 长椅 / 花坛分布逐像素不变（和删自行车是同一手法）。
   ⚠️ 行道树走**独立的 `makeRng(70707)`**，与 scatter() 的 rngS 完全隔离：
   整段行道树逻辑以后被删掉，scatter() 的结果也不受任何影响。

   三条既有铁律照旧：左上受光偏暖 / 右下背光偏冷；底部有方向性投影 +
   接地接触阴影；新物种的锚点约定与 makeTree 一致（ax = cx, ay = 地面线），
   调用点才能零改动。
   ========================================================= */
const PINE_D = "#1e3d1b", PINE_M = "#2f6129", PINE_L = "#4a8639";   // 针叶：比阔叶更冷更深
const WIL_D  = "#3a5820", WIL_M  = "#557c2b", WIL_L  = "#8fb84a";   // 垂柳：偏黄绿
const BL_D   = "#c58fa3", BL_M   = "#f0ccd8", BL_L   = "#fdf3f6";   // 开花树：粉白（不是桃红）

/* --- 4.7.1 针叶树：窄而高的塔形，中心线随高度摇摆，每层底缘外扩成锯齿 --- */
function makeConifer(seed) {
  const rng = makeRng(seed);
  const W = 54, H = 104;
  const c = mkCanvas(W, H), g = c.getContext("2d");
  const cx = W >> 1, gy = H - 5;                       // 27, 99
  const bark = "#5b4229";
  const trunkH = 8 + ((rng() * 4) | 0);                // 露出裙摆下面的一小段
  const top = gy - trunkH - 72, bot = gy - trunkH + 4;
  const R = 21, hT = (bot - top) / 7;                  // 七层
  const lean = rng() * 6.28;                           // 摇摆相位（每棵不同）

  shadowBlob(g, cx + 7, gy - 1, 15, 6, 0.30, 4);

  /* 树干：**从 top+12 起画**，别从 top 起 ——
     冠顶那几行半宽只有 2~3，盖不住 6px 宽的树干，会从尖上冒出一截棕色
     （5× 下非常显眼，像树尖上顶了个果子）。反正下面那截才是要露的。 */
  const tw = 6, tx = cx - (tw >> 1), ttop = top + 12;
  px(g, tx - 2, gy - 3, tw + 4, 3, shade(bark, -0.14));      // 根外扩
  px(g, tx, ttop, tw, gy - ttop, bark);
  for (let i = 0; i < gy - ttop; i++) {
    px(g, tx, ttop + i, 2, 1, shade(bark, 0.16));
    px(g, tx + tw - 2, ttop + i, 2, 1, shade(bark, -0.34));
  }

  /* 塔冠：逐行扫。三件事让它不像一个几何三角 ——
     ① 中心线按 `sin(t*3.4 + lean)` 缓慢摇摆（针叶树没有笔直的中轴）
     ② 半宽 ≈ 直线锥（pow 1.02）+ 层底外扩（锯齿缘）
     ③ 逐行 1.8px 的随机抖动 */
  for (let y = top; y <= bot; y++) {
    const t = (y - top) / (bot - top);
    const ring = ((y - top) % hT) / hT;                // 0 = 层顶，→1 = 层底
    const cxo = cx + Math.round(Math.sin(t * 3.4 + lean) * 1.7);
    const hw = Math.max(1, R * Math.pow(t, 1.02) + (1 - ring) * 2.8 + (rng() - 0.5) * 1.8);
    const x0 = Math.round(cxo - hw), w = Math.max(2, Math.round(hw * 2));
    let k = 0.24 - t * 0.38;                           // 上亮下暗
    if (ring < 0.15) k -= 0.22;                        // 层底一条暗线 → 层叠可读
    px(g, x0, y, w, 1, shade(PINE_M, k));
    px(g, x0, y, 1, 1, shade(PINE_M, k + 0.28));       // 左缘受光
    px(g, x0 + w - 1, y, 1, 1, shade(PINE_M, k - 0.32)); // 右缘背光
  }
  /* 冠内镂空：让轮廓不是一整块实心 */
  for (let i = 0; i < 18; i++) {
    const t = rng();
    px(g, cx + (rng() * 2 - 1) * R * Math.pow(t, 1.02) * 0.7, top + t * (bot - top),
       1 + ((rng() * 2) | 0), 1, "rgba(16,30,14,0.38)");
  }
  speckle(g, cx - R - 2, top, R * 2 + 4, bot - top, "rgba(0,0,0,0.16)", 80, rng);
  speckle(g, cx - R - 2, top, R * 2 + 4, bot - top, "rgba(200,240,160,0.12)", 55, rng);

  /* 顶芽：一根比冠顶高 3~6px 的尖，跟着中心线的相位摆 */
  const tipx = cx + Math.round(Math.sin(lean) * 1.7);
  px(g, tipx - 1, top - 3, 3, 4, shade(PINE_L, -0.12));
  px(g, tipx, top - 6, 1, 4, shade(PINE_L, 0.10));
  return { canvas: c, ax: cx, ay: gy };
}

/* --- 4.7.2 垂柳：高干 + 扁冠 + 前后两层垂条 ---
   垂条**分前后两层**画：后层（暗）在树干之前、前层（亮）在冠之后 ——
   这样树干会被夹在中间若隐若现，而不是"一根光杆顶个球"。 */
function makeWillow(seed) {
  const rng = makeRng(seed);
  const W = 86, H = 88;
  const c = mkCanvas(W, H), g = c.getContext("2d");
  const cx = W >> 1, gy = H - 5;                       // 43, 83
  const bark = "#5f4730";
  const trunkH = 40 + ((rng() * 6) | 0);
  const tw = 7, tx = cx - (tw >> 1);
  const ty = gy - trunkH, cyC = ty - 3, R = 27, RY = 17;

  shadowBlob(g, cx + 10, gy - 1, 22, 7, 0.30, 4);

  /* 垂条只有 26 根，且横向位置用 pow(0.55) **往两端挤**：
     垂柳是外圈披下来，中间不会挂一帘子 —— 中间留白是这棵树读不读得出来的关键
     （第一版 46 根均匀铺满，整棵糊成一丛草）。
     ⚠️ 长度必须夹住 gy-1，否则垂条会穿过地面线、读成插进土里。 */
  const st = [];
  for (let i = 0; i < 26; i++) {
    const u = (rng() < 0.5 ? -1 : 1) * Math.pow(rng(), 0.55);
    const y0 = cyC + Math.sqrt(Math.max(0, 1 - u * u)) * RY * 0.95 + (rng() - 0.5) * 2;
    st.push({ u: u, x: cx + u * R * 0.98, y0: y0,
              len: Math.max(5, Math.min(gy - 1 - y0, 12 + rng() * 18 + (1 - Math.abs(u)) * 4) | 0),
              th: Math.abs(u) > 0.62 ? 2 : 1,          // 外侧（离眼睛近）的条更粗
              ph: rng() * 6.28, k: rng() });
  }
  const drawStrands = (dark) => {
    for (const s of st) {
      if ((s.k >= 0.46) !== dark) continue;            // 两层按 k 对半分
      const col = dark ? shade(WIL_D, -0.06) : shade(WIL_M, 0.14);
      const dir = s.u >= 0 ? 1 : -1;
      for (let i = 0; i < s.len; i++) {
        /* 摆幅随下垂长度增大 + 整体向外飘 → 是一条弧，不是一根直线 */
        const wob = Math.sin(s.ph + i * 0.09) * (1.0 + i * 0.075) + dir * i * 0.05;
        /* ⚠️ 是 s.y0 —— 这个对象上的字段叫 y0。写成 s.y 会得到 NaN，
           px() 里的 fillRect 对 NaN 静默无效：**26 根垂条一根都画不出来**，
           整棵读成"高干圆冠的阔叶"（浏览器不报错、探针也看不出来，
           只有 12× 局部放大才发现那一格是空的）。 */
        px(g, s.x + wob, s.y0 + i, i < s.len - 5 ? s.th : 1, 1,
           i > s.len - 5 ? shade(WIL_L, 0.18) : (i < 3 ? shade(col, 0.12) : col));
        if (!dark && i > 3 && i < s.len - 5 && i % 5 === 2)
          px(g, s.x + wob + dir, s.y0 + i, 1, 1, shade(WIL_L, 0.22));
      }
    }
  };
  drawStrands(true);                                   // 后层（会被树干和冠压住大半）

  /* 树干：带一点弯（垂柳少直干） */
  px(g, tx - 2, gy - 4, tw + 4, 4, shade(bark, -0.14));
  for (let i = 0; i < trunkH; i++) {
    const xo = Math.round(Math.sin(i / trunkH * 2.1) * 1.6);
    px(g, tx + xo, ty + i, tw, 1, bark);
    px(g, tx + xo, ty + i, 1, 1, shade(bark, 0.18));
    px(g, tx + xo + tw - 1, ty + i, 1, 1, shade(bark, -0.34));
  }
  /* 主枝：从干顶散开托住冠；大半会被冠压住，露出的梢在外面 */
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i / 4 - 0.5) * 2.2 + (rng() - 0.5) * 0.26;
    const L = 13 + rng() * 9;
    seg(g, cx, ty + 2, cx + Math.cos(a) * L, ty + 2 + Math.sin(a) * L * 0.92, shade(bark, -0.08), 2);
  }

  /* 冠：扁球（柳冠比阔叶扁、比针叶散）。**要够大够实** ——
     垂条只是外圈的披挂，树体量得由冠撑起来。 */
  const cl = [];
  for (let i = 0; i < 17; i++) {
    const a = rng() * Math.PI * 2, rr = 0.28 + rng() * 0.72;
    cl.push({ x: cx + Math.cos(a) * R * rr, y: cyC + Math.sin(a) * RY * rr, r: 7 + rng() * 5 });
  }
  cl.sort((p, q) => p.y - q.y);
  for (const o of cl) {
    const k = clamp(0.20 - ((o.x - cx) / R * 0.5 + (o.y - cyC) / RY * 0.8) * 0.30, -0.30, 0.30);
    circlePx(g, o.x, o.y, o.r, shade(WIL_M, k));
  }
  /* 冠的左上迎光叶簇 */
  for (let i = 0; i < 9; i++)
    circlePx(g, cx - R * 0.1 - rng() * R * 0.55, cyC - RY * 0.25 - rng() * RY * 0.6,
      3 + rng() * 3.4, shade(WIL_L, 0.10 + rng() * 0.18));
  /* 冠内镂空：几处深缝，别让冠成一整块实心 */
  for (let i = 0; i < 7; i++) {
    const a = rng() * Math.PI * 2, rr = R * (0.25 + rng() * 0.6);
    px(g, cx + Math.cos(a) * rr, cyC + Math.sin(a) * rr * 0.8,
       2 + ((rng() * 3) | 0), 2, "rgba(20,34,18,0.34)");
  }

  drawStrands(false);                                  // 前层（压在冠上，读作垂到前面）
  speckle(g, cx - R - 2, cyC - RY, R * 2 + 4, gy - cyC + RY, "rgba(0,0,0,0.14)", 70, rng);
  return { canvas: c, ax: cx, ay: gy };
}

/* --- 4.7.3 开花树：花团 + **压在上面的枝条**，冠内露枝 → 才不像一个粉球 --- */
function makeBlossom(seed) {
  const rng = makeRng(seed);
  const W = 66, H = 78;
  const c = mkCanvas(W, H), g = c.getContext("2d");
  const cx = W >> 1, gy = H - 5;                       // 33, 73
  const bark = "#6b4a2f";
  const trunkH = 18 + ((rng() * 5) | 0);
  const tw = 7, tx = cx - (tw >> 1);
  const ty = gy - trunkH, cyB = ty - 4, R = 24, RY = 15;   // 冠偏扁：樱花树不是正球

  shadowBlob(g, cx + 10, gy - 1, 21, 7, 0.32, 4);
  px(g, tx - 2, gy - 4, tw + 4, 4, shade(bark, -0.14));
  px(g, tx, ty, tw, trunkH, bark);
  for (let i = 0; i < trunkH; i++) {
    px(g, tx, ty + i, 2, 1, shade(bark, 0.16));
    px(g, tx + tw - 2, ty + i, 2, 1, shade(bark, -0.34));
  }
  speckle(g, tx, ty, tw, trunkH, "rgba(0,0,0,0.22)", 12, rng);

  /* 主枝：先画一层（会被花团压住大半，枝梢留在花外面） */
  const twig = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i / 5 - 0.5) * 2.0 + (rng() - 0.5) * 0.24;
    twig.push({ a: a, L: 15 + rng() * 11 });
  }
  for (const b of twig)
    seg(g, cx, ty + 1, cx + Math.cos(b.a) * b.L, ty + 1 + Math.sin(b.a) * b.L * 0.9,
        shade(bark, -0.10), 2);

  /* 花团：**团要小**（r 4.5~8）—— 团一大就并成一颗球，看得出一个个花团
     才有"开花"的样子。三遍：背光底（右下）/ 主体 / 迎光顶（左上）。 */
  const cl = [];
  for (let i = 0; i < 15; i++) {
    const a = (i / 15) * Math.PI * 2 + rng() * 0.4;
    const rr = 0.32 + rng() * 0.68;
    cl.push({ x: cx + Math.cos(a) * R * rr, y: cyB + Math.sin(a) * RY * rr, r: 4.5 + rng() * 3.5 });
  }
  cl.sort((p, q) => p.y - q.y);
  for (const o of cl) {
    const k = clamp(0.14 - ((o.x - cx) / R * 0.5 + (o.y - cyB) / RY * 0.85) * 0.24, -0.26, 0.26);
    circlePx(g, o.x, o.y, o.r, shade(BL_M, k));
  }
  for (let i = 0; i < 6; i++)                          // 右下背光（压深，略微溢出轮廓）
    circlePx(g, cx + R * 0.26 + rng() * R * 0.62, cyB + RY * 0.20 + rng() * RY * 0.66,
      3 + rng() * 3.6, shade(BL_D, -rng() * 0.12));
  for (let i = 0; i < 10; i++)                         // 左上迎光（提亮）
    circlePx(g, cx - R * 0.12 - rng() * R * 0.58, cyB - RY * 0.20 - rng() * RY * 0.66,
      3 + rng() * 3.6, shade(BL_L, 0.04 + rng() * 0.14));

  /* 压在花团**上面**的小枝：5 根 1px 深线，起点从 0.35R 起（不再挤在圆心）。
     这是"粉球"与"花树"的分水岭 —— 花团没有枝在前面切一下，颜色再准也读成一坨。 */
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i / 4 - 0.5) * 2.3 + (rng() - 0.5) * 0.3;
    const L = R * (0.62 + rng() * 0.48);
    seg(g, cx + Math.cos(a) * R * 0.35, cyB + Math.sin(a) * RY * 0.35,
        cx + Math.cos(a) * L, cyB + Math.sin(a) * L * 0.82,
        "rgba(74,46,40,0.42)", 1);
  }
  /* 单朵花：1~2px 的亮点，把大色块打散成一簇簇花。
     rr 刻意放到 1.12R —— 让一部分花**长到轮廓外面**，剪影才不是一条光滑的弧。 */
  for (let i = 0; i < 30; i++) {
    const a = rng() * Math.PI * 2, rr = R * (0.22 + rng() * 0.90);
    const fx = cx + Math.cos(a) * rr, fy = cyB + Math.sin(a) * rr * 0.80;
    const lit = (fx - cx) / R * -0.5 + (fy - cyB) / RY * -0.8 + 0.2;   // >0 = 偏迎光面
    const r2 = rng();
    /* ⚠️ 迎光侧的花点**不要**再提亮：BL_L 已经是近白 (#fdf3f6)，
       再加 0.10 就是纯白，落在粉团上是一粒扎眼的雪点（12× 局部一眼就看见）。
       迎光只给 2px（比背光少），否则白点比花团还跳。 */
    circlePx(g, fx, fy, r2 < (lit > 0 ? 0.24 : 0.48) ? 2 : 1,
      lit > 0 ? BL_L : shade(r2 < 0.5 ? BL_M : BL_D, r2 < 0.5 ? 0.10 : -0.08));
  }
  /* 落花：树下稀疏的粉点（避开树干正下方） */
  for (let i = 0; i < 16; i++) {
    const fx = (rng() - 0.5) * 42, fy = rng() * 9, cp = rng();
    if (Math.abs(fx) < 6) continue;
    px(g, cx + fx, gy - 2 - fy, 1, 1, cp < 0.5 ? rgba(BL_L, 0.85) : rgba(BL_M, 0.78));
  }
  return { canvas: c, ax: cx, ay: gy };
}

/* --- 4.7.3b 白杨：南门 → 校徽雕塑 那条大道的行道树（用户 2026-09-13 追加）---
   口述：「南门到校徽雕塑这条路两边的树是比较高的白杨树，参考白杨的树干特点和高度，
   清理现在这条路旁边的树重新种上白杨」。
   白杨有三个识别点，少任何一个都会退化成一棵"胖针叶"：
     ① **又高又窄**。全校园最高（132 vs 针叶 104），同时是**圆柱形**树冠 ——
        宽:高 ≈ 1:2.9（针叶是 1:1.9）。高是靠"比谁都高"读出来的，窄是靠比例。
     ② **树干又长又白**。毛白杨树皮灰白，而且**露出很长一截**（约全高的 40%）。
        "树冠挂得高"是这棵树第一眼的东西 —— 树干只露一小截就成了一把伞。
     ③ **树皮上的菱形皮孔**。毛白杨灰白树皮上那一颗颗深色小斑，是它区别于
        其他白干树的关键（桦树是横纹，法国梧桐是片状剥落）。
   冠用**灰绿**（比阔叶更灰、比针叶更亮），收尾撒一层银白高光 ——
   对应"风一吹满树叶子翻白"的白杨标志性观感。 */
const POP_D = "#4d6c3c", POP_M = "#71965a", POP_L = "#a6c47f";   // 白杨冠：灰绿
const POP_BARK = "#adad9e", POP_BARK_L = "#cbcbbc", POP_BARK_D = "#7e8072";
const POP_MARK = "#6d6f62";                                       // 树皮菱形皮孔
function makePoplar(seed) {
  const rng = makeRng(seed);
  const W = 46, H = 132;
  const c = mkCanvas(W, H), g = c.getContext("2d");
  const cx = W >> 1, gy = H - 5;                       // 23, 127
  const tw = 9, tx = cx - (tw >> 1);                   // 树干 19..27
  const crownTop = 8, crownBot = gy - 53;              // 冠 8..74（占 52%）
  const ty = crownBot - 14;                            // 树干从冠内 14px 处起画
  const R = 13, lean = rng() * 6.28;

  /* 投影：白杨是**窄**树，影子不能照抄针叶的 15px 宽，否则比树还胖 */
  shadowBlob(g, cx + 5, gy - 1, 11, 5, 0.28, 4);

  /* 树干：白干 + 左缘提亮 + 右缘压暗 + 根外扩 */
  px(g, tx - 3, gy - 3, tw + 6, 3, shade(POP_BARK, -0.20));         // 根外扩
  px(g, tx, ty, tw, gy - ty, POP_BARK);
  for (let i = 0; i < gy - ty; i++) {
    px(g, tx, ty + i, 2, 1, POP_BARK_L);
    px(g, tx + tw - 2, ty + i, 2, 1, POP_BARK_D);
  }
  /* ② 菱形皮孔：稀疏、错开落点，太密会读成"花树干" */
  for (let i = 0; i < 9; i++) {
    const yy = ty + 10 + i * 7 + ((rng() * 4) | 0);
    if (yy > gy - 6) break;
    px(g, tx + 1 + ((rng() * (tw - 3)) | 0), yy, 1, 1, POP_MARK);
    px(g, tx + 1 + ((rng() * (tw - 3)) | 0), yy + 1, 1, 1, rgba(POP_MARK, 0.55));
  }
  /* 冠底那几根短枝：白杨的枝向上收，画成斜向上的 1px 短线即可 */
  for (const s of [-1, 1]) {
    const bx = cx + s * 3;
    for (let i = 0; i < 3; i++) px(g, bx + s * i, crownBot - 4 + i * 3, 1, 3, POP_D);
  }

  /* 冠：逐行扫。**纺锤形**（上下都收、最宽在 45% 处），不是针叶那种直线锥。
     ① 中心线随高度轻摆（白杨很直，摆幅只给针叶的 0.6 倍）
     ② 半宽 = 纺锤基线 + 逐行抖动 ⇒ 轮廓不规则，不是几何橄榄球 */
  for (let y = crownTop; y <= crownBot; y++) {
    const t = (y - crownTop) / (crownBot - crownTop);
    const cxo = cx + Math.round(Math.sin(t * 2.2 + lean) * 1.0);
    const hw = Math.max(2, R * (0.30 + 0.70 * Math.pow(Math.sin(Math.PI * (0.10 + 0.80 * t)), 0.85))
                           + (rng() - 0.5) * 1.6);
    const x0 = Math.round(cxo - hw), w = Math.max(2, Math.round(hw * 2));
    const k = 0.16 - t * 0.32;                         // 上亮下暗（比针叶浅：白杨冠是透光的）
    px(g, x0, y, w, 1, shade(POP_M, k));
    px(g, x0, y, 1, 1, shade(POP_M, k + 0.26));        // 左缘受光
    px(g, x0 + w - 1, y, 1, 1, shade(POP_M, k - 0.30)); // 右缘背光
  }
  /* 冠内镂空（透光），别做成一整块实心的橄榄球 */
  for (let i = 0; i < 22; i++) {
    const t = rng();
    px(g, cx + (rng() * 2 - 1) * R * 0.62, crownTop + t * (crownBot - crownTop),
       1 + ((rng() * 2) | 0), 1, "rgba(26,44,22,0.32)");
  }
  /* ① 银白叶背：这是白杨的招牌（风一吹满树翻白）。
     ⚠️ 暗斑要**比针叶少**（针叶靠暗斑读层叠，白杨靠亮斑读翻白）——
        第一版暗斑 70 颗压在同色冠上，整棵读成了柏树。 */
  speckle(g, cx - R - 2, crownTop, R * 2 + 4, crownBot - crownTop,
          "rgba(0,0,0,0.10)", 34, rng);
  speckle(g, cx - R - 2, crownTop, R * 2 + 4, crownBot - crownTop,
          "rgba(226,240,200,0.22)", 78, rng);
  /* 顶芽：白杨的顶芽是一根收得很细的尖 */
  px(g, cx, crownTop - 4, 2, 5, shade(POP_L, -0.10));
  px(g, cx, crownTop - 7, 1, 4, shade(POP_L, 0.08));
  return { canvas: c, ax: cx, ay: gy };
}

/* --- 4.7.3c 白杨大道：两排、**树根 x 写死**（用户 2026-09-13 追加）---
   用户原话：「白杨排布一定要整体，树根的 x 轴坐标要一致」。
   §4.7.3b 的做法是**换分发**（把走廊里原有的树改成白杨），位置还是 scatter() /
   plantRows() 撒出来的那一堆乱点 —— 树根 x 从 1931 到 2183 都有，其中三棵
   （x2085 / 2094 / 2097）干脆**长在沥青上**（scatter 的 K.ROAD 分支本来就会种树）。
   所以这一节改成"**清场 + 补种**"：先把走廊里已有的树删掉，再按固定 x 补两排。
   ⚠️ 四个非显然点：
     ① **x 是两个写死的常量，不是按路算的**。路面栅格化之后是 x1952..2111
        （`_gt.py` 量的，`ROADCLS=2` 那 10 格），两侧草地各 64 / 112 px 宽。
        两排取"路面边线各外扩 AVE_ROW_DX"⇒**关于路轴 2032 对称**：
        西 1952−32=**1920**、东 2112+32=**2144**。两棵树冠（各 46 宽）因此
        离沥青都还有 9px 净空，不会盖到路面上。
        ⚠️ 别改成从 `ARTERY` 那条矩形（x1955.6..2102.3）反算 —— 它的中轴 2028.95
           与**栅格化后**的中轴 2032 差 3px，两排会歪。
     ② **y 只取草地那一段**（实测两排都是 y1968..2310 是草，2310 以南是砖石、
        2336 起是南门入口广场）⇒ 大道止于广场北沿，广场里不种树（对的）。
        ⚠️ 北端还有一个硬约束：**树冠顶必须留在雕塑净空框 DIA_CLR 下沿（y1863）之外**，
           否则 `clearDiaClearance()` 按**美术盒**判、会把整棵无声无息地删掉。
           白杨 `ay = 127` ⇒ 树根必须 > 1990。取 **1994**（冠顶 1867，留 4px 余量）。
           本节的 keepOut 检查就是把这个约束**显式**写出来，不靠"我算过"。
     ③ **清场只删 `tag === "tree"`**：路灯 / 桶 / 椅本来就没有 tag，校名石 / 石狮 /
        雕塑 / 后围石 / 旗帜各有自己的 tag —— 一个都不会误伤。
        ⚠️ 清场框（x1888..2224）比 `SOUTH_AVE` 窄：`SOUTH_AVE` 西界 1836 那一带有
           另一条纵向主路（x≈1792），那里的树是**那条路**的行道树，不能一起清掉。
     ④ **两排 y 对齐**（同一 y 上左右各一棵，成"门"），不是交错 —— 用户要的"整体"
        就是这个观感；y 按等分取点（同 §4.7.6b），首尾恰好压在两端，间距均匀。 */
const AVE_ROW_DX = 32;                                  // 树根离沥青边线
const AVE_X_W = 1920, AVE_X_E = 2144;                   // 西 / 东两排的固定树根 x
const AVE_Y0 = 1994, AVE_Y1 = 2310, AVE_SP = 80;        // 草地段（>1990 是为了避开 DIA_CLR）
const AVE_CLR = { x: 1888, y: 1950, w: 336, h: 540 };   // 清场框 x1888..2224 / y1950..2490
function plantPoplarAve() {
  /* ① 清场：删掉走廊里已有的树（scatter 撒的 + plantRows 种的行道树） */
  const CX1 = AVE_CLR.x + AVE_CLR.w, CY1 = AVE_CLR.y + AVE_CLR.h;
  const keep = [];
  let cleared = 0;
  for (const p of props) {
    if (p.tag === "tree" &&
        p.x > AVE_CLR.x && p.x < CX1 && p.y > AVE_CLR.y && p.y < CY1) { cleared++; continue; }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);

  /* ② 补种：两排固定 x，y 等分；每棵都过 terrain + 净空 + 边界三道检查 */
  const keepOut = [DIA_CLR, FLAG_CLR];                  // 见 ①/② 的注释（美术盒判删）
  const nx = Math.max(1, Math.round((AVE_Y1 - AVE_Y0) / AVE_SP));
  let placed = 0;
  for (let i = 0; i <= nx; i++) {
    const y = AVE_Y0 + (AVE_Y1 - AVE_Y0) * i / nx;
    for (const side of [0, 1]) {
      const x = side ? AVE_X_E : AVE_X_W;
      if (!insideBoundary(x, y) || distToBound(x, y) < 30) continue;
      if (cellAtSafe(x, y) !== K.GRASS) continue;       // 树根必须落在草地上
      if (ptBlocked(x, y, 16, 11)) continue;            // 压到碰撞盒（楼 / 围墙）

      for (const C of keepOut)                          // 探进净空框 = 待会儿被整棵删掉
        if (x - 23 < C.x + C.w && x + 23 > C.x &&

        makeStreetTree((i * 613 + side * 41 + 7) | 0, x, y), { x: x, y: y }));

/* --- 4.7.4 物种分发（**不摇随机**：全靠 seed 的数值） --- */
/* 白杨大道：南门 → 校徽雕塑 那条路的**两侧**（用户 2026-09-13）。

   路由 `ARTERY` 的「南门纵向」给出（x IX(5.0070)..IX(5.3826) = 1956..2102），
   两侧各外扩 ~120px 正好兜住真正站在路缘的那批树（实测离中轴 55~153px）。
   ⚠️ y 从 1916 起、**不是**从路面北端的 1875 起：思源楼前大草坪的整治区
      （`LAWN_ZONE` = 草坪矩形外扩 40）下沿是 1915.1，草坪那圈边界树就长在
      1916 上面一点点 —— 走廊探进整治区会把**草坪的南边那排**也变成白杨，

function onSouthAve(x, y) {
  return x > SOUTH_AVE.x0 && x < SOUTH_AVE.x1 && y > SOUTH_AVE.y0 && y < SOUTH_AVE.y1;
}

/* 水岸判定：查 ±3 格（≈±48 世界 px ≈ 5.3 m）而不是 ±1 格。
   ⚠️ 一开始写的是 ±1 格，结果**全校园 0 棵柳**（柳成了死代码）：
   `classifyFree` 把离水 25px 内的一圈格子全划成了 K.ROAD（贴水留白的走廊），

  const cx = (x / CELL) | 0, cy = (y / CELL) | 0;

    for (let i = -3; i <= 3; i++) {
      const a = cx + i, b = cy + j;

function anyTree(seed, x, y) {
  /* ⚠️ tag 是给**离线探针**用的（props_probe.py 靠它区分"树"与"路灯"）——
     路灯也是 32×84 的细高精灵，只按尺寸判会把路灯当成树，
     于是探针报出一堆假重叠。判定一律走 tag，不靠尺寸猜。 */
  const t = onSouthAve(x, y) ? makePoplar(seed)        // 白杨大道（最高优先级）
          : waterNear(x, y) ? makeWillow(seed)         // 水边一律柳
          : ((seed >>> 0) % 100) < 50 ? makeTree(seed) // 阔叶（原物种，占多数）
          : ((seed >>> 0) % 100) < 78 ? makeConifer(seed)  // 针叶
          :                             makeBlossom(seed); // 开花（≤22%：

/* --- 4.7.5 树坑：石框 + 土面。只画左右两片和两段前缘 ——
   树干在正中，后缘（远侧）本来就该被树干挡住，画了反而压在树干上。 --- */

  const KERB = "#a9a496", SOIL = "#4a3a28", SOILL = "#5d4a34";
  for (const d of [-1, 1]) {
    const x0 = ax + d * 5;
    px(g, x0, ay - 5, 9, 5, SOIL);
    px(g, x0, ay - 5, 9, 1, SOILL);                    // 土面受光的那一条
    px(g, x0 + (d > 0 ? 8 : 0), ay - 6, 1, 7, KERB);   // 外侧石框
    px(g, x0 + (d > 0 ? 8 : 0), ay - 6, 1, 2, shade(KERB, 0.20));
    px(g, x0 + (d > 0 ? 8 : 0), ay - 1, 1, 2, shade(KERB, -0.26));

  px(g, ax + 5,  ay - 1, 10, 2, "#8a8779");

      北侧 67px 的垃圾桶按距离算早就"够远"，实际上正好糊在树冠尖上，
      实地看就是"树上挂了个箱子"。

function plantRows() {

  let n = 0;
  for (let py = ROW_SP >> 1; py < WORLD_H; py += ROW_SP) {
    for (let px = ROW_SP >> 1; px < WORLD_W; px += ROW_SP) {

/* 草坪"整治区" = 草坪矩形 + 四周 LAWN_BAND 的一条带（§4.7.6c 用它清场）。

    if (p.x > Z.x && p.x < x1 && p.y > Z.y && p.y < y1) { dropped++; continue; }

/* =========================================================
   2.8 地面 / 路面细节（第 3 项）
   ---------------------------------------------------------
   地面管线（§2.7）原本已经有：草地噪声、沥青、人行道砖缝、广场石板、
   路缘石、标线、泥土过渡带。这一节只补**原本没有的四样**：

     · brickTone + paintRoadCell(cls=1)  逐砖色差（原来只有整体噪声，
       1× 下人行道是一片平色，读不出"砖"）
     · paintManholes                      井盖
     · paintWear                          斑马线磨损 + 车辙压痕
     · paintLeafFall                      树下落花 / 落叶

   ⚠️ 前三个走 buildGround 流水线（在 §2.7.6 标线之后、泥土带之前）。
   ⚠️ paintLeafFall **不在流水线里** —— 要等 props 排好才知道树在哪，
      由 60_assemble §6.6d 在 buildMips() **之前**调用（mip 是从地面画布降采样
      出来的，晚于 mip 就再也进不去 mip 了）。
   ⚠️ 一律不碰 solids / props 的坐标，只往地面画布上加像素。
   ========================================================= */

/* --- 2.8.0 "这里真的是沥青吗" -----------------------------------------
   ⚠️ 别用 CELLK 判：`classifyFree` 把 ARTERY 矩形**整块**标成 K.ROAD，
   连压着广场的那一段也标了；而广场是第 3 步画的、比路面亮得多。
   直接读**已烘焙好的画布**取样最可靠：沥青 = 暗且近中性灰
   （ramp #4b4b53…#606068；广场石板 #b3ada0 的 R≈168 会被挡住）。
   取 5×5 均值，避开 speckle 的 1px 白点。 */
function asphaltAt(g, x, y) {
  const px0 = Math.min(Math.max(0, (x | 0) - 2), WORLD_W - 5);
  const py0 = Math.min(Math.max(0, (y | 0) - 2), WORLD_H - 5);
  const d = g.getImageData(px0, py0, 5, 5).data;
  let r = 0, gg = 0, b = 0, n = 0;
  for (let k = 0; k < d.length; k += 4) { r += d[k]; gg += d[k + 1]; b += d[k + 2]; n++; }
  r /= n; gg /= n; b /= n;
  const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
  return mx <= 130 && mx - mn <= 30;
}
/* 沿一条横/纵带按 12px 分段，只画"落在真沥青上"的那几段。
   跨广场时带子自然断开 —— 这正是铺装广场该有的样子。 */
function bandOnAsphalt(g, x, y, w, h, col) {
  if (w >= h) { for (let t = 0; t < w; t += 12) { const sw = Math.min(12, w - t); if (asphaltAt(g, x + t + 6, y + (h >> 1))) px(g, x + t, y, sw, h, col); } }
  else        { for (let t = 0; t < h; t += 12) { const sh = Math.min(12, h - t); if (asphaltAt(g, x + (w >> 1), y + t + 6)) px(g, x, y + t, w, sh, col); } }
}

/* --- 2.8.1 逐砖色差 --------------------------------------------------
   ⚠️ 色调用**世界砖号的哈希**而不是 rng：一块 16×8 的砖常横跨两个 CELL，
   而每个 CELL 是各画各的 —— 用 rng 的话同一块砖的两半会拿到不同色调，
   在格子边界上留一条 16px 接缝（= 把 CELL 网格暴露出来）。
   哈希与"谁在画"无关，跨格天然一致。 */
function brickTone(bx, by) {
  let h = Math.imul(bx, 73856093) ^ Math.imul(by, 19349663);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h >>> 8) & 255) / 255;
}

/* --- 2.8.2 井盖 ------------------------------------------------------
   3/4 俯视：圆盖压成椭圆（rx6 / ry4）。只落主干道、且不落广场。 */
const MH_RIM = "#4d4d54", MH_FACE = "#6b6b73";
function manholeAt(g, cx, cy) {
  const rx = 6, ry = 4;
  ellipsePx(g, cx, cy + 2, rx + 1, ry, "rgba(14,18,28,0.16)");      // 接地影
  ellipsePx(g, cx, cy, rx, ry, MH_RIM);                             // 铸铁框
  ellipsePx(g, cx, cy - 1, rx, ry, shade(MH_FACE, -0.10));          // 盖面
  ellipsePx(g, cx, cy - 1, rx - 3, ry - 2, shade(MH_FACE, 0.12));   // 内圈
  for (let i = -1; i <= 1; i++)                                     // 盖面方格纹
    px(g, cx - 3, cy - 2 + i, 7, 1, "rgba(14,18,28,0.26)");
  px(g, cx - rx, cy - 1, rx * 2 + 1, 1, "rgba(255,255,255,0.15)");  // 上缘受光
  px(g, cx - rx, cy + ry - 2, rx * 2 + 1, 1, "rgba(14,18,28,0.20)"); // 下缘背光
}
function paintManholes(g, rng) {
  let n = 0;
  for (const a of ARTERY) {
    if (a.cls !== 2) continue;                     // 只落主干道
    const horiz = a.w >= a.h, len = horiz ? a.w : a.h;
    const half = (horiz ? a.h : a.w) / 2;
    for (let t = 130; t < len - 90; t += 170 + ((rng() * 90) | 0)) {
      /* ⚠️ 偏移量**必须避开正中**（±14px 起）：主干道正中是双黄中线，
         偏移取 ±(0.42*half) 的旧写法会让井盖骑在黄线上。 */
      const off = (rng() < 0.5 ? -1 : 1) * (14 + rng() * Math.min(16, half - 18));
      const x = Math.round(horiz ? a.x + t : a.x + a.w / 2 + off);
      const y = Math.round(horiz ? a.y + a.h / 2 + off : a.y + t);
      if (x < 8 || y < 8 || x > WORLD_W - 8 || y > WORLD_H - 8) continue;
      if (!asphaltAt(g, x, y)) continue;           // 只落在真沥青上
      manholeAt(g, x, y);
      n++;
    }
  }
  return n;
}

/* --- 2.8.3 磨损：斑马线缺口 + 车辙压痕 -------------------------------
   ⚠️ 补洞要用**路面底色**（ASPHALT_RAMP[1] = 校门车行道的整块填色），
   不能用透明 —— 底下是烘焙好的地面，透明洞会露出上一层。 */
function paintWear(g, rng) {
  for (const gt of GATES) {
    if (gt.id === "G3") continue;                  // 东南门是斜的，没铺车行道
    if (gt.dir === "h") {
      for (let i = -4; i <= 4; i++)
        for (let k = 0; k < 3; k++)
          px(g, Math.round(gt.x + i * 22 - 4 + rng() * 8), Math.round(gt.y - 26 + rng() * 50),
             1 + ((rng() * 3) | 0), 1 + ((rng() * 5) | 0), ASPHALT_RAMP[1]);
    } else {
      for (let i = -4; i <= 4; i++)
        for (let k = 0; k < 3; k++)
          px(g, Math.round(gt.x - 26 + rng() * 50), Math.round(gt.y + i * 22 - 4 + rng() * 8),
             1 + ((rng() * 5) | 0), 1 + ((rng() * 3) | 0), ASPHALT_RAMP[1]);
    }
  }
  /* 车辙：主干道两条轮迹带（5.5% 黑，很淡，只是"这条路天天有人走"的暗示） */
  for (const a of ARTERY) {
    if (a.cls !== 2) continue;
    const horiz = a.w >= a.h;
    for (const f of [0.30, 0.70])
      if (horiz) bandOnAsphalt(g, a.x, Math.round(a.y + a.h * f) - 1, a.w, 3, "rgba(14,18,28,0.055)");
      else       bandOnAsphalt(g, Math.round(a.x + a.w * f) - 1, a.y, 3, a.h, "rgba(14,18,28,0.055)");
  }
}

/* --- 2.8.4 树下落花 / 落叶 -------------------------------------------
   ⚠️ 由 60_assemble §6.6d 在**所有 props 排好之后**调用；画在地面画布上。
   开花树（66×78，四物种里唯一的 66 宽）落粉花瓣，其余树种掉黄绿落叶。
   ⚠️ 第一版是"均匀撒 6 粒"—— 结果**根本看不出来**：草地本身就有满屏的黄绿
   小点（nature 段的草纹），再撒几粒同色小点等于没画。改成**成簇**：
   先取 3~4 个簇心（离树干 8~19px），每簇再挤 4~5 粒 —— 眼睛读到的是
   "树下落了一小堆"，而不是又一层草地噪点。
   落到水面 / 界外就跳过（落水里就脏了）。 */
const FALL_BLOSSOM = ["#f2d3dd", "#e9bccb", "#dda8bb", "#c98ba4"];
const FALL_LEAF    = ["#8fae55", "#a8bf68", "#c8b455", "#b07a33", "#8a6b2c"];
function paintLeafFall(g, list, rng) {
  let n = 0;
  const put = (x, y, cols) => {
    if (x < 2 || y < 2 || x > WORLD_W - 3 || y > WORLD_H - 3) return;
    const cx = (x / CELL) | 0, cy = (y / CELL) | 0;
    if (CELLK[cy * NW + cx] === K.WATER) return;      // 落水里就脏了
    if (rng() < 0.22) px(g, x, y + 1, 2, 1, "rgba(14,18,28,0.13)");   // 先垫一点接地影
    px(g, x, y, rng() < 0.34 ? 2 : 1, 1, cols[(rng() * cols.length) | 0]);
  };
  for (const p of list) {
    if (p.tag !== "tree") continue;
    const blossom = p.img.width === 66;
    const cols = blossom ? FALL_BLOSSOM : FALL_LEAF;
    const cl = blossom ? 4 : 3;                       // 簇数
    for (let c = 0; c < cl; c++) {
      const a = rng() * 6.2832, r = 8 + rng() * 11;   // 簇心：压在树冠投影内、避开树干
      const bx = p.x + Math.cos(a) * r * 1.5, by = p.y + Math.sin(a) * r * 0.75;
      const m = 3 + ((rng() * 3) | 0);                // 每簇 3~5 粒
      for (let i = 0; i < m; i++)
        put(Math.round(bx + (rng() - 0.5) * 7), Math.round(by + (rng() - 0.5) * 4), cols);
    }
    n++;
  }
  return n;
}

/* =========================================================
   4.9 南门拱门 —— 按 建筑物照片/南门.jpg 还原的红色高拱
   ---------------------------------------------------------
   南门（GATES G2）原先是与其余四个门共用的"两根门柱 + 一块横匾"模板，
   跟照片里那座**高拱红门**完全不是一个东西，所以这一座单独画：
   半圆红拱带（竖棱）＋ 内缘亮银包边 ＋ 拱顶蓝色校徽 ＋ 沿弧排的四个金字。
   `46_walls.js` 的 `buildGates()` 里 G2 直接 `continue` 掉 ——
   其余四个门、四十几栋楼、思源楼逐像素不变。

   几何全部由「外宽」推出来。外宽就是墙缺口（GATES G2 的 w = 195）——
   动它等于动墙，所以是硬不变量；照片只用来看**比例**：

     外宽 621px（照片，柱脚处左右外缘）         → 195 世界px，比例 0.314
     拱带厚 60px（同一行量，两缘都是竖线⇒真厚） → 19  ⇒ 带厚/净宽 = 0.123
     净开口 489px                              → 157
     外半径为半圆：照片拱顶 669、外圆心 976、R=306.5 ⇒ 拱顶 = 圆心 − R
                    ⇒ 我们这边同样取 RO = 97 的半圆
     校徽 124px 直径                            → 38，心在拱顶下 81px ⇒ y=26
     柱长 950px（起拱线 976 → 柱脚 1926）        → 302（★见下）
     总高 1257px                                → 400

   ⚠️ 柱高是**唯一**做了取舍的量：照实取 302（总高 400）会高出 1× 视野
   （480×270）一倍多，也比全校任何一栋楼都高。这里取 SG_PH = 190
   （总高 287，≈ 1.5×外宽），既有"很高"的量感，又和楼群同量级。
   想更接近实拍只改 SG_PH 一个常量（302 就是实拍值）。

   拱腹暗面（SG_SOF）：照片里红拱带内侧还有一道很宽的深色内弧（仰视看到
   的拱腹内表面），宽度与红带同量级。它不只是好看 —— **它是四个金字的落脚
   处**：字高 28 > 拱带厚 19，而字还要随切线旋转，端部的「交」「学」沿径向
   的跨度有 ±17px，必然有一截溢出到红带内侧。没有这层暗面，那几粒金点就
   飘在门洞外的空气里（第一版就是这样，3× 下一眼可见）。

   深度：画布中央是**真透明**的（中空 billboard），玩家在门洞里能透过拱
   看到人；baseY 取墙线 y ⇒ 走到门外（y 更大）自然压在拱前面，在门内则被
   拱挡在后面 —— 正是 3/4 视角该有的遮挡关系。

   字形与校徽不是手画的：是 `建筑物照片/字体.png` 里那笔校名毛笔字与校徽
   描出来的点阵（生成块见下）；拱红 / 金字 / 徽蓝取 `南门.jpg` 的中位色。
   ========================================================= */

/*__SG_GEN_BEGIN__*/

/* --- 4.9.1 几何常量 --- */
const SG_W = 195;                     // 画布宽 = 墙缺口宽（奇数 ⇒ 左右严格对称）
const SG_CX = 97;                     // 中列
const SG_T = 19;                      // 拱带厚（照片 60/489 = 0.123 ⇒ 19，见头注）
const SG_RO = 97;                     // 外半径（半圆，= 外宽/2）
const SG_RI = SG_RO - SG_T;           // 红拱带内缘 78
const SG_SOF = 17;                    // 拱腹暗面厚（见头注）；红带内缘再往里 17 ⇒ 洞内缘 61
const SG_SOF_Y0 = 70;                 // 暗面从这一行往下才开始收窄，到起拱线收成 0
const SG_LW = SG_T + 2;               // 立柱可见宽 = 拱带 + 门洞侧那 2px 拱腹暗面
const SG_PH = 190;                    // 立柱高（起拱线 → 地面）。★想更高改这里
const SG_H = SG_RO + SG_PH;           // 总高 287
const SG_EM_R = SG_EMN >> 1;          // 校徽半径 19（照片：直径 ≈ 2×拱带厚）
const SG_EM_CY = 26;                  // 校徽心高（照片实测：拱顶下 81px ⇒ 26）
/* 金字字心到拱心的半径。字高 28、宽 21，随切线旋转后**沿径向**的半跨度是
   (28·cosT + 21·sinT)/2 —— 拱顶 T=0 ⇒ 14，端部 T=47° ⇒ 17.2。
   取 79 ⇒ 径向落 [61.8, 96.2]：外缘不碰外轮廓（97，不会被 clip 削平一条直边），
   内缘落在拱腹暗面里（暗面到 r=61）。*/
const SG_CH_R = 79;

/* 拱带横截面用色（由内缘往外：亮银包边 / 灰压条 / 暗缝 / 红底竖棱） */
const SG_SILVER = "#cfcac0", SG_TRIM = "#8e8880", SG_SEAM = "#33201d";
const SG_SOFFIT = "#4a2a27";          // 门洞那侧的拱腹暗面
const SG_SHADOW = "rgba(14,18,28,0.34)";

/* 四个金字（[点阵, φ, 宽, 高]）由生成块给出：φ = 与 x 轴的夹角（度，y 朝上），
   拱顶是 90°；照片实测 132.4 / 108.1 / 71.9 / 47.6 —— 左右对称，顺序 交 通 大 学。 */

/* --- 4.9.2 点阵解码 / 旋转落笔 --- */
function sgBits(b64, cnt) {
  const raw = atob(b64), out = new Uint8Array(cnt);
  for (let i = 0; i < cnt; i++) out[i] = (raw.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  return out;
}
/* ⚠️ 必须**反算**（由目标像素反查源像素）：顺算在 42° 这种角度下会在字上留下
   一格一格的空洞。边缘就近取整 ⇒ 硬边像素，与全图风格一致。
   clip=true 时把笔画裁进**拱的外轮廓**（r ≤ RO−1）：金字随切线旋转后，最外缘
   够到 r≈96.2，稍有偏差就会冒到拱外面的天空/草地上。 */
function sgGlyph(g, m, nw, nh, cx, cy, rot, col, clip, shadow) {
  const a = rot * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const R = Math.ceil(Math.hypot(nw, nh) / 2) + 1, RC = SG_RO - 1;
  const hx = (nw - 1) / 2, hy = (nh - 1) / 2;
  const at = function (wx, wy) {                       // 这个屏幕像素在不在点阵里
    const dx = wx - cx, dy = wy - cy;
    const mx = Math.round(dx * ca + dy * sa + hx), my = Math.round(-dx * sa + dy * ca + hy);
    return (mx >= 0 && my >= 0 && mx < nw && my < nh && m[my * nw + mx]) ? 1 : 0;
  };
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      const wx = cx + dx, wy = cy + dy;
      if (clip) {
        const ex = wx - SG_CX, ey = wy - SG_RO;
        if (ex * ex + ey * ey > RC * RC) continue;
      }
      if (shadow) { if (!(at(wx, wy - 1) && !at(wx, wy))) continue; }
      else if (!at(wx, wy)) continue;
      px(g, wx, wy, 1, 1, col);
    }
  }
}
/* 金字：只在**下缘**补一列暗金（真正的 1px 投影：上一格有墨、这一格没有），
   再压中色 —— 出金属凸起感。
   ⚠️ 不能图省事"把整块字往上/下各印一遍"：那等于把笔画整体胀粗 1px，26px 的
   字里笔画间那道缝会被填死，四个字立刻糊成一团。所以投影只落在外轮廓下缘。
   不用"描一圈黑边"是因为字有一半悬在门洞的空里，黑边会飘在没有东西的地方。 */
function sgGold(g, m, nw, nh, cx, cy, rot) {
  sgGlyph(g, m, nw, nh, cx, cy, rot, shade(SG_GOLD, -0.42), true, true);
  sgGlyph(g, m, nw, nh, cx, cy, rot, SG_GOLD, true, false);
}

/* --- 4.9.3 拱带 --- */
/* 光照：光源在左上。横向线性为主 + 拱顶略亮（接到天光）—— 照片里左半边
   明显比右半边亮，这是全图唯一能体现"这是一圈曲面"的手段。 */
function sgLit(x, y) {
  return (SG_CX - x) / SG_RO * 0.30 + (1 - y / SG_H) * 0.06;
}
/* 红底竖棱：照片上是一层极密的竖向条纹（原片间隔 ≈1.7px，缩到世界像素已不足
   1px），只能用 1px 交替列当"质感"。幅度必须小，大了 1× 下整条拱带会花成噪点。 */
function sgRib(x, y) {
  return shade(SG_RED, sgLit(x, y) + ((x & 1) ? 0.075 : -0.065));
}
/* 画一行里的一段拱带。xIn = 红拱带内缘列（null = 这一段没有内缘，即拱顶实心段）：
   dIn 0/1/2 = 亮银包边/灰压条/暗缝，dIn < 0 = 内缘再往里那层拱腹暗面。
   暗面按深度递暗（−1 最亮、−6 之后到底）—— 照片里它是从红带内缘往洞里
   渐渐沉下去的一段，平涂一层会像贴了张黑纸。 */
function sgRow(g, y, xL, xR, xIn, left) {
  if (xR < xL) return;
  for (let x = xL; x <= xR; x++) {
    const dIn = xIn === null ? 99 : (left ? xIn - x : x - xIn);
    const dOut = left ? x - xL : xR - x;
    let col;
    if (dIn < 0) col = shade(SG_SOFFIT, -0.10 - Math.min(6, -dIn) * 0.055);
    else if (dIn === 0) col = SG_SILVER;
    else if (dIn === 1) col = SG_TRIM;
    else if (dIn === 2) col = SG_SEAM;
    else if (dOut === 0) col = shade(SG_RED, sgLit(x, y) - 0.34);
    else if (dOut === 1) col = shade(SG_RED, sgLit(x, y) + 0.14);
    else col = sgRib(x, y);
    px(g, x, y, 1, 1, col);
  }
}

/* 拱腹暗面在这一行的厚度。拱顶侧是满的，到起拱线（y = RO）收成 0 ——
   不收的话两根立柱内侧会各拖出一条 17px 宽的灰条直到地面，像门背后贴了
   两张黑纸。用 t² 收，收得比线性更快，最后 20 来行几乎是立刻没了。 */
function sgSoffitAt(y) {
  if (y >= SG_RO) return 0;
  const t = (SG_RO - y) / (SG_RO - SG_SOF_Y0);
  return t >= 1 ? SG_SOF : Math.round(SG_SOF * t * t);
}

/* --- 4.9.4 整座门 --- */
function makeSouthArch() {
  const c = mkCanvas(SG_W, SG_H + 3), g = c.getContext("2d");
  for (let y = 0; y < SG_H; y++) {
    let ow, iw;
    if (y < SG_RO) {
      const dy = SG_RO - y;
      ow = Math.round(Math.sqrt(SG_RO * SG_RO - dy * dy));
      iw = dy < SG_RI ? Math.round(Math.sqrt(SG_RI * SG_RI - dy * dy)) : 0;
    } else { ow = SG_RO; iw = SG_RI; }               // 起拱线以下：直柱
    if (iw <= 2) { sgRow(g, y, SG_CX - ow, SG_CX + ow, null, false); continue; }
    const xInL = SG_CX - iw - 1, xInR = SG_CX + iw + 1;
    /* 暗面内缘：夹一下，拱顶附近洞本来就只有几像素宽，不加夹会让左右两段
       越过中线互相盖住 */
    const sof = sgSoffitAt(y);
    const eL = Math.min(xInL + sof, SG_CX), eR = Math.max(xInR - sof, SG_CX);
    sgRow(g, y, SG_CX - ow, eL, xInL, true);
    sgRow(g, y, eR, SG_CX + ow, xInR, false);
  }
  /* 起拱线的施工缝（照片里能看见一道横缝） */
  px(g, SG_CX - SG_RO, SG_RO, SG_LW, 1, "rgba(0,0,0,0.22)");
  px(g, SG_CX + SG_RI - 1, SG_RO, SG_LW, 1, "rgba(0,0,0,0.22)");

  /* 徽下的拱腹石：照片里校徽正下方垂着一块灰石（拱腹的可见面），**往下收窄**、
     到末端收成一个尖。宽 17→9、垂 20px。画成方盒子会很愣，收尖才像石头。 */
  const sy0 = SG_EM_CY + SG_EM_R - 2, sh = 20;
  for (let i = 0; i < sh; i++) {
    const hw = Math.round(8 - 4 * i / (sh - 1));          // 半宽 8 → 4
    px(g, SG_CX - hw, sy0 + i, hw * 2 + 1, 1,
       shade("#57514a", -0.30 + (i / sh) * 0.30));
    px(g, SG_CX - hw, sy0 + i, 1, 1, "#4a443e");          // 左缘
    px(g, SG_CX + hw, sy0 + i, 1, 1, "#3c3733");          // 右缘
  }
  px(g, SG_CX - 8, sy0, 17, 1, "#6a635a");                // 顶面接徽

  /* 拱顶校徽：深色托边 + 蓝底 + 金色点阵（点阵取自用户给的校徽图） */
  circlePx(g, SG_CX, SG_EM_CY, SG_EM_R + 1, "#2b1a17");
  circlePx(g, SG_CX, SG_EM_CY, SG_EM_R, SG_EMBLUE);
  /* 徽的金色点阵：不裁（徽心在 r=71、R=19，本来就整块在拱内）、不投影
     （底是深蓝，反差已经够；再压暗金边会糊掉徽里那些细线） */
  sgGlyph(g, sgBits(SG_MASK_EM, SG_EMN * SG_EMN), SG_EMN, SG_EMN,
          SG_CX, SG_EM_CY, 0, SG_GOLD, false, false);

  /* 四个金字（沿弧、随切线倾斜） */
  for (const cs of SG_CHARS) {
    const a = cs[1] * Math.PI / 180, nw = cs[2], nh = cs[3];
    sgGold(g, sgBits(cs[0], nw * nh), nw, nh,
           Math.round(SG_CX + SG_CH_R * Math.cos(a)),
           Math.round(SG_RO - SG_CH_R * Math.sin(a)), 90 - cs[1]);
  }

  /* 柱础 + 接地影：只落在两根立柱下 —— 门洞里也画一道就会像地面多了道坎 */
  px(g, SG_CX - SG_RO, SG_H - 3, SG_LW, 3, shade(SG_RED, -0.38));
  px(g, SG_CX + SG_RI - 1, SG_H - 3, SG_LW, 3, shade(SG_RED, -0.38));
  px(g, SG_CX - SG_RO, SG_H, SG_LW, 3, SG_SHADOW);
  px(g, SG_CX + SG_RI - 1, SG_H, SG_LW, 3, SG_SHADOW);
  px(g, SG_CX - SG_RI, SG_H, SG_RI * 2 + 1, 2, "rgba(14,18,28,0.16)");
  return { canvas: c, ax: SG_CX, ay: SG_H, w: SG_W, h: SG_H };
}

/* tag:"gate" 是为了让 60_assemble 的 clearPropTreeClash 跳过它 ——
   那段会按"树盖住小道具接地线"删道具，而这门宽 195 > 90 本来会走楼的分支，
   带上 tag 直接免检，省得将来改判据时误伤。 */
function buildSouthArch() {
  const G = GATES.find(o => o.id === "G2");
  const s = makeSouthArch();
  props.push({ img: s.canvas, ax: s.ax, ay: s.ay, x: G.x, y: G.y, baseY: G.y, tag: "gate" });
}

/* =========================================================
   5. 角色：四向 × 六相位（重画版，A 档：头 6px / 4.3 头身）
   ---------------------------------------------------------
   ⚠️ 对外契约（**只有 step 的取值域变了**，别的与 demo §5 逐字相同）：
        CH_W / CH_H / CH_AX / CH_AY           四个常量（值不变）
        makeChar(dir, step) -> canvas         step 0..3 行走四帧 / 4..5 待机两帧
        charSprite(dir, step)                 按 dir+step 缓存（键自动扩到 6 个相位）
      唯一的调用点是主循环里的 drawList.push({... charSprite(player.dir, player.step) ...})，
      锚点仍是 ax = CH_AX / ay = CH_AY，所以"脚踩在世界坐标 y 上"这件事没变。

   与上一版的差别（这一步新做的三件事）：
      A) **2 帧 → 4 帧行走**。原来 `& 1` 只有两个姿势，一个周期里身体只起伏一次，
         看着像"整块人在弹"。现在走的是教科书四帧：接触（跨开）→ 通过（并立抬身）
         → 接触（镜像）→ 通过（并立抬身）。
      B) **待机呼吸帧**。站着不动时不再是死定格：2 帧、约 0.4 Hz，吸气时上身抬 1px。
      C) **步态由"实际位移"驱动**（改在主循环补丁 11，不在本文件）：原来 `walk += dt`
         顶着墙走也照常累加 → 人会原地踏步；现在顶墙位移为 0，脚立刻停。
         步频也不再是硬编码的 `* 7`，而是每 WALK_STRIDE 世界像素走完一个周期。

   为什么重画（对着 demo §5 逐条数出来的五个问题，前四个是代码/肉眼，第五个是实测）：
     1) 头身比 3.4（头 8px / 全身 27px）—— Q 版娃娃。
     2) 结构是"一摞方块"：躯干 = 一个 10×8 矩形，手臂/腿都是直条 ——
        没有肩斜、肘、膝、腰。
     3) 全画面只有它没有 1px 深色收边（楼有棱线、树有暗底叶簇、灌木有背光球）
        → 剪影在草地/路面上发虚。
     4) 明暗只有左右二分（左亮右暗），没有顶光、没有遮蔽（下巴/腋下/胯下）。
     5) 【实测】朝右的精灵**接地影方向是反的**：demo 的 flipH() 用 translate+scale
        画完后不 restore，变换留在返回画布的 context 上，末尾的 ellipsePx 影子
        被又镜像了一次。实测影子重心相对身体重心的偏移：
            现版 down +1.5 / left +1.0 / right **−1.0** / up +1.5
        树、楼、灌木的影子全朝右下，只有"朝右的角色"逆着光。本版修了，四向一律 +1.5。

   ⚠️ 头身比的取舍：真人 7.5 头身，但 30px 画布里头一缩小，脸就没了。
      540 个像素撑不起写实，只能撑起"可读的真人剪影 + 真实的重心与节拍"。
      这里取头 6px（4.3 头身）：脸留 4 行（眼/鼻/嘴/下颌），成年人骨架成立。
      （头 8px 的 3.4 头身版本试过，脸会挤成一团络腮胡，且与现版同比例、没解决问题。）
   ========================================================= */
const CH_W = 18, CH_H = 30, CH_AX = 9, CH_AY = 27;

/* --- 步态相位表 ---------------------------------------------------------
   4 帧行走 + 2 帧待机，一个周期 = 左右各一步。
   ⚠️ 两个视角要**分别**给参数，不能共用一个"腿相位"：
      侧面看不到左右，只能看前后 → m（1 左腿跨在前 / 2 右腿跨在前 / 0 并立）；
      正背面看不到前后，只能看左右 → fl（抬哪条腿：0 并立 / 1 抬左 / 2 抬右）+ spread（两腿分不分）。
   踩过坑：两帧都用"并立"来当通过帧，正背面看这两帧的腿就一模一样，4 帧白给一帧
   （只有手臂不同，远看就是同一张）。所以抬腿相位在两个通过帧里**交替**，
   接触帧也各抬一条（在后的那条腿离镜头更远，画高 1px）。
   bob 骨盆起伏（只抬腰以上，脚不离地）；sw 手臂摆相。 */
const WALK_FRAMES = 4, IDLE_BASE = 4, IDLE_FRAMES = 2;
const GAIT = [
  { m: 1, fl: 2, spread: 1, bob: 0, sw: 0 },   // 0 接触：两腿分开、左腿在前（右腿远，抬 1px）
  { m: 0, fl: 2, spread: 0, bob: 1, sw: 1 },   // 1 通过：并立抬身、右腿抬起经过
  { m: 2, fl: 1, spread: 1, bob: 0, sw: 1 },   // 2 接触：两腿分开、右腿在前（左腿远，抬 1px）
  { m: 0, fl: 1, spread: 0, bob: 1, sw: 0 },   // 3 通过：并立抬身、左腿抬起经过
  { m: 0, fl: 0, spread: 0, bob: 0, sw: 0 },   // 4 待机：呼气
  { m: 0, fl: 0, spread: 0, bob: 1, sw: 0 }    // 5 待机：吸气（上身抬 1px）
];
/* 一个完整步态周期走过的世界像素。1× 档速度 200 px/s → 200/160 = 1.25 周期/秒
   = 2.5 步/秒（真人 1.8~2.0，游戏里略快是合适的）。3× 档世界速度减半，步频跟着慢下来。
   ⚠️ 两个数都必须在这里声明：主循环补丁 11 要用，而主循环段排在角色段之后。 */
const WALK_STRIDE = 160;
const IDLE_HZ = 0.4;                   // 待机呼吸约 2.5 秒一个来回

const A2 = {
  skin:  "#e9bb92", skinD: "#c4906a", skinL: "#f7d3ae",
  hair:  "#241d1a", hairL: "#3d3029", hairD: "#150f10",
  coat:  "#3f6ea8", coatD: "#2b4d76", coatL: "#5d8cc4",
  pant:  "#454c5a", pantD: "#2b303a", pantL: "#5c6474",   // 比现版提亮：描边(k=0.45)才读得出来
  shoe:  "#26282e", shoeL: "#454a54",
  pack:  "#b4552f", packD: "#8a3f22", packL: "#d1704a"
};

/* --- 自动描边：给精灵四周的透明像素补 1px 收边 ---------------------------
   ⚠️ 不用"纯黑描边"（像素画里太硬、显脏），而是**取相邻实心像素的颜色压暗**
   —— 这叫彩色描边：头发的边 = 更黑的头发、袖子的边 = 更深的蓝。剪影立刻清楚。
   一次调用可给任何精灵加收边；给树/灌木加是同一行代码。
   ⚠️ 必须画在接地影**之前**，否则影子会被描一圈边。
   ⚠️⚠️ 必须先把变换复位成单位阵 —— flipH() 用 translate+scale 画完后**不 restore**，
   返回的画布 context 上永久留着 translate(W,0) scale(-1,1)。
   往这种画布上 fillRect(x,y,1,1) 会落到 W-1-x：描边跑到另一侧、原侧留空 1px，
   镜像方向的精灵会多出"空格 + 外挂 1px"的鬼影（实测：右侧 24 个内部空洞，
   左侧 0 个）。下面这行是必须的，不是防御性代码。 */
function outlineSprite(c, k) {
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  const src = (x, y) => (x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 40)
    ? (y * W + x) * 4 : -1;
  const NB = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  const edge = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) continue;
      for (let n = 0; n < 4; n++) {                 // 四邻即可：八邻会让四角鼓 1px
        const j = src(x + NB[n][0], y + NB[n][1]);
        if (j >= 0) { edge.push(x, y, j); break; }
      }
    }
  }
  for (let i = 0; i < edge.length; i += 3) {
    const j = edge[i + 2];
    g.fillStyle = "rgb(" + ((d[j] * k) | 0) + "," + ((d[j + 1] * k) | 0) + "," + ((d[j + 2] * k) | 0) + ")";
    g.fillRect(edge[i], edge[i + 1], 1, 1);
  }
}

/* =========================================================
   参数化构建：HH = 头高（含发）。整个骨架由它推出来，改一处不散架。
   ---------------------------------------------------------
   纵向预算（画布 18×30，脚底线 gy = CH_AY = 27）：
     y1 .. y1+HH-1   头
     y1+HH           颈（1 行）
     y1+HH+1         肩/躯干起
     躯干 + 腿 平分剩下的行数（真人的肩-胯 ≈ 胯-脚底），鞋固定占 y25-26
   bob 只抬"腰以上"：走路的真实构造是**骨盆起伏、脚不离地**。
   现版是两帧整体平移（bob 直接加在全体），所以看着像"整块画在跳"。
   ========================================================= */
function buildChar(HH) {
  const TOP = 1, SHOE_TOP = 25, cx = CH_AX, gy = CH_AY;
  const NECK = TOP + HH, TOR = NECK + 1;
  const bodyRows = SHOE_TOP - TOR;
  const TORSO = Math.max(6, Math.round(bodyRows / 2));
  const LEGT = TOR + TORSO, LEGR = SHOE_TOP - LEGT;          // 腿的行数（不含鞋）
  const KNEE = LEGT + Math.max(2, Math.round(LEGR * 0.55));
  const HW = HH >= 7 ? 8 : 7;                                // 头宽
  const H2 = (HW - 1) >> 1;                                  // 头左右各伸出的像素数
  const ARMR = Math.max(4, TORSO - 3);
  const FACE = HH - 2;                                       // 脸的行数

  return function (dir, step) {
    const c = mkCanvas(CH_W, CH_H), g = c.getContext("2d");
    const P = (x, y, w, h, col) => { if (w > 0 && h > 0) px(g, x, y, w, h, col); };
    const F = GAIT[step] || GAIT[0];                         // 相位：0..3 行走 / 4..5 待机
    const b = F.bob;                                         // 骨盆起伏 1px
    const HY = TOP + b;                                      // 头顶（腰以上整体上移）
    const ty = TOR + b, ly = LEGT + b;                       // 躯干起 / 髋

    /* ---------- 头 ---------- */
    function head(face) {
      P(cx - H2 + 1, HY, HW - 2, 1, A2.hairL);               // 发顶受光（顶光层）
      P(cx - H2, HY + 1, HW, 1, A2.hair);
      if (!face) {                                           // 背向：后脑 + 左棱受光
        P(cx - H2, HY + 2, HW, HH - 2, A2.hair);
        P(cx - H2, HY + 1, 1, HH - 1, A2.hairL);
        P(cx + H2, HY + 1, 1, HH - 1, A2.hairD);
        P(cx - 1, HY + 2, 2, 1, shade(A2.hair, 0.20));       // 发旋小高光（不是横贯亮带）
        return;
      }
      P(cx - H2, HY + 2, HW, FACE, A2.skin);                 // 脸
      P(cx - H2, HY + 2, 1, FACE, A2.skinL);                 // 左颊受光（光自左上）
      P(cx + H2, HY + 2, 1, FACE, A2.skinD);                 // 右颊背光
      /* ⚠️ 五官一律以 HY（会随 bob 起伏）为基准，**不能用 TOP 绝对行号**：
         b=1 时脸整体下移 1px，五官若留在原地就顶到刘海线上、嘴跑到眼睛下格，
         整张脸糊成一条黑带（sprite.py 的"头块刚性"探针会实测出来）。 */
      const EY = HY + 2 + (FACE >= 5 ? 2 : 1);               // 眼睛所在行
      P(cx - 2, EY, 1, 1, A2.hairD);                         // 左眼
      P(cx + 1, EY, 1, 1, A2.hairD);                         // 右眼（间距 2px）
      if (FACE >= 5) P(cx, EY + 1, 1, 1, A2.skinD);          // 鼻影（脸够高才放得下）
      P(cx - 1, HY + FACE, 3, 1, shade(A2.skinD, -0.28));    // 嘴（脸的倒数第二行）
      P(cx - H2 + 1, HY + FACE + 1, HW - 2, 1, A2.skinD);    // 下颌收边（脸的最后一行）
    }
    /* ---------- 躯干（胸宽 9 → 腰宽 7 → 衣摆） ---------- */
    function torso(back) {
      P(cx - 4, ty, 9, 1, A2.coatL);                         // 肩顶受光
      const chest = Math.max(2, TORSO - 3);
      P(cx - 4, ty + 1, 9, chest, A2.coat);                  // 胸
      P(cx - 3, ty + 1 + chest, 7, TORSO - 1 - chest, A2.coat);   // 腰（左右各收 1px）
      P(cx - 4, ty + 1, 2, TORSO - 1, A2.coatL);             // 左侧受光面
      P(cx + 3, ty + 1, 1, TORSO - 1, A2.coatD);             // 右侧背光面
      P(cx - 4, ty + chest, 9, 1, "rgba(0,0,0,0.13)");       // 胸腰分界
      P(cx - 3, ty + TORSO - 1, 7, 1, A2.coatD);             // 衣摆（压实腰线，与裤头对齐）
      if (back) {
        P(cx - 3, ty + 1, 7, TORSO - 4, A2.pack);            // 书包
        P(cx - 3, ty + 1, 7, 1, A2.packL);
        P(cx + 2, ty + 1, 1, TORSO - 4, A2.packD);
        P(cx - 2, ty - 1, 5, 1, "rgba(0,0,0,0.26)");         // 背带压肩
      } else {
        P(cx, ty + 1, 1, TORSO - 2, A2.coatD);               // 前襟
        P(cx - 2, ty + chest + 2, 4, 1, A2.coatD);           // 口袋线
      }
    }
    /* ---------- 手臂（2px，肘内收 1px），左右反相摆动 ---------- */
    function arms(sw, back) {
      const aL = ty + 1 + sw, aR = ty + 1 + (sw ? 0 : 1);
      P(cx - 6, aL, 2, ARMR, back ? A2.coat : A2.coatL);     // 左臂（受光侧）
      P(cx - 6, aL + ((ARMR / 2) | 0), 1, 1, A2.coatD);      // 肘
      P(cx - 6, aL + ARMR, 2, 2, A2.skin);                   // 左手
      P(cx + 5, aR, 2, ARMR, A2.coatD);                      // 右臂（背光侧）
      P(cx + 6, aR + ((ARMR / 2) | 0), 1, 1, A2.hairD);      // 肘
      P(cx + 5, aR + ARMR, 2, 2, A2.skinD);                  // 右手
    }
    /* ---------- 腿（大腿 → 膝 → 小腿 → 鞋）----------
       fl: 0 并立 / 1 抬左腿 / 2 抬右腿。抬腿 = 小腿与鞋整体上移 1px（在后的那条腿离镜头更远）。
       spread: 接触帧两腿各外移 1px —— 正背面看"迈步"只能靠这个（前后是看不出来的）。
       ⚠️ 小腿的**起点必须跟着上移到 knee**。老写法是"大腿缩短 1px、小腿仍从 KNEE 起"，
          会在 KNEE-1 行留一条 1px 空洞 —— 描边会把这个洞填成一圈深色，肉眼看是腿中段断了一格。
          现在大腿定长、小腿从 knee 起严丝合缝，膝线**显式画**出来（不再靠缝隙让描边去填）。 */
    function legs(fl, spread) {
      function one(x, shx, edge, edgeCol, up) {
        const knee = KNEE - up, bot = SHOE_TOP - up;
        P(x, ly, 3, KNEE - ly, A2.pant);                 // 大腿（定长，到 KNEE-1）
        P(x + edge, ly, 1, KNEE - ly, edgeCol);          // 受光 / 背光边
        P(x, ly, 3, 1, "rgba(0,0,0,0.18)");              // 胯下遮蔽
        P(x, knee, 3, bot - knee, A2.pant);              // 小腿
        P(x, knee, 3, 1, shade(A2.pant, -0.20));         // 膝线
        P(shx, bot, 4, 2, A2.shoe);                      // 鞋（比腿宽 1px：脚是横的）
        P(shx, bot, 4, 1, A2.shoeL);
      }
      const d = spread ? 1 : 0;
      one(cx - 3 - d, cx - 4 - d, 0, A2.pantL, fl === 1 ? 1 : 0);   // 左腿（受光侧，亮边在左）
      one(cx + 1 + d, cx + 1 + d, 2, A2.pantD, fl === 2 ? 1 : 0);   // 右腿（背光侧，暗边在右）
    }
    /* ---------- 侧视：额头-鼻-下巴的台阶 + 迈步的前后腿交叉 ----------
       mode: 0 并立 / 1 左腿跨在前 / 2 右腿跨在前。侧面看不到左右，只有"前后"：
       跨步靠**两条腿的横向错位**表达（前腿短 1px 显得更远、后腿长 1px 是蹬地踩实），
       所以 mode 1/2 的差别不是几何而是**亮暗边换边**——哪条腿在前，亮边就跟到哪条腿上。
       并立帧（mode 0）两腿重叠在同一列，这时由 sw 决定亮边露在哪一侧：
       1 帧与 3 帧的**像素差别就只有这个**（不然两帧完全相同，4 帧白给一帧）。 */
    function side(mode, sw) {
      const s = mode === 0 ? 2 : 0;                      // 2 = 两腿并到同一列
      const fx = cx - 3 + s, bx = cx + 1 - s;
      const fl = mode === 1 || (mode === 0 && !sw);       // 跨在前的是不是左腿
      const th = KNEE - ly;
      P(fx, ly, 3, th, A2.pant);                         // 前腿（迈向前）
      P(fx + (fl ? 0 : 2), ly, 1, th, fl ? A2.pantL : A2.pantD);
      P(fx, KNEE, 3, SHOE_TOP - KNEE, A2.pant);
      P(fx - 1, SHOE_TOP, 4, 2, A2.shoe);                // 前脚（脚尖朝行进方向）
      P(fx - 1, SHOE_TOP, 4, 1, A2.shoeL);
      P(bx, ly, 3, th + 1, A2.pant);                     // 后腿（蹬地，长 1px）
      P(bx + (fl ? 2 : 0), ly, 1, th + 1, fl ? A2.pantD : A2.pantL);
      P(bx, KNEE + 1, 3, SHOE_TOP - KNEE - 1, A2.pant);
      P(bx, SHOE_TOP, 4, 2, A2.shoe);                    // 后脚
      P(bx, SHOE_TOP, 4, 1, A2.shoeL);
    }
    /* ---------- 侧视的头与躯干（与相位无关，抽出来只为让 side() 读起来是"人"不是"色块"） ---------- */
    function sideBody(sw) {
      P(cx - H2 + 1, HY, HW - 2, 1, A2.hairL);
      P(cx - H2, HY + 1, HW, 1, A2.hair);
      P(cx - H2, HY + 2, HW, HH - 2, A2.skin);
      P(cx + 1, HY + 2, 3, HH - 2, A2.hair);                 // 后脑
      P(cx + H2, HY + 2, 1, HH - 2, A2.hairD);
      P(cx - H2, HY + 2, H2 + 1, 1, A2.hair);                // 刘海压额（额头有台阶）
      const EY = HY + 2 + (FACE >= 5 ? 2 : 1);               // 同正面：五官必须跟着 HY 走
      P(cx - 2, EY, 1, 1, A2.hairD);                         // 眼
      P(cx - H2, EY - 1, 1, 1, A2.skinL);                    // 额头受光
      P(cx - H2, EY + 1, 1, 1, A2.skinL);                    // 鼻尖受光（侧脸第二个台阶）
      P(cx - H2, HY + FACE, 2, 1, A2.skinD);                 // 下巴
      P(cx - 3, ty, 6, 1, A2.coatL);                         // 肩顶
      P(cx - 3, ty + 1, 6, TORSO - 1, A2.coat);              // 侧视厚度 6px（正/背面 9px）
      P(cx - 3, ty + 1, 1, TORSO - 1, A2.coatL);             // 胸前受光
      P(cx + 2, ty + 1, 1, TORSO - 1, A2.coatD);             // 后背背光
      P(cx - 3, ty + TORSO - 1, 6, 1, A2.coatD);             // 衣摆
      P(cx + 1, ty + 1, 3, TORSO - 3, A2.pack);              // 书包（侧视露在背后）
      P(cx + 3, ty + 1, 1, TORSO - 3, A2.packD);
      P(cx + 1, ty + 1, 3, 1, A2.packL);
      /* ⚠️ 侧视摆臂**故意摆 2px**（正/背面只有 1px）：侧视的"通过帧"在几何上近乎对称，
         两帧只能靠亮暗边换边 + 手臂位置区分，摆 1px 时两帧差异只有 ~20 像素、几乎看不出。
         侧视里手臂是唯一能大幅表达节奏的部位，摆大一点整个步态才读得出来。 */
      const ao = sw ? 2 : 0;
      P(cx - 4, ty + 2 + ao, 2, ARMR, A2.coatL);             // 前臂摆到身前
      P(cx - 4, ty + 2 + ao + ARMR, 2, 2, A2.skin);          // 手
    }

    if (dir === "up")        { head(false); torso(true);  arms(F.sw, true);  legs(F.fl, F.spread); }
    else if (dir === "down") { head(true);  torso(false); arms(F.sw, false); legs(F.fl, F.spread); }
    /* ⚠️ 顺序不能反：先头/躯干再腿，腿压在躯干上沿 —— 反过来衣摆会盖住大腿根。 */
    else                     { sideBody(F.sw); side(F.m, F.sw); }

    /* --- 后处理：镜像 → 描边 → 接地影（唯一一条出口）---
       ⚠️ 镜像后必须复位变换（flipH 的 translate+scale 留在 context 上），
       否则描边和接地影都会被**再镜像一次** —— 影子跑到左下（demo 现版朝右精灵就中招）。 */

    if (dir === "right") { out = flipH(c); out.getContext("2d").setTransform(1, 0, 0, 1, 0, 0); }
    outlineSprite(out, 0.45);
    /* 接地影：朝右下（与树/楼/灌木同向，偏移 +1.5）。
       ⚠️ 必须在描边之后画 —— 否则影子会被描一圈边。
       ⚠️ 几何是量出来的，不是拍的：足迹必须落在 x6..16 / y27..29 内。
          试过 (cx+3, rx=8)，会铺到 x4..20 —— 右端被画布硬切，
          y29 在最右列留下一排 α54 的实心影子（肉眼是一条竖刀口）。 */
    shadowBlob(out.getContext("2d"), cx + 2, gy + 1, 5, 2, 0.46, 3);

function syBits(b64, cnt) {
  const raw = atob(b64), out = new Uint8Array(cnt);
  for (let i = 0; i < cnt; i++) out[i] = (raw.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  return out;
}
