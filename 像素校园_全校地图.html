<!DOCTYPE html>

<style>

    pointer-events:auto;cursor:pointer;width:26px;height:24px;padding:0;

  #zoom b{min-width:52px;text-align:center;color:#ffd76e;font-weight:600;}

  #zoom input[type=range]{
    pointer-events:auto;cursor:pointer;margin:0;width:170px;height:20px;
    background:transparent;-webkit-appearance:none;appearance:none;

<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud">
  <b>像素校园</b> · 全校地图<br>
  <span>← → / A D 左右移动　↑ ↓ / W S 前后移动</span><br>
  <span>滚轮 / + − 缩放　0 看全图　1 回原尺寸　（也可拖右下角滑条）</span><br>

</div>
<div id="zoom">
  <button data-z="-1" title="缩小一档">−</button>
  <input id="zrng" type="range" min="0" max="8" step="1" value="6" aria-label="缩放档位">
  <button data-z="1" title="放大一档">+</button>
  <b id="zoomlv">1×</b>
</div>
<script>
"use strict";

/* =========================================================
   0. 常量 / 标尺
   ---------------------------------------------------------
   标尺由**思源楼**推出（用户给定：思源楼 = 50 米）：

     思源楼世界宽  450 px = 50 m   ⇒ 1 世界像素 ≈ 0.1111 m
     思源楼 PPT 宽 1.1521 in       ⇒ 1 英寸 = 450 / 1.1521 = 390.5911 px

   世界尺寸 = 整张 PPT 幻灯片（13.33333 × 7.5 英寸）。
   三重交叉验证见交接文档 §4.4（篮球场 28.7m / 网球场 25.0m）。
   ========================================================= */
const TILE    = 32;                           // 瓦片尺寸（保持颗粒感）
const U       = 450 / 1.1521;                 // 390.5911 世界像素 / 英寸
const IX      = v => v * U;                   // 英寸 → 世界像素
const WORLD_W = Math.round(13.33333 * U);     // 5208
const WORLD_H = Math.round(7.5 * U);          // 2929（7.5×390.5911=2929.43）
const VIEW_W  = 480, VIEW_H = 270;            // **背板**尺寸（16:9），整数倍放大到屏幕
                                              // ⚠️ 它不等于可见世界尺寸：世界视口 = 背板 / zoom
const BASE_SPEED = 200;                       // 1× 档下的行走速度（世界像素/秒）

/* --- 缩放 ---------------------------------------------------------
   zoom = 每个世界像素占几个背板像素。背板恒为 VIEW_W×VIEW_H 不变，
   所以 zoom=4 就是"把 120×67 的世界区域放大 4 倍显示" —— 像素风里这就是变大看细节，
   信息量本来就在背板里，不需要动背板分辨率。
   于是：可见世界尺寸 = VIEW_W/zoom × VIEW_H/zoom。

   档位刻意**离散**：像素风连续缩放只会糊。且 ≥1 的档位只取整数 ——
   非整数倍最近邻放大必然出现"某列 1px、某列 2px"的宽窄不齐。

   两端都由用户定死：一端是"整个校园"（FIT，再往外就是世界外的纹理区，没意义），
   另一端封顶 3×（视野 ≈18×10 米）—— 再拉近就只看得见一个门洞，容易"不知道自己站在哪"。 */
const FIT = Math.min(VIEW_W / WORLD_W, VIEW_H / WORLD_H);   // ≈0.09217：整幅铺满视口
const ZOOM_STEPS = [FIT, 1 / 8, 1 / 6, 1 / 4, 1 / 3, 1 / 2, 1, 2, 3];
let zoomI = ZOOM_STEPS.indexOf(1);            // 默认 1×（与无缩放版观感完全一致）
let zoom  = ZOOM_STEPS[zoomI];
let viewW = VIEW_W / zoom, viewH = VIEW_H / zoom;   // 可见世界矩形尺寸
const mips = [];                              // 地面 mip 金字塔（÷1 ÷2 ÷4 ÷8），6.0.1 填

/* PPT 形状 {x,y,w,h}（英寸）→ 世界像素矩形 */
const rc = s => ({ x: IX(s.x), y: IX(s.y), w: IX(s.w), h: IX(s.h) });

/* 全局光源：从左上方来。所有明暗与投影方向都必须服从它。
   投影方向 = -SUN，即朝右下方。 */
const SUN = { x: -0.60, y: -0.80 };

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const wrapi = (i, m) => ((i % m) + m) % m;

function mkCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
function px(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function makeRng(seed) {                     // 确定性随机，保证每次刷新一致
  let s = seed >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function circlePx(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const t = r * r - y * y;
    if (t < 0) continue;
    const dx = Math.floor(Math.sqrt(t));
    g.fillRect(Math.round(cx - dx), Math.round(cy + y), dx * 2 + 1, 1);
  }
}
function ellipsePx(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t <= 0) continue;
    const dx = Math.floor(rx * Math.sqrt(t));
    g.fillRect(Math.round(cx - dx), Math.round(cy + y), dx * 2 + 1, 1);
  }
}
function poly(g, pts, col) {
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  g.fill();
}
function flipH(src) {                        // 水平镜像（右侧角色 = 左侧镜像）
  const c = mkCanvas(src.width, src.height);
  const g = c.getContext("2d");
  g.translate(src.width, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}
function speckle(g, x, y, w, h, col, count, rng) {   // 颗粒 / 磨损 / 灰尘
  g.fillStyle = col;
  for (let i = 0; i < count; i++) g.fillRect(x + ((rng() * w) | 0), y + ((rng() * h) | 0), 1, 1);
}

/* ---------------------------------------------------------
   1.1 颜色运算 —— 真实感的核心
   统一光源要求：受光面偏暖、背光面偏冷，
   而不是简单叠一层半透明黑。
   --------------------------------------------------------- */
const _hc = Object.create(null);
function rgb(hex) {
  let v = _hc[hex];
  if (v === undefined) {
    v = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    _hc[hex] = v;
  }
  return v;
}
function rgba(hex, a) {
  const c = rgb(hex);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}
/* k > 0 提亮（偏暖）；k < 0 压暗（偏冷） */
function shade(hex, k) {
  const c = rgb(hex);
  let r, g, b;
  if (k >= 0) {
    r = c[0] + (255 - c[0]) * k;
    g = c[1] + (255 - c[1]) * (k * 0.93);
    b = c[2] + (255 - c[2]) * (k * 0.80);
  } else {
    const t = -k;
    r = c[0] * (1 - t * 1.08);
    g = c[1] * (1 - t * 1.00);
    b = c[2] * (1 - t * 0.86);
  }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}
function mix(hexA, hexB, t) {
  const A = rgb(hexA), B = rgb(hexB);
  return "rgb(" + ((A[0] + (B[0] - A[0]) * t) | 0) + ","
                 + ((A[1] + (B[1] - A[1]) * t) | 0) + ","
                 + ((A[2] + (B[2] - A[2]) * t) | 0) + ")";
}

/* ---------------------------------------------------------
   1.2 值噪声 —— 让地面出现"成片的深浅"而不是纯随机噪点
   --------------------------------------------------------- */
function makeNoise(seed, gw, gh) {
  const r = makeRng(seed), v = new Float32Array(gw * gh);
  for (let i = 0; i < v.length; i++) v[i] = r();
  return { gw, gh, v };
}
function noiseAt(n, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let tx = x - xi, ty = y - yi;
  tx = tx * tx * (3 - 2 * tx);
  ty = ty * ty * (3 - 2 * ty);
  const at = (a, b) => n.v[wrapi(b, n.gh) * n.gw + wrapi(a, n.gw)];
  const v00 = at(xi, yi), v10 = at(xi + 1, yi), v01 = at(xi, yi + 1), v11 = at(xi + 1, yi + 1);
  return (v00 * (1 - tx) + v10 * tx) * (1 - ty) + (v01 * (1 - tx) + v11 * tx) * ty;
}
function fbm2(nA, nB, x, y) {               // 双倍频，返回 0..1
  return noiseAt(nA, x, y) * 0.62 + noiseAt(nB, x, y) * 0.38;
}

/* ---------------------------------------------------------
   1.3 阴影系统
   --------------------------------------------------------- */
/* 软阴影：多层同心椭圆，做出像素风的柔和边缘 */
function shadowBlob(g, cx, cy, rx, ry, alpha, layers) {
  const L = layers || 4, step = alpha / L;
  for (let i = L; i >= 1; i--) {
    const t = i / L;
    ellipsePx(g, cx, cy, Math.max(1, Math.round(rx * t)), Math.max(1, Math.round(ry * t)),
      "rgba(14,18,28," + step.toFixed(3) + ")");
  }
}
/* 方向性投影：矩形 footprint 朝背离光源方向拉伸出的凸包。
   多层不同拉伸量叠加 → 靠物体处最深，向外渐淡。 */
function shadowQuad(g, x0, y0, x1, y1, dx, dy, alpha, layers) {
  const L = layers || 4, step = alpha / L;
  for (let i = L; i >= 1; i--) {
    const t = i / L, ox = dx * t, oy = dy * t;
    poly(g, [[x0, y0], [x1, y0], [x1 + ox, y0 + oy], [x1 + ox, y1 + oy], [x0 + ox, y1 + oy], [x0, y1]],
      "rgba(14,18,28," + step.toFixed(3) + ")");
  }
}
/* 接触阴影：物体与地面交接处那条最深的窄带 */
function contactBand(g, x0, x1, y, h, alpha) {
  const w = x1 - x0, e = w * 0.16;
  px(g, x0, y, w, h, "rgba(14,18,28," + alpha + ")");
  px(g, x0, y, e, h, "rgba(14,18,28," + (alpha * 0.45) + ")");
  px(g, x1 - e, y, e, h, "rgba(14,18,28," + (alpha * 0.45) + ")");
}
/* =========================================================
   2. 地面（全校 5208 × 2929）
   ---------------------------------------------------------
   PPT 只画了"有什么"（色块），**道路 = 剩余留白**。
   流程：占用位图 → 距离变换 → 路网分级 → 烘焙。

   烘焙顺序 = 校外底 → 草地 / 建筑基座 / 道路（逐格）
            → 广场 → 水域底 → 运动场地表 → 路缘石 → 标线 → 泥土过渡带
   整张地面预渲染成一张世界大图，运行时只贴可见区域。
   ========================================================= */

/* --- 2.0 地面配色（沿用 Demo 的色阶，保证与前作同一套色语） --- */
const GRASS_RAMP   = ["#437a33", "#4c883a", "#559241", "#5d9d49", "#68ab52"];
const ASPHALT_RAMP = ["#4b4b53", "#52525a", "#595961", "#606068"];
const PAVE_BASE = "#b3ada0", PAVE_A = "#a8a295", PAVE_B = "#bdb7a9";
const KERB_TOP = "#cbc7b8", KERB_LIT = "#b3af9f", KERB_DARK = "#8a8779";
const KERB_JOINT = "rgba(14,18,28,0.17)";
const DIRT      = "#8a7a5c";                  // 硬地与草地之间的泥土过渡
const DIRT_DARK = "#6f6247";
const OUT_BASE  = "#4a5340";                  // 校外：比草地暗、低饱和
const OUT_BLOCK = "#5f6672";                  // 校外示意城市楼
const FOUND     = "#9e9382";                  // 建筑基座（大半被精灵遮住）
const PLAZA_BASE = "#b5ab99";                 // 石头广场
const PLAZA_DARK = "#8d8374";

   [名称, kind, x, y, w, h]；kind 决定地面分类与后续生成器。

const CAMPUS = [

     （正好是东西主路北缘）；现改为 0.7965 → 湖底 3.4000 in = 1328.01 px。
     3.4000 不是随手取的数，是**解出来的**：湖底必须落在 CELL(16) 边界 1328 上，

  ["水域",       "water",   7.0104, 2.6035, 0.6972, 0.7965],

/* =========================================================
   2.6 占用位图 + 距离变换 → 自动推路网（核心算法）
   ---------------------------------------------------------
   PPT 只标了"有什么"，建筑之间的留白就是路。
   对留白格做「到最近非留白格」的距离变换 d：
       d <= 2.5 格  → 走廊（路）
       否则          → 开阔地（草坪）
   走廊宽度按 d 原样保留（**连续变化，不吸附到固定档**），
   只由宽度决定铺装与标线画法。
   ========================================================= */
const CELL = 16;
const NW = Math.ceil(WORLD_W / CELL);          // 326
const NH = Math.ceil(WORLD_H / CELL);          // 184  → 59,984 格

const K = { FREE: 0, BLD: 1, GRASS: 2, WATER: 3, TRACK: 4, BBALL: 5, TENNIS: 6, OUT: 7, PLAZA: 8, ROAD: 9 };
const CELLK   = new Uint8Array(NW * NH);
const ROADCLS = new Uint8Array(NW * NH);       // 0=小径 1=MINOR 2=MAJOR

/* 点在多边形内（射线法）。边界折线跨过 5 个门洞 → 走到门口也出不去。 */
function insideBoundary(x, y) {
  let hit = false;
  for (let i = 0, j = BOUND.length - 1; i < BOUND.length; j = i++) {
    const xi = BOUND[i][0], yi = BOUND[i][1], xj = BOUND[j][0], yj = BOUND[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}

const KIND_TO_K = { bld: K.BLD, grass: K.GRASS, water: K.WATER, track: K.TRACK,
                    bball: K.BBALL, tennis: K.TENNIS, library: K.BLD, siyuan: K.BLD };

function buildOcc() {
  CELLK.fill(K.OUT);
  for (let cy = 0; cy < NH; cy++) {
    for (let cx = 0; cx < NW; cx++) {
      if (insideBoundary(cx * CELL + CELL / 2, cy * CELL + CELL / 2)) CELLK[cy * NW + cx] = K.FREE;
    }
  }
  for (const [, kind, x, y, w, h] of CAMPUS) {
    const k = KIND_TO_K[kind];
    stampRect(x, y, w, h, k);
  }
  for (const p of PLAZA) stampRectAbs(p.x, p.y, p.w, p.h, K.PLAZA);
}

function stampRect(x, y, w, h, k) {            // 英寸输入
  stampRectAbs(IX(x), IX(y), IX(w), IX(h), k);
}
function stampRectAbs(x, y, w, h, k) {
  const c0 = Math.max(0, Math.floor(x / CELL)), c1 = Math.min(NW - 1, Math.floor((x + w) / CELL));
  const r0 = Math.max(0, Math.floor(y / CELL)), r1 = Math.min(NH - 1, Math.floor((y + h) / CELL));
  for (let cy = r0; cy <= r1; cy++)
    for (let cx = c0; cx <= c1; cx++) CELLK[cy * NW + cx] = k;
}

/* 两遍 chamfer 距离变换（3-4 权重）= 到最近非留白格的距离 */
function distanceTransform() {
  const INF = 1e9;
  const d = new Float32Array(NW * NH);
  for (let i = 0; i < d.length; i++) d[i] = CELLK[i] === K.FREE ? INF : 0;
  for (let y = 0; y < NH; y++) {
    for (let x = 0; x < NW; x++) {
      const i = y * NW + x;
      if (d[i] === 0) continue;
      let m = d[i];
      if (x > 0)              m = Math.min(m, d[i - 1] + 3);
      if (y > 0)              m = Math.min(m, d[i - NW] + 3);
      if (x > 0 && y > 0)     m = Math.min(m, d[i - NW - 1] + 4);
      if (x < NW - 1 && y > 0) m = Math.min(m, d[i - NW + 1] + 4);
      d[i] = m;
    }
  }
  for (let y = NH - 1; y >= 0; y--) {
    for (let x = NW - 1; x >= 0; x--) {
      const i = y * NW + x;
      if (d[i] === 0) continue;
      let m = d[i];
      if (x < NW - 1)                 m = Math.min(m, d[i + 1] + 3);
      if (y < NH - 1)                 m = Math.min(m, d[i + NW] + 3);
      if (x < NW - 1 && y < NH - 1)   m = Math.min(m, d[i + NW + 1] + 4);
      if (x > 0 && y < NH - 1)        m = Math.min(m, d[i + NW - 1] + 4);
      d[i] = m;
    }
  }
  return d;
}

/* 留白 → 走廊 / 开阔地；再叠加显式主干道
   ROADBAND 越小，楼间留白越容易长出草地（校园才不至于一片水泥）。 */
const ROADBAND = 1.55 * CELL;                  // ≈25 px ≈ 2.8 m（人行道尺度）
function classifyFree(d) {
  for (let i = 0; i < CELLK.length; i++) {
    if (CELLK[i] !== K.FREE) continue;
    const dpx = d[i] * CELL / 3;               // chamfer 权重 → 像素
    if (dpx <= ROADBAND) {
      CELLK[i] = K.ROAD;
      ROADCLS[i] = dpx * 2 >= ROADBAND ? 1 : 0; // 靠中间铺砖石，贴墙铺混凝土
    } else {
      CELLK[i] = K.GRASS;
    }
  }
  for (const a of ARTERY) {
    const c0 = Math.max(0, Math.floor(a.x / CELL)), c1 = Math.min(NW - 1, Math.floor((a.x + a.w) / CELL));
    const r0 = Math.max(0, Math.floor(a.y / CELL)), r1 = Math.min(NH - 1, Math.floor((a.y + a.h) / CELL));
    for (let cy = r0; cy <= r1; cy++)
      for (let cx = c0; cx <= c1; cx++) {
        CELLK[cy * NW + cx] = K.ROAD;
        ROADCLS[cy * NW + cx] = a.cls;
      }
  }
}

/* =========================================================
   2.7 烘焙
   ========================================================= */
function buildGround() {
  const c = mkCanvas(WORLD_W, WORLD_H);
  const g = c.getContext("2d");
  const rng = makeRng(20260912);
  const nA = makeNoise(9137, Math.ceil(WORLD_W / 96) + 2, Math.ceil(WORLD_H / 96) + 2);
  const nB = makeNoise(4471, Math.ceil(WORLD_W / 40) + 2, Math.ceil(WORLD_H / 40) + 2);
  const nR = makeNoise(3391, Math.ceil(WORLD_W / 42) + 2, Math.ceil(WORLD_H / 42) + 2);

  paintOutside(g, rng);                        // 1) 校外底（先铺满，校内会被覆盖）
  paintCells(g, rng, nA, nB, nR);              // 2) 草地 / 基座 / 道路
  paintPlazas(g, rng);                         // 3) 广场
  paintLibraryPlaza(g, rng);                   // 3b) 图书馆三角广场            [36_library]
  paintWaterBase(g, rng);                      // 4) 水域静态底                [45_water]
  paintTracks(g, rng);                         // 5) 操场                      [37_sports]
  paintCourts(g, rng);                         // 6) 篮球场 / 网球场            [37_sports]
  paintGateAprons(g, rng);                     // 7) 校门车行道 + 斑马线
  paintKerbs(g, rng);                          // 8) 路缘石
  paintMarkings(g, rng);                       // 9) 标线
  paintManholes(g, rng);                       // 9b) 井盖                  [48_ground_detail]
  paintWear(g, rng);                           // 9c) 斑马线磨损 + 车辙      [48_ground_detail]
  paintDirt(g, rng);                           // 10) 泥土过渡带
  paintWalls(g, rng);                          // 11) 围墙（最后画，压在土带之上）[46_walls]
  return c;
}

/* --- 2.7.1 校外：低饱和底色 + 45° 街区纹理 + 零散灰色小方块 --- */
function paintOutside(g, rng) {
  const S = 128, tile = mkCanvas(S, S), tg = tile.getContext("2d");
  px(tg, 0, 0, S, S, OUT_BASE);
  for (let off = -S; off <= S; off += 32) {    // 45° 斜线（128 = 4×32 → 可无缝平铺）
    for (let i = 0; i < S; i += 4) {
      const x0 = off + i;
      if (x0 >= 0 && x0 < S) px(tg, x0, i, 2, 4, shade(OUT_BASE, -0.16));
    }
  }
  for (let i = 0; i < 5; i++)                  // 零散灰块：示意城市楼
    px(tg, ((rng() * S) | 0), ((rng() * S) | 0), 8 + ((rng() * 14) | 0), 6 + ((rng() * 12) | 0), OUT_BLOCK);
  const pat = g.createPattern(tile, "repeat");
  g.fillStyle = pat;
  g.fillRect(0, 0, WORLD_W, WORLD_H);
}

/* --- 2.7.2 逐格：草地 / 建筑基座 / 道路 --- */
function paintCells(g, rng, nA, nB, nR) {
  const B = CELL;
  for (let cy = 0; cy < NH; cy++) {
    for (let cx = 0; cx < NW; cx++) {
      const i = cy * NW + cx, k = CELLK[i];
      if (k === K.OUT) continue;               // 校外已铺好
      const x = cx * B, y = cy * B;
      const w = Math.min(B, WORLD_W - x), h = Math.min(B, WORLD_H - y);

      if (k === K.GRASS || k === K.TRACK || k === K.BBALL || k === K.TENNIS || k === K.WATER) {
        /* ⚠️ 运动场地/水域也要先铺草底：paintOutside 是整幅铺满的，
           这些格子若不铺底，跑道椭圆四角会漏出"校外纹理"。 */
        paintGrassCell(g, rng, nA, nB, x, y, w, h, B);
      } else if (k === K.ROAD) {
        paintRoadCell(g, rng, nR, x, y, w, h, ROADCLS[i]);
      } else if (k === K.BLD) {
        /* 建筑轮廓内：铺"楼前硬地"。楼体精灵会压住南半边，
           露出来的北半边读作前庭/消防通道，而不是一块空白基座。 */
        paintRoadCell(g, rng, nR, x, y, w, h, 0);
        px(g, x, y, w, h, "rgba(80,72,58,0.10)");
      } else if (k === K.PLAZA) {
        continue;                              // 广场由 paintPlazas 统一画
      }
    }
  }
}

/* 草地：世界坐标 8px 子格采样 fbm → 连续渐变（逐格单色会留下 16px 方块感） */
function paintGrassCell(g, rng, nA, nB, x, y, w, h, B) {
  let vmid = 0;
  for (let sy = 0; sy < h; sy += 8)
    for (let sx = 0; sx < w; sx += 8) {
      const sw = Math.min(8, w - sx), sh = Math.min(8, h - sy);
      let v = fbm2(nA, nB, (x + sx) / 96, (y + sy) / 96);
      v = clamp((v - 0.5) * 2.0 + 0.5, 0, 1);
      vmid += v;
      px(g, x + sx, y + sy, sw, sh, GRASS_RAMP[Math.min(4, Math.floor(v * 5))]);
    }
  const base = GRASS_RAMP[Math.min(4, Math.floor((vmid / 4) * 5))];
  const dark = shade(base, -0.22), lit = shade(base, 0.22);
  const nGrass = Math.max(2, ((w * h) / 85) | 0);
  for (let n = 0; n < nGrass; n++) {                 // 草叶成簇：下段暗、顶端亮
    const gx = (x + 2 + rng() * (B - 6)) | 0, gy = (y + 4 + rng() * (B - 8)) | 0;
    px(g, gx, gy, 1, 4, dark);
    px(g, gx, gy - 1, 1, 2, lit);
    if (rng() < 0.14) px(g, gx, gy + 1, 1, 1, "#e8d76a");    // 小黄花
  }
}

/* 道路：cls 2 = 沥青（主干道），1 = 砖石铺装，0 = 混凝土小径
   ※ 颜色一律按世界坐标 8px 子格采样噪声 —— 逐格单色会留下 16px 方块感。 */
function paintNoiseCell(g, x, y, w, h, nR, scale, ramp, mixers) {
  for (let sy = 0; sy < h; sy += 8)
    for (let sx = 0; sx < w; sx += 8) {
      const sw = Math.min(8, w - sx), sh = Math.min(8, h - sy);
      const v = noiseAt(nR, (x + sx) / scale, (y + sy) / scale);
      px(g, x + sx, y + sy, sw, sh, mixers ? mix(mixers[0], mixers[1], v) : ramp[Math.min(ramp.length - 1, Math.floor(v * ramp.length))]);
    }
}
function paintRoadCell(g, rng, nR, x, y, w, h, cls) {
  if (cls === 2) {
    paintNoiseCell(g, x, y, w, h, nR, 46, ASPHALT_RAMP);
    speckle(g, x, y, w, h, "rgba(255,255,255,0.045)", 3, rng);
    speckle(g, x, y, w, h, "rgba(0,0,0,0.07)", 3, rng);
  } else if (cls === 1) {
    paintNoiseCell(g, x, y, w, h, nR, 42, null, [PAVE_A, PAVE_B]);
    /* 逐砖色差（16×8 一块）[48_ground_detail]：原来只有 42px 尺度的整体色斑，
       1× 下人行道是一片平色，"砖"读不出来。色调走**世界砖号的哈希**（brickTone）
       而不是 rng —— 一块砖常横跨两个 CELL，各格各画，rng 会在格边界留接缝。
       55% 半透明叠加，底下的噪声仍然透得出来。 */
    for (let by = (y / 8) | 0; by <= ((y + h - 1) / 8) | 0; by++) {
      const cy2 = Math.max(y, by * 8), bh2 = Math.min(y + h, by * 8 + 8) - cy2;
      if (bh2 <= 0) continue;
      for (let bx = (x / 16) | 0; bx <= ((x + w - 1) / 16) | 0; bx++) {
        const cx2 = Math.max(x, bx * 16), bw2 = Math.min(x + w, bx * 16 + 16) - cx2;
        if (bw2 <= 0) continue;
        px(g, cx2, cy2, bw2, bh2, rgba(shade(PAVE_B, (brickTone(bx, by) - 0.5) * 0.30), 0.55));
      }
    }
    for (let yy = y; yy < y + h; yy += 8)        // 砖缝（世界坐标对齐，跨格不断缝）
      px(g, x, ((yy / 8) | 0) * 8, w, 1, "rgba(14,18,28,0.10)");
    for (let xx = x; xx < x + w; xx += 16)
      px(g, ((xx / 16) | 0) * 16, y, 1, h, "rgba(14,18,28,0.07)");
  } else {
    /* 小径：整块现浇混凝土 + 16px 分格缝（与广场的 32px 石板明显区分） */
    paintNoiseCell(g, x, y, w, h, nR, 60, null, ["#b6b0a3", "#c3bdaf"]);
    for (let yy = y; yy < y + h; yy += 16)
      px(g, x, ((yy / 16) | 0) * 16, w, 1, "rgba(14,18,28,0.15)");
    for (let xx = x; xx < x + w; xx += 16)
      px(g, ((xx / 16) | 0) * 16, y, 1, h, "rgba(14,18,28,0.11)");
    speckle(g, x, y, w, h, "rgba(0,0,0,0.07)", 3, rng);
    speckle(g, x, y, w, h, "rgba(255,255,255,0.05)", 2, rng);
  }
}

/* --- 2.7.3 广场：石头铺装（32px 方板 + 明暗交错 + 灰缝） --- */
function paintPlazas(g, rng) {
  for (const p of PLAZA) {
    px(g, p.x, p.y, p.w, p.h, PLAZA_DARK);                       // 缝色打底
    for (let y = p.y; y < p.y + p.h; y += 32)
      for (let x = p.x; x < p.x + p.w; x += 32) {
        const k = (rng() - 0.5) * 0.34;
        const cw = Math.max(1, Math.min(30, p.x + p.w - x - 1));
        const ch = Math.max(1, Math.min(30, p.y + p.h - y - 1));
        px(g, x + 1, y + 1, cw, ch, shade(PLAZA_BASE, k));
        px(g, x + 1, y + 1, cw, 1, shade(PLAZA_BASE, k + 0.10));  // 板面上棱微受光
        px(g, x + 1, y + ch, cw, 1, "rgba(14,18,28,0.14)");
        if (rng() < 0.22) px(g, x + 4 + rng() * 22, y + 4 + rng() * 22, 2, 2, "rgba(14,18,28,0.13)");
      }
    px(g, p.x, p.y, p.w, 2, shade(PLAZA_BASE, 0.26));            // 上缘受光
    px(g, p.x, p.y + p.h - 3, p.w, 3, shade(PLAZA_BASE, -0.34)); // 下缘背光
    px(g, p.x, p.y, 2, p.h, shade(PLAZA_BASE, 0.12));
    px(g, p.x + p.w - 2, p.y, 2, p.h, shade(PLAZA_BASE, -0.24));
  }
}

/* --- 2.7.4 校门：内外各铺 60px 车行道 + 白色斑马线 ---
   ⚠️ G2（南门）**整块跳过** —— 用户 2026-09-13 先要求「南门的人行横道去掉」，
      紧接着要求「把南门的灰色长方形路段去掉」：那块 60×240 的沥青垫层从南门入口广场
      一直铺到南墙外 ≈113px 的草地上，像一条凭空穿过围墙的灰走廊（_gview 截图里
      一眼就能看到它悬在草地上），已经不是"路"了。跳过它 → 南门门洞里外只剩
      南门纵向的沥青路面与南门入口广场的石板，干净。
      本函数不消耗任何 rng()，跳过哪个门都不会挪动后面 paintWear / paintDirt /
      paintWalls 的随机流（这三段共用同一条流，挪一格整片地面就换了张脸）。 */
function paintGateAprons(g, rng) {
  for (const gt of GATES) {
    if (gt.id === "G3") continue;              // 东南门是斜的，由围墙模块单独处理
    if (gt.id === "G2") continue;              // 南门：车行道垫层与斑马线都不要
    const L = 120;
    if (gt.dir === "h") {
      px(g, gt.x - L, gt.y - 30, L * 2, 60, ASPHALT_RAMP[1]);
      for (let i = -4; i <= 4; i++)
        px(g, gt.x + i * 22 - 4, gt.y - 26, 8, 52, "rgba(240,240,235,0.55)");
    } else {
      px(g, gt.x - 30, gt.y - L, 60, L * 2, ASPHALT_RAMP[1]);
      for (let i = -4; i <= 4; i++)
        px(g, gt.x - 26, gt.y + i * 22 - 4, 52, 8, "rgba(240,240,235,0.55)");
    }
  }
}

/* --- 2.7.5 路缘石：路与非路的交界处 --- */
function paintKerbs(g, rng) {
  const isRoad = i => i >= 0 && i < CELLK.length && CELLK[i] === K.ROAD;
  for (let cy = 0; cy < NH; cy++) {
    for (let cx = 0; cx < NW; cx++) {
      const i = cy * NW + cx;
      if (CELLK[i] !== K.ROAD) continue;
      if (ROADCLS[i] === 0) continue;                        // 小径不砌路缘石
      const x = cx * CELL, y = cy * CELL;
      const north = cy > 0 && !isRoad(i - NW), south = cy < NH - 1 && !isRoad(i + NW);
      const west  = cx > 0 && !isRoad(i - 1),  east  = cx < NW - 1 && !isRoad(i + 1);
      if (north) { px(g, x, y, CELL, 3, KERB_TOP); px(g, x, y + 3, CELL, 1, KERB_DARK); }
      if (south) { px(g, x, y + CELL - 3, CELL, 3, KERB_LIT); px(g, x, y + CELL - 4, CELL, 1, KERB_DARK); }
      if (west)  { px(g, x, y, 3, CELL, KERB_TOP); px(g, x + 3, y, 1, CELL, KERB_DARK); }
      if (east)  { px(g, x + CELL - 3, y, 3, CELL, KERB_LIT); px(g, x + CELL - 4, y, 1, CELL, KERB_DARK); }
    }
  }
}

/* --- 2.7.6 标线：主干道双黄中线 + 车行道外缘白实线 ---
   ⚠️ 广场与主干道在 PPT 数据里是同一块面积，广场是后画的，所以标线必须绕开广场
      —— 否则一条双黄线会横穿石板地。（"思源楼前广场"已取缔，此坑只剩南门入口广场。） */
const _plazaHit = (x, y) => PLAZA.some(p => x >= p.x - 2 && x <= p.x + p.w + 2 && y >= p.y - 2 && y <= p.y + p.h + 2);
function paintMarkings(g, rng) {
  const YEL = "#d8c34a";
  for (const a of ARTERY) {
    if (a.cls !== 2) continue;
    const horiz = a.w >= a.h;
    if (horiz) {
      const y = Math.round(a.y + a.h / 2);
      dashLine(g, a.x + 12, a.x + a.w - 12, y - 4, 1, YEL, rng);
      dashLine(g, a.x + 12, a.x + a.w - 12, y + 3, 1, YEL, rng);
      dashLine(g, a.x, a.x + a.w, a.y + 7, 2, "rgba(240,240,235,0.50)", rng);        // 外缘白线
      dashLine(g, a.x, a.x + a.w, a.y + a.h - 9, 2, "rgba(240,240,235,0.50)", rng);
    } else {
      const x = Math.round(a.x + a.w / 2);
      dashLineV(g, a.y + 12, a.y + a.h - 12, x - 4, 1, YEL, rng);
      dashLineV(g, a.y + 12, a.y + a.h - 12, x + 3, 1, YEL, rng);
      dashLineV(g, a.y, a.y + a.h, a.x + 7, 2, "rgba(240,240,235,0.50)", rng);
      dashLineV(g, a.y, a.y + a.h, a.x + a.w - 9, 2, "rgba(240,240,235,0.50)", rng);
    }
  }
}
/* 实线：整段画 + 广场处断开（用短段拼，避免长线穿过石板地） */
function solidH(g, x0, x1, y, th, col) {
  for (let x = x0; x < x1; x += 8)
    if (!_plazaHit(x + 4, y + th / 2)) px(g, x, y, Math.min(8, x1 - x), th, col);
}
function solidV(g, y0, y1, x, th, col) {
  for (let y = y0; y < y1; y += 8)
    if (!_plazaHit(x + th / 2, y + 4)) px(g, x, y, th, Math.min(8, y1 - y), col);
}
function dashLine(g, x0, x1, y, th, col, rng) {
  for (let x = x0; x < x1; x += 26) {
    if (rng() < 0.14) continue;                                 // 磨损缺口
    if (_plazaHit(x + 8, y + th / 2)) continue;                 // 广场上不画
    px(g, x, y, Math.min(16, x1 - x), th, col);
  }
}
function dashLineV(g, y0, y1, x, th, col, rng) {
  for (let y = y0; y < y1; y += 26) {
    if (rng() < 0.14) continue;
    if (_plazaHit(x + th / 2, y + 8)) continue;
    px(g, x, y, th, Math.min(16, y1 - y), col);
  }
}

/* --- 2.7.7 泥土过渡带：硬地与草地之间不做硬切 --- */
function paintDirt(g, rng) {
  const isRoad = i => i >= 0 && i < CELLK.length && CELLK[i] === K.ROAD;
  const grit = "rgba(90,78,54,0.55)";
  for (let cy = 0; cy < NH; cy++) {
    for (let cx = 0; cx < NW; cx++) {
      const i = cy * NW + cx;
      if (CELLK[i] === K.ROAD || CELLK[i] === K.OUT) continue;
      if (CELLK[i] !== K.GRASS) continue;
      const x = cx * CELL, y = cy * CELL;
      const band = mix(DIRT, GRASS_RAMP[0], 0.45);
      if (cy > 0 && isRoad(i - NW)) { px(g, x, y, CELL, 3, band); speckle(g, x, y, CELL, 6, grit, 14, rng); }
      if (cy < NH - 1 && isRoad(i + NW)) { px(g, x, y + CELL - 3, CELL, 3, band); speckle(g, x, y + CELL - 6, CELL, 6, grit, 14, rng); }
      if (cx > 0 && isRoad(i - 1)) { px(g, x, y, 3, CELL, band); speckle(g, x, y, 6, CELL, grit, 14, rng); }
      if (cx < NW - 1 && isRoad(i + 1)) { px(g, x + CELL - 3, y, 3, CELL, band); speckle(g, x + CELL - 6, y, 6, CELL, grit, 14, rng); }
    }
  }
}

/* 供场景装配使用 */
buildOcc();
classifyFree(distanceTransform());

/* =========================================================
   3. 建筑生成器（统一外形）
   ---------------------------------------------------------
   锚点 = 底部中心（落地线）。可见结构自上而下：
   屋顶板 → 檐口 → 墙体（窗阵）→ 门 + 台阶 → 接地阴影带。
   明暗一律服从 SUN：左上受光偏暖，右下背光偏冷。

   层高 34 px（≈3.8 m，与思源楼精灵的窗排间距一致，见交接文档 §7.1）。
   ========================================================= */
const FLOOR_H = 34;
const WIN_W = 16, WIN_H = 22, WIN_GAP = 12;

/* --- 3.0 屋名标牌 ---------------------------------------------------
   每栋楼在屋顶前沿挂一块深色牌子 + 奶油色字，与校门门楣（§4.6.4）同一套色语。

   字形走思源楼题字（§3.5.6）那套：**系统字体渲染 → alpha 二值化 → 逐像素填色**。
   好处是笔画永远 1px 硬边，放大 3 倍也不会有抗锯齿灰边；直接把 fillText 画进精灵
   则会在放大后糊成一团。代价是字面尺寸只能量出来（不同字体左右留白差很多）。

   字号**全楼统一**（SIGN_FS），不像素化才像招牌。最窄的楼 R.w ≈ 214 世界像素，
   最长的名字 6 字 → 字面 ≈102 px + 20 px 边距 = 122 px 牌面，不到一半宽度，
   所以不需要按楼缩字号（这条是数据不变量：CAMPUS 里最长的名字就是 6 字）。 */
const SIGN_FS = 18;
const _signCache = Object.create(null);        // name → {c, w, h}；重名楼共用一块牌
function makeSign(name) {
  if (name in _signCache) return _signCache[name];
  const FONT = "bold " + SIGN_FS + "px 'Microsoft YaHei','SimHei','PingFang SC',sans-serif";
  const t = mkCanvas(8, 8);
  let tc = t.getContext("2d");
  tc.font = FONT;
  const tw = Math.ceil(tc.measureText(name).width) + 8, th = SIGN_FS + 10;
  t.width = tw; t.height = th;                 // ⚠️ 改尺寸会重置上下文，必须重取
  tc = t.getContext("2d");
  tc.font = FONT;
  tc.textBaseline = "top";
  tc.fillStyle = "#000";
  tc.fillText(name, 4, 4);
  const d = tc.getImageData(0, 0, tw, th).data;
  const pts = [];
  let minX = tw, maxX = -1, minY = th, maxY = -1;
  for (let y = 0; y < th; y++) {
    for (let x = 0; x < tw; x++) {
      if (d[(y * tw + x) * 4 + 3] > 100) {
        pts.push(x, y);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return (_signCache[name] = null);   // 拿不到字形就不挂牌
  const gw = maxX - minX + 1, gh = maxY - minY + 1; // 字面实际尺寸
  const pw = gw + 20, ph = SIGN_FS + 9;             // 牌面：字面左右各留 10 px
  const c = mkCanvas(pw, ph), g = c.getContext("2d");
  px(g, 0, 1, pw, ph - 1, "#5d564a");               // 牌面
  px(g, 0, 1, pw, 1, "#7d7669");                    // 上棱受光
  px(g, 0, ph - 1, pw, 1, "#3a352c");               // 下棱背光
  px(g, 0, 1, 1, ph - 1, "#6d6557");                // 左棱
  px(g, pw - 1, 1, 1, ph - 1, "#443f35");           // 右棱
  const ox = Math.round((pw - gw) / 2) - minX, oy = Math.round((ph - gh) / 2) - minY;
  g.fillStyle = "#e8d9a8";
  for (let i = 0; i < pts.length; i += 2) g.fillRect(ox + pts[i], oy + pts[i + 1], 1, 1);
  return (_signCache[name] = { c: c, w: pw, h: ph });
}
/* 标牌矩形：屋顶前沿，牌底离檐口 8 px（留出檐口投影线，牌子才"站在屋面上"） */
function signRect(sgn, x0, w, eaveY) {
  if (!sgn) return null;
  return { x: Math.round(x0 + (w - sgn.w) / 2), y: eaveY - 8 - sgn.h, w: sgn.w, h: sgn.h };
}

function makeBuilding(o) {
  const rng    = makeRng(o.seed);
  const w      = Math.round(o.w);
  const depth  = o.depth || Math.round(w * 0.50);
  const floors = o.floors || 3;
  const wallH  = floors * FLOOR_H;
  /* 屋顶板要"吃掉"平面进深：PPT 给的是建筑俯视轮廓，板画得够厚，
     楼才压得住自己的 footprint —— 否则矩形北半边会露出一块空白基座。

     ⚠️ 但 0.60 的比例 + 190 的上限对"进深特别大"的楼是不够的：进深 483 的新体育馆
        只画得出 190 的屋面板，北侧 122px 的 K.BLD footprint 会整条露在外面 ——
        而 `paintCells` 给 K.BLD 铺的正是"楼前硬地"（那里明写着"露出来的北半边
        读作前庭/消防通道"），于是那一片读成一块**灰色石板**。
        用户 2026-09-17：「老体育馆和新体育馆都向北延长直到分配给其的 k 灰色石板
        区域被覆盖」⇒ `o.roofFull` 让屋面板**铺满整个进深**：

            roofT = ceil(depth) − wallH

        恰好使屋面顶边（精灵局部第 PADT + roofT 行）落到 footprint 的北缘。
        取 **ceil** 而不是 round：宁可多盖半像素，也不留一条 1px 的灰缝
        （round 在半整数进深上会向下取整，反倒露出来）。
        **只有那两栋体育馆传这个标志**，其余 47 栋一字不变 —— 通用的 0.60/190
        是全校的既定比例，改了会顺手把运输实验馆（进深 472）、学生服务中心
        （进深 656）那几栋一起变形。 */
  const roofT  = o.roofFull ? (Math.ceil(depth) - wallH)
                            : clamp(Math.round(depth * 0.60), 20, 190);

  const PADX = 26, PADT = 18;
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  const c = mkCanvas(w + PADX * 2, PADT + roofT + wallH + SHY + 14);
  const g = c.getContext("2d");

  const x0 = PADX, x1 = PADX + w;
  const eaveY = PADT + roofT;              // 屋檐下沿 = 墙顶
  const baseY = eaveY + wallH;             // 落地线
  const wall = o.wall, roof = o.roof, glass = o.glass || "#8FB6D9";
  const sgn = o.name ? makeSign(o.name) : null;      // 屋名标牌（可空）
  const sg  = signRect(sgn, x0, w, eaveY);

  /* --- 3.1 方向性投影：footprint 朝右下拉伸 --- */
  shadowQuad(g, x0 + 2, baseY - Math.min(24, depth * 0.3), x1 - 2, baseY, SHX, SHY, 0.28, 4);

  /* --- 3.2 屋面（俯视）：女儿墙 + 分坡脊 + 屋面设备 --- */
  px(g, x0 - 3, PADT, w + 6, roofT, shade(roof, -0.34));            // 檐口外沿
  px(g, x0, PADT + 2, w, roofT - 5, shade(roof, -0.04));            // 板面
  px(g, x0, PADT + 2, w, 4, shade(roof, 0.26));                     // 女儿墙顶受光
  px(g, x0, PADT + 6, w, 3, "rgba(14,18,28,0.34)");                 // 女儿墙内阴影
  px(g, x0, PADT + 6, 4, roofT - 9, shade(roof, 0.14));             // 左内侧受光
  px(g, x1 - 4, PADT + 6, 4, roofT - 9, "rgba(14,18,28,0.22)");     // 右内侧背光
  for (let j = 1; j <= 3; j++)                                      // 分坡脊线
    px(g, x0 + 5, PADT + Math.round((roofT - 12) * j / 4) + 6, w - 10, 1, "rgba(255,255,255,0.08)");
  px(g, x0 - 3, PADT + roofT - 1, w + 6, 2, shade(roof, -0.60));    // 檐口投影线
  if (roofT > 46) {                                                 // 屋面设备
    const nb = 2 + ((rng() * 3) | 0);
    for (let i = 0; i < nb; i++) {
      const bw = 18 + rng() * 34, bh = 12 + rng() * 20;
      const bx = Math.round(x0 + 14 + rng() * Math.max(1, w - 28 - bw));
      const by = Math.round(PADT + 14 + rng() * Math.max(1, roofT - 28 - bh - bh * 0.5));
      /* 让开屋名标牌：牌子压在设备之后画，重叠就是互相打架（设备的投影还会糊上牌面）。
         ⚠️ 三个 rng() 都已取过再判，跳过也不改动随机序列 —— 否则全校园的屋面纹样会整体错位。 */
      if (sg && bx < sg.x + sg.w + 6 && bx + bw + 6 > sg.x
            && by < sg.y + sg.h + 3 && by + bh + 6 > sg.y) continue;
      px(g, bx + 4, by + 4, bw, bh, "rgba(14,18,28,0.30)");         // 设备投影
      px(g, bx, by + bh - 4, bw, 4, shade(roof, -0.38));            // 设备侧墙
      px(g, bx, by, bw, bh, shade(roof, 0.16));
      px(g, bx, by, bw, 3, shade(roof, 0.34));
      px(g, bx, by + bh - 1, bw, 1, "rgba(14,18,28,0.30)");
    }
  }
  speckle(g, x0 + 4, PADT + 7, w - 8, roofT - 12, "rgba(255,255,255,0.05)", (w / 3) | 0, rng);
  speckle(g, x0 + 4, PADT + 7, w - 8, roofT - 12, "rgba(0,0,0,0.07)", (w / 4) | 0, rng);

  /* --- 3.2.9 屋名标牌（画在斑点之后，压在屋面上；服从 SUN，投影朝右下） --- */
  if (sg) {
    px(g, sg.x + 3, sg.y + 3, sg.w, sg.h, "rgba(14,18,28,0.30)");
    g.drawImage(sgn.c, sg.x, sg.y);
  }

  /* --- 3.3 墙体：砖纹 --- */
  px(g, x0, eaveY + 2, w, wallH, shade(wall, -0.10));
  for (let yy = eaveY + 7; yy < baseY; yy += 5) {
    px(g, x0, yy, w, 1, "rgba(0,0,0,0.09)");
    const off = ((((yy - eaveY) / 5) | 0) & 1) ? 4 : 0;
    for (let xx = x0 + off; xx < x1; xx += 8) px(g, xx, yy - 5, 1, 5, "rgba(0,0,0,0.06)");
  }
  speckle(g, x0, eaveY + 3, w, wallH - 3, "rgba(255,255,255,0.05)", (w / 3) | 0, rng);
  speckle(g, x0, eaveY + 3, w, wallH - 3, "rgba(0,0,0,0.09)", (w / 2) | 0, rng);
  px(g, x0, eaveY + 2, 3, wallH, shade(wall, 0.18));                // 左棱受光
  px(g, x1 - 4, eaveY + 2, 4, wallH, shade(wall, -0.30));           // 右棱背光
  for (let i = 0; i < 10; i++)                                      // 檐下阴影带
    px(g, x0, eaveY + 2 + i, w, 1, "rgba(14,18,28," + (0.34 * (1 - i / 10)).toFixed(3) + ")");
  /* 楼层分隔线：每层一道浅浅的腰线 */
  for (let f = 1; f < floors; f++)
    px(g, x0, eaveY + f * FLOOR_H, w, 2, shade(wall, -0.20));

  /* --- 3.4 门（先占位，供窗户避让） --- */
  const dw = Math.min(70, Math.round(w * 0.18)), dh = 44;
  const dcenter = x0 + w / 2 + (o.doorSide || 0) * Math.round(w * 0.22);
  const dx = Math.round(dcenter - dw / 2), dy = baseY - dh;
  const occ = [[dx - 10, dy - 16, dx + dw + 10, baseY + 10],
               [x1 - 10, eaveY + 2, x1, baseY]];                  // 雨水管占位

  /* --- 3.5 窗阵：行 = floors，列按宽度排 --- */
  const margin = 22;
  const cols = Math.max(1, Math.floor((w - margin * 2 + WIN_GAP) / (WIN_W + WIN_GAP)));
  const stepX = (w - margin * 2 - cols * WIN_W) / (cols - 1 || 1);
  const winAt = (wx, wy) => {
    px(g, wx - 1, wy - 1, WIN_W + 2, WIN_H + 2, shade(wall, 0.12));       // 框外缘受光
    px(g, wx + WIN_W, wy - 1, 1, WIN_H + 2, shade(wall, -0.34));          // 框右背光
    px(g, wx, wy, WIN_W, WIN_H, "#2c3746");                               // 洞口
    px(g, wx, wy, WIN_W, 2, "rgba(10,13,20,0.58)");                       // 洞口上内侧
    px(g, wx, wy, 2, WIN_H, "rgba(10,13,20,0.44)");                       // 洞口左内侧
    px(g, wx + 2, wy + 2, WIN_W - 6, 3, shade(glass, 0.28));              // 玻璃上高光
    px(g, wx + 3, wy + 6, WIN_W - 9, 2, shade(glass, 0.12));
    px(g, wx + 6, wy + 4, 1, WIN_H - 8, shade(wall, -0.52));              // 竖窗棂
    px(g, wx + 2, wy + Math.round(WIN_H * 0.62), WIN_W - 4, Math.round(WIN_H * 0.34), shade(glass, -0.24));
    px(g, wx - 2, wy + WIN_H, WIN_W + 4, 3, shade(wall, 0.24));           // 窗台顶面受光
    px(g, wx - 2, wy + WIN_H + 3, WIN_W + 4, 1, "rgba(14,18,28,0.28)");   // 窗台投影
  };
  for (let f = 0; f < floors; f++) {
    /* 首层窗整体上移 30px 给门让位；顶层贴檐口留 16px */
    const wy = f === 0 ? baseY - 30 - WIN_H
                       : eaveY + 16 + (f - 1) * FLOOR_H + Math.round((FLOOR_H - WIN_H) * 0.35);
    if (wy + WIN_H > baseY - 8) continue;
    for (let cn = 0; cn < cols; cn++) {
      const wx = Math.round(margin + cn * (WIN_W + stepX));
      const box = [wx - 3, wy - 2, wx + WIN_W + 3, wy + WIN_H + 5];
      if (occ.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      winAt(wx, wy);
    }
  }

  /* --- 3.6 雨水管 --- */
  const pipeX = x1 - 7;
  px(g, pipeX, eaveY + 3, 3, baseY - eaveY - 3, shade(wall, -0.24));
  px(g, pipeX, eaveY + 3, 1, baseY - eaveY - 3, shade(wall, 0.04));
  px(g, pipeX - 1, Math.round((eaveY + baseY) / 2) - 5, 5, 2, shade("#8b8f96", -0.10));
  px(g, pipeX - 1, baseY - 12, 5, 2, shade("#8b8f96", -0.22));

  /* --- 3.7 雨棚 + 门 + 台阶 --- */
  const cx0 = dx - 10, cx1 = dx + dw + 10, cy = dy - 13;
  px(g, cx0, cy, cx1 - cx0, 3, shade(roof, 0.10));                  // 雨棚顶面
  px(g, cx0, cy + 3, cx1 - cx0, 1, shade(roof, -0.50));
  px(g, cx0, cy + 4, 2, 5, shade(roof, -0.28));
  px(g, cx1 - 2, cy + 4, 2, 5, shade(roof, -0.56));
  for (let i = 0; i < 5; i++)
    px(g, dx - 6, cy + 6 + i, dw + 12, 1, "rgba(14,18,28," + (0.30 * (1 - i / 5)).toFixed(3) + ")");
  px(g, dx - 1, dy - 1, dw + 2, dh + 1, shade(wall, -0.38));        // 门框
  px(g, dx, dy, dw, dh, shade(o.door || "#6b4a2f", -0.16));
  for (let i = 3; i < dw; i += 6) px(g, dx + i, dy + 2, 1, dh - 2, "rgba(0,0,0,0.22)");
  px(g, dx, dy, dw, 1, "rgba(0,0,0,0.30)");
  px(g, dx + Math.round(dw * 0.5) - 1, dy + Math.round(dh * 0.45), 2, 6, shade("#d8c07a", 0.12));  // 门把手
  px(g, dx + 2, dy + 2, Math.round(dw * 0.42), dh - 4, "rgba(255,235,190,0.10)");                  // 门内暖光
  for (let i = 0; i < 3; i++) {                                     // 台阶：自上而下逐级变宽
    const sw = dw + 9 + i * 5, sx = Math.round(dcenter - sw / 2), sy = baseY + i * 3 - 2;
    px(g, sx, sy, sw, 3, shade("#b9b3a6", 0.10 - i * 0.11));
    px(g, sx, sy + 3, sw, 1, "rgba(14,18,28,0.26)");
  }

  /* --- 3.8 整栋外轮廓 + 接地最深窄带 --- */
  px(g, x0 - 1, eaveY + 1, w + 2, 1, shade(wall, -0.44));
  px(g, x0 - 1, eaveY + 1, 1, wallH + 2, shade(wall, -0.44));
  px(g, x1, eaveY + 1, 1, wallH + 2, shade(wall, -0.44));
  contactBand(g, x0 + 1, x1 - 1, baseY - 1, 2, 0.34);

  return { canvas: c, ax: x0 + w / 2, ay: baseY, w: w, h: wallH + roofT };
}

/* =========================================================
   3.5 思源楼 —— 校园地标（整体移植自《思源楼正面.html》）
   ---------------------------------------------------------
   浅灰白墙 + 中央蓝色玻璃幕墙 + 顶部红色题字 + 白色塔楼，
   左右严格关于玻璃幕墙中心对称。
   源码坐标系与原图一字不差（BL=60、BR=360、ROOF_Y=84、
   WIN_TOP=100、WIN_BOT=232、GROUND_Y=262、TX=210），
   统一乘 S 倍烘焙成一张精灵图；1px 细线在 1.5 倍下仍保持硬边。
   锚点同样取「底部中心」，因而照常参与 baseY 深度排序：
   角色走到楼前 → 晚于楼绘制，遮住楼体；
   角色走到楼后 → 早于楼绘制，被楼体遮住。
   ========================================================= */
const SY_COL = {
  WALL: "#e0ddd6", WALL_D: "#c5c2ba", WALL_L: "#f0ede6",
  GLASS: "#2e5a7e", GLASS_HI: "#5a8aac", GLASS_D: "#1e3e5c",
  WIN_D: "#1c2530", WIN_L: "#3a4a5e",
  RED: "#c8281e", TOWER: "#eceae4", STATUE: "#d8d4cc"
};
function makeSiyuan(o) {
  const S = (o && o.scale) || 1.5;
  const C = SY_COL;
  /* --- 源码几何 --- */
  const BL = 60, BR = 360, ROOF_Y = 84, WIN_TOP = 100, WIN_BOT = 232, GROUND_Y = 262;
  const GLASS_L = 196, GLASS_R = 222, GW = GLASS_R - GLASS_L;
  const TX = (BL + BR) / 2;                 // 建筑水平中心（白塔 / 门楼中轴）
  const GC = (GLASS_L + GLASS_R) / 2;       // 蓝色玻璃幕墙中心 = 左右镜像对称轴

  /* --- 内容包围盒 → 画布（去掉了原图的天空 / 草地 / 飞鸟 / 成片的树）
         右 / 下各留出方向性投影的余量，避免阴影被画布裁断 --- */
  const SX0 = 56, SY0 = 14, SX1 = 384, SY1 = 288;
  const c = mkCanvas(Math.round((SX1 - SX0) * S), Math.round((SY1 - SY0) * S));
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  const X = x => (x - SX0) * S, Y = y => (y - SY0) * S;
  const P = (x, y, w, h, col) => px(g, X(x), Y(y), w * S, h * S, col);

  /* --- 3.5.1 方向性投影 + 接地最深窄带（服从全局 SUN） --- */
  const SHX = Math.round(-SUN.x * 26 * S), SHY = Math.round(-SUN.y * 26 * S);
  shadowQuad(g, X(BL + 2), Y(GROUND_Y - 14), X(BR - 2), Y(GROUND_Y), SHX, SHY, 0.26, 4);

  /* --- 3.5.2 楼体（浅灰白，非满窗，留出大量瓷砖墙面） --- */
  P(BL, ROOF_Y, BR - BL, GROUND_Y - ROOF_Y, C.WALL);
  P(BL, ROOF_Y, BR - BL, 3, shade(C.WALL, -0.12));          // 顶部水平装饰带
  P(BL, ROOF_Y + 3, BR - BL, 1, C.WALL_L);
  for (let y = ROOF_Y + 16; y < WIN_BOT; y += 17)           // 横向瓷砖缝（楼板位置）
    P(BL, y, BR - BL, 1, shade(C.WALL, -0.10));
  for (let d = 15; d < (BR - BL) / 2; d += 30) {            // 竖向瓷砖缝（关于 GC 对称）
    const hh = WIN_BOT - ROOF_Y - 6;
    P(GC - d, ROOF_Y + 6, 1, hh, shade(C.WALL, -0.08));
    P(GC + d, ROOF_Y + 6, 1, hh, shade(C.WALL, -0.08));
  }

  /* --- 3.5.3 顶部两侧小塔楼（右为准，左为镜像） --- */
  const R_TL = BR - 26, L_TL = 2 * GC - (R_TL + 22);
  P(R_TL, ROOF_Y - 20, 22, 20, C.WALL);
  P(R_TL, ROOF_Y - 20, 22, 2, C.WALL_L);
  P(R_TL, ROOF_Y - 20, 1, 20, C.WALL_L);
  P(R_TL + 21, ROOF_Y - 20, 1, 20, C.WALL_D);
  P(R_TL + 5, ROOF_Y - 15, 12, 4, C.WIN_D);
  P(R_TL + 5, ROOF_Y - 9, 12, 3, C.WIN_D);
  P(L_TL, ROOF_Y - 20, 22, 20, C.WALL);
  P(L_TL, ROOF_Y - 20, 22, 2, C.WALL_L);
  P(L_TL, ROOF_Y - 20, 1, 20, C.WALL_D);
  P(L_TL + 21, ROOF_Y - 20, 1, 20, C.WALL_L);
  P(L_TL + 5, ROOF_Y - 15, 12, 4, C.WIN_D);
  P(L_TL + 5, ROOF_Y - 9, 12, 3, C.WIN_D);

  /* --- 3.5.4 中央凸起门楼（承载题字，宽 26 = 玻璃幕墙宽） --- */
  const MH_L = TX - 13, MH_R = TX + 13, MH_T = ROOF_Y - 43;
  P(MH_L, MH_T, 26, ROOF_Y - MH_T, C.WALL);
  P(MH_L, MH_T, 26, 2, C.WALL_L);                            // 顶部压顶
  P(MH_L, MH_T + 2, 26, 1, shade(C.WALL, -0.12));
  P(MH_L, MH_T, 1, ROOF_Y - MH_T, C.WALL_D);                 // 左右边缘（对称）
  P(MH_R - 1, MH_T, 1, ROOF_Y - MH_T, C.WALL_D);
  P(MH_L + 1, MH_T, 1, ROOF_Y - MH_T, shade(C.WALL, -0.06));
  P(MH_R - 2, MH_T, 1, ROOF_Y - MH_T, shade(C.WALL, -0.06));

  /* --- 3.5.5 中央白塔 + 天线（在题字上方，不能被字遮住） --- */
  P(TX - 1, ROOF_Y - 62, 2, 3, "#555");                      // 塔针
  P(TX, ROOF_Y - 64, 1, 2, "#c84030");                       // 塔尖红灯
  for (let i = 0; i < 5; i++) {                              // 锥形塔顶：22px 收到 2px
    const hw = [11, 8, 6, 3, 1][i];
    P(TX - hw, ROOF_Y - 59 + i, hw * 2, 1, shade(C.TOWER, 0.12 - i * 0.04));
  }
  P(TX - 11, ROOF_Y - 54, 22, 7, C.TOWER);                   // 塔身（宽 22）
  P(TX - 11, ROOF_Y - 54, 1, 7, "#fff");
  P(TX + 10, ROOF_Y - 54, 1, 7, shade(C.TOWER, -0.12));
  P(TX - 11, ROOF_Y - 51, 22, 1, shade(C.TOWER, -0.1));      // 塔身横缝
  P(TX - 13, ROOF_Y - 47, 26, 4, C.TOWER);                   // 塔座（宽 26）
  P(TX - 13, ROOF_Y - 47, 26, 1, "#fff");
  P(TX - 13, ROOF_Y - 44, 26, 1, shade(C.TOWER, -0.1));

  /* --- 3.5.6 红色题字"北京交通大学" ---
     离屏用系统字体渲染真实字形 → alpha 二值化 → 逐像素填红，
     字形必然正确；字号随 S 走，放大后笔画仍是 1px 硬边。 */
  (function drawTitle() {
    const txt = "北京交通大学";
    const FS = Math.round(24 * S);
    const FONT = "bold " + FS + "px 'Microsoft YaHei','SimHei','PingFang SC',sans-serif";
    const t = mkCanvas(8, 8);
    let tc = t.getContext("2d");
    tc.font = FONT;
    const tw = Math.ceil(tc.measureText(txt).width) + 10, th = FS + 12;
    t.width = tw; t.height = th;
    tc = t.getContext("2d");
    tc.font = FONT;
    tc.textBaseline = "top";
    tc.fillStyle = "#000";
    tc.fillText(txt, 5, 5);
    const d = tc.getImageData(0, 0, tw, th).data;
    const pts = [];
    let minX = tw, maxX = -1, minY = th, maxY = -1;
    for (let y = 0; y < th; y++) {
      for (let x = 0; x < tw; x++) {
        if (d[(y * tw + x) * 4 + 3] > 100) {
          pts.push(x, y);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return;
    const w = maxX - minX + 1;
    const ox = Math.round(X(TX) - w / 2) - minX;             // 以白塔中轴居中
    const oy = Math.round(Y(ROOF_Y - 32)) - minY;            // 白塔下方，留出完整塔身
    g.fillStyle = C.RED;
    for (let i = 0; i < pts.length; i += 2) g.fillRect(ox + pts[i], oy + pts[i + 1], 1, 1);
  })();

  /* --- 3.5.7 中央玻璃幕墙（垂直贯穿，蓝色反光） --- */
  P(GLASS_L, WIN_TOP - 6, GW, GROUND_Y - WIN_TOP + 6, C.GLASS);
  for (let i = 0; i < GW; i++)                               // 斜向反光
    P(GLASS_L + i, WIN_TOP - 6 + i % 3, 1, GROUND_Y - WIN_TOP + 6,
      i < GW / 2 ? C.GLASS_HI : shade(C.GLASS_HI, -0.1));
  for (let y = WIN_TOP - 6; y < GROUND_Y; y += 14)           // 水平分格线
    P(GLASS_L, y, GW, 1, C.GLASS_D);
  P(GLASS_L + GW / 2, WIN_TOP - 6, 1, GROUND_Y - WIN_TOP + 6, C.GLASS_D);
  P(GLASS_L, WIN_TOP - 8, GW, 2, shade(C.WALL, -0.1));       // 顶部收口

  /* --- 3.5.8 窗户：幕墙左右各 4 列，列间留白色瓷砖带；左半为右半镜像 --- */
  function drawWin(x, y, w, h) {
    P(x, y, w, h, C.WIN_D);                                  // 窗洞
    P(x + 1, y + 1, Math.floor(w / 2), 2, C.WIN_L);          // 左上反光
    P(x + 1, y + 1, 2, Math.floor(h / 2), shade(C.WIN_L, -0.1));
    P(x + Math.floor(w / 2), y, 1, h, "#0e141c");            // 窗格
  }
  (function drawWindows() {
    const cols = 4, rows = 10, wW = 14, wH = 11, gX = 12, gY = 6;
    const step = wW + gX, rightStart = GLASS_R + 10;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wx = rightStart + c * step, wy = WIN_TOP + r * (wH + gY);
        if (wx + wW > BR - 10) continue;
        drawWin(wx, wy, wW, wH);
      }
    }
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wx = 2 * GC - (rightStart + c * step + wW);     // 右列左缘的镜像
        const wy = WIN_TOP + r * (wH + gY);
        if (wx < BL + 10) continue;
        drawWin(wx, wy, wW, wH);
      }
    }
  })();

  /* --- 3.5.9 底层入口：三角顶棚 + 玻璃门 --- */
  P(BL, WIN_BOT, BR - BL, GROUND_Y - WIN_BOT, shade(C.WALL, -0.15));
  const EX = TX, EY = WIN_BOT;
  P(EX - 18, EY + 6, 36, GROUND_Y - EY - 6, C.WIN_D);
  poly(g, [[X(EX - 26), Y(EY + 6)], [X(EX), Y(EY - 8)], [X(EX + 26), Y(EY + 6)]],
    shade(C.WALL, -0.05));
  poly(g, [[X(EX - 26), Y(EY + 6)], [X(EX), Y(EY - 8)], [X(EX - 2), Y(EY + 6)]], C.WALL_L);
  poly(g, [[X(EX), Y(EY - 8)], [X(EX + 26), Y(EY + 6)], [X(EX + 2), Y(EY + 6)]], C.WALL_D);
  P(EX - 16, EY + 8, 32, 2, C.GLASS_HI);
  P(EX - 1, EY + 8, 1, GROUND_Y - EY - 8, "#0e141c");

  /* --- 3.5.10 墙体左右边缘（严格对称） --- */
  P(BL, ROOF_Y, 1, GROUND_Y - ROOF_Y, C.WALL_D);
  P(BR - 1, ROOF_Y, 1, GROUND_Y - ROOF_Y, C.WALL_D);
  P(BL + 1, ROOF_Y, 1, GROUND_Y - ROOF_Y, shade(C.WALL, -0.06));
  P(BR - 2, ROOF_Y, 1, GROUND_Y - ROOF_Y, shade(C.WALL, -0.06));

  /* --- 3.5.11 入口前白色雕塑 --- */
  const sx = TX - 8;
  P(sx - 2, GROUND_Y - 10, 20, 6, shade(C.STATUE, -0.1));
  P(sx - 2, GROUND_Y - 10, 20, 1, C.STATUE);
  P(sx, GROUND_Y - 22, 6, 12, C.STATUE);
  P(sx + 8, GROUND_Y - 18, 6, 8, C.STATUE);
  P(sx + 3, GROUND_Y - 20, 8, 4, shade(C.STATUE, 0.1));
  P(sx, GROUND_Y - 22, 1, 12, "#fff");
  P(sx + 8, GROUND_Y - 18, 1, 8, "#fff");
  P(sx + 5, GROUND_Y - 22, 1, 12, shade(C.STATUE, -0.15));
  P(sx + 13, GROUND_Y - 18, 1, 8, shade(C.STATUE, -0.15));

  /* --- 3.5.12 接地最深窄带 --- */
  contactBand(g, X(BL) + 1, X(BR) - 1, Y(GROUND_Y) - 2, 3, 0.34);

  return { canvas: c, ax: X(TX), ay: Y(GROUND_Y), w: BR - BL, h: GROUND_Y - ROOF_Y };
}
/* =========================================================
   3.6 图书馆 —— 按**用户亲手画的示意图**重设计（2026-09-17 第二轮）
   ---------------------------------------------------------
   ⚠️⚠️ 设计源换了，别再按照片改。
     上一版是"按照片复刻"（`_build/_photo/tushuguan1/2.jpg`）—— 交付后被用户退回，
     原话：「图书馆交付效果很差，仔细看校园示意图ppt第二张，我直接给你花了一个图书馆，
     这个图书馆蓝色矩形分别表示横着的窗户带和竖着的玻璃带，四个周围的柱形都是浅红色屋顶，
     注意图书馆外墙是那种x细小的白色长方形瓷砖铺的，梯形代表阶梯，重新设计」
     ⇒ **权威设计源 = `D:\desktop\校园示意图.pptx` 第 2 张**（用户手绘，41 个矢量形状）。

/* --- 3.6.3 点阵字：1bit 掩膜 → 金字（上亮下暗的浮雕感，同 55 段 gyGlyph） --- */
function libBits(b64, cnt) {
  const s = atob(b64), out = new Uint8Array(cnt);
  for (let i = 0; i < cnt; i++) out[i] = (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  return out;
}
/* 逐列取"竖run"整段铺金，再给 run 的两端点高光/暗金。
   ⚠️ 判据是**竖 run ≥ 3** 才点端点 —— 短笔画（点是 1~2 px 的横）点了端点就糊成一块。
   ⚠️ 取色走 CARVE 系（白底可读），不是 GOLD 系 —— 理由见 LIB_PAL 里那段注释。 */
function libGlyph(g, b64, nw, nh, x, y) {
  const b = libBits(b64, nw * nh);
  for (let i = 0; i < nw; i++) {
    let j = 0;
    while (j < nh) {
      if (!b[j * nw + i]) { j++; continue; }
      let k = j;
      while (k + 1 < nh && b[(k + 1) * nw + i]) k++;
      px(g, x + i, y + j, 1, k - j + 1, LIB_PAL.CARVE);
      if (k - j + 1 >= 3) {
        px(g, x + i, y + j, 1, 1, LIB_PAL.CARVE_L);
        px(g, x + i, y + k, 1, 1, LIB_PAL.CARVE_D);
      }
      j = k + 1;
    }
  }
}

   三个字加两个 5px 间隔 = 61 宽，居中在 LIB_SX 上、**直接落在白瓷砖墙面上**
   （用户口径：白底不是蓝底）——所以这里不再有那条蓝横带，调用点也只剩这一个。 */
const LIB_GAP = 5;
function libPlaque(g, cx, yBot) {
  let tw = LIB_GAP * (LIB_CHARS.length - 1);
  for (const e of LIB_CHARS) tw += e[1];
  const nh = LIB_CHARS[0][2];
  let x = Math.round(cx - tw / 2);
  for (const e of LIB_CHARS) {
    libGlyph(g, e[0], e[1], e[2], x, yBot - nh);
    x += e[1] + LIB_GAP;
  }
}

      会重掷 buildGround 下游（水/操场/球场/校门/路缘/标线/井盖/磨损/泥土/围墙）
      的地面噪声 —— 视觉等价，且**props 不受影响**（scatter 用的是独立流
      rngS = makeRng(31415926)），所以 _propdiff / _sprhash 这两个像素级判据照常有效。
      三套自动验收（accept/verify/zoomtest）**都查不出**地面噪声变了，这是已知的。 */
function paintLibraryPlaza(g, rng) {
  const x0 = Math.round(LIB.x), x1 = Math.round(LIB.x + LIB.w);
  const y0 = Math.round(LIB_FY) - 6;          // 往北多铺 6px，被楼体精灵压住，防缝隙
  const y1 = Math.round(LIB_BY) + 4;          // 往南压过主路北缘 4px，铺装"接"到路
  px(g, x0, y0, x1 - x0, y1 - y0, PLAZA_BASE);
  for (let y = Math.ceil(y0 / 32) * 32; y < y1; y += 32)
    for (let x = Math.ceil(x0 / 32) * 32; x < x1; x += 32)
      px(g, x + 1, y + 1, 30, 30, shade(PLAZA_BASE, (rng() - 0.5) * 0.22));
  /* 四周一圈深色石缘：把"图书馆自己的地"和外面的路划开 */
  px(g, x0, y0, x1 - x0, 3, shade(PLAZA_DARK, -0.20));
  px(g, x0, y0, 3, y1 - y0, shade(PLAZA_DARK, -0.20));
  px(g, x1 - 3, y0, 3, y1 - y0, shade(PLAZA_DARK, -0.20));
}

/* =========================================================
   3.6.4b 前庭净空：把落进前庭的树清掉
   ---------------------------------------------------------
   为什么必须有这一条：`stampLibraryPlaza()` 把前庭标成 `K.PLAZA`，而散射（`scatter`）
   与规则点阵（`plantRows`）**都会往广场上种树**。楼体没后退时这些树的接地点(≈1357)
   小于旧落地线 1431.63 ⇒ 一直被楼挡着看不见；楼体一退到 LIB_FY = 1321.63，
   它们就翻到楼**前面**来 —— 而且正好**站在彩绘台阶上**（台阶占 LIB_FY..LIB_FY+45）。
   ⚠️ 判据用**接地点**（p.x, p.y），与 clearLawnZone 同规；不用美术盒（树冠探到前庭
      上空正是边界树该有的样子，按盒判会把前庭外那一圈也误删）。
   ⚠️ 只删 `tree` / `lawnTree` 两个 tag：坐像(tag "mao")、路灯、桶、椅要么有别的 tag
      要么没有 tag，天然放行 —— 这一条**不会**碰到坐像。
   ⚠️ 调用点必须在 `plantRows()` **之后**（规则树阵也往这里种），
      见 60_assemble.js §6.6c 之后那一行。
   ========================================================= */
function clearLibFore() {
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    if ((p.tag === "tree" || p.tag === "lawnTree") && inLibFore(p.x, p.y)) { dropped++; continue; }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* =========================================================
   3.6.5 立面零件（全部照示意图的四种"带"来写）
   ========================================================= */
/* 白瓷砖墙皮：**细小的白色长方形瓷砖**（用户口径），8×4 走砖、错缝。
   ⚠️ 瓷砖缝用**绝对坐标取模**，不按传入的 x0/y0 起算 —— 相邻体量的墙会叠着画
      （两翼压在中央高体量上），相位不一致就会在接缝处挂出半块砖。
   受光/背光棱由调用点补（libPost）。 */
function libTiles(g, x0, x1, y0, y1) {
  const P = LIB_PAL;
  px(g, x0, y0, x1 - x0, y1 - y0, P.WALL);
  for (let yi = Math.floor(y0 / 4); yi * 4 < y1; yi++) {
    const y = yi * 4, o = (yi & 1) ? 4 : 0;
    px(g, x0, y, x1 - x0, 1, P.TILE);                        // 横缝
    for (let xi = Math.ceil((x0 - o) / 8); xi * 8 + o < x1; xi++) {
      const x = xi * 8 + o;
      if (x > x0 && x < x1 - 1) px(g, x, y + 1, 1, 3, P.TILE);   // 竖缝（错缝半块）
    }
  }
}
/* 体量的左右棱：左受光、右背光（照 SUN 在左上）。 */
function libPost(g, x0, x1, yTop) {
  const P = LIB_PAL;
  px(g, x0, yTop, 2, LIB_BASE - yTop, P.WALL_L);
  px(g, x1 - 2, yTop, 2, LIB_BASE - yTop, shade(P.WALL, -0.34));
  px(g, x0, yTop, x1 - x0, 1, P.WALL_L);                     // 顶边
}
/* 四棱锥顶：正南正交视角下只能看见**正面那一坡**，所以就是一个等腰三角形。
   受光按 SUN（左上）—— 左半亮、右半暗；每 5 行一道瓦缝。
   ⚠️ 三个锥**共用一条底边线**（LIB_CBASE）：这是用户口径"三个三角形的底边全在同一条
      基线上"的可执行形式，调用点由 build.py 钉住，不许各自带 y。 */
function libCone(g, cx, yBase, hw, h, col) {
  for (let i = 0; i < h; i++) {
    /* ⚠️ 半宽必须**随 i 增大**：i=0 是锥尖（宽 ≈0）、i=h-1 是锥底（满宽 hw）。
       写成 `hw*(h-i)/h` 就是上下颠倒 —— 一个上宽下窄的漏斗，而四套自动验收
       一个都判不出来（它们不看画面），只有 _propview.py 的放大图看得见。 */
    const w = hw * (i + 1) / h;
    const xa = Math.round(cx - w), ww = Math.max(1, Math.round(2 * w));
    px(g, xa, yBase - h + i, ww, 1, col);
    if (ww > 4) {                                   // 两侧坡面的受光/背光
      px(g, xa, yBase - h + i, 1, 1, shade(col, 0.22));
      px(g, xa + ww - 1, yBase - h + i, 1, 1, shade(col, -0.30));
    }
    if (i % 5 === 4) px(g, xa + 1, yBase - h + i, Math.max(1, ww - 2), 1, shade(col, -0.16));
  }
  /* 檐口线：锥底一道深色，把锥和墙分开 */
  px(g, Math.round(cx - hw) - 1, yBase - 1, Math.round(2 * hw) + 2, 1, shade(col, -0.46));
}
/* 浅红屋顶带：四个矮体量各一条（示意图里是贴在体量顶边的一块 190×32.6 的浅红矩形）。
   ⚠️ 它是**竖直面**（正立面上看到的是屋顶带的正面），不是朝天的屋面 ——
      所以只给上棱受光、下棱背光，不画进深。 */
function libRoofBand(g, x0, x1, y0) {
  const P = LIB_PAL, h = LIB_RBH;
  px(g, x0, y0, x1 - x0, h, P.ROOF);
  px(g, x0, y0, x1 - x0, 2, P.ROOF_L);
  px(g, x0, y0 + h - 2, x1 - x0, 2, P.ROOF_D);
  px(g, x0, y0 + (h >> 1), x1 - x0, 1, shade(P.ROOF, -0.14));   // 一道瓦垄，别读成纯色板
  px(g, x0 - 1, y0, 1, h, shade(P.ROOF, -0.22));
  px(g, x1, y0, 1, h, shade(P.ROOF, -0.36));
}
/* 横向蓝窗带（外柱 3 道 / 两翼 2 道）：通宽带状窗 + 细竖梃。
   ⚠️ 竖梃只是给 1× 下的可读性加一点质地，别加密到"窗格"——示意图里它是**整片蓝**。 */
function libWinBand(g, x0, x1, y0, h) {
  const P = LIB_PAL;
  px(g, x0, y0, x1 - x0, h, P.GLASS);
  px(g, x0, y0, x1 - x0, 1, P.GLASS_HI);
  px(g, x0, y0 + h - 1, x1 - x0, 1, shade(P.GLASS, -0.38));
  px(g, x0, y0, 1, h, shade(P.GLASS, 0.22));
  px(g, x1 - 1, y0, 1, h, shade(P.GLASS, -0.26));
  for (let x = x0 + 11; x < x1 - 3; x += 11)
    px(g, x, y0 + 1, 1, h - 2, shade(P.GLASS, -0.24));
}
/* 竖向窄窗（中央体量的两翼上，示意图 13.7×38.5 的虚线状竖条）：
   4 列 × 4 行，**列 x 由 LIB_VWX 给死**（关于中轴对称），行距 22。 */
function libVWin(g, x0) {
  for (const y of LIB_VWY) libWinBand(g, x0, x0 + LIB_VWW, y, LIB_VWH);
}
/* 中央竖向玻璃带：**竖着的玻璃带**（用户口径），从檐下贯到门头刻字区。
   暗色端在函数内读 SY_COL.GLASS（见 3.6.1 注；顶层读＝整页 JS 死）。 */
function libGlassRibbon(g, x0, x1, y0, y1) {
  const P = LIB_PAL;
  const GD = SY_COL.GLASS;
  const w = x1 - x0, h = y1 - y0;
  px(g, x0, y0, w, h, P.GLASS);
  for (let y = y0; y < y1; y += FLOOR_H)                    // 横分格：往上接着数楼层
    px(g, x0, y, w, 2, shade(GD, -0.10));
  /* 斜向反光：只在上段留一道，长了会读成"理发店转筒" */
  for (let i = 0; i < Math.min(h, 28); i++) {
    const x = x0 + 3 + i;
    if (x < x1 - 2) px(g, x, y0 + i, Math.min(4, x1 - 2 - x), 1, P.GLASS_HI);
  }
  px(g, x0, y0, 1, h, P.GLASS_HI);                          // 左棱受光
  px(g, x0 + 1, y0, 2, h, shade(GD, 0.26));
  px(g, x1 - 3, y0, 3, h, shade(GD, -0.20));                // 右棱背光
  px(g, x0, y0, w, 1, shade(GD, 0.34));
  px(g, x0, y1 - 2, w, 2, shade(GD, -0.36));
}
/* 入口：青铜门框 + 深色玻璃门（两扇 + 中梃）。门区上沿 = LIB_SG_B。 */
function libDoor(g, x0, x1, yTop) {
  const P = LIB_PAL;
  const GD = SY_COL.GLASS;
  const h = LIB_BASE - yTop;
  px(g, x0 - 3, yTop, x1 - x0 + 6, 4, shade(P.FRAME, 0.14));      // 门楣
  px(g, x0 - 3, yTop + 4, x1 - x0 + 6, 1, P.FRAME_D);
  px(g, x0, yTop + 5, x1 - x0, h - 5, shade(GD, -0.32));          // 深色玻璃
  px(g, x0, yTop + 5, x1 - x0, 2, shade(GD, 0.06));
  const mid = Math.round((x0 + x1) / 2);
  px(g, mid - 1, yTop + 5, 2, h - 5, shade(P.FRAME, -0.06));      // 中梃
  px(g, x0, yTop + 5, 2, h - 5, shade(P.FRAME, 0.08));
  px(g, x1 - 2, yTop + 5, 2, h - 5, shade(P.FRAME, -0.26));
  px(g, x0, LIB_BASE - 2, x1 - x0, 2, shade(GD, -0.52));          // 门槛
}
/* 阶梯：画在落地线**之下**（＝楼前＝南侧），11 级、每级 4 行。
   ⚠️ 必须画在精灵画布内：画布往下长 = 往南长 = 长在楼前（55_gym.js:28-30）。
      画成独立道具就会被深度排序判反，站在台阶上的玩家会被台阶盖住。
   宽度照示意图的**梯形**：上窄下宽（40 → 74），
   即"梯形代表阶梯"这条口径的可执行形式。
   ⚠️ 级数 15→11、行数 3→4 是**为彩绘服务的**：踢面只有 1 行时，彩绘在放大图里读成
      "彩虹条形码"（15 条 1px 色线夹在近白踏面之间），2 行才看得出色块。
      11 × 4 = 44 ≤ LIB_STAIR(45)，画布与台阶进深都不用动。 */
function libStair(g) {
  const P = LIB_PAL, N = 11, WA = 40, WB = 74;
  for (let i = 0; i < N; i++) {
    const w = Math.round(WA + (WB - WA) * i / (N - 1));
    const x = Math.round(LIB_SX - w / 2), y = LIB_BASE + i * 4;
    /* 每级占 4 行：**踏面 1 / 踢面 2 / 级间投影 1**。
       ⚠️ 投影必须画在 y+3 —— 下一步的踏面在 y+4，写在那儿会被整行盖掉，
          "级间投影"一行都不会显示（旧版就是这么死的，放大图里台阶是一整片色块）。 */
    px(g, x, y, w, 1, shade(P.WALL_L, 0.04 - i * 0.014));       // 踏面（受光）
    /* 踢面（彩绘）：**每 2 级一色**（11 级 = 6 条色带）。
       ⚠️ 不能逐级换色：踏面是近白的、逐级换色在放大图里是"彩虹条形码"，
          读不出"壁画"；2 级一组才有可读的色块宽度。 */
    px(g, x, y + 1, w, 2, LIB_PAINT[((i / 2) | 0) % LIB_PAINT.length]);
    /* 踢面上再压一块点缀色方砖，位置逐级右移 9px ⇒ 连起来是一条斜向笔触带。
       ⚠️ 右端必须夹到 x+w：不夹的话末级（w=74）方砖会写到相邻级的老位置上。 */
    const bx = x + 3 + ((i * 9) % Math.max(1, w - 16));
    px(g, bx, y + 1, Math.min(14, x + w - bx), 2,
       LIB_PAINT_A[i % LIB_PAINT_A.length]);
    px(g, x, y + 3, w, 1, "rgba(14,18,28,0.26)");               // 级间投影
  }
  /* 两侧斜坡护墙：照片里台阶两边有石帮 */
  for (let i = 0; i < N; i++) {
    const w = Math.round(WA + (WB - WA) * i / (N - 1));
    const x = Math.round(LIB_SX - w / 2), y = LIB_BASE + i * 4;
    px(g, x - 3, y, 3, 4, shade(P.WALL_D, -0.24));
    px(g, x + w, y, 3, 4, shade(P.WALL_D, -0.36));
  }
}

/* =========================================================
   3.6.6 图书馆本体精灵
   ---------------------------------------------------------
   绘制顺序 = 从后到前：中央高体量 → 左右外柱 → 两翼 → 三条锥顶 →
                      玻璃带 / 窄窗 / 门头刻字 / 门 → 彩绘台阶。
   ========================================================= */
function makeLibrary(o) {
  const rng = makeRng(o.seed);
  const P = LIB_PAL;
  const c = mkCanvas(LIB_W + LIB_PADX * 2, LIB_H);
  const g = c.getContext("2d");
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);

  /* --- 地面投影：先画，落在自己前庭的铺装上（前庭是烘焙的地面，本精灵压在上面）--- */
  shadowQuad(g, LIB_X0 + 2, LIB_BASE - 20, LIB_X1 - 2, LIB_BASE + 6, SHX, SHY, 0.26, 4);

  /* --- ① 由后到前三层墙（全是白瓷砖）---
     中央高体量先铺满全高；外柱与两翼叠在它上面（同色同砖缝，相位一致 ⇒ 看不出接缝）。 */
  libTiles(g, LIB_UA, LIB_UB, LIB_CBASE, LIB_BASE);
  libTiles(g, LIB_C1[0], LIB_C1[1], LIB_SROOF, LIB_BASE);
  libTiles(g, LIB_C5[0], LIB_C5[1], LIB_SROOF, LIB_BASE);

  /* --- ② 三层顶边 / 侧棱 --- */
  libPost(g, LIB_X0, LIB_C1[1], LIB_SROOF);                    // 外左
  libPost(g, LIB_C5[0], LIB_X1, LIB_SROOF);                    // 外右
  px(g, LIB_UA, LIB_CBASE, LIB_UB - LIB_UA, 2, P.WALL_L);      // 中央高体量顶边（锥基座线）
  px(g, LIB_UA, LIB_CBASE, 2, LIB_BASE - LIB_CBASE, P.WALL_L);
  px(g, LIB_UB - 2, LIB_CBASE, 2, LIB_BASE - LIB_CBASE, shade(P.WALL, -0.34));
  /* 两翼的顶边（浅红屋顶带的上沿，稍后由 libRoofBand 的受光棱给出）与
     外柱／中央体量之间的两条竖缝 */
  px(g, LIB_C1[1] - 2, LIB_SROOF, 1, LIB_BASE - LIB_SROOF, shade(P.WALL, -0.30));
  px(g, LIB_C5[0], LIB_SROOF, 1, LIB_BASE - LIB_SROOF, P.WALL_L);

  /* --- ③ 四条浅红屋顶带（用户口径：四个周围的柱形都是浅红色屋顶）--- */
  for (const V of [LIB_C1, LIB_C5]) libRoofBand(g, V[0], V[1], LIB_SROOF);
  for (const V of [LIB_C2, LIB_C4]) libRoofBand(g, V[0], V[1], LIB_WROOF);

  /* --- ④ 三个锥顶：**共用 LIB_CBASE 一条底边线**（用户口径，build.py 钉住）---
     ⚠️ 三个三角形首尾相接、正好盖满中央体量的顶边（97..304），中间不留女儿墙。 */
  for (const T of LIB_CONES) libCone(g, T[0] + T[1] / 2, LIB_CBASE, T[1] / 2, T[2], P.ROOF);

  /* --- ⑤ 中央竖向玻璃带（从檐下贯到门头刻字区）--- */
  libGlassRibbon(g, LIB_C3[0] + 16, LIB_C3[1] - 16, LIB_GT, LIB_GB);

  /* --- ⑥ 两翼上的 4 列 × 4 行竖向窄窗 --- */
  for (const x of LIB_VWX) libVWin(g, x);

  /* --- ⑦ 四条横窗带：外柱 3 道、两翼 2 道（每条都是通宽带状窗）---
     ⚠️ 不再用 `LIB_SROOF + 35 + k * FLOOR_H` 那种"借全校层高推"的写法：楼降矮后
        窗带间距（25）已不等于 FLOOR_H（34），借 FLOOR_H 会把第二三道窗推到墙外。 */
  for (const V of [LIB_C1, LIB_C5]) {
    const a = V[0] + LIB_WM, b = V[1] - LIB_WM;
    for (let k = 0; k < 3; k++) libWinBand(g, a, b, LIB_SWB + k * LIB_BSTEP, LIB_WBH);
  }
  for (const V of [LIB_C2, LIB_C4]) {
    const a = V[0] + LIB_WM, b = V[1] - LIB_WM;
    for (let k = 0; k < 2; k++) libWinBand(g, a, b, LIB_WWB + k * LIB_BSTEP, LIB_WBH);
  }

  /* --- ⑧ 门头「圖書館」刻字（**白底**）+ 入口 ---
     ⚠️ 用户口径：「放图书馆字体的地方是白色背景不是蓝色背景」⇒ 这里不再有那条蓝横带，
        三个字直接刻在中央开间的白瓷砖墙面上（字色换 CARVE 系才在白底上读得出，
        见 LIB_PAL 的注）。yBot 仍按"居中于 LIB_GB..LIB_SG_B 这条带"现算。 */
  libPlaque(g, LIB_SX, LIB_GB + Math.round((LIB_SG_B - LIB_GB + LIB_CHARS[0][2]) / 2));
  libDoor(g, Math.round(LIB_SX - 20), Math.round(LIB_SX + 20), LIB_SG_B);

  /* --- ⑨ 屋名牌（**已撤**，只剩调用） ----
     ⚠️ 用户口径（逐字）：「图书馆几个简体字可以去掉了，留着那几个复刻的烫金字就行」。
        上面 ⑧ 那三个復刻烫金字「圖書館」已经是楼名，这里再挂一块简体牌是重复。
     ⚠️ 但 makeSign(LIB_NAME) **必须照旧调用**：verify.py 的屋名标牌自检读 _signCache，
        不调用就报 MISS:图书馆 —— 它只查缓存里有没有这一项，**不查牌面画没画**
        （已核实 verify.py:57-66 的 wantNames/got/missing 三条判据）。
        ⇒ 合法写法就是"调而不画"，所以这里是**裸语句**，不是漏了 if。 */
  makeSign(LIB_NAME);

  /* --- ⑩ 彩绘台阶（画在 baseY 之下） --- */
  libStair(g);
  contactBand(g, LIB_X0 + 1, LIB_X1 - 1, LIB_BASE - 1, 2, 0.34);

  /* ⚠️ h 是**楼高**（LIB_BASE − LIB_TOP = 245），不是"落地线 − PADT" —— 楼降矮后
     楼顶落在行 99，比 PADT(18) 低 81 行，写 PADT 会把透明留白算进楼高。 */
  return { canvas: c, ax: LIB_SX, ay: LIB_BASE, w: LIB_W, h: LIB_BASE - LIB_TOP };
}

/* =========================================================
   3.6.7 茅以升坐像（独立道具）
   ---------------------------------------------------------
   ⚠️ 必须是**独立道具**，不能并进建筑精灵：
      并进去就会跟着建筑的 baseY 一起排序 —— 走到坐像**背后**（坐像与台阶之间）的
      玩家 y 仍大于建筑的 baseY，会被画在坐像**前面**，看起来像穿过了铜像。
      做成独立道具后它有自己的 baseY，前后遮挡由 y 自然决定。
      （这与台阶**必须**并进精灵的理由正好相反，见 3.6.5 libStair 的注。）
   基座上的「茅以升」三字：56px 宽的基座上放不出可读的 1bit 字形，
   照 55 段"落款"的先例只点三小块暗示有字，不描字形。
   ========================================================= */
/* 尺寸锚：人物精灵是 CH_W 18 × CH_H 30、落地线 CH_AY 27（50_char.js）。
   坐像连基座总高取 **52 ≈ 1.9 倍人身** —— 第一版画到 76（2.8 倍）是"巨型雕像"，
   放大图里比例完全不对；而且那版把腿画在基座**之后**，两条腿直接穿进黑石里。
   ⚠️ 这里**不许**在顶层读 CH_H —— 50 段在本段之前加载不假，但顶层读常量是
      58_dxdoor.js 栽过的坑，一律函数内读/本地写死。 */
const MAO_W = 48, MAO_H = 56, MAO_BY = 52;      // 落地线在精灵第 52 行，其下留 4 行余量
function makeMaoyisheng() {
  const P = LIB_PAL;
  const c = mkCanvas(MAO_W, MAO_H), g = c.getContext("2d");
  const cx = MAO_W / 2, BY = MAO_BY;
  /* 竖向分层（相对落地线 BY=52，自下而上）。⚠️ 第一版把椅背画到 BY-38 = 高出肩线
     8 行、又宽出躯干两侧 3px ⇒ 放大图里成了"戴兜帽的人"；书压在躯干最下面 ⇒
     成了白围兜。**椅背顶只许齐肩线**、**书必须落在膝上（胯与膝之间）**，两条都是硬口径。 */
  const bx = 4, bw = 40;
  /* ---- 黑石基座（先画：人体一律在它**之前**，绝不能反过来把腿压进石头里）---- */
  px(g, bx, BY - 8, bw, 8, P.STONE);
  px(g, bx, BY - 8, bw, 2, shade(P.STONE, 0.40));                   // 台面上棱受光
  px(g, bx, BY - 2, bw, 2, shade(P.STONE, -0.40));                  // 下棱背光
  px(g, bx - 2, BY - 9, bw + 4, 2, shade(P.STONE, 0.16));           // 台沿外挑
  for (let i = 0; i < 3; i++)                                        // 金字「茅以升」暗示
    px(g, cx - 8 + i * 6, BY - 7, 4, 2, P.GOLD);
  px(g, cx - 8, BY - 4, 16, 1, shade(P.GOLD, -0.26));                // 生卒年那一行
  /* ---- 扶手椅：椅背顶 = 肩线（BY-32），扶手只到胯两侧 ---- */
  px(g, cx - 10, BY - 34, 20, 26, shade(P.BRONZE, -0.30));           // 椅背
  px(g, cx - 10, BY - 34, 20, 1, shade(P.BRONZE, -0.16));            // 椅背顶受光
  px(g, cx - 13, BY - 24, 3, 13, shade(P.BRONZE, -0.40));            // 左扶手
  px(g, cx + 10, BY - 24, 3, 13, shade(P.BRONZE, -0.40));            // 右扶手
  /* ---- 人体：腿 → 胯 → 躯干 → 头，自下而上，后画的压前面的 ---- */
  px(g, cx - 8, BY - 13, 5, 5, shade(P.BRONZE, -0.24));              // 左小腿
  px(g, cx + 3, BY - 13, 5, 5, shade(P.BRONZE, -0.24));              // 右小腿
  px(g, cx - 9, BY - 20, 18, 7, shade(P.BRONZE, -0.14));             // 大腿（水平朝前探）
  px(g, cx - 9, BY - 20, 18, 1, shade(P.BRONZE, 0.06));              // 膝上受光
  px(g, cx - 7, BY - 19, 14, 7, "#ddd8c6");                          // 摊开的书（落在膝上）
  px(g, cx - 7, BY - 19, 14, 1, "#f4f0e2");
  px(g, cx - 1, BY - 19, 2, 7, shade("#ddd8c6", -0.34));             // 书脊
  px(g, cx - 7, BY - 32, 14, 13, P.BRONZE);                          // 躯干
  px(g, cx - 8, BY - 32, 16, 2, P.BRONZE_L);                         // 肩（比躯干宽 1px）
  px(g, cx - 7, BY - 32, 2, 13, P.BRONZE_L);                         // 左臂受光
  px(g, cx + 5, BY - 32, 2, 13, P.BRONZE_D);                         // 右臂背光
  px(g, cx - 2, BY - 35, 4, 4, shade(P.BRONZE, -0.10));              // 颈
  /* 头：8 宽放不下五官，就把"圆"和"眼线"两件事做到位 ——
     顶行两侧各收 1px 出圆颅，眼镜压在全高 1/3 处（第一版画在 2/3 处，读成了嘴）。 */
  px(g, cx - 4, BY - 43, 8, 8, P.BRONZE);                            // 头（颅底）
  px(g, cx - 3, BY - 44, 6, 1, P.BRONZE);                            // 圆颅顶
  px(g, cx - 3, BY - 44, 6, 2, shade(P.BRONZE_D, 0.06));             // 头发
  px(g, cx - 4, BY - 41, 1, 2, shade(P.BRONZE_D, 0.06));             // 鬓角
  px(g, cx + 3, BY - 41, 1, 2, shade(P.BRONZE_D, 0.06));
  px(g, cx - 4, BY - 41, 1, 6, P.BRONZE_L);                          // 左脸受光
  px(g, cx - 3, BY - 40, 6, 1, shade(P.BRONZE_D, -0.22));            // 眼镜
  px(g, cx - 3, BY - 40, 2, 1, P.BRONZE_L);
  px(g, cx + 1, BY - 40, 2, 1, P.BRONZE_L);
  px(g, cx - 3, BY - 37, 6, 1, shade(P.BRONZE_D, 0.04));             // 下颌投影
  contactBand(g, bx + 1, bx + bw - 1, BY - 1, 2, 0.34);
  return { canvas: c, ax: cx, ay: BY, w: MAO_W, h: BY };
}

/* =========================================================
   3.7 运动区（全部烘焙进地面：球场/跑道是贴地的）
   ---------------------------------------------------------
   用户原话："中间是绿色足球场，周围是红色的好几圈跑道"；
   "网球场、篮球场区域你可以自由，紧凑安排多个单元"。
   ⚠️ PPT 的操场矩形放不下标准 400m 田径场（作图不按比例），
      用户已默许运动区自由安排 —— **不要为此改标尺**。
   ========================================================= */
const LANE_RAMP = ["#a8453a", "#9a3e34", "#b04c40"];
/* ⚠️ 第七轮（2026-09-17）用户口径（逐字）：
     「值得注意的是下方的网球场是被围栏围起来的，围栏比较高，是绿色的，
       并且球场也是纵向排布的，球场颜色是蓝色」
   三条一起改：① 球场底色绿→**蓝** ② 球场长轴钉成**南北**（纵向）
              ③ 整个场区加一圈**较高**的**绿色**围栏。
   ⇒ 单元缓冲铺装（TCOURT_BASE）铺满单元宽的 174/182，所以"球场之间那几十像素"
     读起来是**同一片蓝色场地的缓冲区**，不是空地 —— 这正是硬地的样子，
     白色场地线直接画在这片蓝上。 */
const BCOURT_BASE = "#a85a4a", BCOURT_LINE = "rgba(245,245,240,0.78)";
const TCOURT_BASE = "#3f6ea8", TCOURT_LINE = "rgba(245,245,240,0.80)";
const TCOURT_APRON = "#2e4f74";                 // 场区底色（只在单元之间的 4px 缝里露出来）
/* 网球场围栏。校内围墙 §4.6 是 WALL_H = 22 —— "比较高"取 32（高一档半）。
   ⚠️ **结构 = 立柱 + 柱间的绿色铁丝网**，以一个"网片单元"为单位连续排满整圈；
      不是一堵实心绿墙。第一版把 §4.6 围墙的 wallColumn 照搬过来（每 6px 一根连续
      竖带）＝一片实心绿，用户当天退回，原话（逐字）：
        「围栏是那种绿色编织网围栏，就是比如说四个栏杆围一个区域，区域中间是绿色
          铁丝网编织成的围栏这种，然后以这四个栏杆和中间的网为单位连续放上这种
          单位组成的围栏，而且加上围栏之后小人不能移动到围栏内了」
      ⇒ 一个"区域"＝ 一个网片单元（四角各一根望柱，中间一张网）；
         TFEN_UW = 一个单元的宽 = 柱间距，单元首尾相接就是整圈。
   ⚠️ 碰撞盒**不在本段加**：`addSolid` / `solids` 定义在 60_assemble.js，而本段排在
      它**之前**加载（加载期读顶层 const 撞暂时性死区 ⇒ 整页 JS 死，58 段的 PALETTE
      已栽过一次）。盒子在 §6.5g 里按 zoneRect 现算，与这里画的这圈**同源同式**。
      旧版是**有意**不做（加 addSolid 会挪动 solids、重掷全校园散射，见 60 段 §6.6
      的地雷）；用户这轮明确要求加，那一轮就是本轮 —— 见交付说明里的单独声明。 */
const TFEN_H = 32;
const TFEN_COL = "#3a6b42", TFEN_COL_L = "#568c5e", TFEN_COL_D = "#26492d";
const TFEN_RAIL = "#7fae83";
/* 网丝取**比柱亮一档**的绿：柱是"实"的、网是"虚"的，靠亮度差把两者分开。 */
const TFEN_MESH_C = "#5f9c66";
const TFEN_UW = 30, TFEN_MESH = 5;              // 一个网片单元的宽（= 柱间距）/ 网眼边长
const TFEN_RLT = 3, TFEN_RIN = 2, TFEN_PW = 4;  // 上横杆厚 / 横杆离柱顶 / 望柱宽

function zoneRect(e) { return { x: IX(e[2]), y: IX(e[3]), w: IX(e[4]), h: IX(e[5]) }; }

function paintTracks(g, rng) {
  for (const e of CAMPUS) if (e[1] === "track") paintTrack(g, rng, zoneRect(e));
}

function paintTrack(g, rng, R) {
  const cx = Math.round(R.x + R.w / 2), cy = Math.round(R.y + R.h / 2);
  const rx = Math.round(R.w / 2) - 6, ry = Math.round(R.h / 2) - 6;
  const lanes = 6, inset = Math.max(26, Math.round(ry * 0.42));
  const horiz = rx >= ry;

  /* 1) 外圈深红跑道底 + 逐圈分道（交替明暗，做出"好几圈"的观感） */
  ellipsePx(g, cx, cy, rx + 4, ry + 4, "#7f3229");
  for (let i = 0; i <= lanes; i++) {
    const shrink = Math.round((i / lanes) * inset);
    ellipsePx(g, cx, cy, rx - shrink, ry - shrink, LANE_RAMP[i % 3]);
    if (i > 0 && i < lanes) {                       // 分道白线（细）
      ellipsePx(g, cx, cy, rx - shrink, ry - shrink, "rgba(255,255,255,0.10)");
      ellipsePx(g, cx, cy, rx - shrink + 1, ry - shrink + 1, LANE_RAMP[i % 3]);
    }
  }
  /* 2) 内圈绿色足球场 + 白色场地线 */
  const fx = rx - inset, fy = ry - inset;
  ellipsePx(g, cx, cy, fx, fy, "#4d8a3e");
  ellipsePx(g, cx, cy, fx - 3, fy - 3, "#57974a");
  const fieldR = Math.min(fx, fy) * 0.86;
  if (fieldR > 20) {
    if (horiz) {
      px(g, cx, cy - Math.round(fy * 0.80), 2, Math.round(fy * 1.60), TCOURT_LINE);   // 中线
      ellipseRing(g, cx, cy, Math.round(fieldR * 0.26), TCOURT_LINE);
      rectLine(g, cx - Math.round(fx * 0.72), cy - Math.round(fy * 0.52), Math.round(fx * 0.22), Math.round(fy * 1.04), TCOURT_LINE);
      rectLine(g, cx + Math.round(fx * 0.50), cy - Math.round(fy * 0.52), Math.round(fx * 0.22), Math.round(fy * 1.04), TCOURT_LINE);
    } else {
      px(g, cx - Math.round(fx * 0.80), cy, Math.round(fx * 1.60), 2, TCOURT_LINE);
      ellipseRing(g, cx, cy, Math.round(fieldR * 0.26), TCOURT_LINE);
      rectLine(g, cx - Math.round(fx * 0.52), cy - Math.round(fy * 0.72), Math.round(fx * 1.04), Math.round(fy * 0.22), TCOURT_LINE);
      rectLine(g, cx - Math.round(fx * 0.52), cy + Math.round(fy * 0.50), Math.round(fx * 1.04), Math.round(fy * 0.22), TCOURT_LINE);
    }
  }
  /* 3) 跑道与草坪之间的深色内沿 */
  ellipseRing(g, cx, cy, fx + 1, "rgba(20,30,16,0.45)");
}

function rectLine(g, x, y, w, h, col) {
  px(g, x, y, w, 2, col); px(g, x, y + h - 2, w, 2, col);
  px(g, x, y, 2, h, col); px(g, x + w - 2, y, 2, h, col);
}
/* --- 网球场围栏：绿色**编织网**围栏（第七轮，同日按用户口径重做）---------
   结构：立柱（望柱）+ 柱间的铁丝网，一个"单元"＝四角立柱 + 中间一张网，首尾相接。
   口径沿用 §4.6 校内围墙：沿一条线立柱子，每根是 (x, y−H) → (x, y) 的竖带 ——
   无论线朝哪边，"高"都读成屏幕竖直（这套轴测的既定读法，墙也没做透视）。
   ⚠️ **网面必须透气**：不铺底色，只落 1px 的网丝，让底下的球场 / 草地透出来 ——
      "网"与"墙"在像素尺度上的唯一区别就在这里（第一版铺了实色底 ＝ 一堵绿墙）。 */

/* 网眼：在屏幕矩形 (x, y, w, h) 里画一格格绿丝。**不铺底色。** */
function tfMesh(g, x, y, w, h) {
  if (w <= 0 || h <= 0) return;
  for (let i = 0; i < h; i += TFEN_MESH) px(g, x, y + i, w, 1, TFEN_MESH_C);   // 横丝
  for (let i = 0; i < w; i += TFEN_MESH) px(g, x + i, y, 1, h, TFEN_MESH_C);   // 竖丝
  /* 收边：单元宽 / 高不是 TFEN_MESH 的整数倍时，最后一格不补就是一条豁口 */
  if ((h - 1) % TFEN_MESH) px(g, x, y + h - 1, w, 1, TFEN_MESH_C);
  if ((w - 1) % TFEN_MESH) px(g, x + w - 1, y, 1, h, TFEN_MESH_C);
}

/* 一根望柱：立在地脚线 (x, y) 上的深绿方柱 + 外挑柱头 + 接地影 */
function tfPost(g, x, y) {
  const X = Math.round(x) - TFEN_PW / 2, Y = Math.round(y);
  px(g, X, Y - TFEN_H + 2, TFEN_PW, TFEN_H - 2, TFEN_COL);            // 柱身
  px(g, X, Y - TFEN_H + 2, 1, TFEN_H - 2, TFEN_COL_L);                // 西棱受光
  px(g, X + TFEN_PW - 1, Y - TFEN_H + 2, 1, TFEN_H - 2, TFEN_COL_D);  // 东棱背光
  px(g, X - 1, Y - TFEN_H - 1, TFEN_PW + 2, 3, TFEN_COL_D);           // 柱头
  px(g, X - 1, Y - TFEN_H - 1, TFEN_PW + 2, 1, TFEN_COL_L);           //   …受光顶棱
  px(g, X - 1, Y + 1, TFEN_PW + 2, 1, "rgba(14,18,28,0.28)");         // 接地影
}

/* 东西走向的一段：地脚线 y、从 xa 到 xb。网面 + 上横杆 + **均匀立柱**。
   屏幕上这段围栏占 x[xa..xb] × y[y−H..y]，网面挂在横杆之下。 */
function tfRailEW(g, xa, xb, y) {
  const x0 = Math.round(xa), x1 = Math.round(xb), Y = Math.round(y);
  const ty = Y - TFEN_H + TFEN_RIN;                       // 上横杆顶
  tfMesh(g, x0, ty + TFEN_RLT, x1 - x0, Math.max(1, Y - ty - TFEN_RLT));
  px(g, x0, ty, x1 - x0, TFEN_RLT, TFEN_RAIL);            // 上横杆
  px(g, x0, ty, x1 - x0, 1, shade(TFEN_RAIL, 0.26));
  px(g, x0, ty + TFEN_RLT - 1, x1 - x0, 1, shade(TFEN_RAIL, -0.30));
  const n = Math.max(1, Math.round((x1 - x0) / TFEN_UW)); // ← 单元数（可执行定义）
  for (let k = 0; k <= n; k++) tfPost(g, x0 + ((x1 - x0) * k) / n, Y);
}

/* 南北走向的一段：地脚线 x、从 ya 到 yb。
   ⚠️ 屏幕上是**竖长条**：每一点都向上立 H ⇒ 占 x[X−PW/2..X+PW/2] × y[ya−H..yb]。
      上横杆因此是一条**竖线**（沿围栏走向、贴在最高处），不是横线。 */
function tfRailNS(g, x, ya, yb) {
  const X = Math.round(x) - TFEN_PW / 2, y0 = Math.round(ya), y1 = Math.round(yb);
  const ty = y0 - TFEN_H + TFEN_RIN;
  tfMesh(g, X, ty + TFEN_RLT, TFEN_PW, Math.max(1, y1 - ty - TFEN_RLT));
  px(g, X, ty, TFEN_PW, y1 - y0, TFEN_RAIL);              // 上横杆（竖线）
  px(g, X, ty, 1, y1 - y0, shade(TFEN_RAIL, 0.26));
  px(g, X + TFEN_PW - 1, ty, 1, y1 - y0, shade(TFEN_RAIL, -0.30));
  const n = Math.max(1, Math.round((y1 - y0) / TFEN_UW));
  for (let k = 0; k <= n; k++) tfPost(g, x, y0 + ((y1 - y0) * k) / n);
}

function tfFenceRect(g, R) {
  const x0 = R.x, x1 = R.x + R.w, y0 = R.y, y1 = R.y + R.h;
  tfRailEW(g, x0, x1, y0);            // 北（远）
  tfRailNS(g, x0, y0, y1);            // 西
  tfRailNS(g, x1, y0, y1);            // 东
  tfRailEW(g, x0, x1, y1);            // 南（近）—— 最后画，压住球场近端
}

function ellipseRing(g, cx, cy, r, col) {
  for (let a = 0; a < 360; a += 3) {
    const t = (a * Math.PI) / 180;
    px(g, cx + Math.cos(t) * r, cy + Math.sin(t) * r, 2, 2, col);
  }
}

function paintCourts(g, rng) {
  for (const e of CAMPUS) {
    if (e[1] !== "bball" && e[1] !== "tennis") continue;
    const R = zoneRect(e);
    /* ⚠️ 第七轮把两个"竖向"拆开了，别再合成一个：
       · uvert —— **单元怎么排**（区域细长就竖着码），自动判据，保持不动；
       · 球场长轴的朝向 —— 原来跟着 uvert 走。网球场是 547×225 的横长区域，
         uvert = false ⇒ 自动判成"球场长轴东西向"，与照片（长轴南北、球网左右横贯）
         正好差 90°。用户口径要"纵向排布"，所以网球场**钉成纵向**（见下面 cw/ch 那段）。
       篮球场一个字不动 —— 用户这轮只提了网球场，而且它的自动判据没被投诉过。 */
    const uvert = R.h > R.w * 2;
    const isB = e[1] === "bball";
    const n = uvert ? 3 : (isB ? 2 : 3);
    px(g, R.x, R.y, R.w, R.h, isB ? "#8a6a52" : TCOURT_APRON);    // 场地底色（压住校外纹理）

    for (let i = 0; i < n; i++) {
      let ux, uy, uw, uh;
      if (uvert) { ux = R.x; uy = R.y + (R.h * i) / n; uw = R.w; uh = R.h / n; }
      else       { ux = R.x + (R.w * i) / n; uy = R.y; uw = R.w / n; uh = R.h; }
      /* 单元缓冲铺装 */
      px(g, ux + 4, uy + 4, uw - 8, uh - 8, isB ? BCOURT_BASE : TCOURT_BASE);
      px(g, ux + 4, uy + 4, uw - 8, 3, "rgba(255,255,255,0.10)");
      px(g, ux + 4, uy + uh - 7, uw - 8, 3, "rgba(0,0,0,0.16)");

      /* 场地线：按标准比例居中放进单元 */
      const line = isB ? BCOURT_LINE : TCOURT_LINE;
      const ratio = isB ? 28 / 15 : 23.77 / 10.97;
      let cw, ch;
      if (isB) {
        /* 篮球场：原口径一字不动（长轴跟 uvert 走，clamp 照旧） */
        if (uvert) { ch = (uh - 28); cw = ch / ratio; }
        else       { cw = (uw - 22); ch = cw / ratio; }
        if (cw > uw - 16) { cw = uw - 16; ch = cw / ratio; }
        if (ch > uh - 16) { ch = uh - 16; cw = ch * ratio; }
      } else {
        /* 网球场：长轴**南北**（cvert=true）⇒ cw 是短边（东西）、ch 是长边。
           ⚠️ clamp 不能照抄上面那对 —— 上面是按"cw 是长边"写的，方向反了。
           实测本例：ch = 225.1−28 = 197.1、cw = 197.1/2.167 = 90.96，
           两个 clamp 都不会触发（uw−16 = 166、uh−16 = 209），但留着才对。 */
        ch = uh - 28; cw = ch / ratio;
        if (cw > uw - 16) { cw = uw - 16; ch = cw * ratio; }
        if (ch > uh - 16) { ch = uh - 16; cw = ch / ratio; }
      }
      const cx = Math.round(ux + uw / 2), cy = Math.round(uy + uh / 2);
      const x0 = Math.round(cx - cw / 2), y0 = Math.round(cy - ch / 2);
      rectLine(g, x0, y0, Math.round(cw), Math.round(ch), line);
      if (isB) {
        px(g, x0, cy - 1, Math.round(cw), 2, line);                    // 中线
        ellipseRing(g, cx, cy, Math.round(Math.min(cw, ch) * 0.16), line);
        const kw = Math.round(cw * 0.26), kh = Math.round(ch * 0.48);  // 罚球区
        rectLine(g, x0, cy - Math.round(kh / 2), kw, kh, line);
        rectLine(g, x0 + Math.round(cw) - kw, cy - Math.round(kh / 2), kw, kh, line);
      } else {
        /* 网球场地线 = 旧版**整体转 90°**（不是重新设计）：长轴南北 ⇒
           球网成了**横线**（东西向，左右横贯）、中央发球线成了竖线、
           发球区从左右两端挪到南北两端。照搬旧式的四个量，只换轴。 */
        px(g, x0, cy - 1, Math.round(cw), 2, line);                    // 球网（横贯）
        px(g, cx - 1, y0, 2, Math.round(ch), line);                    // 中央发球线
        rectLine(g, x0 + Math.round(cw * 0.22), y0,
                 Math.round(cw * 0.56), Math.round(ch * 0.18), line);
        rectLine(g, x0 + Math.round(cw * 0.22),
                 y0 + Math.round(ch) - Math.round(ch * 0.18),
                 Math.round(cw * 0.56), Math.round(ch * 0.18), line);
      }
      /* 场地投影（左上光源 → 右下） */
      px(g, ux + 4, uy + uh - 4, uw - 8, 4, "rgba(14,18,28,0.14)");
    }
    /* --- 围栏：整个网球场区一圈（用户口径："被围栏围起来的，围栏比较高，是绿色的"）---
       ⚠️ 必须排在单元循环**之后** —— 南边那道（离镜头最近）要压住球场近端，
          画在球场之前就会被自己的场地盖掉。（北边那道落在 R.y 之北 32px，
          本来就在场区之外，不会被球场碰到。） */
    if (!isB) tfFenceRect(g, R);
  }
}

/* =========================================================
   4. 自然与杂物
   ---------------------------------------------------------
   同样一条铁律：左上受光偏暖、右下背光偏冷；
   底部一律有方向性投影 + 接地最深的接触阴影。
   ========================================================= */

/* --- 4.1 树：树皮纹理 + 三层树冠（暗底 / 中层 / 亮顶） --- */
const LEAF_D = "#2c5622", LEAF_M = "#3d752d", LEAF_L = "#56983c";
function makeTree(seed) {
  const rng = makeRng(seed);
  const W = 70, H = 88;
  const c = mkCanvas(W, H), g = c.getContext("2d");
  const cx = W >> 1, gy = H - 5;
  const trunkH = 19 + ((rng() * 6) | 0);
  const tw = 7, tx = cx - (tw >> 1), ty = gy - trunkH;
  const bark = "#6b4a2f";

  shadowBlob(g, cx + 11, gy - 1, 23, 8, 0.32, 4);

  /* 树根外扩 + 树干 */
  px(g, tx - 2, gy - 4, tw + 4, 4, shade(bark, -0.14));
  px(g, tx, ty, tw, trunkH, bark);
  for (let i = 0; i < trunkH; i++) {
    px(g, tx, ty + i, 2, 1, shade(bark, 0.16));                    // 左缘受光
    px(g, tx + tw - 2, ty + i, 2, 1, shade(bark, -0.34));          // 右缘背光
  }
  for (let i = 0; i < trunkH; i += 4)                              // 树皮横向裂纹
    px(g, tx + 1 + ((rng() * 3) | 0), ty + i, 3 + ((rng() * 2) | 0), 1, shade(bark, -0.26));
  speckle(g, tx, ty, tw, trunkH, "rgba(0,0,0,0.22)", 14, rng);

  /* 树冠：按 y 排序，靠下的先画 → 上层的叶簇压住下层，形成层次 */
  const cyC = ty - 8, R = 26;
  const clist = [];
  for (let i = 0; i < 17; i++) {
    const a = (i / 17) * Math.PI * 2 + rng() * 0.36;
    const rr = R * (0.40 + rng() * 0.60);
    clist.push({ x: cx + Math.cos(a) * rr, y: cyC + Math.sin(a) * rr * 0.78, r: 7 + rng() * 5.5 });
  }
  clist.sort((p, q) => p.y - q.y);
  for (const cl of clist) {
    const k = clamp(0.22 - ((cl.x - cx) / R * 0.55 + (cl.y - cyC) / R * 0.85) * 0.34, -0.32, 0.34);
    circlePx(g, cl.x, cl.y, cl.r, shade(LEAF_M, k));
  }
  /* 右下暗部叶簇（背光） */
  for (let i = 0; i < 7; i++) {
    const a = 0.02 + rng() * 0.46;
    const rr = R * (0.42 + rng() * 0.52);
    circlePx(g, cx + Math.cos(a * Math.PI) * rr, cyC + Math.sin(a * Math.PI) * rr * 0.8,
      4 + rng() * 4, shade(LEAF_D, -rng() * 0.16));
  }
  /* 左上亮部叶簇（迎光） */
  for (let i = 0; i < 9; i++) {
    const a = 0.72 + rng() * 0.54;
    const rr = R * (0.34 + rng() * 0.52);
    circlePx(g, cx + Math.cos(a * Math.PI) * rr, cyC + Math.sin(a * Math.PI) * rr * 0.8,
      3.5 + rng() * 3.2, shade(LEAF_L, 0.10 + rng() * 0.22));
  }
  /* 叶面细颗粒：上亮下暗，避免大色块发死 */
  const bx = cx - R - 4, by = cyC - R - 4, bw = R * 2 + 8, bh = R * 2 + 8;
  speckle(g, bx, by, bw, bh, "rgba(0,0,0,0.16)", 130, rng);
  speckle(g, bx, by, bw, bh, "rgba(190,235,150,0.13)", 90, rng);

  /* 冠内镂空：几处深色缝隙，让轮廓不是一整块 */
  for (let i = 0; i < 6; i++) {
    const a = rng() * Math.PI * 2, rr = R * (0.30 + rng() * 0.60);
    px(g, cx + Math.cos(a) * rr, cyC + Math.sin(a) * rr * 0.8, 2 + ((rng() * 3) | 0), 2, "rgba(20,34,18,0.35)");
  }
  return { canvas: c, ax: cx, ay: gy };
}

/* --- 4.2 灌木：矮、密、贴地，作为草地上的填充 --- */
function makeBush(seed) {
  const rng = makeRng(seed);

    cl.push({ x: cx + (rng() - 0.5) * 20, y: gy - 4 - rng() * 9, r: 4 + rng() * 3.6 });
  }
  cl.sort((p, q) => p.y - q.y);
  for (const o of cl) {
    const k = clamp(0.20 - ((o.x - cx) / 14 * 0.55 + (o.y - gy + 8) / 14 * 0.85) * 0.32, -0.34, 0.30);
    circlePx(g, o.x, o.y, o.r, shade(LEAF_M, k - 0.06));

    circlePx(g, cx - 8 + rng() * 8, gy - 10 - rng() * 4, 2.2 + rng() * 2, shade(LEAF_L, 0.12 + rng() * 0.2));

/* 细线段 / 圆环：自行车等细长结构用得上 */
function seg(g, x0, y0, x1, y1, col, th) {
  g.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    g.fillRect(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), th, th);
  }
}
function ring(g, cx, cy, r, th, col) {
  g.fillStyle = col;
  for (let a = 0; a < 720; a++) {
    const ra = a * Math.PI / 360;
    for (let d = 0; d < th; d++)
      g.fillRect(Math.round(cx + Math.cos(ra) * (r - d)), Math.round(cy + Math.sin(ra) * (r - d) * 0.98), 1, 1);
  }
}

}

const PETALS = ["#d8564f", "#e8b43f", "#d97bb0", "#e4e2d4", "#b4632f"];

/* --- 4.7 自行车：细轮圈 + 车架 --- */
function makeBike(seed) {
