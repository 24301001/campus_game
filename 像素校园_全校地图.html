 *   `WR_CX/WR_CY` 是用户给的那两个数，其余（底座四边、栏杆圈四边、精灵画布框、
 *   锚点、碰撞盒、净空框）全部由它们现算 —— 铁律「派生量不许再存一份常量」
 *   （56_minghu.js 踩过：湖一缩小，贴着湖的旧坐标全废）。
 * ==========================================================================*/

const WR_CX = 2439, WR_CY = 1880;      // ← 用户指定的世界坐标（整组件的中心落地点）

/* --- 5.10.1 底座：22 宽 × 16 进深 × 26 高（世界像素）---
   ⚠️ 屏幕上"顶面"占的是**进深**那一段（高 16）、"南立面"占的是**高度**那一段（高 26）
      —— 这套 2.5D 的映射是 (x, y, z) → 屏幕 (x, y − z)，所以：
        顶面屏幕 y ∈ [yB − D − H, yB − H]、立面屏幕 y ∈ [yB − H, yB]。
      第一版把这两段写反了（顶面放在立面**下面**），画出来是一个倒扣的盒子。 */
const WR_PED_W = 22, WR_PED_D = 16, WR_PED_H = 26;
const WR_PED_BS = 8, WR_PED_O = 1;     // 下段台座高 / 每边外挑（原 16 / 2）
const WR_PED_X0 = WR_CX - WR_PED_W / 2;              // 2428
const WR_PED_BY = WR_CY + WR_PED_D / 2;              // 1888 = 底座南沿（落地线）
const WR_PED_YF = WR_PED_BY - WR_PED_H;              // 1862 = 顶面南沿 = 立面上沿
const WR_PED_YT = WR_PED_YF - WR_PED_D;              // 1846 = 顶面北沿

/* --- 5.10.2 栏杆圈：50 × 38、高 10（原 132 × 84、高 20）---
   一个"栏板单元"＝两根望柱 + 中间一块石栏板，单元宽 WR_RAIL_UW，首尾相接成整圈。
   透空 3px 是"栏杆"与"矮墙"在像素尺度上的唯一区别（同 37 段网球场围栏的 tbMesh）——
   折半后只剩 3px，不能再少，否则整圈读成一条实心矮墙。

   ⚠️ 为什么**不是**跟着雕像一起折半（66 × 42）——那是第一版折半后的值，出图一看
      还是个"围场"：底座外轮廓 24 × 18（含台座外挑），圈在 66 × 42 里两侧各空
      21px、南北各空 12px，空得比底座本身还宽。用户原话是**两句**：
      「围栏应该大幅度收缩」＋「整个雕像也需要大幅收缩到原来的一半左右」——
      「也」字说明这是两件事，前一句要的是**相对**收缩（缩小圈/底座之比），
      只按同一比例折半的话这个比值 2.75 一点没动，等于没修。
      ⇒ 取 50 × 38：圈/底座 = 2.08（原 2.75），四周各余 13 / 11px。
   ⚠️ 进深不能压到 34 以下：南道栏杆立在 world y = WR_RAIL_Y1，**屏幕底边就等于
      Y1**，而底座台座的屏幕底边是 WR_PED_BY = 1888 —— Y1 必须比它大一点，
      否则最后画的南道会盖掉底座台座的最下一行（D = 38 ⇒ Y1 = 1899 ⇒ 留 11px）。
   ⚠️ 宽/进深都取**偶数**：奇数会让 WR_RAIL_X0/X1/Y0/Y1 落半像素（硬边项目）。 */
const WR_RAIL_W = 50, WR_RAIL_D = 38, WR_RAIL_H = 10;
const WR_RAIL_UW = 15, WR_RAIL_PW = 2;               // 单元宽 / 望柱宽
const WR_RAIL_T = 2, WR_RAIL_M = 4, WR_RAIL_B = 1;   // 上枋厚 / 板身高 / 下枋厚（合计 7，下面 3 透空）
const WR_RAIL_X0 = WR_CX - WR_RAIL_W / 2;            // 2406
const WR_RAIL_X1 = WR_CX + WR_RAIL_W / 2;            // 2472
const WR_RAIL_Y0 = WR_CY - WR_RAIL_D / 2;            // 1859
const WR_RAIL_Y1 = WR_CY + WR_RAIL_D / 2;            // 1901 ← **精灵落地线**（最南）

/* --- 5.10.3 雕像本体：32 高，站在底座**顶面**上 ---
   ⚠️ 脚取顶面中部偏南（`WR_PED_YF − 7`）而不是正中：轴测里"站在台面正中"会读成
      "悬在台口上方"，往南压半个进深才像踩实了（与 53 段台座上的砧座同一个经验，
      第一版取 14/34 ≈ 41%，现在 7/16 ≈ 44%，同一比例）。 */
const WR_FIG_H = 32;
const WR_FIG_FOOT = WR_PED_YF - 7;                   // 1855

/* --- 5.10.4 调色 ---
   雕像取**青灰石**（照片是被风雨洗出来的青绿灰，不是纯黑铜）；底座与栏杆按用户口径
   取"石头灰色"，比雕像**暖**一档 —— 两者同色会糊成一坨（53 段齿轮环与铁砧分开一档
   亮度的同一条经验）。折半后**一个色号都没动**，只动了尺寸。 */
const WR_FIG_L = "#aeb8b4", WR_FIG_M = "#8e9a96", WR_FIG_D = "#6b7672";
const WR_FIG_PANT = "#7d8783", WR_FIG_SHOE = "#4e5754";
const WR_FIG_HAIR = "#5a6461", WR_FIG_FACE = "#b7c0bb", WR_HAT = "#49524f";
const WR_ST_L = "#c9c6be", WR_ST_TOP = "#b5b2aa", WR_ST_M = "#9c998f";
const WR_ST_D = "#7c7972", WR_ST_FACE = "#a8a59d", WR_ST_BASE = "#918e86";
const WR_ST_PLAQ = "#cdc9c0";

/* ============================================================================
 * 5.10.5 栏杆构件
 * ⚠️ 画法与 37 段网球场围栏**同源**（"沿一条线立柱子、高一律读成屏幕竖直"），
 *    但石栏杆有三层板（上枋/板身/下枋）要分层，而网是网格 —— 所以没共用函数。
 *    真正共用的是那条**投影口径**：世界点 (x, y, z) → 屏幕 (x, y − z)。
 * ==========================================================================*/

/* 一根望柱：立在地脚线 (x, y) 上的石方柱 + 外挑柱头 + 接地影
   ⚠️ 柱身只画 8 高（WR_RAIL_H − 2）而不是 −4：折半前柱头占 4、柱身占 16，
      折半后柱头 2、柱身 8 —— 那三个 `top + 4` 必须跟着变 `top + 2`，
      否则柱头顶到 4px 而柱身从 4 开始画、总高变成 12 ≠ WR_RAIL_H。
      这是本函数唯一的硬编码偏移，改 WR_RAIL_H 时必须回头看它。 */
function wrPost(g, x, y) {
  const X = Math.round(x) - WR_RAIL_PW / 2, Y = Math.round(y);
  const top = Y - WR_RAIL_H;
  px(g, X, top + 2, WR_RAIL_PW, WR_RAIL_H - 2, WR_ST_M);          // 柱身
  px(g, X, top + 2, 1, WR_RAIL_H - 2, WR_ST_L);                   // 西棱受光
  px(g, X + WR_RAIL_PW - 1, top + 2, 1, WR_RAIL_H - 2, WR_ST_D);  // 东棱背光
  px(g, X - 1, top, WR_RAIL_PW + 2, 2, WR_ST_L);                  // 柱头（外挑 1px）
  px(g, X - 1, top, WR_RAIL_PW + 2, 1, shade(WR_ST_L, 0.24));
  px(g, X - 1, Y + 1, WR_RAIL_PW + 2, 1, "rgba(14,18,28,0.30)");  // 接地影
}

/* 东西走向的一段：地脚线 y、从 xa 到 xb。
   屏幕矩形 x[xa..xb] × y[Y−H .. Y]，三层是**横条**。 */
function wrRailEW(g, xa, xb, y) {
  const x0 = Math.round(xa), x1 = Math.round(xb), Y = Math.round(y), w = x1 - x0;
  if (w <= 0) return;
  const L = [[WR_RAIL_H - WR_RAIL_T, WR_RAIL_T, WR_ST_L],                        // 上枋
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M, WR_RAIL_M, WR_ST_M],            // 板身
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M - WR_RAIL_B, WR_RAIL_B, WR_ST_D]]; // 下枋
  for (const [z, t, c] of L) px(g, x0, Y - z - t, w, Math.max(1, t), c);
  px(g, x0, Y - WR_RAIL_H, w, 1, shade(WR_ST_L, 0.24));            // 上枋顶棱
  px(g, x0, Y - WR_RAIL_H + WR_RAIL_T, w, 1, shade(WR_ST_M, -0.16));// 板身上棱
  /* 石板拼缝：**每单元正中一道**。原来写死 `x0 + 11; x += 11`（与 30px 的单元宽
     并不对齐）；折半后单元只有 15px，拼缝必须落在两柱之间才读得出"一块块石板"，
     所以改成从单元宽现算（半步起、整步走）。 */
  for (let x = x0 + (WR_RAIL_UW >> 1); x < x1 - 2; x += WR_RAIL_UW)
    px(g, x, Y - WR_RAIL_H + WR_RAIL_T, 1, WR_RAIL_M, shade(WR_ST_M, -0.16));
  const n = Math.max(1, Math.round(w / WR_RAIL_UW));
  for (let k = 0; k <= n; k++) wrPost(g, x0 + (w * k) / n, Y);
}

/* 南北走向的一段：地脚线 x、从 ya 到 yb。
   ⚠️ 屏幕上是**竖长条**，三层也是**竖条**（沿栏杆走向 = 屏幕竖直）——
      每层的屏幕高是 (yb−ya)+本层厚，起点 y0−z−t。写成"一个矩形往下切三层"是错的：
      那样北端 3px 之后就没有上枋了（第一次就写错了，出图才看见栏板缺半截）。 */
function wrRailNS(g, x, ya, yb) {
  const X = Math.round(x) - WR_RAIL_PW / 2, y0 = Math.round(ya), y1 = Math.round(yb);
  const len = y1 - y0;
  if (len <= 0) return;
  const L = [[WR_RAIL_H - WR_RAIL_T, WR_RAIL_T, WR_ST_L],
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M, WR_RAIL_M, WR_ST_M],
             [WR_RAIL_H - WR_RAIL_T - WR_RAIL_M - WR_RAIL_B, WR_RAIL_B, WR_ST_D]];
  for (const [z, t, c] of L) px(g, X, y0 - z - t, WR_RAIL_PW, len + t, c);
  px(g, X, y0 - WR_RAIL_H, WR_RAIL_PW, 1, shade(WR_ST_L, 0.24));
  px(g, X, y0 - WR_RAIL_H + WR_RAIL_T, WR_RAIL_PW, 1, shade(WR_ST_M, -0.16));
  const n = Math.max(1, Math.round(len / WR_RAIL_UW));
  for (let k = 0; k <= n; k++) wrPost(g, x, y0 + (len * k) / n);
}

/* ============================================================================
 * 5.10.6 底座（灰石方柱 + 下段外挑台座 + 正面铭牌）
 * ==========================================================================*/
function wrPedestal(g) {
  const x0 = WR_PED_X0, x1 = x0 + WR_PED_W, yT = WR_PED_YT, yF = WR_PED_YF, yB = WR_PED_BY;
  /* ① 顶面（22 × 16）：北棱受光、东棱背光（全局 SUN = (-0.60, -0.80) 在西北）。
        ⚠️ 折半后受光/背光棱由 2px 收成 1px —— 22 宽的面上再压 2px 棱就占掉 1/5。 */
  px(g, x0, yT, WR_PED_W, WR_PED_D, WR_ST_TOP);
  px(g, x0, yT, WR_PED_W, 1, shade(WR_ST_TOP, 0.28));
  px(g, x0, yT, 1, WR_PED_D, shade(WR_ST_TOP, 0.14));
  px(g, x1 - 1, yT, 1, WR_PED_D, shade(WR_ST_TOP, -0.20));
  px(g, x0, yF - 1, WR_PED_W, 1, shade(WR_ST_TOP, -0.26));        // 顶面南棱（与立面交界）
  /* ② 立面：上段整宽 22，高 H−BS = 18 */
  px(g, x0, yF, WR_PED_W, WR_PED_H - WR_PED_BS, WR_ST_FACE);
  px(g, x0, yF, 1, WR_PED_H - WR_PED_BS, shade(WR_ST_FACE, 0.16));
  px(g, x1 - 1, yF, 1, WR_PED_H - WR_PED_BS, shade(WR_ST_FACE, -0.20));
  /* ③ 下段台座：每边外挑 WR_PED_O，一整圈"更宽的底座"（照片里最下面那一圈） */
  px(g, x0 - WR_PED_O, yB - WR_PED_BS, WR_PED_W + WR_PED_O * 2, WR_PED_BS, WR_ST_BASE);
  px(g, x0 - WR_PED_O, yB - WR_PED_BS, WR_PED_W + WR_PED_O * 2, 1, shade(WR_ST_BASE, 0.26));
  px(g, x0 - WR_PED_O, yB - 1, WR_PED_W + WR_PED_O * 2, 1, shade(WR_ST_BASE, -0.26));
  /* ④ 正面铭牌：浅色方板（照片里立面上唯一的高光细节）。22 宽的立面上放 12 × 7，
        底边离台座沿还有 6px —— 折半前是 22×15 放 44 宽立面上、底边余 12，比例一致。 */
  const pw = 12, ph = 7, qx = WR_CX - pw / 2, qy = yF + 5;
  px(g, qx - 1, qy - 1, pw + 2, ph + 2, shade(WR_ST_FACE, -0.32));
  px(g, qx, qy, pw, ph, WR_ST_PLAQ);
  px(g, qx, qy, pw, 1, shade(WR_ST_PLAQ, 0.22));
  px(g, qx, qy + ph - 1, pw, 1, shade(WR_ST_PLAQ, -0.24));
  px(g, qx, qy, 1, ph, shade(WR_ST_PLAQ, 0.10));
  px(g, qx + pw - 1, qy, 1, ph, shade(WR_ST_PLAQ, -0.14));
  /* ⑤ 接地：底座那一圈最深 */
  contactBand(g, x0 - WR_PED_O + 1, x1 + WR_PED_O - 1, yB - 1, 2, 0.32);
}

/* ============================================================================
 * 5.10.7 雕像本体（站立挥手像）
 *   自上而下：脸 5（含发 2）/ 颈 1 / 躯干 12 / 裤 12 / 鞋 2 = 32。
 *   ⚠️ 挥手的是**右臂**（照片里在观众看来在**左边**）—— 本项目所有建筑精灵都画朝南
 *      立面、人物也一律面朝南，所以雕像的右手 = 屏幕左侧。**别画反**。
 * ==========================================================================*/
function wrFigure(g) {
  const cx = WR_CX, foot = WR_FIG_FOOT;
  const T = foot - WR_FIG_H;                 // 1823 头顶
  const faceB = T + 5;                       // 1828 下颌
  const neckB = T + 6;                       // 1829 肩线
  const torsoB = T + 18;                     // 1841 下摆
  /* ① 头：发 2 + 脸 3；两侧各 1px 侧发把脑袋从背景里"切"出来 */
  px(g, cx - 2, T, 4, 5, WR_FIG_FACE);
  px(g, cx - 2, T, 4, 2, WR_FIG_HAIR);
  px(g, cx - 3, T + 1, 1, 3, WR_FIG_HAIR);
  px(g, cx + 2, T + 1, 1, 3, WR_FIG_HAIR);
  px(g, cx - 1, faceB - 1, 2, 1, shade(WR_FIG_FACE, -0.22));       // 下颌影
  /* ② 颈（折半后只剩 1px —— 再薄就没了，再厚就顶掉一格躯干） */
  px(g, cx - 1, faceB, 2, 1, shade(WR_FIG_FACE, -0.16));
  /* ③ 躯干：**上下同宽 8**（用户口径 ⑤）—— 没有收分，直筒。 */
  px(g, cx - 4, neckB, 8, torsoB - neckB, WR_FIG_M);
  px(g, cx - 4, neckB, 1, torsoB - neckB, WR_FIG_L);               // 西侧受光
  px(g, cx + 3, neckB, 1, torsoB - neckB, WR_FIG_D);               // 东侧背光
  /* 翻领（两块浅色小方）+ 领口开缝 */
  px(g, cx - 3, neckB, 2, 3, WR_FIG_L);
  px(g, cx + 1, neckB, 2, 3, WR_FIG_L);
  px(g, cx - 1, neckB, 1, 4, shade(WR_FIG_M, -0.26));
  /* 门襟扣：中线一列 */
  for (let y = neckB + 5; y < torsoB - 2; y += 4) px(g, cx - 1, y, 1, 1, WR_FIG_D);
  /* 下摆两个口袋：折半后每个只剩 2 宽（原来 5 宽，8 宽的躯干上放不下两个 5） */
  px(g, cx - 4, torsoB - 6, 2, 3, shade(WR_FIG_M, -0.16));
  px(g, cx + 1, torsoB - 6, 2, 3, shade(WR_FIG_M, -0.16));
  px(g, cx - 4, torsoB - 6, 2, 1, WR_FIG_L);
  px(g, cx + 1, torsoB - 6, 2, 1, WR_FIG_L);
  px(g, cx - 4, torsoB - 1, 8, 1, shade(WR_FIG_M, -0.14));         // 下摆压暗
  /* ④ 裤 + 鞋（用户口径 ④⑤）：一整块 8 宽，**与躯干同宽**，中间只一道同色系
        明暗线当裤缝 —— 是明暗不是缝隙，背景不会从裆里透出来。 */
  const paw = foot - torsoB - 2;             // 裤长 12（留 2 给鞋）
  px(g, cx - 4, torsoB, 8, paw, WR_FIG_PANT);
  px(g, cx - 4, torsoB, 1, paw, shade(WR_FIG_PANT, 0.14));         // 西侧受光
  px(g, cx + 3, torsoB, 1, paw, shade(WR_FIG_PANT, -0.18));        // 东侧背光
  px(g, cx, torsoB, 1, paw, shade(WR_FIG_PANT, -0.10));            // 裤缝（明暗线）
  /* 鞋：同样一整块 8 宽 2 高，中间 1px 暗线分出左右脚 */
  px(g, cx - 4, foot - 2, 8, 2, WR_FIG_SHOE);
  px(g, cx - 4, foot - 2, 8, 1, shade(WR_FIG_SHOE, 0.24));
  px(g, cx, foot - 2, 1, 2, shade(WR_FIG_SHOE, -0.30));
  /* ⑤ 右臂（**屏幕左侧**）向外上举。用户口径 ①：
        臂长 5 步（原来 12）、指尖只高过头顶 4px（原来 18）；
        **手不单独画** —— 臂端直接收一个 3×3 的方块（与臂同宽），不向外突出。
        斜带用"每步 1px 横 / 2px 竖"的阶梯逼近，3px 宽的方带在像素尺度下
        比逐点 1px 更结实（后者会画成一条毛毛的虚线）。
        ⚠️ 起笔 x 取 `cx − 5` 而不是 `cx − 4`：块是 (X−1) 起、3 宽，取 cx−4 时
           最右一列正好落在 cx−3，与**左侧鬓发同一列** ⇒ 斜带读成"从脑袋上长出来"。
           往左挪 1px 后，块右缘 cx−4 = 躯干左缘，仍与肩相连但离开了头。 */
  for (let i = 0; i <= 4; i++) {
    const X = cx - 5 - i, Y = neckB + 1 - i * 2;
    px(g, X - 1, Y - 1, 3, 3, WR_FIG_M);
    px(g, X - 1, Y - 1, 1, 3, WR_FIG_L);
    px(g, X + 1, Y - 1, 1, 3, WR_FIG_D);
  }
  px(g, cx - 11, T - 4, 3, 3, WR_FIG_FACE);                        // 手（3×3，与臂同宽）
  /* ⑥ 左臂（屏幕右侧）垂在身侧，手里一顶帽子（照片里胯边那块深色） */
  px(g, cx + 4, neckB + 1, 2, 9, WR_FIG_M);
  px(g, cx + 4, neckB + 1, 1, 9, WR_FIG_L);
  px(g, cx + 5, neckB + 2, 1, 8, WR_FIG_D);
  px(g, cx + 3, neckB + 9, 4, 2, WR_HAT);                          // 帽子（比臂宽 1px/侧）
  px(g, cx + 3, neckB + 9, 4, 1, shade(WR_HAT, 0.26));
  /* ⑦ 站在台面上的接地：脚下一道深带（不是投影 —— 投影落在台面上会读成"影子悬空"） */
  contactBand(g, cx - 4, cx + 4, foot - 1, 2, 0.22);
}

/* ============================================================================
 * 5.10.8 雕像精灵
 *   ⚠️ canvas 越界是**静默**的 —— 手指尖或柱头会被裁掉一条边还不报错
 *      （53 段的 DIA_RING_* 同理）。所以这个框**一律从上面那些尺寸派生**，
 *      不再各写一个绝对数字（第一版是一排手量的整数 2366/1744/146/186）：
 *        西 / 东 = 栏杆圈外 4px（柱头外挑 1 + 余量）
 *        北      = 头顶再往上 8（举起的右手要 6）
 *        南      = 底座落地线 + 26（方向性投影 SHY=21 + 余量）
 *   ⚠️ 绘制次序 = 遮挡关系：北栏杆（最远）→ 东西栏杆 → 底座+雕像 → 南栏杆（最近）。
 *      北栏杆的中间段会被后画的底座盖住，**这正是对的**（底座在圈内、离镜头更近）。
 * ==========================================================================*/
const WR_CV_X0 = WR_RAIL_X0 - 4;                       // 2402
const WR_CV_X1 = WR_RAIL_X1 + 20;                      // 2492（东侧容下投影 SHX=16）
const WR_CV_Y0 = WR_FIG_FOOT - WR_FIG_H - 8;           // 1815（头顶 1823 − 8）
const WR_CV_Y1 = WR_PED_BY + 26;                       // 1914（南侧容下投影 SHY=21）
const WR_CV_W = WR_CV_X1 - WR_CV_X0;                   // 90
const WR_CV_H = WR_CV_Y1 - WR_CV_Y0;                   // 99

function wrStand() {
  const c = mkCanvas(WR_CV_W, WR_CV_H), g = c.getContext("2d");
  /* ⚠️ 用 canvas 变换把画布原点挪到世界 (WR_CV_X0, WR_CV_Y0)，于是下面每个绘图函数
     都直接吃**世界坐标**（等价于 53 段到处包一层的 diaX/diaY，只是少写几百个括号）。
     能这么干的前提：px / poly / shadowQuad / contactBand 全都只走 fillRect 路径 ——
     已核实（_syn.js:180-195）。哪天有工具改成 getImageData / 或读 g.canvas 的像素，
     这条就失效，那时必须退回逐个坐标转换。 */
  g.translate(-WR_CV_X0, -WR_CV_Y0);
  /* ⚠️ SHX / SHY 是**函数内现算**的两个局部量，**不是**全局常量 —— 30_building.js:83 与
     36_library.js:472 都是这个写法，全校没有第二份。第一版本段直接写了 `SHX, SHY`
     ⇒ 加载期 `ReferenceError: SHX is not defined`（那时 props 已装到 67 件）
     ⇒ 整页 JS 死、雕像根本没进 props，而 `_propview.py` 只会报一句
     `no prop tag weiren`，看不出是页面死了（三套自动验收同样全绿）。
     SUN 定义在 10_const.js（最前），本段顶层读它是安全的。 */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  /* 方向性投影（SUN 在西北 ⇒ 影子朝右下）：只给底座投，栏杆投了会把草地糊脏 */
  shadowQuad(g, WR_PED_X0 + 2, WR_PED_BY - 9, WR_PED_X0 + WR_PED_W - 2, WR_PED_BY,
             SHX, SHY, 0.26, 4);
  wrRailEW(g, WR_RAIL_X0, WR_RAIL_X1, WR_RAIL_Y0);       // 北（远）
  wrRailNS(g, WR_RAIL_X0, WR_RAIL_Y0, WR_RAIL_Y1);       // 西
  wrRailNS(g, WR_RAIL_X1, WR_RAIL_Y0, WR_RAIL_Y1);       // 东
  wrPedestal(g);
  wrFigure(g);
  wrRailEW(g, WR_RAIL_X0, WR_RAIL_X1, WR_RAIL_Y1);       // 南（近）
  /* ⚠️ 锚点是**画布坐标**（不受 translate 影响，addProp 认的就是这个）*/
  return { canvas: c, ax: WR_CX - WR_CV_X0, ay: WR_RAIL_Y1 - WR_CV_Y0 };
}

/* --- 5.10.9 净空：把雕像圈周围的草树清掉 ---
   散射与规则树阵各摆各的，这块草坪上本来就有柏树 / 樱花 / 灌木（实测散点落在
   圈内与圈边），不清理就是"栏杆从树里长出来"。
   净空框 = **精灵画布框（WR_CV_*）四边各外扩 8** —— 折半前是一排手量的
   `栏杆圈 ± 32/16`（196×132）；改成从画布框派生有两条好处：
     ① 整个组件再缩再长，净空自己跟上（第一版的绝对数字正是"上一轮改尺寸忘了改它"
        那一类地雷）；
     ② 判据对的是**画出来的东西**（画布框），不是"圈多大"这个间接量 ——
        树只要可能压到任何一笔（包括举起来的那只手）就得清掉。
   框本身比第一版小得多（106×115 vs 196×132 = 少 54%），落在框外的树自然就多了。
   ⚠️ 必须排在 §6.6c 的 clearPropTreeClash() **之后**（先跑会改它的保留集，
      clashDropped 的计数跟着变，验收数字就对不上了 —— 与 §5.2.8/§5.3.10 同款约束）。 */
const WR_CLR = { x: WR_CV_X0 - 8, y: WR_CV_Y0 - 8,
                 w: WR_CV_W + 16, h: WR_CV_H + 16 };
function clearWrClearance() {
  const C = WR_CLR, cx1 = C.x + C.w, cy1 = C.y + C.h;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* 雕像自己保留；宽 > 110 的当楼处理（这一片没有楼，保险起见 —— 同 §5.3.10） */
    if (p.tag === "weiren" || p.img.width > 110) { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    if (x0 < cx1 && x0 + p.img.width > C.x && y0 < cy1 && y0 + p.img.height > C.y) {
      dropped++;
      continue;
    }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

};

/* --- 5.11.2 几何：宽锚现算，一处写死 -----------------------------------------
   `sc`（世界像素/英寸）只从**外框宽**来 —— 正面图是宽锚：精灵宽由 CAMPUS 的
   footprint 定（371），立面高按同一比例现算，**不按 styleOf 的 2 层**（那样只有
   68 行，立面会被压成一条）。反解 roofT 用的仍是 30 段的画布高公式，与 59 段同法。 */
function kxGeo(c) {
  const wallH0 = KX_FLOORS * FLOOR_H;
  const roofT  = c.height - KX_PADT - wallH0 - KX_PADB;   // 反解，不存第二份
  const eaveY  = KX_PADT + roofT;                         // 檐下沿 = 墙顶
  const w      = c.width - KX_PADX * 2;                   // 立面外框宽 = 371
  const sc     = w / KX_EW;                               // 每英寸多少世界像素
  const U      = (v) => Math.round(v * sc);
  const FH     = U(KX_EH);                                // 立面高 = 117
  const y0     = eaveY;                                   // 立面第 0 行（檐口板顶）
  const G = {
    roofT: roofT, wallH: wallH0, eaveY: eaveY, y0: y0,
    x0: KX_PADX, x1: KX_PADX + w, w: w, sc: sc, U: U,
    FH: FH, slabH: U(KX_SLAB_H), soff: Math.max(3, Math.round(FH * KX_SOFF_R)),
    baseY: y0 + FH, H: y0 + FH + KX_PADB,
    wallTop: y0 + U(KX_EL.wing.y),                        // 白瓷砖墙顶行（= 檐口板底）
    colTop: y0 + FH - U(KX_EL.colH),                      // 柱顶行（两柱同底线，归一）
    /* 英寸 → 画布；矩形一律**两端各取整再相减**（不许把宽单独取整 —— 相邻两块
       会因此差 1px 露缝，见 30 段的教训）。 */
    px: (ix) => KX_PADX + Math.round(ix * sc),
    py: (iy) => y0 + Math.round(iy * sc),
    rect: (o) => [KX_PADX + Math.round(o.x * sc), y0 + Math.round(o.y * sc),
                  Math.round((o.x + o.w) * sc) - Math.round(o.x * sc),
                  Math.round((o.y + o.h) * sc) - Math.round(o.y * sc)]
  };
  /* 几何闸：30 段的 PADT/画布高公式一动，反解出来的 roofT 立刻出界 ——
     出图时是一栋比例崩掉的楼，而三套自动验收都不看画面。 */
  if (roofT < 20 || roofT > 190)
    console.warn("61_kxht: 反解出的 roofT=%d 出了 30 段的 clamp 区间[20,190]，" +
                 "画布高 %d 与 PADT/wallH/SHY 公式对不上了", roofT, c.height);
  /* 字体闸：金字点阵的字高必须 ≈ 檐口板高的 KX_GLYPH_R —— 换源图、改檐口板高，
     这一条会先响，而不是等出图才发现字太大太小。 */
  const gh = KX_CHARS[0][2];
  let tw = KX_GAP * (KX_CHARS.length - 1);
  for (const e of KX_CHARS) tw += e[1];
  if (Math.abs(gh - G.slabH * KX_GLYPH_R) > 1 || tw > w * 0.5)
    console.warn("61_kxht: 金字点阵 %d 行 / 总宽 %d 与檐口板 %d 行对不上" +
                 "（应 ≈%d 行）—— 重跑 _build/_kxfont.py？",
                 gh, tw, G.slabH, Math.round(G.slabH * KX_GLYPH_R));
  return G;
}

/* --- 5.11.3 金字：逐点 1bit 掩膜 + 三色浮雕笔 ---------------------------------
   与 `_kxfont.py` 的 brush() **逐条同构**（probe 图就是按这支笔出的，观感判据才有效）：
   上缘（该点上方为空）用亮金、其余用主金、下缘再压一列暗金。 */
function kxGlyph(g, b64, nw, nh, x, y) {
  const s = atob(b64), bit = (i) => (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  for (let j = 0; j < nh; j++) {
    for (let i = 0; i < nw; i++) {
      if (!bit(j * nw + i)) continue;
      const top = j === 0 || !bit((j - 1) * nw + i);
      px(g, x + i, y + j, 1, 1, top ? KX_PAL.GOLD_L : KX_PAL.GOLD);
      if (j + 1 < nh && !bit((j + 1) * nw + i)) px(g, x + i, y + j + 1, 1, 1, KX_PAL.GOLD_D);
    }
  }
}
/* 檐口带上的「科學會堂」：总宽按 KX_CHARS 的逐字宽**现算**居中（照 36 段 libPlaque），
   **不写死坐标** —— 换源图/改字高只重跑 _kxfont.py，这里跟着走。 */
function kxPlaque(g, G) {
  let tw = KX_GAP * (KX_CHARS.length - 1);
  for (const e of KX_CHARS) tw += e[1];
  const nh = KX_CHARS[0][2];
  let x = G.x0 + Math.round((G.w - tw) / 2);
  const y = G.y0 + Math.round((G.slabH - nh) / 2);
  for (const e of KX_CHARS) {
    kxGlyph(g, e[0], e[1], e[2], x, y);
    x += e[1] + KX_GAP;
  }
}

/* --- 5.11.4 平屋顶：把 30 段那层屋面**整片盖成平的石平台** --------------------
   用户口径「改平屋顶」。30 段的屋面本来就是"板面 + 一圈外沿 + 檐口投影线"的画法，
   只是它画的是一栋**坡瓦顶**（`pal.roof` 的褐色 + 3 道分坡脊线 + 屋面设备）。
   这里把同一批矩形的**颜色**换成石色系、把那 3 道脊线换成**正交分仓缝**，
   设备照画（自带的灰色版）。⇒ 一栋平屋顶的楼，而不是"顶着坡顶的会堂"。
   ⚠️ 矩形与 30 段**逐字同值**（x0−3 / w+6 / PADT / roofT / PADT+2 高 roofT−5），
      所以女儿墙外沿那 3px 出挑、檐口投影线那 2 行都与其它楼同规，不另立一套。 */
function kxRoof(g, G, C) {
  const x = G.x0 - 3, wd = G.w + 6;
  px(g, x, KX_PADT, wd, G.roofT, C.ROOF_D);                   // 女儿墙外沿
  px(g, G.x0, KX_PADT + 2, G.w, G.roofT - 5, C.ROOF);         // 平台面
  px(g, G.x0, KX_PADT + 2, G.w, 1, C.ROOF_L);                  // 北缘一条亮线
  px(g, G.x0, KX_PADT + 2, 2, G.roofT - 5, C.ROOF_L);          // 左内侧受光
  px(g, G.x0 + G.w - 2, KX_PADT + 2, 2, G.roofT - 5, C.ROOF_R);// 右内侧背光
  px(g, G.x0 + 3, KX_PADT + 2 + Math.round((G.roofT - 5) * 0.46), G.w - 6, 1, C.ROOF_J);
  for (let u = 1; u <= 2; u++)                                 // 两道纵向分仓缝
    px(g, G.x0 + Math.round(G.w * u / 3), KX_PADT + 4, 1, G.roofT - 9, C.ROOF_J);
  const rq = makeRng(6151);                                    // 屋面设备：三台（局部 rng）
  for (let i = 0; i < 3; i++) {
    const bw = 26 + Math.round(rq() * 16), bh = 16 + Math.round(rq() * 10);
    const bx = G.x0 + 14 + Math.round(rq() * Math.max(1, G.w - 28 - bw));
    const by = KX_PADT + 12 + Math.round(rq() * Math.max(1, G.roofT - 26 - bh));
    px(g, bx, by, bw, bh, C.EQ);
    px(g, bx, by, bw, 2, C.EQ_L);
    px(g, bx + bw - 3, by, 3, bh, C.EQ_D);
    px(g, bx, by + bh - 2, bw, 2, C.EQ_D);
  }
  speckle(g, G.x0 + 4, KX_PADT + 7, G.w - 8, G.roofT - 12, "rgba(255,255,255,0.05)", (G.w / 3) | 0, makeRng(6152));
  speckle(g, G.x0 + 4, KX_PADT + 7, G.w - 8, G.roofT - 12, "rgba(0,0,0,0.07)", (G.w / 4) | 0, makeRng(6153));
  px(g, x, KX_PADT + G.roofT - 1, wd, 2, C.ROOF_P);            // 檐口投影线（同 30 段）
}

/* --- 5.11.5 檐口板：整条满宽，金字落在板上（板底那排筒灯**移到了檐下投影带**：
   实拍里筒灯是装在**出挑板的底面**上的，从上方看不见板底，能看见的是它投在墙顶的
   那条暗带 —— 画在板面上会读成一排灰脏点，正是第一轮出图里那一处。 */
function kxSlab(g, G, C) {
  const r = G.rect(KX_EL.slab);
  px(g, r[0], r[1], r[2], r[3], C.SLAB);
  px(g, r[0], r[1], r[2], 1, C.SLAB_L);                       // 板顶受光（光源左上）
  px(g, r[0], r[1], 2, r[3], C.SLAB_L);                       // 左端受光
  px(g, r[0] + r[2] - 2, r[1], 2, r[3], C.SLAB_D);            // 右端背光
  px(g, r[0], r[1] + r[3] - 2, r[2], 2, C.SLAB_D);            // 板下沿压暗
  for (let k = 1; k <= 2; k++)                                 // 石材横缝（两道，位置现算）
    px(g, r[0] + 2, r[1] + Math.round(r[3] * k / 3), r[2] - 4, 1, KX_PAL.JOINT);
  speckle(g, r[0] + 3, r[1] + 4, r[2] - 6, r[3] - 8, "rgba(255,255,255,0.05)", (r[2] / 3) | 0, makeRng(6111));
  speckle(g, r[0] + 3, r[1] + 4, r[2] - 6, r[3] - 8, "rgba(0,0,0,0.07)", (r[2] / 4) | 0, makeRng(6112));
  kxPlaque(g, G);
}

/* --- 5.11.6 檐下投影带：出挑的板在墙顶上压出来的一条深色带（渐隐）+ 筒灯暗点 ----
   ⚠️ 必须画在**墙之后** —— 正面图里两翼顶是抵着檐口板底的（1.3667 vs 1.3576，
      差 0.009 英寸 = 0.3px），中间没有缝；这条带只能在墙顶那几行上。 */
function kxSoffit(g, G, C) {
  const r = G.rect(KX_EL.slab);
  for (let i = 0; i < G.soff; i++)
    px(g, r[0], G.wallTop + i, r[2], 1,
       "rgba(14,18,28," + (0.46 * (1 - i / G.soff)).toFixed(3) + ")");
  const n = Math.max(3, Math.round(r[2] / 46));                // 板底筒灯（点数现算）
  for (let i = 0; i < n; i++)
    px(g, r[0] + Math.round(r[2] * (i + 0.5) / n) - 1, G.wallTop, 3, 2, KX_PAL.LAMP);
}

/* --- 5.11.7 白瓷砖墙：**一整片**（两翼之间不留缝） ---------------------------
   正面图里两翼是两块（12..75 / 292..355），中间那条 75..106 是作者漏画的墙 ——
   实拍里玻璃就是嵌在整片白瓷砖墙里的，所以这里整片铺，幕墙再压上去；
   幕墙左右**不等内缩**（左 31 / 右 20）照 ppt 原样保留（用户口径：忠于正面图，
   不做居中对称）。 */
function kxWall(g, G, C) {
  const r = G.rect(KX_EL.wing);
  px(g, r[0], r[1], r[2], G.baseY - r[1], C.TILE);
  for (let y = r[1] + KX_TILE; y < G.baseY; y += KX_TILE)      // 缝相位由 x0/y0 定死
    px(g, r[0], y, r[2], 1, KX_PAL.JOINT);
  for (let x = r[0] + KX_TILE; x < r[0] + r[2]; x += KX_TILE)
    px(g, x, r[1], 1, G.baseY - r[1], KX_PAL.JOINT);
  speckle(g, r[0], r[1], r[2], G.baseY - r[1], "rgba(255,255,255,0.05)", (r[2] / 3) | 0, makeRng(6121));
  speckle(g, r[0], r[1], r[2], G.baseY - r[1], "rgba(0,0,0,0.06)", (r[2] / 2) | 0, makeRng(6122));
  px(g, r[0], r[1], r[2], 1, C.TILE_T);
  px(g, r[0], r[1], 2, G.baseY - r[1], C.TILE_L);              // 左棱受光
  px(g, r[0] + r[2] - 3, r[1], 3, G.baseY - r[1], C.TILE_R);   // 右棱背光
}

/* --- 5.11.8 玻璃幕墙 + 三组双扇门 -------------------------------------------
   实拍：近黑玻璃，映着门前的树，下面三组双扇门（各有把手），门内一点暖光。 */
function kxGlass(g, G, C) {
  const r = G.rect(KX_EL.glass), gx0 = r[0], gy0 = r[1], gw = r[2], gh = r[3];
  const gy1 = gy0 + gh;
  px(g, gx0 - 2, gy0 - 2, gw + 4, gh + 4, C.GLASS_F);          // 外框（凹进去一块）
  px(g, gx0, gy0, gw, gh, C.GLASS);
  px(g, gx0, gy0, gw, 2, "rgba(8,10,16,0.55)");                // 顶内侧阴影
  px(g, gx0, gy0, 2, gh, "rgba(8,10,16,0.40)");                // 左内侧阴影（光源左上）
  /* 映进来的树影 / 天光：斜向的浅色块（贴在玻璃内，不越界） */
  px(g, gx0 + Math.round(gw * 0.08), gy0 + Math.round(gh * 0.30), Math.round(gw * 0.20), gh - Math.round(gh * 0.30), KX_PAL.MIRROR);
  px(g, gx0 + Math.round(gw * 0.40), gy0 + Math.round(gh * 0.18), Math.round(gw * 0.16), gh - Math.round(gh * 0.18), KX_PAL.MIRROR);
  px(g, gx0 + Math.round(gw * 0.74), gy0 + Math.round(gh * 0.36), Math.round(gw * 0.18), gh - Math.round(gh * 0.36), KX_PAL.MIRROR);
  px(g, gx0 + 2, gy0 + 2, gw - 4, Math.round(gh * 0.16), KX_PAL.SKY);
  for (let i = 1; i <= 4; i++)                                 // 竖梃（位置现算）
    px(g, gx0 + Math.round(gw * i / 5), gy0, 1, gh, C.GLASS_F);
  px(g, gx0, gy0 + Math.round(gh * 0.30), gw, 1, C.GLASS_F);   // 一道横档
  /* 三组双扇门：门组中线按玻璃宽现算，不写死 */
  const dh = Math.round(gh * 0.54), dy = gy1 - dh;
  const dwg = Math.round(gw * 0.155);
  for (let k = 0; k < 3; k++) {
    const cx = gx0 + Math.round(gw * (0.22 + 0.28 * k));
    const x0 = cx - Math.round(dwg / 2);
    px(g, x0, dy, dwg, dh, C.DOOR);
    px(g, x0, dy, dwg, 1, "rgba(8,10,16,0.55)");
    px(g, cx - 1, dy, 2, dh, C.GLASS_F);                                 // 中缝
    px(g, x0 + 2, dy + 2, Math.round(dwg / 2) - 3, dh - 4, KX_PAL.LIT);  // 左扇暖光
    px(g, cx + 1, dy + 2, Math.round(dwg / 2) - 3, dh - 4, KX_PAL.LIT);  // 右扇暖光
    px(g, cx - 3, dy + Math.round(dh * 0.42), 2, 4, KX_PAL.HANDLE);      // 把手
    px(g, cx + 2, dy + Math.round(dh * 0.42), 2, 4, KX_PAL.HANDLE);
    px(g, x0 + 2, dy + 2, dwg - 4, 1, "rgba(226,236,244,0.10)");         // 门楣一道反光
  }
}

/* --- 5.11.9 台阶：中央 6 级 + 两侧三角阶梯（**逐级台阶剖面**，不是光滑斜边） ----
   笔法照 55 段 gymStair / 36 段 libStair：每级 **踏步鼻受光 1 行 / 级面 1 行 /
   级间投影 1 行**，逐级微色差，免得整跑读成一块板。
   用户口径：「ppt 左右的三角形和门下边的矩形都是阶梯」—— 中央矩形 6 级、
   两侧三角各 6 级，级数以 KX_STEPS 为准（同一支）。 */
function kxStairs(g, G, C) {
  const r = G.rect(KX_EL.step);
  const yTop = G.py(KX_EL.stairY), yBot = G.baseY;
  for (let i = 0; i < KX_STEPS; i++) {
    const ya = yTop + Math.round((yBot - yTop) * i / KX_STEPS);
    const yb = yTop + Math.round((yBot - yTop) * (i + 1) / KX_STEPS);
    px(g, r[0], ya, r[2], yb - ya, i % 2 ? C.ST_A : C.ST_B);
    px(g, r[0], ya, r[2], 1, C.ST_T);
    px(g, r[0], yb - 1, r[2], 1, KX_PAL.SEAM);
  }
  px(g, r[0] - 1, yTop, 1, yBot - yTop, C.ST_S);               // 两侧石帮
  px(g, r[0] + r[2], yTop, 1, yBot - yTop, C.ST_S);
  /* 两侧三角阶梯：外缘沿斜边逐级收、内缘贴柱 —— 每级是一块**水平错台** */
  for (const left of [true, false]) {
    const E = left ? KX_EL.triL : KX_EL.triR;
    const xIn  = left ? G.px(E.x + E.w) : G.px(E.x);          // 贴柱那一端（高）
    const xOut = left ? G.px(E.x)       : G.px(E.x + E.w);    // 落地那一端（低）
    for (let i = 0; i < KX_STEPS; i++) {
      const ya = yTop + Math.round((yBot - yTop) * i / KX_STEPS);
      const yb = yTop + Math.round((yBot - yTop) * (i + 1) / KX_STEPS);
      const xe = Math.round(xIn + (xOut - xIn) * (i + 1) / KX_STEPS);
      const a = Math.min(xIn, xe), b = Math.max(xIn, xe);
      px(g, a, ya, b - a, yb - ya, i % 2 ? C.ST_A : C.ST_B);
      px(g, a, ya, b - a, 1, C.ST_T);                          // 踏步鼻
      px(g, a, yb - 1, b - a, 1, KX_PAL.SEAM);                 // 级间投影
      px(g, left ? a : b - 1, ya, 1, yb - ya, C.ST_S);         // 外端那道踢面棱
    }
  }
}

/* --- 5.11.10 花盆柱 + 半圆盆 + 盆里那颗蓝绿半球 -------------------------------
   ⚠️ 盆底 = 柱顶、盆口 = 圆心行（见 KX_EL 下面那段注释）。 */
function kxPot(g, G, C) {
  const R  = G.U(KX_EL.pot.r);                                 // 外半径
  const RI = Math.max(2, G.U(KX_EL.pot.r - KX_EL.pot.t));      // 内半径（盆壁那一圈）
  for (const E of [KX_EL.colL, KX_EL.colR]) {
    const cx0 = G.px(E.x), cx1 = G.px(E.x + E.w), cw = cx1 - cx0;
    const cx = cx0 + Math.round(cw / 2);
    /* 柱身：白瓷砖同规 + 左棱受光 / 右棱背光 + 柱脚压暗 */
    px(g, cx0, G.colTop, cw, G.baseY - G.colTop, C.TILE);
    for (let x = cx0 + KX_TILE; x < cx1; x += KX_TILE)
      px(g, x, G.colTop, 1, G.baseY - G.colTop, KX_PAL.JOINT);
    px(g, cx0, G.colTop, cw, 2, C.COL_T);                      // 柱顶面
    px(g, cx0, G.colTop, 2, G.baseY - G.colTop, C.COL_L);
    px(g, cx1 - 3, G.colTop, 3, G.baseY - G.colTop, C.COL_R);
    px(g, cx0, G.baseY - 3, cw, 3, C.COL_F);                   // 柱脚
    /* 盆：下半圆实心（盆口行 = 圆心行）。实拍是一只**浅白石盆**，从上方看几乎见不到
       土 —— 第一轮把整个内径都涂成暗色，出图里读成"一只空的黑盆"，所以盆内只留
       紧贴盆口的两行暗缝，其余全是盆体。 */
    const rimY = G.colTop - R;
    for (let dy = 0; dy <= R; dy++) {
      const w = Math.round(Math.sqrt(R * R - dy * dy));
      px(g, cx - w, rimY + dy, w * 2 + 1, 1, dy < 2 ? C.POT : C.POT_D);
    }
    const RS = RI + 1;                                         // 土面比盆口内径略宽（压在盆沿下）
    for (let dy = 1; dy <= 2; dy++) {
      const w = Math.round(Math.sqrt(RS * RS - dy * dy));
      px(g, cx - w, rimY + dy, w * 2 + 1, 1, C.POT_IN);
    }
    /* 植株：上半圆（半径 RI+1 ⇒ 盆沿上探出一点）。光照从上 ⇒ **上面亮、根部暗**：
       第一轮把两档弄反了（顶上一圈暗绿、根部一圈亮青），出图里那颗半球是"倒扣"的。
       半径的竖直半轴取 RI+0.7（略大于横向）⇒ 顶部不会收成一根 1px 的尖刺。 */
    const RH = RI + 1, RV = RI + 0.7;
    for (let dy = 0; dy <= RI; dy++) {
      const w = Math.round(RH * Math.sqrt(Math.max(0, 1 - (dy / RV) * (dy / RV))));
      px(g, cx - w, rimY - dy, w * 2 + 1, 1,
         dy > RI * 0.72 ? KX_PAL.LEAF_L : (dy < 3 ? KX_PAL.LEAF_D : KX_PAL.LEAF));
    }
    px(g, cx - RH + 2, rimY - RI + 1, 4, 3, KX_PAL.LEAF_L);    // 左上一点高光
    for (let dy = Math.round(RI * 0.28); dy <= Math.round(RI * 0.86); dy++) {
      const w = Math.round(RH * Math.sqrt(Math.max(0, 1 - (dy / RV) * (dy / RV))));
      px(g, cx - w, rimY - dy, 2, 1, KX_PAL.LEAF_L);           // 受光侧沿轮廓提一档
    }
    speckle(g, cx - RH, rimY - RI, RH * 2, RI, "rgba(255,255,255,0.07)", 5, makeRng(6131));
    /* 盆沿（下半圆环，照 ppt 的空心弧：R 与 R−t 之间那一圈）—— **最后画**，
       压在植株根部上 ⇒ 读起来才是"花长在盆里"，而不是"盆上飘着个球"。
       环的左半受光、右半背光（光源左上），最外一圈再压一档暗棱 ——
       盆与脚下的白瓷砖墙**同色系**，没有这圈棱就分不出来（第一轮出图那只盆
       之所以"看不见"，就是盆体只比墙亮 0.1 档、又没有外棱）。 */
    for (let dy = 0; dy <= R; dy++) {
      const wo = Math.round(Math.sqrt(R * R - dy * dy));
      const wi = dy <= RI ? Math.round(Math.sqrt(RI * RI - dy * dy)) : -1;
      if (wi < 0) { px(g, cx - wo, rimY + dy, wo * 2 + 1, 1, C.POT); continue; }
      px(g, cx - wo, rimY + dy, wo - wi, 1, C.POT_L);
      px(g, cx + wi, rimY + dy, wo - wi, 1, C.POT_R);
    }
    for (let dy = 0; dy <= R; dy++) {                          // 外棱一圈
      const wo = Math.round(Math.sqrt(R * R - dy * dy));
      px(g, cx - wo, rimY + dy, 1, 1, C.POT_E);
      px(g, cx + wo, rimY + dy, 1, 1, C.POT_E);
    }
    px(g, cx - R, rimY, R * 2 + 1, 1, C.POT_L);                // 盆口平顶受光
  }
}

/* --- 5.11.11 立面总装（只在**新画布**上画，不 clearRect） --------------------
   次序即遮挡：平屋顶（含檐口投影线）→ 檐口板 → 白瓷砖墙 → 檐下投影带 → 幕墙 →
   台阶 → 柱盆 → 轮廓与接地带。 */
function kxFront(g, G, C) {
  kxRoof(g, G, C);
  kxSlab(g, G, C);
  kxWall(g, G, C);
  kxSoffit(g, G, C);
  kxGlass(g, G, C);
  kxStairs(g, G, C);
  kxPot(g, G, C);
  /* 外轮廓分两段：檐口板那一层**满宽**（它两侧各出挑 12px），墙那一层只有墙宽 ——
     合成一条会在出挑的空档里拉出一条悬空的暗线。 */
  px(g, G.x0 - 1, G.y0, 1, G.slabH, C.OUT);
  px(g, G.x1, G.y0, 1, G.slabH, C.OUT);
  const rw = G.rect(KX_EL.wing);
  px(g, rw[0] - 1, G.wallTop, 1, G.baseY - G.wallTop, C.OUT);
  px(g, rw[0] + rw[2], G.wallTop, 1, G.baseY - G.wallTop, C.OUT);
  contactBand(g, rw[0] + 1, rw[0] + rw[2] - 1, G.baseY - 1, 2, 0.34);
}

/* --- 5.11.12 覆盖重绘入口 ----------------------------------------------------
   ⚠️ 必须在这里、addProp **之前**调（60_assemble.js）—— 重绘的是同一张 canvas
      的内容，晚一步 addProp 已经把旧精灵挂进 props 了（gymRestyle/dxRestyle/
      xgRestyle 同一规矩）。
   ⚠️ 本函数**不碰共享 RNG**（斑点/盆里颗粒一律局部 makeRng）—— 碰了就会重掷
      全校园散射（那是有专属探针才看得见的地雷，见 60_assemble.js §6.6）。
   ⚠️ 第三个实参照 58/59 段传 `pal` —— `makeBuilding` 的返回值里没有色号，
      而补屋面板面必须与它同色，所以只能由调用点给（本段不许再存一份 PALETTE）。
   ⚠️ **立面高 117 行 ≠ styleOf 的 2 层（68 行）** ⇒ 画布要换一张高的（30 段的 H
      公式里 wallH 那一项被 FH 顶掉）。为此**只拷旧画布顶部 y0+1 行**（y0 = 檐口行，
      +1 是为了把檐口投影线那 2 行的下半行也带上）：檐口以下整段根本不进新画布
      ⇒ 既不用 clearRect，也不怕旧立面 / 旧投影 / 旧接地带残留。
      换画布**不改** `b.w` —— addSolid 用的是世界坐标，与精灵高矮无关。 */
function kxRestyle(b, pal) {
  const c = b.canvas, g = c.getContext("2d");
  const G = kxGeo(c), C = kxCol(pal);
  /* ① 撤屋名牌。30 段把牌子挂在**檐口之上**（signRect: y = eaveY − 8 − h），
        所以必须单独擦（这是全零件唯一的一次 clearRect）。调 makeSign 只为填
        _signCache（verify.py 要 / 见契约），拿到矩形就够 —— **不画**。
        补的板面色只求"擦过的地方不是透明洞"，它随后会被 5.11.4 的平屋面整片盖掉
        ⇒ 这里**不补分坡脊线**（平屋面没有脊；第一版照 30 段补了 3 道，出图里
        那 3 道脊线还留在褐色坡顶上）。 */
  const sgn = makeSign(KX_NAME);
  if (sgn) {
    const sg = signRect(sgn, G.x0, G.w, G.eaveY);
    const px0 = sg.x - 2, py0 = sg.y - 2, pw = sg.w + 7, ph = sg.h + 7;
    g.clearRect(px0, py0, pw, ph);
    px(g, px0, py0, pw, ph, C.ROOF);                       // 平台面（与 5.11.4 同色）
    speckle(g, px0, py0, pw, ph, "rgba(255,255,255,0.05)", 6, makeRng(6103));
    speckle(g, px0, py0, pw, ph, "rgba(0,0,0,0.07)", 5, makeRng(6104));
  }
  /* ② 新画布：旧画布的檐口以上搬过来（同一行；屋面随后由 5.11.4 整片改平） */
  const nc = mkCanvas(c.width, G.H), ng = nc.getContext("2d");
  ng.drawImage(c, 0, 0, c.width, G.y0 + 1, 0, 0, c.width, G.y0 + 1);
  /* ③ 方向性投影（照 30 段 §3.1：footprint 朝右下拉伸，画在楼体**之前**，
        所以只有落地线以下那一截留在画面里）+ 立面总装 */
  const SHX = Math.round(-SUN.x * 26), SHY = Math.round(-SUN.y * 26);
  shadowQuad(ng, G.x0 + 2, G.baseY - KX_SHADOW_H, G.x1 - 2, G.baseY, SHX, SHY, 0.28, 4);
  kxFront(ng, G, C);
  b.canvas = nc;
  /* ④ **只挪锚点**：`b.y`（世界落地线）与 addSolid 用的世界坐标一个字节都不动。
        `ay` 里多出来的 KX_DY 就是"整栋北移"在精灵上的全部痕迹。 */
  b.ay = G.baseY + KX_DY;
  return b;
}

/* =========================================================
   6. 场景装配
   ---------------------------------------------------------
   ⚠️ solids / props 必须**先声明**再烘焙地面 —— 4.6 的围墙会把碰撞盒
      直接推进 solids，而 buildGround() 里就调 paintWalls()。
   ========================================================= */
const solids = [];                           // 碰撞盒（世界坐标 AABB）
const props  = [];                           // 可绘制物，最终按 baseY 排序

/* `tag` 透传（可选）：目前只有树带 `"tree"`，供离线探针 props_probe.py 区分
   「树」与「路灯」—— 路灯 32×84 也是细高精灵，按尺寸判会误判。 */
function addProp(s)                      { props.push({ img: s.canvas, ax: s.ax, ay: s.ay, x: s.x, y: s.y, baseY: s.y, tag: s.tag }); }
function addSolid(cx, by, w, d)          { solids.push({ x: cx - w / 2, y: by - d, w: w, h: d }); }
function cellAt(x, y)                    { return CELLK[(((y / CELL) | 0) * NW) + ((x / CELL) | 0)] || 0; }
function cellAtSafe(x, y) {
  const cx = (x / CELL) | 0, cy = (y / CELL) | 0;
  if (cx < 0 || cy < 0 || cx >= NW || cy >= NH) return 0;
  return CELLK[cy * NW + cx];
}
function ptBlocked(x, y, hw, hh) {
  hw = hw || 7; hh = hh || 5;
  for (const s of solids)
    if (x + hw > s.x && x - hw < s.x + s.w && y + hh > s.y && y - hh < s.y + s.h) return true;
  return false;
}

/* --- 6.0.1 地面 mip 金字塔（缩放用）→ **已挪到 §6.6d** ---
   ÷2 / ÷4 / ÷8 各一层。缩小时取的层级 L = floor(log2(1/zoom))，保证 2^L <= 1/zoom：
   于是**永远只做「1:1 或轻微缩小」，绝不放大 mip**（放大 mip 会糊）。
   ⚠️ 位置不能再回到这里：§6.6d 的树下落叶要**最后**往地面画布上补像素，
   而 mip 是那一刻从地面画布降采样出来的 —— 早一步建，落叶就进不去 mip。 */

/* --- 6.0.2 缩放档位 --- */
function mipLevelFor(z) {
  if (z >= 1) return 0;
  return Math.min(3, Math.max(0, Math.floor(Math.log2(1 / z))));
}
/* ⚠️ 这里写了 player.speed，所以**只能在主循环段声明 player 之后**调用（幂等，重复调无副作用）。 */
function setZoom(i) {
  zoomI = Math.max(0, Math.min(ZOOM_STEPS.length - 1, i));
  zoom  = ZOOM_STEPS[zoomI];
  viewW = VIEW_W / zoom;
  viewH = VIEW_H / zoom;
  /* 屏幕速度恒定：≥1× 时按倍率补偿，否则 4× 下 200 世界px/s = 800 屏px/s，0.6 秒横穿屏幕。
     <1× 不补偿 —— 世界速度恒定，缩小时走得慢是符合直觉的。 */
  player.speed = BASE_SPEED / Math.max(1, zoom);
  /* 读数与滑条同步（滑条位置 = 档位下标）。滑条是离散的，用下标而不是倍率，
     这样每一像素的拖动距离都对应"一档"，不会出现拖了没反应的空档。 */
  const el = document.getElementById("zoomlv");
  if (el) el.textContent = zoomI === 0 ? "全图"
                                : zoom >= 1 ? (zoom + "×")
                                : (Math.round(zoom * 100) + "%");
  const rg = document.getElementById("zrng");
  if (rg && Number(rg.value) !== zoomI) rg.value = zoomI;
}

/* --- 6.1 建筑样式：按名字归类 --- */
const PALETTE = [
  { wall: "#d2c9b4", roof: "#6c7f8c", glass: "#8FB6D9", door: "#5a3f2a" },   // 教学
  { wall: "#d6c5ac", roof: "#7b5d4e", glass: "#9ec0dc", door: "#5a3f2a" },   // 宿舍
  { wall: "#dbd0b8", roof: "#9a6a3e", glass: "#a8c8e0", door: "#6b4a2f" },   // 会堂 / 食堂
  { wall: "#c8ced4", roof: "#5f7f8a", glass: "#8FB6D9", door: "#4a5560" },   // 实验 / 场馆
  { wall: "#cfc6b2", roof: "#7d6a52", glass: "#a8c8e0", door: "#5a3f2a" }    // 其它
];
function styleOf(name) {
  if (/宿舍/.test(name))                          return { p: 1, floors: 6 };
  if (/食堂|餐厅/.test(name))                     return { p: 2, floors: 2 };
  if (/会堂|校史馆|积秀园|服务中心|中心$/.test(name)) return { p: 2, floors: 2 };
  /* 新体育馆：**5 层**（用户 2026-09-17 拍板）。它本会被下面那条 `/体育馆|实验|馆$/`
     归成 3 层 —— 3 层时墙高只有 102px，而屋顶板被 30 段的 `clamp(round(depth*0.60),
     20,190)` 顶到 190，屋顶占了精灵的 2/3，像一张煎饼。所以这条必须排在它**之前**。
     ⚠️ 与 59_xgym.js 的 XG_FLOORS 必须一致；build.py 有断言把两处钉在一起。
     ⚠️ 它仍然归 p:3（`/体育馆|实验|馆$/` 那一档），配色与老体育馆、实验楼同一族。 */
  /* 两栋体育馆：屋面板**铺满整个进深**（`roofFull`，见 30_building.js 那一大段）。
     它们进深 450 / 483，通用的 0.60 + 190 只盖得住南半截，北侧一百多像素的
     K.BLD footprint 露在外面 —— 而 K.BLD 铺的是"楼前硬地"，读起来就是一块
     灰色石板。用户 2026-09-17：「两栋体育馆都向北延长直到分配给其的 k 灰色
     石板区域被覆盖」。**只有这两栋**要这条，所以标志写在 styleOf 里，
     与 floors 一样属于"数据"，30 段模板的默认比例一个字没动。
     ⚠️ 老体育馆这条必须排在下面 `/体育馆|实验|馆$/` **之前**（否则拿不到 roofFull）。 */
  if (/^老体育馆$/.test(name))                    return { p: 3, floors: 3, roofFull: true };
  if (/^新体育馆$/.test(name))                    return { p: 3, floors: 5, roofFull: true };
  if (/体育馆|实验|馆$/.test(name))               return { p: 3, floors: 3 };
  if (/教学楼/.test(name))                        return { p: 0, floors: 4 };
  /* 思源东楼 / 思源西楼：**6 层**（用户 2026-09-17 第十六轮：8 → 6，"减少两层，
     不动塔顶，只动中间的楼层"）。
     ⚠️ 这两栋的层数是"数据"不是"模板"：`floors` 一变，30 段的 wallH 与画布高 H
        自己就跟上来（3 层 259/269 → 8 层 429/439 → 6 层 361/371），58 段按 H 反推
        eaveY 也跟着对 —— 这正是"覆盖重绘不改模板"的边界，能靠数据改的绝不去改
        30_building.js。
     ⚠️ 塔尖跟着不动：`eaveY = PADT(18) + roofT` **与层数无关**，减层只改 wallH
        ⇒ 只改 H 与 baseY，屋面以上的每一行（含 dxAttic 的塔）逐字节不变。
        屏幕上的后果是屋面与塔尖整体下移 68 行（精灵底部锚在世界落地线上不动）。
     ⚠️ 与 58_dxdoor.js 的 DX_FLOORS 必须一致；build.py 有断言把两处钉在一起。 */
  if (/思源[东西]楼/.test(name))                  return { p: 4, floors: 6 };
  return { p: 4, floors: 3 };
}

  /* 科学会堂：正面按用户给的 ppt 正面图（校园示意图.pptx 第 4 页）覆盖重绘

     ⚠️ 它**换的是整张画布**（立面高 117 行 ≠ styleOf 的 2 层 68 行），并且把

        "鸭子游在柳荫下"，都是对的（第一版按包围盒删，误伤一大片）。
     ③ 必须要求**树排在道具前面**（baseY 更大 = 更靠南），并且道具的接地线要明显地
        在树的北侧（≥40px）—— 否则"道具挨着树站着、脚被树干挡一点"是正常遮挡，
        删掉反而是损失。
   必须在 §6.7 鸭子下水**之前**跑：鸭子是 props 里的引用，删了会让鸭子消失。
   ⚠️ ④ **2026-09-17 修了一个既存缺陷**：本函数的"保留"判据原先只认 `p.tag`，
      而**建筑物没有 tag** ⇒ 楼会掉进"小道具"那一支、被 `footOnTree` 删掉。
      触发条件苛刻（树要排在楼前、且树冠像素**正好压在楼的接地线那 3 行上**），
      所以从 §2 起一直没被撞上；这一轮雕像的两处 addSolid 重掷了全校园散射、
      换了树位，第七教学楼（310×293）当场消失。现按宽度把楼排除掉（见函数内注释）。 */
function footOnTree(p, t) {
  const g = t.img.getContext("2d");
  /* 道具接地线（锚点行上下各 1px）换算到树的画布坐标 */
  const x0 = Math.round(p.x - (t.x - t.ax) - p.img.width / 2);
  const y0 = Math.round(p.y - (t.y - t.ay)) - 1;
  if (x0 + p.img.width < 0 || y0 + 3 < 0 || x0 >= t.img.width || y0 >= t.img.height) return false;
  const sx = Math.max(0, x0), sy = Math.max(0, y0);
  const sw = Math.min(t.img.width, x0 + p.img.width) - sx;
  const sh = Math.min(t.img.height, y0 + 3) - sy;
  if (sw <= 0 || sh <= 0) return false;
  const d = g.getImageData(sx, sy, sw, sh).data;
  let n = 0;
  for (let k = 3; k < d.length; k += 4) if (d[k] > 40) n++;
  return n >= 2;                                // 1px 擦边不算，要真盖住
}
function clearPropTreeClash() {
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    /* ⚠️⚠️ 2026-09-17 补：`|| p.img.width > 110` 那半条是**本轮的 bug 修复**，
       不是重构 —— 原判据只有 `if (p.tag)`，于是**没有 tag 的建筑物**会掉进下面的
       `footOnTree` 判据：只要有一颗树排在楼前、树冠像素正好压在楼的接地线上，
       **整栋楼就被当成"压着树的小道具"删掉**（这一轮实测：第七教学楼 310×293
       就是这么没的 —— 雕像那两处 addSolid 重掷散射、换了树位才触发）。
       建筑在本项目里一律没有 tag（`addProp` 只拷 `img/ax/ay/x/y/baseY/tag`，
       `makeBuilding` 的产物没有 tag 字段）⇒ 用宽度把"楼"与"小道具"分开，
       与 §5.10.9 `clearWrClearance` 同款口径（小道具最大 ≈86px，楼最小 ≈150px）。 */
    if (p.tag || p.img.width > 110) { keep.push(p); continue; }   // 树 / 鸭子 / 建筑：不动
    let bad = false;
    for (const t of props) {
      if (t.tag !== "tree" || t.baseY <= p.baseY) continue;
      if (p.y > t.y - 40) continue;             // 挨着站 = 正常遮挡，放行
      if (footOnTree(p, t)) { bad = true; break; }
    }
    if (bad) dropped++; else keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

function blocked(nx, ny) {                // 只测脚下一小块，避免"悬空卡住"
  const hw = 6, hh = 4;
  const x0 = nx - hw, x1 = nx + hw, y0 = ny - hh, y1 = ny + hh;
  for (const s of solids)
    if (x1 > s.x && x0 < s.x + s.w && y1 > s.y && y0 < s.y + s.h) return true;
  return false;
}

function update(dt) {
  let dx = 0, dy = 0;
  if (keys.arrowleft || keys.a) dx -= 1;
  if (keys.arrowright || keys.d) dx += 1;
  if (keys.arrowup || keys.w) dy -= 1;
  if (keys.arrowdown || keys.s) dy += 1;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    /* ⚠️ `>=` 而不是 `>`：斜推时 |dx| === |dy|，用 `>` 会落进 else → 朝上（后脑勺）。
       取侧视至少露侧脸。纯上下（|dx| = 0）仍走 else，行为一字不变。 */
    if (Math.abs(dx) >= Math.abs(dy)) player.dir = dx < 0 ? "left" : "right";
    else player.dir = dy < 0 ? "up" : "down";
    const d = player.speed * dt;
    const nx = clamp(player.x + dx * d, 14, WORLD_W - 14);
    const ny = clamp(player.y + dy * d, 60, WORLD_H - 16);
    // 分轴滑动：撞墙能贴着走；canWalk 兜底（边界多边形 + 离墙 11px）
    const _wx = player.x, _wy = player.y;              // 位移前的位置
    if (!blocked(nx, player.y) && canWalk(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny) && canWalk(player.x, ny)) player.y = ny;
    /* 步态按**实际位移**推进，不是按时间 ——
       ⚠️ 原版是 `player.walk += dt`：顶着墙走时它照常累加，人会原地踏步
          （贴墙滑行时尤其明显）。改成累加碰撞后的真实位移，顶墙 → 位移 0 → 脚立刻停。
       一个完整步态周期 = WALK_STRIDE 世界像素（4 帧 = 左右各一步），
       所以档位越高（世界速度越慢）步频越低，屏幕上的节奏始终对得上。 */
    player.idle = 0;
    player.walk += Math.hypot(player.x - _wx, player.y - _wy);
    player.step = (Math.floor(player.walk / WALK_STRIDE * WALK_FRAMES)) & (WALK_FRAMES - 1);
  } else {
    player.walk = 0;
    player.idle = (player.idle || 0) + dt;              // 待机呼吸：慢速两帧
    player.step = IDLE_BASE + (((player.idle * IDLE_HZ) | 0) & (IDLE_FRAMES - 1));
  }
  /* 可见世界尺寸随 zoom 变。⚠️ FIT 档下 viewH = 270/0.09217 = 2929.47 > WORLD_H = 2929，
     上界 WORLD_H - viewH 是负数 → clamp 会返回负上界、把相机推到界外。
     所以上界一律 max(0, …)：视口比世界大时相机老实待在原点。 */
  cam.x = clamp(player.x - viewW / 2,    0, Math.max(0, WORLD_W - viewW));
  cam.y = clamp(player.y - viewH * 0.62, 0, Math.max(0, WORLD_H - viewH));
  animateWater(dt);                         // 水波 / 鱼影 / 鸭子
  animateFlag(dt);                          // 旗面换帧（[52_flag] 风动）
  hudTick();                                // HUD：最近地标 + 坐标
  animateDiaosu(dt);                       // 雕塑喷泉换帧（[53_diaosu] 水柱）
}

function render() {
  const ox = Math.round(cam.x), oy = Math.round(cam.y);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  /* 地面取 mip。L 保证 2^L <= 1/zoom ⇒ 只做「1:1 或轻微缩小」，绝不放大 mip（会糊）。
     源矩形按 WORLD 边界夹一次：FIT 档 viewH 比 WORLD_H 大 0.47px，不夹会在底边漏透明缝。
     crisp（整数放大 / 精确 mip）关平滑走最近邻，其余开平滑。 */
  const L = mipLevelFor(zoom), s = 1 << L;
  const mw = mips[L].width, mh = mips[L].height;
  const msw = Math.min(viewW, WORLD_W - ox) / s, msh = Math.min(viewH, WORLD_H - oy) / s;
  const crisp = zoom >= 1 || zoom * s === 1;
  let mox = ox / s, moy = oy / s;
  if (crisp) { mox = Math.round(mox); moy = Math.round(moy); }   // 精确贴图：对齐 mip 网格
  mox = Math.max(0, Math.min(mox, mw - msw));
  moy = Math.max(0, Math.min(moy, mh - msh));
  ctx.imageSmoothingEnabled = !crisp;
  ctx.drawImage(mips[L], mox, moy, msw, msh, 0, 0, msw * s * zoom, msh * s * zoom);
  drawWater(ox, oy, zoom);                  // 动态水层：地面之后、道具之前

  drawList.length = 0;
  for (const p of props) {                        // 视口裁剪
    const sx = p.x - p.ax, sy = p.y - p.ay;
    if (sx > ox + viewW || sx + p.img.width < ox) continue;      // 世界量纲 vs 世界视口
    if (sy > oy + viewH || sy + p.img.height < oy) continue;
    /* 缩得比 1.5 背板像素还小的道具（FIT 档下的树/花坛/垃圾桶）画出来也是亚像素点，
       白费力气还可能因点采样忽隐忽现，直接过滤掉。 */
    if (Math.max(p.img.width, p.img.height) * zoom < 1.5) continue;
    drawList.push(p);
  }
  /* 下水淹没：按**离岸距离**决定裁掉底部多少行。
     ⚠️ 贴岸与岸上自动收敛到 0（lakeSubmerge 自带这个性质），不需要额外夹取 ——
        "裁掉的部分露出的是岸不是水"这个边界情况因此不存在。
     湖心 subm=0.5 → cut=15 → 可见 0..14 行，水线正好落在腰上（行预算见 45_water.js §4.5.1b）。
     裁切边落在整数源像素行上，所以 zoom<1 开平滑也不会渗出半透明边。 */
  const chClip = Math.round(CH_H * lakeSubmerge(player.x, player.y));
  drawList.push({ img: charSprite(player.dir, player.step), ax: CH_AX, ay: CH_AY, x: player.x, y: player.y, baseY: player.y, clip: chClip });
  drawList.sort((a, b) => a.baseY - b.baseY);      // 3/4 视角：按落地线排序即得到正确遮挡
  /* ⚠️ 取整必须在**背板空间**：先 round 世界坐标再乘 zoom，会把物体相对间距量化到
     1/zoom 世界像素的网格上。宽高也必须显式传，否则 drawImage 不会放大。
     缩小时开平滑，否则小精灵会被点采样整帧"抽没"（角色只有 1~2 背板像素宽）。
     ⚠️ `k = it.clip` 只对**角色**非 0（补丁 15 给它加的）：入水时把精灵底部 k 行裁掉，
        下面对齐好的湖水与波纹自然露出来 —— 这就是"淹没"的全部实现，不加半透明水罩。
        裁的是**源矩形**（矩形高度改成 height - k），所以裁切边永远落在整数像素行上。
        非角色那条分支与加裁切之前**逐字相同**，热路径上只多一个整数判断。 */
  ctx.imageSmoothingEnabled = zoom < 1;
  for (const it of drawList) {
    const k = it.clip || 0;
    const dx = Math.round((it.x - it.ax - ox) * zoom), dy = Math.round((it.y - it.ay - oy) * zoom);
    if (k) {
      ctx.drawImage(it.img, 0, 0, it.img.width, it.img.height - k, dx, dy,
                    it.img.width * zoom, (it.img.height - k) * zoom);
      drawSwimRing(ctx, it, dx, dy, k, zoom);           // 水线涟漪：紧跟角色那一笔之后
    } else {
      ctx.drawImage(it.img, dx, dy, it.img.width * zoom, it.img.height * zoom);
    }
  }
}

let last = performance.now();
function loop(now) {
  /* ⚠️ 必须**同时夹下界**：last 在整页烘焙之后才求值，而 rAF 首帧的 now 可能比它小
     （时基倒挂）→ dt < 0。负值会污染所有累积相位（waterT / flagPhase），
     并一路传进数组下标（见补丁 4 挂上的旗面换帧）。 */
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
