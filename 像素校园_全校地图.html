   搭到岛的西平边，一寸不多一寸不少，而且**不伸进环湖小路那格**（x2720..2736），
   否则玩家沿西岸走过时会被桥面盖住脚（见 §5.6.6 末注）。
   ⚠️ 岛心 = 亭子中轴 = 精灵 x66 = 世界 2804 = 用户给的湖心亭 x。
   ⚠️ 竖向：精灵比第一版高了 24px（108 → 132），抬高的是**亭子上方**那截 ——
      攒尖举高改陡之后亭子从 73px 长到 86px（见下面的预算），岛本身没动。
      AY − CY = 125 − 90 = 35 = 岛心到落地线（= 岛南尖角 27 + 石壁 8），
      所以 MH_ISLE_BY = 1073 + 35 = 1108，而**铺装中心仍然落在用户给的 1073**。 */
const MH_ISLE_W = 120, MH_ISLE_H = 132, MH_ISLE_AX = 66, MH_ISLE_AY = 125;
const MH_ISLE_CY = 90;                        // 岛心（六边形台面中心）在精灵里的 y
const MH_ISLE_R = 46, MH_ISLE_RY = 27;        // 台面六边形：x 半径 46 / y 半径 27

/* ⚠️ 5.6.1b 两个"比例常数"，岛和屋顶都从这里取 —— 别再散落成字面量 */
/* 水平面在屏上的 y 压扁 = 1/1.71。这不是我编的：§5.3 雕塑的花坛（76×44）用的就是
   `ry = rx / 1.71`，Demo 里的树冠用 0.8 —— 1.71 是本项目**地面正圆**的既定约定。
   湖心岛的铺装是**正六边形**（南北尖角），所以屏上 = R×0.585。 */
const MH_HEX_K = 0.585;
/* 攒尖举高 / 檐半宽。照片（minghu1.jpg / minghutingzi1.jpg）里的六角攒尖很陡 ——
   第一版按 0.62 画，结果檐角比攒尖还高，整座亭子的顶读成一张平饼。
   0.95 保证攒尖明确压过北檐角（余量 = (0.95−0.585)·rx − 翼角起翘）。 */
const MH_PITCH = 0.95;

/* 亭子（全部按"台面中心"往上量）。竖向预算 90 → 0，一共 90px：
     石台基 6 + 柱 26 + 下檐举高 25 + 上层柱可见 14 + 上檐举高 16 + 宝顶 5 = 92 … 顶到精灵边
   举高 = rx × MH_PITCH，**由 mhRoof 自己算并返回攒尖 y**（下一层从返回值往上接），
   所以这里没有"攒尖 y"常量 —— 第一版把它写成常量 (MH_P_APEX / MH_P_U_APEX)，
   画的时候却由 rx 现算，两者一漂移，宝顶就悬在屋顶上面 11px 飘着。
   柱区 : 檐宽 = 26:52 ≈ 0.5，实拍 170:275 = 0.62 —— 略矮，但再高就顶出精灵了。 */
const MH_P_TIER = 84;                         // 亭子石台基的顶面 = 柱脚线（= CY − 6）
const MH_P_PIL = 17;                          // 柱环半宽
const MH_P_EAVE = 26;                         // 下檐半宽（檐口在精灵里横跨 52）
const MH_P_U_EAVE = 17;                       // 上檐半宽

/* ⚠️ 5.6.1c 上层柱（童柱）—— 2026-09-13 第二轮补的，用户原话：
     「亭子上边那一小层没有柱子支撑」。第一版把上层柱画在**下檐攒尖之上** 8px 的空中，
     而上檐的南坡正好向下垂 8px、严丝合缝盖住 —— 一根柱脚都看不见，那一层就是
     两块屋顶对顶着悬浮。根因不是柱高不够，是**画的次序反了**：
     上层柱必须画在**下檐之前**，让下檐的戗脊（屋脊线）自己去切柱脚。
     屋脊在屏上是个 V（攒尖 33 → 檐角 62.5），每根柱子各自被自己那条戗脊切掉，
     露出来的长度就自动是对的 —— 不需要给每根柱子单独量一个柱脚 y。
   MH_P_U_Y  上层柱顶（= 上檐的檐口线）。这个值同时决定上檐多高、宝顶多高：
             上檐攒尖 = MH_P_U_Y − rx×0.95 = MH_P_U_Y − 16，宝顶再往上 5，
             所以 MH_P_U_Y ≥ 21 才能让宝顶不顶出精灵（21 → 宝顶占满第 0 行）。
   MH_P_U_R  上层柱环半宽（六角上层的前三个柱脚在 0 / ±0.866R ⇒ ±10）
   MH_P_U_FOOT  柱脚画到这儿为止。**故意画得比屋脊低** —— 多出来的那截会被
             下檐盖掉，这样柱脚永远严丝合缝地坐在脊上（画浅了就会露出一条缝）。 */
const MH_P_U_Y = 21, MH_P_U_R = 12, MH_P_U_FOOT = 56;

/* 石塔精灵：26 × 54，锚点 (13, 52)。水面线在精灵 y44（下面 8px 是没入水中的台座）。 */
const MH_TW_W = 26, MH_TW_H = 54, MH_TW_AX = 13, MH_TW_AY = 52;
const MH_TW_WL = 44;                          // 吃水线（精灵 y）

/* --- 5.6.2 用色（全部取三张照片的中位色） --- */
/* 花岗岩：户外风化过的**暖浅灰** —— 不是冷灰也不是白（照片里它比水面的绿灰亮一档） */
const MH_GK_L = "#c0bcb0", MH_GK = "#a49f94", MH_GK_D = "#827d72", MH_GK_S = "#5e5952";
const MH_GK_W = "#b6b2a6";                    // 刻字崩口那圈**浅色石茬**（照片里每笔都有）
const MH_INK = "#22242a";                     // 刻痕（近黑，不是纯黑）
/* 琉璃瓦：橙黄瓦面 + 绿剪边（近正俯视图里最清楚：坡面橙、檐口与戗脊绿） */
const MH_RF_L = "#dd9a52", MH_RF = "#c07436", MH_RF_D = "#8e5222";
const MH_GL_L = "#4a8a63", MH_GL = "#2e6b4a", MH_GL_D = "#1d4a33";
/* 亭子的木作 */
const MH_PL_L = "#9c5442", MH_PL = "#7a3a2c", MH_PL_D = "#52241c";
const MH_IN_D = "#2c3d34", MH_IN_L = "#43584b";      // 亭内暗部 / 美人靠
/* 台面石板（近正俯视图里的六边形铺装）、岛缘、假山石 */
const MH_PV_L = "#b4b0a2", MH_PV = "#9c988c", MH_PV_D = "#7e7a6e", MH_PV_J = "#6a665c";
const MH_RK_L = "#c6c2b4", MH_RK = "#a8a496", MH_RK_D = "#78746a";
/* 石塔：乳白偏黄的石灯，被水汽蚀出灰绿竖纹 */
const MH_TL_L = "#e4ddc4", MH_TL = "#cdc5a8", MH_TL_D = "#a49c82", MH_TL_S = "#7c7563";
const MH_TL_G = "#a8ab8e";
/* 塔所在环带的湖水色（见 paintWaterBase 的 mix 算式）—— 水下那截石台座要混它 */
const MH_TW_WATER = "#629bc3";

/* --- 5.6.3 刻字点阵 → 逐像素落笔 ---
   与 §5.5.3 的金字（`gyGlyph`）正好**反过来**：金字是凸出来的（上亮下暗），
   碑字是**凹进去**的（刻痕近黑 + 四周一圈崩口的浅色石茬）。
   那圈石茬是这块碑一眼能认出"这是刻的不是印的"的全部依据，不能省。
   ⚠️ 刻痕本身**不加**上下压暗：凹进去的东西加压暗边只会糊成一团疙瘩。 */
function mhBits(b64, cnt) {
  const s = atob(b64), out = new Uint8Array(cnt);
  for (let i = 0; i < cnt; i++) out[i] = (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
  return out;
}
function mhGlyph(g, b64, nw, nh, x, y) {
  const b = mhBits(b64, nw * nh);
  const at = (i, j) => (i >= 0 && j >= 0 && i < nw && j < nh && b[j * nw + i]) ? 1 : 0;
  for (let j = -1; j <= nh; j++)                     // ① 崩口石茬（字外一圈 1px）
    for (let i = -1; i <= nw; i++) {
      if (at(i, j)) continue;
      if (at(i - 1, j) || at(i + 1, j) || at(i, j - 1) || at(i, j + 1) ||
          at(i - 1, j - 1) || at(i + 1, j - 1) || at(i - 1, j + 1) || at(i + 1, j + 1))
        px(g, x + i, y + j, 1, 1, MH_GK_W);
    }
  for (let j = 0; j < nh; j++)                       // ② 刻痕
    for (let i = 0; i < nw; i++)
      if (b[j * nw + i]) px(g, x + i, y + j, 1, 1, MH_INK);
}
/* 落款：照片里「湖」左下方竖着一列小字（「刘xx题」）。1bit 尺度下 3px 宽画不出字形，
   按 §5.5.3 的老办法点成一小列 —— 有它才像实拍。位置照照片量（见调用点）。 */
function mhSign(g, x, y) {
  for (let i = 0; i < 6; i++) {                      // 六个"字"
    const yy = y + i * 3;
    px(g, x, yy, 3, 2, MH_INK);
    px(g, x + (i % 2 ? 0 : 1), yy + 1, 2, 1, MH_INK);
  }
  for (let i = 0; i < 6; i++) px(g, x - 1, y + i * 3, 1, 3, MH_GK_W);   // 石茬也照给
  px(g, x, y + 18, 3, 1, MH_GK_W);
}

/* --- 5.6.4 明湖石碑（毛面花岗岩孤石 + 阴刻「明湖」+ 左侧落款）---
   石形照 minghu1.jpg 描：**下窄上宽**的一整块孤石（不是方碑）—— 顶圆缓、
   左缘近直带一道斜裂、右缘中段鼓出来再往回收、底部坐进一圈灰浆台座。
   ⚠️ 左缘在 y33..50 那段必须退到 x ≤ 3：**落款就贴在那道边上**（照片如此），
      左缘画得太靠右，落款就跑到石头外面去了。 */
function makeMinghuStone() {
  const W = MH_ST_W, H = MH_ST_H + 4;
  const c = mkCanvas(W, H), g = c.getContext("2d");
  const rng = makeRng(56001);
  const OUT = [                                      // 轮廓（顺时针自顶部）
    [16, 2], [24, 3], [31, 8], [36, 16], [39, 27], [38, 40], [35, 51],
    [33, 61], [31, 68], [28, 74],
    [13, 74], [10, 69], [8, 60], [5, 50], [2, 38], [2, 26], [6, 13], [11, 5]
  ];
  poly(g, OUT, MH_GK);
  /* 体积：左上受光的**位移实心块**（像素风里形状本身就是光），②的描边只负责抠形 */
  poly(g, [[16, 2], [24, 3], [31, 8], [27, 12], [19, 12], [13, 8]], MH_GK_L);
  ellipsePx(g, 14, 30, 9, 20, rgba(MH_GK_L, 0.55));
  ellipsePx(g, 12, 56, 7, 12, rgba(MH_GK_L, 0.34));
  poly(g, [[36, 16], [39, 27], [38, 40], [35, 51], [31, 44], [30, 30], [32, 18]], MH_GK_D);
  poly(g, [[13, 74], [28, 74], [30, 66], [14, 66]], MH_GK_D);
  /* 裂缝与风化斑（照片里石面有两道明显斜裂和几片深色斑） */
  poly(g, [[6, 40], [9, 39], [10, 60], [7, 61]], rgba(MH_GK_S, 0.45));
  poly(g, [[30, 20], [33, 21], [34, 34], [31, 33]], rgba(MH_GK_S, 0.32));
  poly(g, [[20, 60], [27, 62], [26, 66], [19, 65]], rgba(MH_GK_S, 0.22));
  ellipsePx(g, 30, 44, 5, 7, rgba(MH_GK_S, 0.26));
  ellipsePx(g, 9, 22, 4, 6, rgba(MH_GK_L, 0.30));
  speckle(g, 4, 8, 32, 60, rgba(MH_GK_L, 0.45), 46, rng);
  speckle(g, 4, 8, 32, 60, rgba(MH_GK_D, 0.45), 40, rng);
  slEdge(g, W, H, -1, -1, MH_GK_L);                  // 左上受光边
  slEdge(g, W, H, 1, 1, MH_GK_D);                    // 右下背光边
  /* 灰浆台座（照片里石头是坐进一圈水泥里的，不是直接杵在地上） */
  px(g, 12, 70, 17, 4, "#8e8a80");
  px(g, 12, 70, 17, 1, "#a8a49a");
  for (const jx of [16, 21, 26]) px(g, jx, 71, 1, 3, "#767268");
  px(g, 11, 73, 19, 1, "rgba(20,24,32,0.34)");       // 接地暗带
  shadowBlob(g, 21, 76, 15, 3, 0.30, 3);             // 向南两行软影
  /* 阴刻「明湖」+ 落款（斜向排布：明在右上、湖在左下，**两字之间留一行空**）
     ⚠️ 下面这两个坐标**换字体时必须跟着重算**，不是"排版偏好"：
        旧点阵（FZYTK）明只有 13px 宽，字窄，所以当时写成 (12,14)/(6,30)。
        换成提炼件的毛笔字后按长宽比出格，明 20 宽、湖 22 宽 —— 宽度涨了 1.5 倍，
        原坐标下两字**竖直叠掉 4 行**，而且「明」的月和「湖」的月正好上下压在一起，
        中间连成一片黑（y30..33 逐行查过：x22..31 整段没有白）。
        现在 明 y12..31 / 湖 y33..52，y32 是一整行空的；湖 右移 2 是为了
        给左侧落款（x1..4，见下行 mhSign）和石缘留出间距。
     ⚠️ 两字的**字框不同大**：明 20×20、湖 22×20（长宽比照提炼件，不强行拉方），
        所以这里的 x 是各自量出来的 —— 湖 比 明 宽 2px，若按同一个 x 摆会左右不齐。
     ⚠️ 总跨度 y12..52 只占石高（y2..74）的 0.56，与实拍 0.54 同档 —— 上下都还有余量，
        但**别再往下压**：湖 的底 y52 再往下就贴到 y70 的灰浆台座了。 */
  mhGlyph(g, MH_CHARS[0][0], MH_CHARS[0][1], MH_CHARS[0][2], 12, 12);   // 明：右上
  mhGlyph(g, MH_CHARS[1][0], MH_CHARS[1][1], MH_CHARS[1][2], 8, 33);    // 湖：左下
  mhSign(g, 1, 34);
  return { canvas: c, ax: MH_ST_AX, ay: MH_ST_AY };
}

/* --- 5.6.4b 六角台面 / 岛缘 / 石桥 --- */
/* 六边形顶点：a0 默认 30° ⇒ 得到的是**南北两个尖角、东西两条平边**的那个朝向 ——
   与照片一致（岛的最南端是一个**尖**，石桥搭在西边那条平边上）。
   ⚠️ 亭子檐口（§5.6.4d）用的是同一个朝向，两者必须同朝向，否则檐角会戳出台面。 */
function mhHexPts(cx, cy, rx, ry, a0) {
  const p = [];
  for (let i = 0; i < 6; i++) {
    const a = (a0 + i * 60) * Math.PI / 180;
    p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return p;   // [0]ESE [1]S [2]WSW [3]WNW [4]N [5]ENE
}
/* 台面铺装：照片里是六边形石板、缝是斜的。1bit 尺度画不出六边形砖，
   就压两层**同心六边形缝** + 六条对角斜缝 —— 够读了。 */
function mhPave(g, cx, cy, rx, ry, rng) {
  poly(g, mhHexPts(cx, cy, rx, ry, 30), MH_PV);
  for (const rr of [0.62, 0.30]) {
    const p = mhHexPts(cx, cy, rx * rr, ry * rr, 30);
    for (let i = 0; i < 6; i++)
      for (let t = 0; t <= 1; t += 0.22)
        px(g, Math.round(p[i][0] + (p[(i + 1) % 6][0] - p[i][0]) * t),
              Math.round(p[i][1] + (p[(i + 1) % 6][1] - p[i][1]) * t), 1, 1, rgba(MH_PV_J, 0.55));
  }
  for (let i = 0; i < 6; i++) {
    const a = (30 + i * 60) * Math.PI / 180;
    for (let t = 0.20; t <= 0.94; t += 0.055)
      px(g, Math.round(cx + rx * t * Math.cos(a)), Math.round(cy + ry * t * Math.sin(a)),
         1, 1, rgba(MH_PV_J, 0.32));
  }
  ellipsePx(g, cx - rx * 0.38, cy - ry * 0.20, rx * 0.45, ry * 0.5, rgba(MH_PV_L, 0.30));
  speckle(g, cx - rx, cy - ry, rx * 2, ry * 2, rgba(MH_GK_L, 0.30), 30, rng);
  speckle(g, cx - rx, cy - ry, rx * 2, ry * 2, rgba(MH_PV_D, 0.34), 34, rng);
}
/* 岛缘：台面外那圈浅色条石 + 南侧四条边下面 6px 的**石壁立面** + 壁脚的水影。
   ⚠️ 没有这段壁，六边形台面会像一张纸贴在水上（"浮"不起来的根因就在这）。
   北面那两条边（p3-p4 / p4-p5）不画壁 —— 那是背光侧，本来就看不见。 */
function mhIsleRim(g, cx, cy, rx, ry) {
  const p = mhHexPts(cx, cy, rx, ry, 30);
  for (let i = 0; i < 6; i++) {                      // 六条边的台面外缘（远边也要）
    const a = p[i], b = p[(i + 1) % 6];
    for (let t = 0; t <= 1; t += 0.02)
      px(g, Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t),
         1, 1, MH_PV_L);
  }
  for (const i of [5, 0, 1, 2]) {                    // 朝南/朝东/朝西的四条边 → 壁
    const a = p[i], b = p[(i + 1) % 6];
    for (let t = 0; t <= 1; t += 0.018) {
      const x = Math.round(a[0] + (b[0] - a[0]) * t), y = Math.round(a[1] + (b[1] - a[1]) * t);
      if (t === 0 || t + 0.018 > 1) continue;        // 尖角交给下一条边（免得画重）
      px(g, x, y + 1, 1, 6, MH_PV_D);                // 壁
      px(g, x, y + 1, 1, 1, MH_PV);                  // 壁顶那道浅棱
      px(g, x, y + 7, 1, 2, "rgba(10,26,42,0.30)");  // 壁脚水影（跟着轮廓走）
      px(g, x, y + 9, 1, 2, "rgba(10,26,42,0.14)");
    }
  }
  for (const i of [5, 0, 1, 2]) {                    // 壁上每 5px 一道竖缝
    const a = p[i], b = p[(i + 1) % 6];
    for (let t = 0.06; t < 1; t += 0.10) {
      const x = Math.round(a[0] + (b[0] - a[0]) * t), y = Math.round(a[1] + (b[1] - a[1]) * t);
      px(g, x, y + 2, 1, 5, rgba(MH_PV_J, 0.70));
    }
  }
}
/* 石板桥（岛西 → 西岸；照 minghu1 / minghutingzi1 的踏步石板）。
   桥面在**水面上**，所以下面只留一道浅影 —— 不能有接地暗带（那会读成"桥在地上"）。 */
function mhBridge(g, x0, y0, n) {
  for (let i = 0; i < n; i++) {
    const x = x0 + i * 5, y = Math.round(y0 + i * 0.8);
    px(g, x, y, 5, 4, MH_PV);
    px(g, x, y, 5, 1, MH_PV_L);                      // 上棱受光
    px(g, x, y + 3, 5, 1, MH_PV_J);                  // 下棱（板缝）
    px(g, x + 4, y, 1, 4, MH_PV_D);                  // 板与板之间那道竖缝
    px(g, x, y + 4, 5, 1, "rgba(16,34,54,0.30)");    // 水里的倒影
  }
}

/* --- 5.6.4d 攒尖顶（六角）---
   2.5D 里这是最容易画成一张饼的地方。做法：把六条戗脊的投影端点算出来
   （x 半径 rx、y 半径 rx×MH_HEX_K，就是那个 1.71 压扁），**每个檐角抬起 lift**，
   再按面填色 —— 光源在左上，用面法向 (-cos - sin) 定六个面各自的明暗。
   ⚠️ 檐角一定要抬（翼角上扬）：不抬的话檐口是一条水平线，六角亭立刻变方盒。
   ⚠️ **举高必须压过"北檐角"**：北檐角在屏上比檐心高 (ry + lift)，而攒尖比檐心高
      rise。rise < ry + lift 时屋顶就翻过来长成一个碗 —— 第一版 ry/rx = 0.42 时
      0.62 的举高勉强够，改成 0.585（项目既定的 1.71）之后 0.62 就不够了，
      所以 MH_PITCH 提到 0.95。
   ⚠️ **返回攒尖 y**：上层的柱 / 檐 / 宝顶都从返回值往上接。第一版把攒尖 y 存成
      常量、这里却由 rx 现算，两者一漂移宝顶就悬空（2026-09-13 就是这么错的）。 */
/* 六个檐角的屏上坐标（翼角上扬后的）。**抽出来是为了"只有一个来源"**：
   mhRoof 用它画屋面，§5.6.4e 的挂落也要贴同一条檐口线 —— 各算一遍迟早漂。
   （这就是 5.6.1b 那条老坑：派生量存两份，改一处另一处静默错位。） */
function mhEave(cx, y0, rx) {
  const lift = Math.round(rx * 0.115);                 // 26→3，17→2
  return mhHexPts(cx, y0, rx, Math.round(rx * MH_HEX_K), 30).map(p => [p[0], p[1] - lift]);
}
function mhRoof(g, cx, y0, rx) {
  const C = mhEave(cx, y0, rx);
  const apex = [cx, y0 - Math.round(rx * MH_PITCH)];
  const RIB = [];
  for (let i = 0; i < 6; i++) {                      // ① 六个坡面（按朝向定明暗）
    const a = (60 + i * 60) * Math.PI / 180;
    const l = -(Math.cos(a) + Math.sin(a)) * 0.5;    // -1 = 背光 .. +1 = 迎光
    const f = (l + 1) * 0.42 + 0.16;                 // 该面的明暗档（0..1，越大越亮）
    /* ⚠️⚠️ 瓦垄的颜色必须**从 MH_RF_D / MH_RF_L 现算**，不许写成
       `mix(mix(MH_RF_D, MH_RF_L, f), MH_RF_D, 0.38)` —— `mix()` 只吃 **hex 串**，
       喂它 `mix()` 自己的输出（"rgb(181,118,58)"）会解析成垃圾，
       结果是纯蓝 `rgb(0,0,89)`：4× 下一片蓝色虚线网（2026-09-13 第二轮踩过）。
       同一个色相、压低一档 ⇒ 换个档位系数再 mix 一次。 */
    RIB.push(mix(MH_RF_D, MH_RF_L, f * 0.60));
    poly(g, [apex, C[i], C[(i + 1) % 6]], mix(MH_RF_D, MH_RF_L, f));
  }
  /* ①b 瓦垄：每条坡面上 3~4 道**从攒尖射向檐口**的暗线 —— 有它才读得出"这是一片
     瓦屋顶"；没有它就是一块橙色梯形（第一版如此，4× 下一眼是座金字塔）。
     ⚠️ 次序：坡面 → **瓦垄** → 戗脊。瓦垄画在戗脊之后的话，屋脊被瓦线打断成虚线。
     ⚠️ 从攒尖 22% 处起笔 —— 从攒尖本身起笔，六条会挤成一坨黑点。
     ⚠️ 每道线的**收头压在檐口绿剪边上**（t 到 0.98），短一截就成飘在半空的毛刺。 */
  const NR = rx > 20 ? 4 : 3;
  for (let i = 0; i < 6; i++) {
    const a0 = C[i], b0 = C[(i + 1) % 6];
    for (let k = 1; k <= NR; k++) {
      const s = k / (NR + 1);
      const ex = a0[0] + (b0[0] - a0[0]) * s, ey = a0[1] + (b0[1] - a0[1]) * s;
      for (let t = 0.22; t <= 0.98; t += 0.05)
        px(g, Math.round(apex[0] + (ex - apex[0]) * t),
              Math.round(apex[1] + (ey - apex[1]) * t), 1, 1, RIB[i]);
    }
  }
  for (let i = 0; i < 6; i++) {                      // ② 戗脊（绿）：攒尖 → 六个檐角
    const a = C[i];
    for (let t = 0; t <= 26; t++)
      px(g, Math.round(apex[0] + (a[0] - apex[0]) * t / 26),
            Math.round(apex[1] + (a[1] - apex[1]) * t / 26), 1, 1, MH_GL_D);
  }
  for (let i = 0; i < 6; i++) {                      // ③ 檐口绿剪边 + 檐下暗线 + 瓦当
    const a = C[i], b = C[(i + 1) % 6];
    for (let t = 0; t <= 30; t++) {
      const x = Math.round(a[0] + (b[0] - a[0]) * t / 30), y = Math.round(a[1] + (b[1] - a[1]) * t / 30);
      px(g, x, y - 1, 1, 3, MH_GL);
      px(g, x, y + 2, 1, 1, MH_GL_D);
      if (t % 7 === 3) px(g, x, y - 2, 1, 1, MH_GL_D);   // 瓦当/脊兽：檐口上那排小凸点
    }
  }
  for (const p of C) {                               // ④ 翼角梢：抬起来那两头点一颗亮绿
    px(g, Math.round(p[0]) - 1, Math.round(p[1]) - 1, 2, 2, MH_GL_L);
    px(g, Math.round(p[0]) - 1, Math.round(p[1]) - 1, 1, 1, MH_GL);
  }
  px(g, Math.round(apex[0]) - 1, Math.round(apex[1]) - 1, 3, 2, MH_GL);   // 攒尖顶那颗绿珠
  return Math.round(apex[1]);
}

/* --- 5.6.4e 湖心岛 + 小亭子（一整张精灵，理由见文件头三）---
   画序（改哪一步、插哪儿，都拿这张表核）：
     台面 → 岛缘石壁 → 石桥 → 亭子台基 → 亭内暗部 → 美人靠 → 柱
     → **上层柱 + 额枋** → 下檐 → 上檐 → 宝顶 → 假山石
   ⚠️ 上层柱排在**下檐之前**是这个画序里唯一有讲究的一步（理由见 5.6.1c）：
      下檐要靠自己的戗脊去切上层柱的柱脚。插到下檐后面 = 那一层又变回悬浮屋顶。
   （水影是由 mhIsleRim 跟着岛缘轮廓一起画的，不在最后；假山石压在水影上，
     这正是照片的样子 —— 石头是搭在岛缘上、探到水面上方的。） */
function makeIslandPavilion() {
  const c = mkCanvas(MH_ISLE_W, MH_ISLE_H), g = c.getContext("2d");
  const rng = makeRng(56002);
  const CX = MH_ISLE_AX, CY = MH_ISLE_CY, R = MH_ISLE_R, RY = MH_ISLE_RY;
  const P = MH_P_TIER;

  /* ① 六边形台面 + ② 岛缘（含南侧石壁与水影） */
  mhPave(g, CX, CY, R, RY, rng);
  mhIsleRim(g, CX, CY, R, RY);
  /* ③ 石桥：从精灵左端（= 湖面西缘 2738）搭到岛的西平边（x = CX − 39.8 ≈ 26） */
  mhBridge(g, 0, CY - 7, 5);

  /* ④ 亭子的石台基：六边形鼓座（比柱环宽一圈），南边那面看得见 6px 立面 */
  const T = mhHexPts(CX, CY - 3, MH_P_PIL + 4, (MH_P_PIL + 4) * MH_HEX_K, 30);
  poly(g, T, MH_PV);
  for (const i of [5, 0, 1, 2]) {
    const a = T[i], b = T[(i + 1) % 6];
    for (let t = 0.02; t < 0.98; t += 0.03)
      px(g, Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), 1, 4, MH_PV_D);
  }
  px(g, CX - MH_P_PIL - 4, P - 6, (MH_P_PIL + 4) * 2, 1, MH_PV_L);      // 台基顶那道亮棱
  px(g, CX - MH_P_PIL - 4, P + 1, (MH_P_PIL + 4) * 2, 3, MH_PV_J);      // 台基脚

  /* ⑤ 亭内：暗部（照片里柱间是深的）+ 上缘那道梁枋的暗影 */
  px(g, CX - MH_P_PIL, P - 22, MH_P_PIL * 2, 22, MH_IN_D);
  px(g, CX - MH_P_PIL, P - 22, MH_P_PIL * 2, 4, "#1e2a23");
  /* ⑥ 美人靠（绿色坐凳栏杆）：柱间那道横带 + 竖棂，正面留出进人的口子 */
  for (let x = CX - MH_P_PIL + 2; x < CX + MH_P_PIL - 2; x += 4) {
    if (Math.abs(x + 1 - CX) < 9) continue;
    px(g, x, P - 9, 3, 5, MH_IN_L);
    px(g, x, P - 9, 3, 1, "#5d7565");
    px(g, x, P - 5, 3, 1, MH_IN_D);
  }
  /* ⑦ 柱：四根（六角环在 2.5D 里看得见的就是这四根，照片数出来也是四根） */
  for (const dx of [-17, -6, 6, 17]) {
    const x = CX + dx;
    px(g, x, P - 26, 3, 26, MH_PL);
    px(g, x, P - 26, 1, 26, MH_PL_L);                 // 左缘受光
    px(g, x + 2, P - 26, 1, 26, MH_PL_D);             // 右缘背光
    px(g, x - 1, P, 5, 2, MH_PV_D);                   // 柱础
  }
  /* ⑦b 上层柱（童柱）+ 额枋 —— **必须画在下檐之前**（理由见 5.6.1c）：
     先立柱、后铺下檐，下檐的戗脊自然把每根柱脚切在自己那条屋脊线上。
     柱脚故意画到 MH_P_U_FOOT（比脊低十几像素），多出来的那截交给下檐盖掉 ——
     这样柱脚永远严丝合缝坐在脊上，不会露出一条缝。 */
  for (const dx of [-MH_P_U_R + 2, 0, MH_P_U_R - 2]) {
    const x = CX + dx;
    px(g, x, MH_P_U_Y, 3, MH_P_U_FOOT - MH_P_U_Y, MH_PL);
    px(g, x, MH_P_U_Y, 1, MH_P_U_FOOT - MH_P_U_Y, MH_PL_L);
    px(g, x + 2, MH_P_U_Y, 1, MH_P_U_FOOT - MH_P_U_Y, MH_PL_D);
  }
  /* ⑧ 两重檐 + 宝顶：**每一层都从上一层的返回值往上接**（攒尖 y 不存常量）
     ⚠️ 上檐的 y0 是 MH_P_U_Y（独立常量），**不是** a1 的函数 —— 上层柱的可见高度
        由"上檐檐口 − 下层屋脊"决定，写成 a1−8 就又回到第一版那个悬浮屋顶了。 */
  const a1 = mhRoof(g, CX, P - 26, MH_P_EAVE);                          // 下檐（会盖住 ⑦b 的柱脚）
  const a2 = mhRoof(g, CX, MH_P_U_Y, MH_P_U_EAVE);                      // 上檐
  /* ⑧b 挂落：贴在**上檐檐口**下面那条绿装饰带（照片里上层柱头之间那排）。
     ⚠️ 必须画在上檐**之后** —— 挂落是吊在檐口**外面**的，画在前面会被
        上檐的南坡整个吃掉（第一版把它当"额枋"画在下檐之前，一行都看不见）。
     檐口线取自 mhEave（和上檐同一条来源），别自己再算一遍。 */
  const EU = mhEave(CX, MH_P_U_Y, MH_P_U_EAVE);
  for (const i of [5, 0, 1, 2]) {
    const a = EU[i], b = EU[(i + 1) % 6];
    for (let t = 0.04; t < 0.96; t += 0.05) {
      const x = Math.round(a[0] + (b[0] - a[0]) * t), y = Math.round(a[1] + (b[1] - a[1]) * t) + 2;
      px(g, x, y, 1, 3, MH_GL_D);
      px(g, x, y, 1, 1, MH_GL);
    }
  }
  for (let x = CX - 8; x <= CX + 8; x += 4) {                            // 垂花：檐下那几颗吊珠
    const dy = 2 + Math.round((1 - Math.abs(x - CX) / 9) * 2);
    px(g, x, MH_P_U_Y + 2 + dy, 1, 2, MH_GL);
  }
  /* ⑨ 宝顶：照片里是**绿琉璃**的洋葱形宝顶、底下压一圈金 —— 第一版画成橙珠是错的。
     整块横跨 a2−5 .. a2+3，所以 MH_P_U_Y ≥ 21（见 5.6.1c）。 */
  px(g, CX - 3, a2 + 2, 7, 2, MH_RF_L);                                 // 金座
  circlePx(g, CX, a2 - 1, 3, MH_GL_L);                                  // 绿珠
  circlePx(g, CX, a2 - 1, 2, MH_GL);
  px(g, CX - 1, a2 - 2, 2, 1, "#7fbf9a");                               // 左上高光
  px(g, CX, a2 - 5, 2, 4, MH_GL);                                       // 细尖
  px(g, CX, a2 - 5, 1, 4, MH_GL_L);

  /* ⑨ 假山石：近正俯视图里 —— 东平边一块最高的、东南与南缘一排列到西南。
     石头压在岛缘水影**之上**（照片如此：石头是搭在岛缘、探到水面上的）。 */
  mhRock(g, CX + R - 20, CY - 12, 10, 18, rng);       // 东平边那块最高的
  mhRock(g, CX + R - 30, CY + 2, 11, 9, rng);
  mhRock(g, CX + R - 42, CY + 12, 10, 8, rng);        // 东南
  mhRock(g, CX - 6, CY + RY + 1, 12, 9, rng);         // 南尖角两侧
  mhRock(g, CX + 14, CY + RY - 1, 10, 8, rng);
  mhRock(g, CX - 26, CY + RY - 3, 10, 8, rng);
  mhRock(g, CX - 44, CY + 10, 9, 7, rng);             // 西南
  return { canvas: c, ax: MH_ISLE_AX, ay: MH_ISLE_AY };
}
/* 一块假山石：不等边多边形 + 左上受光 + 右下背光。
   照片里的石头是**浅灰偏暖**的、比台面亮，所以在台面上是"跳"出来的 ——
   别画成深色，那会读成一个洞。 */
/* cols 是 2026-09-13**第七轮**加的可选参数（57_yingbi.js 的假山要另一套配色：
   米白为主 + 深灰，那才是实例图的样子）。四档 = [受光面, 主面, 背光棱, 高光]。
   ⚠️ **不传就完全走原来的 MH_RK_* 与 #d6d2c4** ⇒ §5.6 那 7 个调用点（:480-486）
      的输出逐字节不变。这是纯加法，不是改判据。 */
function mhRock(g, x, y, w, h, rng, cols) {
  const j = () => (rng() - 0.5) * 2.2;
  const C = cols || [MH_RK_L, MH_RK, MH_RK_D];
  const HL = (cols && cols[3]) || "#d6d2c4";
  const P = [
    [x + 1, y + h - 1], [x, y + h * 0.42], [x + w * 0.30, y + 1],
    [x + w * 0.78, y], [x + w - 1, y + h * 0.44], [x + w * 0.72, y + h - 1]
  ];
  poly(g, P, C[1]);
  poly(g, [P[1], P[2], P[3], [x + w * 0.55, y + h * 0.52]], C[0]);   // 左上受光面
  for (let t = 0.1; t <= 1; t += 0.10) {                                // 右下背光棱
    const a = P[4], b = P[5];
    px(g, Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), 1, 2, C[2]);
  }
  px(g, Math.round(x + w * 0.24), Math.round(y + 2), 2, 1, HL);
}

/* --- 5.6.5 水中央的石塔（minghu2.jpg）---
   ⚠️ y 是三个坐标里**唯一动过的**：用户写 1356（旧湖里的位置，离旧湖底 75.6px）。
      湖底北移 103.6 之后，1356 已经落在南岸**石板路**上了 —— 那就成了"路中央的石塔"，
      而用户要的是水中央。取 1356 − 103.6 ≈ **1253**：仍在水中，且离新湖底 75px，
      与旧湖里的关系一模一样。
   造型（自下而上，照照片量）：没入水中的台座 → 鼓形塔身（**两处椭圆形透光孔**，
   这是全塔最认得出的特征）→ 小伞盖 → 大伞盖 → 宝珠（压扁的圆球）→ 小葫芦顶 → 尖。 */
function makeStoneTower() {
  const c = mkCanvas(MH_TW_W, MH_TW_H), g = c.getContext("2d");
  const rng = makeRng(56003);
  const CX = MH_TW_AX, WL = MH_TW_WL;

  /* ① 没入水中的台座（吃水线以下 8px）：**必须是"隔着水看"的颜色**。
     第一版直接铺了块偏绿的石头色 (#8e9478)，4× 下一眼看过去是一块立在湖里的
     灰板 —— 它比周围的水亮一大截，读不出"没入水下"。
     做法：石色按 0.55 混进**湖水中层色**（= paintWaterBase 里
     mix("#2E6E9E","#7FB4D8",0.16×4)，塔所在的环带上就是这个色）。 */
  px(g, CX - 8, WL, 17, MH_TW_AY - WL, mix(MH_TL_D, MH_TW_WATER, 0.55));
  px(g, CX - 8, WL, 17, 1, mix(MH_TL, MH_TW_WATER, 0.40));   // 刚入水那道被水折掉的亮边
  px(g, CX - 5, MH_TW_AY - 3, 11, 3, mix(MH_TL_S, MH_TW_WATER, 0.40));
  /* ② 塔身：鼓形（下宽、中鼓、颈收）—— 逐行半宽表，比椭圆更像"石头"。
     ⚠️ BODY 是**关键帧表**（[行号, 半宽]），要逐行**插值**再画。
        第一版直接 for-of 遍历这张表当行用 —— 表里 dy 是 0,2,5,9,13,15,16，
        中间那些行（1,3,4,6,7,8,10,11,12,14）根本没画，塔身成了只**鸟笼**：
        一排排横条中间全是洞，两个"透光孔"浮在洞外。4× 截图上一眼就是错的。 */
  const BODY = [[0, 4], [3, 6.5], [7, 8], [11, 7.6], [14, 6], [16, 4.5]];
  const BH = 17;                                      // 塔身总高（精灵 y WL−17 .. WL−1）
  for (let i = 0; i < BH; i++) {
    let hw = BODY[BODY.length - 1][1];
    for (let k = 0; k < BODY.length - 1; k++) {
      const d0 = BODY[k][0], w0 = BODY[k][1], d1 = BODY[k + 1][0], w1 = BODY[k + 1][1];
      if (i >= d0 && i <= d1) { hw = w0 + (w1 - w0) * (i - d0) / (d1 - d0); break; }
    }
    const y = WL - BH + i, h = Math.max(2, Math.round(hw));
    px(g, CX - h, y, h * 2, 1, MH_TL);
    px(g, CX - h, y, 2, 1, MH_TL_L);                  // 左缘受光
    px(g, CX + h - 2, y, 2, 1, MH_TL_D);              // 右缘背光
  }
  /* 两处透光孔：左边大（斜椭圆）、右边小 —— 照片里两孔不对称，别做成一对 */
  ellipsePx(g, CX - 5, WL - 8, 3, 4, "#33352c");
  ellipsePx(g, CX - 5, WL - 8, 2, 3, "#4a4c40");
  ellipsePx(g, CX + 6, WL - 9, 2, 3, "#33352c");
  /* ③ 小伞盖（颈上那圈） */
  px(g, CX - 5, WL - 21, 11, 4, MH_TL);
  px(g, CX - 5, WL - 21, 11, 1, MH_TL_L);
  px(g, CX - 5, WL - 18, 11, 1, MH_TL_D);
  /* ④ 大伞盖（更大一圈，边缘起棱）：照片里它明显比塔身外扩一圈 —— 21 宽 vs 塔身 16 */
  px(g, CX - 10, WL - 26, 21, 5, MH_TL);
  px(g, CX - 10, WL - 26, 21, 1, MH_TL_L);
  px(g, CX - 10, WL - 22, 21, 1, MH_TL_D);
  for (let x = CX - 8; x <= CX + 8; x += 4) px(g, x, WL - 25, 1, 4, rgba(MH_TL_S, 0.55));
  /* ⑤ 宝珠（压扁的球） */
  ellipsePx(g, CX, WL - 32, 5, 6, MH_TL);
  ellipsePx(g, CX - 1, WL - 34, 3, 3, MH_TL_L);
  ellipsePx(g, CX + 3, WL - 30, 2, 3, MH_TL_D);
  /* ⑥ 小葫芦顶 + 尖 */
  ellipsePx(g, CX, WL - 39, 3, 3, MH_TL);
  ellipsePx(g, CX - 1, WL - 40, 2, 2, MH_TL_L);
  px(g, CX - 1, WL - 44, 2, 3, MH_TL_D);
  px(g, CX - 1, WL - 45, 1, 2, MH_TL);
  /* ⑦ 水汽蚀痕（照片里石灯上有一道道竖向的灰绿蚀纹） */
  for (const dx of [-7, -2, 3, 7]) px(g, CX + dx, WL - 16, 1, 15, rgba(MH_TL_G, 0.40));
  speckle(g, CX - 9, WL - 45, 19, 45, rgba(MH_TL_G, 0.30), 26, rng);
  speckle(g, CX - 9, WL - 45, 19, 45, rgba(MH_TL_L, 0.34), 20, rng);
  /* ⑧ 吃水线：一圈比水面略亮的环 + 塔底那圈暗影 —— 有它才"站在水里" */
  px(g, CX - 9, WL, 19, 1, "rgba(190,214,232,0.42)");
  ellipsePx(g, CX, WL + 4, 11, 3, "rgba(10,26,42,0.26)");
  ellipsePx(g, CX, WL + 6, 14, 3, "rgba(10,26,42,0.13)");
  return { canvas: c, ax: MH_TW_AX, ay: MH_TW_AY };
}

/* --- 5.6.6 摆进世界 ---
   ⚠️ 必须在 scatter() **之前**（同 §6.5b/§6.5c/§6.5d）：石碑的 addSolid 一进
      solids，散射点就不会落到碑身上（否则碑里会长出一棵树或一个垃圾桶）。
   ⚠️ 岛与塔的碰撞盒是 **2026-09-13 第六轮补的**。旧注释写的是「它们在水里，
      而水面本来就不可通行（K.WATER）」—— 那句话是**错的**，已实测证伪：
      canWalk() 只查边界多边形，addSolid 的 12 个调用点里没有一处是水面，
      **水面一直可以走上去**（人踩着水在湖上走）。前提没了，这两个盒子就必须补，
      否则人能踩着水直接穿岛穿塔。
      盒子的取法同 §5.3.8 的花坛：取**落地足迹**的 AABB，不是整张精灵框
      （岛精灵 120×132 里大半是亭子、屋顶和水面反光）。
   ⚠️ 石桥只搭到**湖面西缘**（精灵 x0 = 2738.06），不伸进环湖小路那一格
      （x2720..2736）—— 否则玩家沿西岸走过时，桥面会盖住他的脚。 */
/* 水里的石头（岛 / 塔）：除了挡住玩家，还要登记进 45_water.js 的 WATER_AVOID，
   让鸭子和鱼也绕开 —— 否则只有人绕得过去、鸭子照样穿石而过，比不加盒子还刺眼。
   两个盒子共用一条 `addSolid + push` 路径而不是各写两遍，免得将来只改了一边。 */
function mhSolid(cx, by, w, d) {
  addSolid(cx, by, w, d);
  WATER_AVOID.push({ x0: cx - w * 0.5, x1: cx + w * 0.5, y0: by - d, y1: by });
}

function buildMinghu() {
  addProp(Object.assign({}, makeMinghuStone(), { x: MH_ST_X, y: MH_ST_BY, tag: "mhStone" }));
  addSolid(MH_ST_X, MH_ST_BY, MH_ST_W - 14, 10);      // 碑是一堵墙：给"足迹"，绕得过去穿不过去
  addProp(Object.assign({}, makeIslandPavilion(), { x: MH_ISLE_X, y: MH_ISLE_BY, tag: "mhIsle" }));
  /* 岛：台面六边形横跨 x 2758..2850、纵跨 y 1046..1108（岛心 1073 ± RY，南尖 1108）。
     深度写成 `AY − CY + RY` 而不是直接拍 62 —— 它是"岛心到落地线(35) + 岛心到北缘(27)"，
     三个常量任一挪动，盒子自己会跟着走。 */
  mhSolid(MH_ISLE_X, MH_ISLE_BY, MH_ISLE_R * 2, MH_ISLE_AY - MH_ISLE_CY + MH_ISLE_RY);  // 92 × 62
  addProp(Object.assign({}, makeStoneTower(), { x: MH_TW_X, y: MH_TW_BY, tag: "mhTower" }));
  /* 塔：水里一根细柱，落地足迹只有吃水线以下那一小截（精灵 y44..52 → 世界 y1245..1253），
     塔身最宽处 19px（§5.6.5 的 `px(g, CX-9, WL, 19, 1, …)`）—— 取 20 宽、8 深。 */
  mhSolid(MH_TW_X, MH_TW_BY, 20, MH_TW_AY - MH_TW_WL);  // 20 × 8
}

/* ============================================================================

/* --- 5.7.1 影壁几何（世界像素 / 精灵内像素） --- */
const YB_W = 68, YB_H = 56;                 // 影壁精灵：68×56（实例图 1.235:1 取整）
const YB_ROOF_H = 16, YB_BASE_H = 9;        // 竖向分层：瓦顶 16 / 墙身 31 / 台基 9
const YB_FRAME = 4;                         // 暗棕墙框厚（实例图约 3%，像素下取 4 才读得出）
const YB_DOOR_W = 52;                       // 月亮门精灵宽
const YB_DOOR_R = 10, YB_DOOR_HOLE = 20;    // 圆洞半径 / 门洞净宽（= 2R，人能穿的就是这个宽度）
const YB_GAP = 8;                           // 构件之间的缝
const YB_BY = 1378;                         // 落地线：**用户指定**，不参与任何推导
/* 瓦顶分层（照实例图，**平直无弧** —— 用户 2026-09-13：
   「弧顶可以不要，按照那个照片画瓦片即可」，推翻了上一轮"扇形=顶部弧形扇面"的拍板）。
   实拍影壁 800px 高里瓦顶占 y0..170（21%），内含 翘角 0..8 / 正脊 30..75 /
   筒瓦瓦垄 75..145 / 檐口 145..165。本精灵瓦顶 16px，按同一节奏压成
   **正脊 7 / 筒瓦 7 / 檐口 2**。翘角在正脊两端向上突出 2px（画布顶到 y0，再高没地方）。
   ⚠️ 第一版把瓦垄画成"深底 + 更深的沟"（#383038 底 + #1c181c 沟），1× 下整片糊成黑，
      和旁边湖面一比就是个洞 —— 实拍正相反：**筒瓦的正面是受光的浅米白**，
      深色只是瓦与瓦之间的沟。这是"照着照片画瓦片"的关键，不是配色口味。 */
const YB_RIDGE_H = 6, YB_EAVE_H = 2;        // 正脊高 / 檐口高（瓦垄高 = 16 − 6 − 2）
/* 假山：50×62，落地比影壁**北 16px** ⇒ 顶到 1300，比影壁顶（1322）高 22px。
   22 是 1× 下能读出"墙后有石头"的最小量，正是用户要的"被挡住但露出"。 */
/* 假山落地线比影壁**低** YB_JIASHAN_DY —— 越低被影壁挡得越多、从墙顶露出来的越少。
   16 时整座山从墙顶冒出 22px（一大块 + 西端一截），用户 2026-09-13：
   「往前移动一点假山，能够露出个头在墙后即可」⇒ 压到 4，露出 10px（影壁高的 18%）。 */
const YB_JIASHAN_W = 50, YB_JIASHAN_H = 62, YB_JIASHAN_DY = 4;
/* ⚠️ 假山的碰撞盒**不用**跟着 DY 往下挪：addSolid 的盒子是 [by−d, by]（往北延伸，
   见 60_assemble.js:13），**南沿恒等于落地线**，与进深 d 无关；而假山的 x 范围整个
   落在西影壁之内 ⇒ 人从南面来必先撞影壁盒，墙前不会凭空停住。（一度以为要把 26 压到
   14，算完发现是多余的 —— 记在这里免得下一个人再推一遍。） */
const YB_SOLID_D = 14, YB_JIASHAN_D = 26;   // 碰撞盒进深（影壁是薄墙 / 假山有底座纵深）

/* 配色：量化自 _photo/yingbijiashan.png 的**逐行色剖面**（_ybprof.py 输出，见文件头二） */
const YB_ROOF   = "#3a3540";   // 筒瓦之间的沟（深）
const YB_ROOF_L = "#66606e";   // 脊顶亮线
const YB_ROOF_D = "#1a161e";   // 脊下 / 檐下暗线
const YB_RIDGE  = "#443f4c";   // 正脊（实拍 #43404a）
/* ⚠️ 瓦面**不能太白**：`#c6c0ae` 配 `#2b2732` 的沟，1× 下是一排刺眼的白栏杆。
   沟要跟着提亮（#3a3540），两者明度差压到 ~37% 才读成"瓦"而不是"栅栏"。 */
const YB_TILE   = "#9e9a92";   // 筒瓦正面（受光的浅灰）★ 瓦垄靠它才读得出来
const YB_TILE_L = "#b8b2a6";   // 筒瓦左缘高光
const YB_EAVE   = "#221d26";   // 檐口深带
const YB_DRIP   = "#9a9488";   // 滴水瓦（檐口下沿那一格浅）
const YB_FRM = "#2e2018", YB_FRM_L = "#4a3a2e";       // ⚠️ 颜色不能叫 YB_FRAME：那个名字是厚度（数字）
const YB_WALL = "#f0e8d8", YB_WALL_D = "#cfc6b2", YB_LATT = "#302828";
/* 台基三档：实拍是 #949087/#8a867c/#5e5a55。⚠️ 必须比广场砖面（#a8a295/#bdb7a9）**暗**
   才读得出来 —— 第一版用了 #b0aca2（比砖亮），实景图里整圈台基糊进地面、墙像直接落地。 */
const YB_BASE = "#8a867e", YB_BASE_L = "#9c988e", YB_BASE_D = "#57544e";
/* 假山配色：照实例图的**扁圆鹅卵石**取色 —— 受光米白 / 中灰侧面 / 深灰底 + 粗黑缝。
   ⚠️ 不直接用 56 段的 MH_RK_*：那套是"浅灰偏暖、比湖心岛台面亮"，摆灰砖广场上会整块跳出来。 */
const YB_JSEAM = "#26242a";                                   // 石缝 / 中央透洞（近黑）
const YB_J1 = ["#e8e1ce", "#b0aca4", "#78787c", "#f4efdf"];   // 亮石（米白）
const YB_J2 = ["#c4bcae", "#948e84", "#5e5a56", "#d4cdbe"];   // 中石
const YB_J3 = ["#8a8a90", "#5e5e64", "#3a3a40", "#9c9ca2"];   // 深灰石笋
const YB_J4 = ["#b09068", "#8a7050", "#5c4834", "#c0a078"];   // 棕石（实例图里唯一的暖色）

/* --- 5.7.2 一块影壁（或月亮门） ---
   kind: "win" = 带窗影壁 / "door" = 月亮门（圆洞）。
   画序：台基 → 墙框 → 粉墙 → **挖洞（clearRect 留透明）** → 窗棂或圆洞描边 → 弧形瓦顶。
   ⚠️ 挖洞用逐行 clearRect 而不是 arc+clip：canvas 的 arc 有抗锯齿，在硬边像素画里
      会在洞口边缘糊出一圈半透明的灰，缩放时尤其明显。逐行算 dx 是本项目一贯做法
      （同 circlePx / ellipsePx / drawSwimRing）。 */
function makeYingbi(w, kind) {
  const c = mkCanvas(w, YB_H), g = c.getContext("2d");
  const yWall = YB_ROOF_H, yBase = YB_H - YB_BASE_H;      // 16 / 47

  /* 台基：三层退台（须弥座），自下而上收。实拍是"上枋亮、束腰中、下枋暗"。
     ⚠️ 层间各补一条暗线：三档灰在 1× 下差得不多，不画分界就并成一整块。 */
  px(g, 8, yBase,     Math.max(1, w - 16), 3, YB_BASE_L); // y47..49 上枋（最窄）
  px(g, 4, yBase + 3, Math.max(1, w - 8),  3, YB_BASE);   // y50..52 束腰
  px(g, 0, yBase + 6, w,                   3, YB_BASE_D); // y53..55 下枋（最宽 = 精灵满宽）
  px(g, 4, yBase + 3, Math.max(1, w - 8),  1, "rgba(26,22,18,0.5)");  // 上枋 / 束腰分界
  px(g, 0, yBase + 6, w,                   1, "rgba(26,22,18,0.5)");  // 束腰 / 下枋分界

  /* 墙身：先铺满暗棕墙框，再把粉墙贴在框内 ⇒ 四周自然露出一圈"框"。
     粉墙 60×25（左右各让 4，上下各让 3）。 */
  px(g, 0, yWall, w, YB_H - YB_BASE_H - YB_ROOF_H, YB_FRM);
  px(g, YB_FRAME, yWall + 3, w - YB_FRAME * 2, 25, YB_WALL);
  px(g, YB_FRAME, yWall + 3 + 24, w - YB_FRAME * 2, 1, YB_WALL_D);   // 粉墙下沿背光

  if (kind === "door") {
    /* 月亮门：整圆洞，**洞底切平在台基顶**（y47），否则圆底是个尖点、人走过去像踩在针上。
       圆心 y = 47 − 10 = 37 ⇒ 圆跨 y27..47，切掉 y47 那一行。 */
    const cx = w / 2, cy = yBase - YB_DOOR_R;
    for (let i = -YB_DOOR_R; i <= YB_DOOR_R; i++) {
      const y = Math.round(cy + i);
      if (y >= yBase) continue;
      const t = YB_DOOR_R * YB_DOOR_R - i * i;
      if (t < 0) continue;          // ⚠️ 是 <0 不是 <=0：i=±R 那一行也要走，否则圆顶缺一条边
      const dx = Math.floor(Math.sqrt(t));
      g.clearRect(Math.round(cx - dx), y, dx * 2 + 1, 1);
      /* 洞口**外**缘 1px 暗线：不然圆洞与粉墙的交界在 1× 下读不出来，
         整块墙会像"缺了一角"而不是"有个门"。 */
      px(g, cx - dx - 1, y, 1, 1, YB_LATT);
      px(g, cx + dx + 1, y, 1, 1, YB_LATT);
      /* 洞口**内**缘再压 1px 半透明暗 = 门洞侧壁的厚度。只有外缘一圈线的话洞看着像贴纸；
         有了这一圈才读得出"墙有厚度、门是穿过去的"。洞净宽 20 → 内缘各吃 1px 后仍有 18。 */
      if (dx >= 3) {
        px(g, cx - dx + 1, y, 1, 1, "rgba(46,38,36,0.5)");
        px(g, cx + dx - 1, y, 1, 1, "rgba(46,38,36,0.5)");
      }
    }
  } else {
    /* 窗洞 36×15，落在粉墙（y19..43）正中 ⇒ 上下各留 5；左右各留 12（粉墙 60 宽）。
       **挖空 = 画布上留透明**：渲染序是 地面 → drawWater → 道具，透明处自然露出
       影壁背后的湖水/砖面 —— 这正是用户要的"把中间挖空作为窗户"。 */
    g.clearRect(16, 24, 36, 15);
    /* 窗棂：2 竖 1 横。不加的话挖出来的就是个洞，不像窗。不想要删这三行即可。 */
    px(g, 28, 24, 1, 15, YB_LATT);
    px(g, 40, 24, 1, 15, YB_LATT);
    px(g, 16, 31, 36, 1, YB_LATT);
    px(g, 16, 24, 36, 1, YB_FRM_L);         // 窗楣（上沿一道亮线，等于给洞口加了过梁）
    px(g, 16, 38, 36, 1, YB_FRM_L);         // 窗台
  }

  /* 平直瓦顶，四层照实例图（**无弧**）：正脊 → 筒瓦瓦垄 → 檐口 → 滴水，两端带翘角。 */
  const yTile = YB_RIDGE_H;                                  // 7：瓦垄上沿
  const hTile = YB_ROOF_H - YB_RIDGE_H - YB_EAVE_H;          // 7：瓦垄高

  /* ① 正脊：实拍是深灰紫（#43404a），不是黑。脊顶一条亮线、脊下一条暗线。
     中段脊顶**下移 2px**，把画布最上面两行让给两端的翘角 —— 画布顶到 y0，
     没有负行可用，翘角只能靠"中段下沉"腾出高度。 */
  px(g, 0, 2, w, YB_RIDGE_H - 2, YB_RIDGE);
  px(g, 0, 2, w, 1, YB_ROOF_L);
  px(g, 0, YB_RIDGE_H - 1, w, 1, YB_ROOF_D);
  /* ② 翘角：两端各 5px，比中段脊顶高 2px，向内一格格落回。照实例图的"燕尾"——
     它是影壁最显眼的特征，画弱了整块墙就变成个普通方框。 */
  for (const dir of [1, -1]) {
    const xEnd = dir > 0 ? 0 : w - 1;
    for (let i = 0; i < 5; i++) {
      const yt = i < 3 ? 0 : i - 2;                          // 0,0,0,1,2
      px(g, xEnd + dir * i, yt, 1, YB_RIDGE_H - yt, YB_RIDGE);
      px(g, xEnd + dir * i, yt, 1, 1, YB_ROOF_L);
    }
  }
  /* ③ 筒瓦瓦垄：**浅色筒瓦面 + 深色沟**（第一版画反了，整片糊成黑）。
     每 4px 一根、2px 宽的受光面，左缘再提 1px 高光 —— 这才是"读出瓦垄"的关键。 */
  px(g, 0, yTile, w, hTile, YB_ROOF);                        // 先铺满沟色
  /* 每 4px 一根：**3px 瓦面 + 1px 沟**。2px 瓦面时白黑各半，看着像栅栏不是瓦。 */
  for (let x = 1; x < w - 1; x += 4) {
    px(g, x, yTile, Math.min(3, w - 1 - x), hTile, YB_TILE);
    px(g, x, yTile, 1, hTile, YB_TILE_L);
  }
  /* ④ 檐口：一道深带，下沿按同一节拍点浅色滴水瓦。 */
  px(g, 0, YB_ROOF_H - YB_EAVE_H, w, YB_EAVE_H, YB_EAVE);
  for (let x = 1; x < w - 1; x += 4) px(g, x, YB_ROOF_H - YB_EAVE_H, 1, 1, YB_DRIP);
  px(g, 0, YB_ROOF_H, w, 1, "rgba(20,14,10,0.35)");          // 檐口投在墙身上的一道影

  return { canvas: c, ax: Math.round(w / 2), ay: YB_H, w: w, h: YB_H };
}

/* --- 5.7.3 假山 ---
   照实例图的**扁圆鹅卵石堆**：石头宽:高 ≈ 1.8:1、四角圆润，三档色
   （上 38% 受光亮面 / 中 34% 中间调 / 下 28% 暗面）+ 左上高光斑，
   石头之间靠**各自的 1px 描边**形成细黑缝（**没有整块底色**），右侧一丛深灰石笋，
   右下角一块棕石，中央一个透洞。
   ⚠️ 第一版拿 YB_JSEAM **铺满整个 50×62 当"石缝"**，于是露在影壁墙顶外面的那一块是个
      **方正的黑矩形** —— 用户 2026-09-13：「假山不要有背景色」。缝改由 jPebble 每块
      自己描边之后，精灵四角是透明的，露出来的才是石头本身的圆弧轮廓。
   ⚠️ 第一版直接复用 56 段的 mhRock 画，出来是一堆**米白纸箱** —— 它的多边形顶点全
      落在四个角上，本质是**有棱角的方石**；实例图里全是扁的、圆的。根因在形状不在配色，
      所以这里不抠 mhRock 的参数，改用 jPebble() 逐行算半宽画椭圆。
   ⚠️ mhRock 上一轮为本段加的第 7 参 cols 现在没调用点了，但**留着**：它是纯加法
      （不传 = 逐字节原样），删它要动 56 段并触发 build.py 那两条断言，收益为零。 */

/* 一块扁圆鹅卵石。逐行算半宽画硬边椭圆 —— 不用 arc：arc 有抗锯齿，在硬边像素画里
   会在石缘糊出一圈半透明灰（同 5.7.2 挖门洞的取舍）。
   cp = [受光亮面, 中间调, 暗面, 高光] */
function jPebble(g, x, y, w, h, cp) {
  const cx = (w - 1) / 2, cy = (h - 1) / 2;
  for (let iy = 0; iy < h; iy++) {
    const dy = (iy - cy) / (cy + 0.5);
    const t = 1 - dy * dy;
    if (t <= 0) continue;
    const dx = Math.sqrt(t) * (cx + 0.5);
    const x0 = Math.round(cx - dx);
    const cw = Math.round(cx + dx) - x0 + 1;
    const f = iy / h;
    /* ⚠️ 每块石头自带 1px 深色描边（= 石缝）。删掉整块矩形底之后，缝只能这么来：
       后画的石头把自己的边压在先画的石头上，缝宽恒为 1px，而且假山的**外轮廓**
       是石头自己的椭圆弧、不是一个方框 —— 用户 2026-09-13：「假山不要有背景色」。 */
    px(g, x + x0 - 1, y + iy, cw + 2, 1, YB_JSEAM);
    px(g, x + x0, y + iy, cw, 1, f < 0.38 ? cp[0] : (f < 0.72 ? cp[1] : cp[2]));
  }
  /* 左上高光斑：没有它每块石头都是"平"的，整座山糊成一片 */
  px(g, x + Math.round(w * 0.20), y + Math.round(h * 0.18),
     Math.max(1, Math.round(w * 0.28)), 1, cp[3]);
  /* 右下压暗（光自左上 ⇒ 右下背光） */
  px(g, x + Math.round(w * 0.62), y + Math.round(h * 0.80),
     Math.max(1, Math.round(w * 0.30)), 1, cp[2]);
}

function makeJiashan() {
  const c = mkCanvas(YB_JIASHAN_W, YB_JIASHAN_H), g = c.getContext("2d");
  /* ⚠️ 这里**不许**铺矩形底色（第一版就是 `px(g, 0, 0, W, H, YB_JSEAM)`）。画布留透明，
     石缝由每块石头自己的 1px 描边拼出来 —— 见 jPebble 与 §5.7.3 文件头。 */
  /* [x, y, w, h, 配色] —— y 升序 = 从最远（上）那块开始画，下面的压住上面的底边 */
  /* ⚠️ 纵向步进必须**小于石高 3px 左右**：椭圆四角是缩进的（15×10 的椭圆四角各缩 ~2px），
     按石高排会露出 4px 的黑缝，整座山变成"悬浮的一摞盘子"；实例图的缝其实只有 1px 上下。
     所以石头是**互相压着**排，不是挨着排。 */
  const B = [
    [19,  0, 14, 10, YB_J1], [ 6,  2, 12,  9, YB_J2],                    // 顶
    [12,  7, 25, 11, YB_J1], [31,  9, 13, 10, YB_J1],                    // 上
    [17, 15, 20, 10, YB_J1], [ 1, 16, 17, 11, YB_J1], [35, 19, 12, 10, YB_J2],  // 中
    [ 7, 23, 25, 12, YB_J1], [29, 29, 16, 10, YB_J1],                    // 中下
    [ 0, 32, 19, 12, YB_J1], [17, 35, 23, 11, YB_J1], [35, 38, 13, 10, YB_J2],  // 底
    [ 4, 44, 20, 11, YB_J2], [23, 46, 22, 10, YB_J1], [10, 52, 24, 10, YB_J1]   // 底脚
  ];
  for (const b of B) jPebble(g, b[0], b[1], b[2], b[3], b[4]);
  /* 中央透洞：太湖石的"透"。⚠️ 不许画成一块方正的黑 —— 那看着像"挖了个洞"，
     不像石头透光。三块不等大的暗凑出个不规则形状才对。 */
  px(g, 21, 28, 6, 4, YB_JSEAM);
  px(g, 19, 31, 9, 5, YB_JSEAM);
  px(g, 23, 35, 5, 5, YB_JSEAM);
  /* 右侧一丛深灰石笋（实例图右缘那簇）：没有它整座山是一团浅色，缺个"锚" */
  jPebble(g, 38, 20,  8, 28, YB_J3);
  jPebble(g, 43, 33,  6, 15, YB_J3);
  /* 右下角一块棕石（实例图里唯一的暖色，压住右下角） */
  jPebble(g, 36, 47, 11, 12, YB_J4);
  /* ⚠️ 原来这里有一条 x2..47 横贯的"山脚接地暗带" —— 删了。它横跨整个画布宽，而画布
     已经没有底色，最底那块石头（x10..33）根本盖不住它，会在半空多出一条悬空的暗杠。
     接地的活儿交给石头自己的"下 28% 暗面"：假山只从墙顶露出 10px 一个头，山脚永远在
     影壁背后、看不见，本来也不需要。 */

  return { canvas: c, ax: Math.round(YB_JIASHAN_W / 2), ay: YB_JIASHAN_H,
           w: YB_JIASHAN_W, h: YB_JIASHAN_H };
}

/* --- 5.7.4 摆场 --- */
function buildYingbi() {
  /* 广场 x 范围与湖**同源** —— 都是 IX(7.0104) / IX(0.6972)（见文件头四）。
     这里直接读 WATER[0]，不抄数字。 */
  const X0 = WATER[0].x, PW = WATER[0].w, CX = X0 + PW / 2;
  const SPAN = YB_W * 2 + YB_DOOR_W + YB_GAP * 2;              // 204
  const HALF = SPAN / 2;                                       // 102
  const cw = CX - HALF + YB_W / 2;                             // 西影壁中心 = CX − 68
  const cd = CX;                                               // 月亮门中心
  const ce = CX + HALF - YB_W / 2;                             // 东影壁中心 = CX + 68

  for (const cx of [cw, ce]) {
    addProp(Object.assign({}, makeYingbi(YB_W, "win"), { x: cx, y: YB_BY, tag: "yingbi" }));
    mhSolid(cx, YB_BY, YB_W, YB_SOLID_D);
  }

  /* 月亮门：**两个**盒子夹出中间 20 宽的门洞 —— 门洞那一段不加盒，人和鸭子才能穿。
     ⚠️ 门洞的通行判据不是"视觉上的洞"，而是"这里没有 solids"：demo 的 blocked()
        和这里的 ptBlocked() 都是遍历 solids 的 AABB，看不见精灵长什么样。 */
  const jamb = (YB_DOOR_W - YB_DOOR_HOLE) / 2;                 // 16
  addProp(Object.assign({}, makeYingbi(YB_DOOR_W, "door"), { x: cd, y: YB_BY, tag: "yingbi" }));
  mhSolid(cd - (YB_DOOR_W / 2 - jamb / 2), YB_BY, jamb, YB_SOLID_D);   // 西侧门垛 = cd − 18
  mhSolid(cd + (YB_DOOR_W / 2 - jamb / 2), YB_BY, jamb, YB_SOLID_D);   // 东侧门垛 = cd + 18

  /* 假山：西影壁**背后**（北侧），略偏西 4px。YB_JIASHAN_DY = 4 ⇒ 墙顶只冒 10px 一个头
     （用户 2026-09-13：「往前移动一点假山，能够露出个头在墙后即可」）。 */
  const jx = cw - 4, jby = YB_BY - YB_JIASHAN_DY;
  addProp(Object.assign({}, makeJiashan(), { x: jx, y: jby, tag: "jiashan" }));
  mhSolid(jx, jby, YB_JIASHAN_W, YB_JIASHAN_D);
}

   特别小的那种」。所以整面墙由两种方格铺成，以「一楼顶」那条线为界：
       一楼（baseY − FLOOR_H 以下，34px）  浅棕方砖，12px 一格   ← "方砖"
       楼上（共 7 层）                     白色小方格，4px 一格   ← "特别小"
   门柱那一条由 §5.8.3 的幕墙盖住，所以"一楼除了大门"这句自然成立。
   ⚠️ 竖缝相位一律以**画布绝对 x** 起算（x0 是常量 26）：两栋楼 w 不同，若按各自
      左沿起算，同一排砖在两栋楼上会错开半格 —— 料石那版就栽过这个（§5.8.2b 旧注）。
   ⚠️ 4px 一格 × 461 宽 = 115 道竖缝、60 余道横缝：一律**一条 fillRect 一道缝**，
      不许"每格一个 px()"（那是 7800 次调用，bake 会肉眼可见地卡）。
   ⚠️ 本函数取代了第二版的料石补面 `dxWallSkin`（那是"只在门区四周补料石"的补丁；
      现在整面墙都换了皮，补丁无意义，一并删掉 —— 它的四条 build.py 断言换成了
      针对本函数的（断言只加强不放松）。 */
function dxWall2(g, x0, x1, eaveY, baseY) {
  const w = x1 - x0;
  const gy = baseY - FLOOR_H;                // 一楼顶 = 方砖 / 瓷砖的分界线
  /* 楼上 7 层：白色小方格瓷砖 */
  const yt = eaveY + 2, ht = gy - yt;
  px(g, x0, yt, w, ht, DX_WTILE);
  for (let y = yt + DX_TILE; y < gy; y += DX_TILE)
    px(g, x0, y, w, 1, DX_WTILEG);
  for (let x = x0 + DX_TILE; x < x1; x += DX_TILE)
    px(g, x, yt, 1, ht, DX_WTILEG);
  /* 一楼：浅棕方砖 */
  const hb = baseY + 1 - gy;
  px(g, x0, gy, w, hb, DX_BTILE);
  for (let y = gy + DX_TILE0; y < baseY; y += DX_TILE0)
    px(g, x0, y, w, 1, DX_BTILEG);
  for (let x = x0 + DX_TILE0; x < x1; x += DX_TILE0)
    px(g, x, gy, 1, hb, DX_BTILEG);
  px(g, x0, gy, w, 2, DX_BTILEG);            // 一楼顶线（两种墙皮的分界，也是第 1 道腰线）
  /* 楼层腰线：每层一道，8 层楼就是 7 道（第 7 道与一楼顶线重合，见上） */
  for (let f = 1; f < DX_FLOORS - 1; f++)
    px(g, x0, eaveY + f * FLOOR_H, w, 2, "rgba(14,18,28,0.14)");
  /* 檐下阴影带（照 30 段 §3.3，压在瓷砖之上） */
  for (let i = 0; i < 10; i++)
    px(g, x0, yt + i, w, 1, "rgba(14,18,28," + (0.34 * (1 - i / 10)).toFixed(3) + ")");
  /* 两层极淡噪点（照 30 段 §3.3；用局部 RNG，绝不碰共享流） */
  const rng = makeRng(5813);
  speckle(g, x0, yt, w, ht, "rgba(255,255,255,0.04)", (w / 3) | 0, rng);
  speckle(g, x0, yt, w, ht, "rgba(0,0,0,0.05)", (w / 2) | 0, rng);
}

/* --- 5.8.2c 窗阵（第四轮：窗宽 ×1.5 = 24，每层一排，避让中央玻璃带） ---
   ⚠️ 30 段 §3.5 的窗是 16 宽、全楼 11 列、**行位不与它自己的楼层线对齐**（首层上移
      30px 给门让位）。这里全部重排：每层**正中**一排（上下各 6px 压边），共 8 排。
   ⚠️ **左右各自成阵**：中央 104 宽的玻璃带把窗阵劈成两半，两半各自"从墙沿往带边"
      按**固定窗距**（§5.8.7 的 dxPitch）排，排得下几列是几列 ⇒ 两栋、两侧的列数可以
      不同（第八轮门组平移后实测：西楼 6 + 2 / 东楼 1 + 5）。
      若照 30 段那样从头等分、再挖掉中间的列，带边就会挂出**半扇窗**（第一轮门区
      擦除框就栽过这个，见 §5.8.5 旧注）。 */
function dxWinAt(g, wx, wy, glassCol) {
  px(g, wx - 1, wy - 1, DX_W2 + 2, WIN_H + 2, DX_WFRAME);          // 框外缘（浅灰白）
  px(g, wx + DX_W2, wy - 1, 1, WIN_H + 2, DX_WFRAMD);              // 框右缘背光
  px(g, wx, wy, DX_W2, WIN_H, "#2c3746");                          // 洞口
  px(g, wx, wy, DX_W2, 2, "rgba(10,13,20,0.58)");                  // 洞口上内侧
  px(g, wx, wy, 2, WIN_H, "rgba(10,13,20,0.44)");                  // 洞口左内侧
  px(g, wx + 2, wy + 2, DX_W2 - 6, 3, shade(glassCol, 0.28));      // 玻璃上高光
  px(g, wx + 3, wy + 6, DX_W2 - 9, 2, shade(glassCol, 0.12));
  px(g, wx + Math.round(DX_W2 * 0.38), wy + 4, 1, WIN_H - 8, DX_WFRAMD);   // 竖窗棂
  px(g, wx + 2, wy + Math.round(WIN_H * 0.62), DX_W2 - 4,
     Math.round(WIN_H * 0.34), shade(glassCol, -0.24));            // 下半扇（背光）
  px(g, wx - 2, wy + WIN_H, DX_W2 + 4, 3, "#e4e1d9");             // 窗台顶面受光
  px(g, wx - 2, wy + WIN_H + 3, DX_W2 + 4, 1, "rgba(14,18,28,0.28)");  // 窗台投影
}
function dxWindows(g, x0, x1, CX, eaveY, baseY, glassCol) {
  const bl = CX - DX_BW / 2, br = CX + DX_BW / 2;      // 中央玻璃带占的 x 区间
  /* ⚠️ 第八轮：窗距取**原布局那一档**（dxPitch），不再按各自的跨度拉伸 —— 带子一挪，
     两侧跨度就变得不等，各自拉伸会让一边挤、一边散（实测西楼左 7 列 pitch 34.6 /
     右 2 列 pitch 63.5）；固定窗距之后两栋楼的窗距处处一致，窗阵只是**少几列/多几列**，
     "楼体不变、只是门的位置变了"这句话才成立。 */
  const pitch = dxPitch(x0, x1);
  const run = (xa, xb) => {                            // 一侧的窗阵：从 xa 排到 xb
    const span = xb - xa;
    const step = pitch - DX_W2;                        // 窗间净距（原布局那一档）
    const n = Math.max(1, Math.floor((span + step) / pitch));   // 这一档窗距放得下几扇
    for (let f = 0; f < DX_FLOORS; f++) {
      const wy = baseY - (f + 1) * FLOOR_H + Math.round((FLOOR_H - WIN_H) / 2);
      for (let c = 0; c < n; c++)
        dxWinAt(g, Math.round(xa + c * pitch), wy, glassCol);
    }
  };
  run(x0 + DX_MARGIN, bl - DX_BGAP);
  run(br + DX_BGAP, x1 - DX_MARGIN);
}

/* --- 5.8.3 立面（自上而下：雨篷 → 玻璃高窗 → 门楣梁 + 金字 → 上亮窗 → 金属带 → 四扇门）
     层次与配色全部照 _photo/siyuandonglou.jpg 的列色剖面（见文件头 §四），
     只有纵向厚度是按"金字读得出来"重排的（见 §5.8.1 的取舍）。 --- */
function dxFacade(g, CX, baseY, CHARS) {
  const rng = makeRng(5813);        // ⚠️ 局部 RNG：绝不碰共享流（同 §5.5 的做法）
  const R = o => Math.round(CX + o);          // 相对中轴取整 —— 门必须严格居中
  const yTop = baseY - DX_TOP;
  const wr = DX_WR / 2, wm = DX_WM / 2, wb = DX_WB / 2;

  /* 0) 打底**不在这里做**：整面墙已经由 dxRestyle 用 §5.8.2b 的两种墙皮铺过了。
        ⚠️ 曾经这里填过一层 palette 平色 —— 门两边于是各挂一块又亮又平的浅色板
           （3× 一眼看出，四套自动验收全绿）。别再填回来。
        雨篷比门区每边宽 10 ⇒ 它下方那两条（门区外、雨篷内）露的就是那层料石墙。 */

  /* 1) 悬挑石雨篷（用户点名的"门最上边的石头挡雨台"） */
  px(g, R(-wr), yTop, DX_WR, 1, DX_APRON);              // 顶面受光
  px(g, R(-wr), yTop + 1, DX_WR, 1, "#c6c0b4");
  px(g, R(-wr), yTop + 2, DX_WR, 3, "#a9a397");         // 前沿立面
  px(g, R(-wr), yTop + DX_HT - 1, DX_WR, 1, "#6b675f"); // 下沿暗线
  px(g, R(-wr), yTop + 2, 2, 3, "#bcb6aa");             // 左端受光
  px(g, R(wr) - 2, yTop + 2, 2, 3, "#8e887c");          // 右端背光
  /* 悬挑板下方一道渐隐阴影：高窗顶因此"退"进雨篷里，雨篷才显得是**挑**出来的 */
  for (let i = 0; i < 3; i++)
    px(g, R(-wm), yTop + DX_HT + i, DX_WM, 1,
       "rgba(12,16,26," + (0.34 * (1 - i / 3)).toFixed(3) + ")");

  /* 2) 黑框玻璃高窗 —— 照片实测 #43433f→#515048，**反光很暗**，不是亮玻璃 */
  const yc = yTop + DX_HT;
  px(g, R(-wm), yc, DX_WM, DX_HC, DX_HIGLASS);
  px(g, R(-wm), yc, 2, DX_HC, DX_HIFRAME);              // 左端框
  px(g, R(wm) - 2, yc, 2, DX_HC, DX_HIFRAME);           // 右端框
  for (let i = 1; i < 6; i++)                           // 竖梃 → 6 格（照片里约 6 格）
    px(g, R(-wm + (DX_WM / 6) * i) - 1, yc, 2, DX_HC, DX_HIFRAME);
  px(g, R(-wm), yc + DX_HC - 1, DX_WM, 1, "#5c6258");   // 与门楣梁之间的分界
  /* 玻璃反光：照片里映的是室内天花（一条浅带）+ 院子里的树（一条绿） */
  px(g, R(-wm + 3), yc + 3, DX_WM - 6, 4, "rgba(158,166,160,0.32)");
  px(g, R(-wm + 9), yc + 9, DX_WM - 24, 3, "rgba(86,108,70,0.34)");

  /* 3) 门楣花岗岩梁 + 门头金字（**用户点名"字体必须完整复刻"**） */
  const yb = yc + DX_HC;
  px(g, R(-wb), yb, DX_WB, DX_HB, DX_STONE);            // 梁体（比门区每边宽 2）
  px(g, R(-wb), yb, DX_WB, 1, DX_STONE_L);              // 上棱受光（照片那道亮边）
  px(g, R(-wb), yb + DX_HB - 1, DX_WB, 1, DX_STONE_D);  // 下棱背光
  px(g, R(-wb), yb + 1, 1, DX_HB - 2, "#cfc9bd");       // 左端转角
  px(g, R(wb) - 1, yb + 1, 1, DX_HB - 2, "#9a9488");    // 右端转角
  speckle(g, Math.round(CX - wb), yb + 2, DX_WB, DX_HB - 3,
          "rgba(255,255,255,0.10)", 30, rng);           // 花岗岩颗粒
  speckle(g, Math.round(CX - wb), yb + 2, DX_WB, DX_HB - 3,
          "rgba(0,0,0,0.10)", 20, rng);
  /* 四字**压在颗粒之上**（先石后字），底对齐同一基线、整体居中（见 dxSign）。 */
  dxSign(g, CHARS, CX, yb + DX_HB / 2);

  /* 4) 上亮窗 —— **黑色玻璃**（第三轮：用户「多出来的区域放黑色玻璃」，门楣梁减半
        省下的 14px 全并到这一层，13 → 27）。照片里这段玻璃本来是映着院树的最暗一层
        （#1d1e19→#303224），底色换成近黑之后只留极淡的冷调反光，
        读起来就是梁下那面"通黑的门头玻璃"。
        ⚠️ 框格仍按 DX_DWN 分四格并与门扇对齐 —— 黑玻璃若不分格就成了一条黑带。 */
  const yl = yb + DX_HB;
  px(g, R(-wm), yl, DX_WM, DX_HL, DX_BLKG);
  px(g, R(-wm), yl, 2, DX_HL, DX_HIFRAME);              // 左端框
  px(g, R(wm) - 2, yl, 2, DX_HL, DX_HIFRAME);           // 右端框
  for (let i = 1; i < DX_DWN; i++)                      // 四格，与门扇对齐
    px(g, R(-wm + (DX_WM / DX_DWN) * i) - 1, yl, 2, DX_HL, DX_HIFRAME);
  px(g, R(-wm + 2), yl, DX_WM - 4, 1, "rgba(150,168,180,0.16)");   // 上沿一道冷光
  px(g, R(-wm + 14), yl + 8, 7, 4, "rgba(150,168,180,0.09)");      // 一块极淡的天光
  px(g, R(-wm + 9), yl + DX_HL - 9, DX_WM - 24, 5, mix(DX_BLKG, DX_TREE, 0.45)); // 极淡树影
  px(g, R(-wm), yl + DX_HL - 1, DX_WM, 1, "rgba(0,0,0,0.55)");     // 与金属带之间的暗缝

  /* 5) 金属横带（照片 y428..438 那条银灰亮线，亮窗与门组的分界） */
  const ym = yl + DX_HL;
  px(g, R(-wm), ym, DX_WM, DX_HM, DX_BAND);
  px(g, R(-wm), ym, DX_WM, 1, "#cdd1d5");

  /* 6) 四扇对开玻璃门（**照片如此**；第一版错画成"三开间/中旋转门"） */
  const yg = ym + DX_HM, dw = DX_WM / DX_DWN;
  px(g, R(-wm), yg, DX_WM, DX_HG, DX_DOORF);            // 整组底
  for (let i = 0; i < DX_DWN; i++) {
    const x0 = R(-wm + dw * i), x1 = R(-wm + dw * (i + 1));
    px(g, x0, yg, 2, DX_HG, DX_DOORF);                              // 左竖梃
    px(g, x1 - 2, yg, 2, DX_HG, DX_DOORF);                          // 右竖梃
    px(g, x0 + 2, yg + 2, x1 - x0 - 4, DX_HG - 4, DX_DOOR);         // 门玻璃（室内极暗）
    px(g, x0 + 3, yg + 3, x1 - x0 - 6, 4, "rgba(158,172,186,0.09)"); // 玻璃上沿反光
    px(g, x0 + 4, yg + 16, 9, 3, "rgba(126,84,152,0.50)");          // 紫色小告示牌
  }
  /* 把手：中缝（第 2、3 扇之间）两侧各一根竖条 */
  px(g, R(-wm + dw * 2) - 4, yg + 9, 1, 11, "#b9bcc0");
  px(g, R(-wm + dw * 2) + 3, yg + 9, 1, 11, "#b9bcc0");
  px(g, R(-wm), yg + DX_HG - 2, DX_WM, 2, "#080a0c");   // 地槛
  /* 楼体与门组的接地接缝 */
  px(g, R(-wm), baseY - 1, DX_WM, 1, "rgba(30,34,40,0.35)");
}

/* --- 5.8.3b 中央蓝色玻璃带（第四轮新增） ---
   用户：「从大门垂直到楼顶这一个垂直带，都是蓝色的玻璃带，可以参考思源楼的蓝色玻璃带，
   不过思源楼只分成了两列玻璃，我们可以多分点，比如 5 列，但是宽度不能超过大门宽度」。
   ⇒ 下端接在**雨篷上沿**（= 门区顶，yTop），上端顶到檐口（eaveY）；宽 104 = 门区宽
      （"不超过大门宽度"这条就是 DX_BW = DX_WG 一行）。
   配色照 §5.1 思源楼幕墙（frozen demo 段里的 `SY_COL`，用法见 51_siyuan_top.js）：
   `GLASS` 底 + `GLASS_HI` 斜向反光 + `GLASS_D` 分格/竖梃；连"i % 3 的斜条、
   左半亮右半暗"都照抄。只有两处是我们的：**5 列**（思源楼 2 列），
   以及**横向分格取 FLOOR_H 一道**（思源楼是 14 native px = 21 世界像素）——
   通高幕墙跟着楼层分格，才与左右窗阵"每层一排"、与墙上的楼层腰线同节奏。
   ⚠️ 只读 `SY_COL`、不抄色号；且**必须在函数里读** —— 它定义在 frozen demo 段里，
      外层脚本的加载顺序不保证，写在顶层会撞 const 的暂时性死区（PALETTE 那个坑的同款）。 */
function dxBand(g, CX, eaveY, yBot) {
  const C = SY_COL;
  const bw = DX_BW, bl = Math.round(CX - bw / 2), h = yBot - eaveY;
  px(g, bl, eaveY, bw, h, C.GLASS);
  for (let i = 0; i < bw; i++)                             // 斜向反光（照 Demo §3.5.7）
    px(g, bl + i, eaveY + (i % 3), 1, h, i < bw / 2 ? C.GLASS_HI : shade(C.GLASS_HI, -0.1));
  for (let y = eaveY + FLOOR_H; y < yBot; y += FLOOR_H)    // 横向分格：一道一层
    px(g, bl, y, bw, 1, C.GLASS_D);
  for (let i = 1; i < DX_BC; i++)                          // 5 列 ⇒ 4 道竖梃
    px(g, bl + Math.round((bw / DX_BC) * i) - 1, eaveY, 2, h, C.GLASS_D);
  px(g, bl, eaveY, 2, h, C.GLASS_D);                       // 左右边框
  px(g, bl + bw - 2, eaveY, 2, h, C.GLASS_D);
  px(g, bl, eaveY, bw, DX_BGT, shade(C.WALL, -0.1));       // 顶部收口（照 Demo）
  px(g, bl, eaveY + DX_BGT, bw, 2, "rgba(14,18,28,0.22)"); // 收口下的一道浅影
}

/* --- 5.8.3c 檐口轮廓线 / 左右棱光 / 雨水管 / 接地窄带（第四轮新增） ---
   ⚠️⚠️ **这四笔原本是 30 段画在墙面上的，第四轮整面墙一擦就全没了** ——
      不补回来就是"墙上少根雨水管、楼两侧没有棱光"，而 accept / verify / zoomtest /
      `_propdiff` **四套自动验收一个都不会报**（它们都不看画面）。
      位置与节奏照 30_building.js §3.3/§3.6/§3.8 原样；只有取色变了：
      原来是 `shade(wall, ±)`，现在墙有**两种**底色（白瓷砖 / 棕方砖），
      同一个 wall 色既算不出白瓷砖上该有的亮棱、也算不出棕方砖上该有的暗棱，
      所以换成中性叠加色（白/黑半透明）—— 两种底上都成立。
   ⚠️ 左右**外轮廓**那两条竖线（x0−1 / x1）不在擦除框里、原样保留，这里不重画：
      重画会把半透明的暗色压在原来的实色线上，两栋楼的轮廓深浅就不一致了。 */
function dxEdges(g, x0, x1, eaveY, baseY) {
  const wallH = baseY - eaveY;
  px(g, x0 - 1, eaveY + 1, x1 - x0 + 2, 1, "rgba(24,28,36,0.40)");   // 檐口轮廓线（横）
  px(g, x0, eaveY + 2, 3, wallH, "rgba(255,255,255,0.26)");          // 左棱受光
  px(g, x1 - 4, eaveY + 2, 4, wallH, "rgba(20,24,32,0.20)");         // 右棱背光
  const pipeX = x1 - 7;                                              // 雨水管（照 §3.6）
  px(g, pipeX, eaveY + 3, 3, wallH - 3, "#8f949b");
  px(g, pipeX, eaveY + 3, 1, wallH - 3, "#b2b7be");
  px(g, pipeX - 1, Math.round((eaveY + baseY) / 2) - 5, 5, 2, "#7d8188");
  px(g, pipeX - 1, baseY - 12, 5, 2, "#6f737a");
  contactBand(g, x0 + 1, x1 - 1, baseY - 1, 2, 0.34);                // 接地最深窄带（照 §3.8）
}

      ⇒ 顶面往北一直铺到牌面**顶边**（`signRect` 现算），牌面连它右下那道 3px 投影才盖得干净。

      角度看的（观者看得到牌，是因为牌立在屋面上；探出体在檐口之南，屏幕上不遮牌面）。
      所以这里把顶面的**铺色范围**往北延伸到牌面顶上 —— 用屋面同料把牌那一块重新铺平，
      等价于"牌不在了"。这是本项目既定的**覆盖**手法（同第五轮撤字），不是擦除。
 *   ⚠️ 第八轮（门组按用户要求平移，见 §5.8.7）**把"盖牌"从"盖探出体"里拆开了**：

      遮盖于是由"一块"变"两块"：① 探出体那一条（中轴 = doorCX，宽 = 玻璃带宽）；
      ② 牌面那一块（中轴 = 建筑中轴，按 signRect 现算）。**少画②那四个金字就原地露出来**，
      而 accept / verify / zoomtest / _propdiff 四套自动验收一律全绿。 */
function dxRoofBand(g, x0, x1, eaveY, doorCX, name, roof) {
  const w = x1 - x0, CX = (x0 + x1) / 2;               // **建筑**中轴：屋名标牌挂在这条轴上
  const PADT = 18, roofT = eaveY - PADT;               // 屋面顶边 / 板厚（照 30 段 §3.2）
  const sgn = name ? makeSign(name) : null;
  const sg = sgn ? signRect(sgn, x0, w, eaveY) : null;
  const bw = DX_BW;                                    // 探出体宽 = 玻璃带宽（同一条带、同一条轴）
  const bl = Math.round(doorCX - bw / 2), br = bl + bw;
  const pTop = eaveY - 3;                              // 探出体北端：檐口之北 3px（盖住檐口横线）
  const pBot = eaveY + DX_OUTS;                        // 探出体南端：檐口往南探出 DX_OUTS
  /* 要铺平（盖住）的两块屋面 —— 只有两块都盖到，楼顶才是"凸"形 + 牌不在：
     ① 探出体那一条：中轴 = 门组中轴（第八轮起可偏），檐口之北 3px → 檐口之南 DX_OUTS；
     ② 屋名标牌那一块：牌挂在**建筑中轴**上、不随门走，按牌面现算（顶边 sg.y − 2 是北界）。
     ⚠️ 两块都是"同料盖上去"的正当遮挡，**只盖不擦**（见本节标题下的第 3、4 条 ⚠️）。 */
  const covers = [{ x0: bl, x1: br, y0: pTop, y1: pBot }];
  if (sg) covers.push({ x0: sg.x - 2, x1: sg.x + sg.w + 5, y0: sg.y - 2, y1: eaveY });
  const rng = makeRng(5807);                           // ⚠️ 局部 RNG：绝不碰共享流（同 §5.8.3）
  for (const cv of covers) {
    /* 1) 顶面：一块与板面同料的水平面（30 段 §3.2 板面那一句） */
    px(g, cv.x0, cv.y0, cv.x1 - cv.x0, cv.y1 - cv.y0, shade(roof, -0.04));
    /* 2) 补回被顶面盖掉的分坡脊线（j = 1..3，式子与 30 段逐字同源） */
    for (let j = 1; j <= 3; j++) {
      const y = PADT + Math.round((roofT - 12) * j / 4) + 6;
      if (y < cv.y0 || y >= cv.y1) continue;
      const a = Math.max(cv.x0, x0 + 5), b = Math.min(cv.x1, x1 - 5);
      if (b > a) px(g, a, y, b - a, 1, "rgba(255,255,255,0.08)");
    }
    /* 3) 补回被顶面盖掉的斑点（30 段 §3.2 那两条 speckle 的同一区间） */
    const a0 = Math.max(cv.x0, x0 + 4), a1 = Math.min(cv.x1, x1 - 4);
    const t0 = Math.max(cv.y0, PADT + 7), t1 = Math.min(cv.y1, eaveY - 5);
    if (a1 > a0 && t1 > t0) {
      speckle(g, a0, t0, a1 - a0, t1 - t0, "rgba(255,255,255,0.05)", ((a1 - a0) / 3) | 0, rng);
      speckle(g, a0, t0, a1 - a0, t1 - t0, "rgba(0,0,0,0.07)", ((a1 - a0) / 4) | 0, rng);
    }
  }
  /* 4) 南沿：檐口投影线（同 30 段那句）+ 探出段左右两条端线（与墙面白瓷砖的分界） */
  px(g, bl, pBot - DX_ORIM, bw, DX_ORIM, shade(roof, -0.60));
  px(g, bl, eaveY, 1, DX_OUTS, "rgba(14,18,28,0.30)");
  px(g, br - 1, eaveY, 1, DX_OUTS, "rgba(14,18,28,0.30)");
}
/* --- 5.8.4 门前台阶（照片里是三级花岗岩条石，逐级加宽、每级有竖缝） --- */
function dxStair(g, CX, baseY) {
  const R = o => Math.round(CX + o);
  for (let i = 0; i < DX_ST; i++) {
    const sw = DX_WG + 20 + i * 8, sx = R(-sw / 2), sy = baseY + i * DX_SH - 1;
    px(g, sx, sy, sw, DX_SH, shade(DX_STEP, -0.05 * i));
    px(g, sx, sy, sw, 1, "#ded8ca");                          // 踏步鼻迎光
    px(g, sx, sy + DX_SH - 1, sw, 1, "rgba(14,18,28,0.24)");  // 踢面阴影
    for (let k = 1; k < 4; k++)                               // 条石竖缝
      px(g, sx + Math.round(sw * k / 4), sy + 1, 1, DX_SH - 1, "rgba(14,18,28,0.14)");
  }
}

  for (let y = apex; y < fTop; y++) {
    const ac = Math.round(half * (y - apex) / span);        // 南坡左右界（距中轴的偏移）
    const xl = y >= nTop ? bl : Math.round(cx - half * (y - apex) / drop);
    const xr = y >= nTop ? br : Math.round(cx + half * (y - apex) / drop);
    const ml = cx - ac, mr = cx + ac;
    px(g, xl, y, xr - xl, 1, DX_WTILE);                         // 南坡（主可见面）
    if (ml > xl) px(g, xl, y, ml - xl, 1, DX_ATT_WL);           // 西坡（左上受光）
    if (xr > mr) px(g, mr, y, xr - mr, 1, DX_ATT_WD);           // 东坡（背光）
    px(g, ml, y, 1, 1, shade(DX_WTILE, -0.45));                 // 戗脊（西）
    px(g, mr - 1, y, 1, 1, shade(DX_WTILE, -0.45));             // 戗脊（东）
    px(g, xl, y, 1, 1, shade(DX_WTILE, -0.55));                 // 左右外轮廓
    px(g, xr - 1, y, 1, 1, shade(DX_WTILE, -0.55));
  }
  px(g, bl, fTop - 2, DX_ATT_W, 2, shade(DX_WTILE, -0.60));   // 底沿：白尖顶与白塔面的分界
}

/* --- 5.8.7 门组横向平移（第八轮，2026-09-17） ---
   用户：「将思源西楼的大门连同其蓝色窗户带和突起一同向右移动两个窗户的距离，楼体宽度高度
   都不变，只是大门位置变化，将思源东楼的大门连同其窗户带，楼顶突起一起向左移动两个窗户
   的距离其他不变」
   ⇒ **门组 = 门（§5.8.3）+ 中央蓝玻璃带（§5.8.3b）+ 楼顶探出体（§5.8.3d）+ 门前台阶
      （§5.8.4）**，这四件共用一条中轴，一起平移；楼体（两种墙皮 §5.8.2b、窗阵 §5.8.2c、
      棱光/檐口线/雨水管 §5.8.3c）宽高与位置一概不动。
   ⚠️ 「两个窗户的距离」= **2 × 窗距**，窗距 = 窗宽（DX_W2）+ 窗间净距。净距**不是常量**：
      §5.8.2c 的窗阵是"从墙沿到带边等分"的（净距由跨度反解出来），所以两栋楼的窗距不同
      （西 41.5 / 东 39.75）⇒ 必须**现算**，存一个数另一栋就偏。现算口径按**原布局**
      （带子还在建筑中轴上时）量左侧那半 —— 两半跨度恒相等（wx0/wx1 与 axB 都关于画布
      中心对称），取哪半都一样。
   ⚠️ 窗阵**跟着带子走**：`dxWindows` 的两半是从带边 bl/br 向墙沿等分的，带子一挪，
      两侧的窗自己就重排（墙上的窗不可能与那条带重叠）。实测西楼 4+4 → 6+2、东楼 3+3 → 1+5。
   ⚠️⚠️ 屋名标牌**不跟着走**：`signRect` 把它挂在**建筑中轴**（x0 + w/2）上 —— 第八轮之前
      探出体正好也在这条轴上、顺手把它盖住了；门一挪就盖不到，所以 §5.8.3d 拆出**第二块**
      遮盖（按牌面现算）。**这是本轮最容易漏的一处**：漏了那四个金字会原地露出来，而
      accept / verify / zoomtest / _propdiff 四套自动验收**全都看不见**。
   ⚠️ 门前净空（§5.8.6）跟着门走：`DX_DOORS` 登记的是**门**的世界坐标，装配处那一行要加上
      同一个偏移（`60_assemble.js` §6.2），否则清掉的还是旧门前面那棵树。 */
const DX_DOOR_K = { "思源西楼": +2, "思源东楼": -2 };   // 门组平移量（单位 = 窗距），正 = 向右

/* 原布局的**窗距**（窗宽 + 窗间净距）。纯函数：只吃正面墙的左右边界。
   ⚠️ 口径必须在**原布局**上取 —— 即"带子还挂在建筑中轴（= (x0+x1)/2）上"那一版：
      跨度 = 墙沿内的窗阵区到带边，列数照 §5.8.2c 的算式反解，净距随跨度定死。
      拿新中轴去量就会自相矛盾（量出来的窗距会跟着结果变）。
   ⚠️ 净距**不是常量**：它由跨度反解（西 17.5 / 东 15.75）⇒ 存一个数另一栋就错。 */
function dxPitch(x0, x1) {
  const cx = (x0 + x1) / 2;                                   // 建筑中轴（原布局的带子中轴）
  const span = (cx - DX_BW / 2 - DX_BGAP) - (x0 + DX_MARGIN);
  const n = Math.max(1, Math.floor((span + DX_GAP2) / (DX_W2 + DX_GAP2)));
  return DX_W2 + (span - n * DX_W2) / (n - 1 || 1);
}

/* 门组中轴相对建筑中轴的偏移（世界像素）。纯函数：只吃画布宽与楼名。
   ⚠️ 取整必须**按绝对值**再补符号：`Math.round` 是"向 +∞ 取半"，`Math.round(−79.5)`
      得 **−79**（不是 −80）⇒ 东楼会少挪 1px，右侧跨度正好卡在临界上、**少排一列窗**
      并在墙右端留一条 40px 的空墙（实测出图才看见）。 */
function dxDoorShift(canvasW, name) {
  const k = DX_DOOR_K[name] || 0;
  if (!k) return 0;
  return (k < 0 ? -1 : 1) * Math.round(dxPitch(DX_PADX, canvasW - DX_PADX) * Math.abs(k));
}

/* --- 5.8.5 覆盖重绘（由 60_assemble.js §6.2 调用，必须在 addProp 之前） ---
   ⚠️ 不像 §5.5 要另开一张加高的画布：台阶只有 3×3 = 9 px，本就落在 canvas 底部
      那 35 px（= SHY 21 + 14）里，直接在原画布上重绘即可。
   ⚠️ **第四轮起擦的是整面墙**（x0..x1 × eaveY+1..baseY）：墙皮整个换成两种方格，
      不再是"只补门区那条带"。门区下方再单擦一块，把 30 段的旧门/旧雨棚/旧台阶清掉；
      两条 clearRect 有重叠也无害（边界都取整像）。
   ⚠️ 上界一律 **eaveY+1**：30 段 §3.8 把整栋的外轮廓线画在 eaveY+1 那一行上，
      擦到 eaveY 就把轮廓擦没了（横向那一条由 §5.8.3c 补回，两侧竖线在擦除框之外）。
   ⚠️ `roof` = 30 段用的那个屋面色（装配处从 `PALETTE` 取，与 30 段**同源**），
      只给 §5.8.3d 的探出体顶面用：顶面必须与板面同色，楼顶的"凸"才读得出来。
      本文件**不另存一份色号**（"派生量不许再存一份"是同一条精神）。 */
function dxRestyle(b, CHARS, name, roof) {
  const c = b.canvas, g = c.getContext("2d");
  const H = c.height;
  b.__dx = true;      // 给 §5.8.6 的门前净空"认门"用（addProp 的 Object.assign 会带走它）
  /* ⚠️ 层数必须与装配处（60_assemble.js 的 styleOf）同步：
     3 层 ⇒ H ∈ {259,269}；8 层 ⇒ H ∈ {429,439}；**第十六轮起 6 层 ⇒ H ∈ {361,371}**。
     对不上说明层数或 30 段的 PADT/SHY 被动过 —— 那时 eaveY 会算错，整面墙的腰线与窗阵
     一起错位。 */
  if (H !== 361 && H !== 371)
    console.warn("58_dxdoor: 精灵高 %d 不在 {361,371} —— styleOf 的层数或 30 段的 PADT/SHY 改了？", H);
  const baseY = H - 35;                     // 见文件头 §三 的推导
  const eaveY = baseY - DX_WALLH;           // 檐口（墙顶）
  /* ⚠️ 第八轮起**两条轴要分开**（§5.8.7）：
     `axB` = 建筑中轴（= b.ax）—— 屋名标牌挂在它上面，不随门走；
     `CX`  = 门组中轴 —— 门 / 玻璃带 / 楼顶探出体 / 台阶四件共用，按楼名平移 k 个窗距。 */
  const axB = c.width / 2;                     // 建筑中轴
  const CX = axB + dxDoorShift(c.width, name); // 门组中轴（西楼 +83 / 东楼 −80）
  const yTop = baseY - DX_TOP;              // 雨篷上沿 = 中央玻璃带的下端
  const wx0 = DX_PADX, wx1 = c.width - DX_PADX;   // 30 段 §3.1：正面墙 = x0..x1
  /* 门区下方那一块：**宽度从 30 段的旧门几何反推**，不写死数字 —— 旧门中轴会按
     `doorSide` 偏 0.22w（实测偏 18.2 / 16.7），加上雨棚出挑 10 与台阶最宽一级 89/2，
     最远到中轴 ±63.2 ⇒ 这里取 ±(DX_WR/2 + 4) = ±66，两栋都留 ≥2.8px 余量。
     上界取雨篷上沿 yTop（30 段旧雨棚顶在 baseY−57，够不到 yTop；再往上由整面墙那次擦）。
     ⚠️ 第八轮：横向取**旧门与新门的并集** —— 30 段那扇旧门仍留在建筑中轴附近，
        而它的台阶画在 baseY **之下** 9px（整面墙那次擦除够不到），不并进来的话
        旧台阶会原地留在新墙脚下。 */
  const dx0 = Math.round(Math.min(CX, axB) - DX_WR / 2 - 4);
  const dx1 = Math.round(Math.max(CX, axB) + DX_WR / 2 + 4);
  const dTop = Math.min(yTop, baseY - 57);
  g.clearRect(wx0, eaveY + 1, wx1 - wx0, baseY - eaveY);
  g.clearRect(dx0, dTop, dx1 - dx0, (baseY + DX_ST * DX_SH + 4) - dTop);
  /* ⚠️⚠️ 探针**必须**夹在"擦完、重铺之前"，而且**绝不许再出现无条件 `return`** ——
     上一版把探针写成无条件 `return b;` 用完忘删，门区于是一直是空的，
     四套自动验收全绿（详见文件头 §五）。改这个函数时必须出图。 */
  if (window.__DXBARE__) return b;      // 探针：只擦不补，查旧门/旧墙皮的残留
  /* ⚠️ 玻璃色必须与 30 段同源，所以读 PALETTE 而不是写死色号；且**必须在函数里读**：
     58 段在 60 段（PALETTE 的定义处）之前加载，写在顶层会撞 const 的暂时性死区
     ⇒ 整个 script 死在加载期。 */
  const glassCol = PALETTE[styleOf("思源东楼").p].glass;
  dxWall2(g, wx0, wx1, eaveY, baseY);                 // 两种墙皮（§5.8.2b）
  dxWindows(g, wx0, wx1, CX, eaveY, baseY, glassCol); // 8 层窗阵（§5.8.2c）
  dxBand(g, CX, eaveY, yTop);                         // 中央玻璃带（§5.8.3b）
  dxFacade(g, CX, baseY, CHARS);                      // 门（§5.8.3）
  dxStair(g, CX, baseY);                              // 台阶（§5.8.4）
  dxEdges(g, wx0, wx1, eaveY, baseY);                 // 棱光/檐口线/雨水管/接地（§5.8.3c）
  /* 楼顶那一段（第五轮立、第六轮改成朝观者探出）：**必须最后画** —— 它要从檐口横线、
     屋面各笔、屋名标牌上面盖过去。传 doorCX 是因为探出体挂在**门组中轴**上（第八轮起
     可偏）；传 name/roof 是为了按 makeSign 现算标牌范围、让探出体的顶面与屋面**同料**
     （见 §5.8.3d）。 */
  dxRoofBand(g, wx0, wx1, eaveY, CX, name, roof);
  /* 第十五轮：楼顶阁楼 + 塔尖（§5.8.3e）。**必须压在 dxRoofBand 之后** —— 塔基正好落在
     探出体的顶面上，先画塔就会被探出体那笔顶面盖掉半截（四套自动验收全绿，只有出图看得见）。 */
  dxAttic(g, CX, eaveY);
  return b;
}

/* --- 5.8.6 门前净空：门口正前方长出来的树要清掉 ---
   用户 2026-09-13 第三轮：「把西楼门口的树清除」。西楼门口正前方长了一棵 54×104 的
   针叶树（美术盒 x1414..1468 / y1361..1465、接地 1460），树冠正好糊在门脸上。
   ⚠️ 与 §5.3.10 clearDiaClearance 同一套做法：**摆完之后按美术盒删**，不是改散射种子 ——
      删完没动任何随机流，`_propdiff` 里只会少掉被删的那一件，可解释、可核对。
   ⚠️ 只删**树**（tag tree / lawnTree）：灌木矮、糊不住门，一并删就越权改了绿化。
   ⚠️ 必须排在 §6.6c clearPropTreeClash() **之后**：那个函数对带 tag 的道具原样放行，
      所以先后顺序不影响它 —— 但同一族的净空（旗杆 / 雕塑 / 体育馆台阶）都在它后面，
      保持一致，免得将来谁把顺序挪了才发现计数对不上。
   ⚠️ 判据用**美术盒**（树冠比树干宽得多，按接地点判会漏）。两栋楼**对称**清 ——
      用户只看见西楼那棵，但东西楼是同一套代码（实测东门前本来就干净，只会删西楼那棵）。
   ⚠️⚠️ **门的坐标只能从装配处登记进来，不能在 props 里找楼**：建筑是 addProp 造的
      道具，而 addProp 是**按白名单复制**的（`props.push({ img, ax, ay, x, y, baseY, tag })`）
      —— 挂在建筑对象上的记号 `b.__dx` 在那一刻就被丢掉了。第一版**按记号过滤 props
      找门**（那行代码已删，这里不再逐字抄它 —— 抄了会让 build.py 的否定断言假失败，
      与 §5.6 湖心圆盘那次踩的是同一个坑）⇒ `DX_DOORS` 恒空 ⇒ 净空一棵树都没删，
      而 accept 34/34、verify、zoomtest、`_propdiff` 四套全绿（**又一个只有出图才能
      发现的事故**，与 §5.8 头部那次 `return b;` 同一个教训）。
      ⇒ `DX_DOORS` 由 `60_assemble.js` 的建筑循环 push（那里是唯一算得出世界坐标的地方）。 */
const DX_DOORS = [];      // 思源东/西楼门的世界坐标 [{x,y}, ...]，装配时登记
const DX_CLR_SIDE = 20;   // 门前净空比雨篷每边再宽 20
const DX_CLR_DY = 6;      // 净空上界：楼基线以北 6px（贴住楼基，别往北啃）
const DX_CLR_D = 56;      // 净空进深：楼基线以南 56px（够盖住树的整个落地段）
function clearDxDoorFront() {
  if (!DX_DOORS.length) return 0;   // 没登记门 ⇒ 什么都不动（宁可不删，绝不误删）
  const hw = DX_WR / 2 + DX_CLR_SIDE;
  const keep = [];
  let dropped = 0;
  for (const p of props) {
    if (p.tag !== "tree" && p.tag !== "lawnTree") { keep.push(p); continue; }
    const x0 = p.x - p.ax, y0 = p.y - p.ay;
    let hit = false;
    for (const d of DX_DOORS) {
      if (x0 < d.x + hw && x0 + p.img.width > d.x - hw &&
          y0 < d.y + DX_CLR_D && y0 + p.img.height > d.y - DX_CLR_DY) { hit = true; break; }
    }
    if (hit) { dropped++; continue; }
    keep.push(p);
  }
  props.length = 0;
  for (const p of keep) props.push(p);
  return dropped;
}

/* ============================================================================
 * §5.9 新体育馆 正面按实拍覆盖重绘
 *      —— 源：预览/xintiyuguan1.jpg / xintiyuguan2.jpg（用户提供的两张实拍）
 * ----------------------------------------------------------------------------
 * 一、用户口径（逐字）
 *   「我们试着复刻新体育馆的正面，也就是那两张图片，并没有任何字体，可以理解为
 *     墙面就是灰色长条形的瓷砖，纵向排布的，然后中间高度的区域是一块蓝色玻璃带，
 *     不过这个玻璃带并没有水平贯穿建筑，并不长。」
 *   外加一条当面拍板：**立面不要任何字** —— 精灵上那块深色「新体育馆」屋名标牌撤掉。
 *
 * 二、为什么是"覆盖重绘"而不是改模板
 *   与 §5.5 老体育馆、§5.8 思源东/西楼同一条路子：30_building.js 是全校**所有**楼的
 *   通用生成器，用户明确说过"先不要改建筑物，碰之前先问"。这里把檐下沿以下整段
 *   clearRect 掉、按照片重画。擦除是安全的：那一段像素只属于本精灵自己，底图
 *   （地面烘焙层）不在这个 canvas 里，擦掉后面就是透明。
 *
 * 三、撤屋名牌是**两步**，不能只做一步
 *   ① 30 段把牌子挂在**檐口之上**（signRect: y = eaveY − 8 − h），所以
 *      `clearRect(0, eaveY, …)` 擦不到它 —— 必须**另外**把标牌那一条矩形擦掉。
 *   ② 而 makeSign(XG_NAME) 又**必须照调**：verify.py 的屋名标牌自检读 _signCache，
 *      不调就报 MISS:新体育馆。所以是"调但不画"。
 *      擦掉之后要**按 30 段的同一套笔法把屋面补回来**（板面色 / 斑点 / 分坡脊线），
 *      否则屋顶上会留一块干净的空洞 —— 三套自动验收一个都查不出。
 *
 * 四、身高
 *   用户在 AskUserQuestion 里选了「5 层 / 墙高 170px」（原 3 层 102px，屋顶板 190px
 *   占精灵 2/3，像一张煎饼）。这只改 60_assemble.js 的 styleOf 里的一个数、
 *   外加本文件的 XG_FLOORS —— 落地线的世界坐标**不动**，所以碰撞盒、地面分类、
 *   散射流全都不受影响（build.py 用正则把这两处钉在一起）。
 *
 * 五、几何一律**反解**，不存第二份常量
 *   30 段 `makeBuilding` 的画布高 = PADT + roofT + wallH + SHY + 14，而 `makeBuilding`
 *   的返回值里**没有色号也没有 roofT**。所以本段从 `c.height` 反解 roofT
 *   （见 `xgGeo`），立面各分带再按 `wallH` 的**比例**现算 —— 用户明确交代过的
 *   铁律：「派生量不许再存一份常量」（56_minghu.js 踩过，湖一改贴湖坐标全废）。
 * ==========================================================================*/

const XG_NAME   = "新体育馆";
const XG_PADX   = 26, XG_PADT = 18;          // 与 30 段同值
const XG_FLOORS = 5;                         // ⚠️ 必须等于 styleOf("新体育馆").floors
const XG_PADB   = 21 + 14;                   // SHY + 14 —— 30 段画布高公式的尾巴

const XG_PAL = {
  RIB:    "#8b8f95", RIB_D: "#6e737a", RIB_L: "#a3a7ad",     // 灰肋墙（纵向长条瓷砖）
  RIB_TOP:"#9aa0a6", RIB_BOT: "#666b71",
  FRAME:  "#787d83", FRAME_D: "#54585d",                     // 玻璃凹框
  GLASS:  "#3d6c9c", GLASS_L: "#79a5cf",                     // 蓝玻璃带本体
  REFL:   "rgba(40,66,44,0.52)", REFL_HI: "rgba(84,120,74,0.40)",   // 树影（半透明，见 xgGlass）
  PLINTH: "#4e5156", PLINTH_D: "#33373b", PLINTH_L: "#5c6166"
};

/* --- 5.9.0 几何：全部从画布高反解 --------------------------------------- */
function xgGeo(c, roofCol) {
  const wallH = XG_FLOORS * FLOOR_H;
  const roofT = c.height - XG_PADT - wallH - XG_PADB;     // 反解，不存第二份
  const eaveY = XG_PADT + roofT;                          // 檐下沿 = 墙顶
  const gy0   = eaveY + Math.round(wallH * 0.26);         // 蓝玻璃带上沿
  return {
    roofCol: roofCol,
    x0: XG_PADX, x1: c.width - XG_PADX,
    roofT: roofT, wallH: wallH, eaveY: eaveY, baseY: eaveY + wallH,
    /* 带高 ≈ 1/3 墙高、上沿离檐口 0.26 墙高 ⇒ 带下方到基座顶还剩 0.23 ⇒ 上下大致对称
       （第一版取 0.32，带子明显偏高、下面只剩一条窄灰边）。 */
    gy0: gy0, gy1: gy0 + Math.round(wallH * 0.33),
    plinth: Math.round(wallH * 0.18),                     // 底部深灰基座带高
    /* 玻璃带占立面宽的比例。**必须 < 1** —— 用户口径："这个玻璃带并没有水平贯穿建筑，
       并不长"。第一版取 0.78，出图后一眼看出还是太通长（照片里两端各留一大段肋墙），
       收到 0.66。这条是 build.py ⑤ 钉着的。 */
    gw: 0.66
  };
}

/* --- 5.9.1 灰肋墙：竖向长条瓷砖铺满一段 -------------------------------
   照片里肋是**上下贯通**的（玻璃是凹进去的一块，不是把肋切断）。
   缝按**绝对 x 取模**（x0 是 26，相位恒定），与 30 段的砖纹同一套路子。 */
function xgRibs(g, x0, x1, y0, y1) {
  const P = XG_PAL;
  px(g, x0, y0, x1 - x0, y1 - y0, P.RIB);
  for (let x = x0; x < x1; x += 7) {
    px(g, x, y0, 2, y1 - y0, P.RIB_D);                     // 缝
    px(g, x + 2, y0, 1, y1 - y0, P.RIB_L);                 // 缝右侧的受光棱
  }
  px(g, x0, y0, x1 - x0, 2, P.RIB_TOP);                    // 段顶受光
  px(g, x0, y1 - 2, x1 - x0, 2, P.RIB_BOT);                // 段底背光
}

/* --- 5.9.2 蓝玻璃带：**不水平贯穿**的一段，凹在肋墙里 -----------------
   暗色端锚 SY_COL.GLASS —— 与图书馆、思源楼幕墙共享阴影色。
   ⚠️ SY_COL 定义在 frozen demo 段里，**只能在函数内读**（58_dxdoor.js 的 PALETTE
      顶层读过一次：加载期整个 <script> 死、页面全白，三套自动验收一个都查不出）。 */
function xgGlass(g, x0, x1, y0, y1) {
  const P = XG_PAL, GD = SY_COL.GLASS;
  const w = x1 - x0, h = y1 - y0;
  /* 凹框：外圈比肋墙深一档，上棱受光、下棱压暗 —— 玻璃是"嵌进去"的 */
  px(g, x0 - 4, y0 - 4, w + 8, h + 8, P.FRAME_D);
  px(g, x0 - 4, y0 - 4, w + 8, 2, P.FRAME);
  px(g, x0 - 4, y0 - 4, 2, h + 8, P.FRAME);
  px(g, x0 + w + 2, y0 - 4, 2, h + 8, shade(P.FRAME_D, -0.26));
  px(g, x0 - 4, y0 + h + 2, w + 8, 2, shade(P.FRAME_D, -0.34));
  /* 玻璃本体 */
  px(g, x0, y0, w, h, P.GLASS);
  px(g, x0, y0, w, 2, P.GLASS_L);
  px(g, x0, y1 - 3, w, 3, shade(GD, -0.24));
  px(g, x0, y0, 1, h, P.GLASS_L);
  px(g, x1 - 2, y0, 2, h, shade(GD, -0.30));
  /* 树影：两张实拍里玻璃都映着外面的树（深绿团），没有它玻璃就是一片死蓝。
     ⚠️ 必须夹在玻璃矩形内 —— 越界会画到凹框/肋墙上。
     ⚠️ **必须半透明**：第一版用了实色 #39543c，放大图里是两块**实心绿板**贴在玻璃上，
        完全读不出"倒影"。多层半透明叠出树冠的大意（上窄下宽的三层），蓝玻璃从缝里透出来。
        这是本段唯一用 rgba 的地方 —— 与水面模块同理：倒影不透明就变成"贴纸"。 */
  const blob = (bx, by, bw, bh) => {
    const cx0 = Math.max(x0 + 2, bx), cy0 = Math.max(y0 + 3, by);
    const cx1 = Math.min(x1 - 3, bx + bw), cy1 = Math.min(y1 - 4, by + bh);
    const w2 = cx1 - cx0, h2 = cy1 - cy0;
    if (w2 <= 8 || h2 <= 8) return;
    px(g, cx0 + Math.round(w2 * 0.20), cy0, Math.round(w2 * 0.60), h2, P.REFL);
    px(g, cx0, cy0 + Math.round(h2 * 0.30), w2, Math.round(h2 * 0.70), P.REFL);
    px(g, cx0 + Math.round(w2 * 0.14), cy0 + Math.round(h2 * 0.36),
       Math.round(w2 * 0.72), Math.round(h2 * 0.38), P.REFL_HI);
  };
  blob(x0 + Math.round(w * 0.09), y0 + 8, Math.round(w * 0.20), Math.round(h * 0.62));
  blob(x0 + Math.round(w * 0.50), y0 + 14, Math.round(w * 0.26), Math.round(h * 0.48));
  /* 梃格：竖梃 + 横梃，把整条玻璃分格成一片小窗。
     —— 用户 2026-09-17 口径：「添加一些网格，增加网格划分的小窗户数量，应该划分成四行，
        多少列你自己决定」。列沿用实拍里的 20px 等距（361 宽的带子正好 18 列），
        行按带高四等分 ⇒ 3 道横梃、每格 20×14。
     ⚠️ 必须画在树影**之后**：梃是实体构件、在玻璃之前，网格要压在倒影上才读得出"格"
        （反过来画，那两块半透明倒影正好把网格糊掉一半）。
     ⚠️ 横梃位置由带高 h **现算**，不存第二份常量（h 随 wallH 变，存下来就会错位）。 */
  for (let x = x0 + 20; x < x1 - 6; x += 20) px(g, x, y0, 2, h, shade(GD, -0.12));
  for (let k = 1; k <= 3; k++) {
    const my = y0 + Math.round(h * k / 4);
    px(g, x0 + 1, my, w - 3, 1, shade(GD, -0.12));        // 横梃
    px(g, x0 + 1, my + 1, w - 3, 1, shade(GD, 0.14));     // 梃下侧的受光棱
  }
}

/* --- 5.9.3 底部深灰基座带 + 入口 --------------------------------------
   照片最下面那条服务门带（绿围栏挡在它前面，所以只画个大意）。 */
function xgPlinth(g, G) {
  const P = XG_PAL, x0 = G.x0, x1 = G.x1, y0 = G.baseY - G.plinth;
  px(g, x0, y0, x1 - x0, G.plinth, P.PLINTH);
  px(g, x0, y0, x1 - x0, 2, shade(P.PLINTH, 0.26));
  px(g, x0, y0, x1 - x0, 1, "rgba(14,18,28,0.30)");
  px(g, x0, G.baseY - 2, x1 - x0, 2, "rgba(14,18,28,0.34)");
  for (let x = x0 + 30; x < x1 - 56; x += 62) {                  // 基座上的小门洞
    px(g, x, y0 + 12, 26, G.plinth - 12, P.PLINTH_D);
    px(g, x, y0 + 12, 26, 1, P.PLINTH_L);
  }
  const dw = 96, dx = Math.round((x0 + x1 - dw) / 2);
  px(g, dx - 3, y0 - 6, dw + 6, 4, P.FRAME);                     // 门楣
  px(g, dx, y0 - 2, dw, G.plinth + 2, "#2f4a63");                // 深色玻璃门
  px(g, dx, y0 - 2, dw, 2, "#4f7595");
  px(g, dx + Math.round(dw / 2) - 1, y0 - 2, 2, G.plinth + 2, P.FRAME_D);
}

/* --- 5.9.4 立面整体 --------------------------------------------------- */
function xgFacade(g, G) {
  /* ① 通高灰肋墙 */
  xgRibs(g, G.x0, G.x1, G.eaveY, G.baseY);
  /* ② 檐下沿一道深色压顶线（把墙和屋面分开）+ 一条受光棱 */
  px(g, G.x0, G.eaveY, G.x1 - G.x0, 2, "rgba(14,18,28,0.42)");
  px(g, G.x0, G.eaveY + 2, G.x1 - G.x0, 1, shade(XG_PAL.RIB, 0.22));
  /* ③ 左右棱 */
  px(g, G.x0, G.eaveY, 3, G.wallH, shade(XG_PAL.RIB, 0.16));
  px(g, G.x1 - 4, G.eaveY, 4, G.wallH, shade(XG_PAL.RIB, -0.26));
  /* ④ 中段蓝玻璃带：占立面宽 78%、居中 —— **不水平贯穿**（用户口径"并不长"） */
  const gw = Math.round((G.x1 - G.x0) * G.gw);
  const gx0 = Math.round(G.x0 + (G.x1 - G.x0 - gw) / 2);
  xgGlass(g, gx0, gx0 + gw, G.gy0, G.gy1);
  /* ⑤ 底部基座带 + 入口 */
  xgPlinth(g, G);
}

/* --- 5.9.9 覆盖重绘入口 -------------------------------------------------
   ⚠️ 只能在这里、addProp **之前** 调（60_assemble.js）—— 重绘的是同一张 canvas 的
      内容，晚一步 addProp 已经把旧精灵挂进 props 了。
   ⚠️ 本函数**不碰共享 RNG**（补屋面斑点用局部 makeRng(5903/5904)）——
      碰了就会重掷全校园散射（那是有专属探针才看得见的地雷，见 60_assemble.js §6.6）。
   ⚠️ 第四个实参照 58 段传 `pal.roof` —— `makeBuilding` 的返回值里没有色号，
      而补屋面板面必须与它同色，所以只能由调用点给（本段不许再存一份 PALETTE）。 */
function xgRestyle(b, roofCol) {
  const c = b.canvas, g = c.getContext("2d");
  const G = xgGeo(c, roofCol);
  /* 几何闸：30 段的 roofT / PADT / 画布高公式一旦改动，立刻在控制台报出来
     （反解出来会是个不合理的值，画出来是一栋比例崩掉的楼 —— 三套验收都不看画面）。
     ⚠️ 上界原本是 190（30 段 `clamp(...,20,190)` 的顶）。**2026-09-17 起本栋改走
        `o.roofFull`**（屋面板铺满整个进深，用户要求"向北延长直到灰色石板区域被
        覆盖"）⇒ roofT 反解出来是 ceil(483) − 170 = 313，**故意**超出那个上限。
        所以上界放到"两倍墙高"（340）—— 仍然足够抓住"画布高与 PADT/wallH/SHY
        对不上、整栋比例崩掉"的情况，但不再把正常的铺满进深判成异常。 */
  if (G.roofT < 20 || G.roofT > G.wallH * 2)
    console.warn("59_xgym: 反解出的 roofT=%d 出了合理区间[20,%d]，" +
                 "画布高 %d 与 30 段的 PADT/wallH/SHY 公式对不上了",
                 G.roofT, G.wallH * 2, c.height);

  /* ① 撤屋名牌。30 段把牌子挂在**檐口之上**（signRect: y = eaveY − 8 − h），
        所以这条必须单独擦（见文件头第三节）。调 makeSign 只为填 _signCache
        （verify.py 要 / 见契约），拿到矩形就够 —— **不画**。 */
  const sgn = makeSign(XG_NAME);
  if (sgn) {
    const sg = signRect(sgn, G.x0, G.x1 - G.x0, G.eaveY);
    const px0 = sg.x - 2, py0 = sg.y - 2, pw = sg.w + 7, ph = sg.h + 7;
    g.clearRect(px0, py0, pw, ph);
    px(g, px0, py0, pw, ph, shade(roofCol, -0.04));        // 板面色（30 段 3.2 同式）
    for (let j = 1; j <= 3; j++) {                         // 分坡脊线（30 段只画 j=1..3）
      const y = XG_PADT + Math.round((G.roofT - 12) * j / 4) + 6;
      if (y >= py0 && y < py0 + ph)
        px(g, G.x0 + 5, y, G.x1 - G.x0 - 10, 1, "rgba(255,255,255,0.08)");
    }
    /* 斑点：密度照 30 段的 (w/3)|0 / (w/4)|0 折到这一小块（≈0.0018 与 0.0014） */
    speckle(g, px0, py0, pw, ph, "rgba(255,255,255,0.05)", 6, makeRng(5903));
    speckle(g, px0, py0, pw, ph, "rgba(0,0,0,0.07)", 5, makeRng(5904));
  }

  /* ② 檐下沿以下整段擦掉重画 */
  g.clearRect(0, G.eaveY, c.width, c.height - G.eaveY);
  xgFacade(g, G);
  return b;
}
