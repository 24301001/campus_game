# 躲猫猫联机桥接 · nginx 片段
#
# 装法：把这四行加进 /etc/nginx/sites-available/campus-portal 的那个 80 server 里
# （放在 `location /duo1/ {` 旁边就行），然后：
#     sudo nginx -t && sudo systemctl reload nginx
# 改前先备份：sudo cp /etc/nginx/sites-available/campus-portal{,.bak-duobridge}
#
# 说明：
# · proxy_pass 不带 URI ⇒ 路径原样传给 bridge.py（它自己认 /game/ 前缀），
#   这样 bridge.py 里的路由和浏览器看到的地址一一对应，调试不用猜前缀被谁吃了。
# · 只监听 127.0.0.1:8300，不开新公网端口（上游防火墙会挡）。
# · $connection_upgrade 已在 campus-portal 顶部定义过，这里没有 WS，不要再定义同名 map。
# · 大厅登录态走 localStorage 的 Bearer 头，不经 cookie，所以这里不需要透传 Cookie。

location /game/ {
    proxy_pass http://127.0.0.1:8300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
}
