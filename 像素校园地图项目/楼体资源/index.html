<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素校园 · 楼体资源预览</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 40px;
    background: #2f3a33;
    color: #eceae2;
    font: 14px/1.6 'Microsoft YaHei', 'SimHei', 'PingFang SC', sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 1px; }
  .sub { color: #b9c3b6; margin-bottom: 18px; }
  .bar {
    position: sticky; top: 0; z-index: 9;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 0 12px; margin-bottom: 10px;
    background: linear-gradient(#2f3a33 70%, rgba(47,58,51,0));
  }
  button {
    font: inherit; padding: 5px 12px; border-radius: 5px; cursor: pointer;
    border: 1px solid #7d8f7e; background: #46564a; color: #f2f2ea;
  }
  button:hover { background: #566a5a; }
  button.on { background: #8a6a33; border-color: #c9a24f; }
  .hint { color: #9fae9f; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  }
  .card {
    background: #3a463d; border: 1px solid #55665a; border-radius: 8px;
    padding: 10px 12px 12px; overflow: hidden;
  }
  .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .card .note { color: #a9b8aa; font-size: 12px; margin-bottom: 8px; }
  .stage {
    overflow: auto; border-radius: 4px;
    background: #6c8a55;                 /* 草地底色，看接地阴影用 */
    background-image: linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%);
    background-size: 16px 16px;
    padding: 8px;
  }
  .stage canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    width: auto; height: auto;
  }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: #a9b8aa; font-size: 12px; }
  .empty { color: #c9a24f; }
</style>
</head>
<body>
  <h1>像素校园 · 楼体资源</h1>
  <div class="sub">12 栋楼的正面精灵，画法与地图 <code>parts/30_building.js</code> 同源：34px 层高、16×22 窗、同一支 SUN、同一道接地阴影。</div>
  <div class="bar">
    <span class="hint">显示倍率</span>
    <button data-z="1">1×</button>
    <button data-z="2" class="on">2×</button>
    <button data-z="3">3×</button>
    <button id="all">全部导出 PNG</button>
    <span class="hint" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>

  <script>window.PC_BUILDINGS = [];</script>
  <script src="style.js"></script>
  <script src="buildings/01_jianyi.js"></script>
  <script src="buildings/02_xinxi.js"></script>
  <script src="buildings/03_tyht.js"></script>
  <script src="buildings/04_xsh.js"></script>
  <script src="buildings/05_d19.js"></script>
  <script src="buildings/06_d2.js"></script>
  <script src="buildings/07_d12.js"></script>
  <script src="buildings/08_xiaoshi.js"></script>
  <script src="buildings/09_yanjiu.js"></script>
  <script src="buildings/10_d9.js"></script>
  <script src="buildings/11_d8.js"></script>
  <script src="buildings/12_d15.js"></script>
  <script src="buildings/13_d22.js"></script>
  <script>
  (function () {
    let zoom = 2;
    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const cards = [];

    function download(cv, name) {
      cv.toBlob(function (blob) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name + ".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      }, "image/png");
    }

    function applyZoom() {
      for (const c of cards) {
        c.cv.style.width = (c.cv.width * zoom) + "px";
        c.cv.style.height = (c.cv.height * zoom) + "px";
      }
    }

    function build() {
      grid.innerHTML = "";
      for (const b of window.PC_BUILDINGS) {
        const out = PC.make(b.spec);
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h2");
        h.textContent = b.name;
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = b.note;
        const stage = document.createElement("div");
        stage.className = "stage";
        stage.appendChild(out.canvas);
        const meta = document.createElement("div");
        meta.className = "meta";
        const dim = document.createElement("span");
        dim.textContent = b.id + " · " + out.canvas.width + "×" + out.canvas.height;
        const btn = document.createElement("button");
        btn.textContent = "导出";
        btn.onclick = function () { download(out.canvas, b.id); };
        meta.appendChild(dim); meta.appendChild(btn);
        card.appendChild(h); card.appendChild(note); card.appendChild(stage); card.appendChild(meta);
        grid.appendChild(card);
        cards.push({ cv: out.canvas, id: b.id });
      }
      countEl.textContent = window.PC_BUILDINGS.length + " 栋";
      applyZoom();
    }

    document.querySelectorAll("button[data-z]").forEach(function (btn) {
      btn.onclick = function () {
        zoom = Number(btn.dataset.z);
        document.querySelectorAll("button[data-z]").forEach(function (b) {
          b.classList.toggle("on", b === btn);
        });
        applyZoom();
      };
    });
    document.getElementById("all").onclick = function () {
      cards.forEach(function (c, i) {
        setTimeout(function () { download(c.cv, c.id); }, i * 350);
      });
    };

    build();
    window.__ready = true;
  })();
  </script>
</body>
</html>
