<!DOCTYPE html><html><head><meta charset="utf-8"><title>char</title>
<style>
  html,body{margin:0;background:#1b1f27;color:#c9d4e2;
            font:12px/1.5 Consolas,monospace}
  h2{margin:14px 0 6px 14px;font-size:13px;color:#8fb6d9;font-weight:normal}
  .row{display:flex;align-items:flex-end;gap:8px;padding:0 14px}
  .cell{text-align:center}

               image-rendering:crisp-edges;background:#3d752d}
  .lab{opacity:.6;margin-top:3px}
  .k{color:#e8d9a8}
</style></head><body>

<script>const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const wrapi = (i, m) => ((i % m) + m) % m;

function mkCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
function px(g, x, y, w, h, col) {
  g.fillStyle = col;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function makeRng(seed) {                     // 确定性随机，保证每次刷新一致
  let s = seed >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function circlePx(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const t = r * r - y * y;
    if (t < 0) continue;
    const dx = Math.floor(Math.sqrt(t));
    g.fillRect(Math.round(cx - dx), Math.round(cy + y), dx * 2 + 1, 1);
  }
}
function ellipsePx(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t <= 0) continue;
    const dx = Math.floor(rx * Math.sqrt(t));
    g.fillRect(Math.round(cx - dx), Math.round(cy + y), dx * 2 + 1, 1);
  }
}
function poly(g, pts, col) {
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  g.fill();
}
function flipH(src) {                        // 水平镜像（右侧角色 = 左侧镜像）
  const c = mkCanvas(src.width, src.height);
  const g = c.getContext("2d");
  g.translate(src.width, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}
function speckle(g, x, y, w, h, col, count, rng) {   // 颗粒 / 磨损 / 灰尘
  g.fillStyle = col;
  for (let i = 0; i < count; i++) g.fillRect(x + ((rng() * w) | 0), y + ((rng() * h) | 0), 1, 1);
}

/* ---------------------------------------------------------
   1.1 颜色运算 —— 真实感的核心
   统一光源要求：受光面偏暖、背光面偏冷，
   而不是简单叠一层半透明黑。
   --------------------------------------------------------- */
const _hc = Object.create(null);
function rgb(hex) {
  let v = _hc[hex];
  if (v === undefined) {
    v = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    _hc[hex] = v;
  }
  return v;
}
function rgba(hex, a) {
  const c = rgb(hex);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}
/* k > 0 提亮（偏暖）；k < 0 压暗（偏冷） */
function shade(hex, k) {
  const c = rgb(hex);
  let r, g, b;
  if (k >= 0) {
    r = c[0] + (255 - c[0]) * k;
    g = c[1] + (255 - c[1]) * (k * 0.93);
    b = c[2] + (255 - c[2]) * (k * 0.80);
  } else {
    const t = -k;
    r = c[0] * (1 - t * 1.08);
    g = c[1] * (1 - t * 1.00);
    b = c[2] * (1 - t * 0.86);
  }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}
function mix(hexA, hexB, t) {
  const A = rgb(hexA), B = rgb(hexB);
  return "rgb(" + ((A[0] + (B[0] - A[0]) * t) | 0) + ","
                 + ((A[1] + (B[1] - A[1]) * t) | 0) + ","
                 + ((A[2] + (B[2] - A[2]) * t) | 0) + ")";
}

/* ---------------------------------------------------------
   1.2 值噪声 —— 让地面出现"成片的深浅"而不是纯随机噪点
   --------------------------------------------------------- */
function makeNoise(seed, gw, gh) {
  const r = makeRng(seed), v = new Float32Array(gw * gh);
  for (let i = 0; i < v.length; i++) v[i] = r();
  return { gw, gh, v };
}
function noiseAt(n, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let tx = x - xi, ty = y - yi;
  tx = tx * tx * (3 - 2 * tx);
  ty = ty * ty * (3 - 2 * ty);
  const at = (a, b) => n.v[wrapi(b, n.gh) * n.gw + wrapi(a, n.gw)];
  const v00 = at(xi, yi), v10 = at(xi + 1, yi), v01 = at(xi, yi + 1), v11 = at(xi + 1, yi + 1);
  return (v00 * (1 - tx) + v10 * tx) * (1 - ty) + (v01 * (1 - tx) + v11 * tx) * ty;
}
function fbm2(nA, nB, x, y) {               // 双倍频，返回 0..1
  return noiseAt(nA, x, y) * 0.62 + noiseAt(nB, x, y) * 0.38;
}

/* ---------------------------------------------------------
   1.3 阴影系统
   --------------------------------------------------------- */
/* 软阴影：多层同心椭圆，做出像素风的柔和边缘 */
function shadowBlob(g, cx, cy, rx, ry, alpha, layers) {
  const L = layers || 4, step = alpha / L;
  for (let i = L; i >= 1; i--) {
    const t = i / L;
    ellipsePx(g, cx, cy, Math.max(1, Math.round(rx * t)), Math.max(1, Math.round(ry * t)),
      "rgba(14,18,28," + step.toFixed(3) + ")");
  }
}
/* 方向性投影：矩形 footprint 朝背离光源方向拉伸出的凸包。
   多层不同拉伸量叠加 → 靠物体处最深，向外渐淡。 */
function shadowQuad(g, x0, y0, x1, y1, dx, dy, alpha, layers) {
  const L = layers || 4, step = alpha / L;
  for (let i = L; i >= 1; i--) {
    const t = i / L, ox = dx * t, oy = dy * t;
    poly(g, [[x0, y0], [x1, y0], [x1 + ox, y0 + oy], [x1 + ox, y1 + oy], [x0 + ox, y1 + oy], [x0, y1]],
      "rgba(14,18,28," + step.toFixed(3) + ")");
  }
}
/* 接触阴影：物体与地面交接处那条最深的窄带 */
function contactBand(g, x0, x1, y, h, alpha) {
  const w = x1 - x0, e = w * 0.16;
  px(g, x0, y, w, h, "rgba(14,18,28," + alpha + ")");
  px(g, x0, y, e, h, "rgba(14,18,28," + (alpha * 0.45) + ")");
  px(g, x1 - e, y, e, h, "rgba(14,18,28," + (alpha * 0.45) + ")");
}
const SKIN = "#e3b187", SKIN_D = "#c99068", HAIR = "#2b2320",
      COAT = "#3f6ea8", PANT = "#3a3f4a", SHOE = "#232529", PACK = "#b4552f";

function makeCharOld(dir, step) {
  const c = mkCanvas(CH_W, CH_H), g = c.getContext("2d");
  const cx = CH_AX, gy = CH_AY;
  const bob = step ? 1 : 0;                 // 走动时上身轻微起伏

  if (dir === "down" || dir === "up") {
    const hy = 2 + bob;
    /* 头 */
    px(g, cx - 4, hy, 8, 8, dir === "up" ? HAIR : SKIN);
    if (dir === "down") {
      px(g, cx - 4, hy + 6, 8, 1, SKIN_D);                     // 下颌阴影
      px(g, cx - 3, hy + 4, 1, 1, "#241f1c");                  // 双眼
      px(g, cx + 2, hy + 4, 1, 1, "#241f1c");
      px(g, cx - 2, hy + 6, 4, 1, shade(SKIN, -0.22));         // 嘴
      px(g, cx - 4, hy + 4, 1, 2, shade(SKIN, 0.18));          // 左颊受光
    }
    px(g, cx - 4, hy, 8, 3, HAIR);                             // 头发
    px(g, cx - 4, hy, 8, 1, shade(HAIR, 0.30));                // 头顶受光
    px(g, cx - 4, hy + 3, 1, 5, HAIR);                         // 两侧鬓角
    px(g, cx + 3, hy + 3, 1, 5, shade(HAIR, -0.30));
    px(g, cx - 4, hy + 8, 8, 1, "rgba(14,18,28,0.22)");        // 头在肩上的投影

    /* 躯干 */
    const ty = 10 + bob;
    px(g, cx - 5, ty, 10, 8, COAT);
    px(g, cx - 5, ty, 2, 8, shade(COAT, 0.18));                // 左侧受光
    px(g, cx + 3, ty, 2, 8, shade(COAT, -0.32));               // 右侧背光
    px(g, cx - 5, ty, 10, 1, shade(COAT, 0.28));               // 肩线
    px(g, cx - 5, ty + 7, 10, 1, shade(COAT, -0.40));          // 下摆
    if (dir === "down") {
      px(g, cx, ty + 1, 1, 6, shade(COAT, -0.46));             // 前襟拉链
      px(g, cx - 5, ty + 5, 10, 1, "rgba(0,0,0,0.16)");
    } else {
      px(g, cx - 4, ty + 1, 8, 6, PACK);                       // 书包
      px(g, cx - 4, ty + 1, 8, 1, shade(PACK, 0.26));
      px(g, cx + 2, ty + 1, 2, 6, shade(PACK, -0.34));
      px(g, cx - 2, ty, 4, 1, "rgba(0,0,0,0.30)");             // 背带
    }

    /* 手臂：走动时前后摆 */
    const a1 = ty + 1 + (step ? 1 : 0), a2 = ty + 1 + (step ? 0 : 1);
    px(g, cx - 7, a1, 2, 7, shade(COAT, -0.06));
    px(g, cx - 7, a1, 1, 7, shade(COAT, 0.24));
    px(g, cx - 7, a1 + 7, 2, 2, SKIN);
    px(g, cx + 5, a2, 2, 7, shade(COAT, -0.24));
    px(g, cx + 5, a2 + 7, 2, 2, SKIN_D);

    /* 腿脚：抬起的一侧离地 1px */
    const legY = 19 + bob;
    const lift = step ? 1 : 0;
    px(g, cx - 4, legY, 3, 7 - lift, PANT);
    px(g, cx + 1, legY, 3, 7, PANT);
    px(g, cx - 4, legY, 1, 7 - lift, shade(PANT, 0.24));
    px(g, cx + 3, legY, 1, 7, shade(PANT, -0.28));
    px(g, cx - 5, gy - 2 - lift, 4, 2, SHOE);
    px(g, cx + 1, gy - 2, 4, 2, SHOE);
    px(g, cx + 1, gy - 2, 4, 1, shade(SHOE, 0.30));
  } else {
    /* 侧向：面向 -x 绘制，向右时整体镜像 */
    const hy = 2 + bob;
    px(g, cx - 4, hy, 8, 8, SKIN);
    px(g, cx - 4, hy, 8, 3, HAIR);
    px(g, cx - 4, hy, 8, 1, shade(HAIR, 0.30));
    px(g, cx + 1, hy + 3, 3, 5, HAIR);                         // 后脑
    px(g, cx + 3, hy + 3, 1, 5, shade(HAIR, -0.34));
    px(g, cx - 2, hy + 4, 1, 1, "#241f1c");                    // 眼
    px(g, cx - 4, hy + 4, 1, 2, shade(SKIN, 0.18));            // 面部受光
    px(g, cx - 4, hy + 6, 3, 1, shade(SKIN, -0.20));           // 下颌
    px(g, cx - 4, hy + 8, 8, 1, "rgba(14,18,28,0.22)");

    const ty = 10 + bob;
    px(g, cx + 3, ty + 1, 4, 7, PACK);                         // 背后的书包
    px(g, cx + 6, ty + 1, 1, 7, shade(PACK, -0.36));
    px(g, cx + 3, ty + 1, 4, 1, shade(PACK, 0.24));
    px(g, cx - 3, ty, 7, 8, COAT);
    px(g, cx - 3, ty, 2, 8, shade(COAT, 0.20));
    px(g, cx + 2, ty, 2, 8, shade(COAT, -0.24));
    px(g, cx - 3, ty, 7, 1, shade(COAT, 0.28));
    px(g, cx - 3, ty + 7, 7, 1, shade(COAT, -0.40));
    const aY = ty + 1 + (step ? 1 : 0);                        // 前臂摆动
    px(g, cx - 4, aY, 2, 7, shade(COAT, 0.02));
    px(g, cx - 4, aY, 1, 7, shade(COAT, 0.26));
    px(g, cx - 4, aY + 7, 2, 2, SKIN);

    const legY = 19 + bob, s = step ? 1 : 0;
    px(g, cx - 4 + s * 2, legY, 3, 7, PANT);                   // 前腿
    px(g, cx - 4 + s * 2, legY, 1, 7, shade(PANT, 0.26));
    px(g, cx + 1 - s * 2, legY, 3, 7, PANT);                   // 后腿
    px(g, cx + 3 - s * 2, legY, 1, 7, shade(PANT, -0.30));
    px(g, cx - 5 + s * 2, gy - 2, 4, 2, SHOE);
    px(g, cx + s % 2, gy - 2, 4, 2, shade(SHOE, -0.10));
    px(g, cx - 5 + s * 2, gy - 2, 4, 1, shade(SHOE, 0.26));
  }

  /* 脚下接触阴影：让角色"贴在地上" */
  ellipsePx(g, cx + 1, gy + 1, 7, 2, "rgba(14,18,28,0.30)");
  ellipsePx(g, cx + 1, gy + 1, 4, 1, "rgba(14,18,28,0.30)");

  return dir === "right" ? flipH(c) : c;
}
/* =========================================================
   5. 角色：四向 × 六相位（重画版，A 档：头 6px / 4.3 头身）
   ---------------------------------------------------------
   ⚠️ 对外契约（**只有 step 的取值域变了**，别的与 demo §5 逐字相同）：
        CH_W / CH_H / CH_AX / CH_AY           四个常量（值不变）
        makeChar(dir, step) -> canvas         step 0..3 行走四帧 / 4..5 待机两帧
        charSprite(dir, step)                 按 dir+step 缓存（键自动扩到 6 个相位）
      唯一的调用点是主循环里的 drawList.push({... charSprite(player.dir, player.step) ...})，
      锚点仍是 ax = CH_AX / ay = CH_AY，所以"脚踩在世界坐标 y 上"这件事没变。

   与上一版的差别（这一步新做的三件事）：
      A) **2 帧 → 4 帧行走**。原来 `& 1` 只有两个姿势，一个周期里身体只起伏一次，
         看着像"整块人在弹"。现在走的是教科书四帧：接触（跨开）→ 通过（并立抬身）
         → 接触（镜像）→ 通过（并立抬身）。
      B) **待机呼吸帧**。站着不动时不再是死定格：2 帧、约 0.4 Hz，吸气时上身抬 1px。
      C) **步态由"实际位移"驱动**（改在主循环补丁 11，不在本文件）：原来 `walk += dt`
         顶着墙走也照常累加 → 人会原地踏步；现在顶墙位移为 0，脚立刻停。
         步频也不再是硬编码的 `* 7`，而是每 WALK_STRIDE 世界像素走完一个周期。

   为什么重画（对着 demo §5 逐条数出来的五个问题，前四个是代码/肉眼，第五个是实测）：
     1) 头身比 3.4（头 8px / 全身 27px）—— Q 版娃娃。
     2) 结构是"一摞方块"：躯干 = 一个 10×8 矩形，手臂/腿都是直条 ——
        没有肩斜、肘、膝、腰。
     3) 全画面只有它没有 1px 深色收边（楼有棱线、树有暗底叶簇、灌木有背光球）
        → 剪影在草地/路面上发虚。
     4) 明暗只有左右二分（左亮右暗），没有顶光、没有遮蔽（下巴/腋下/胯下）。
     5) 【实测】朝右的精灵**接地影方向是反的**：demo 的 flipH() 用 translate+scale
        画完后不 restore，变换留在返回画布的 context 上，末尾的 ellipsePx 影子
        被又镜像了一次。实测影子重心相对身体重心的偏移：
            现版 down +1.5 / left +1.0 / right **−1.0** / up +1.5
        树、楼、灌木的影子全朝右下，只有"朝右的角色"逆着光。本版修了，四向一律 +1.5。

   ⚠️ 头身比的取舍：真人 7.5 头身，但 30px 画布里头一缩小，脸就没了。
      540 个像素撑不起写实，只能撑起"可读的真人剪影 + 真实的重心与节拍"。
      这里取头 6px（4.3 头身）：脸留 4 行（眼/鼻/嘴/下颌），成年人骨架成立。
      （头 8px 的 3.4 头身版本试过，脸会挤成一团络腮胡，且与现版同比例、没解决问题。）
   ========================================================= */
const CH_W = 18, CH_H = 30, CH_AX = 9, CH_AY = 27;

/* --- 步态相位表 ---------------------------------------------------------
   4 帧行走 + 2 帧待机，一个周期 = 左右各一步。
   ⚠️ 两个视角要**分别**给参数，不能共用一个"腿相位"：
      侧面看不到左右，只能看前后 → m（1 左腿跨在前 / 2 右腿跨在前 / 0 并立）；
      正背面看不到前后，只能看左右 → fl（抬哪条腿：0 并立 / 1 抬左 / 2 抬右）+ spread（两腿分不分）。
   踩过坑：两帧都用"并立"来当通过帧，正背面看这两帧的腿就一模一样，4 帧白给一帧
   （只有手臂不同，远看就是同一张）。所以抬腿相位在两个通过帧里**交替**，
   接触帧也各抬一条（在后的那条腿离镜头更远，画高 1px）。
   bob 骨盆起伏（只抬腰以上，脚不离地）；sw 手臂摆相。 */
const WALK_FRAMES = 4, IDLE_BASE = 4, IDLE_FRAMES = 2;
const GAIT = [
  { m: 1, fl: 2, spread: 1, bob: 0, sw: 0 },   // 0 接触：两腿分开、左腿在前（右腿远，抬 1px）
  { m: 0, fl: 2, spread: 0, bob: 1, sw: 1 },   // 1 通过：并立抬身、右腿抬起经过
  { m: 2, fl: 1, spread: 1, bob: 0, sw: 1 },   // 2 接触：两腿分开、右腿在前（左腿远，抬 1px）
  { m: 0, fl: 1, spread: 0, bob: 1, sw: 0 },   // 3 通过：并立抬身、左腿抬起经过
  { m: 0, fl: 0, spread: 0, bob: 0, sw: 0 },   // 4 待机：呼气
  { m: 0, fl: 0, spread: 0, bob: 1, sw: 0 }    // 5 待机：吸气（上身抬 1px）
];
/* 一个完整步态周期走过的世界像素。1× 档速度 200 px/s → 200/160 = 1.25 周期/秒
   = 2.5 步/秒（真人 1.8~2.0，游戏里略快是合适的）。3× 档世界速度减半，步频跟着慢下来。
   ⚠️ 两个数都必须在这里声明：主循环补丁 11 要用，而主循环段排在角色段之后。 */
const WALK_STRIDE = 160;
const IDLE_HZ = 0.4;                   // 待机呼吸约 2.5 秒一个来回

const A2 = {
  skin:  "#e9bb92", skinD: "#c4906a", skinL: "#f7d3ae",
  hair:  "#241d1a", hairL: "#3d3029", hairD: "#150f10",
  coat:  "#3f6ea8", coatD: "#2b4d76", coatL: "#5d8cc4",
  pant:  "#454c5a", pantD: "#2b303a", pantL: "#5c6474",   // 比现版提亮：描边(k=0.45)才读得出来
  shoe:  "#26282e", shoeL: "#454a54",
  pack:  "#b4552f", packD: "#8a3f22", packL: "#d1704a"
};

/* --- 自动描边：给精灵四周的透明像素补 1px 收边 ---------------------------
   ⚠️ 不用"纯黑描边"（像素画里太硬、显脏），而是**取相邻实心像素的颜色压暗**
   —— 这叫彩色描边：头发的边 = 更黑的头发、袖子的边 = 更深的蓝。剪影立刻清楚。
   一次调用可给任何精灵加收边；给树/灌木加是同一行代码。
   ⚠️ 必须画在接地影**之前**，否则影子会被描一圈边。
   ⚠️⚠️ 必须先把变换复位成单位阵 —— flipH() 用 translate+scale 画完后**不 restore**，
   返回的画布 context 上永久留着 translate(W,0) scale(-1,1)。
   往这种画布上 fillRect(x,y,1,1) 会落到 W-1-x：描边跑到另一侧、原侧留空 1px，
   镜像方向的精灵会多出"空格 + 外挂 1px"的鬼影（实测：右侧 24 个内部空洞，
   左侧 0 个）。下面这行是必须的，不是防御性代码。 */
function outlineSprite(c, k) {
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const d = g.getImageData(0, 0, W, H).data;
  const src = (x, y) => (x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 40)
    ? (y * W + x) * 4 : -1;
  const NB = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  const edge = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 40) continue;
      for (let n = 0; n < 4; n++) {                 // 四邻即可：八邻会让四角鼓 1px
        const j = src(x + NB[n][0], y + NB[n][1]);
        if (j >= 0) { edge.push(x, y, j); break; }
      }
    }
  }
  for (let i = 0; i < edge.length; i += 3) {
    const j = edge[i + 2];
    g.fillStyle = "rgb(" + ((d[j] * k) | 0) + "," + ((d[j + 1] * k) | 0) + "," + ((d[j + 2] * k) | 0) + ")";
    g.fillRect(edge[i], edge[i + 1], 1, 1);
  }
}

/* =========================================================
   参数化构建：HH = 头高（含发）。整个骨架由它推出来，改一处不散架。
   ---------------------------------------------------------
   纵向预算（画布 18×30，脚底线 gy = CH_AY = 27）：
     y1 .. y1+HH-1   头
     y1+HH           颈（1 行）
     y1+HH+1         肩/躯干起
     躯干 + 腿 平分剩下的行数（真人的肩-胯 ≈ 胯-脚底），鞋固定占 y25-26
   bob 只抬"腰以上"：走路的真实构造是**骨盆起伏、脚不离地**。
   现版是两帧整体平移（bob 直接加在全体），所以看着像"整块画在跳"。
   ========================================================= */
function buildChar(HH) {
  const TOP = 1, SHOE_TOP = 25, cx = CH_AX, gy = CH_AY;
  const NECK = TOP + HH, TOR = NECK + 1;
  const bodyRows = SHOE_TOP - TOR;
  const TORSO = Math.max(6, Math.round(bodyRows / 2));
  const LEGT = TOR + TORSO, LEGR = SHOE_TOP - LEGT;          // 腿的行数（不含鞋）
  const KNEE = LEGT + Math.max(2, Math.round(LEGR * 0.55));
  const HW = HH >= 7 ? 8 : 7;                                // 头宽
  const H2 = (HW - 1) >> 1;                                  // 头左右各伸出的像素数
  const ARMR = Math.max(4, TORSO - 3);
  const FACE = HH - 2;                                       // 脸的行数

  return function (dir, step) {
    const c = mkCanvas(CH_W, CH_H), g = c.getContext("2d");
    const P = (x, y, w, h, col) => { if (w > 0 && h > 0) px(g, x, y, w, h, col); };
    const F = GAIT[step] || GAIT[0];                         // 相位：0..3 行走 / 4..5 待机
    const b = F.bob;                                         // 骨盆起伏 1px
    const HY = TOP + b;                                      // 头顶（腰以上整体上移）
    const ty = TOR + b, ly = LEGT + b;                       // 躯干起 / 髋

    /* ---------- 头 ---------- */
    function head(face) {
      P(cx - H2 + 1, HY, HW - 2, 1, A2.hairL);               // 发顶受光（顶光层）
      P(cx - H2, HY + 1, HW, 1, A2.hair);
      if (!face) {                                           // 背向：后脑 + 左棱受光
        P(cx - H2, HY + 2, HW, HH - 2, A2.hair);
        P(cx - H2, HY + 1, 1, HH - 1, A2.hairL);
        P(cx + H2, HY + 1, 1, HH - 1, A2.hairD);
        P(cx - 1, HY + 2, 2, 1, shade(A2.hair, 0.20));       // 发旋小高光（不是横贯亮带）
        return;
      }
      P(cx - H2, HY + 2, HW, FACE, A2.skin);                 // 脸
      P(cx - H2, HY + 2, 1, FACE, A2.skinL);                 // 左颊受光（光自左上）
      P(cx + H2, HY + 2, 1, FACE, A2.skinD);                 // 右颊背光
      /* ⚠️ 五官一律以 HY（会随 bob 起伏）为基准，**不能用 TOP 绝对行号**：
         b=1 时脸整体下移 1px，五官若留在原地就顶到刘海线上、嘴跑到眼睛下格，
         整张脸糊成一条黑带（sprite.py 的"头块刚性"探针会实测出来）。 */
      const EY = HY + 2 + (FACE >= 5 ? 2 : 1);               // 眼睛所在行
      P(cx - 2, EY, 1, 1, A2.hairD);                         // 左眼
      P(cx + 1, EY, 1, 1, A2.hairD);                         // 右眼（间距 2px）
      if (FACE >= 5) P(cx, EY + 1, 1, 1, A2.skinD);          // 鼻影（脸够高才放得下）
      P(cx - 1, HY + FACE, 3, 1, shade(A2.skinD, -0.28));    // 嘴（脸的倒数第二行）
      P(cx - H2 + 1, HY + FACE + 1, HW - 2, 1, A2.skinD);    // 下颌收边（脸的最后一行）
    }
    /* ---------- 躯干（胸宽 9 → 腰宽 7 → 衣摆） ---------- */
    function torso(back) {
      P(cx - 4, ty, 9, 1, A2.coatL);                         // 肩顶受光
      const chest = Math.max(2, TORSO - 3);
      P(cx - 4, ty + 1, 9, chest, A2.coat);                  // 胸
      P(cx - 3, ty + 1 + chest, 7, TORSO - 1 - chest, A2.coat);   // 腰（左右各收 1px）
      P(cx - 4, ty + 1, 2, TORSO - 1, A2.coatL);             // 左侧受光面
      P(cx + 3, ty + 1, 1, TORSO - 1, A2.coatD);             // 右侧背光面
      P(cx - 4, ty + chest, 9, 1, "rgba(0,0,0,0.13)");       // 胸腰分界
      P(cx - 3, ty + TORSO - 1, 7, 1, A2.coatD);             // 衣摆（压实腰线，与裤头对齐）
      if (back) {
        P(cx - 3, ty + 1, 7, TORSO - 4, A2.pack);            // 书包
        P(cx - 3, ty + 1, 7, 1, A2.packL);
        P(cx + 2, ty + 1, 1, TORSO - 4, A2.packD);
        P(cx - 2, ty - 1, 5, 1, "rgba(0,0,0,0.26)");         // 背带压肩
      } else {
        P(cx, ty + 1, 1, TORSO - 2, A2.coatD);               // 前襟
        P(cx - 2, ty + chest + 2, 4, 1, A2.coatD);           // 口袋线
      }
    }
    /* ---------- 手臂（2px，肘内收 1px），左右反相摆动 ---------- */
    function arms(sw, back) {
      const aL = ty + 1 + sw, aR = ty + 1 + (sw ? 0 : 1);
      P(cx - 6, aL, 2, ARMR, back ? A2.coat : A2.coatL);     // 左臂（受光侧）
      P(cx - 6, aL + ((ARMR / 2) | 0), 1, 1, A2.coatD);      // 肘
      P(cx - 6, aL + ARMR, 2, 2, A2.skin);                   // 左手
      P(cx + 5, aR, 2, ARMR, A2.coatD);                      // 右臂（背光侧）
      P(cx + 6, aR + ((ARMR / 2) | 0), 1, 1, A2.hairD);      // 肘
      P(cx + 5, aR + ARMR, 2, 2, A2.skinD);                  // 右手
    }
    /* ---------- 腿（大腿 → 膝 → 小腿 → 鞋）----------
       fl: 0 并立 / 1 抬左腿 / 2 抬右腿。抬腿 = 小腿与鞋整体上移 1px（在后的那条腿离镜头更远）。
       spread: 接触帧两腿各外移 1px —— 正背面看"迈步"只能靠这个（前后是看不出来的）。
       ⚠️ 小腿的**起点必须跟着上移到 knee**。老写法是"大腿缩短 1px、小腿仍从 KNEE 起"，
          会在 KNEE-1 行留一条 1px 空洞 —— 描边会把这个洞填成一圈深色，肉眼看是腿中段断了一格。
          现在大腿定长、小腿从 knee 起严丝合缝，膝线**显式画**出来（不再靠缝隙让描边去填）。 */
    function legs(fl, spread) {
      function one(x, shx, edge, edgeCol, up) {
        const knee = KNEE - up, bot = SHOE_TOP - up;
        P(x, ly, 3, KNEE - ly, A2.pant);                 // 大腿（定长，到 KNEE-1）
        P(x + edge, ly, 1, KNEE - ly, edgeCol);          // 受光 / 背光边
        P(x, ly, 3, 1, "rgba(0,0,0,0.18)");              // 胯下遮蔽
        P(x, knee, 3, bot - knee, A2.pant);              // 小腿
        P(x, knee, 3, 1, shade(A2.pant, -0.20));         // 膝线
        P(shx, bot, 4, 2, A2.shoe);                      // 鞋（比腿宽 1px：脚是横的）
        P(shx, bot, 4, 1, A2.shoeL);
      }
      const d = spread ? 1 : 0;
      one(cx - 3 - d, cx - 4 - d, 0, A2.pantL, fl === 1 ? 1 : 0);   // 左腿（受光侧，亮边在左）
      one(cx + 1 + d, cx + 1 + d, 2, A2.pantD, fl === 2 ? 1 : 0);   // 右腿（背光侧，暗边在右）
    }
    /* ---------- 侧视：额头-鼻-下巴的台阶 + 迈步的前后腿交叉 ----------
       mode: 0 并立 / 1 左腿跨在前 / 2 右腿跨在前。侧面看不到左右，只有"前后"：
       跨步靠**两条腿的横向错位**表达（前腿短 1px 显得更远、后腿长 1px 是蹬地踩实），
       所以 mode 1/2 的差别不是几何而是**亮暗边换边**——哪条腿在前，亮边就跟到哪条腿上。
       并立帧（mode 0）两腿重叠在同一列，这时由 sw 决定亮边露在哪一侧：
       1 帧与 3 帧的**像素差别就只有这个**（不然两帧完全相同，4 帧白给一帧）。 */
    function side(mode, sw) {
      const s = mode === 0 ? 2 : 0;                      // 2 = 两腿并到同一列
      const fx = cx - 3 + s, bx = cx + 1 - s;
      const fl = mode === 1 || (mode === 0 && !sw);       // 跨在前的是不是左腿
      const th = KNEE - ly;
      P(fx, ly, 3, th, A2.pant);                         // 前腿（迈向前）
      P(fx + (fl ? 0 : 2), ly, 1, th, fl ? A2.pantL : A2.pantD);
      P(fx, KNEE, 3, SHOE_TOP - KNEE, A2.pant);
      P(fx - 1, SHOE_TOP, 4, 2, A2.shoe);                // 前脚（脚尖朝行进方向）
      P(fx - 1, SHOE_TOP, 4, 1, A2.shoeL);
      P(bx, ly, 3, th + 1, A2.pant);                     // 后腿（蹬地，长 1px）
      P(bx + (fl ? 2 : 0), ly, 1, th + 1, fl ? A2.pantD : A2.pantL);
      P(bx, KNEE + 1, 3, SHOE_TOP - KNEE - 1, A2.pant);
      P(bx, SHOE_TOP, 4, 2, A2.shoe);                    // 后脚
      P(bx, SHOE_TOP, 4, 1, A2.shoeL);
    }
    /* ---------- 侧视的头与躯干（与相位无关，抽出来只为让 side() 读起来是"人"不是"色块"） ---------- */
    function sideBody(sw) {
      P(cx - H2 + 1, HY, HW - 2, 1, A2.hairL);
      P(cx - H2, HY + 1, HW, 1, A2.hair);
      P(cx - H2, HY + 2, HW, HH - 2, A2.skin);
      P(cx + 1, HY + 2, 3, HH - 2, A2.hair);                 // 后脑
      P(cx + H2, HY + 2, 1, HH - 2, A2.hairD);
      P(cx - H2, HY + 2, H2 + 1, 1, A2.hair);                // 刘海压额（额头有台阶）
      const EY = HY + 2 + (FACE >= 5 ? 2 : 1);               // 同正面：五官必须跟着 HY 走
      P(cx - 2, EY, 1, 1, A2.hairD);                         // 眼
      P(cx - H2, EY - 1, 1, 1, A2.skinL);                    // 额头受光
      P(cx - H2, EY + 1, 1, 1, A2.skinL);                    // 鼻尖受光（侧脸第二个台阶）
      P(cx - H2, HY + FACE, 2, 1, A2.skinD);                 // 下巴
      P(cx - 3, ty, 6, 1, A2.coatL);                         // 肩顶
      P(cx - 3, ty + 1, 6, TORSO - 1, A2.coat);              // 侧视厚度 6px（正/背面 9px）
      P(cx - 3, ty + 1, 1, TORSO - 1, A2.coatL);             // 胸前受光
      P(cx + 2, ty + 1, 1, TORSO - 1, A2.coatD);             // 后背背光
      P(cx - 3, ty + TORSO - 1, 6, 1, A2.coatD);             // 衣摆
      P(cx + 1, ty + 1, 3, TORSO - 3, A2.pack);              // 书包（侧视露在背后）
      P(cx + 3, ty + 1, 1, TORSO - 3, A2.packD);
      P(cx + 1, ty + 1, 3, 1, A2.packL);
      /* ⚠️ 侧视摆臂**故意摆 2px**（正/背面只有 1px）：侧视的"通过帧"在几何上近乎对称，
         两帧只能靠亮暗边换边 + 手臂位置区分，摆 1px 时两帧差异只有 ~20 像素、几乎看不出。
         侧视里手臂是唯一能大幅表达节奏的部位，摆大一点整个步态才读得出来。 */
      const ao = sw ? 2 : 0;
      P(cx - 4, ty + 2 + ao, 2, ARMR, A2.coatL);             // 前臂摆到身前
      P(cx - 4, ty + 2 + ao + ARMR, 2, 2, A2.skin);          // 手
    }

    if (dir === "up")        { head(false); torso(true);  arms(F.sw, true);  legs(F.fl, F.spread); }
    else if (dir === "down") { head(true);  torso(false); arms(F.sw, false); legs(F.fl, F.spread); }
    /* ⚠️ 顺序不能反：先头/躯干再腿，腿压在躯干上沿 —— 反过来衣摆会盖住大腿根。 */
    else                     { sideBody(F.sw); side(F.m, F.sw); }

    /* --- 后处理：镜像 → 描边 → 接地影（唯一一条出口）---
       ⚠️ 镜像后必须复位变换（flipH 的 translate+scale 留在 context 上），
       否则描边和接地影都会被**再镜像一次** —— 影子跑到左下（demo 现版朝右精灵就中招）。 */
    let out = c;
    if (dir === "right") { out = flipH(c); out.getContext("2d").setTransform(1, 0, 0, 1, 0, 0); }
    outlineSprite(out, 0.45);
    /* 接地影：朝右下（与树/楼/灌木同向，偏移 +1.5）。
       ⚠️ 必须在描边之后画 —— 否则影子会被描一圈边。
       ⚠️ 几何是量出来的，不是拍的：足迹必须落在 x6..16 / y27..29 内。
          试过 (cx+3, rx=8)，会铺到 x4..20 —— 右端被画布硬切，
          y29 在最右列留下一排 α54 的实心影子（肉眼是一条竖刀口）。 */
    shadowBlob(out.getContext("2d"), cx + 2, gy + 1, 5, 2, 0.46, 3);
    return out;
  };
}
const makeChar = buildChar(6);       // A 档：头 6px（4.3 头身）

/* 缓存键就是 dir + step。step 从布尔扩到 0..5 之后键自动变成 6 个相位，
   四向 × 6 = 24 张，仍是一次性烘焙（每张 18×30，总共不到 13 KB）。 */

function charSprite(dir, step) {
  const k = dir + step;
  if (!_chars[k]) _chars[k] = makeChar(dir, step);
  return _chars[k];
}

/* --- DIAG 1：内部空洞扫描（洪水填充找被实心像素围住的透明像素） --- */
function holes(fn,dir,st){
  var cv=mkCanvas(18,30),g=cv.getContext('2d');
  g.drawImage(fn(dir,st),0,0);
  var W=18,H=30,d=g.getImageData(0,0,W,H).data;
  var op=function(x,y){return d[(y*W+x)*4+3]>40;};
  var seen=new Uint8Array(W*H),q=[];
  for(var x=0;x<W;x++){q.push(x,0);q.push(x,H-1);}
  for(var y=0;y<H;y++){q.push(0,y);q.push(W-1,y);}
  while(q.length){
    var yy=q.pop(),xx=q.pop(),i=yy*W+xx;
    if(xx<0||yy<0||xx>=W||yy>=H||seen[i]||op(xx,yy))continue;
    seen[i]=1;q.push(xx+1,yy);q.push(xx-1,yy);q.push(xx,yy+1);q.push(xx,yy-1);
  }
  var out=[];
  for(var y2=0;y2<H;y2++)for(var x2=0;x2<W;x2++){
    var i2=y2*W+x2;
    /* ⚠️ 带上真实 α：α40 是"实心"阈值，介于 1..39 的像素是**半透明影子**、
       不是空洞（例：两只鞋之间那颗 α39 的地面影子）。不标出来就会被当成缺陷。 */
    if(!seen[i2]&&!op(x2,y2))out.push(x2+','+y2+'(a'+d[(y2*W+x2)*4+3]+')');
  }
  return out;
}
/* --- DIAG 2：相位差异（像素级）。相邻相位若完全相同，4 帧就白给一帧 --- */
function diff(fn,dir,a,b){
  var ca=mkCanvas(18,30),cb=mkCanvas(18,30);
  ca.getContext('2d').drawImage(fn(dir,a),0,0);
  cb.getContext('2d').drawImage(fn(dir,b),0,0);
  var da=ca.getContext('2d').getImageData(0,0,18,30).data,
      db=cb.getContext('2d').getImageData(0,0,18,30).data,n=0;
  for(var i=0;i<da.length;i++) if(da[i]!==db[i]) n++;
  return n;
}
(function(){
  var bad=window.__diag.join('|');
  var t=[];
  VARIANTS.forEach(function(v){
    ['down','up','left','right'].forEach(function(dir){
      var h=holes(v.fn,dir,0);
      t.push(v.k+'.'+dir+'='+(h.length?h.length+'@'+h.slice(0,6).join(' '):'0'));
    });
  });
  document.title='DIAG|空洞(被围住的透明像素) '+t.join(' | ')+'|'+(bad||'clean');
})();
/* 相位差异单独一行输出（放 title 里太长，画到页面上）。
   ⚠️ 必须**两两全比**，不能只看相邻帧：相邻不等只是必要条件 ——
   踩过的坑就是 4 帧行走里两个"通过帧"的正背面腿完全一样（只差手臂），
   相邻比差异够大（手臂在动）看不出来，两两比立刻暴露 min=0。 */
(function(){
  var box=document.createElement('div');
  box.style.cssText='margin:14px;padding:10px;background:#232a35;border-radius:6px';
  var lines=['<b>DIAG 相位差异（两两全比）</b>—— 行走 4 帧 + 待机 2 帧，'
           + '每一对都必须不同；<b>min=0 就是有两帧一模一样 = 缺陷</b>'];
  ['down','up','left','right'].forEach(function(dir){
    var lo=1e9, who='';
    /* 行走 4 帧两两比 */
    for(var i=0;i<4;i++)for(var j=i+1;j<4;j++){
      var n=diff(makeChar,dir,i,j);
      if(n<lo){lo=n;who=i+'/'+j;}
    }
    /* 待机两帧也要不同，且要与行走帧不同 */
    var idle=diff(makeChar,dir,4,5);
    var cross=1e9, cw='';
    for(var k=0;k<4;k++){
      var m=diff(makeChar,dir,k,4);
      if(m<cross){cross=m;cw=k+'/4';}
    }
    lines.push('<span class="k">'+dir+'</span>  行走两两最小 '+lo+'（'+who+'）'
             + '　待机 4/5=' + idle + '　行走×待机最小 ' + cross + '（' + cw + '）');
  });
  box.innerHTML=lines.join('<br>');
  document.body.appendChild(box);
})();
