<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北交大像素校园 · 保卫处值班窗口</title>
<!--
  保安 · 老丁 —— 独立交付件（单文件前端，零依赖零构建，file:// 双击可用）
  交付内容（保安.md §六）：
    ① 登录窗口（昵称+密码，走轻后端账号服务；进不去就聊不了）
    ② 聊天界面（登录后的主界面，失物 / 找物 / 报修三个入口都在这里）
    ③ 本角色功能本体：四维失物匹配 matchLostItem / 以图搜物 matchByImage【云端】/
       证件 OCR 双字段核对 / 报修 reportRepair / 工单查询与销单 / 推诿边界
  对外暴露 window.GuardAPI = { matchLostItem, matchByImage, reportRepair, ... }（合体契约）
  地图对接：MapBridge 为预留接口桩（见下方注释），功能调用点已接入，待地图组实现。
  数据：优先 fetch data/*.json（由账号服务托管），file:// 下回退到内嵌种子，两份内容保持一致。
-->
<style>
:root{
  --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --line:#e2e8f0; --line2:#cbd5e1;
  --txt:#1e293b; --dim:#64748b; --amber:#d97706; --blue:#2563eb; --green:#16a34a; --red:#dc2626;
  --guard:#3b82f6; --me:#b45309;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

/* ---------- 登录窗口 ---------- */
#login-view{height:100%;display:flex;align-items:center;justify-content:center;background:
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(37,99,235,.05) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(37,99,235,.05) 31px 32px),var(--bg)}
.login-card{width:360px;background:var(--panel);border:2px solid var(--line);padding:26px 26px 20px;image-rendering:pixelated}
.login-card h1{font-size:17px;letter-spacing:2px;color:var(--amber);text-align:center;margin-bottom:2px}
.login-card .sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:14px}
.login-sprite{display:block;margin:0 auto 10px;image-rendering:pixelated}
.tabs{display:flex;border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;background:transparent;border:none;color:var(--dim);padding:7px 0;letter-spacing:2px}
.tabs button.on{background:var(--line2);color:var(--txt)}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px;letter-spacing:1px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;outline:none}
.field input:focus{border-color:var(--blue)}
#li-submit{width:100%;background:var(--amber);color:#ffffff;border:none;padding:9px 0;font-weight:700;letter-spacing:4px;margin-top:6px}
#li-submit:hover{filter:brightness(1.08)}
#li-msg{min-height:18px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
#li-health{text-align:center;font-size:12px;color:var(--dim);margin-top:6px}
#li-health b{font-weight:400}
#li-health .ok{color:var(--green)} #li-health .bad{color:var(--red)}

/* ---------- 聊天界面 ---------- */
#chat-view{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:2px solid var(--line);padding:8px 14px}
header .mini{image-rendering:pixelated}
header .title{font-weight:700;letter-spacing:1px}
header .title small{display:block;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:0}
.chip{font-size:12px;border:1px solid var(--line);padding:2px 9px;color:var(--dim)}
.chip.duty{color:var(--green);border-color:#86efac}
.chip.off{color:var(--amber);border-color:#fcd34d}
#clock{font-size:12px;color:var(--blue);border:1px dashed var(--line);padding:2px 9px;background:transparent}
#clock:hover{border-color:var(--blue)}
header .sp{flex:1}
.hbtn{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:3px 10px}
.hbtn:hover{color:var(--txt);border-color:var(--dim)}

#main{flex:1;display:flex;min-height:0}
#chat-col{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.row.sys{justify-content:center}
.bubble{max-width:76%;padding:8px 12px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-break:break-word}
.row.me .bubble{background:#fef3c7;border-color:#fcd34d}
.row.sys .bubble{max-width:92%;background:transparent;border:1px dashed var(--line2);color:var(--dim);font-size:12px;padding:4px 10px}
.avatar-c{width:34px;height:34px;flex:none;image-rendering:pixelated;border:1px solid var(--line);background:var(--panel2)}
/* guard 消息名字条 */
.row.guard .gtxt{display:flex;flex-direction:column;gap:3px;max-width:76%}
.gname{font-size:11px;color:var(--amber);letter-spacing:1px;padding-left:2px}
.row.guard .gtxt .bubble{max-width:100%}
.row.guard .gtxt .cards{max-width:100%;width:100%}
.bubble{border-radius:8px}
.item-card,.order-card{border-radius:8px}

/* 老丁动漫立绘——左下角，随对话切表情 + 场景气泡 */
#chat-col{position:relative}
#guard-portrait{position:absolute;left:10px;bottom:56px;z-index:6;width:150px;pointer-events:auto;user-select:none;cursor:pointer}
#guard-portrait .pt-frame{position:relative;animation:breathe 3.4s ease-in-out infinite}
#guard-portrait svg.ding{width:150px;height:auto;display:block;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.2))}
#guard-portrait.bump .pt-frame{animation:bump .35s ease}
.pt-tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;letter-spacing:2px;color:var(--amber);background:rgba(255,255,255,.92);
  border:1px solid var(--line);padding:2px 12px;border-radius:10px}
.pt-mood{position:absolute;right:2px;top:30px;font-size:15px;animation:bump .35s ease;
  background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center}
#pt-bubble{position:absolute;left:146px;bottom:104px;width:248px;max-width:46vw;display:none;
  background:linear-gradient(180deg,#ffffff,#f8fafc);border:1px solid #cbd5e1;
  border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.65;color:#1e293b;z-index:8;
  box-shadow:0 10px 28px rgba(0,0,0,.12);cursor:pointer}
#pt-bubble.show{display:block;animation:bubbleIn .22s ease}
#pt-bubble:after{content:'';position:absolute;left:-7px;bottom:26px;width:12px;height:12px;
  background:#ffffff;border-left:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;
  transform:rotate(45deg)}
#pt-bubble .go{display:block;margin-top:5px;font-size:12px;color:var(--amber)}
#pt-bubble .typing{display:inline-block;letter-spacing:2px;color:var(--blue);animation:blink 1s infinite}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bump{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
#msgs{padding-bottom:172px}
@media (max-width:700px){
  #guard-portrait{width:104px} #guard-portrait svg.ding{width:104px}
  #msgs{padding-bottom:128px} #qa-row,#draft-bar{padding-left:128px}
  #pt-bubble{left:0;bottom:132px;width:210px;max-width:60vw} #pt-bubble:after{left:18px;bottom:-7px;transform:rotate(-135deg)}
}

/* 右上角小挂件——可拖拽的老丁头像 */
#ding-pet{position:fixed;z-index:40;width:74px;top:66px;right:18px;cursor:grab;touch-action:none;user-select:none}
#ding-pet.dragging{cursor:grabbing}
#ding-pet .pet-head{position:relative;width:62px;margin:0 auto}
#ding-pet svg.ding-mini{width:62px;height:62px;display:block;border-radius:50%;object-fit:cover;
  border:2px solid #cbd5e1;background:#f8fafc;box-shadow:0 6px 16px rgba(0,0,0,.15)}
#ding-pet .pet-pill{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;color:#475569;background:rgba(255,255,255,.92);border:1px solid #cbd5e1;border-radius:9px;padding:1px 7px}
#ding-pet .pet-pill i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ddc84;margin-right:4px;vertical-align:1px}
#pet-badge{position:absolute;right:-3px;top:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:#f0464d;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;
  border:1px solid #ffffff;font-weight:700}
#pet-badge.show{display:flex}
#pet-bubble{position:absolute;right:72px;bottom:26px;width:190px;display:none;background:#ffffff;
  border:1px solid #cbd5e1;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.55;color:#1e293b;
  box-shadow:0 8px 22px rgba(0,0,0,.1)}
#pet-bubble.show{display:block;animation:bubbleIn .2s ease}
#pet-bubble:after{content:'';position:absolute;right:-6px;bottom:18px;width:10px;height:10px;background:#ffffff;
  border-right:1px solid #cbd5e1;border-top:1px solid #cbd5e1;transform:rotate(45deg)}
@media (max-width:700px){ #ding-pet{width:62px;top:58px;right:10px} #ding-pet svg.ding-mini{width:52px;height:52px} }
.photo-thumb{max-width:180px;max-height:140px;display:block;image-rendering:auto;border:1px solid var(--line)}
.photo-dropped{font-size:11px;color:var(--dim)}

/* 候选失物卡片 */
.cards{display:flex;flex-direction:column;gap:8px;max-width:86%}
.item-card{border:1px solid var(--line);background:var(--panel2);padding:8px 10px}
.item-card.best{border-color:var(--amber)}
.item-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.item-card .cat{color:var(--amber);font-weight:700}
.item-card .best-tag{font-size:11px;background:var(--amber);color:#ffffff;padding:0 6px}
.item-card .score{margin-left:auto;font-size:12px;color:var(--blue)}
.item-card .meta{font-size:12px;color:var(--dim)}
.bar{height:5px;background:var(--line2);margin:6px 0}
.bar i{display:block;height:100%;background:var(--blue)}
.item-card.best .bar i{background:var(--amber)}
.dims{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.dims span{font-size:11px;color:var(--dim);border:1px solid var(--line2);padding:0 5px}
.dims span.hit{color:var(--green);border-color:#bbf7d0}
.claim-btn{background:transparent;border:1px solid var(--line);color:var(--blue);font-size:12px;padding:2px 10px}
.claim-btn:hover{border-color:var(--blue)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.opt-btn{background:var(--panel2);border:1px solid var(--blue);color:var(--blue);font-size:12px;padding:4px 12px;cursor:pointer;letter-spacing:1px}
.opt-btn:hover{background:rgba(59,130,246,.1)}
.opt-btn.ghost{border-color:var(--line);color:var(--dim)}
.opt-btn.ghost:hover{border-color:var(--amber);color:var(--amber);background:transparent}

/* 工单卡片 */
.order-card{border:1px solid var(--line);background:var(--panel2);padding:7px 10px;font-size:13px;max-width:86%}
.order-card .oid{color:var(--blue);font-weight:700;margin-right:8px}
.badge{font-size:11px;padding:0 6px;border:1px solid}
.badge.s0{color:var(--blue);border-color:#bfdbfe}
.badge.s1{color:var(--amber);border-color:#fcd34d}
.badge.s2{color:var(--green);border-color:#bbf7d0}
.order-card .meta{color:var(--dim);font-size:12px}

/* 快捷入口 + 输入区 */
#qa-row{display:flex;gap:8px;padding:8px 14px 0 172px;flex-wrap:wrap}
.qa{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:12px;padding:4px 12px;letter-spacing:1px}
.qa:hover{border-color:var(--amber);color:var(--amber)}
#draft-bar{display:flex;align-items:center;gap:10px;padding:8px 14px 0 172px}
#draft-bar .thumb{width:56px;height:56px;object-fit:cover;border:1px solid var(--line);border-radius:4px}
#draft-bar .draft-tip{font-size:12px;color:var(--dim)}
#draft-bar .rm{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);padding:2px 10px;cursor:pointer;font-size:12px}
#draft-bar .rm:hover{color:var(--red);border-color:var(--red)}
#input-row{display:flex;gap:8px;padding:10px 14px 14px}
#inp{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:10px 12px;outline:none}
#inp:focus{border-color:var(--blue)}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:0 14px}
.icon-btn:hover{color:var(--amber);border-color:var(--amber)}
#btn-send{background:var(--guard);border:1px solid #60a5fa;color:#ffffff;padding:0 22px;letter-spacing:2px}

/* 地图接口面板（预留） */
#map-panel{width:280px;flex:none;border-left:2px solid var(--line);background:var(--panel2);display:flex;flex-direction:column}
#map-panel .ph-title{padding:10px 12px 4px;font-size:13px;color:var(--amber);letter-spacing:1px}
#map-panel .ph-sub{padding:0 12px 8px;font-size:11px;color:var(--dim);border-bottom:1px dashed var(--line2)}
#map-holder{margin:10px 12px;border:1px dashed var(--line);height:150px;position:relative;
  background:repeating-linear-gradient(0deg,transparent 0 15px,rgba(37,99,235,.06) 15px 16px),
  repeating-linear-gradient(90deg,transparent 0 15px,rgba(37,99,235,.06) 15px 16px)}
#map-holder .ph-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;letter-spacing:2px}
#map-log-title{padding:4px 12px;font-size:12px;color:var(--dim)}
#map-log{flex:1;overflow-y:auto;padding:0 12px 12px;font-size:11px;color:var(--dim)}
#map-log .ln{border-bottom:1px dashed var(--line2);padding:4px 0;word-break:break-all}
#map-log .ln b{color:var(--blue);font-weight:400}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--line)}
@media (max-width:900px){ #map-panel{display:none} }
</style>
</head>
<body>

<!-- ======================= ① 登录窗口 ======================= -->
<section id="login-view">
  <div class="login-card">
    <canvas id="login-sprite" class="login-sprite" width="12" height="13"></canvas>
    <h1>保卫处 · 值班窗口</h1>
    <div class="sub">北交大像素校园 —— 保安 · 老丁</div>
    <div class="tabs">
      <button id="tab-login" class="on">登 录</button>
      <button id="tab-reg">注 册</button>
    </div>
    <div class="field"><label>昵称</label><input id="li-nick" maxlength="16" placeholder="怎么称呼你"></div>
    <div class="field"><label>密码</label><input id="li-pass" type="password" maxlength="32" placeholder="设个密码，至少6位"></div>
    <button id="li-submit">进 入</button>
    <div id="li-msg"></div>
    <div id="li-health">正在连接账号服务……</div>
  </div>
</section>

<!-- ======================= ② 聊天界面（登录后主界面） ======================= -->
<section id="chat-view" class="hidden">
  <header>
    <canvas id="hd-sprite" class="mini" width="12" height="13" style="width:28px;height:30px"></canvas>
    <div class="title">保安 · 老丁<small id="role-line">保卫处值班 · 公文腔</small></div>
    <span id="status-chip" class="chip">—</span>
    <button id="clock" title="点击可拨时间（演示用）">--:--</button>
    <span class="sp"></span>
    <button id="btn-reset" class="hbtn" title="清空本地数据重新来">重置数据</button>
    <button id="btn-logout" class="hbtn">退出</button>
  </header>
  <div id="main">
    <div id="chat-col">
      <div id="msgs"></div>
      <div id="guard-portrait" data-mood="idle" title="保安 · 老丁">
        <div class="pt-frame">
          <div id="guard-art" class="ding-art"></div>
          <span class="pt-tag">保安 · 老丁</span>
          <span class="pt-mood" id="pt-mood"></span>
        </div>
        <div id="pt-bubble"><span id="pt-bubble-txt"></span><span class="go">点我接着说 →</span></div>
      </div>
      <div id="qa-row">
        <button class="qa" data-act="lost_search">找失物</button>
        <button class="qa" data-act="lost_intake">登记失物</button>
        <button class="qa" data-act="repair">报修</button>
        <button class="qa" data-act="claim">认领核对</button>
        <button class="qa" data-act="call">呼叫老丁</button>
      </div>
      <div id="draft-bar" class="hidden"></div>
      <div id="input-row">
        <button id="btn-photo" class="icon-btn" title="拍照或选图——找东西、认证件">图</button>
        <input id="file-in" type="file" accept="image/*" capture="environment" class="hidden">
        <input id="inp" placeholder="跟老丁说句话……">
        <button id="btn-send">发送</button>
      </div>
    </div>
    <aside id="map-panel">
      <div class="ph-title">地图层 · MapBridge</div>
      <div class="ph-sub">预留接口（本期不实现）。focus / addPin / highlight / setLayer / findPath / nearestWalkable / on——功能调用点已接入，待地图组按总体设计 §8 实现后自动生效。</div>
      <div id="map-holder"><div class="ph-txt">地图未接入</div></div>
      <div id="map-log-title">接口调用记录</div>
      <div id="map-log"></div>
    </aside>
  </div>
  <!-- 可拖拽小挂件：老丁执勤头像 -->
  <div id="ding-pet" title="拖我换个位置，点我有话说">
    <div id="pet-bubble"></div>
    <div class="pet-head">
      <span id="pet-badge">0</span>
      <div id="pet-art"></div>
      <span class="pet-pill"><i></i><b id="pet-state">老丁 · 值班中</b></span>
    </div>
  </div>
</section>

<script>
'use strict';
/* ============================================================
 * 配置
 * ============================================================ */
const CFG = {
  dataVersion: 1,
  weights: { category: 0.40, place: 0.25, time: 0.15, text: 0.20 },  // 四维权重（保安.md §五 待定项1，此处由 4 号定）
  thMatch: 0.55, thHedge: 0.42,
  maxTop: 3
};
const CARD_CATS = ['校园卡', '学生证', '身份证'];

/* ============================================================
 * MapBridge —— 与地图层对接的预留接口（本交付不实现，桩已就位）
 * 合体时由地图组提供的 MapAPI（总体设计 §8 / 附录A）替换以下实现即可；
 * 业务调用点均已接入（搜索 “MAP:” 注释），业务代码无需改动。
 * 点位表 data/points.json 的 mapId 字段即「合体对齐约定」：对齐 campus.json 的 places[].id。
 * ============================================================ */
const MapLog = []; let pinSeq = 0;
const MapBridge = {
  ready: false, // 地图层未接入
  _log(fn, args){
    MapLog.unshift({ t: fmtClock(), fn, args: JSON.stringify(args) });
    if (MapLog.length > 40) MapLog.pop();
    renderMapLog();
    console.info('[MapBridge]', fn, args);
  },
  focus(placeId){ this._log('focus', [placeId]); return null; },             // MAP: 镜头飞向地点并高亮（AI 带路）
  highlight(ids){ this._log('highlight', [ids]); return null; },             // MAP: 高亮一组地点
  addPin(pin){ this._log('addPin', [pin]); return 'pin_' + (++pinSeq); },    // MAP: 打标记，返回 pinId
  setLayer(name, ids){ this._log('setLayer', [name, ids]); return null; },   // MAP: 按条件切图层
  getPlace(id){ this._log('getPlace', [id]); return null; },                 // MAP: 查询地点
  listPlaces(){ this._log('listPlaces', []); return []; },                   // MAP: 列出地点
  nearestWalkable(x, y){ this._log('nearestWalkable', [x, y]); return { x, y }; }, // MAP: 最近可行走点
  getPlayerPos(){ this._log('getPlayerPos', []); return null; },             // MAP: 取玩家当前世界坐标（呼叫寻路终点）
  findPath(from, to){ this._log('findPath', [from, to]); return null; },     // MAP: 寻路；返回 null 时业务层自行降级
  on(evt, cb){ this._log('on', [evt]); return null; }                        // MAP: enter / leave 触发圈
};

/* ============================================================
 * 工具函数
 * ============================================================ */
const $ = s => document.querySelector(s);
function nowMs(){ return Date.now(); }
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtClock(){ const d=curDate(); const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
let timeOverride = null; // 演示拨时间 {h, m}
function curDate(){ const d=new Date(); if(timeOverride){ d.setHours(timeOverride.h, timeOverride.m, 0, 0); } return d; }
function currentHour(){ return curDate().getHours(); }
function inServiceHours(){ const h=currentHour(); return h >= 8 && h < 22; } // 应答时段 08:00–22:00（总体设计 §6.1）
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
 * 数据层：种子加载（fetch 优先，file:// 回退内嵌）+ localStorage 分片
 * 公共层（失物库 / 工单库）= 保安.md §3.1 的「隔离期写法」：
 * 独立即我自己这两个 JSON；合体时并入公共层，代码一行不改。
 * ============================================================ */
const EMBED = {
  points: JSON.parse($('#seed-points').textContent),
  lostitems: JSON.parse($('#seed-lostitems').textContent),
  workorders: JSON.parse($('#seed-workorders').textContent),
  agent: JSON.parse($('#seed-agent').textContent)
};
async function fetchJSON(url, fb){ try{ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return fb; } }

const Store = {
  points: [], lost: [], orders: [], agent: EMBED.agent,
  key(k){ return 'guard_v' + CFG.dataVersion + '_' + k; },
  async init(){
    this.points = (await fetchJSON('data/points.json', EMBED.points)).points;
    const lj = await fetchJSON('data/lostitems.json', EMBED.lostitems);
    const wj = await fetchJSON('data/workorders.json', EMBED.workorders);
    this.agent = await fetchJSON('data/agents/guard.json', EMBED.agent);
    // 物化种子：hoursAgo → 绝对时间；数据版本变化时重播
    let seeded = false;
    try{ if(localStorage.getItem(this.key('seedver')) != String(lj.version + '-' + wj.version)) seeded = true; }catch(e){ seeded = true; }
    let lost = null, orders = null;
    try{ lost = JSON.parse(localStorage.getItem(this.key('lost')) || 'null'); orders = JSON.parse(localStorage.getItem(this.key('orders')) || 'null'); }catch(e){}
    if(seeded || !lost || !orders){
      lost = lj.items.map(it => { const {hoursAgo, ...o} = it; o.foundTime = nowMs() - hoursAgo*3600e3; if(o.storageTime == null) o.storageTime = o.foundTime; return o; });
      orders = wj.orders.map(o => { const {hoursAgo, ...r} = o; r.time = nowMs() - hoursAgo*3600e3; return r; });
      this.saveLost(lost); this.saveOrders(orders);
      localStorage.setItem(this.key('seedver'), String(lj.version + '-' + wj.version));
    }
    this.lost = lost; this.orders = orders;
  },
  saveLost(v){ this.lost = v; localStorage.setItem(this.key('lost'), JSON.stringify(v)); },
  saveOrders(v){ this.orders = v; localStorage.setItem(this.key('orders'), JSON.stringify(v)); },
  reset(){ localStorage.removeItem(this.key('lost')); localStorage.removeItem(this.key('orders')); localStorage.removeItem(this.key('seedver')); },
  pointById(id){ return this.points.find(p => p.id === id) || null; },
  // 别称解析：点位名 / 别称最长匹配（保安.md §2.4 / 总体设计 §4.5 别称边思想）
  resolvePlace(text){
    let best = null;
    for(const p of this.points){
      for(const a of [p.name, ...p.aliases]){
        if(!a || !text.includes(a)) continue;
        // 数字边界：别称以数字结尾时（如 DQ2、12号楼），后一个字符不能也是数字，避免 DQ201 被当成 DQ2
        const idx = text.indexOf(a);
        if(/\d$/.test(a) && /\d/.test(text[idx + a.length] || '')) continue;
        if(!best || a.length > best.alias.length) best = { point: p, alias: a };
      }
    }
    // 通用教学楼简称：一教/二教/.../十教 → 第一教学楼/.../第十教学楼
    if(!best){
      const CN = '一二三四五六七八九十';
      const m = text.match(new RegExp('([' + CN + '])教'));
      if(m){
        const idx = CN.indexOf(m[1]) + 1;
        const full = '第' + ['','一','二','三','四','五','六','七','八','九','十'][idx] + '教学楼';
        const p = this.points.find(pp => pp.name === full);
        if(p) best = { point: p, alias: m[1] + '教' };
      }
    }
    return best;
  },
  itemById(id){ return this.lost.find(i => i.id === id) || null; },
  orderById(id){ return this.orders.find(o => o.id === id) || null; },
  addLost(entry){ this.lost.unshift(entry); this.saveLost(this.lost); updatePetBadge(); return entry; },
  // 认领办结：当面确认、失主拿到手后才销账（returned）；此前一律保持在库 in_storage
  markReturned(id, to){
    const it = this.itemById(id); if(!it) return null;
    it.status = 'returned'; it.returnedTime = nowMs(); it.returnedTo = to || null;
    this.saveLost(this.lost); updatePetBadge(); return it;
  },
  addOrder(o){ this.orders.unshift(o); this.saveOrders(this.orders); return o; },
  // 私密记忆（visibility:private, 仅本人可见；公共层两条 JSON 不收对话内容——保安.md §4.3）
  memKey(){ return this.key('player_' + (state.user ? state.user.user_id : 'anon')); },
  memPush(desc, importance){
    let list = []; try{ list = JSON.parse(localStorage.getItem(this.memKey()) || '[]'); }catch(e){}
    list.unshift({ desc, time: fmtTime(nowMs()), importance, visibility:'private', playerId: state.user? state.user.user_id : null, source:'玩家' });
    localStorage.setItem(this.memKey(), JSON.stringify(list.slice(0, 50)));
  },
  memList(){ try{ return JSON.parse(localStorage.getItem(this.memKey()) || '[]'); }catch(e){ return []; } }
};

/* ============================================================

function normCategory(text){
  const t = String(text).toLowerCase(); let best = null;
  for(const [cat, arr] of CATEGORY_ALIAS) for(const a of arr)
    if(t.includes(a) && (!best || a.length > best.alias.length)) best = { cat, alias: a };
  return best;
}
const isCardCat = c => CARD_CATS.includes(c);
const FEATURE_WORDS = ['红','橙','黄','绿','蓝','紫','黑','白','灰','粉','金','银','透明','贴纸','卡通','图案','带盖','保温','不锈钢','磨砂','长柄','折叠','有线','无线','蓝牙','头戴','入耳','挂绳','卡套','条纹','格子','小熊','磨损','掉漆','裂纹','壳','套','绳','链','单把','一串','旧','新','弯钩','胶皮'];
function featureHits(t){ const s=String(t).toLowerCase(); const out=[]; for(const w of FEATURE_WORDS) if(s.includes(w)) out.push(w);
  (s.match(/[a-z0-9]+/g)||[]).forEach(w=>{ if(w.length>=2) out.push(w); }); return out; }
function bigrams(t){ const s=String(t).replace(/[\s，。,.!？?、]/g,''); const out=new Set(); for(let i=0;i<s.length-1;i++) out.add(s.slice(i,i+2)); return out; }
function textScore(qDesc, item){
  const qf = featureHits(qDesc), itf = featureHits((item.desc||'') + ' ' + (item.category||''));
  let lex = 0; if(qf.length) lex = qf.filter(w => itf.includes(w)).length / qf.length;
  const qb = bigrams(qDesc), ib = bigrams((item.desc||'') + (item.category||''));
  let bg = 0; if(qb.size){ let n=0; qb.forEach(b=>{ if(ib.has(b)) n++; }); bg = n/qb.size; }
  if(!qf.length && !qb.size) return 0.5;
  return 0.7*lex + 0.3*bg;
}
function parseWhen(t){
  const now = nowMs();
  const cnNum = s => ({'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10}[s]||parseInt(s));
  const mH = t.match(/(\d+)\s*(个)?小时前/); if(mH) return new Date(now - (+mH[1])*3600e3);
  const mN = t.match(/(\d+)\s*天前/);
  const mW = t.match(/([一二三四五六七八九十\d]+)\s*(个)?周前|([一二三四五六七八九十\d]+)\s*星期前/);
  let days = null;
  if(mN) days = +mN[1];
  else if(mW) days = cnNum(mW[1]||mW[3]) * 7;
  else if(/大前天/.test(t)) days = 3;
  else if(/前天/.test(t)) days = 2;
  else if(/昨天/.test(t)) days = 1;
  else if(/今天/.test(t)) days = 0;
  else if(/刚才|刚刚|现在|立马/.test(t)) return new Date(now - 2*3600e3);
  if(days == null) return null;
  const d = new Date(now - days*86400e3);
  let hh = 12, mm = 0;
  if(/早上|清晨/.test(t)) hh = 8; else if(/上午/.test(t)) hh = 10; else if(/中午/.test(t)) hh = 12;
  else if(/下午/.test(t)) hh = 15; else if(/晚上/.test(t)) hh = 20;
  const mT = t.match(/(\d{1,2})[点:：]\s*(\d{1,2})?分?/);
  if(mT){ hh = +mT[1]; mm = +(mT[2]||0); if((/下午|晚上/.test(t)) && hh < 12) hh += 12; }
  d.setHours(hh, mm, 0, 0); return d;
}
function parseSid(t){ const m = String(t).replace(/\s/g,'').match(/\d{8,12}/); return m ? m[0] : null; }
function parseName(t){
  const m = String(t).match(/(?:我叫|我是|姓名[：:]?|名字[：:]?)\s*([\u4e00-\u9fa5]{2,4})/);
  if(m) return m[1];
  const bare = String(t).replace(/[0-9a-zA-Z是我叫的，,。.\s：:]/g, '');  // 支持与学号混写：「20231234 李某某」
  return /^[\u4e00-\u9fa5]{2,4}$/.test(bare) ? bare : null;
}
// 学号尾号：「尾号1035」「尾号是1035」「后四位1035」「末三位123」
function parseSidTail(t){

}

// 意图分类（纯关键词，有序短路）
function classify(text){
  const t = text;
  if(/(呼叫|叫一(下|声)|老丁|保安).*(过来|来一趟|来一|赶)|^(呼叫|过来一下)$/.test(t) || t === '呼叫老丁') return 'call';
  if(/^(你好|您好|嗨|hi|hello|在吗|在不在)[!！。~\s]*$/i.test(t)) return 'greet';
  if(/(我(以前|之前)?(报过|丢过|登记过))|我的(报修|失物|工单|记录)/.test(t)) return 'my_records';
  if(/(修好(了)?(吗|没)|维修进度|工单|报的修|处理(了吗|了没|没有)|受理(了吗|了没)|进度)/.test(t)) return 'repair_query';
  if(/(已经修好|修好了|还没修|还在修|修着|不用修)/.test(t)) return 'repair_status';
  if(/(报修|坏了|坏掉|漏水|漏电|不亮|失灵|故障|堵了|下水|灯管|水龙头)/.test(t)) return 'repair_report';
  if(/(捡到|拾到|拾获|上交|交到保卫处)/.test(t)) return 'lost_intake';
  if(/(认领|来拿|来取|是我的|取东西|领东西)/.test(t)) return 'claim';
  if(/(丢|不见|找不到|落下|忘在|失物|找东西|帮.*找|有没有人捡)/.test(t)) return 'lost_search';
  if(/(门禁|刷卡|门卡|进不去楼|门坏了)/.test(t)) return 'door';
  if(/(选课|绩点|挂科|考研|转专业|社团|食堂|好吃|评分|窗口|课程表|老师|上课|教务)/.test(t)) return 'refuse';
  if(/(在哪|怎么走|怎么去|地图|位置|路线)/.test(t)) return 'ask_way';
  return 'unknown';
}

/* ============================================================
 * Qwen3.8-Flash 视觉识别（同源后端代理 → 阿里云百炼，保安.md §3.3 升级路）
 * kind: 'item' 失物外观识别 / 'card' 证件 OCR；未配 key 或超时由调用方降级
 * ============================================================ */
class VisionError extends Error {
  constructor(code, msg){ super(msg || code); this.code = code; }
}
async function visionRecognize(image, kind){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let r;
  try{
    r = await fetch('/api/vision/recognize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ kind, image }), signal: ctrl.signal });
  }catch(e){ clearTimeout(timer); throw new VisionError('net', String(e.message || e)); }
  clearTimeout(timer);
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(r.ok) return j;
  const d = j.detail || {};
  if(r.status === 503 && d.code === 'no_key') throw new VisionError('no_key', d.msg);
  throw new VisionError(d.code || ('http_' + r.status), d.msg || ('HTTP ' + r.status));
}
const VISION_KEY_HINT = '图像识别还没配 Qwen key：把百炼平台申请的 sk- 开头密钥存进 server/qwen_key.txt 后重启服务就能用（README 有步骤）。';
function visionItemSummary(d){
  return [d.category, [d.color, d.brand, d.desc].filter(Boolean).join('，')].filter(Boolean).join('：');
}

// ---- 四维相似度匹配（核心算法，保安.md §3.2）----
// query: {category?, place(Point|null), when(Date|null), desc}
// 外观维：文字检索走关键词/二元匹配；以图搜物时 Qwen 把照片转成外观描述后同样走这一维
function scoreItem(q, item){
  const dims = {};
  dims.category = q.category ? (item.category === q.category ? 1 : 0.12) : 0.5;
  if(q.place && item.x != null){
    const d = Math.hypot(item.x - q.place.x, item.y - q.place.y);
    dims.place = Math.exp(-d / 150);            // 人在哪丢的，东西多半在附近被捡到
  } else dims.place = 0.5;
  if(q.when && item.foundTime){
    const h = Math.abs(item.foundTime - q.when.getTime()) / 3600e3;
    dims.time = Math.exp(-h / 30);              // 隔了三天的大概率不是你的
  } else dims.time = 0.5;
  dims.text = q.desc ? textScore(q.desc, item) : 0.5;
  const W = CFG.weights;
  return { total: W.category*dims.category + W.place*dims.place + W.time*dims.time + W.text*dims.text, dims };
}
function toolMatchLostItem(query){
  let pool = Store.lost.filter(it => it.status === 'in_storage');
  if(query.category) pool = pool.filter(it => it.category === query.category); // 类别先粗筛
  return pool.map(it => ({ it, s: scoreItem(query, it) }))
             .sort((a,b) => b.s.total - a.s.total).slice(0, CFG.maxTop);
}

// ---- 以图搜物（全走 Qwen3.8：看图 → 类别+外观描述 → 文字四维匹配；保安.md §3.3 升级路）----
// vision 可选：调用方已先做过一次识别（如自由态分路）时直接传入，一张照片只打一次 Qwen
async function toolMatchByImage({ image, query, vision }){
  query = query || { category:null, place:null, when:null, desc:'' };
  try{
    const v = vision || await visionRecognize(image, 'item');
    const dd = v.data || {};
    const sum = visionItemSummary(dd);
    if(!sum) return { mode:'image_empty', hits:[], reason:'照片里没认出具体物品' };
    const nc = dd.category && !query.category ? normCategory(dd.category) : null;
    const q2 = { ...query,
      desc: query.desc ? query.desc + '；' + sum : sum,
      category: query.category || (nc ? nc.cat : (dd.category || null)) };
    const hits = toolMatchLostItem(q2);
    if(!hits.length) return { mode:'image_empty', hits:[], reason:'库里没有匹配物品', summary: sum };
    return { mode:'image', hits, summary: sum, query: q2 };
  }catch(e){
    // Qwen 未配 key / 超时 → 主动降级到文字匹配（附录 D：主动演示降级反而加分）
    return { mode:'degraded', reason: (e && e.code === 'no_key') ? 'no_key' : String(e && e.message || e),
             hits: (query.desc || '').trim() ? toolMatchLostItem(query) : [] };
  }
}

function toolVerifyClaim(entry, { studentId, name }){
  if(!entry) return { pass:false, reason:'无此条目' };
  if(entry.studentId && studentId && entry.studentId !== studentId) return { pass:false, reason:'学号对不上' };
  if(entry.name && name && entry.name !== name) return { pass:false, reason:'姓名对不上——认错一位就是认错人' };
  if(!name) return { pass:false, reason:'缺姓名' };
  return { pass:true };
}

function toolReportRepair({ place, problem, reporter }){
  const p = Store.resolvePlace(place || '');
  const pt = p ? p.point : null;
  const order = Store.addOrder({
    id:'W-' + String(nowMs()).slice(-6) + String(Math.floor(Math.random()*9)),
    place: pt ? pt.name : (place || '未指明'), placeId: pt ? pt.id : null,
    x: pt ? pt.x : null, y: pt ? pt.y : null,
    problem, status:'已受理', reporter, time: nowMs(), visibility:'public'
  });
  // MAP: 报修地点在地图上打标记（地图层实现后可见）
  if(pt) MapBridge.addPin({ placeId: pt.id, label: pt.name + ' · 报修', type:'repair', ref: order.id });
  return order;
}
function toolQueryRepair({ place, reporter }){
  let rows = Store.orders;
  if(place){ const p = Store.resolvePlace(place); rows = p ? rows.filter(o => o.placeId === p.point.id) : rows.filter(o => o.place.includes(place)); }
  if(reporter) rows = [...rows.filter(o => o.reporter === reporter), ...rows.filter(o => o.reporter !== reporter)];
  return rows.slice(0, 6);
}
function toolUpdateRepair({ place, status }){
  const p = Store.resolvePlace(place || '');
  const rows = Store.orders.filter(o => o.status !== '已完成' && (p ? o.placeId === p.point.id : true));
  if(!rows.length) return null;
  rows[0].status = status; Store.saveOrders(Store.orders);
  return rows[0];
}

function drawSprite(cv, scale){
  const ctx = cv.getContext('2d');

// 按消息内容/类型自动判定表情
function autoMood(m){
  if(m.who === 'sys') return /正在|稍等/.test(m.text || '') ? 'think' : null;
  if(m.who !== 'guard') return null;
  const t = m.text || '';
  if(m.kind === 'orders') return 'busy';
  if(m.kind === 'cards') return /最像/.test(m.note || '') ? 'found' : 'think';
  if(/受理|入库了|销单|工单/.test(t)) return 'busy';
  if(/对上了|没跑|是你的|值班点领|来保卫处领|最像这一条|找到了/.test(t)) return 'found';
  if(/没有对得上|还没人捡到|没登记着|确实没/.test(t)) return 'none';
  if(/管不了|不归|找学长|找阿姨|找小北|教务处|向导/.test(t)) return 'refuse';
  if(/学号|姓名|证件|校园卡|核对|念给你|确认一下|念一下|我念/.test(t)) return 'serious';
  if(/来了来了|丢东西、报修|丢什么了|报修是吧|认领东西|登记捡到|说吧|什么事/.test(t)) return 'greet';
  if(/补充|再补|查了|比对|有点像|说清楚|说说|先讲|再想想/.test(t)) return 'think';
  return 'idle';
}

function addr(){ const n = state.user && state.user.nickname; return n ? n + '，' : ''; }

const FLOWS = {

  lost_search: {

      const f = state.flow, d = f.data;
      if(photo){ return runImageSearch(photo, d); }
      text = (text || '').trim();
      // 追问轮：先处理确认 / 否定短路，其余按补充描述继续查
      if(f.stage === 'refine'){
        if(/^(都不是|不是我的|没有我的|算了|不对)$/.test(text) || /^(没有|没了|没有了|记不清|想不起来|不知道)$/.test(text)){

          endFlow(); return;
        }

      const pl = Store.resolvePlace(text); if(pl) d.place = pl.point;
      const wh = parseWhen(text); if(wh) d.when = wh;
      if(text) d.desc = (d.desc ? d.desc + ' ' : '') + text;

      if(tail){

        const hits = findCardsByTail(tail);
        if(hits.length === 1){
          const entry = hits[0]; d.entryId = entry.id;
          say('尾号 ' + tail + ' 对上了——' + entry.place + '捡到的' + entry.category + '，登记学号 ' + entry.studentId + '。你把卡面上的姓名念一下，学号姓名都对上才能给。');

      }
      // 证件类走精确路（确定性判定，不走相似度——保安.md §3.4）
      if(d.category && isCardCat(d.category)){

  claim: {

        if(pl) cands = cands.filter(i => i.placeId === pl.point.id);
        if(!cands.length){ say('库里没有对得上的。先去「找失物」里查查，或者报学号。'); endFlow(); return; }

          f.stage = 'verify_name'; return;
        }
        return enterOwnerConfirm(e.id);

        const e = Store.itemById(d.entryId);

        else { say(r.reason + '。这张卡不能给你——宁可让你再核一次，也不能把卡给错人。'); endFlow(); }

      // 当面确认：是不是失主本人的失物
      if(f.stage === 'confirm_owner'){
        text = (text || '').trim();
        if(/不是|不对|再看|再想|没有|算了/.test(text)){ holdItem(d.entryId); return; }

        text = (text || '').trim();
        if(/少了|不对|有问题|错了|不是这/.test(text)){ handoverProblem(d.entryId); return; }
        if(/拿到|谢谢|没问题|没事|可以了|好了|^好$|^是/.test(text)){ completeHandover(d.entryId); return; }
        say('当面点一下——拿到了、没问题就回「拿到了」；要是少了什么、东西不对，直接说。');
      }
    }
  }
};
function isCardLostAsk(){ return '校园卡、学生证这类，不靠「像不像」，只认「是不是你的」。报一下学号——或者拍张卡面照片，我认学号精确对。'; }
function nextIntakePlace(){ say('在哪儿捡到的？'); state.flow.stage = 'place'; }
async function finishIntake(d, hasPhoto){
  // 全走 Qwen：不再存 CLIP 向量，登记时把外观描述写进 desc，以图搜物走文字四维匹配
  const e = toolRegisterItem({ category: d.category, desc: d.desc, place: d.place, reporter: state.user.nickname, foundTime: d.foundTime });
  say(addr() + '入库了。编号 ' + e.id + '——' + e.category + '，在 ' + e.place + ' 捡到的，捡到时间 ' + fmtTime(e.foundTime) + '。失主来对，对得上才给。');
  // MAP: 入库条目按捡到地点打标记
  MapBridge.addPin({ placeId: e.placeId, label: e.place + ' · ' + e.category, type:'lost', ref: e.id });
  Store.memPush('登记捡到' + e.category + '（' + e.place + '）', 4);
  endFlow();
}
/* ---------- 找失物多轮追问：信息不全继续问，直到确认匹配或确认库里没有 ---------- */
function missingDims(d){
  const m = [];
  if(!d.category) m.push({ key:'category', label:'什么东西（水杯、雨伞、钥匙这类）' });
  if(!d.place) m.push({ key:'place', label:'在哪儿丢的' });
  if(!d.when) m.push({ key:'when', label:'大概什么时候丢的' });
  if((d.desc || '').trim().length < 4) m.push({ key:'desc', label:'长什么样——颜色、贴纸、牌子说两句' });
  return m;
}
function claimLine(){
  return '来保卫处值班点领——' + Store.agent.service_hours.start + '到' + Store.agent.service_hours.end + '有人。卡类的得学号姓名都对上才给。';
}
function showHitCards(hits, note){
  state.lastHits = hits;
  pushMsg({ who:'guard', kind:'cards', mode:'text', hits: hits.map(h => ({ id:h.it.id, s:h.s })), note });
  const b = hits[0].it;
  // MAP: 候选失物的捡到地点标到地图上（复现现实里「去保卫处认领」的动作）
  MapBridge.addPin({ placeId: b.placeId, label: b.place + ' · ' + b.category, type:'lost', ref: b.id });
  MapBridge.highlight(hits.map(h => h.it.placeId).filter(Boolean));
  MapBridge.setLayer('lost', hits.map(h => h.it.placeId).filter(Boolean));
}
function confirmNone(d, prefix){
  say((prefix || '') + '库里没有对得上的。别急——我把你说的记下来，有人交到保卫处，一查就能对上你。');
  Store.memPush('寻找' + (d.category || '失物') + '：' + (d.desc || '').slice(0, 30), 3);
  endFlow();
}
function evaluateSearch(d){
  const f = state.flow;
  d.rounds = (d.rounds || 0) + 1;
  const hits = toolMatchLostItem({ category: d.category || null, place: d.place || null, when: d.when || null, desc: d.desc || '' });
  const best = hits.length ? hits[0].s.total : 0;
  // ① 确认匹配：达到确认阈值，且信息足够佐证（有地点 / 时间 / 外观特征），才出结果收流程
  const enriched = !!(d.place || d.when || featureHits(d.desc || '').length);
  if(best >= CFG.thMatch && enriched){
    showHitCards(hits, '比对下来，最像的是这一条——' + (d.category ? '' : '（没听出类别，已全网搜）'));
    say(claimLine());
    Store.memPush('寻找' + (d.category || '失物') + '：' + (d.desc || '').slice(0, 30), 3);
    endFlow(); return;
  }
  // ② 类别已定且零命中：类别是硬筛选，库里压根没有这个类别的在库物品
  if(d.category && !hits.length){ confirmNone(d, '库里现在没登记着「' + d.category + '」这类的东西。'); return; }
  // ③ 相似但不达标：摆出来让玩家核对，继续追问
  if(hits.length && best >= CFG.thHedge){
    showHitCards(hits, '这几条有点像，但我不敢打包票——');
    d.showedHedge = true; f.stage = 'refine';
    const miss = missingDims(d).map(x => x.label).join('、');
    say('有没有对上的？回「是这条」我带你走认领；都不是就回「都不是」，或者再补点' + (miss ? '——' + miss : '特征') + '，我再帮你查。');
    return;
  }
  // ④ 信息不全：追问缺失的维度，同一个维度不重复问，不硬凑结果
  const miss = missingDims(d).filter(x => !(d.asked && d.asked[x.key]));
  if(miss.length && d.rounds < 4){
    d.asked = d.asked || {}; miss.forEach(x => d.asked[x.key] = 1);
    f.stage = 'refine';
    say((d.rounds > 1 ? '还是不太像。' : (hits.length ? '按你说的查了一轮，不太像。' : '库里暂时没查到像的。')) + '先补充一下：' + miss.map(x => x.label).join('、') + '。');
    return;
  }
  // ⑤ 信息齐了（或追问到位）仍对不上：确认库里没有，如实告知并记录
  confirmNone(d, '按你说的查了一遍又一遍——');
}
async function runImageSearch(photo, d, preVision){
  // 照片气泡已由 send() 统一推送，这里不再重复
  sys('正在拿照片比对库里物品……');
  const r = await toolMatchByImage({ image: photo, query: d, vision: preVision });
  if(r.mode === 'image'){
    sys('Qwen 看图：' + r.summary);
    state.lastHits = r.hits;
    pushMsg({ who:'guard', kind:'cards', mode:'image', hits: r.hits.map(h => ({ id:h.it.id, s:h.s })),
      note:'拿照片比出来了，最像的是这条——' });
    const b = r.hits[0].it;
    MapBridge.addPin({ placeId: b.placeId, label: b.place + ' · ' + b.category, type:'lost', ref: b.id });
    MapBridge.setLayer('lost', r.hits.map(h => h.it.placeId).filter(Boolean));
    say('看着像就来保卫处领。要是觉得不太对，再补两句文字描述，我再帮你查一遍。');
  } else if(r.mode === 'image_empty'){
    // 库里没有匹配物品——如实告知，不编造
    if(r.summary) sys('Qwen 看图：' + r.summary);
    say(r.reason + '。换个角度再拍一张，或者用文字说说——什么东西、在哪儿丢的、啥时候的事。');
  } else {
    if(r.reason === 'no_key') say(VISION_KEY_HINT);
    else say('图像识别这会儿连不上（' + (r.reason || '超时') + '）。先按文字帮你查——');
    if(r.hits.length && r.hits[0].s.total >= CFG.thHedge){
      showHitCards(r.hits, '按文字查出来的：');
      d.showedHedge = true;
      say('有没有对上的？回「是这条」或「都不是」，也可以再补点特征。');
    } else if(r.hits.length){
      say('查出来几条但都不太像。先补充一下：' + (missingDims(d).map(x => x.label).join('、') || '颜色、贴纸、牌子这类细节') + '，我再帮你查。');
    } else say('文字也没给够。什么东西、在哪儿丢的、啥时候的事、长什么样，随便补两样。');
  }
  // 以图搜物后流程不断线：后续文字并入同一轮多轮追问，直到确认匹配或确认库里没有
  if(state.flow){ state.flow.stage = 'refine'; if(r.mode === 'image') state.flow.data.showedHedge = true; }
}

/* ---------- 自由文本入口 ---------- */
async function handleText(text){
  // 流程中：先喂给流程（「取消」逃生口）
  if(state.flow){
    if(/^(取消|算了|不弄了|退出)$/.test(text)){ endFlow(); say(addr() + '行，不弄了。有事再找我。'); return; }
    await FLOWS[state.flow.type].handle(text, state.pendingPhoto);
    state.pendingPhoto = null;
    return;
  }
  const intent = classify(text);
  switch(intent){
    case 'call': doCall(); return;
    case 'greet': say(Store.agent.greeting); return;
    case 'my_records': {
      const mem = Store.memList();
      if(!mem.length){ say('之前没打过交道。丢东西、报修，说吧。'); return; }
      say('你之前的记录：\n' + mem.slice(0, 6).map(m => '· ' + m.desc + '（' + m.time + '）').join('\n'));
      return;
    }
    case 'repair_query': {
      const pl = Store.resolvePlace(text);
      const mine = toolQueryRepair({ place: pl ? pl.point.name : null, reporter: state.user.nickname });
      if(!mine.length){ say('没查到工单' + (pl ? '——' + pl.point.name + '这边没登记过' : '') + '。要是报过的话，说个地名我按地点查公开记录。'); return; }
      pushMsg({ who:'guard', kind:'orders', orders: mine.map(o => o.id),
        note:'工单状态在对话里就能查、能改——不用开后台。' });
      return;
    }
    case 'repair_status': {
      const done = /已经修好|修好了|不用修/.test(text);
      const pl = Store.resolvePlace(text) || null;
      const o = toolUpdateRepair({ place: pl ? pl.point.name : '', status: done ? '已完成' : '处理中' });
      if(!o){ say('手头没有没结的工单。说个地名我查查。'); return; }
      say('销了。' + o.id + '（' + o.place + '）→ ' + o.status + '。进度随时来问。');
      return;
    }
    case 'lost_intake': startFlow('lost_intake'); await FLOWS.lost_intake.handle(text); return;
    case 'claim': startFlow('claim'); await FLOWS.claim.handle(text); return;
    case 'lost_search': {
      startFlow('lost_search');
      // 触发句本身有实质信息（类别/地点/时间或足够长的描述）才喂给流程，否则只出开场白等玩家补充
      const meaningful = normCategory(text) || Store.resolvePlace(text) || parseWhen(text) || text.trim().length >= 6;
      if(meaningful) await FLOWS.lost_search.handle(text);
      return;
    }
    case 'repair_report': startFlow('repair'); await FLOWS.repair.handle(text); return;
    case 'door':
      say('门禁坏了按报修登记；补卡、开卡去一卡通中心。这俩都归值班窗口管。');
      return;
    case 'refuse': {
      // 推诿要推给对应角色，不能笼统推教务处（标准 §1.2 / 边界 §6.1）
      const routes = Store.agent.refuse_routes || {};
      let line = Store.agent.unknown_line;
      for(const [key, msg] of Object.entries(routes)){
        if(text.includes(key)){ line = msg; break; }
      }
      // 关键词兜底：食堂/好吃→阿姨，选课/教务/课程→学长
      if(line === Store.agent.unknown_line){
        if(/食堂|好吃|窗口|饭/.test(text)) line = routes['食堂评分'];
        else if(/选课|教务|课程|上课|老师/.test(text)) line = routes['选课'];
      }
      say(line); return;
    }
    case 'ask_way': say('问路、导航找向导小北——不归我这儿管。丢东西、报修，说吧。'); return;
    default:
      if(normCategory(text) || Store.resolvePlace(text)){ startFlow('lost_search'); await FLOWS.lost_search.handle(text); return; }
      say('没听明白。丢东西、找东西、报修——就这三样，说吧。');
  }
}

// 图片 + 文字组合检索：流程中喂流程，自由态走以图搜物（文字辅助）
async function handlePhotoWithText(b64, text){
  if(state.flow){
    state.pendingPhoto = b64;
    await FLOWS[state.flow.type].handle(text, b64);
    state.pendingPhoto = null;
    return;
  }
  // 自由态：Qwen 识别一次——证件类转精确路，其余连同识别结果直接走以图搜物（一张照片只打一次 Qwen）
  sys('正在看这张照片……');
  let top = null, preVision = null;
  try{
    const v = await visionRecognize(b64, 'item');
    preVision = v;
    const dd = v.data || {};
    const nc = dd.category ? normCategory(dd.category) : null;
    if(nc && isCardCat(nc.cat)) top = { label: nc.cat };
    else if(isCardCat(dd.category || '')) top = { label: dd.category };
  }catch(e){ /* Qwen 不可用时不阻塞，runImageSearch 内部会再试并给出 no_key/降级提示 */ }
  if(top){
    state.flow = { type:'photo_route', stage:'route', data:{ image: b64 } };
    if(text){ await FLOWS.photo_route.handle(text); return; }
    say('看着是证件（' + top.label + '）。是找卡还是登记捡到的卡？回「找卡」或「登记」。');
    return;
  }
  await runImageSearch(b64, parseQueryFromText(text), preVision);
}
// 把自然语言文字解析成以图搜物的 query（类别/地点/时间/描述）——照片维由 Qwen 看转出的外观描述承担，文字提供类别/地点/时间
function parseQueryFromText(text){
  if(!text) return {};
  const d = {};
  const cat = normCategory(text); if(cat) d.category = cat.cat;
  const pl = Store.resolvePlace(text); if(pl) d.place = pl.point.name;
  const wh = parseWhen(text); if(wh) d.when = wh;
  d.desc = text;
  return d;
}
async function onPhoto(file){
  const dataURL = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const img = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = dataURL; });
  const k = Math.min(1, 512 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const b64 = c.toDataURL('image/jpeg', 0.85);
  state.idleCount = 0;
  showDraft(b64);
}

 * ============================================================ */
const API = {
  base: location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '',
  token: null,
  async req(path, opts = {}){
    const r = await fetch(this.base + path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type':'application/json', ...(this.token ? { Authorization:'Bearer ' + this.token } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if(!r.ok) throw Object.assign(new Error(data.detail || ('HTTP ' + r.status)), { status: r.status });
    return data;
  }
};

  localStorage.setItem(Store.key('auth'), JSON.stringify(auth));
  $('#login-view').classList.add('hidden');
  $('#chat-view').classList.remove('hidden');
  loadChat();
  renderAll(); updateStatus(); updateFlowHint();
  initMascot();   // 老丁立绘 + 场景气泡 + 右上小挂件（登录后挂一次）
  if(!state.msgs.length){
    pushMsg({ who:'guard', kind:'text', text: addr() + Store.agent.greeting }, false);
    saveChat();
  }
  // MAP: 玩家进入保卫处触发圈（地图层接入后由 on('enter') 驱动）
  MapBridge.on('enter', { placeId:'baoweichu' });
}
function logout(){
  localStorage.removeItem(Store.key('auth'));
  location.reload();
}

/* ============================================================
 * 启动
 * ============================================================ */
(async function init(){
  drawSprite($('#login-sprite'), 7);
  drawSprite($('#hd-sprite'), 2);
  await Store.init();
  // 恢复会话
  try{
    const saved = JSON.parse(localStorage.getItem(Store.key('auth')) || 'null');
    if(saved && saved.token){
      API.token = saved.token;
      const meInfo = await API.req('/api/me');
      enterChat({ ...saved, ...meInfo });
      return;
    }
  }catch(e){ localStorage.removeItem(Store.key('auth')); }
  checkHealth();
  updateStatus();
  setInterval(updateStatus, 15000);
  // 空闲自语（附录 F ③：最便宜的「活着」信号，模板填充不调 LLM，每天 ≤ dailyBudget 条）
  setInterval(() => {
    if(!state.user || Date.now() - state.lastMsgAt < 45000 || state.idleCount >= (Store.agent.dailyBudget || 2)) return;
    state.idleCount++;
    const n = Store.lost.filter(i => i.status === 'in_storage').length;
    const m = Store.orders.filter(o => o.status !== '已完成').length;
    say('库里还压着 ' + n + ' 件没人领，' + m + ' 张工单没销。有事说吧。');
  }, 45000);
})();

/* ---------- 事件绑定 ---------- */
$('#tab-login').onclick = () => { $('#tab-login').classList.add('on'); $('#tab-reg').classList.remove('on'); checkHealth(); };
$('#tab-reg').onclick   = () => { $('#tab-reg').classList.add('on'); $('#tab-login').classList.remove('on'); checkHealth(); };
$('#li-submit').onclick = submitAuth;
$('#li-pass').addEventListener('keydown', e => { if(e.key === 'Enter') submitAuth(); });
$('#li-nick').addEventListener('keydown', e => { if(e.key === 'Enter') $('#li-pass').focus(); });
$('#btn-send').onclick = onSend;
$('#inp').addEventListener('keydown', e => { if(e.key === 'Enter') onSend(); });
$('#btn-photo').onclick = () => $('#file-in').click();
$('#file-in').addEventListener('change', e => { if(e.target.files[0]) onPhoto(e.target.files[0]); e.target.value = ''; });
document.addEventListener('paste', e => { for(const it of (e.clipboardData ? e.clipboardData.items : [])){ if(it.type.startsWith('image/')){ onPhoto(it.getAsFile()); break; } } });
document.querySelectorAll('.qa').forEach(b => {
  b.onclick = () => {
    state.idleCount = 0;
    const act = b.dataset.act;
    if(act === 'call') return doCall();
    me(b.textContent);
    if(state.flow) endFlow();
    if(act === 'claim'){ startFlow('claim'); updateFlowHint(); return; }
    startFlow(act);
    updateFlowHint();
  }
});
$('#btn-logout').onclick = logout;
$('#btn-reset').onclick = () => {
  if(!confirm('清空本地公共层数据（失物库 / 工单库）并重新播种？')) return;
  Store.reset(); location.reload();
};
$('#clock').onclick = () => {
  const v = prompt('演示拨时间（HH:mm，留空恢复真实时间）', '');
  if(v === null) return;
  const m = v.trim().match(/^(\d{1,2})[:：](\d{2})$/);
  if(m){ timeOverride = { h:+m[1], m:+m[2] }; sys('时间已拨到 ' + v + '（仅影响应答时段判断）。'); }
  else { timeOverride = null; sys('时间恢复真实。'); }
  updateStatus();
};
</script>
</body>
